<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHÉ AT · Atas e Colegiados · PROPPEX / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
  :root{
    --brand:#1c3742; --brand-2:#2d535c; --brand-3:#40717e; --accent:#71c8e2;
    --bg:#ebeef3; --card:#fff; --line:#e3e7ee; --line-2:#f0f2f6; --trilho:#eef1f5;
    --ink:#1c3742; --ink-soft:#3a4650; --muted:#7c8794; --muted-2:#a9b4c0;
    --ok:#3f8a5d; --ok-soft:#e5f3ea; --warn:#c98a2b; --warn-soft:#fbf3e4;
    --err:#a1524c; --err-soft:#f6e9e7; --info:#40717e; --info-soft:#e8f4fa;
    --roxo:#5e5091; --roxo-soft:#ecebf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-3);text-decoration:none}
  a:hover{color:var(--brand-2)}
  ::selection{background:var(--accent);color:var(--brand)}
  button{font-family:Figtree,system-ui,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
  .f-disp{font-family:Sora,sans-serif}

  /* ------------------------------- casca -------------------------------- */
  .app{display:flex;min-height:100vh}
  .side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side-marca{padding:20px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
  .side-marca b{color:var(--accent);font-weight:800}
  .side-nav{padding:14px 12px;flex:1;overflow-y:auto}
  .side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:8px 12px 6px}
  .side-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
    margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
    border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
    transition:background .15s,color .15s}
  .side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
  .side-item svg{flex:none}
  .side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
  .side-pe .av{width:34px;height:34px;border-radius:50%;background:var(--brand-3);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
  .side-pe .av img{width:100%;height:100%;object-fit:cover}
  .side-pe .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
  .side-pe .pp{font-size:11px;color:rgba(255,255,255,.5)}
  .side-pe .sair{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-weight:600}
  .side-pe .sair:hover{color:#fff}

  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .topbar .dir{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .area{padding:28px 32px;flex:1}
  .limite{max-width:1180px}
  h1{font-family:Sora,sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}

  /* ------------------------------- cartões ------------------------------ */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}
  .card-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;margin-bottom:2px}
  .card-s{font-size:12px;color:var(--muted);margin-bottom:20px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .kpi .v{font-family:Sora,sans-serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:7px;color:var(--muted)}
  .duplo{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.duplo{grid-template-columns:1fr}}
  .barra{margin-bottom:15px}
  .barra .cab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
  .barra .cab span:first-child{color:var(--ink-soft);font-weight:500}
  .barra .cab span:last-child{color:var(--muted);font-weight:600}
  .barra .tr{height:9px;background:var(--trilho);border-radius:5px;overflow:hidden}
  .barra .tr i{display:block;height:100%;border-radius:5px}
  .linha{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .linha:last-child{border-bottom:0}
  .linha .txt{flex:1;min-width:0}
  .linha .p1{font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .linha .p2{font-size:11.5px;color:var(--muted)}
  .ponto{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
  .vazio{font-size:13px;color:var(--muted);padding:10px 0}
  .verTodas{font-size:12px;font-weight:600;color:var(--brand-3);background:none;border:0;cursor:pointer}

  /* ------------------------------ formulários --------------------------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;border:1px solid #cfd6de;border-radius:8px;padding:10px 12px;
    font-family:Figtree,system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{min-height:84px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(64,113,126,.12)}
  .sec-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:22px 0 6px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .muted{color:var(--muted);font-size:12.5px;font-weight:400}
  .kv{margin:4px 0;font-size:13.5px;color:var(--ink-soft)}
  .kv b{color:var(--ink);font-weight:600}

  /* -------------------------------- botões ------------------------------ */
  .bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bt-pri{background:var(--brand);color:#fff}
  .bt-pri:hover{background:var(--brand-2)}
  .bt-sec{background:var(--info-soft);color:var(--brand);border-color:#cfe6f2}
  .bt-sec:hover{background:#dbeef8}
  .bt-ghost{background:#fff;color:var(--muted);border-color:#cfd6de}
  .bt-ghost:hover{color:var(--ink);border-color:var(--brand-3)}
  .bt-ok{background:var(--ok-soft);color:var(--ok);border-color:#cfeeda}
  .bt-warn{background:var(--warn-soft);color:var(--warn);border-color:#f0e0bd}
  .bt-err{background:var(--err-soft);color:var(--err);border-color:#eed6d3}
  .bt:disabled{opacity:.5;cursor:not-allowed}
  .exp{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

  /* ------------------------------- estados ------------------------------ */
  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .b-submetida{background:var(--info-soft);color:var(--info)}
  .b-devolvida{background:var(--err-soft);color:var(--err)}
  .b-aprovada{background:var(--ok-soft);color:var(--ok)}
  .b-pendente{background:var(--warn-soft);color:var(--warn)}
  .b-relatorio-entregue{background:var(--roxo-soft);color:var(--roxo)}
  .b-registrada{background:#eceff3;color:var(--muted)}
  .banner{border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500}
  .ba-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0e0bd}
  .ba-err{background:var(--err-soft);color:var(--err);border:1px solid #eed6d3}
  .ba-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #cfeeda}

  /* -------------------------------- listas ------------------------------ */
  .item{display:flex;align-items:center;gap:14px;padding:15px 18px;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .item:hover{border-color:var(--brand-3);box-shadow:0 2px 10px -4px rgba(28,55,66,.18)}
  .item .nm{font-weight:600;flex:1;min-width:0;font-size:14px;color:var(--ink)}
  .item .cs{color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px}
  .stat .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .s b{font-family:Sora,sans-serif;font-size:22px;display:block;color:var(--ink);line-height:1.1}
  .stat .s span{font-size:11.5px;color:var(--muted)}
  table.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.pt th{background:#f7f9fb;color:var(--muted);padding:9px 10px;text-align:left;font-size:11.5px;
    font-weight:600;border-bottom:1px solid var(--line)}
  table.pt td{border-bottom:1px solid var(--line-2);padding:8px 10px;color:var(--ink-soft)}
  table.pt td.bad{color:var(--err);font-weight:600}
  table.pt .rm{color:var(--err);cursor:pointer;font-weight:700}
  table.pt a{color:var(--brand-3);font-weight:600}
  .cnt{font-size:12.5px;color:var(--muted);margin:8px 0}
  .colmap{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .colmap select{width:auto;font-size:12.5px;padding:6px 8px}
  .tut{background:var(--info-soft);border:1px solid #cfe6f2;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px}
  .tut summary{font-family:Sora,sans-serif;font-weight:700;color:var(--brand);cursor:pointer;font-size:13.5px}
  .tut ol{margin:10px 0 4px 20px}
  .tut li{margin-bottom:5px}
  .tut .dica{background:#fff;border-radius:8px;padding:9px 12px;margin-top:8px;border:1px dashed #a9cfe0}
  .hide{display:none!important}

  @media(max-width:760px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .side-nav{padding:8px 10px;flex:1 1 100%;order:3;overflow-x:auto}
    .side-nav #menu{display:flex;gap:6px}
    .side-lab{display:none}
    .side-item{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px}
    .side-item.on{border-left:0;border-bottom-color:var(--accent)}
    .side-pe{border-top:0;margin-left:auto}
    .area{padding:20px 16px}
    .kpis{grid-template-columns:repeat(2,1fr)}
  }
</style>
<style>
  /* ------------------------- específico do ARCHÉ AT ---------------------- */

  .b-minuta{background:var(--info-soft);color:var(--info)}
  .b-registrada{background:var(--ok-soft);color:var(--ok)}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .filtros select,.filtros input{width:auto;min-width:150px;font-size:13px;padding:8px 10px}
  .ponto-pauta{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;background:#fcfdfe}
  .ponto-pauta .cabeca{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .ponto-pauta .num{font-family:Sora,sans-serif;font-weight:700;font-size:13px;color:var(--brand-3);flex:none}
  .ponto-pauta .rm{margin-left:auto;background:none;border:0;color:var(--err);cursor:pointer;font-size:12px;font-weight:600}
  .ponto-pauta label{margin-top:10px}
  .votos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-top:12px}
  .chk input{width:auto;margin:0}
  table.pt td input,table.pt td select{padding:6px 8px;font-size:12.5px;border-radius:6px}
  table.pt td.acao{width:36px;text-align:center}
  .minuta{width:100%;min-height:420px;font-family:'Iowan Old Style',Georgia,serif;font-size:14.5px;line-height:1.75;
    padding:22px 26px;border-radius:10px;border:1px solid var(--line);background:#fff}
  .barra-acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}

    background:#fff;border:1px solid var(--line);border-right:0;text-align:center}

  .hist{font-size:12px;color:var(--muted);line-height:1.9}
  .hist b{color:var(--ink-soft);font-weight:600}
  .e-em-dia{background:var(--ok-soft);color:var(--ok)}
  .e-pendente{background:var(--info-soft);color:var(--info)}

  .grupo-mom{margin-bottom:16px}
  .grupo-t{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;color:var(--muted);font-weight:600}
  .chk-pauta{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
  .chk-pauta:hover{border-color:var(--brand-3)}
  .chk-pauta.on{border-color:var(--ok);background:#f6fbf8}
  .chk-pauta.feita{background:#f6fbf8;border-color:#cfeeda}
  .chk-pauta.feita .tt{color:var(--ink-soft)}
  .ok-orgao{width:18px;height:18px;border-radius:5px;background:var(--ok);color:#fff;flex:none;
    display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
  .de-novo{background:none;border:0;color:var(--brand-3);font-size:11.5px;font-weight:600;

  .chk-pauta input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--brand)}

  .chk-pauta .md{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
  .chk-pauta .ev{display:block;font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
  .chk-pauta.on .ev{color:var(--ink-soft)}
  .doc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
  .doc:last-child{border-bottom:0}
  .doc .ic{width:34px;height:34px;border-radius:9px;background:var(--info-soft);display:grid;place-items:center;flex:none;font-size:16px}
  .doc .txt{flex:1;min-width:0}
  .doc .t1{font-size:13.5px;font-weight:600;color:var(--ink)}
  .doc .t2{font-size:11.5px;color:var(--muted);margin-top:1px}

    border-radius:10px;padding:12px 14px;margin-bottom:8px;background:#fff}

  .al .tt{font-size:13.5px;font-weight:600;color:var(--ink)}
  .al .de{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5}
  .al .ac{font-size:11.5px;color:var(--muted);margin-top:4px}
  .al .tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;
    padding:2px 7px;background:#eef1f5;color:var(--muted);white-space:nowrap}
  .resp{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .resp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;
    font-size:13.5px;font-weight:600;color:var(--ink);background:#fbfcfd}
  .resp>summary::-webkit-details-marker{display:none}
  .resp>summary:hover{background:#f3f6f9}
  .resp .corpo{padding:10px 14px 4px}
  .pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px}
  .p-alta{background:var(--err-soft);color:var(--err)}
  .p-media{background:var(--warn-soft);color:var(--warn)}
  .p-baixa{background:#eef1f5;color:var(--muted)}
  .pauta-item{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;background:#fff}
  .pauta-item.em-dia{border-left-color:var(--ok)}
  .pauta-item.pendente{border-left-color:var(--info)}
  .pauta-item.vencendo{border-left-color:var(--warn)}
  .pauta-item.nunca{border-left-color:var(--err)}
  .pauta-item .tt{font-weight:600;font-size:14px;color:var(--ink);margin-bottom:3px}
  .pauta-item .md{font-size:12px;color:var(--muted);line-height:1.6}
  .pauta-item .porque{font-size:12.5px;color:var(--ink-soft);background:#f7f9fb;border-radius:8px;
    padding:9px 12px;margin-top:9px;line-height:1.55}
  .ref{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;font-weight:600;
    background:var(--accent-wash,#e6f5fa);color:var(--brand);border-radius:5px;padding:2px 7px;margin:3px 4px 0 0}
  .matriz{width:100%;border-collapse:collapse;font-size:12px}
  .matriz th{background:#f7f9fb;color:var(--muted);padding:8px 6px;font-size:10.5px;font-weight:600;
    border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  .matriz th.esq{text-align:left;min-width:250px;position:sticky;left:0;background:#f7f9fb;z-index:1}
  .matriz td{border-bottom:1px solid var(--line-2);padding:6px;text-align:center}
  .matriz td.esq{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
  .rolagem{overflow-x:auto;margin:0 -6px;padding:0 6px}
  .bolinha{display:inline-block;width:15px;height:15px;border-radius:5px}
  .lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 0 4px}
  .lg span{display:flex;align-items:center;gap:6px}
  /* itens de grade não podem ser mais largos que a coluna: sem isto, um
     título longo com white-space:nowrap estoura a página no celular */
  .duplo>*,.kpis>*,.stat>*,.grid2>*,.grid3>*{min-width:0}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <a class="side-marca" href="/" title="Voltar ao portal">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 37 L8 20 A12 12 0 0 1 32 20 L32 37" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4" fill="#71c8e2"/></svg>
      <span>ARCHÉ <b>AT</b></span>
    </a>
    <div class="side-nav">
      <div class="side-lab">COLEGIADOS</div>
      <div id="menu"></div>
    </div>
    <div class="side-pe" id="rodape-usuario"></div>
  </nav>

  <div class="conteudo">
    <div class="topbar">
      <div class="crumb">ARCHÉ AT <span style="color:var(--muted-2)">/</span> <b id="crumb">Painel</b></div>
      <div class="dir"><span id="dir-info"></span></div>
    </div>

    <div class="area">
      <div class="limite">
        <h1 id="titulo">Painel</h1>
        <div class="sub" id="subtitulo">Atas das reuniões dos órgãos colegiados.</div>
        <div id="aviso"></div>

        <section id="v-painel" class="hide"></section>
        <section id="v-nova" class="hide"></section>
        <section id="v-arquivo" class="hide"></section>
        <section id="v-encaminhamentos" class="hide"></section>
        <section id="v-regulatoria" class="hide"></section>
        <section id="v-conformidade" class="hide"></section>
        <section id="v-ata" class="hide"></section>
      </div>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   ARCHÉ AT — Atas e Colegiados.
   Fluxo: abrir reunião → registrar presenças e pauta → gerar a minuta →
   revisar → aprovar → registrar (PDF + e-mail + arquivo no Drive).
   ====================================================================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtD = (iso) => (iso ? String(iso).split("-").reverse().join("/") : "—");
const fmtDH = (iso) => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "—"; };
const hojeISO = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date());

let META = { orgaos: [], cursos: [], status: [], gestao: false, eu: "", ia: "modelo" };
let LISTA = [], ENCS = [], ATUAL = null, PODE_EDITAR = true, ME = null;
let SECAO = "painel";

const ROTULO_STATUS = { rascunho: "Rascunho", minuta: "Minuta", registrada: "Registrada" };
const PASSOS = ["rascunho", "minuta", "registrada"];

const SECOES = [
  { id: "painel", rot: "Painel", ic: '<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>' },
  { id: "nova", rot: "Nova reunião", ic: '<path d="M12 5v14M5 12h14"/>' },
  { id: "arquivo", rot: "Arquivo de atas", ic: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/>' },
  { id: "regulatoria", rot: "Pauta regulatória", ic: '<path d="M9 2h6a2 2 0 0 1 2 2v2h2a1 1 0 0 1 1 1v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a1 1 0 0 1 1-1h2V4a2 2 0 0 1 2-2z"/><path d="M9 13l2 2 4-4"/>' },
  { id: "conformidade", rot: "Acompanhamento", ic: '<path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/>', gestao: true },
  { id: "encaminhamentos", rot: "Encaminhamentos", ic: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
  { id: "acessos", rot: "Gestão de acessos", ic: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>', gestor: true },
];

function montarSidebar() {
  $("menu").innerHTML = SECOES
    .filter((s) => (!s.gestor || (ME && ME.papel === "gestor")) && (!s.gestao || META.gestao))
    .map((s) => `<button class="side-item" data-s="${s.id}" onclick="nav('${s.id}')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${s.ic}</svg>
      ${s.rot}</button>`).join("");

  const ini = (ME?.nome || ME?.email || "?").trim()[0]?.toUpperCase() || "?";
  const foto = ME?.perfil?.foto;
  $("rodape-usuario").innerHTML = ME ? `
    <a class="av" href="/perfil/" title="Meu perfil">${foto ? `<img src="${esc(foto)}" alt="">` : esc(ini)}</a>
    <div style="min-width:0">
      <div class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((ME.nome || ME.email).split(" ").slice(0, 2).join(" "))}</div>
      <div class="pp">${META.gestao ? "gestão" : "docente"}</div>
    </div>
    <button class="sair" onclick="sair()">sair</button>` : "";
}

function nav(secao, id) {
  SECAO = secao;
  for (const b of document.querySelectorAll(".side-item")) b.classList.toggle("on", b.dataset.s === secao);
  for (const v of ["painel", "nova", "arquivo", "encaminhamentos", "regulatoria", "conformidade", "ata"]) $("v-" + v).classList.add("hide");
  // "nova" e "ata" usam o mesmo editor (mesmos ids): a seção que sai do ar é
  // esvaziada, senão getElementById passa a devolver os campos escondidos.
  for (const v of ["nova", "ata"]) if (v !== secao) $("v-" + v).innerHTML = "";

  if (secao === "acessos") { location.href = "/usuarios/"; return; }
  const titulos = {
    painel: ["Painel", "Situação das atas dos órgãos colegiados."],
    nova: ["Nova reunião", "Registre a sessão; a minuta é redigida a partir destes campos."],
    arquivo: ["Arquivo de atas", "Todas as atas a que você tem acesso."],
    encaminhamentos: ["Encaminhamentos", "Tarefas deliberadas em sessão, com responsável e prazo."],
    regulatoria: ["Pauta regulatória", "Temas que os instrumentos do INEP/MEC esperam ver debatidos e registrados em ata."],
    conformidade: ["Acompanhamento da PROPPEX", "Quais cursos e órgãos estão cumprindo a pauta regulatória."],
    ata: ["Ata", ""],
  };
  const [t, s] = titulos[secao] || ["", ""];
  $("titulo").textContent = t; $("subtitulo").textContent = s; $("crumb").textContent = t;
  $("aviso").innerHTML = "";

  if (secao === "painel") { renderPainel(); $("v-painel").classList.remove("hide"); }
  if (secao === "nova") { ATUAL = novaAta(); PODE_EDITAR = true; renderEditor("v-nova"); $("v-nova").classList.remove("hide"); }
  if (secao === "arquivo") { renderArquivo(); $("v-arquivo").classList.remove("hide"); }
  if (secao === "encaminhamentos") { renderEncaminhamentos(); $("v-encaminhamentos").classList.remove("hide"); }
  if (secao === "regulatoria") { renderRegulatoria(); $("v-regulatoria").classList.remove("hide"); }
  if (secao === "conformidade") { renderConformidade(); $("v-conformidade").classList.remove("hide"); }
  if (secao === "ata") { $("v-ata").classList.remove("hide"); }
  window.scrollTo(0, 0);
}

/* ------------------------------- dados --------------------------------- */
async function api(url, opcoes) {
  const r = await fetch(url, opcoes);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Falha (${r.status})`);
  return j;
}
async function carregar() {
  const d = await api("/api/atas");
  LISTA = d.atas || []; ENCS = d.encaminhamentos || []; META.gestao = d.gestao;
}

function novaAta() {
  return {
    id: null, orgao: "", orgaoNome: "", curso: "", numero: null, status: "rascunho",
    sessao: { tipo: "ordinária", data: hojeISO(), horaInicio: "", horaFim: "", local: "", modalidade: "presencial", convocacao: "" },
    presidencia: { nome: "", cargo: "" },
    secretaria: { nome: ME?.perfil?.nome || ME?.nome || "", email: ME?.email || "" },
    participantes: [], pauta: [{ titulo: "", discussao: "", deliberacao: "", votacao: { houve: false, favor: 0, contra: 0, abstencoes: 0 }, encaminhamento: { acao: "", responsavel: "", prazo: "" } }],
    informes: "", observacoes: "", texto: "", historico: [],
  };
}

/* ------------------------------- painel -------------------------------- */
function renderPainel() {
  const total = LISTA.length;
  const porStatus = (s) => LISTA.filter((a) => a.status === s).length;
  const atrasados = ENCS.filter((e) => e.atrasado).length;
  const orgaos = new Set(LISTA.map((a) => a.orgao + "/" + (a.curso || ""))).size;
  const ano = new Date().getFullYear();
  const doAno = LISTA.filter((a) => Number(a.ano) === ano).length;

  const kpi = (l, v, d, cor) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>
    <div class="d" ${cor ? `style="color:${cor}"` : ""}>${d}</div></div>`;

  const recentes = LISTA.slice(0, 6).map((a) => `<div class="linha" onclick="abrir('${a.id}')" style="cursor:pointer">
      <div class="ponto" style="background:${corStatus(a.status)}"></div>
      <div class="txt"><div class="p1">${esc(a.numero || "sem número")} · ${esc(a.titulo)}</div>
      <div class="p2">${fmtD(a.sessao?.data)} · ${a.pontos} ponto(s) · ${a.participantes} participante(s)</div></div>
      <span class="badge b-${a.status}">${ROTULO_STATUS[a.status] || a.status}</span></div>`).join("")
    || '<div class="vazio">Nenhuma ata registrada ainda.</div>';

  const fila = LISTA.filter((a) => a.status !== "registrada").slice(0, 6).map((a) => {
    const oQue = { rascunho: "completar a pauta e gerar a minuta", minuta: "revisar o texto e registrar" }[a.status] || "";
    return `<div class="linha" onclick="abrir('${a.id}')" style="cursor:pointer">
      <div class="ponto" style="background:${corStatus(a.status)}"></div>
      <div class="txt"><div class="p1">${esc(a.titulo)} · ${fmtD(a.sessao?.data)}</div><div class="p2">${oQue}</div></div>
      <span class="badge b-${a.status}">${ROTULO_STATUS[a.status]}</span></div>`;
  }).join("") || '<div class="vazio">Nada pendente. 🎉</div>';

  const prazos = ENCS.slice().sort((a, b) => String(a.prazo).localeCompare(String(b.prazo))).slice(0, 6)
    .map((e) => `<div class="linha"><div class="ponto" style="background:${e.atrasado ? "var(--err)" : "var(--ok)"}"></div>
      <div class="txt"><div class="p1">${esc(e.acao)}</div>
      <div class="p2">${esc(e.responsavel || "sem responsável")} · ${esc(e.orgao)}</div></div>
      <span class="badge b-registrada" style="${e.atrasado ? "background:var(--err-soft);color:var(--err)" : ""}">${fmtD(e.prazo)}</span></div>`).join("")
    || '<div class="vazio">Nenhum encaminhamento com prazo.</div>';

  const barras = META.orgaos.map((o) => {
    const n = LISTA.filter((a) => a.orgao === o.codigo).length;
    return { rot: o.sigla, n };
  }).filter((x) => x.n).sort((a, b) => b.n - a.n);
  const maxN = Math.max(1, ...barras.map((b) => b.n));
  const barrasHtml = barras.map((b) => `<div class="barra"><div class="cab"><span>${esc(b.rot)}</span><span>${b.n}</span></div>
      <div class="tr"><i style="width:${(b.n / maxN) * 100}%;background:var(--brand-3)"></i></div></div>`).join("")
    || '<div class="vazio">Sem atas para distribuir.</div>';

  $("v-painel").innerHTML = `
    ${META.gestao ? '<div class="card" id="painel-alertas"><div class="card-t">Alertas de regularização</div>'
      + '<div class="card-s">Carregando…</div></div>' : ""}
    <div class="kpis">
      ${kpi("Atas no sistema", total, `${doAno} em ${ano}`)}
      ${kpi("Registradas", porStatus("registrada"), "documento fechado", "var(--ok)")}
      ${kpi("Em elaboração", porStatus("rascunho") + porStatus("minuta"), "ainda sem registro", "var(--warn)")}
      ${kpi("Encaminhamentos", ENCS.length, `${atrasados} em atraso`, atrasados ? "var(--err)" : "var(--muted)")}
      ${kpi("Órgãos ativos", orgaos, "com ata no sistema")}
    </div>
    <div class="duplo">
      <div class="card"><div class="card-t">O que fazer agora</div>
        <div class="card-s">Atas que ainda não foram registradas.</div>${fila}</div>
      <div class="card"><div class="card-t">Atas por órgão</div>
        <div class="card-s">Distribuição no arquivo.</div>${barrasHtml}</div>
    </div>
    <div class="duplo">
      <div class="card"><div class="card-t">Últimas sessões</div>
        <div class="card-s">Por data da reunião.</div>${recentes}</div>
      <div class="card"><div class="card-t">Prazos de encaminhamento</div>
        <div class="card-s">Tarefas deliberadas em sessão.</div>${prazos}</div>
    </div>
    <div class="card">
      <div class="card-t">Como funciona</div>
      <div class="card-s">Do registro da reunião ao arquivo. A ata registrada continua corrigível —
        basta gerar o PDF de novo depois da correção.</div>
      <div class="passos">
        <div class="p feito">1 · Abrir a reunião</div><div class="p feito">2 · Presenças e pauta</div>
        <div class="p feito">3 · Gerar a minuta</div><div class="p feito">4 · Revisar o texto</div>
        <div class="p feito">5 · Registrar e arquivar</div>
      </div>
      <div class="kv">A minuta é redigida ${META.ia === "modelo" ? "pelo gerador do ARCHÉ" : `por IA (${esc(META.ia)})`}
        a partir dos campos preenchidos e <b>sempre volta para revisão humana</b> antes de a ata ser registrada.</div>
      ${META.ia !== "modelo" ? `<div class="kv" style="color:var(--muted);font-size:12.5px">
        Ao gerar a minuta ou usar o assistente de escrita, o conteúdo dos campos é enviado
        ao provedor de IA (${esc(META.ia)}) para processamento. Registre em ata apenas o que
        pode circular fora da instituição.</div>` : ""}
      <div class="exp"><button class="bt bt-pri" onclick="nav('nova')">＋ Abrir nova reunião</button></div>
    </div>`;
  if (META.gestao) carregarAlertasDoPainel();
}

// O painel da gestão abre com o que está devendo — é o primeiro que a PROPPEX vê.
async function carregarAlertasDoPainel() {
  const el = $("painel-alertas");
  if (!el) return;
  try {
    const d = await api("/api/atas/alertas");
    el.innerHTML = `<div class="card-t">Alertas de regularização · ${esc(d.resumo.janela)}</div>
      <div class="card-s">Órgãos e cursos fora de dia. A cobrança é da PROPPEX — o sistema só aponta.</div>
      ${blocoAlertas(d, { limite: 6 })}`;
  } catch {
    el.classList.add("hide");
  }
}
const corStatus = (s) => ({ rascunho: "#a9b4c0", minuta: "var(--info)", registrada: "var(--ok)" }[s] || "var(--muted)");

/* ------------------------------- arquivo ------------------------------- */
let FILTRO = { orgao: "", curso: "", ano: "", status: "", q: "" };
function renderArquivo() {
  const anos = [...new Set(LISTA.map((a) => a.ano).filter(Boolean))].sort((a, b) => b - a);
  const opc = (v, l, sel) => `<option value="${esc(v)}" ${sel === v ? "selected" : ""}>${esc(l)}</option>`;

  const f = LISTA.filter((a) =>
    (!FILTRO.orgao || a.orgao === FILTRO.orgao) &&
    (!FILTRO.curso || a.curso === FILTRO.curso) &&
    (!FILTRO.ano || String(a.ano) === FILTRO.ano) &&
    (!FILTRO.status || a.status === FILTRO.status) &&
    (!FILTRO.q || `${a.numero || ""} ${a.titulo} ${a.presidencia?.nome || ""} ${a.secretaria?.nome || ""}`
      .toLowerCase().includes(FILTRO.q.toLowerCase())));

  $("v-arquivo").innerHTML = `
    <div class="filtros">
      <select onchange="filtrar('orgao',this.value)">${opc("", "Todos os órgãos", FILTRO.orgao)}
        ${META.orgaos.map((o) => opc(o.codigo, o.nome, FILTRO.orgao)).join("")}</select>
      <select onchange="filtrar('curso',this.value)">${opc("", "Todos os cursos", FILTRO.curso)}
        ${META.cursos.map((c) => opc(c.slug, c.nome, FILTRO.curso)).join("")}</select>
      <select onchange="filtrar('ano',this.value)">${opc("", "Todos os anos", FILTRO.ano)}
        ${anos.map((a) => opc(String(a), String(a), FILTRO.ano)).join("")}</select>
      <select onchange="filtrar('status',this.value)">${opc("", "Todas as situações", FILTRO.status)}
        ${META.status.map((s) => opc(s, ROTULO_STATUS[s] || s, FILTRO.status)).join("")}</select>
      <input placeholder="Buscar por número, órgão ou nome…" value="${esc(FILTRO.q)}" oninput="filtrar('q',this.value)">
      <button class="bt bt-pri" onclick="nav('nova')">＋ Nova reunião</button>
    </div>
    <div class="cnt">${f.length} ata(s) de ${LISTA.length}.
      ${META.gestao
        ? "Como gestão, você vê as atas de todos os órgãos."
        : "Você vê aqui as atas que registrou; a PROPPEX acompanha as de todos."}</div>
    ${f.map((a) => `<div class="item" onclick="abrir('${a.id}')">
        <div class="nm">${esc(a.numero || "— sem número —")}
          <div class="cs">${esc(a.titulo)} · sessão ${esc(a.sessao?.tipo || "")} de ${fmtD(a.sessao?.data)}
            · ${a.participantes} participante(s) · ${a.pontos} ponto(s)</div></div>
        ${a.anexos ? `<span class="badge e-fora-da-janela" title="documentos anexos">📎 ${a.anexos}</span>` : ""}
        <span class="badge b-${a.status}">${ROTULO_STATUS[a.status] || a.status}</span>
      </div>`).join("") || '<div class="card"><div class="vazio">Nenhuma ata encontrada com esses filtros.</div></div>'}`;
}
function filtrar(campo, valor) { FILTRO[campo] = valor; renderArquivo(); }

/* --------------------------- encaminhamentos --------------------------- */
function renderEncaminhamentos() {
  const ord = ENCS.slice().sort((a, b) => (b.atrasado - a.atrasado) || String(a.prazo).localeCompare(String(b.prazo)));
  $("v-encaminhamentos").innerHTML = `
    <div class="stat">
      <div class="s"><b>${ENCS.length}</b><span>encaminhamentos</span></div>
      <div class="s"><b style="color:var(--err)">${ENCS.filter((e) => e.atrasado).length}</b><span>em atraso</span></div>
      <div class="s"><b>${new Set(ENCS.map((e) => e.responsavel).filter(Boolean)).size}</b><span>responsáveis</span></div>
    </div>
    <div class="card">
      <div class="card-t">Tarefas deliberadas em sessão</div>
      <div class="card-s">Extraídas automaticamente dos pontos de pauta das atas.</div>
      ${ord.length ? `<table class="pt"><thead><tr><th>Ação</th><th>Responsável</th><th>Prazo</th><th>Origem</th></tr></thead>
        <tbody>${ord.map((e) => `<tr>
          <td>${esc(e.acao)}<div class="muted">${esc(e.ponto)}</div></td>
          <td>${esc(e.responsavel || "—")}</td>
          <td class="${e.atrasado ? "bad" : ""}">${fmtD(e.prazo)}${e.atrasado ? " ⚠" : ""}</td>
          <td><a onclick="abrir('${e.ataId}')" style="cursor:pointer">${esc(e.numero || "ata")}</a>
            <div class="muted">${esc(e.orgao)}</div></td></tr>`).join("")}</tbody></table>`
        : '<div class="vazio">Nenhum encaminhamento registrado.</div>'}
    </div>`;
}

/* -------------------------- pauta regulatória --------------------------- */
const ROT_ESTADO = { "em-dia": "em dia", pendente: "a fazer", vencendo: "vencendo",
  nunca: "nunca tratada", "fora-da-janela": "não vence neste semestre" };
let REG = { orgao: "NDE", curso: "psicologia", data: "", dados: null };

async function buscarPautas(orgao, curso, excluir, data) {
  const q = `orgao=${encodeURIComponent(orgao)}&curso=${encodeURIComponent(curso || "")}`
    + (excluir ? `&excluir=${encodeURIComponent(excluir)}` : "")
    + (data ? `&data=${encodeURIComponent(data)}` : "");
  return api("/api/atas/pauta-regulatoria?" + q);
}
let ANTERIOR = null;
// Semestres para consulta retroativa: do ano corrente para trás.
function semestresParaConsulta() {
  const ano = Number(hojeISO().slice(0, 4));
  const lista = [];
  for (let a = ano; a >= ano - 4; a--) for (const sem of [2, 1]) {
    lista.push({ valor: sem === 1 ? `${a}-03-15` : `${a}-09-15`, rot: `${a}-S${sem}` });
  }
  return lista;
}
function orgaoPorCurso(cod) { return !!META.orgaos.find((o) => o.codigo === cod)?.porCurso; }
// O âmbito é escolhido primeiro: com curso, só entram os órgãos do curso;
// sem curso, só os colegiados superiores, pró-reitorias e comissões.
const orgaosDoAmbito = (curso) => (META.orgaos || []).filter((o) => !!o.porCurso === !!curso);

// Qual identidade institucional vale numa data — a instituição era FACEG
// antes da transformação em UNIEGO, e a ata precisa sair com o timbre certo.
function marcaDaData(data) {
  const m = META.marcas;
  if (!m) return null;
  return data && data < m.unieogDesde ? { ...m.faceg, codigo: "faceg" } : { ...m.uniego, codigo: "uniego" };
}
function notaDoTimbre(data) {
  const m = marcaDaData(data);
  if (!m) return "";
  if (m.codigo === "uniego") {
    return '<div class="muted" style="margin-top:5px">Aceita datas anteriores, para regularizar o arquivo.</div>';
  }
  const ato = META.marcas.credenciamento?.ato;
  return `<div class="muted" style="margin-top:5px;color:var(--warn);font-weight:600">
    Timbre da <b>${esc(m.sigla)}</b> — ${esc(m.nome)}.<br>
    <span style="font-weight:400">A transformação em ${esc(META.marcas.uniego.sigla)} vigora desde
    ${fmtD(META.marcas.unieogDesde)}${ato ? ` (${esc(ato)})` : ""}; a ata sai com o timbre da época.</span></div>`;
}
// Trocar de âmbito derruba um órgão que não pertença a ele.
function trocarAmbito(curso) {
  ATUAL.curso = curso;
  if (ATUAL.orgao && !orgaosDoAmbito(curso).some((o) => o.codigo === ATUAL.orgao)) ATUAL.orgao = "";
}
const CAD_ROT = (k) => (META.cadencias?.[k]?.rot || k);
const MOM_ROT = (k) => (META.momentos?.[k]?.rot || k);
const chipMomento = (m) => `<span class="mom mom-${m}">${esc(MOM_ROT(m))}</span>`;
// Descrição da cobrança: "Todo semestre" ou "Uma vez por ano · 2º semestre".
const quandoVence = (p) => CAD_ROT(p.cadencia) + (p.cadencia === "anual" && p.semestre ? ` · ${p.semestre}º semestre` : "");

      </select>
      <select class="${porCurso ? "" : "hide"}" onchange="REG.curso=this.value;renderRegulatoria()">
        ${META.cursos.map((c) => `<option value="${c.slug}" ${REG.curso === c.slug ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}
      </select>
      <select onchange="REG.data=this.value;renderRegulatoria()">

      </div>

  el.innerHTML = cab + `

    <div class="card">

      <div class="card-s">Toda sessão ordinária do ciclo precisa estar registrada em ata; as extraordinárias entram por demanda e não substituem essas.</div>
      <div class="stat" style="margin-bottom:6px">
        <div class="s"><b style="color:${r.completo ? "var(--ok)" : "var(--warn)"}">${r.ordinarias}/${r.exigidas}</b><span>sessões ordinárias</span></div>
        <div class="s"><b>${r.extraordinarias}</b><span>extraordinárias</span></div>
        <div class="s"><b style="color:${d.percentual >= 100 ? "var(--ok)" : "var(--warn)"}">${d.percentual}%</b><span>do checklist do semestre</span></div>

      </div>
      ${r.completo
        ? '<div class="banner ba-ok">Ciclo de sessões cumprido neste semestre.</div>'
        : `<div class="banner ba-warn">Faltam ${r.faltam} sessão(ões) ordinária(s) neste semestre — a próxima é a de
           <b>${esc(MOM_ROT(r.proximoMomento).toLowerCase())}</b>, com prazo até ${fmtD(d.pautas[0]?.fimDaJanela)}.</div>`}

const ROT_TIPO = { ciclo: "sessão em falta", pautas: "pauta obrigatória",

function cartaoAlerta(a) {
  return `<div class="al ${a.severidade}">
    <div style="flex:1;min-width:0">
      <div class="tt">${esc(a.titulo)}</div>
      <div class="de">${esc(a.detalhe)}</div>

    </div>
    <span class="tag">${ROT_TIPO[a.tipo] || a.tipo}</span>

}

function blocoAlertas(d, { limite = 0 } = {}) {
  const r = d.resumo;
  if (!r.total) return '<div class="banner ba-ok">Nenhuma pendência: todos os órgãos estão em dia neste semestre.</div>';
  const lista = limite ? d.alertas.slice(0, limite) : d.alertas;
  return `
    <div class="lg" style="margin-bottom:12px">
      <span><i class="bolinha" style="background:var(--err)"></i> ${r.alta} urgente(s)</span>
      <span><i class="bolinha" style="background:var(--warn)"></i> ${r.media} em atenção</span>

async function abrir(id) {
  try {
    const d = await api("/api/atas/" + encodeURIComponent(id));
    ATUAL = d.ata; PODE_EDITAR = d.podeEditar;
    nav("ata"); cabecalho(); renderEditor("v-ata");
  } catch (e) { alert(e.message); }
}
function cabecalho() {
  $("titulo").textContent = ATUAL.numero || "Ata em elaboração";
  $("subtitulo").textContent = tituloDaAta(ATUAL) + " · sessão de " + fmtD(ATUAL.sessao?.data);
  $("crumb").textContent = ATUAL.numero || "Ata";
}
function tituloDaAta(a) {
  const o = META.orgaos.find((x) => x.codigo === a.orgao);
  if (!o) return "Reunião";
  const nome = o.nomeLivre ? (a.orgaoNome || o.nome) : o.nome;
  const c = a.curso ? (META.cursos.find((x) => x.slug === a.curso)?.nome || a.curso) : "";
  return c ? `${nome} — ${c}` : nome;
}

// Pautas do catálogo que cabem ao órgão desta ata (para o seletor do ponto).
function pautasDoOrgaoLocal() {
  const cod = ATUAL?.orgao;
  return (META.pautas || []).filter((p) => p.orgao === cod);
}

// Lista as pautas que o órgão ainda não tratou na janela vigente e oferece
// incluí-las como ponto com um clique. É o "para que não se esqueçam".
let SUGESTOES = null;
// Checklist do semestre com caixas de seleção: o responsável marca o que a
// reunião abordou e o ponto de pauta é criado (ou removido) na hora.
async function renderSugestoes() {
  const el = $("card-sugestoes");
  if (!el || !ATUAL?.orgao) return;
  const porCurso = orgaoPorCurso(ATUAL.orgao);
  if (porCurso && !ATUAL.curso) return;
  let d;
  try { d = await buscarPautas(ATUAL.orgao, porCurso ? ATUAL.curso : "", ATUAL.id, ATUAL.sessao?.data); }
  catch { return; }
  SUGESTOES = d.pautas;

  const r = d.ritual;
  const usadas = new Set((ATUAL.pauta || []).map((p) => p.pautaMec).filter(Boolean));
  const extra = ATUAL.sessao?.tipo === "extraordinária";
  const daVez = r.proximoMomento;
  const cobradas = d.pautas.filter((p) => p.exigidaAgora);
  ANTERIOR = d.anterior || null;
  const marcadas = cobradas.filter((p) => usadas.has(p.id)).length;
  const jaFeitas = cobradas.filter((p) => p.estado === "em-dia" && !usadas.has(p.id)).length;
  const pendentes = cobradas.length - marcadas - jaFeitas;
  const grupos = r.momentos.length > 1 ? r.momentos : ["livre"];

  // Três estados: marcada nesta ata · já cumprida pelo órgão em outra ata do
  // semestre (pode ter sido lavrada por outro colega) · ainda pendente.
  const caixa = (p) => {
    const on = usadas.has(p.id);
    const feita = p.estado === "em-dia" && !on;
    const rotulo = on ? "nesta ata" : feita ? "cumprida pelo órgão" : ROT_ESTADO[p.estado];
    const corpo = `
      <span class="txt">
        <span class="tt">${esc(p.titulo)}</span>
        <span class="md">${esc(quandoVence(p))} · prazo ${fmtD(p.fimDaJanela)}
          · ${p.refs.map((x) => `${x.inst === "curso" ? "Curso" : "IES"} ${esc(x.num)}`).join(", ")}</span>
        ${feita ? `<span class="md" style="color:var(--ok);font-weight:600">
            ✓ Registrada em ${fmtD(p.ultima?.data)}${p.ultima?.numero ? ` na ${esc(p.ultima.numero)}` : ""}
            — o ciclo do órgão já contempla este tema.</span>
          ${PODE_EDITAR ? `<button class="de-novo" onclick="alternarPauta('${p.id}',true)">
            a sessão voltou a tratar deste tema — incluir também nesta ata</button>` : ""}`
          : `<span class="ev">${esc(p.evidencia)}</span>`}
      </span>
      <span class="badge e-${on || feita ? "em-dia" : p.estado}">${rotulo}</span>`;

    // cumprida: marca fixa em vez de caixa, para ninguém confundir com pendente
    if (feita) return `<div class="chk-pauta feita"><span class="ok-orgao">✓</span>${corpo}</div>`;
    return `<label class="chk-pauta ${on ? "on" : ""}">
      <input type="checkbox" ${on ? "checked" : ""} ${PODE_EDITAR ? "" : "disabled"}
        onchange="alternarPauta('${p.id}',this.checked)">${corpo}</label>`;
  };

  // item de praxe do rito: a ata da sessão anterior é lida e aprovada nesta
  const anteriorMarcada = (ATUAL.pauta || []).some((p) => p.ataAnterior);
  const itemAnterior = ANTERIOR ? `<label class="chk-pauta ${anteriorMarcada ? "on" : ""}">
      <input type="checkbox" ${anteriorMarcada ? "checked" : ""} ${PODE_EDITAR ? "" : "disabled"}
        onchange="alternarAtaAnterior(this.checked)">
      <span class="txt">
        <span class="tt">Leitura e aprovação da ata da sessão anterior</span>
        <span class="md">${esc(ANTERIOR.numero)} · sessão ${esc(ANTERIOR.tipo || "ordinária")} de ${fmtD(ANTERIOR.data)}
          · situação atual: ${ROTULO_STATUS[ANTERIOR.status] || ANTERIOR.status}</span>
        <span class="ev">Item de praxe da ordem do dia: o ponto fica na ata como registro de que a
          sessão anterior foi lida e aprovada pelo órgão.</span>
      </span>
      <span class="badge ${anteriorMarcada ? "e-em-dia" : "e-fora-da-janela"}">${
        anteriorMarcada ? "nesta ata" : "de praxe"}</span>
    </label>` : "";

  el.classList.remove("hide");
  // Órgão sem obrigação do INEP (comissões e os "outro órgão"): nada a cobrar,
  // então o cartão vira só uma nota, sem checklist nem contagem de sessões.
  if (!r.exigidas && !cobradas.length) {
    el.innerHTML = `<div class="card-t">Pauta livre</div>
      <div class="card-s">Este órgão não tem pauta regulatória nem ciclo de sessões a cumprir —
        o ARCHÉ registra, numera e arquiva as atas dele do mesmo jeito.</div>
      ${itemAnterior ? `<div class="grupo-mom"><div class="grupo-t">
        <span class="mom mom-livre">Ordem do dia</span> <span>item de praxe</span></div>${itemAnterior}</div>` : ""}`;
    return;
  }
  el.innerHTML = `
    <div class="card-t">Pautas obrigatórias do semestre ${esc(r.janela)}</div>
    ${d.retroativa ? `<div class="banner ba-warn" style="margin:8px 0 12px">
      <b>Registro retroativo.</b> Esta sessão é de ${esc(r.janela)} e o semestre corrente é ${esc(d.janelaAtual)}.
      O checklist abaixo é o daquele semestre — o que você marcar regulariza o histórico, não a janela atual.</div>` : ""}
    <div class="card-s">${esc(META.orgaos.find((o) => o.codigo === ATUAL.orgao)?.nome || "")} registrou
      <b>${r.ordinarias} de ${r.exigidas}</b> sessão(ões) ordinária(s) neste semestre${r.extraordinarias ? ` e ${r.extraordinarias} extraordinária(s)` : ""}.
      ${extra ? "Esta é uma sessão <b>extraordinária</b>: entra por demanda e não fecha o ciclo, mas os temas que marcar aqui contam como registro."
              : r.completo ? "O ciclo já está cumprido — esta sessão é um reforço."
              : `Esta será a sessão de <b>${esc(MOM_ROT(daVez).toLowerCase())}</b>.`}
      <b>Marque abaixo o que a reunião abordou</b> — cada item marcado vira um ponto de pauta.</div>
    <div class="cnt">${cobradas.length} tema(s) cobrado(s) neste semestre ·
      <b>${marcadas}</b> marcado(s) nesta ata ·
      <b style="color:var(--ok)">${jaFeitas}</b> já cumprido(s) pelo órgão em sessão anterior ·
      <b style="color:${pendentes ? "var(--warn)" : "var(--ok)"}">${pendentes}</b> pendente(s).
      ${jaFeitas ? "O que outro colega já registrou aparece com ✓ — não precisa repetir." : ""}</div>
    ${itemAnterior ? `<div class="grupo-mom"><div class="grupo-t">
      <span class="mom mom-livre">Ordem do dia</span> <span>item de praxe</span></div>${itemAnterior}</div>` : ""}
    ${grupos.map((m) => {
      const doGrupo = cobradas.filter((p) => p.momento === m);
      if (!doGrupo.length) return "";
      return `<div class="grupo-mom">
        <div class="grupo-t">${chipMomento(m)}
          <span>${doGrupo.filter((p) => usadas.has(p.id) || p.estado === "em-dia").length}/${doGrupo.length} cumprido(s) no semestre</span></div>
        ${doGrupo.map(caixa).join("")}</div>`;
    }).join("")}
    ${cobradas.length ? "" : '<div class="banner ba-ok">Este órgão não tem pauta obrigatória vencendo neste semestre.</div>'}`;
}

// A leitura da ata anterior vira o primeiro ponto da ordem do dia.
function alternarAtaAnterior(ligar) {
  const i = (ATUAL.pauta || []).findIndex((p) => p.ataAnterior);
  if (!ligar) {
    if (i >= 0) {
      const p = ATUAL.pauta[i];
      if ((p.discussao || p.deliberacao) && !confirm("Este ponto já tem conteúdo. Remover mesmo assim?")) {
        renderSugestoes(); return;
      }
      ATUAL.pauta.splice(i, 1);
      if (!ATUAL.pauta.length) addPonto();
    }
    renderPauta(); renderSugestoes(); return;
  }
  if (i >= 0 || !ANTERIOR) { renderSugestoes(); return; }
  const ponto = {
    titulo: `Leitura e aprovação da ata da sessão anterior (${ANTERIOR.numero})`,
    ataAnterior: ANTERIOR.id, pautaMec: "", discussao: "",
    deliberacao: "Lida e aprovada por unanimidade.",
    votacao: { houve: false, favor: 0, contra: 0, abstencoes: 0 },
    encaminhamento: { acao: "", responsavel: "", prazo: "" },
  };
  const vazio = ATUAL.pauta.findIndex((x) => !x.titulo && !x.discussao);
  if (vazio >= 0) ATUAL.pauta.splice(vazio, 1);
  ATUAL.pauta.unshift(ponto);          // é sempre o primeiro item da ordem do dia
  renderPauta(); renderSugestoes();
}

// Marcar cria o ponto; desmarcar remove — mas nunca apaga texto já escrito.
function alternarPauta(id, ligar) {
  if (ligar) { incluirPauta(id); return; }
  const i = (ATUAL.pauta || []).findIndex((p) => p.pautaMec === id);
  if (i < 0) { renderSugestoes(); return; }
  const p = ATUAL.pauta[i];
  const temConteudo = p.discussao || p.deliberacao || p.encaminhamento?.acao;
  if (temConteudo) {
    if (!confirm("Este ponto já tem conteúdo. Desvincular da pauta obrigatória e manter o texto?")) {
      renderSugestoes(); return;
    }
    p.pautaMec = "";
  } else {
    ATUAL.pauta.splice(i, 1);
    if (!ATUAL.pauta.length) addPonto();
  }
  renderPauta(); renderSugestoes();
}

function incluirPauta(id) {
  const p = (META.pautas || []).find((x) => x.id === id);
  if (!p) return;
  // ponto em branco no fim da lista é reaproveitado, para não deixar buraco
  const vazio = ATUAL.pauta.findIndex((x) => !x.titulo && !x.discussao);
  const ponto = {
    titulo: p.titulo, pautaMec: p.id, discussao: "", deliberacao: "",
    votacao: { houve: false, favor: 0, contra: 0, abstencoes: 0 },
    encaminhamento: { acao: "", responsavel: "", prazo: "" },
  };
  if (vazio >= 0) ATUAL.pauta[vazio] = ponto; else ATUAL.pauta.push(ponto);
  renderPauta(); renderSugestoes();
  $("pauta").lastElementChild?.scrollIntoView({ behavior: "smooth", block: "center" });
}

        ${PODE_EDITAR ? `<span class="rm" style="cursor:pointer;color:var(--err);font-weight:700"
          onclick="removerAnexo(${i})">✕</span>` : ""}</div>`).join("")}</div>` : ""}

}

async function enviarAnexo(input) {
  const arquivo = input.files?.[0];
  input.value = "";
  if (!arquivo) return;
  if (arquivo.size > 20 * 1024 * 1024) { aviso("Arquivo acima de 20 MB.", "err"); return; }
  try {
    aviso("Enviando o anexo…", "warn");
    await salvar({ silencioso: true });
    const fd = new FormData();
    fd.append("file", arquivo);
    const r = await fetch(`/api/atas/${ATUAL.id}/anexo`, { method: "POST", body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Falha (${r.status})`);
    ATUAL = j.ata; await carregar(); cabecalho(); renderEditor("v-ata");
    aviso(`"${arquivo.name}" anexado à ata.`, "ok");
  } catch (e) { aviso(e.message, "err"); }
}

async function removerAnexo(i) {
  if (!confirm("Remover este anexo da ata?")) return;
  try {
    const j = await api(`/api/atas/${ATUAL.id}/anexo/${i}`, { method: "DELETE" });
    ATUAL = j.ata; await carregar(); cabecalho(); renderEditor("v-ata");
  } catch (e) { aviso(e.message, "err"); }
}

function renderParticipantes() {

    <td><input ${ro} value="${esc(p.nome)}" oninput="setPart(${i},'nome',this.value)" placeholder="Nome completo"></td>
    <td><input ${ro} value="${esc(p.cargo || "")}" oninput="setPart(${i},'cargo',this.value)"></td>
    <td><input ${ro} type="email" value="${esc(p.email || "")}" oninput="setPart(${i},'email',this.value)"></td>
    <td><select ${ro} onchange="setPart(${i},'condicao',this.value)">
      ${["membro", "suplente", "convidado", "secretaria"].map((c) => `<option value="${c}" ${p.condicao === c ? "selected" : ""}>${c}</option>`).join("")}</select></td>
    <td><select ${ro} onchange="setPart(${i},'presenca',this.value);renderParticipantes()">
      ${[["presente", "presente"], ["justificada", "falta justificada"], ["ausente", "ausente"]]
        .map(([v, l]) => `<option value="${v}" ${p.presenca === v ? "selected" : ""}>${l}</option>`).join("")}</select></td>
    <td class="acao">${PODE_EDITAR ? `<span class="rm" onclick="rmPart(${i})">✕</span>` : ""}</td></tr>`).join("")
    || '<tr><td colspan="6" class="muted">Nenhum participante registrado ainda.</td></tr>';

  const p = ATUAL.participantes;
  $("quorum").textContent = `${p.filter((x) => x.presenca === "presente").length} presente(s) · `
    + `${p.filter((x) => x.presenca === "justificada").length} com falta justificada · `
    + `${p.filter((x) => x.presenca === "ausente").length} ausente(s)`;
}
const setPart = (i, k, v) => { ATUAL.participantes[i][k] = v; };
function rmPart(i) { ATUAL.participantes.splice(i, 1); renderParticipantes(); }
function addParticipante() {
  ATUAL.participantes.push({ nome: "", cargo: "", email: "", condicao: "membro", presenca: "presente" });
  renderParticipantes();
  const campos = $("tb-part").querySelectorAll("input");
  campos[campos.length - 4]?.focus();
}
function colarParticipantes() {
  const txt = prompt("Cole os nomes, um por linha (opcionalmente “Nome; cargo; e-mail”):");
  if (!txt) return;
  for (const linha of txt.split(/\r?\n/)) {
    const [nome, cargo, email] = linha.split(/[;\t]/).map((s) => (s || "").trim());
    if (nome) ATUAL.participantes.push({ nome, cargo: cargo || "", email: email || "", condicao: "membro", presenca: "presente" });
  }
  renderParticipantes();
}

function renderPauta() {
  const el = $("pauta"); if (!el) return;
  const ro = PODE_EDITAR ? "" : "disabled";
  el.innerHTML = ATUAL.pauta.map((p, i) => `<div class="ponto-pauta">
    <div class="cabeca"><span class="num">PONTO ${i + 1}</span>
      ${PODE_EDITAR ? `<button class="rm" onclick="rmPonto(${i})">remover</button>` : ""}</div>
    <input ${ro} value="${esc(p.titulo)}" oninput="setPonto(${i},'titulo',this.value)" placeholder="Título do ponto de pauta *">
    <label>Pauta regulatória <span class="muted">— vincule quando o ponto atender a um indicador do MEC</span></label>
    <select ${ro} onchange="setPonto(${i},'pautaMec',this.value);renderSugestoes()">
      <option value="">— não se aplica —</option>
      ${pautasDoOrgaoLocal().map((x) => `<option value="${x.id}" ${p.pautaMec === x.id ? "selected" : ""}>${esc(x.titulo)}</option>`).join("")}
    </select>
    ${p.pautaMec ? `<div class="md" style="font-size:11.5px;color:var(--muted);margin-top:5px">${
      ((META.pautas || []).find((x) => x.id === p.pautaMec)?.refs || [])
        .map((r) => `<span class="ref">${r.inst === "curso" ? "CURSO" : "IES"} ${esc(r.num)} · ${esc(r.nome)}</span>`).join("")}</div>` : ""}
    <label>Notas da discussão <span class="muted">(tópicos bastam)</span></label>
    <textarea ${ro} data-ia="atas.discussao" data-ia-ponto="${i}"
      oninput="setPonto(${i},'discussao',this.value)" style="min-height:70px">${esc(p.discussao || "")}</textarea>
    <label>Deliberação</label>
    <textarea ${ro} data-ia="atas.deliberacao" data-ia-ponto="${i}"
      oninput="setPonto(${i},'deliberacao',this.value)" style="min-height:52px">${esc(p.deliberacao || "")}</textarea>
    <label class="chk"><input type="checkbox" ${ro} ${p.votacao?.houve ? "checked" : ""}
      onchange="setVoto(${i},'houve',this.checked);renderPauta()"> houve votação</label>
    ${p.votacao?.houve ? `<div class="votos">
      <div><label>Favoráveis</label><input type="number" min="0" ${ro} value="${p.votacao.favor || 0}" oninput="setVoto(${i},'favor',+this.value)"></div>
      <div><label>Contrários</label><input type="number" min="0" ${ro} value="${p.votacao.contra || 0}" oninput="setVoto(${i},'contra',+this.value)"></div>
      <div><label>Abstenções</label><input type="number" min="0" ${ro} value="${p.votacao.abstencoes || 0}" oninput="setVoto(${i},'abstencoes',+this.value)"></div>
    </div>` : ""}
    <div class="grid3">
      <div><label>Encaminhamento</label><input ${ro} value="${esc(p.encaminhamento?.acao || "")}" oninput="setEnc(${i},'acao',this.value)" placeholder="O que será feito"></div>
      <div><label>Responsável</label><input ${ro} value="${esc(p.encaminhamento?.responsavel || "")}" oninput="setEnc(${i},'responsavel',this.value)"></div>
      <div><label>Prazo</label><input type="date" ${ro} value="${esc(p.encaminhamento?.prazo || "")}" onchange="setEnc(${i},'prazo',this.value)"></div>
    </div>
  </div>`).join("");
}
const setPonto = (i, k, v) => { ATUAL.pauta[i][k] = v; };
const setVoto = (i, k, v) => { ATUAL.pauta[i].votacao = ATUAL.pauta[i].votacao || {}; ATUAL.pauta[i].votacao[k] = v; };
const setEnc = (i, k, v) => { ATUAL.pauta[i].encaminhamento = ATUAL.pauta[i].encaminhamento || {}; ATUAL.pauta[i].encaminhamento[k] = v; };
function addPonto() {
  ATUAL.pauta.push({ titulo: "", discussao: "", deliberacao: "", votacao: { houve: false, favor: 0, contra: 0, abstencoes: 0 }, encaminhamento: { acao: "", responsavel: "", prazo: "" } });
  renderPauta();
}
function rmPonto(i) { ATUAL.pauta.splice(i, 1); renderPauta(); }

/* --------------------------------- ações -------------------------------- */
function aviso(texto, tipo = "ok") {
  const el = $("msg") || $("aviso");
  el.innerHTML = `<div class="banner ba-${tipo}">${esc(texto)}</div>`;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
}
async function salvar({ silencioso = false } = {}) {
  const r = await api("/api/atas", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ATUAL),
  });
  ATUAL = r.ata;
  await carregar();
  if (SECAO === "nova") nav("ata");
  if (!silencioso) { cabecalho(); renderEditor("v-ata"); aviso("Ata salva.", "ok"); }
  return ATUAL;
}
async function redigir(refazer) {
  if (refazer && !confirm("Reescrever a minuta descarta o texto atual. Continuar?")) return;
  try {
    aviso("Redigindo a minuta…", "warn");
    await salvar({ silencioso: true });
    const r = await api(`/api/atas/${ATUAL.id}/redigir`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refazer: !!refazer }),
    });
    ATUAL = r.ata; await carregar(); cabecalho(); renderEditor("v-ata");
    aviso(r.aviso || `Minuta pronta (${r.provedor === "modelo" ? "gerador do ARCHÉ" : r.provedor}). Revise o texto antes de aprovar.`,
      r.aviso ? "warn" : "ok");
  } catch (e) { aviso(e.message, "err"); }
}
async function mudarStatus(status) {
  try {
    await salvar({ silencioso: true });
    const r = await api(`/api/atas/${ATUAL.id}/status`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }),
    });
    ATUAL = r.ata; await carregar(); cabecalho(); renderEditor("v-ata");
    aviso(status === "rascunho" ? "Ata devolvida para rascunho." : "Situação atualizada.", "ok");
  } catch (e) { aviso(e.message, "err"); }
}
async function registrar() {
  const jaRegistrada = ATUAL.status === "registrada";
  const pergunta = jaRegistrada
    ? "Gerar o PDF corrigido? A versão anterior continua arquivada no Drive, ao lado da nova."
    : "Registrar a ata? Ela passa a valer como documento do órgão — correções posteriores ficam no histórico.";
  if (!confirm(pergunta)) return;
  try {
    aviso("Gerando o PDF e arquivando…", "warn");
    await salvar({ silencioso: true });
    const r = await api(`/api/atas/${ATUAL.id}/registrar`, { method: "POST" });
    ATUAL = r.ata; await carregar(); cabecalho(); renderEditor("v-ata");
    aviso((r.retificacao
      ? `Ata ${ATUAL.numero} retificada (versão ${ATUAL.registro?.versao}).`
      : `Ata ${ATUAL.numero} registrada.`)
      + (r.arquivada ? " O PDF está aqui e a cópia foi arquivada no Drive." : " O PDF está disponível aqui."), "ok");
  } catch (e) { aviso(e.message, "err"); }
}
async function excluir() {
  if (!confirm("Excluir este rascunho? Não há como desfazer.")) return;
  try {
    await api("/api/atas/" + ATUAL.id, { method: "DELETE" });
    await carregar(); nav("arquivo");
  } catch (e) { aviso(e.message, "err"); }
}
async function sair() {
  try { await fetch("/auth/sair", { method: "POST" }); } catch { /* ignora */ }
  location.href = "/";
}

/* ------------------------ contexto para o assistente -------------------- */
// O assistente usa isto só para dar coerência ao texto (órgão, tipo de sessão,
// título do ponto). Nunca para preencher o campo: o conteúdo vem do que a
// pessoa digitou.
window.archeIAContexto = function (campo, el) {
  if (!ATUAL) return null;
  const ctx = {
    "Órgão": tituloDaAta(ATUAL),
    "Tipo de sessão": ATUAL.sessao?.tipo || "ordinária",
    "Data da sessão": fmtD(ATUAL.sessao?.data),
  };
  const i = Number(el?.dataset?.iaPonto);
  const ponto = Number.isInteger(i) ? ATUAL.pauta?.[i] : null;
  if (ponto?.titulo) ctx["Ponto de pauta"] = ponto.titulo;
  return ctx;
};

/* --------------------------------- início ------------------------------- */
(async () => {
  try {
    ME = await (await fetch("/api/me")).json();
    if (ME.error) { location.href = "/entrar?next=" + encodeURIComponent(location.pathname); return; }
    const m = await api("/api/atas/meta");
    META = { ...META, ...m };
  } catch (e) {
    $("aviso").innerHTML = `<div class="banner ba-err">Não foi possível carregar o setor: ${esc(e.message)}</div>`;
    return;
  }
  montarSidebar();
  try { await carregar(); } catch { /* lista vazia no primeiro acesso */ }
  $("dir-info").textContent = META.ia === "modelo"
    ? "redação: gerador do ARCHÉ" : `redação: IA (${META.ia})`;
  nav("painel");
})();
</script>
<script src="/assets/arche-nav.js" defer></script>
<script src="/assets/arche-ia.js" defer></script>
</body>
</html>
