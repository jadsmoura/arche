<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de acessos · ARCHÉ</title>
<link rel="icon" href="/arche/favicon.svg">
<link rel="stylesheet" href="/assets/arche-ui.css">
<style>
  :root{--teal:var(--brand);--teal2:var(--brand-3);--cyan:var(--brand-2);--cyan-soft:var(--accent-wash)}
  main{max-width:1180px;padding:34px 26px 46px}
  h1{font-family:'Archivo',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--muted);margin-bottom:22px;font-size:14px}
  .card{margin-bottom:16px}
  .sec{font-family:'Archivo',sans-serif;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--brand);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--accent-wash)}
  .card .u{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
  .card .u:last-child{border-bottom:0}
  .card .u .em{font-weight:600;flex:1;min-width:200px}
  .card .u .quando{color:var(--muted);font-size:12px}
  .bt{padding:8px 14px;font-size:13px;border-radius:9px}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;border-radius:999px;padding:3px 10px;text-transform:uppercase}
  .b-g{background:var(--brand);color:#fff}
  .b-a{background:var(--ok-soft);color:var(--ok)}
  .muted{color:var(--muted);font-size:13px}
  .add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .add input{flex:1;min-width:220px;width:auto}
  .mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin:10px 0}
  .mod{display:flex;align-items:flex-start;gap:9px;margin:0;padding:9px 11px;border:1px solid var(--line);
    border-radius:9px;background:#fff;cursor:pointer;font-size:13.5px;font-weight:400;color:var(--ink);
    text-transform:none;letter-spacing:0;transition:.15s}
  .mod:hover{border-color:var(--brand-2);background:var(--wash)}
  .mod:has(input:checked){border-color:var(--brand-2);background:var(--accent-wash)}
  .mod b{font-weight:600}
  .mod .dica{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px}
  .designar{border:1px dashed var(--line-strong);border-radius:11px;padding:14px 16px;margin-top:14px;background:#fbfcfd}
  /* painel de usuários: quem está cadastrado, o que faz e o que usa */
  .hide{display:none !important}
  .abas{display:flex;gap:8px;margin-bottom:18px;border-bottom:2px solid var(--line)}
  .abas button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:10px 14px;transition:.15s}
  .abas button:hover{color:var(--brand-2)}
  .abas button.on{color:var(--brand);border-bottom-color:var(--brand-2)}
  .filtros-u{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:14px}
  .filtros-u input,.filtros-u select{width:100%;font-size:13px;padding:8px 10px;margin:0}
  .rolo{overflow-x:auto}
  table.us{width:100%;border-collapse:collapse;font-size:13.5px}
  table.us th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;
    padding:9px 8px;border-bottom:2px solid var(--line-strong);background:var(--wash);white-space:nowrap}
  table.us td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.us tr:last-child td{border-bottom:0}
  table.us .nm{font-weight:600;color:var(--ink)}
  table.us .em{font-size:12px;color:var(--muted)}
  .linha-dup{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;
    border-bottom:1px solid var(--line-2)}
  .linha-dup:last-child{border-bottom:0}
  .linha-dup .nm{font-weight:600;color:var(--ink)}
  .linha-dup .em{font-size:12px;color:var(--muted)}
  .setor{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;margin-right:4px;white-space:nowrap;
    background:var(--accent-wash);color:var(--brand-2)}
  .p-gestor{background:var(--brand);color:#fff}
  .p-coordenador{background:var(--accent-wash);color:var(--brand)}
  .p-aprovado{background:var(--ok-soft);color:var(--ok)}
  .p-pendente{background:var(--warn-soft);color:var(--warn)}
  .ficha{position:fixed;inset:0;background:rgba(24,38,50,.45);z-index:100;display:grid;place-items:center;padding:20px}
  .ficha .cx{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:24px}
  .ficha h3{font-family:'Archivo',sans-serif;font-size:19px;margin:0 0 4px}
  .ficha .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:620px){.ficha .grid2{grid-template-columns:1fr}}
  /* paginação: lista longa cansa e esconde o que importa */
  .pag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .pag .info{font-size:12.5px;color:var(--muted);margin-right:auto}
  .pag button{background:#fff;border:1px solid var(--line-strong);border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:600;color:var(--brand-2);padding:6px 12px;transition:.15s}
  .pag button:hover:not(:disabled){border-color:var(--brand-2);background:var(--wash)}
  .pag button:disabled{opacity:.4;cursor:default}
  .pag button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .pag select{width:auto;font-size:13px;padding:5px 8px;margin:0}
  /* guia dos envios automáticos */
  .av-linha{display:flex;gap:16px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
  .av-linha:last-child{border-bottom:0}
  .av-off{opacity:.62}
  .av-txt{flex:1 1 auto;min-width:0}
  .av-t{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .av-d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .av-se{color:var(--muted)}
  .av-ok{color:var(--brand-3);font-weight:600}
  .av-tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    border-radius:999px;padding:2px 8px}
  .av-tag.g{background:var(--accent-wash);color:var(--brand-3)}
  .av-tag.p{background:var(--ok-soft);color:var(--ok)}
  .av-tag.c{background:var(--warn-soft,#fbf3e4);color:var(--warn,#c98a2b)}
  .av-ctl{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .av-ctl select,.av-ctl input{font-size:12.5px;padding:6px 8px;border:1px solid var(--line);
    border-radius:8px;background:#fff;font-family:inherit;color:var(--ink)}
  @media(max-width:640px){.av-linha{flex-direction:column}.av-ctl{align-items:stretch;width:100%}}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-rule"></div>
  <div class="topo-inner">
    <img class="u" src="/assets/logo-uniego.png" alt="UNIEGO — Centro Universitário Evangélico de Goianésia">
    <span class="vr"></span>
    <div class="topo-txt">
      <span class="topo-t">
        <span class="arche-wm">
          <svg class="arche-ic" viewBox="0 0 40 42" aria-hidden="true"><path d="M7 39 V20 a13 13 0 0 1 26 0 V39" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/><circle cx="20" cy="20" r="3.4" fill="var(--accent)"/></svg>
          <span class="arche-tx">ARCHÉ</span>
        </span>
      </span>
      <span class="topo-s">Gestão de acessos — PROPPEX / UNIEGO</span>
    </div>
    <nav class="topo-nav">
      <a href="/">← Voltar ao portal</a>
    </nav>
  </div>
</header>
<main>
  <h1>Usuários e acessos</h1>
  <div class="sub">Quem está cadastrado, o que faz na instituição e que setores usa — e, na outra aba,
    quem submete e quem gere cada módulo. Todo cadastro novo entra como submissor automaticamente.</div>
  <div class="abas">
    <button id="ab-usuarios" class="on" onclick="aba('usuarios')">👥 Usuários cadastrados</button>
    <button id="ab-acessos" onclick="aba('acessos')">🔐 Papéis e acessos</button>
    <button id="ab-avisos" onclick="aba('avisos')">📣 Envios automáticos</button>
  </div>
  <div id="v-usuarios" class="muted">Carregando…</div>
  <div id="v-acessos" class="muted hide">Carregando…</div>
  <div id="v-avisos" class="muted hide">Carregando…</div>
  <div id="ficha"></div>
</main>
<script>
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Cada módulo é um setor do portal. Quem coordena um módulo tem, ali dentro,
   o mesmo alcance da PROPPEX — daí valer a pena dizer o que isso significa,
   em vez de deixar quatro caixinhas soltas na tela. */
const MODULOS=[
  ["extensao","Extensão","vê todas as ações, aprova propostas e emite os números"],
  ["eventos","Eventos (ARCHÉ EV)","opera todos os eventos — página pública, inscrições, credenciamento, transmissão e exportações (a aprovação da ação continua na Extensão)"],
  ["pesquisa","Pesquisa / IC","vê todos os projetos, designa avaliadores e decide o mérito"],
  ["inovacao","Inovação","gestão do setor de inovação (em construção)"],
  ["atas","Atas e Colegiados","vê as atas de todos os órgãos, o Acompanhamento e os alertas de regularização"],
  ["espacos","Espaços (ARCHÉ ES)","recebe os pedidos de reserva, confirma o que está pré-autorizada a decidir e encaminha o resto à PROPPEX"],
  ["monitoria","Monitoria (ARCHÉ MO)","analisa os projetos de monitoria, homologa os relatórios e libera os certificados"],
  ["praticas","Aulas Práticas (ARCHÉ AP)","é a COORDENAÇÃO PEDAGÓGICA do módulo: vê e valida os relatórios de aula prática de TODOS os cursos. O coordenador de um curso só se designa dentro do próprio módulo, na guia Professores e Disciplinas"],
];
const rotulo=(m)=>(MODULOS.find(x=>x[0]===m)||[m,m])[1];
const FIXOS=["jadsonbelem@gmail.com","jadson.moura@uniego.edu.br"];
async function agir(acao,email,modulos){
  const r=await fetch("/api/usuarios",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,email,modulos})});
  if(!r.ok){alert("Falha: "+((await r.json()).error||r.status));return;}
  render(await r.json());
}
function coordenar(email){
  const marcados=[...document.querySelectorAll(email?`.chk-${cssId(email)}:checked`:".chk-novo:checked")].map(c=>c.value);
  const e=email||$("coord-email").value.trim();
  if(!e){alert("Informe o e-mail.");return;}
  if(!marcados.length){alert("Marque ao menos um módulo.");return;}
  agir("coordenar",e,marcados);
}
const cssId=(e)=>e.replace(/[^a-z0-9]/gi,"_");
const chips=(mods)=>mods.map(m=>`<span class="badge" style="background:var(--cyan-soft);color:var(--teal)">${rotulo(m)}</span>`).join(" ");
function checkboxes(cls,marcados=[],comDica=false){
  return `<div class="mods">${MODULOS.map(([v,l,dica])=>`
    <label class="mod">
      <input type="checkbox" class="${cls}" value="${v}" ${marcados.includes(v)?"checked":""}>
      <span><b>${l}</b>${comDica?`<span class="dica">${dica}</span>`:""}</span>
    </label>`).join("")}</div>`;
}
/* A lista de aprovados também passou de 50: mesma paginação, com um filtro
   por e-mail — achar alguém rolando 51 linhas não é achar. */
let FILTRO_APR="", ULTIMO=null;

function render(u){
  ULTIMO=u;
  const coords=Object.entries(u.coordenadores||{});
  const conhecidos=[...new Set([...u.aprovados,...u.pendentes.map(p=>p.email),...coords.map(([e])=>e)])];
  $("v-acessos").innerHTML=`
    <div class="card"><div class="sec">⏳ Aguardando aprovação (${u.pendentes.length})</div>
      ${u.pendentes.length?u.pendentes.map(p=>`<div class="u"><span class="em">${esc(p.nome&&p.nome!==p.email?p.nome+" · ":"")}${esc(p.email)}</span>
        <span class="quando">${p.quando?new Date(p.quando).toLocaleString("pt-BR"):""}</span>
        <button class="bt bt-ok" onclick="agir('aprovar','${esc(p.email)}')">✓ Aprovar</button>
        <button class="bt bt-err" onclick="agir('remover','${esc(p.email)}')">✕ Recusar</button></div>`).join("")
      :'<div class="muted">Nenhuma solicitação pendente.</div>'}
    </div>

    <div class="card"><div class="sec">🧭 Coordenadores — gestão por módulo (${coords.length})</div>
      <div class="muted" style="margin-bottom:8px">Dentro dos setores marcados, o coordenador tem o mesmo alcance
        da PROPPEX: enxerga o que todos registraram e decide. Fora deles, é submissor como qualquer outro —
        e a gestão de acessos, esta tela, continua só com os gestores gerais.</div>
      ${coords.length?coords.map(([e,mods])=>`<div class="u"><span class="em">${esc(e)}</span> ${chips(mods)}
        <span style="flex-basis:100%"></span>
        <span style="flex-basis:100%">${checkboxes("chk-"+cssId(e),mods)}</span>
        <button class="bt bt-pri" onclick="coordenar('${esc(e)}')">💾 Atualizar</button>
        <button class="bt bt-err" onclick="agir('remover','${esc(e)}')">✕ Revogar</button></div>`).join("")
      :'<div class="muted">Nenhum coordenador designado ainda.</div>'}
      <div class="designar">
        <div style="font-weight:600;font-size:14px;margin-bottom:2px">Designar coordenador</div>
        <div class="muted" style="margin-bottom:8px">Informe o e-mail e marque os setores que a pessoa vai gerir.
          Pode ser mais de um.</div>
        <input id="coord-email" list="emails" type="email" placeholder="e-mail da pessoa (ex.: coordenador@uniego.edu.br)">
        <datalist id="emails">${conhecidos.map(e=>`<option value="${esc(e)}">`).join("")}</datalist>
        ${checkboxes("chk-novo",[],true)}
        <button class="bt bt-ok" onclick="coordenar()">＋ Designar coordenador</button>
      </div>
    </div>

    <div class="card"><div class="sec">✅ Submissores aprovados manualmente (${u.aprovados.length})</div>
      ${u.aprovados.length?`<input placeholder="🔎 Filtrar por e-mail" value="${esc(FILTRO_APR)}"
          style="margin-bottom:10px" oninput="FILTRO_APR=this.value;ArchePag.zerar('us-aprovados');clearTimeout(window.__a);window.__a=setTimeout(()=>render(ULTIMO),250)">
        ${(()=>{const f=u.aprovados.filter(e=>!FILTRO_APR||e.includes(FILTRO_APR.toLowerCase()));
          const p=ArchePag.recorte("us-aprovados",f,()=>render(ULTIMO));
          return p.barra + p.itens.map(e=>`<div class="u"><span class="em">${esc(e)}</span><span class="badge b-a">submissor</span>
            <button class="bt bt-err" onclick="agir('remover','${esc(e)}')">✕ Revogar</button></div>`).join("")
            + (f.length?"":'<div class="muted">Nenhum e-mail com esse filtro.</div>');})()}`
      :'<div class="muted">Nenhum aprovado manualmente (contas @uniego.edu.br entram sozinhas e não precisam aparecer aqui).</div>'}
      <div class="add"><input id="novo-email" type="email" placeholder="aprovar e-mail externo (ex.: professor@gmail.com)">
        <button class="bt bt-ok" onclick="agir('aprovar',$('novo-email').value.trim())">＋ Aprovar</button></div>
    </div>

    <div class="card"><div class="sec">👑 Gestores gerais (${u.gestores.length})</div>
      ${u.gestores.map(e=>`<div class="u"><span class="em">${esc(e)}</span><span class="badge b-g">gestor geral</span>
        ${FIXOS.includes(e)?'<span class="muted">fixo (PROPPEX)</span>':`<button class="bt bt-err" onclick="agir('remover','${esc(e)}')">✕ Remover</button>`}</div>`).join("")}
    </div>

    <div class="card"><div class="sec">🔑 Senha provisória</div>
      <div class="muted" style="margin-bottom:8px">Para quem perdeu o acesso ao e-mail e não consegue receber o
        código de entrada. A senha que você definir <b>vale 7 dias</b> e serve para um único fim: a pessoa entra
        com ela e é obrigada a criar a própria senha ali mesmo, antes de seguir. Repasse a senha por um canal
        seguro (pessoalmente ou por telefone). Conta de gestor não entra aqui.</div>
      <div class="add">
        <input id="sp-email" list="emails" type="email" placeholder="e-mail da pessoa">
        <input id="sp-senha" type="text" placeholder="senha provisória (mín. 8 caracteres)" autocomplete="off">
        <button class="bt bt-ok" onclick="senhaProvisoria()">🔑 Definir</button>
      </div>
      <div class="muted" id="sp-aviso" style="margin-top:8px"></div>
    </div>`;
}
async function senhaProvisoria(){
  const email=$("sp-email").value.trim(), senha=$("sp-senha").value;
  if(!email){alert("Informe o e-mail.");return;}
  if(!senha){alert("Digite a senha provisória.");return;}
  if(!confirm(`Definir senha provisória para ${email}?\n\nEla vale 7 dias e obriga a troca no primeiro acesso.`))return;
  const r=await fetch("/api/usuarios/senha",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email,senha})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){alert("Falha: "+(j.error||r.status));return;}
  $("sp-senha").value="";
  $("sp-aviso").innerHTML=`✓ Senha provisória definida para <b>${esc(j.email)}</b>. Vale ${j.validaDias} dias —
    no primeiro acesso a pessoa cria a senha definitiva. Anote e repasse com segurança; ela não aparece de novo.`;
}
/* ======================= painel de usuários ==========================
   A outra metade desta tela: o CADASTRO das pessoas (nome, função, curso,
   contato) e o retrato de que setores cada uma usa de fato — contado nos
   próprios registros: projetos de IC, ações de extensão e atas lavradas.
   Papel no sistema (o que pode) fica na aba de acessos; aqui é quem é. */
let PAINEL={usuarios:[],funcoes:[],cursos:[],modulos:[]};
/* A paginação é a compartilhada do portal (assets/arche-paginacao.js): esta
   tela chegou a ter DUAS cópias quase iguais da mesma regra, e duas cópias
   acabam diferentes — uma lembrava o tamanho escolhido, a outra não. */
let FU={q:"",funcao:"",setor:"",papel:"",conta:""};
const SETOR_NOME={pesquisa:"Pesquisa · IC",extensao:"Extensão",atas:"Atas"};
const funcaoNome=(c,outro)=>{
  const f=PAINEL.funcoes.find(x=>x.codigo===c);
  if(!f)return String(outro||"")||"—";
  return f.codigo==="outro"?(String(outro||"").trim()||"Outro"):f.nome;
};
/* O curso é gravado pelo NOME — é o que o /perfil/ escreve, e duas
   grafias para a mesma coisa fariam a pessoa não conseguir salvar o próprio
   perfil depois de a gestão editar. Na leitura, aceita slug ou nome. */
const cursoNome=(v)=>{
  const c=PAINEL.cursos.find(x=>x.nome===v||x.slug===v);
  return c?c.nome:(v||"—");
};
const mesmoCurso=(a,b)=>{
  const c=PAINEL.cursos.find(x=>x.nome===a||x.slug===a);
  return c?(c.nome===b||c.slug===b):a===b;
};

function aba(qual){
  ["usuarios","acessos","avisos"].forEach(k=>{
    $("ab-"+k).classList.toggle("on",qual===k);
    $("v-"+k).classList.toggle("hide",qual!==k);
  });
  if(qual==="avisos") carregarAvisos();
}

/* ======================================================================
   ENVIOS AUTOMÁTICOS (pedido do dono, ago/2026)

   O mesmo aviso é informação ou ruído conforme a época: no pico da
   indicação de bolsistas, um e-mail a cada movimento da IC cansa; fora do
   ciclo, é ele que faz a pró-reitoria saber que um aluno foi indicado. Por
   isso o interruptor tem TRÊS posições — ligado, silenciado ATÉ uma data
   (a pausa que se desfaz sozinha, para o pico não virar um desligamento
   esquecido) e desligado.

   A tela separa o que é AVISO À GESTÃO do que é MENSAGEM A UMA PESSOA:
   calar o primeiro não quebra processo nenhum (o sino continua lá); calar
   o segundo deixa alguém sem convite, sem credencial ou sem saber que tem
   entrega a fazer — e a linha diz exatamente o que se perde.
   ====================================================================== */
let AVISOS=null;

async function carregarAvisos(){
  if(AVISOS) return renderAvisos();
  const r=await fetch("/api/avisos");
  if(!r.ok){ $("v-avisos").innerHTML="Acesso restrito à PROPPEX."; return; }
  AVISOS=await r.json();
  renderAvisos();
}

function renderAvisos(){
  const hoje=new Date(Date.now()-3*3600*1000).toISOString().slice(0,10);
  const calados=(AVISOS.avisos||[]).filter(a=>!a.ligado).length;
  const linha=(a)=>{
    const sel=(v,r)=>`<option value="${v}"${a.estado===v?" selected":""}>${r}</option>`;
    return `<div class="av-linha${a.ligado?"":" av-off"}">
      <div class="av-txt">
        <div class="av-t">${esc(a.rotulo)}
          <span class="av-tag ${a.destino==="gestao"?"g":"p"}">${a.destino==="gestao"?"aviso à gestão":"mensagem a uma pessoa"}</span>
          ${a.critico?'<span class="av-tag c">calar tem consequência</span>':""}</div>
        <div class="av-d">${esc(a.texto)}</div>
        <div class="av-d av-se"><b>Se desligar:</b> ${esc(a.seDesligar)}</div>
        ${a.vencido?`<div class="av-d av-ok">O silêncio venceu em ${(a.ate||'').split('-').reverse().join('/')} — voltou a enviar.</div>`
          :a.estado==="silenciado"&&a.ate?`<div class="av-d av-ok">Silenciado até ${(a.ate||'').split('-').reverse().join('/')}; volta sozinho no dia seguinte.</div>`:""}
      </div>
      <div class="av-ctl">
        <select onchange="mudarAviso('${a.codigo}',this.value)">
          ${sel("ligado","Enviando")}${sel("silenciado","Silenciar até…")}${sel("desligado","Desligado")}
        </select>
        ${a.estado==="silenciado"?`<input type="date" min="${hoje}" value="${esc(a.ate||"")}"
          onchange="mudarAviso('${a.codigo}','silenciado',this.value)">`:""}
      </div>
    </div>`;
  };
  $("v-avisos").innerHTML=`
    <div class="card">
      <div class="sec">Envios automáticos de e-mail</div>
      <p class="muted" style="margin:8px 0 0">Tudo o que o ARCHÉ manda sozinho está aqui, por setor.
        Use <b>Silenciar até</b> quando for questão de época — a pausa se desfaz na data, sem depender
        de alguém lembrar de religar. ${calados?`<b>${calados}</b> aviso(s) fora do ar agora.`:"Todos ativos."}</p>
      <p class="muted" style="margin:8px 0 0;font-size:12.5px">O código de acesso do login não entra
        aqui de propósito: desligá-lo trancaria todo mundo do lado de fora.</p>
    </div>
    ${(AVISOS.setores||[]).map(s=>{
      const meus=(AVISOS.avisos||[]).filter(a=>a.setor===s.chave);
      if(!meus.length) return "";
      return `<div class="card">
        <div class="sec">${esc(s.rotulo)} <span class="muted" style="font-weight:400;font-size:12.5px">· caixa do setor: ${esc(s.caixa)}</span></div>
        ${meus.map(linha).join("")}
      </div>`;
    }).join("")}`;
}

async function mudarAviso(codigo,estado,ate){
  if(estado==="silenciado"&&!ate){
    const a=(AVISOS.avisos||[]).find(x=>x.codigo===codigo);
    ate=a&&a.ate?a.ate:"";
    if(!ate){
      const d=new Date(Date.now()+30*864e5-3*3600*1000).toISOString().slice(0,10);
      ate=prompt("Silenciar este aviso até que dia? (AAAA-MM-DD)\n\nDepois dessa data ele volta a "
        +"enviar sozinho — é o que evita esquecer religado.",d)||"";
      if(!ate) return renderAvisos();
    }
  }
  const r=await fetch("/api/avisos",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({codigo,estado,ate:ate||""})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível salvar."); return renderAvisos(); }
  AVISOS.avisos=j.avisos;
  renderAvisos();
}

async function carregarPainel(){
  const r=await fetch("/api/usuarios/painel");
  if(!r.ok){$("v-usuarios").innerHTML="Acesso restrito à PROPPEX.";return;}
  PAINEL=await r.json();
  renderPainel();
}

function renderPainel(){
  const lista=PAINEL.usuarios.filter(u=>
    (!FU.funcao||u.funcao===FU.funcao)&&
    (!FU.setor||(FU.setor==="__nenhum"?!u.setores.length:u.setores.includes(FU.setor)))&&
    (!FU.papel||u.papel===FU.papel)&&
    (!FU.conta||(FU.conta==="externa-docente"?(u.externa&&u.declarouDocencia)
      :FU.conta==="externa"?u.externa
      :FU.conta==="institucional"?!u.externa
      :FU.conta==="removido"?u.removido:true))&&
    (!FU.q||`${u.nome} ${u.email} ${u.curso}`.toLowerCase().includes(FU.q.toLowerCase())));
  const semNome=PAINEL.usuarios.filter(u=>!u.temPerfil).length;
  const pg=ArchePag.recorte("us-painel",lista,renderPainel);

  $("v-usuarios").innerHTML=blocoDuplicidades()+`
    <div class="card">
      <div class="filtros-u">
        <input placeholder="🔎 Buscar por nome, e-mail ou curso" value="${esc(FU.q)}"
          oninput="FU.q=this.value;ArchePag.zerar('us-painel');clearTimeout(window.__t);window.__t=setTimeout(renderPainel,250)">
        <select onchange="FU.funcao=this.value;ArchePag.zerar('us-painel');renderPainel()">
          <option value="">Função: todas</option>
          ${PAINEL.funcoes.map(f=>`<option value="${f.codigo}" ${FU.funcao===f.codigo?"selected":""}>${esc(f.nome)}</option>`).join("")}
        </select>
        <select onchange="FU.setor=this.value;ArchePag.zerar('us-painel');renderPainel()">
          <option value="">Setor em uso: todos</option>
          ${Object.entries(SETOR_NOME).map(([k,v])=>`<option value="${k}" ${FU.setor===k?"selected":""}>${esc(v)}</option>`).join("")}
          <option value="__nenhum" ${FU.setor==="__nenhum"?"selected":""}>Ainda não usou nenhum</option>
        </select>
        <select onchange="FU.papel=this.value;ArchePag.zerar('us-painel');renderPainel()">
          <option value="">Papel: todos</option>
          ${["gestor","coordenador","aprovado","pendente"].map(p=>`<option value="${p}" ${FU.papel===p?"selected":""}>${p}</option>`).join("")}
        </select>
        <select onchange="FU.conta=this.value;ArchePag.zerar('us-painel');renderPainel()" title="O cadastro é aberto a qualquer e-mail — é o que permite ao professor sem @uniego trabalhar. A conferência é depois, aqui.">
          <option value="">Conta: todas</option>
          <option value="externa-docente" ${FU.conta==="externa-docente"?"selected":""}>Externa que se declarou docência</option>
          <option value="externa" ${FU.conta==="externa"?"selected":""}>Externa (sem @uniego)</option>
          <option value="institucional" ${FU.conta==="institucional"?"selected":""}>Institucional (@uniego)</option>
          <option value="removido" ${FU.conta==="removido"?"selected":""}>Acesso encerrado pela gestão</option>
        </select>
        <button class="bt bt-pri" onclick="abrirFicha('')">＋ Incluir usuário</button>
      </div>
      <div class="muted" style="margin-bottom:10px">${lista.length} de ${PAINEL.usuarios.length} usuário(s)${
        semNome?` · <b>${semNome}</b> ainda sem cadastro preenchido`:""}${
        (()=>{const n=PAINEL.usuarios.filter(u=>u.preCadastro).length;
          return n?` · <b>${n}</b> em pré-cadastro (a PROPPEX preencheu; a pessoa ainda não entrou)`:"";})()}.</div>
      <div class="rolo"><table class="us">
        <thead><tr><th>Pessoa</th><th>Função</th><th>Curso</th><th>Setores em uso</th><th>Papel</th><th></th></tr></thead>
        <tbody>${pg.itens.map(u=>`<tr>
          <td><div class="nm">${esc(u.nome||"— sem cadastro —")}
            ${u.preCadastro?'<span class="badge" style="background:var(--warn-soft);color:var(--warn)">pré-cadastro</span>':""}
            ${u.externa&&u.declarouDocencia?'<span class="badge" style="background:var(--info-soft);color:var(--info)" title="Conta fora do @uniego.edu.br que se declarou professor(a) ou coordenação. A declaração não concede papel nenhum — serve para os setores tratarem a pessoa como docente.">externa · docência</span>':""}
            ${u.removido?'<span class="badge" style="background:var(--err-soft);color:var(--err)" title="A gestão encerrou o acesso desta conta. Ela não volta sozinha no próximo login.">acesso encerrado</span>':""}</div>
            <div class="em">${esc(u.email)}</div></td>
          <td>${esc(funcaoNome(u.funcao,u.funcaoOutro))}</td>
          <td>${u.curso?esc(cursoNome(u.curso)):"—"}</td>
          <td>${u.setores.length?u.setores.map(k=>`<span class="setor">${esc(SETOR_NOME[k])} · ${u.uso[k]}</span>`).join(""):'<span class="muted">—</span>'}</td>
          <td><span class="badge p-${esc(u.papel)}">${esc(u.papel)}</span>
            ${u.modulos.length&&u.papel==="coordenador"?`<div class="em">${u.modulos.map(rotulo).join(", ")}</div>`:""}</td>
          <td><button class="bt bt-sec" onclick="abrirFicha('${esc(u.email)}')">Editar</button></td>
        </tr>`).join("")||`<tr><td colspan="6" class="muted">Ninguém encontrado com esses filtros.</td></tr>`}</tbody>
      </table></div>
      ${pg.barra}
    </div>`;
}

/* ---------------------- cadastros duplicados ---------------------------- *
   A mesma pessoa entra duas vezes com facilidade (e-mail pessoal e depois o
   institucional; pré-cadastro do edital num endereço que ela não usa mais).
   O sistema APONTA pelo nome — quem funde é a gestão, dizendo qual conta
   fica, depois de ver o que sai de uma para a outra. */
function blocoDuplicidades(){
  const dups=PAINEL.duplicidades||[];
  if(!dups.length) return "";
  return `<div class="card" style="border-color:#ffe0b2;background:#fffdf7">
    <div class="card-t">Cadastros repetidos — ${dups.length} pessoa(s)</div>
    <div class="card-s">Contas diferentes com o mesmo nome. Se for a mesma pessoa, funda:
      os projetos, as ações e as atas passam para a conta que ficar, e o cadastro se completa
      com o que faltava. O sistema mostra antes o que vai sair de uma para a outra.</div>
    ${dups.map(d=>`<div class="linha-dup">
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(d.nome)}</div>
        <div class="em">${d.contas.map(c=>`${esc(c.email)}${c.temCpf?" · com CPF":""}${
          c.preCadastro?" · pré-cadastro":""}${c.setores.length?` · ${c.setores.length} setor(es) em uso`:""}`).join(" &nbsp;|&nbsp; ")}</div>
      </div>
      ${d.contas.length===2
        ? `<button class="bt bt-sec" onclick="abrirFusao('${esc(d.contas[0].email)}','${esc(d.contas[1].email)}')">Fundir…</button>`
        : `<span class="muted">${d.contas.length} contas — funda duas por vez</span>`}
    </div>`).join("")}
  </div>`;
}

/* A fusão em dois passos: primeiro a prévia do que se move, depois o aceite.
   O que se apaga aqui não se desfaz sozinho. */
async function fundir(corpo){
  const r=await fetch("/api/usuarios/fundir",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(corpo)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||("Falha "+r.status));
  return j;
}
async function abrirFusao(a,b){
  const qual=prompt(`Qual conta FICA?\n\n1 — ${a}\n2 — ${b}\n\nA outra é removida, e tudo o que era dela passa para a que ficar.`,"1");
  if(!qual) return;
  const manter=String(qual).trim()==="2"?b:a, remover=manter===a?b:a;
  try{
    const previa=await fundir({manter,remover,simular:true});
    const linhas=[
      `FICA:   ${manter}`,
      `REMOVE: ${remover}`,
      "",
      `Projetos de IC que passam: ${previa.projetos}`,
      `Ações de extensão: ${previa.acoes}`,
      `Atas: ${previa.atas}`,
      previa.campos.length?`Completa no cadastro: ${previa.campos.join(", ")}`:"Cadastro: nada a completar",
      previa.papel&&previa.papel!=="pendente"?`Papel herdado: ${previa.papel}${previa.modulos.length?` (${previa.modulos.join(", ")})`:""}`:"",
      ...(previa.avisos||[]).map(x=>`(!) ${x}`),
      "",
      "A fusão não se desfaz sozinha. Confirmar?",
    ].filter(Boolean);
    if(!confirm(linhas.join("\n"))) return;
    const r=await fundir({manter,remover});
    await carregarPainel();
    alert(`Cadastros fundidos.\n\n${r.projetos} projeto(s), ${r.acoes} ação(ões) e ${r.atas} ata(s) passaram para ${manter}.`);
  }catch(e){ alert(e.message); }
}

function abrirFicha(email){
  const u=PAINEL.usuarios.find(x=>x.email===email)||{email:"",nome:"",funcao:"",funcaoOutro:"",curso:"",titulacao:"",matricula:"",telefone:"",lattes:""};
  const novo=!email;
  $("ficha").innerHTML=`<div class="ficha" onclick="if(event.target===this)fecharFicha()"><div class="cx">
    <h3>${novo?"Incluir usuário":"Editar cadastro"}</h3>
    <div class="muted" style="margin-bottom:14px">${novo
      ?"O cadastro entra já aprovado como submissor. A pessoa acessa pelo próprio e-mail (código ou Google) — não é preciso senha aqui."
      :`Cadastro de <b>${esc(u.email)}</b>. Papéis e senha ficam na aba de acessos.`}</div>
    <div class="grid2">
      <div><label>E-mail *</label><input id="fi-email" type="email" value="${esc(u.email)}" ${novo?"":"disabled"}></div>
      <div><label>Nome completo *</label><input id="fi-nome" value="${esc(u.nome||"")}"></div>
    </div>
    <div class="grid2">
      <div><label>Função na instituição</label><select id="fi-funcao" onchange="document.getElementById('fi-outro-w').classList.toggle('hide',this.value!=='outro')">
        <option value="">— escolha —</option>
        ${PAINEL.funcoes.map(f=>`<option value="${f.codigo}" ${u.funcao===f.codigo?"selected":""}>${esc(f.nome)}${f.orgao?` · ${f.orgao}`:""}</option>`).join("")}
      </select></div>
      <div><label>Curso / departamento</label><select id="fi-curso">
        <option value="">—</option>
        ${PAINEL.cursos.map(c=>`<option value="${esc(c.nome)}" ${mesmoCurso(u.curso,c.nome)?"selected":""}>${esc(c.nome)}</option>`).join("")}
      </select></div>
    </div>
    <div id="fi-outro-w" class="${u.funcao==="outro"?"":"hide"}">
      <label>Especifique a função</label><input id="fi-outro" value="${esc(u.funcaoOutro||"")}" placeholder="Ex.: Assessoria de Comunicação"></div>
    <div class="grid2">
      <div><label>Titulação</label><select id="fi-titulacao">
        ${["","especialista","mestre","doutor"].map(t=>`<option value="${t}" ${u.titulacao===t?"selected":""}>${t?t[0].toUpperCase()+t.slice(1):"—"}</option>`).join("")}
      </select></div>
      <div><label>Telefone</label><input id="fi-telefone" value="${esc(u.telefone||"")}" placeholder="(62) 9…"></div>
    </div>
    <div class="grid2">
      <div><label>CPF ${u.temCpf?'<span class="muted">(já cadastrado)</span>':""}</label>
        <input id="fi-cpf" placeholder="${u.temCpf?"deixe em branco para manter":"000.000.000-00"}"></div>
      <div><label>Matrícula / SIAPE</label><input id="fi-matricula" value="${esc(u.matricula||"")}"></div>
    </div>
    <label>Currículo Lattes</label><input id="fi-lattes" value="${esc(u.lattes||"")}" placeholder="http://lattes.cnpq.br/…">
    <div class="add" style="margin-top:16px">
      <button class="bt bt-ok" onclick="salvarFicha()">💾 Salvar</button>
      <button class="bt bt-ghost" onclick="fecharFicha()">Cancelar</button>
    </div>
    <div class="muted" id="fi-aviso" style="margin-top:10px"></div>
  </div></div>`;
}
const fecharFicha=()=>{$("ficha").innerHTML="";};

async function salvarFicha(){
  const corpo={
    email:$("fi-email").value.trim(), nome:$("fi-nome").value.trim(),
    funcao:$("fi-funcao").value, funcaoOutro:$("fi-outro")?$("fi-outro").value.trim():"",
    curso:$("fi-curso").value, titulacao:$("fi-titulacao").value,
    telefone:$("fi-telefone").value.trim(), matricula:$("fi-matricula").value.trim(),
    lattes:$("fi-lattes").value.trim(),
  };
  const cpf=$("fi-cpf").value.trim();
  if(cpf)corpo.cpf=cpf;
  if(!corpo.email||!corpo.nome){$("fi-aviso").textContent="Informe o e-mail e o nome.";return;}
  const r=await fetch("/api/usuarios/perfil",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corpo)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){$("fi-aviso").innerHTML=`<b style="color:var(--err)">${esc(j.error||("Falha "+r.status))}</b>`;return;}
  fecharFicha();
  await carregarPainel();
  const vinc=j.vinculo&&j.vinculo.projetos?` ${j.vinculo.projetos} projeto(s) vinculado(s) pelo CPF.`:"";
  alert((j.criado?"Usuário incluído. Ele já pode entrar com esse e-mail.":"Cadastro atualizado.")+vinc);
}

carregarPainel();
fetch("/api/usuarios").then(async r=>{
  if(!r.ok){$("v-acessos").innerHTML="Acesso restrito à PROPPEX.";return;}
  render(await r.json());
});
