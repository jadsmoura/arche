<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHÉ EX · Extensão · PROPPEX / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
  :root{
    --brand:#1c3742; --brand-2:#2d535c; --brand-3:#40717e; --accent:#71c8e2;
    --bg:#ebeef3; --card:#fff; --line:#e3e7ee; --line-2:#f0f2f6; --trilho:#eef1f5;
    --ink:#1c3742; --ink-soft:#3a4650; --muted:#7c8794; --muted-2:#a9b4c0;
    --ok:#3f8a5d; --ok-soft:#e5f3ea; --warn:#c98a2b; --warn-soft:#fbf3e4;
    --err:#a1524c; --err-soft:#f6e9e7; --info:#40717e; --info-soft:#e8f4fa;
    --roxo:#5e5091; --roxo-soft:#ecebf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-3);text-decoration:none}
  a:hover{color:var(--brand-2)}
  ::selection{background:var(--accent);color:var(--brand)}
  button{font-family:Figtree,system-ui,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
  .f-disp{font-family:Sora,sans-serif}

  /* ------------------------------- casca -------------------------------- */
  .app{display:flex;min-height:100vh}
  .side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side-marca{padding:20px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
  .side-marca b{color:var(--accent);font-weight:800}
  .side-nav{padding:14px 12px;flex:1;overflow-y:auto}
  .side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:8px 12px 6px}
  .side-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
    margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
    border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
    transition:background .15s,color .15s}
  .side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
  .side-item svg{flex:none}
  .side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
  .side-pe .av{width:34px;height:34px;border-radius:50%;background:var(--brand-3);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
  .side-pe .av img{width:100%;height:100%;object-fit:cover}
  .side-pe .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
  .side-pe .pp{font-size:11px;color:rgba(255,255,255,.5)}
  .side-pe .sair{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-weight:600}
  .side-pe .sair:hover{color:#fff}

  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .topbar .dir{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .area{padding:28px 32px;flex:1}
  .limite{max-width:1180px}
  h1{font-family:Sora,sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}

  /* ------------------------------- cartões ------------------------------ */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}
  .card-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;margin-bottom:2px}
  .card-s{font-size:12px;color:var(--muted);margin-bottom:20px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .kpi .v{font-family:Sora,sans-serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:7px;color:var(--muted)}
  .duplo{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.duplo{grid-template-columns:1fr}}
  .barra{margin-bottom:15px}
  .barra .cab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
  .barra .cab span:first-child{color:var(--ink-soft);font-weight:500}
  .barra .cab span:last-child{color:var(--muted);font-weight:600}
  .barra .tr{height:9px;background:var(--trilho);border-radius:5px;overflow:hidden}
  .barra .tr i{display:block;height:100%;border-radius:5px}
  .linha{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .linha:last-child{border-bottom:0}
  .linha .txt{flex:1;min-width:0}
  .linha .p1{font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .linha .p2{font-size:11.5px;color:var(--muted)}
  .ponto{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
  .vazio{font-size:13px;color:var(--muted);padding:10px 0}
  .verTodas{font-size:12px;font-weight:600;color:var(--brand-3);background:none;border:0;cursor:pointer}

  /* ------------------------------ formulários --------------------------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;border:1px solid #cfd6de;border-radius:8px;padding:10px 12px;
    font-family:Figtree,system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{min-height:84px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(64,113,126,.12)}
  .sec-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:22px 0 6px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .muted{color:var(--muted);font-size:12.5px;font-weight:400}
  .kv{margin:4px 0;font-size:13.5px;color:var(--ink-soft)}
  .kv b{color:var(--ink);font-weight:600}

  /* -------------------------------- botões ------------------------------ */
  .bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bt-pri{background:var(--brand);color:#fff}
  .bt-pri:hover{background:var(--brand-2)}
  .bt-sec{background:var(--info-soft);color:var(--brand);border-color:#cfe6f2}
  .bt-sec:hover{background:#dbeef8}
  .bt-ghost{background:#fff;color:var(--muted);border-color:#cfd6de}
  .bt-ghost:hover{color:var(--ink);border-color:var(--brand-3)}
  .bt-ok{background:var(--ok-soft);color:var(--ok);border-color:#cfeeda}
  .bt-warn{background:var(--warn-soft);color:var(--warn);border-color:#f0e0bd}
  .bt-err{background:var(--err-soft);color:var(--err);border-color:#eed6d3}
  .bt:disabled{opacity:.5;cursor:not-allowed}
  .exp{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

  /* ------------------------------- estados ------------------------------ */
  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .b-submetida{background:var(--info-soft);color:var(--info)}
  .b-devolvida{background:var(--err-soft);color:var(--err)}
  .b-aprovada{background:var(--ok-soft);color:var(--ok)}
  .b-pendente{background:var(--warn-soft);color:var(--warn)}
  .b-relatorio-entregue{background:var(--roxo-soft);color:var(--roxo)}
  .b-registrada{background:#eceff3;color:var(--muted)}
  .banner{border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500}
  .ba-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0e0bd}
  .ba-err{background:var(--err-soft);color:var(--err);border:1px solid #eed6d3}
  .ba-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #cfeeda}

  /* -------------------------------- listas ------------------------------ */
  .item{display:flex;align-items:center;gap:14px;padding:15px 18px;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .item:hover{border-color:var(--brand-3);box-shadow:0 2px 10px -4px rgba(28,55,66,.18)}
  .item .nm{font-weight:600;flex:1;min-width:0;font-size:14px;color:var(--ink)}
  .item .cs{color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px}
  .stat .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .s b{font-family:Sora,sans-serif;font-size:22px;display:block;color:var(--ink);line-height:1.1}
  .stat .s span{font-size:11.5px;color:var(--muted)}
  table.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.pt th{background:#f7f9fb;color:var(--muted);padding:9px 10px;text-align:left;font-size:11.5px;
    font-weight:600;border-bottom:1px solid var(--line)}
  table.pt td{border-bottom:1px solid var(--line-2);padding:8px 10px;color:var(--ink-soft)}
  table.pt td.bad{color:var(--err);font-weight:600}
  table.pt .rm{color:var(--err);cursor:pointer;font-weight:700}
  table.pt a{color:var(--brand-3);font-weight:600}
  .cnt{font-size:12.5px;color:var(--muted);margin:8px 0}
  .colmap{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .colmap select{width:auto;font-size:12.5px;padding:6px 8px}
  .tut{background:var(--info-soft);border:1px solid #cfe6f2;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px}
  .tut summary{font-family:Sora,sans-serif;font-weight:700;color:var(--brand);cursor:pointer;font-size:13.5px}
  .tut ol{margin:10px 0 4px 20px}
  .tut li{margin-bottom:5px}
  .tut .dica{background:#fff;border-radius:8px;padding:9px 12px;margin-top:8px;border:1px dashed #a9cfe0}
  .hide{display:none!important}
  /* itens de grade não podem ser mais largos que a coluna: sem isto, um
     título longo com white-space:nowrap estoura a página no celular */
  .duplo>*,.kpis>*,.stat>*,.grid2>*,.grid3>*{min-width:0}

  @media(max-width:760px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .side-nav{padding:8px 10px;flex:1 1 100%;order:3;overflow-x:auto}
    .side-nav #menu{display:flex;gap:6px}
    .side-lab{display:none}
    .side-item{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px}
    .side-item.on{border-left:0;border-bottom-color:var(--accent)}
    .side-pe{border-top:0;margin-left:auto}
    .area{padding:20px 16px}
    .kpis{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <!-- barra lateral -->
  <nav class="side">
    <a class="side-marca" href="/" title="Voltar ao portal">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 37 L8 20 A12 12 0 0 1 32 20 L32 37" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4" fill="#71c8e2"/></svg>
      <span>ARCHÉ <b>EX</b></span>
    </a>
    <div class="side-nav">
      <div class="side-lab">GESTÃO</div>
      <div id="menu"></div>
    </div>
    <div class="side-pe" id="rodape-usuario"></div>
  </nav>

  <!-- conteúdo -->
  <div class="conteudo">
    <div class="topbar">
      <div class="crumb">ARCHÉ EX <span style="color:var(--muted-2)">/</span> <b id="crumb">Painel</b></div>
      <div class="dir"><span id="dir-info"></span></div>
    </div>

    <div class="area">
      <div class="limite">
        <h1 id="titulo">Painel</h1>
        <div class="sub" id="subtitulo">Visão geral das ações de extensão.</div>
        <div id="aviso-visao"></div>

        <!-- ============ PAINEL ============ -->
        <section id="v-painel" class="hide"></section>

        <!-- ============ NOVA PROPOSTA ============ -->
        <section id="v-nova" class="hide">
          <div class="card">
            <div class="sec-t" style="margin-top:0">Identificação</div>
            <div class="grid2">
              <div><label>Curso / Departamento responsável *</label>
                <select id="f-curso"></select></div>
              <div><label>Nome da atividade *</label>
                <input id="f-nome" placeholder="Ex.: XII Semana de Enfermagem"></div>
            </div>
            <div class="grid2">
              <div><label>Classificação *</label>
                <select id="f-class">
                  <option>Evento</option><option>Projeto</option><option>Curso Livre</option>
                  <option>Prestação de Serviço</option><option>Produção Cultural</option>
                  <option>Atividade Desportiva</option><option>Atividade Assistencial</option>
                  <option>Atividade Artística</option><option>Outro</option>
                </select></div>
              <div id="f-class-outro-w" class="hide"><label>Especifique (Outro)</label>
                <input id="f-class-outro"></div>
              <div><label>Tema central (se houver)</label><input id="f-tema"></div>
            </div>
            <div class="grid3">
              <div><label>Início *</label><input type="date" id="f-inicio"></div>
              <div><label>Término *</label><input type="date" id="f-fim"></div>
              <div><label>Carga horária (h) *</label><input type="number" id="f-ch" min="1"></div>
            </div>
            <div class="grid3">
              <div><label>Público-alvo *</label><input id="f-publico" placeholder="Acadêmicos e docentes do curso"></div>
              <div><label>Local de realização *</label><input id="f-local"></div>
              <div><label>Município *</label><input id="f-municipio" value="Goianésia/GO"></div>
            </div>

            <div class="sec-t">Projeto</div>
            <label>Justificativa *</label><textarea id="f-justificativa"></textarea>
            <label>Objetivo geral *</label><textarea id="f-objgeral" style="min-height:60px"></textarea>
            <label>Objetivos específicos * <span class="muted">(um por linha)</span></label><textarea id="f-objesp"></textarea>
            <label>Metodologia *</label><textarea id="f-metodologia"></textarea>
            <label>Programação <span class="muted">(datas, atividades, ministrantes)</span></label><textarea id="f-programacao" style="min-height:120px"></textarea>
            <label>Certificação solicitada <span class="muted">(quem deve receber certificado)</span></label><textarea id="f-cert" style="min-height:60px"></textarea>
            <label>Comissão organizadora</label><textarea id="f-comissao" style="min-height:60px"></textarea>

            <div class="sec-t">Recursos e parcerias</div>
            <div class="grid3">
              <div><label>Instalações</label><input id="f-rec-inst" placeholder="Não se aplica"></div>
              <div><label>Multimídia</label><input id="f-rec-multi" placeholder="Datashow, computadores…"></div>
              <div><label>Outros recursos</label><input id="f-rec-outros" placeholder="Não se aplica"></div>
            </div>
            <label>Parcerias externas</label><input id="f-parceria" placeholder="Ex.: COREN-GO">

            <div class="sec-t">Responsável pela ação</div>
            <div class="grid2">
              <div><label>Nome completo *</label><input id="f-resp-nome"></div>
              <div><label>Cargo / função *</label><input id="f-resp-cargo"></div>
              <div><label>Telefone *</label><input id="f-resp-tel"></div>
              <div><label>E-mail *</label><input id="f-resp-email" type="email"></div>
            </div>

            <div style="margin-top:22px;display:flex;gap:10px;align-items:center">
              <button class="bt bt-pri" onclick="enviarProposta()">Enviar proposta à PROPPEX</button>
              <span class="muted" id="f-msg"></span>
            </div>
          </div>
        </section>

        <!-- ============ LISTA DE AÇÕES ============ -->
        <section id="v-acoes" class="hide">
          <div class="stat" id="stats"></div>
          <div class="card">
            <div class="grid3">
              <div><label style="margin-top:0">Filtrar por curso</label><select id="l-curso"></select></div>
              <div><label style="margin-top:0">Filtrar por situação</label>
                <select id="l-status">
                  <option value="">Todas</option>
                  <option value="submetida">Submetida (aguardando análise)</option>
                  <option value="devolvida">Devolvida para ajustes</option>
                  <option value="aprovada">Aprovada</option>
                  <option value="pendente">Relatório pendente</option>
                  <option value="relatorio-entregue">Relatório entregue</option>
                  <option value="registrada">Registrada</option>
                </select></div>
              <!-- o ciclo da ação é o ano em que ela encerra -->
              <div><label style="margin-top:0">Filtrar por ciclo</label><select id="l-ano"></select></div>
            </div>
          </div>
          <div id="devedores"></div>
          <div id="lista"></div>
        </section>

        <!-- ============ COBRANÇAS ============ -->
        <section id="v-cobrancas" class="hide"></section>
        <section id="v-certificados" class="hide"></section>

        <!-- ============ DETALHE DA AÇÃO ============ -->
        <section id="v-detalhe" class="hide"></section>
      </div>
    </div>
  </div>
</div>

<script>

/* ============================== BASE ==================================== */
const CURSOS = ["Administração","Agronomia","Ciências Contábeis","Direito","Educação Física",
  "Enfermagem","Engenharia Civil","Engenharia de Software","Engenharia Mecânica",
  "Medicina Veterinária","Odontologia","Psicologia","Institucional / PROPPEX"];
// as ações vêm de /api/extensao (recorte por pessoa); só a configuração
// do setor continua no estado comum
const KEYCFG = "extensao-config-v1";
// GESTAO = o que a conta realmente é. PROPPEX = o que a tela está mostrando.
// A PROPPEX pode assistir ao sistema como um professor veria — útil para
// orientar docentes sem precisar de outra conta. É apenas uma visão: as
// permissões do servidor continuam valendo para a conta real.
let GESTAO = false, PROPPEX = false, ME = null;
let MODO_PROF = sessionStorage.getItem("arche-ex-visao") === "professor";
let ACOES = [];
// id da proposta devolvida que está sendo corrigida no formulário (null = nova)
let EDITANDO = null;

async function stGet(chave){
  const r = await fetch("/api/estado?chave="+encodeURIComponent(chave));
  if(!r.ok) return null;
  return (await r.json()).value;
}
async function stSet(chave, valor){
  const r = await fetch("/api/estado",{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chave, valor})});
  if(!r.ok) throw new Error("Falha ao salvar");
}
async function carregar(){
  // As ações NÃO passam mais pelo /api/estado: elas guardam CPF e contato de
  // participantes, e ali qualquer conta aprovada baixava a base inteira. O
  // recorte agora é do servidor — o professor recebe as suas, a gestão todas.
  const r = await fetch("/api/extensao");
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || "Falha ao carregar as ações");
  const j = await r.json();
  ACOES = j.acoes || [];
  // normaliza registros antigos/importados: sem isso, uma ação sem o bloco de
  // participantes quebra a tela de detalhe ao renderizar as listas
  for(const a of ACOES){
    a.proposta = a.proposta || {};
    a.relatorio = a.relatorio || {};
    const p = a.participantes || (a.participantes = {});
    p.inscritos = p.inscritos || []; p.palestrantes = p.palestrantes || []; p.comissao = p.comissao || [];
  }
  montarAnos();   // a lista de ciclos sai das próprias ações
}
/* Grava as ações que esta tela conhece. O servidor aceita uma a uma, só as
   que a pessoa pode editar, e não apaga o que não veio no corpo — a lista
   daqui é um recorte, e salvar não pode sumir com a ação de outro. */
async function salvar(){
  const r = await fetch("/api/extensao",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({acoes:ACOES})});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || "Falha ao salvar");
  const j = await r.json();
  if(Array.isArray(j.acoes)) ACOES = j.acoes;
}

const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Data de hoje no fuso institucional (America/Sao_Paulo). Com toISOString()
// o dia virava às 21h de Brasília e a tela marcava "Relatório pendente" um dia
// antes da cobrança automática enviada pelo servidor.
const hojeISO = ()=>{
  try{
    return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",
      year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  }catch{
    return new Date(Date.now()-3*3600*1000).toISOString().slice(0,10);
  }
};
function statusReal(a){
  if(a.status==="aprovada" && a.proposta?.periodoFim && a.proposta.periodoFim < hojeISO()) return "pendente";
  return a.status;
}
const STATUS_LABEL = {submetida:"Submetida", devolvida:"Devolvida p/ ajustes", aprovada:"Aprovada",
  pendente:"Relatório pendente", "relatorio-entregue":"Relatório entregue", registrada:"Registrada"};

// Completude do fluxo: ① proposta · ② relatório final · ③ participantes
function completude(a){
  const c = {
    proposta: true,
    relatorio: !!(a.relatorio && a.relatorio.entregueEm),
    participantes: (a.participantes?.inscritos||[]).length > 0,
  };
  c.completa = c.proposta && c.relatorio && c.participantes;
  return c;
}
function marcas(a){
  const c = completude(a);
  const mk=(ok,rot)=>`<span style="font-size:11px;font-weight:700;color:${ok?"var(--ok)":"var(--muted)"}">${ok?"✓":"○"} ${rot}</span>`;
  return `<div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap">
    ${mk(c.proposta,"Proposta")} ${mk(c.relatorio,"Relatório final")} ${mk(c.participantes,"Participantes")}
    <span class="badge" style="background:${c.completa?"var(--ok-soft)":"var(--warn-soft)"};color:${c.completa?"var(--ok)":"var(--warn)"}">${c.completa?"COMPLETA":"INCOMPLETA"}</span>
  </div>`;
}

// Relatórios e Certificação reaproveitam a lista, com recorte próprio.
function passaPreset(a){
  if(SECAO==="relatorios") return ["pendente","relatorio-entregue"].includes(statusReal(a));
  return true;
}

function nav(secao, id){
  if(secao!=="detalhe") SECAO = secao;
  document.querySelectorAll("main section, .limite > section").forEach(s=>s.classList.add("hide"));
  document.querySelectorAll(".side-item").forEach(b=>b.classList.toggle("on", b.dataset.k===SECAO));
  const meta = SECOES.find(s=>s.k===SECAO) || SECOES[0];
  $("aviso-visao").innerHTML = bannerVisao();

  if(secao==="detalhe"){
    const a = ACOES.find(x=>x.id===id);
    $("titulo").textContent = a?.proposta?.nomeAtividade || "Ação de extensão";
    $("subtitulo").textContent = a ? `${a.curso||""} · ${a.numeroAcao?("Ação "+a.numeroAcao):"sem número"}` : "";
    $("crumb").textContent = meta.rot + " › detalhe";
    renderDetalhe(id); $("v-detalhe").classList.remove("hide");
    window.scrollTo(0,0); return;
  }

  $("titulo").textContent = meta.tit;
  $("subtitulo").textContent = meta.sub;
  $("crumb").textContent = meta.rot;

  if(secao==="painel"){ renderPainel(); $("v-painel").classList.remove("hide"); }
  else if(secao==="certificados"){ renderCertificados(); $("v-certificados").classList.remove("hide"); }
  else if(secao==="cobrancas"){ renderCobrancas(); $("v-cobrancas").classList.remove("hide"); }
  else if(secao==="nova"){ $("v-nova").classList.remove("hide"); }
  else { renderLista(); $("v-acoes").classList.remove("hide"); }
  window.scrollTo(0,0);
}

/* =============================== PAINEL ================================= */
const CORES = {submetida:"#40717e", devolvida:"#a1524c", aprovada:"#3f8a5d",
  pendente:"#c98a2b", "relatorio-entregue":"#5e5091", registrada:"#a9b4c0"};
const diasEntre=(iso)=>Math.round((new Date(iso+"T12:00:00Z")-new Date(hojeISO()+"T12:00:00Z"))/86400000);

function renderPainel(){
  const universo = minhas();
  const st = {}; for(const a of universo){ const s=statusReal(a); st[s]=(st[s]||0)+1; }
  const total = universo.length;
  const completas = universo.filter(a=>completude(a).completa).length;
  const pendentes = st["pendente"]||0;
  const aguardando = (st["submetida"]||0)+(st["devolvida"]||0);
  const ativas = st["aprovada"]||0;

  const kpi=(l,v,d,cor)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>
    <div class="d" style="color:${cor||"var(--muted)"}">${d}</div></div>`;
  const kpis = `<div class="kpis">
    ${kpi("Propostas submetidas", total, `${universo.filter(a=>(a.criadoEm||"").slice(0,4)===String(new Date().getFullYear())).length} neste ano`, "var(--muted)")}
    ${kpi("Aguardando análise", aguardando, aguardando?"exigem parecer da PROPPEX":"nada na fila", aguardando?"var(--info)":"var(--ok)")}
    ${kpi("Aprovadas / em andamento", ativas, "com número de ação", "var(--muted)")}
    ${kpi("Relatórios pendentes", pendentes, pendentes?"ação encerrada sem relatório":"em dia", pendentes?"var(--warn)":"var(--ok)")}
    ${kpi("Ações completas", completas, "proposta · relatório · participantes", completas?"var(--ok)":"var(--muted)")}
  </div>`;

  const ordem = ["submetida","devolvida","aprovada","pendente","relatorio-entregue","registrada"];
  const barras = ordem.filter(s=>st[s]).map(s=>{
    const pct = total? Math.round((st[s]/total)*100) : 0;
    return `<div class="barra"><div class="cab"><span>${STATUS_LABEL[s]}</span><span>${st[s]}</span></div>
      <div class="tr"><i style="width:${pct}%;background:${CORES[s]}"></i></div></div>`;
  }).join("") || '<div class="vazio">Nenhuma ação registrada ainda.</div>';

  // fila de trabalho: o que precisa de ação agora
  const fila = PROPPEX
    ? universo.filter(a=>["submetida","devolvida"].includes(statusReal(a)))
        .concat(universo.filter(a=>statusReal(a)==="relatorio-entregue"))
    : universo.filter(a=>["pendente","devolvida"].includes(statusReal(a)));
  const filaHtml = fila.length ? fila.slice(0,6).map(a=>{
    const s = statusReal(a);
    return `<div class="linha" style="cursor:pointer" onclick="nav('detalhe','${a.id}')">
      <div class="txt"><div class="p1">${esc(a.proposta.nomeAtividade)}</div>
        <div class="p2">${esc(a.curso)}${a.numeroAcao?" · "+esc(a.numeroAcao):""} · ${fmt(a.proposta.periodoFim)}</div></div>
      <span class="badge b-${s}">${STATUS_LABEL[s]}</span></div>`;
  }).join("") : `<div class="vazio">${PROPPEX?"Nenhuma proposta aguardando análise.":"Você não tem pendências. 🎉"}</div>`;

  // encerramentos próximos e relatórios em atraso
  const prazos = universo.filter(a=>["aprovada","pendente"].includes(statusReal(a)) && a.proposta.periodoFim)
    .map(a=>({a, d:diasEntre(a.proposta.periodoFim)}))
    .filter(x=>x.d<=30)
    .sort((x,y)=>x.d-y.d).slice(0,6);
  const prazosHtml = prazos.length ? prazos.map(({a,d})=>{
    const atraso = d<0;
    const txt = atraso ? `relatório em atraso há ${Math.abs(d)} dia${Math.abs(d)===1?"":"s"}`
      : d===0 ? "encerra hoje" : `encerra em ${d} dia${d===1?"":"s"}`;
    return `<div class="linha" style="cursor:pointer" onclick="nav('detalhe','${a.id}')">
      <span class="ponto" style="background:${atraso?"var(--warn)":"var(--accent)"};margin-top:0"></span>
      <div class="txt"><div class="p1">${esc(a.proposta.nomeAtividade)}</div>
        <div class="p2">${esc(a.curso)} · ${fmt(a.proposta.periodoFim)}</div></div>
      <span style="font-size:11.5px;font-weight:600;color:${atraso?"var(--warn)":"var(--muted)"};white-space:nowrap">${txt}</span></div>`;
  }).join("") : '<div class="vazio">Nenhuma ação encerrando nos próximos 30 dias.</div>';

  // fluxo do setor, com a contagem de cada etapa
  const etapa=(rot,n,cor,desc)=>`<div class="linha">
      <span class="ponto" style="background:${cor};margin-top:0"></span>
      <div class="txt"><div class="p1">${rot}</div><div class="p2">${desc}</div></div>
      <span style="font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink)">${n}</span></div>`;
  const fluxo = etapa("Proposta submetida", aguardando, "#40717e", "aguardando análise da PROPPEX")
    + etapa("Aprovada", ativas, "#3f8a5d", "com número EXT-AAAA-NNN, em execução")
    + etapa("Relatório final", (st["relatorio-entregue"]||0)+pendentes, "#c98a2b", `${pendentes} pendente(s) · ${st["relatorio-entregue"]||0} entregue(s)`)
    + etapa("Lista de participantes", completas, "#5e5091", "planilha recolhida no relatório final")
    + etapa("Registrada", st["registrada"]||0, "#a9b4c0", "ciclo encerrado");

  // atividade recente a partir das próprias datas das ações
  const eventos = [];
  for(const a of universo){
    const nome = a.proposta.nomeAtividade;
    if(a.criadoEm) eventos.push({q:a.criadoEm, t:`Proposta <b>${esc(nome)}</b> submetida${a.criadoPorNome?" por "+esc(a.criadoPorNome):""}.`});
    if(a.aprovadoEm) eventos.push({q:a.aprovadoEm, t:`Ação <b>${esc(a.numeroAcao||nome)}</b> aprovada pela PROPPEX.`});
    if(a.relatorio?.entregueEm) eventos.push({q:a.relatorio.entregueEm, t:`Relatório final de <b>${esc(nome)}</b> entregue.`});
    const parts=(a.participantes?.inscritos||[]).length;
    if(parts && a.atualizadoEm) eventos.push({q:a.atualizadoEm, t:`${parts} participante(s) lançados em <b>${esc(nome)}</b>.`});
  }
  eventos.sort((x,y)=>String(y.q).localeCompare(String(x.q)));
  const quando=(iso)=>{
    const h=Math.round((Date.now()-new Date(iso))/3600000);
    if(h<1) return "agora há pouco"; if(h<24) return `há ${h} hora${h===1?"":"s"}`;
    const d=Math.round(h/24); return d===1?"ontem":`há ${d} dias`;
  };
  const atividade = eventos.length ? eventos.slice(0,6).map(e=>
    `<div class="linha" style="align-items:flex-start"><span class="ponto"></span>
      <div class="txt"><div style="font-size:13px;color:var(--ink-soft);white-space:normal">${e.t}</div>
        <div class="p2">${quando(e.q)}</div></div></div>`).join("")
    : '<div class="vazio">Sem movimentação recente.</div>';

  $("v-painel").innerHTML = kpis + `
    <div class="duplo">
      <div class="card">
        <div class="card-t">Ações por situação</div>
        <div class="card-s">${total} ação(ões) ${PROPPEX?"no setor":"sob sua responsabilidade"}</div>
        ${barras}
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <div class="card-t" style="margin:0">${PROPPEX?"Aguardando análise":"Suas pendências"}</div>
          <button class="verTodas" onclick="nav('acoes')">Ver todas →</button>
        </div>
        ${filaHtml}
      </div>
    </div>
    <div class="duplo">
      <div class="card">
        <div class="card-t">Fluxo da extensão</div>
        <div class="card-s">Etapas do ciclo: proposta → aprovação → relatório → participantes</div>
        ${fluxo}
      </div>
      <div class="card">
        <div class="card-t">Prazos</div>
        <div class="card-s">Encerramentos próximos e relatórios em atraso</div>
        ${prazosHtml}
      </div>
    </div>
    <div class="card">
      <div class="card-t">Atividade recente</div>
      <div class="card-s">Movimentação das ações de extensão</div>
      ${atividade}
    </div>`;
}

/* ============================== COBRANÇAS =============================== */
async function renderCobrancas(){

  let s={}, previa={};
  try{
    const [a,b] = await Promise.all([
      fetch("/api/extensao/cobranca/situacao").then(r=>r.ok?r.json():{}),
      fetch("/api/extensao/cobranca/previa").then(r=>r.ok?r.json():{}),
    ]);
    s=a||{}; previa=b||{};
  }catch{}
  const nomeDe=(id)=>{ const a=ACOES.find(x=>x.id===id); return a? (a.numeroAcao||a.proposta.nomeAtividade) : id; };
  const lista=(arr,vazio)=>arr?.length
    ? arr.map(x=>`<div class="linha"><div class="txt"><div class="p1">${esc(typeof x==="string"?nomeDe(x):(x.numeroAcao||x.nomeAtividade||nomeDe(x.id)))}</div>
        ${typeof x!=="string"&&x.motivo?`<div class="p2">${esc(x.motivo)}</div>`:""}</div></div>`).join("")
    : `<div class="vazio">${vazio}</div>`;

  $("v-cobrancas").innerHTML = `
    <div class="card">
      <div class="card-t">Como funciona</div>
      <div class="card-s">Automático — nada precisa ser acionado à mão</div>
      <div class="kv">Um dia depois do encerramento da ação, o responsável recebe por e-mail um lembrete
        pedindo o relatório final. Cada ação é cobrada <b>uma única vez</b>, e entregar o relatório
        encerra a cobrança. A PROPPEX recebe um resumo de cada rodada.</div>
    </div>
    <div class="duplo">
      <div class="card">

function montarForm(){

  $("f-class").onchange = ()=>$("f-class-outro-w").classList.toggle("hide",$("f-class").value!=="Outro");
  // pré-preenche com o perfil do usuário logado
  const p = ME?.perfil;
  if(p){
    $("f-curso").value = p.curso || "";
    $("f-resp-nome").value = p.nome || "";
    $("f-resp-cargo").value = p.funcao || "";
    $("f-resp-tel").value = p.telefone || "";
  }
  if(ME?.email) $("f-resp-email").value = ME.email;
}
async function enviarProposta(){
  const obr = [["f-curso","curso"],["f-nome","nome da atividade"],["f-inicio","início"],["f-fim","término"],
    ["f-ch","carga horária"],["f-publico","público-alvo"],["f-local","local"],["f-municipio","município"],
    ["f-justificativa","justificativa"],["f-objgeral","objetivo geral"],["f-objesp","objetivos específicos"],
    ["f-metodologia","metodologia"],["f-resp-nome","nome do responsável"],["f-resp-cargo","cargo"],
    ["f-resp-tel","telefone"],["f-resp-email","e-mail"]];
  for(const [id,lab] of obr){ if(!$(id).value.trim()){ $("f-msg").textContent="⚠ Preencha: "+lab; $(id).focus(); return; } }
  $("f-msg").textContent="Enviando…";
  await carregar();
  // correção de proposta devolvida: é a MESMA ação, com o mesmo id
  const base = EDITANDO ? ACOES.find(x=>x.id===EDITANDO) : null;
  const registro = {
    id: base?.id || "ext-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    numeroAcao: base?.numeroAcao ?? null, status: base?.status || "submetida",
    curso:$("f-curso").value,
    criadoPor: base?.criadoPor || ME?.email || "",
    criadoPorNome: base?.criadoPorNome || ME?.perfil?.nome || ME?.nome || "",
    criadoEm: base?.criadoEm || new Date().toISOString(), atualizadoEm:new Date().toISOString(),
    proposta:{
      nomeAtividade:$("f-nome").value.trim(), classificacao:$("f-class").value,
      classificacaoOutro:$("f-class-outro").value.trim(), departamento:$("f-curso").value,
      temaCentral:$("f-tema").value.trim(), periodoInicio:$("f-inicio").value, periodoFim:$("f-fim").value,
      cargaHoraria:$("f-ch").value, publicoAlvo:$("f-publico").value.trim(),
      local:$("f-local").value.trim(), municipio:$("f-municipio").value.trim(),
      justificativa:$("f-justificativa").value.trim(), objetivoGeral:$("f-objgeral").value.trim(),
      objetivosEspecificos:$("f-objesp").value.trim(), metodologia:$("f-metodologia").value.trim(),
      programacao:$("f-programacao").value.trim(), certificacaoSolicitada:$("f-cert").value.trim(),
      comissaoTexto:$("f-comissao").value.trim(), parceria:$("f-parceria").value.trim(),
      recursoInstalacao:$("f-rec-inst").value.trim(), recursoMultimidia:$("f-rec-multi").value.trim(),
      recursoOutros:$("f-rec-outros").value.trim(),
      respNome:$("f-resp-nome").value.trim(), respCargo:$("f-resp-cargo").value.trim(),
      respTelefone:$("f-resp-tel").value.trim(), respEmail:$("f-resp-email").value.trim(),
    },
    // o que já existe na ação não se perde na correção: relatório,
    // participantes e apreciação continuam onde estavam
    relatorio: base?.relatorio || {},
    participantes: base?.participantes || {inscritos:[],palestrantes:[],comissao:[]},
    apreciacao: base?.apreciacao || "",
    anexos: base?.anexos,
    motivoDevolucao: base?.motivoDevolucao,
  };
  if(base){ const i=ACOES.findIndex(x=>x.id===base.id); ACOES[i]=registro; }
  else ACOES.push(registro);
  await salvar();

  if(base){
    // a situação quem muda é o servidor: devolvida → submetida, com o
    // motivo antigo guardado no histórico da ação
    try{
      const r=await fetch("/api/extensao/reenviar",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({id:base.id})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||r.status);
    }catch(e){ $("f-msg").textContent=""; alert("A proposta foi salva, mas o reenvio falhou: "+e.message); return; }
  }
  fetch("/api/extensao/notificar",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:registro.id})}).catch(()=>{});
  $("f-msg").textContent="";
  alert(base
    ? "✅ Proposta corrigida e reenviada à PROPPEX!\n\nÉ a mesma ação, agora de volta na fila de análise."
    : "✅ Proposta enviada à PROPPEX!\n\nVocê receberá uma cópia da proposta em PDF no seu e-mail. Acompanhe a situação na aba \"Ações de extensão\". Quando aprovada, ela receberá o Número da Ação.");
  const voltarPara = base ? registro.id : null;
  cancelarCorrecao();
  await carregar();
  renderLista();
  if(voltarPara) nav("detalhe", voltarPara);
}

/* ============================== LISTA =================================== */
function montarFiltros(){
  $("l-curso").innerHTML = '<option value="">Todos os cursos</option>'+CURSOS.map(c=>`<option>${c}</option>`).join("");
  montarAnos();
  $("l-curso").onchange = renderLista; $("l-status").onchange = renderLista;
  $("l-ano").onchange = renderLista;
}
/* O CICLO de uma ação é o ano em que ela encerra — é o que a PROPPEX usa para
   fechar o exercício e o que separa o que ainda se cobra do arquivo. A lista
   se refaz a cada carga (uma ação nova pode estrear um ano), preservando o
   que estava escolhido. */
function montarAnos(){
  const el = $("l-ano"); if(!el) return;
  const escolhido = el.value;
  const anos = [...new Set(minhas().map(a=>anoDaAcao(a)).filter(Boolean))].sort().reverse();
  el.innerHTML = '<option value="">Todos os ciclos</option>'+anos.map(a=>`<option>${a}</option>`).join("");
  if(anos.includes(escolhido)) el.value = escolhido;
}
const anoDaAcao = (a)=>String(a?.proposta?.periodoFim||a?.proposta?.periodoInicio||a?.criadoEm||"").slice(0,4);
// dias de atraso do relatório final (0 = ainda no prazo)
const atrasoRelatorio = (a)=>{
  if(statusReal(a)!=="pendente" || !a.proposta?.periodoFim) return 0;
  const d = diasEntre(a.proposta.periodoFim);
  return d<0 ? Math.abs(d) : 0;
};
function minhas(){
  // gestor vê tudo; submissor vê só as ações vinculadas ao seu e-mail
  return PROPPEX ? ACOES : ACOES.filter(a=>a.criadoPor && a.criadoPor===ME?.email);
}
function renderLista(){
  const fc=$("l-curso").value, fs=$("l-status").value, fa=$("l-ano").value;
  const universo = minhas();
  const st = {};
  let completas=0, incompletas=0;
  for(const a of universo){
    const s=statusReal(a); st[s]=(st[s]||0)+1;
    if(completude(a).completa) completas++; else incompletas++;
  }
  $("stats").innerHTML =
    `<div class="s" style="border-color:var(--ok)"><b style="color:var(--ok)">${completas}</b><span>Completas (3/3)</span></div>
     <div class="s" style="border-color:#ffe0b2"><b style="color:var(--warn)">${incompletas}</b><span>Incompletas</span></div>`
    + ["submetida","aprovada","pendente","relatorio-entregue","registrada"]
      .map(s=>`<div class="s"><b>${st[s]||0}</b><span>${STATUS_LABEL[s]}</span></div>`).join("");
  const list = universo.filter(a=>(!fc||a.curso===fc)&&(!fs||statusReal(a)===fs)
      &&(!fa||anoDaAcao(a)===fa)&&passaPreset(a))
    // na guia Relatórios o que importa é quem está mais atrasado; nas demais,
    // a ordem continua sendo a da chegada
    .sort((a,b)=> SECAO==="relatorios"
      ? (atrasoRelatorio(b)-atrasoRelatorio(a)) || (b.criadoEm||"").localeCompare(a.criadoEm||"")
      : (b.criadoEm||"").localeCompare(a.criadoEm||""));
  $("devedores").innerHTML = SECAO==="relatorios" ? quemDeveRelatorio(universo, fa) : "";
  $("lista").innerHTML = list.length ? list.map(a=>{
    const s=statusReal(a), atraso=atrasoRelatorio(a);
    return `<div class="item" onclick="nav('detalhe','${a.id}')">
      <div class="nm">${esc(a.proposta.nomeAtividade)}
        <div class="cs">${esc(a.curso)} · ${a.numeroAcao?("Ação "+a.numeroAcao):"sem número"} · ${fmt(a.proposta.periodoInicio)} a ${fmt(a.proposta.periodoFim)}</div>
        ${marcas(a)}</div>
      ${atraso?`<span style="font-size:11.5px;font-weight:700;color:var(--warn);white-space:nowrap;margin-right:8px">${atraso} dia${atraso===1?"":"s"} de atraso</span>`:""}
      <span class="badge b-${s}">${STATUS_LABEL[s]}</span></div>`;
  }).join("") : '<div class="card muted">Nenhuma proposta encontrada com esses filtros.</div>';
}

/* Quem deve relatório, por professor. A cobrança automática já manda o
   e-mail (lib/cobranca.js); o que faltava era a PROPPEX conseguir VER de
   quem está esperando, sem abrir ação por ação. */
function quemDeveRelatorio(universo, ano){
  if(!PROPPEX) return "";
  const devendo = universo.filter(a=>atrasoRelatorio(a)>0 && (!ano||anoDaAcao(a)===ano));
  if(!devendo.length) return `<div class="banner ba-ok" style="margin-bottom:14px">
    Nenhum relatório final em atraso${ano?` no ciclo ${esc(ano)}`:""}.</div>`;
  const porPessoa = new Map();
  for(const a of devendo){
    const chave = a.criadoPor || "(sem responsável)";
    const at = porPessoa.get(chave) || { nome:a.criadoPorNome||chave, email:a.criadoPor||"", acoes:[] };
    at.acoes.push(a); porPessoa.set(chave, at);
  }
  const gente = [...porPessoa.values()]
    .map(p=>({ ...p, pior: Math.max(...p.acoes.map(atrasoRelatorio)) }))
    .sort((x,y)=>y.pior-x.pior);
  return `<div class="card" style="border-color:#ffe0b2;background:#fffdf7">
    <div class="card-t">Relatórios em atraso — ${devendo.length} ação(ões), ${gente.length} responsável(is)</div>
    <div class="card-s">Ordenado pelo atraso mais antigo. A cobrança automática já envia o
      lembrete por e-mail; esta lista é para saber de quem se está esperando.</div>
    ${gente.map(p=>`<div class="linha" style="align-items:flex-start">
      <div class="txt" style="flex:1">
        <div class="p1">${esc(p.nome)}${p.email?` <span class="muted" style="font-weight:400">&lt;${esc(p.email)}&gt;</span>`:""}</div>
        <div class="p2">${p.acoes.map(a=>`${esc(a.numeroAcao||a.proposta.nomeAtividade)} — ${atrasoRelatorio(a)} dia(s)`).join(" · ")}</div>
      </div>
      <span style="font-size:11.5px;font-weight:700;color:var(--warn);white-space:nowrap">${p.pior} dia(s)</span>
    </div>`).join("")}
  </div>`;
}
const fmt=(iso)=>iso?iso.split("-").reverse().join("/"):"—";
function fmtDataHora(iso){
  const d=iso?new Date(iso):null;
  if(!d||isNaN(d)) return "—";
  const z=(n)=>String(n).padStart(2,"0");
  return `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} às ${z(d.getHours())}h${z(d.getMinutes())}`;
}

function fmtTam(n){ if(!n) return ""; return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"; }
function renderAnexos(a){

    + `</tbody></table>`

async function anexarArquivos(id){

/* ------------------------- participantes: colagem ----------------------- */
const CAMPOS = [["ignorar","(ignorar)"],["nome","Nome"],["matricula","Matrícula"],["cpf","CPF"],
  ["email","E-mail"],["telefone","Telefone"],["ch","Carga horária"],["palestra","Palestra/minicurso"]];
let COLA = null;

function normCPF(v){ const d=String(v||"").replace(/\D/g,""); return d.length===11?d:String(v||"").trim(); }
function cpfValido(v){ const d=String(v||"").replace(/\D/g,""); if(d.length!==11||/^(\d)\1+$/.test(d))return false;
  let s=0;for(let i=0;i<9;i++)s+=+d[i]*(10-i);let r=(s*10)%11;if(r===10)r=0;if(r!==+d[9])return false;
  s=0;for(let i=0;i<10;i++)s+=+d[i]*(11-i);r=(s*10)%11;if(r===10)r=0;return r===+d[10]; }
function fmtCPF(v){ const d=String(v||"").replace(/\D/g,""); return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4"):v; }

function detectaColuna(vals){
  const v=vals.filter(x=>x&&x.trim());
  if(!v.length) return "ignorar";
  const n=v.length;
  const pct=(f)=>v.filter(f).length/n;
  if(pct(x=>/@/.test(x))>0.5) return "email";
  if(pct(x=>cpfValido(x))>0.5) return "cpf";
  if(pct(x=>/^[A-Za-z]\d{5,}$/i.test(x.replace(/\s/g,"")))>0.5) return "matricula";
  if(pct(x=>/^\d{1,3}$/.test(x.trim()))>0.7) return "ch";
  if(pct(x=>/^[\d\s()+-]{8,16}$/.test(x)&&x.replace(/\D/g,"").length>=8&&x.replace(/\D/g,"").length<=13&&!cpfValido(x))>0.5) return "telefone";
  if(pct(x=>/^[\p{L}\s.'-]{5,}$/u.test(x)&&x.split(/\s+/).length>=2)>0.6) return "nome";
  return "ignorar";
}
function montarCola(acao){
  $("p-cola").addEventListener("input", ()=>{
    const txt=$("p-cola").value;
    if(!txt.trim()){ $("p-preview").innerHTML=""; COLA=null; return; }
    let linhas = txt.split(/\r?\n/).filter(l=>l.trim());
    let rows = linhas.map(l=>l.split(/\t/).length>1?l.split(/\t/):l.split(/;/)).map(r=>r.map(c=>c.trim()));
    // remove cabeçalho se detectado
    const cab = rows[0]&&rows[0].some(c=>/nome|cpf|matr|carga|mail/i.test(c));
    if(cab) rows=rows.slice(1);
    if(!rows.length){ $("p-preview").innerHTML='<div class="banner ba-err">Nenhuma linha de dados encontrada.</div>'; return; }
    const ncols = Math.max(...rows.map(r=>r.length));
    const mapa=[];
    for(let c=0;c<ncols;c++) mapa.push(detectaColuna(rows.map(r=>r[c]||"")));
    COLA={rows,mapa};
    renderPreview(acao);
  });
}
function renderPreview(acao){
  if(!COLA) return;
  const {rows,mapa}=COLA;
  let selects = mapa.map((m,i)=>`<span>Col ${i+1}: <select onchange="COLA.mapa[${i}]=this.value;renderPreview()" >${
    CAMPOS.map(([v,l])=>`<option value="${v}" ${v===m?"selected":""}>${l}</option>`).join("")}</select></span>`).join(" ");
  const amostra = rows.slice(0,5).map(r=>`<tr>${mapa.map((m,i)=>{
    const v=r[i]||""; const bad = m==="cpf"&&v&&!cpfValido(v);
    return `<td class="${bad?"bad":""}">${esc(m==="cpf"?fmtCPF(v):v)}</td>`;}).join("")}</tr>`).join("");
  const invalidos = rows.filter(r=>mapa.some((m,i)=>m==="cpf"&&r[i]&&!cpfValido(r[i]))).length;
  $("p-preview").innerHTML = `
    <div class="colmap">${selects}</div>
    <table class="pt"><thead><tr>${mapa.map(m=>`<th>${(CAMPOS.find(c=>c[0]===m)||["","?"])[1]}</th>`).join("")}</tr></thead>
    <tbody>${amostra}</tbody></table>
    <div class="cnt">${rows.length} linha(s) detectada(s)${rows.length>5?" (mostrando 5)":""}.
      ${invalidos?`<span style="color:var(--err);font-weight:700"> ⚠ ${invalidos} CPF(s) inválido(s) — serão adicionados marcados para correção.</span>`:""}</div>
    <button class="bt bt-pri" onclick="adicionarCola('${acao?acao.id:""}')">＋ Adicionar ${rows.length} participante(s) à lista</button>`;
}
async function adicionarCola(id){
  const a = ACOES.find(x=>x.id===id); if(!a||!COLA) return;
  const cat=$("p-cat").value;
  const lista=a.participantes[cat]||(a.participantes[cat]=[]);
  const chave=(x)=>((x.cpf||"").replace(/\D/g,"")||x.matricula||x.nome||"").toLowerCase();
  const existentes=new Set(lista.map(chave));
  let add=0,dup=0;
  for(const r of COLA.rows){
    const o={};
    COLA.mapa.forEach((m,i)=>{ if(m!=="ignorar"&&r[i]) o[m]=r[i]; });
    if(!o.nome) continue;
    if(o.cpf) o.cpf=normCPF(o.cpf);
    const k=chave(o);
    if(existentes.has(k)){dup++;continue;}
    existentes.add(k); lista.push(o); add++;
  }
  a.atualizadoEm=new Date().toISOString();
  await salvar();
  $("p-cola").value=""; $("p-preview").innerHTML=""; COLA=null;
  renderTabelasPart(a);
  alert(`✅ ${add} participante(s) adicionados${dup?` · ${dup} duplicado(s) ignorado(s)`:""}.`);
}
function renderTabelasPart(a){
  const cats=[["inscritos","Inscritos / participantes"],["palestrantes","Palestrantes"],["comissao","Comissão organizadora"]];
  $("p-tabelas").innerHTML = cats.map(([c,titulo])=>{
    const l=a.participantes[c]||[];
    if(!l.length) return `<div class="cnt">— ${titulo}: nenhum registrado ainda.</div>`;
    return `<div class="sec-t" style="margin-top:16px">${titulo} · ${l.length}</div>
      <table class="pt"><thead><tr>${c==="palestrantes"?"<th>Palestra</th>":""}<th>Nome</th><th>Matrícula</th><th>CPF</th><th>E-mail</th><th>CH</th><th></th></tr></thead>
      <tbody>${l.map((x,i)=>`<tr>
        ${c==="palestrantes"?`<td>${esc(x.palestra||"")}</td>`:""}
        <td>${esc(x.nome)}</td><td>${esc(x.matricula||"")}</td>
        <td class="${x.cpf&&!cpfValido(x.cpf)?"bad":""}">${esc(fmtCPF(x.cpf||""))}</td>
        <td>${esc(x.email||"")}</td><td>${esc(x.ch||"")}</td>
        <td class="rm" title="remover" onclick="removerPart('${a.id}','${c}',${i})">✕</td></tr>`).join("")}</tbody></table>`;
  }).join("");
}
async function removerPart(id,cat,i){
  const a=ACOES.find(x=>x.id===id); if(!a)return;
  a.participantes[cat].splice(i,1); await salvar(); renderTabelasPart(a);

async function aprovar(id){
  const a=ACOES.find(x=>x.id===id); if(!a)return;
  if(!confirm(`Aprovar a proposta "${a.proposta.nomeAtividade}" e emitir o Número da Ação?`)) return;
  const cfgRaw=await stGet(KEYCFG);
  // ano pelo calendário de Brasília: aprovar em 31/12 à noite não pode emitir
  // número do ano seguinte (e zerar a sequência antes da hora)
  const ano=Number(hojeISO().slice(0,4));
  let cfg=cfgRaw?JSON.parse(cfgRaw):{ano,seq:0};
  if(cfg.ano!==ano){cfg={ano,seq:0};}
  cfg.seq++;
  a.numeroAcao=`EXT-${ano}-${String(cfg.seq).padStart(3,"0")}`;
  a.status="aprovada"; a.motivoDevolucao=""; a.atualizadoEm=new Date().toISOString();
  a.aprovadoEm=new Date().toISOString();   // base da cobrança do relatório
  await stSet(KEYCFG, JSON.stringify(cfg)); await salvar();
  alert(`✅ Aprovada!\nNúmero da Ação: ${a.numeroAcao}`); renderLista(); renderDetalhe(id);
}
/* Devolver é ato da gestão, e agora fecha o ciclo: quem devolve escreve o
   motivo, o responsável recebe o e-mail com ele na hora e a proposta volta
   a ser editável na conta dele. Quem grava é o servidor — o motivo e a
   situação não podem sair do formulário. */
async function devolver(id){
  const a=ACOES.find(x=>x.id===id); if(!a)return;
  const m=prompt("Motivo da devolução (vai por e-mail ao responsável e fica registrado):");
  if(m===null)return;
  if(m.trim().length<5){ alert("Escreva o motivo — é ele que o professor recebe."); return; }
  try{
    const r=await fetch("/api/extensao/devolver",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({id,motivo:m.trim()})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    await carregar();
    alert(j.avisado
      ? `↩ Devolvida para ajustes.\n\nO responsável foi avisado por e-mail (${j.avisado}) com o motivo e o caminho para corrigir.`
      : "↩ Devolvida para ajustes.\n\nO e-mail não pôde ser enviado — avise o responsável por outro meio.");
    renderLista(); renderDetalhe(id);
  }catch(e){ alert("Não foi possível devolver: "+e.message); }
}

/* Do lado do professor: a proposta devolvida volta ao formulário com tudo o
   que ele já havia preenchido. É a MESMA ação — corrigir não pode virar uma
   proposta nova, senão a PROPPEX passa a ter duas e o histórico se perde. */
function corrigirProposta(id){
  const a=ACOES.find(x=>x.id===id); if(!a)return;
  EDITANDO=id;
  preencherFormulario(a);
  nav("nova");
  $("f-msg").textContent="";
  window.scrollTo(0,0);
}

function preencherFormulario(a){
  const p=a.proposta||{};
  const por=(id,v)=>{ const el=$(id); if(el) el.value=v??""; };
  // num <select>, valor que não existe na lista deixaria o campo em branco e
  // a correção sairia sem o curso — a opção antiga entra de volta na lista
  const porSelect=(id,v)=>{
    const el=$(id); if(!el) return;
    const valor=String(v??"");
    if(valor && ![...el.options].some(o=>o.value===valor)){
      el.insertAdjacentHTML("beforeend",`<option value="${esc(valor)}">${esc(valor)}</option>`);
    }
    el.value=valor;
  };
  porSelect("f-curso",a.curso); por("f-nome",p.nomeAtividade); porSelect("f-class",p.classificacao);
  por("f-class-outro",p.classificacaoOutro); por("f-tema",p.temaCentral);
  por("f-inicio",p.periodoInicio); por("f-fim",p.periodoFim); por("f-ch",p.cargaHoraria);
  por("f-publico",p.publicoAlvo); por("f-local",p.local); por("f-municipio",p.municipio);
  por("f-justificativa",p.justificativa); por("f-objgeral",p.objetivoGeral);
  por("f-objesp",p.objetivosEspecificos); por("f-metodologia",p.metodologia);
  por("f-programacao",p.programacao); por("f-cert",p.certificacaoSolicitada);
  por("f-comissao",p.comissaoTexto); por("f-parceria",p.parceria);
  por("f-rec-inst",p.recursoInstalacao); por("f-rec-multi",p.recursoMultimidia);
  por("f-rec-outros",p.recursoOutros);
  por("f-resp-nome",p.respNome); por("f-resp-cargo",p.respCargo);
  por("f-resp-tel",p.respTelefone); por("f-resp-email",p.respEmail);
  $("f-class-outro-w").classList.toggle("hide", p.classificacao!=="Outro");
  marcarCorrecao(a);
}

}

/* ============================== INIT ==================================== */
(async function init(){
  try{
    const r = await fetch("/api/me");
    if(r.status===401){ location.href="/entrar?next="+encodeURIComponent(location.pathname); return; }
    ME = await r.json();
    if(ME.papel==="pendente"){ location.href="/entrar?pendente=1"; return; }
    GESTAO = ME.papel==="gestor" || (ME.modulos||[]).includes("extensao");
    PROPPEX = GESTAO && !MODO_PROF;
    if(!GESTAO && !ME.perfil){ location.href="/perfil/?next="+encodeURIComponent(location.pathname); return; }
  }catch{ /* segue sem sessão (modo dev) */ }
  montarSidebar(); montarForm(); montarFiltros();
  await carregar(); renderLista(); nav("painel");
})();

</script>
