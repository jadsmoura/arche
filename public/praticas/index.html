<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHÉ AP · Aulas Práticas · PROAC / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
  :root{
    --brand:#1c3742; --brand-2:#2d535c; --brand-3:#40717e; --accent:#71c8e2;
    --bg:#eef1f4; --card:#fff; --line:#dde4e8; --line-2:#f0f2f6; --trilho:#eef1f5;
    --wash:#e6f5fa; --ink:#182632; --ink-soft:#3a4650; --muted:#657179; --muted-2:#a9b4c0;
    --ok:#3f8a5d; --ok-soft:#e5f3ea; --warn:#c98a2b; --warn-soft:#fbf3e4;
    --err:#a1524c; --err-soft:#f6e9e7; --info:#40717e; --info-soft:#e8f4fa;
    --roxo:#5e5091; --roxo-soft:#ecebf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-3);text-decoration:none}
  a:hover{color:var(--brand-2)}
  button{font-family:Figtree,system-ui,sans-serif}
  ::selection{background:var(--accent);color:var(--brand)}
  .f-disp{font-family:Sora,sans-serif}

  .app{display:flex;min-height:100vh}
  .side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side-marca{padding:20px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
  .side-marca b{color:var(--accent);font-weight:800}
  .side-nav{padding:14px 12px;flex:1;overflow-y:auto}
  .side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:8px 12px 6px}
  .side-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
    margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
    border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
    transition:background .15s,color .15s}
  .side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
  .side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
  .side-pe .av{width:34px;height:34px;border-radius:50%;background:var(--brand-3);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;flex:none}
  .side-pe .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
  .side-pe .pp{font-size:11px;color:rgba(255,255,255,.5)}
  .side-pe .sair{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-weight:600}
  .side-pe .sair:hover{color:#fff}

  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .topbar .dir{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .area{padding:28px 32px;flex:1}
  .limite{max-width:1180px}
  h1{font-family:Sora,sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}
  @media(max-width:860px){.app{display:block}.side{position:static;width:100%;height:auto;flex-direction:row;
    flex-wrap:wrap;align-items:center}.side-nav{display:flex;overflow-x:auto;padding:8px;flex:1 0 100%}
    .side-lab{display:none}.side-item{white-space:nowrap;width:auto;border-left:0;border-bottom:3px solid transparent}
    .side-item.on{border-left:0;border-bottom-color:var(--accent)}.area{padding:18px 14px}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}
  .card-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;margin-bottom:2px}
  .card-s{font-size:12px;color:var(--muted);margin-bottom:20px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .kpi .v{font-family:Sora,sans-serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:7px;color:var(--muted)}
  .duplo{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.duplo{grid-template-columns:1fr}}
  .barra{margin-bottom:15px}
  .barra .cab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
  .barra .cab span:first-child{color:var(--ink-soft);font-weight:500}
  .barra .cab span:last-child{color:var(--muted);font-weight:600}
  .barra .tr{height:9px;background:var(--trilho);border-radius:5px;overflow:hidden}
  .barra .tr i{display:block;height:100%;border-radius:5px;background:var(--brand-3)}
  .linha{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .linha:last-child{border-bottom:0}
  .linha .txt{flex:1;min-width:0}
  .linha .p1{font-size:13px;color:var(--ink-soft);font-weight:600}
  .linha .p2{font-size:11.5px;color:var(--muted)}
  .vazio{font-size:13px;color:var(--muted);padding:10px 0}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;border:1px solid #cfd6de;border-radius:8px;padding:10px 12px;
    font-family:Figtree,system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);
    transition:border-color .15s,box-shadow .15s}
  textarea{min-height:96px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(64,113,126,.12)}
  .sec-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:22px 0 6px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .muted{color:var(--muted);font-size:12.5px;font-weight:400}
  .kv{margin:4px 0;font-size:13.5px;color:var(--ink-soft);overflow-wrap:anywhere}
  .kv b{color:var(--ink);font-weight:600}
  .ajuda{font-size:11.5px;color:var(--muted);margin-top:4px}

  .bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bt-pri{background:var(--brand);color:#fff}
  .bt-pri:hover{background:var(--brand-2)}
  .bt-sec{background:var(--info-soft);color:var(--brand);border-color:#cfe6f2}
  .bt-sec:hover{background:#dbeef8}
  .bt-ghost{background:#fff;color:var(--muted);border-color:#cfd6de}
  .bt-ghost:hover{color:var(--ink);border-color:var(--brand-3)}
  .bt-ok{background:var(--ok-soft);color:var(--ok);border-color:#cfeeda}
  .bt-err{background:var(--err-soft);color:var(--err);border-color:#eed6d3}
  .bt-xs{padding:5px 10px;font-size:12px}
  .bt:disabled{opacity:.5;cursor:not-allowed}
  .exp{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .b-rascunho{background:#eceff3;color:var(--muted)}
  .b-enviado{background:var(--warn-soft);color:var(--warn)}
  .b-validado{background:var(--ok-soft);color:var(--ok)}
  .b-devolvido{background:var(--err-soft);color:var(--err)}
  .banner{border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500}
  .ba-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0e0bd}
  .ba-err{background:var(--err-soft);color:var(--err);border:1px solid #eed6d3}
  .ba-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #cfeeda}
  .ba-info{background:var(--info-soft);color:var(--info);border:1px solid #cfe6f2}

  .item{display:flex;align-items:center;gap:14px;padding:15px 18px;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
  .item:hover{border-color:var(--brand-3);box-shadow:0 2px 10px -4px rgba(28,55,66,.18)}
  .item .nm{font-weight:600;flex:1;min-width:0;font-size:14px;color:var(--ink)}
  .item .cs{color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:9px 10px;border-bottom:1px solid var(--line-2);color:var(--ink-soft)}
  .rolo{overflow-x:auto}
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
  .foto{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;position:relative}
  .foto img{width:100%;height:110px;object-fit:cover;display:block}
  .foto .rm{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.94);border:1px solid var(--line);
    border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:13px;color:var(--err);line-height:1}
  .foto .cap{font-size:11px;color:var(--muted);padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ov{position:fixed;inset:0;background:rgba(24,38,50,.55);display:grid;place-items:center;z-index:10050;padding:16px}
  .modal{background:#fff;border-radius:14px;padding:24px;max-width:640px;width:100%;max-height:88vh;overflow:auto}
  .assinatura{border:1px dashed var(--line);border-radius:10px;padding:14px;background:#fbfcfd;text-align:center}
  .assinatura img{max-height:70px;max-width:260px}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <a class="side-marca" href="/" title="Voltar ao portal">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 37 L8 20 A12 12 0 0 1 32 20 L32 37" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4" fill="#71c8e2"/></svg>
      <span>ARCHÉ <b>AP</b></span>
    </a>
    <div class="side-nav">
      <div class="side-lab">AULAS PRÁTICAS</div>
      <div id="menu"></div>
    </div>
    <div class="side-pe">
      <div class="av" id="av">··</div>
      <div><div class="nm" id="euNome">—</div><div class="pp" id="euPapel">—</div></div>
      <button class="sair" onclick="location.href='/auth/sair'">sair</button>
    </div>
  </nav>

  <div class="conteudo">
    <div class="topbar">
      <div class="crumb">ARCHÉ AP <span style="color:var(--muted-2)">/</span> <b id="crumb">Painel</b></div>
      <div class="dir"><span id="vcAlvo"></span><span id="topDir"></span></div>
    </div>
    <div class="area"><div class="limite">
      <div id="vcFaixa"></div>
      <h1 id="titulo">Painel</h1>
      <div class="sub" id="subtitulo"></div>
      <div id="tela"><div class="vazio">Carregando…</div></div>
    </div></div>
  </div>
</div>
<script src="/assets/arche-paginacao.js"></script>
<script src="/assets/arche-vercomo.js"></script>
<script>
/* "Ver como…": a coordenação abre o setor pelos olhos de quem o usa. O
   recorte é do SERVIDOR — a tela só manda o ?como= nas leituras, e nenhuma
   escrita passa enquanto a simulação está ligada. */
ArcheVerComo.instalar({
  chave: "ap",
  prefixos: ["/api/praticas"],
  vocabulario: { professor: "Professor(a)", coordenador: "Coordenação" },
  aoTrocar: () => carregar(),
});
</script>
<script src="/assets/arche-colagem.js" defer></script>
<script src="/assets/arche-nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => { const [a, m, d] = String(iso || "").split("-"); return d ? `${d}/${m}/${a}` : "—"; };
const ROT = { rascunho: "Rascunho", enviado: "Aguardando validação",
  validado: "Validado", devolvido: "Devolvido" };

let D = null;                 // o que o servidor mandou
let SECAO = "painel";
let EDIT = null;              // o relatório aberto no formulário
let F = { semestre: "", disciplina: "", professor: "", status: "" };

const IC = {
  painel: "M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm9 0h7v-9h-7v9Zm0-16v5h7V4h-7Z",
  lista: "M4 6h16M4 12h16M4 18h10",
  nova: "M12 5v14M5 12h14",
  cadastro: "M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
  equipe: "M12 2 3 7v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V7l-9-5Z",
};
const icone = (d) => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

/* As guias. A coordenação vê o painel, a fila de validação e o cadastro; o
   professor vê as aulas dele e o formulário. "Relatórios" é onde a
   coordenação valida E onde ela emite o documento do semestre — é lá também
   que fica a assinatura, que o dono pediu junto do relatório. */
const SECOES = [
  { k: "painel", rot: "Painel do semestre", ic: IC.painel, gestao: true, tit: "Painel do semestre",
    sub: "Quantos relatórios vieram, que disciplinas ficaram sem registro e de quem cobrar." },
  { k: "relatorios", rot: "Relatórios", ic: IC.lista, tit: "Relatórios de aula prática",
    sub: "As aulas registradas — com filtro por semestre, disciplina, professor e situação." },
  { k: "nova", rot: "Registrar aula prática", ic: IC.nova, tit: "Registrar aula prática",
    sub: "Depois da aula: o objetivo, o local, as atividades e as fotos da prática." },
  { k: "cadastro", rot: "Professores e Disciplinas", ic: IC.cadastro, gestao: true,
    tit: "Professores e Disciplinas", sub: "Quem leciona o quê, semestre a semestre. É esta lista que diz o que falta registrar." },
  { k: "equipe", rot: "Coordenação", ic: IC.equipe, geral: true, tit: "Coordenação do módulo",
    sub: "Quem valida os relatórios de cada curso, e quem é a coordenação pedagógica." },
];

function ehCoord() { return !!D && (D.gestao || (D.cursos || []).length > 0); }

function montarMenu() {
  $("menu").innerHTML = SECOES
    .filter((s) => (!s.gestao || ehCoord()) && (!s.geral || D.gestao))
    .map((s) => `<button class="side-item${s.k === SECAO ? " on" : ""}" onclick="nav('${s.k}')">
      ${icone(s.ic)}${s.rot}</button>`).join("");
}

function nav(k) {
  const s = SECOES.find((x) => x.k === k) || SECOES[1];
  SECAO = s.k;
  $("crumb").textContent = s.rot;
  $("titulo").textContent = s.tit;
  $("subtitulo").textContent = s.sub;
  montarMenu();
  const desenha = { painel: renderPainel, relatorios: renderRelatorios, nova: renderNova,
    cadastro: renderCadastro, equipe: renderEquipe }[s.k];
  $("tela").innerHTML = desenha ? desenha() : "";
}

async function carregar() {
  const r = await fetch(`/api/praticas${F.semestre ? `?semestre=${encodeURIComponent(F.semestre)}` : ""}`);
  if (!r.ok) {
    $("tela").innerHTML = `<div class="banner ba-err">${esc((await r.json().catch(() => ({}))).error
      || "Não foi possível abrir o setor.")}</div>`;
    return;
  }
  D = await r.json();
  F.semestre = F.semestre || D.semestre;
  const nome = D.nome || D.eu || "";
  $("euNome").textContent = nome.split(/\s+/).slice(0, 2).join(" ") || "—";
  $("euPapel").textContent = D.gestao ? (D.pedagogico ? "Coordenação pedagógica" : "PROAC · PROPPEX")
    : (D.cursos || []).length ? "Coordenação de curso" : "Professor(a)";
  $("av").textContent = (nome[0] || "?").toUpperCase();
  if (!SECOES.some((s) => s.k === SECAO && (!s.gestao || ehCoord()) && (!s.geral || D.gestao))) {
    SECAO = ehCoord() ? "painel" : "relatorios";
  }
  nav(SECAO);
}

/* ============================== PAINEL ================================= */
function seletorSemestre(onchange = "trocarSemestre(this.value)") {
  return `<select onchange="${onchange}" style="max-width:220px">
    ${(D.semestres || []).map((s) => `<option value="${esc(s)}" ${s === F.semestre ? "selected" : ""}>
      ${esc(s)}${s === D.semestreCorrente ? " · corrente" : ""}</option>`).join("")}</select>`;
}
async function trocarSemestre(v) { F.semestre = v; await carregar(); }

function renderPainel() {
  const p = D.panorama;
  if (!p) return '<div class="vazio">Sem painel para este perfil.</div>';
  const semCadastro = !p.professores;
  const barra = (rot, n, total) => `<div class="barra">
    <div class="cab"><span>${esc(rot)}</span><span>${n}</span></div>
    <div class="tr"><i style="width:${total ? Math.round(n / total * 100) : 0}%"></i></div></div>`;
  return `
    <div class="card" style="padding:16px 18px">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <b class="f-disp" style="font-size:13px">Semestre</b>${seletorSemestre()}
        <a class="bt bt-sec" href="/api/praticas/semestral.pdf?semestre=${encodeURIComponent(F.semestre)}"
          target="_blank" rel="noopener">📄 Relatório semestral em PDF</a>
        <button class="bt bt-ghost" onclick="abrirChamada()">✉ Chamar quem não registrou</button>
      </div>
    </div>
    ${semCadastro ? `<div class="banner ba-warn">O semestre <b>${esc(F.semestre)}</b> ainda não tem
      cadastro de professores e disciplinas. Sem essa lista não há denominador — “disciplina sem
      relatório” não existe —, e o professor não consegue registrar a aula.
      <button class="bt bt-sec bt-xs" style="margin-left:8px" onclick="nav('cadastro')">Abrir o cadastro</button></div>` : ""}
    <div class="kpis">
      <div class="kpi"><div class="l">Aulas relatadas</div><div class="v">${p.entregues}</div>
        <div class="d">${p.validados} validada(s) · ${p.enviados} aguardando</div></div>
      <div class="kpi"><div class="l">Professores que registraram</div>
        <div class="v">${p.professoresQueRegistraram}</div>
        <div class="d">de ${p.professores} cadastrado(s)</div></div>
      <div class="kpi"><div class="l">Disciplinas sem registro</div>
        <div class="v">${(p.disciplinasSemRelatorio || []).length}</div>
        <div class="d">de ${p.disciplinas} cadastrada(s)</div></div>
      <div class="kpi"><div class="l">Devolvidos</div><div class="v">${p.devolvidos}</div>
        <div class="d">esperando correção do professor</div></div>
    </div>
    <div class="duplo">
      <div class="card">
        <div class="card-t">Professores sem nenhum registro</div>
        <div class="card-s">É desta lista que sai a cobrança — número sozinho não move ninguém.</div>
        ${(p.professoresSemRegistro || []).length
          ? p.professoresSemRegistro.map((x) => `<div class="linha"><div class="txt">
              <div class="p1">${esc(x.nome || x.email)}</div>
              <div class="p2">${esc(nomeCurso(x.curso))} · ${x.disciplinas} disciplina(s)</div></div></div>`).join("")

/* ============================ RELATÓRIOS =============================== */
function renderRelatorios() {

    (!F.semestre || r.semestre === F.semestre)
    && (!F.disciplina || r.disciplina === F.disciplina)
    && (!F.professor || (r.professor?.email || "") === F.professor)
    && (!F.status || r.status === F.status))

  const professores = [...new Map((D.relatorios || [])
    .filter((r) => r.professor?.email)
    .map((r) => [r.professor.email, r.professor.nome || r.professor.email])).entries()];

          <option value="">Disciplina: todas</option>
          ${disciplinas.map((d) => `<option ${F.disciplina === d ? "selected" : ""}>${esc(d)}</option>`).join("")}
        </select>
        ${ehCoord() ? `<select onchange="F.professor=this.value;nav('relatorios')">
          <option value="">Professor(a): todos</option>
          ${professores.map(([e, n]) => `<option value="${esc(e)}" ${F.professor === e ? "selected" : ""}>${esc(n)}</option>`).join("")}

        <select onchange="F.status=this.value;ArchePag.zerar('ap-relatorios');nav('relatorios')">
          <option value="">Situação: todas</option>
          ${Object.entries(ROT).map(([k, v]) => `<option value="${k}" ${F.status === k ? "selected" : ""}>${esc(v)}</option>`).join("")}
        </select>
      </div>
      <div class="exp">
        <button class="bt bt-pri" onclick="novoRelatorio()">＋ Registrar aula prática</button>
        ${ehCoord() ? `<a class="bt bt-sec" target="_blank" rel="noopener"
          href="/api/praticas/semestral.pdf?semestre=${encodeURIComponent(F.semestre)}">📄 Relatório semestral</a>` : ""}
      </div>

    ${ehCoord() && fila.length ? `<div class="banner ba-warn">
      <b>${fila.length}</b> relatório(s) aguardando a sua validação.</div>` : ""}
    ${cardAssinatura()}

      // demais listas do portal (assets/arche-paginacao.js)

/* ===================== FORMULÁRIO DA AULA PRÁTICA ====================== */
function novoRelatorio() { EDIT = null; nav("nova"); }
function editar(id) { EDIT = (D.relatorios || []).find((r) => r.id === id) || null; nav("nova"); }

function renderNova() {
  const r = EDIT || {};
  const minhas = D.minhasDisciplinas || [];
  /* Sem cadastro o formulário NÃO é mais uma parede (pedido do dono,
     ago/2026): professores vão lançar relatórios de SEMESTRES ANTERIORES,
     que não têm cadastro e não vão ter. O registro retroativo aceita a
     disciplina digitada à mão e pede o curso (é ele que define a coordenação
     que valida). No semestre corrente a regra não muda: quem manda é o
     cadastro da coordenação — e o servidor confere pela data da aula. */
  const semCadastro = !minhas.length && !D.gestao;
  const aviso = semCadastro
    ? `<div class="banner ba-warn">Você ainda não está no cadastro de <b>${esc(D.semestre)}</b> —
        para aulas deste semestre, a coordenação do curso inclui professores e disciplinas na guia
        <b>Professores e Disciplinas</b>. <b>Aula de semestre anterior</b> pode ser registrada aqui
        mesmo: informe a data da aula, digite a disciplina e escolha o curso.</div>`
    : "";
  const campo = (c) => {
    const v = r[c.campo] || "";
    if (c.tipo === "disciplina") {
      const manual = !!r.id && !!v && !minhas.some((d) => d.disciplina === v);
      return `<div><label>${esc(c.rotulo)} *</label>
        <select id="f-disciplina" onchange="modoManualDisc(this.value)">
          <option value="">Selecione…</option>
          ${minhas.map((d) => `<option value="${esc(d.disciplina)}" ${v === d.disciplina ? "selected" : ""}>
            ${esc(d.disciplina)}</option>`).join("")}
          <option value="__manual" ${manual || (semCadastro && !minhas.length) ? "selected" : ""}>
            Outra — disciplina de semestre anterior (digitar)</option>
        </select><div class="ajuda">${esc(c.ajuda)}</div>
        <div id="f-manual" style="${manual || semCadastro ? "" : "display:none"};margin-top:8px">
          <input id="f-disciplina-manual" value="${manual ? esc(v) : ""}"
            placeholder="Nome da disciplina, como consta na matriz">
          <div class="ajuda">Para aula de semestre anterior, que não está no cadastro. A coordenação
            verá que a disciplina foi digitada à mão.</div>
          <label style="margin-top:6px">Curso da disciplina *</label>
          <select id="f-curso-manual" ${r.id && !D.gestao ? "disabled" : ""}
            <option value="">Selecione o curso…</option>
            ${(D.catalogoCursos || []).map((cu) => `<option value="${esc(cu.slug)}"
              ${r.curso === cu.slug ? "selected" : ""}>${esc(cu.nome)}</option>`).join("")}
          </select>
          <div class="ajuda">É o curso que define a coordenação que valida este relatório.</div>
        </div></div>`;
    }
    if (c.tipo === "data") {
      return `<div><label>${esc(c.rotulo)} *</label>
        <input type="date" id="f-data" value="${esc(v)}" max="${new Date().toISOString().slice(0, 10)}">
        <div class="ajuda">${esc(c.ajuda)}</div></div>`;
    }
    if (c.tipo === "longo") {
      // "melhorar com IA" nos dois campos longos (pedido do dono, ago/2026):
      // o assistente é o MESMO das atas (assets/arche-ia.js) — só reescreve o
      // que o professor digitou, e sem chave de IA nenhum botão aparece
      return `<div style="grid-column:1/-1"><label>${esc(c.rotulo)} *</label>
        <textarea id="f-${c.campo}" data-ia="praticas.${esc(c.campo)}"
          placeholder="${esc(c.ajuda)}">${esc(v)}</textarea>
        <div class="ajuda">${esc(c.ajuda)}</div></div>`;
    }
    return `<div><label>${esc(c.rotulo)} *</label>
      <input id="f-${c.campo}" value="${esc(v)}" placeholder="${esc(c.ajuda)}">
      <div class="ajuda">${esc(c.ajuda)}</div></div>`;
  };
  const fotos = r.fotos || [];
  return `
    <div class="card">
      <div class="card-t">${r.id ? "Editar o relatório" : "Nova aula prática"}</div>
      <div class="card-s">${r.protocolo ? `Protocolo ${esc(r.protocolo)} · ` : ""}Todos os campos são
        obrigatórios, e o registro fotográfico também: são <b>${D.minFotos} fotos</b>, que é o que
        comprova a realização da aula.</div>
      ${aviso}
      <div id="f-alerta"></div>
      <div class="grid2">${(D.campos || []).map(campo).join("")}</div>
      <div class="exp">
        <button class="bt bt-pri" onclick="salvar(false)">💾 Salvar rascunho</button>
        ${r.id ? `<button class="bt bt-ok" onclick="salvar(true)">✓ Enviar à coordenação</button>` : ""}
        ${r.id ? `<a class="bt bt-ghost" target="_blank" rel="noopener"
          href="/api/praticas/${encodeURIComponent(r.id)}/pdf">📄 Conferir o PDF</a>` : ""}
        <button class="bt bt-ghost" onclick="EDIT=null;nav('relatorios')">Cancelar</button>
      </div>
    </div>
    ${r.id ? `<div class="card">
      <div class="card-t">Fotos da prática — ${fotos.length} de ${D.minFotos}</div>
      <div class="card-s">O registro fotográfico entra no PDF do relatório, ao final. As imagens são
        reduzidas no seu navegador antes de subir.</div>
      <input type="file" id="f-foto" accept="image/*" multiple onchange="subirFotos()">
      <div class="fotos">${fotos.map((f) => `<div class="foto">
        <img src="${esc(f.link || "")}" alt="" loading="lazy">
        <button class="rm" title="Remover" onclick="removerFoto('${esc(f.fileId)}')">✕</button>
        <div class="cap">${esc(f.nome || "foto")}</div></div>`).join("")
        || '<div class="vazio">Nenhuma foto ainda.</div>'}</div>
    </div>` : `<div class="card"><div class="muted">Salve o rascunho para anexar as fotos.</div></div>`}`;
}

function modoManualDisc(v) {
  const bloco = $("f-manual");
  if (bloco) bloco.style.display = v === "__manual" ? "" : "none";
}

function corpoDoForm() {
  const b = { id: EDIT?.id || "" };
  for (const c of D.campos || []) b[c.campo] = ($(`f-${c.campo}`) || {}).value || "";
  // disciplina digitada à mão (semestre anterior): vai com o curso escolhido
  if (b.disciplina === "__manual") {
    b.disciplina = ($("f-disciplina-manual") || {}).value || "";
    b.curso = ($("f-curso-manual") || {}).value || "";
  }
  return b;
}

async function salvar(enviar) {
  const r = await fetch("/api/praticas", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpoDoForm()) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $("f-alerta").innerHTML = `<div class="banner ba-err">${esc(j.error || "Não foi possível gravar.")}</div>`; return; }
  EDIT = j.relatorio;
  if (!enviar) {
    await carregar();
    EDIT = (D.relatorios || []).find((x) => x.id === j.relatorio.id) || j.relatorio;
    nav("nova");
    $("f-alerta").innerHTML = `<div class="banner ba-ok">Rascunho salvo.${
      (j.falta || []).length ? ` Falta: ${esc(j.falta.join(" · "))}` : " Pode enviar à coordenação."}</div>`;
    return;
  }
  const e = await fetch(`/api/praticas/${encodeURIComponent(j.relatorio.id)}/enviar`, { method: "POST" });
  const je = await e.json().catch(() => ({}));
  if (!e.ok) {
    $("f-alerta").innerHTML = `<div class="banner ba-err"><b>Ainda falta:</b><br>${
      (je.falta || [je.error]).map((x) => `• ${esc(x)}`).join("<br>")}</div>`;
    $("f-alerta").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  EDIT = null;
  await carregar();
  nav("relatorios");
}

/* As fotos são reduzidas AQUI, antes de subir: o PDFKit embute o arquivo como
   ele é, e a moldura do documento tem ~8 cm — uma foto de celular crua vai a
   1200 DPI. Se o navegador não souber ler a imagem, sobe o original: perder o
   anexo é pior que subi-lo grande. */
async function reduzirFoto(f, max = 1600) {
  try {
    const bmp = await createImageBitmap(f);
    const escala = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (escala >= 1 && f.size < 900 * 1024) return f;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * escala); c.height = Math.round(bmp.height * escala);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
    return blob ? new File([blob], f.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" }) : f;
  } catch { return f; }
}

async function subirFotos() {
  const inp = $("f-foto");
  const arquivos = [...(inp.files || [])];
  if (!arquivos.length || !EDIT?.id) return;
  inp.disabled = true;
  for (const bruto of arquivos) {
    const f = await reduzirFoto(bruto);
    const fd = new FormData(); fd.append("file", f);
    const r = await fetch(`/api/praticas/${encodeURIComponent(EDIT.id)}/foto`, { method: "POST", body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(j.error || "Não foi possível anexar."); break; }
    EDIT.fotos = j.fotos;
  }
  inp.disabled = false; inp.value = "";
  await carregar();
  EDIT = (D.relatorios || []).find((x) => x.id === EDIT.id) || EDIT;
  nav("nova");
}

async function removerFoto(fileId) {
  if (!EDIT?.id) return;
  const r = await fetch(`/api/praticas/${encodeURIComponent(EDIT.id)}/foto/${encodeURIComponent(fileId)}`,
    { method: "DELETE" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || "Não foi possível remover."); return; }
  EDIT.fotos = j.fotos;
  await carregar();
  EDIT = (D.relatorios || []).find((x) => x.id === EDIT.id) || EDIT;
  nav("nova");
}

async function apagar(id) {
  if (!confirm("Apagar este rascunho? Não há como desfazer.")) return;
  const r = await fetch(`/api/praticas/${encodeURIComponent(id)}`, { method: "DELETE" });
  if (!r.ok) { alert((await r.json().catch(() => ({}))).error || "Não foi possível apagar."); return; }
  await carregar();
}

async function decidir(id, decisao) {
  let comentario = "";
  if (decisao === "devolvido") {
    comentario = prompt("O que precisa ser corrigido? (o professor lê este texto)") || "";
    if (!comentario.trim()) return;
  } else {
    comentario = prompt("Observação da coordenação (opcional):") || "";
  }
  const r = await fetch(`/api/praticas/${encodeURIComponent(id)}/validar`, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ decisao, comentario }) });
  if (!r.ok) { alert((await r.json().catch(() => ({}))).error || "Não foi possível registrar."); return; }
  await carregar();
}

/* ============ A ASSINATURA DO USUÁRIO (guia Relatórios) ================
   Pedido do dono: o campo fica aqui, junto do relatório que ela assina. Mas
   a assinatura é da PESSOA, não do módulo — enviada uma vez, ela serve nos
   eventos e onde mais a pessoa assinar. Ninguém envia nem apaga a de outro:
   assinatura que um terceiro troca não vale como assinatura. */
function cardAssinatura() {
  /* O card é de TODOS do módulo (pedido do dono, ago/2026: "inclua o campo
     de anexar assinatura também no módulo de relatórios de aulas práticas —
     o professor anexa uma vez e ela fica vinculada ao usuário dele"): o
     PROFESSOR assina o relatório de cada aula que registra, e antes só a
     coordenação via o campo. Anexada uma vez, ela entra no banco central e
     sai em todo documento em que a pessoa assinar — relatórios, atas,
     certificados de eventos. */
  const ondeEntra = ehCoord()
    ? "Entra no relatório semestral que você emite e no relatório de cada aula que você validar."
    : "Entra, automaticamente, no relatório de cada aula prática que você registrar — e em todo "
      + "documento do ARCHÉ em que você assinar (atas, eventos).";
  return `<div class="card">
    <div class="card-t">A sua assinatura digitalizada</div>
    <div class="card-s">${ondeEntra} Anexe <b>uma vez</b>: ela fica vinculada ao seu usuário, no
      banco de assinaturas do portal, e não é pedida de novo. Só você a envia ou remove.</div>
    <div class="assinatura" id="as-cx">
      <img id="as-img" src="/api/perfil/assinatura.png?t=${Date.now()}" alt=""
        onerror="this.style.display='none';document.getElementById('as-vazio').style.display='block'">
      <div id="as-vazio" style="display:none" class="muted">Nenhuma assinatura enviada ainda.</div>
    </div>
    <label for="as-file">Arquivo PNG, de preferência com fundo transparente (até 2 MB)</label>
    <input type="file" id="as-file" accept="image/png,image/jpeg">
    <div class="exp">
      <button class="bt bt-sec" onclick="enviarAssinatura()">Salvar assinatura</button>
      <button class="bt bt-ghost" onclick="removerAssinatura()">Remover</button>
    </div>
    <div id="as-msg"></div>
  </div>`;
}

/* A assinatura NÃO passa pela redução das fotos: aquela pinta fundo branco e
   sai em JPEG, o que destrói a transparência — e é a transparência que faz a
   assinatura ficar bem sobre a linha do documento. Aqui se reduz em PNG. */
async function reduzirAssinatura(f, max = 700) {
  try {
    if (f.type !== "image/png") return f;
    const bmp = await createImageBitmap(f);
    if (Math.max(bmp.width, bmp.height) <= max && f.size < 400 * 1024) return f;
    const escala = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * escala); c.height = Math.round(bmp.height * escala);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);   // sem fillRect: preserva o alfa
    const blob = await new Promise((res) => c.toBlob(res, "image/png"));
    return blob ? new File([blob], f.name, { type: "image/png" }) : f;
  } catch { return f; }
}

async function enviarAssinatura() {
  const f = ($("as-file").files || [])[0];
  if (!f) { alert("Escolha o arquivo PNG da assinatura."); return; }
  const fd = new FormData(); fd.append("file", await reduzirAssinatura(f));
  const r = await fetch("/api/perfil/assinatura", { method: "POST", body: fd });
  const j = await r.json().catch(() => ({}));
  $("as-msg").innerHTML = r.ok
    ? '<div class="banner ba-ok" style="margin-top:10px">Assinatura guardada.</div>'
    : `<div class="banner ba-err" style="margin-top:10px">${esc(j.error || "Não foi possível guardar.")}</div>`;
  if (r.ok) { const img = $("as-img"); img.style.display = ""; img.src = `/api/perfil/assinatura.png?t=${Date.now()}`; }
}

async function removerAssinatura() {
  if (!confirm("Remover a sua assinatura digitalizada?")) return;
  const r = await fetch("/api/perfil/assinatura", { method: "DELETE" });
  if (r.ok) nav("relatorios");
}

/* ================= PROFESSORES E DISCIPLINAS (por semestre) ============ */
function cursosQuePosso() {
  return D.gestao ? (D.catalogoCursos || []) : (D.catalogoCursos || []).filter((c) => (D.cursos || []).includes(c.slug));
}

function renderCadastro() {
  const cursos = cursosQuePosso();
  if (!cursos.length) return '<div class="vazio">Você não coordena nenhum curso neste módulo.</div>';
  const cad = D.cadastro || {};
  return `
    <div class="card" style="padding:16px 18px">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <b class="f-disp" style="font-size:13px">Semestre</b>${seletorSemestre()}
        <span class="muted">O cadastro é por semestre: a cada semestre a lista se refaz.</span>
      </div>
    </div>
    ${cursos.map((c) => {
      const profs = (cad[F.semestre]?.[c.slug]?.professores) || [];
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div><div class="card-t">${esc(c.nome)}</div>
            <div class="card-s">${profs.length} professor(es) · ${
              profs.reduce((s, p) => s + (p.disciplinas || []).length, 0)} disciplina(s) em ${esc(F.semestre)}</div></div>
          <div class="exp" style="margin:0">
            <button class="bt bt-sec bt-xs" onclick="copiarCadastro('${esc(c.slug)}')">⧉ Copiar do semestre anterior</button>
            <button class="bt bt-pri bt-xs" onclick="linhaNova('${esc(c.slug)}')">＋ Incluir professor</button>
          </div>
        </div>
        <div class="rolo"><table id="tb-${esc(c.slug)}">
          <thead><tr><th style="width:26%">Nome</th><th style="width:28%">E-mail</th>
            <th>Disciplinas (uma por linha)</th><th style="width:60px"></th></tr></thead>
          <tbody>${profs.map((p, i) => linhaProf(c.slug, p, i)).join("")
            || `<tr><td colspan="4" class="muted">Ninguém cadastrado neste curso em ${esc(F.semestre)}.</td></tr>`}</tbody>
        </table></div>
        <div class="exp"><button class="bt bt-pri" onclick="salvarCadastro('${esc(c.slug)}')">💾 Salvar ${esc(c.nome)}</button></div>
      </div>`;
    }).join("")}`;
}

function linhaProf(slug, p = {}, i = 0) {
  return `<tr data-linha>
    <td><input value="${esc(p.nome || "")}" data-c="nome" placeholder="Nome completo"></td>
    <td><input value="${esc(p.email || "")}" data-c="email" placeholder="email@uniego.edu.br" type="email"></td>
    <td><textarea data-c="disciplinas" style="min-height:64px"
      placeholder="Anatomia Humana&#10;Fisiologia">${esc((p.disciplinas || []).join("\n"))}</textarea></td>
    <td><button class="bt bt-ghost bt-xs" onclick="this.closest('tr').remove()">✕</button></td></tr>`;
}

function linhaNova(slug) {
  const tb = document.querySelector(`#tb-${CSS.escape(slug)} tbody`);
  if (tb.querySelector("td.muted")) tb.innerHTML = "";
  tb.insertAdjacentHTML("beforeend", linhaProf(slug));
}

async function salvarCadastro(slug) {
  const linhas = [...document.querySelectorAll(`#tb-${CSS.escape(slug)} tr[data-linha]`)];
  const professores = linhas.map((tr) => ({
    nome: tr.querySelector('[data-c="nome"]').value.trim(),
    email: tr.querySelector('[data-c="email"]').value.trim().toLowerCase(),
    disciplinas: tr.querySelector('[data-c="disciplinas"]').value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean),
  })).filter((p) => p.nome && p.email);
  const r = await fetch("/api/praticas/cadastro", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ semestre: F.semestre, curso: slug, professores }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || "Não foi possível gravar."); return; }
  await carregar(); nav("cadastro");
}

async function copiarCadastro(slug) {
  if (!confirm(`Copiar o cadastro do semestre anterior para ${F.semestre}? Quem já está aqui não é sobrescrito.`)) return;
  const r = await fetch("/api/praticas/cadastro/copiar", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ semestre: F.semestre, curso: slug }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || "Não foi possível copiar."); return; }
  alert(`${j.copiados} professor(es) copiado(s) de ${j.de}.`);
  await carregar(); nav("cadastro");
}

/* ========================= COORDENAÇÃO DO MÓDULO =======================
   No mesmo molde da guia de professores: uma LINHA por pessoa, com nome,
   e-mail e papel — incluir, editar e apagar. Uma caixa de texto com e-mails
   soltos não é cadastro: não guarda o nome (que é o que sai impresso no
   documento) e transforma "tirar uma pessoa" em edição de texto. */
function renderEquipe() {
  const eq = D.equipe || { cursos: {}, pedagogico: [] };
  const papeis = D.papeisCoordenacao || [
    { codigo: "coordenador", nome: "Coordenador(a) do curso" },
    { codigo: "pedagogico", nome: "Coordenador(a) pedagógico(a)" }];
  const linha = (p = {}) => `<tr data-linha>
    <td><input value="${esc(p.nome || "")}" data-c="nome" placeholder="Nome completo"></td>
    <td><input value="${esc(p.email || "")}" data-c="email" type="email" placeholder="email@uniego.edu.br"></td>
    <td><select data-c="papel">${papeis.map((x) => `<option value="${esc(x.codigo)}"
      ${(p.papel || "coordenador") === x.codigo ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}</select></td>
    <td><button class="bt bt-ghost bt-xs" onclick="this.closest('tr').remove()">✕</button></td></tr>`;
  const tabela = (id, lista) => `<div class="rolo"><table id="${id}">
    <thead><tr><th style="width:32%">Nome</th><th style="width:36%">E-mail</th>
      <th>Papel</th><th style="width:60px"></th></tr></thead>
    <tbody>${(lista || []).map(linha).join("")
      || '<tr><td colspan="4" class="muted">Ninguém designado.</td></tr>'}</tbody></table></div>`;

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div><div class="card-t">Coordenação pedagógica institucional</div>
          <div class="card-s">Vê e valida os relatórios de <b>todos</b> os cursos. Deixe vazio se a
            coordenação pedagógica for por curso — nesse caso ela entra no quadro do curso, abaixo.</div></div>
        <button class="bt bt-sec bt-xs" onclick="linhaCoord('tb-ped')">＋ Incluir</button>
      </div>
      ${tabela("tb-ped", eq.pedagogico)}
    </div>
    ${(D.catalogoCursos || []).map((c) => {
      const lista = eq.cursos?.[c.slug]?.coordenadores || [];
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div><div class="card-t">${esc(c.nome)}</div>
            <div class="card-s">${lista.length
              ? `${lista.length} pessoa(s) validam os relatórios deste curso.`
              : "<b>Sem coordenação designada</b> — os relatórios deste curso ficam só com a PROPPEX."}</div></div>
          <button class="bt bt-sec bt-xs" onclick="linhaCoord('tb-${esc(c.slug)}')">＋ Incluir</button>
        </div>
        ${tabela(`tb-${esc(c.slug)}`, lista)}
      </div>`;
    }).join("")}
    <div class="card">
      <div class="exp" style="margin:0">
        <button class="bt bt-pri" onclick="salvarEquipe()">💾 Salvar a coordenação</button>
      </div>
      <div class="muted" style="margin-top:12px">Quem coordena o <b>módulo inteiro</b> (equivalente à
        coordenação pedagógica institucional) também se designa em
        <a href="/usuarios/">Gestão de acessos</a>, ação “coordenar”. Aqui é a coordenação
        <b>por curso</b>, que só existe neste módulo.</div>
    </div>`;
}

function linhaCoord(idTabela) {
  const tb = document.querySelector(`#${CSS.escape(idTabela)} tbody`);
  if (tb.querySelector("td.muted")) tb.innerHTML = "";
  const papeis = D.papeisCoordenacao || [{ codigo: "coordenador", nome: "Coordenador(a) do curso" },
    { codigo: "pedagogico", nome: "Coordenador(a) pedagógico(a)" }];
  tb.insertAdjacentHTML("beforeend", `<tr data-linha>
    <td><input data-c="nome" placeholder="Nome completo"></td>
    <td><input data-c="email" type="email" placeholder="email@uniego.edu.br"></td>
    <td><select data-c="papel">${papeis.map((x) =>
      `<option value="${esc(x.codigo)}">${esc(x.nome)}</option>`).join("")}</select></td>
    <td><button class="bt bt-ghost bt-xs" onclick="this.closest('tr').remove()">✕</button></td></tr>`);
}

function lerTabelaCoord(id) {
  return [...document.querySelectorAll(`#${CSS.escape(id)} tr[data-linha]`)].map((tr) => ({
    nome: tr.querySelector('[data-c="nome"]').value.trim(),
    email: tr.querySelector('[data-c="email"]').value.trim().toLowerCase(),
    papel: tr.querySelector('[data-c="papel"]').value,
  })).filter((p) => p.email);
}

async function salvarEquipe() {
  const cursos = {};
  for (const c of D.catalogoCursos || []) {
    const l = lerTabelaCoord(`tb-${c.slug}`);
    if (l.length) cursos[c.slug] = { coordenadores: l };
  }
  const r = await fetch("/api/praticas/equipe", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ equipe: { pedagogico: lerTabelaCoord("tb-ped"), cursos } }) });
  if (!r.ok) { alert((await r.json().catch(() => ({}))).error || "Não foi possível gravar."); return; }
  await carregar(); nav("equipe");
}

/* ===================== CHAMADA (a cobrança agora) ====================== */
async function abrirChamada() {
  const r = await fetch("/api/praticas/chamada", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ simular: true }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || "Não foi possível simular."); return; }
  const lista = j.destinatarios || [];
  const cx = document.createElement("div");
  cx.className = "ov";
  cx.innerHTML = `<div class="modal">
    <div class="card-t">Chamar quem não registrou</div>
    <div class="card-s">O mesmo e-mail que sai toda segunda-feira, agora. Vai a
      <b>${lista.length}</b> professor(es) — os que não enviaram nada da semana passada
      ou têm rascunho aberto.</div>
    <label>Mensagem da coordenação (opcional, entra no topo do e-mail)</label>
    <textarea id="ch-msg" placeholder="Ex.: lembrem-se de anexar as três fotos."></textarea>
    <div style="max-height:200px;overflow:auto;margin-top:12px">
      ${lista.map((p) => `<div class="linha"><div class="txt">
        <div class="p1">${esc(p.nome || p.email)}</div>
        <div class="p2">${esc(p.email)} · ${p.enviados} enviado(s) na semana${
          p.rascunhos ? ` · ${p.rascunhos} rascunho(s)` : ""}</div></div></div>`).join("")
        || '<div class="vazio">Ninguém a chamar. 🎉</div>'}
    </div>
    <div class="exp">
      <button class="bt bt-pri" ${lista.length ? "" : "disabled"} onclick="enviarChamada(this)">✉ Enviar agora</button>
      <button class="bt bt-ghost" onclick="this.closest('.ov').remove()">Fechar</button>
    </div></div>`;
  document.body.appendChild(cx);
}

async function enviarChamada(bt) {
  bt.disabled = true; bt.textContent = "enviando…";
  const r = await fetch("/api/praticas/chamada", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mensagem: $("ch-msg").value }) });
  const j = await r.json().catch(() => ({}));
  document.querySelector(".ov")?.remove();
  alert(r.ok ? `${j.enviados} de ${j.total} lembrete(s) enviado(s).` : (j.error || "Falha no envio."));
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelector(".ov")?.remove(); });
carregar();

/* O contexto que o assistente de escrita recebe junto com o texto: disciplina,
   curso e data dão coerência à reescrita sem virarem conteúdo do campo. */
window.archeIAContexto = () => {
  const sel = ($("f-disciplina") || {}).value || "";
  return {
    disciplina: sel === "__manual" ? (($("f-disciplina-manual") || {}).value || "") : sel,
    curso: nomeCurso((($("f-curso-manual") || {}).value) || EDIT?.curso || D.meuCurso || ""),
    "data da aula": ($("f-data") || {}).value || "",
    local: ($("f-local") || {}).value || "",
  };
};
</script>
