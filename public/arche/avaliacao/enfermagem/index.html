<link rel="icon" type="image/svg+xml" href="/arche/favicon.svg">

<script>
// ---- STORAGE INTERCEPTOR (antes do React) ----
// Intercepta window.storage.get/set para injetar docs virtuais nos indicadores modo A
(function() {
  var MAIN_KEY = 'avaliacao-mec-enfermagem-uniego-v1';
  var MODE_KEY = 'indicador-modos-enfermagem-v1';
  var MANUAL_KEY = 'indicador-manual-checks-enfermagem-v1';
  var LINKS_KEY = 'links-pastas-enfermagem-v2';

  // Cache dos dados auxiliares (carregados uma vez)
  var _modesCache = null;
  var _manualCache = null;
  var _linksCache = null;
  var _cacheLoaded = false;

  async function loadAuxData() {
    if (_cacheLoaded) return;
    try {
      var [r1, r2, r3] = await Promise.all([
        fetch('/api/estado?chave=' + encodeURIComponent(MODE_KEY)),
        fetch('/api/estado?chave=' + encodeURIComponent(MANUAL_KEY)),
        fetch('/api/estado?chave=' + encodeURIComponent(LINKS_KEY))
      ]);
      var d1 = r1.ok ? await r1.json() : {};
      var d2 = r2.ok ? await r2.json() : {};
      var d3 = r3.ok ? await r3.json() : {};
      _modesCache = d1.value ? JSON.parse(d1.value) : {};
      _manualCache = d2.value ? JSON.parse(d2.value) : {};
      _linksCache = d3.value ? JSON.parse(d3.value) : {};
    } catch(e) {
      _modesCache = {};
      _manualCache = {};
      _linksCache = {};
    }
    _cacheLoaded = true;
  }

  function injectVirtualDocs(estadoObj) {
    if (!estadoObj || !estadoObj.estado) return estadoObj;
    if (!_modesCache || !_manualCache) return estadoObj;

    var estado = estadoObj.estado;

    // Para cada indicador no modo A com checkboxes marcados, injetar docs virtuais
    for (var indId in _modesCache) {
      if (_modesCache[indId] !== 'A') continue;
      var checks = _manualCache[indId] || [];
      if (checks.length === 0) continue;

      // Garantir que o indicador existe no estado
      if (!estado[indId]) estado[indId] = {};

      // Para cada critério marcado, garantir que tem pelo menos 1 doc
      for (var i = 0; i < checks.length; i++) {
        var critIdx = checks[i];
        var critKey = String(critIdx);
        if (!estado[indId][critKey]) estado[indId][critKey] = { docs: [] };
        if (!estado[indId][critKey].docs) estado[indId][critKey].docs = [];
        
        // Se não tem docs reais, adicionar um doc virtual
        if (estado[indId][critKey].docs.length === 0) {
          estado[indId][critKey].docs = [{
            id: 'virtual-modeA-' + indId + '-' + critIdx,
            nome: 'Critério atendido (Modo A)',
            link: '#__mode-a-virtual__',
            prova: ''
          }];
        }
      }
    }

    // Também para modo B com links
    if (_linksCache) {
      for (var linkKey in _linksCache) {
        var links = _linksCache[linkKey];
        if (!links || links.length === 0) continue;
        // linkKey format: "indId-critIdx"
        var parts = linkKey.split('-');
        var critIdx2 = parseInt(parts.pop());
        var indId2 = parts.join('-');
        if (isNaN(critIdx2)) continue;
        
        // Verificar se está no modo B (ou sem modo definido = default B)
        if (_modesCache[indId2] === 'A') continue; // modo A usa manualChecks
        
        if (!estado[indId2]) estado[indId2] = {};
        var critKey2 = String(critIdx2);
        if (!estado[indId2][critKey2]) estado[indId2][critKey2] = { docs: [] };
        if (!estado[indId2][critKey2].docs) estado[indId2][critKey2].docs = [];
        
        if (estado[indId2][critKey2].docs.length === 0) {
          estado[indId2][critKey2].docs = [{
            id: 'virtual-link-' + linkKey,
            nome: links[0].descricao || 'Link de evidência',
            link: links[0].url || '#__link-virtual__',
            prova: ''
          }];
        }
      }
    }

    estadoObj.estado = estado;
    return estadoObj;
  }

  // Instalar interceptor ANTES do window.storage ser definido
  // Usamos Object.defineProperty para interceptar a atribuição de window.storage
  var _realStorage = null;
  
  Object.defineProperty(window, 'storage', {
    configurable: true,
    enumerable: true,
    get: function() { return _realStorage; },
    set: function(newStorage) {
      // Interceptar o get e set do storage
      var originalGet = newStorage.get;
      var originalSet = newStorage.set;

      newStorage.get = async function(key) {
        var result = await originalGet.call(this, key);
        
        if (key === MAIN_KEY && result && result.value) {
          // Carregar dados auxiliares se necessário
          await loadAuxData();
          
          // Injetar docs virtuais no estado
          try {
            var obj = JSON.parse(result.value);
            obj = injectVirtualDocs(obj);
            result.value = JSON.stringify(obj);
            // Também atualizar localStorage para consistência
            localStorage.setItem(key, result.value);
          } catch(e) {}
        }
        return result;
      };

      newStorage.set = async function(key, value) {
        if (key === MAIN_KEY) {
          // Re-injetar docs virtuais antes de salvar
          await loadAuxData();
          try {
            var obj = JSON.parse(value);
            obj = injectVirtualDocs(obj);
            value = JSON.stringify(obj);
          } catch(e) {}
        }
        return await originalSet.call(this, key, value);
      };

      _realStorage = newStorage;
    }
  });

  // Expor função para recarregar cache (usado pelo script de links)
  window.__reloadStorageCache = function() {
    _cacheLoaded = false;
    return loadAuxData();
  };
})();
// ---- FIM STORAGE INTERCEPTOR ----
</script>

<div id="auth-gate" style="display:none;position:fixed;inset:0;z-index:9999;background:#fff;align-items:center;justify-content:center;flex-direction:column;font-family:'Inter',sans-serif;">
  <div style="max-width:380px;width:90%;text-align:center;padding:40px 30px;border-radius:12px;box-shadow:0 4px 24px rgba(28,55,66,0.12);border:1px solid #e2e8f0;">
    <h2 style="color:#1c3742;font-size:1.4rem;margin-bottom:8px;">ARCHÉ Indicadores</h2>
    <p style="color:#64748b;font-size:0.9rem;margin-bottom:24px;">Acesso restrito aos organizadores.<br>Digite a senha para continuar.</p>
    <input type="password" id="auth-pass" placeholder="Senha de acesso" autocomplete="off" style="width:100%;padding:12px 16px;border:2px solid #e2e8f0;border-radius:8px;font-size:1rem;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='#1c3742'" onblur="this.style.borderColor='#e2e8f0'">
    <button id="auth-enter" style="width:100%;margin-top:12px;padding:12px;background:#1c3742;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">Entrar</button>
    <p id="auth-err" style="display:none;color:#dc2626;font-size:0.8rem;margin-top:10px;font-weight:600;">Senha incorreta.</p>
  </div>
</div>
<div id="root"></div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var gate = document.getElementById('auth-gate');
  if(params.get('perfil') === 'avaliador' || params.get('auth') === 'ok'){
    // Avaliador ou já autenticado pela página inicial - acesso direto
    gate.style.display = 'none';
  } else {
    // Organizador precisa de senha - overlay sobre o root (não esconder root)
    gate.style.display = 'flex';
    document.getElementById('auth-enter').addEventListener('click', tryAuth);
    document.getElementById('auth-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') tryAuth(); });
  }
  function tryAuth(){
    var pass = document.getElementById('auth-pass').value.trim();
    if(pass === 'uniego'){
      gate.style.display = 'none';
      document.getElementById('auth-err').style.display = 'none';
    } else {
      document.getElementById('auth-err').style.display = 'block';
      document.getElementById('auth-pass').select();
    }
  }
})();
</script>

ormalizados.",criterios:["Equipe multidisciplinar estabelecida em conson\xE2ncia com o PPC","Constitu\xEDda por profissionais de diferentes \xE1reas do conhecimento","Respons\xE1vel pela concep\xE7\xE3o, produ\xE7\xE3o e dissemina\xE7\xE3o de tecnologias, metodologias e recursos educacionais para EAD","Possui plano de a\xE7\xE3o documentado e implementado","Processos de trabalho formalizados"]},{id:"2.3",titulo:"Atua\xE7\xE3o do coordenador",sugestoes:["Plano de trabalho da coordena\xE7\xE3o","relat\xF3rios peri\xF3dicos de gest\xE3o","registros de atendimento (atas, protocolos)"],texto5:"A atua\xE7\xE3o do coordenador **est\xE1** de acordo com o PPC, **atende** \xE0 demanda existente, **considerando** a gest\xE3o do curso, a rela\xE7\xE3o com os docentes e discentes, com tutores e equipe multidisciplinar (quando for o caso) **e** a representatividade nos colegiados superiores, **\xE9 pautada** em um plano de a\xE7\xE3o documentado e compartilhado, **disp\xF5e** de indicadores de desempenho da coordena\xE7\xE3o dispon\xEDveis e p\xFAblicos **e administra** a potencialidade do corpo docente do seu curso, **favorecendo** a integra\xE7\xE3o e a melhoria cont\xEDnua.",criterios:["Atua\xE7\xE3o do coordenador de acordo com o PPC","Atende \xE0 demanda existente (gest\xE3o do curso, rela\xE7\xE3o com docentes e discentes)","Representatividade nos colegiados superiores","Pautada em plano de a\xE7\xE3o documentado e compartilhado","Disp\xF5e de indicadores de desempenho da coordena\xE7\xE3o dispon\xEDveis e p\xFAblicos","Administra a potencialidade do corpo docente, favorecendo integra\xE7\xE3o e melhoria cont\xEDnua"]},{id:"2.4",titulo:"Regime de trabalho do coordenador de curso",sugestoes:["Portaria de nomea\xE7\xE3o em conselho/colegiado superior","plano de a\xE7\xE3o documentado e assinado"],texto5:"O regime de trabalho do coordenador \xE9 de tempo **integral e permite** o atendimento da demanda existente, **considerando** a gest\xE3o do curso, a rela\xE7\xE3o com os doc :root{
  --brand:#1c3742; --brand-2:#40717e; --brand-3:#2d535c;
  --brand-ink:#152b34; --brand-wash:#eef3f5; --brand-wash2:#dde9ec;
  --accent:#71c8e2; --accent-deep:#40717e; --accent-wash:#e6f5fa;
  --bg:#eef1f4; --bg-soft:#e6ebef;
  --card:#ffffff; --card-2:#f8fafb;
  --line:#dde4e8; --line-soft:#e9eef1; --line-strong:#cbd6db;
  --ink:#182632; --ink-soft:#3c4b56; --muted:#657179; --muted-2:#93a1a8;
  --ok:#178A5E; --ok-wash:#e7f4ee; --ok-line:#bce0d0;
  --stop:#C0392B; --stop-wash:#fbecea; --stop-line:#f2cdc8;
  --warn:#9a6b12; --warn-wash:#fcf5e4; --warn-line:#ecd9a8;
  --n1:#C0392B; --n2:#CB6B1B; --n3:#C79413; --n4:#40717E; --n5:#178A5E;
  --shadow:0 1px 2px rgba(20,45,55,.05), 0 8px 24px -16px rgba(20,45,55,.25);
  --shadow-lg:0 4px 14px -6px rgba(28,55,66,.22), 0 20px 48px -28px rgba(20,45,55,.4);
}
*{box-sizing:border-box}
.wrap{background:var(--bg);color:var(--ink);min-height:100vh;letter-spacing:.004em}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.in{font-family:inherit}

/* ---------- TOPO (padr\xE3o do sistema PROPPEX) ---------- */
.topo{position:sticky;top:0;z-index:30;background:var(--card);box-shadow:0 1px 0 var(--line), 0 4px 20px -14px rgba(20,40,80,.25)}
.topo-rule{height:4px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand-2) 55%,var(--brand-3) 100%)}
.topo-inner{display:flex;align-items:center;gap:16px;max-width:1240px;margin:0 auto;padding:12px 24px}
.logo-uniego{height:42px;width:auto;flex-shrink:0}
.logo-proppex{height:44px;width:auto;flex-shrink:0}
.vr{width:1px;height:34px;background:var(--line-strong);flex-shrink:0}
.vr-2{height:30px}
.prod{display:flex;flex-direction:column;gap:2px;min-width:0}
.prod-t{font-size:16.5px;font-weight:700;line-height:1.1;color:var(--brand-ink);letter-spacing:-.01em}
.arche-wm{display:inline-flex;align-items:center;gap:8px}
.arche-ic{width:20px;height:21px;color:var(--brand);flex-shrink:0}
.arche-mod{font-weight:600;color:var(--brand-2)}
.prod-s{font-size:11px;color:var(--muted);letter-spacing:.01em}
.alt-modo{margin-left:auto;display:flex;gap:3px;background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:3px;flex-shrink:0}
.bt-modo{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);transition:.15s;white-space:nowrap}
.bt-modo:hover{color:var(--brand)}
.bt-modo.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(20,40,80,.12);border:1px solid var(--line)}
.topo-cc{display:flex;flex-direction:column;align-items:center;line-height:1;flex-shrink:0;padding:0 2px}
.cc-num{font-size:20px;font-weight:600}
.cc-lbl{font-size:8.5px;letter-spacing:.16em;color:var(--muted-2);margin-top:3px}

/* ---------- LAYOUT ---------- */
.layout{display:grid;grid-template-columns:300px 1fr;max-width:1240px;margin:0 auto;align-items:start;gap:0}
.lateral{position:sticky;top:73px;padding:22px 14px 22px 22px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 73px);overflow:auto}
.lateral-rot{font-size:10px;letter-spacing:.18em;color:var(--muted-2);padding:0 6px 3px;font-weight:600}
.dim-bt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 12px;border-radius:13px;border:1px solid transparent;background:var(--card);box-shadow:var(--shadow);transition:.15s}
.dim-bt:hover{border-color:var(--line-strong)}
.dim-bt.on{border-color:var(--brand-2);box-shadow:var(--shadow-lg)}
.dim-ico{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;flex-shrink:0;background:var(--brand-wash);border:1px solid var(--brand-wash2);color:var(--brand-2)}
.dim-bt.on .dim-ico{background:var(--brand);border-color:var(--brand);color:#fff}
.dim-txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.dim-num{font-size:9.5px;letter-spacing:.1em;color:var(--muted-2);display:flex;align-items:center;gap:7px;font-weight:600}
.dim-peso{opacity:.75}
.dim-nome{font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink);letter-spacing:-.005em}
.dim-meta{display:flex;flex-direction:column;gap:5px;margin-top:3px}
.dim-barra{height:5px;border-radius:3px;background:var(--bg-soft);overflow:hidden}
.dim-barra i{display:block;height:100%;border-radius:3px;transition:width .4s}
.dim-frac{font-size:9.5px;color:var(--muted);letter-spacing:.02em;font-weight:500}
.lateral-nota{display:flex;gap:9px;margin-top:6px;padding:12px;border-radius:12px;background:var(--brand-wash);border:1px solid var(--brand-wash2);color:var(--brand-ink)}
.lateral-nota svg{flex-shrink:0;margin-top:1px;color:var(--brand-2)}
.lateral-nota p{font-size:11px;line-height:1.5}

/* ---------- CONTE\xDADO ---------- */
.conteudo{padding:24px 28px 90px;min-width:0}
.dim-cab{display:flex;align-items:center;gap:14px;padding:4px 2px 18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.dim-cab-ico{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;flex-shrink:0;box-shadow:0 4px 12px -4px rgba(15,76,146,.5)}
.dim-cab-txt{flex:1;min-width:0}
.dim-cab-rot{font-size:10px;letter-spacing:.15em;color:var(--brand-2);font-weight:700}
.dim-cab-tit{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:3px;color:var(--ink)}
.dim-cab-nota{margin-left:auto;text-align:right;display:flex;flex-direction:column}
.dcn-num{font-size:30px;font-weight:600;line-height:1}
.dcn-lbl{font-size:10px;color:var(--muted);letter-spacing:.03em;margin-top:2px}

/* ---------- CARDS DE INDICADOR ---------- */
.ind-lista{display:flex;flex-direction:column;gap:9px}
.ind-card{border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;transition:.15s}
.ind-card.aberto{border-color:var(--brand-2);box-shadow:var(--shadow-lg)}
.ind-card.nsa{opacity:.66;background:var(--card-2)}
.ind-topo{display:flex;align-items:center;gap:12px;width:100%;padding:14px 15px;text-align:left}
.ind-topo.estatico{cursor:default}
.ind-id{font-size:11.5px;font-weight:700;color:var(--brand);background:var(--brand-wash);border:1px solid var(--brand-wash2);padding:3px 8px;border-radius:7px;flex-shrink:0;min-width:42px;text-align:center}
.ind-titulo{font-size:14px;font-weight:600;line-height:1.3;flex:1;min-width:0;color:var(--ink)}
.ind-dir{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ind-prog{font-size:11px;color:var(--muted);font-weight:600}
.ind-docs-cnt{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;font-weight:600}
.chev{color:var(--muted-2);transition:transform .18s}
.ind-card.aberto .chev{transform:rotate(90deg)}
.nota-badge{font-size:11px;font-weight:700;color:#fff;padding:4px 9px;border-radius:7px;letter-spacing:.02em;min-width:26px;text-align:center}
.tag{font-size:10px;font-weight:700;padding:4px 9px;border-radius:7px;letter-spacing:.03em}
.tag.nsa-fix{background:var(--bg-soft);color:var(--muted);border:1px solid var(--line)}
.tag.nsa-opt{background:var(--warn-wash);color:var(--warn);border:1px solid var(--warn-line)}
.tag.nsa-man{background:var(--stop-wash);color:var(--stop);border:1px solid var(--stop-line)}

/* ---------- CONTROLE DE APLICABILIDADE ---------- */
.aplic{margin:15px 0 4px;padding:13px 14px;border-radius:12px;background:var(--brand-wash);border:1px solid var(--brand-wash2)}
.aplic-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.aplic-rot{font-size:9.5px;letter-spacing:.13em;color:var(--brand-ink);font-weight:700}
.aplic-seg{display:flex;gap:3px;background:var(--card);border:1px solid var(--line-strong);border-radius:9px;padding:3px}
.seg{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;font-size:11.5px;font-weight:700;color:var(--muted);transition:.15s;white-space:nowrap}
.seg:hover{color:var(--ink)}
.seg.on{background:var(--ok);color:#fff}
.seg.on.stop{background:var(--stop);color:#fff}
.aplic-hint{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:var(--ink-soft);line-height:1.5;margin-top:10px}
.aplic-hint svg{flex-shrink:0;margin-top:1px;color:var(--brand-2)}

/* ---------- JUSTIFICATIVA NSA ---------- */
.nsa-just{margin-top:14px}
.nsa-just-lbl{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--muted-2);font-weight:700;margin-bottom:8px}
.nsa-just-in{width:100%;background:var(--card);border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--ink);outline:none;resize:vertical;line-height:1.5;transition:.15s}
.nsa-just-in:focus{border-color:var(--stop);box-shadow:0 0 0 3px rgba(192,57,43,.12)}
.nsa-just-in::placeholder{color:var(--muted-2)}
.nsa-just-note{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:var(--muted);line-height:1.5;margin-top:9px}
.nsa-just-note svg{flex-shrink:0;margin-top:1px}
.nsa-just.aval{background:var(--stop-wash);border:1px solid var(--stop-line);border-radius:11px;padding:13px 14px}
.nsa-just.aval .nsa-just-lbl{color:var(--stop)}
.nsa-just-txt{font-size:12.5px;color:var(--ink-soft);line-height:1.55}

/* ---------- CORPO DO INDICADOR ---------- */
.ind-corpo{padding:2px 16px 18px;border-top:1px solid var(--line-soft);background:var(--card-2)}
.ind-obs{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--ink-soft);background:var(--brand-wash);border:1px solid var(--brand-wash2);border-radius:9px;padding:9px 11px;margin:15px 0;line-height:1.5}
.ind-obs svg{flex-shrink:0;margin-top:1px;color:var(--brand-2)}

.aviso{display:flex;gap:9px;align-items:flex-start;padding:13px 14px;border-radius:11px;margin-top:15px;font-size:12.5px;line-height:1.5}
.nsa-box{background:var(--warn-wash);border:1px solid var(--warn-line);color:var(--warn)}
.nsa-box svg{flex-shrink:0;margin-top:1px}

.ativa-box{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px;border-radius:12px;margin-top:15px;background:var(--brand-wash);border:1px solid var(--brand-wash2)}
.ativa-tit{font-size:12.5px;font-weight:700;color:var(--brand-ink)}
.ativa-obs{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-top:4px}
.switch{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0;user-select:none}
.switch input{display:none}
.slider{width:42px;height:24px;border-radius:20px;background:#c3ccd9;position:relative;transition:.2s;flex-shrink:0}
.slider::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:var(--ok)}
.switch input:checked + .slider::after{transform:translateX(18px)}
.switch-lbl{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.switch input:checked ~ .switch-lbl{color:var(--ok)}

/* ---------- TEXTO CONCEITO 5 ---------- */
.texto5{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin:6px 0 18px}
.texto5.aval{background:var(--card)}
.texto5-rot{font-size:9.5px;letter-spacing:.12em;color:var(--brand-2);margin-bottom:9px;font-weight:700}
.texto5-rot span{color:var(--muted-2);opacity:.9;letter-spacing:.01em;font-weight:500}
.texto5-body{font-size:13px;line-height:1.7;color:var(--ink-soft)}
.criterio-hl{color:var(--brand-ink);font-weight:700;background:linear-gradient(transparent 60%, var(--brand-wash2) 60%);padding:0 1px}

/* ---------- LISTA DE CRIT\xC9RIOS ---------- */
.crit-rot{font-size:10px;letter-spacing:.11em;color:var(--muted-2);margin:0 0 11px 2px;font-weight:600}
.crit-lista{display:flex;flex-direction:column;gap:8px}
.crit{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:12px 13px;transition:.15s}
.crit.ok{border-color:var(--ok-line);background:var(--ok-wash)}
.crit.aval.pend{background:var(--card-2)}
.crit-head{display:flex;gap:10px;align-items:flex-start}
.crit-check{color:var(--muted-2);flex-shrink:0;margin-top:1px}
.crit.ok .crit-check{color:var(--ok)}
.crit-num{font-size:10.5px;color:var(--muted-2);flex-shrink:0;margin-top:2px;min-width:32px;font-weight:600}
.crit-texto{font-size:12.5px;line-height:1.5;color:var(--ink-soft)}

/* documentos anexados */
.doc-lista{display:flex;flex-direction:column;gap:6px;margin:11px 0 3px;padding-left:28px}
.doc-item{display:flex;gap:9px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.doc-item.aval{background:var(--brand-wash)}
.doc-ic{color:var(--brand-2);flex-shrink:0;margin-top:2px}
.doc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.doc-nome{font-size:12px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:5px;word-break:break-word}
.doc-nome[href]:hover{color:var(--brand-2)}
.doc-nome svg{flex-shrink:0;opacity:.6}
.doc-prova{font-size:11px;color:var(--muted);line-height:1.4}
.doc-del{color:var(--muted-2);padding:3px;border-radius:6px;flex-shrink:0;transition:.15s}
.doc-del:hover{color:var(--stop);background:var(--stop-wash)}

.add-doc{display:inline-flex;align-items:center;gap:6px;margin-top:10px;margin-left:28px;font-size:11.5px;font-weight:700;color:var(--brand);padding:7px 11px;border-radius:8px;border:1px dashed var(--brand-2);background:var(--brand-wash);transition:.15s}
.add-doc:hover{background:var(--brand-wash2)}

/* ---------- DOCUMENTOS SUGERIDOS (s\xF3 edi\xE7\xE3o) ---------- */
.sug{margin:0 0 18px;border:1px solid var(--accent);border-radius:12px;background:var(--accent-wash);overflow:hidden}
.sug-top{display:flex;gap:10px;align-items:flex-start;padding:12px 14px 8px}
.sug-ic{color:var(--accent-deep);flex-shrink:0;margin-top:1px}
.sug-tit{font-size:12.5px;font-weight:700;color:var(--brand-ink)}

<script>
/* Modo avaliador via URL */
(function(){
  var params = new URLSearchParams(window.location.search);
  if(params.get("perfil") === "avaliador"){
    /* Aguarda o React renderizar e clica no botão de modo avaliador */
    var attempts = 0;
    var interval = setInterval(function(){
      attempts++;
      var btns = document.querySelectorAll('[role="tab"]');
      for(var i=0; i<btns.length; i++){
        if(btns[i].textContent && btns[i].textContent.toLowerCase().indexOf("avaliador") !== -1){
          btns[i].click();
          /* Ocultar o toggle para impedir troca de modo */
          var altModo = document.querySelector('.alt-modo');
          if(altModo) altModo.style.display = 'none';
          clearInterval(interval);
          return;
        }
      }
      /* Também tentar pelo className */
      var modoBtns = document.querySelectorAll('.bt-modo');
      for(var i=0; i<modoBtns.length; i++){
        if(modoBtns[i].getAttribute('aria-selected') !== 'true' && 
           modoBtns[i].textContent && modoBtns[i].textContent.toLowerCase().indexOf('avaliador') !== -1){
          modoBtns[i].click();
          /* Ocultar o toggle para impedir troca de modo */
          var altModo2 = document.querySelector('.alt-modo');
          if(altModo2) altModo2.style.display = 'none';
          clearInterval(interval);
          return;
        }
      }
      if(attempts > 50) clearInterval(interval);
    }, 200);
  }
})();
</script>











<script>
/* ===== DOCUMENTOS INSTITUCIONAIS — UI Customizada de Upload ===== */
/* Injeta formulário com "Nome do Arquivo" e "Descrição" nos indicadores DI.x */
(function(){
  'use strict';

  var STORAGE_KEY = 'docs-institucionais-enfermagem-v1';
  var DI_IDS = ['DI.1','DI.2','DI.3','DI.4'];

  // ---- Estado local ----
  var docsState = {}; // {DI.1: [{nome,descricao,link,id,originalName}], ...}
  DI_IDS.forEach(function(id){ docsState[id] = []; });

  // ---- Persistência ----
  async function loadState(){
    try {
      var resp = await fetch('/api/estado?chave=' + encodeURIComponent(STORAGE_KEY));
      if(resp.ok){
        var data = await resp.json();
        if(data.value){
          var parsed = JSON.parse(data.value);
          DI_IDS.forEach(function(id){
            if(parsed[id]) docsState[id] = parsed[id];
          });
        }
      }
    } catch(e){ console.warn('[DI] Erro ao carregar estado:', e); }
  }

  async function saveState(){
    try {
      await fetch('/api/estado', {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({chave: STORAGE_KEY, valor: JSON.stringify(docsState)})
      });
    } catch(e){ console.error('[DI] Erro ao salvar estado:', e); }
  }

  // ---- Detectar modo ----
  function isAvaliadorMode(){
    var params = new URLSearchParams(window.location.search);
    if(params.get('perfil') === 'avaliador') return true;
    // Check if the avaliador tab is active
    var btModo = document.querySelectorAll('.bt-modo');
    for(var i=0; i<btModo.length; i++){
      if(btModo[i].classList.contains('on') && btModo[i].textContent.toLowerCase().indexOf('avaliar') >= 0){
        return true;
      }
    }
    return false;
  }

  // ---- Renderizar lista de documentos ----
  function renderDocList(container, secaoId, readOnly){
    container.innerHTML = '';
    var docs = docsState[secaoId] || [];

    if(docs.length === 0){
      var empty = document.createElement('p');
      empty.style.cssText = 'color:#94a3b8;font-size:13px;font-style:italic;margin:8px 0;';
      empty.textContent = 'Nenhum documento anexado nesta seção.';
      container.appendChild(empty);
      return;
    }

    var table = document.createElement('div');
    table.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

    docs.forEach(function(doc, idx){
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--card-2,#f8fafc);border:1px solid var(--line,#e2e8f0);border-radius:8px;';

      // Icon
      var icon = document.createElement('span');
      icon.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
      icon.style.cssText = 'color:var(--brand,#0f4c92);margin-top:2px;flex-shrink:0;';
      row.appendChild(icon);

      // Info
      var info = document.createElement('div');
      info.style.cssText = 'flex:1;min-width:0;';

      var nameEl = document.createElement('div');
      if(doc.link){
        var link = document.createElement('a');
        link.href = doc.link;
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = doc.nome || doc.originalName || 'Documento';
        link.style.cssText = 'color:var(--brand,#0f4c92);font-weight:600;font-size:13px;text-decoration:underline;word-break:break-word;';
        nameEl.appendChild(link);
        // External link icon
        var extIcon = document.createElement('span');
        extIcon.innerHTML = ' <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
        nameEl.appendChild(extIcon);
      } else {
        nameEl.textContent = doc.nome || 'Documento';
        nameEl.style.cssText = 'font-weight:600;font-size:13px;color:var(--ink,#1e293b);';
      }
      info.appendChild(nameEl);

      if(doc.descricao){
        var descEl = document.createElement('p');
        descEl.textContent = doc.descricao;
        descEl.style.cssText = 'margin:3px 0 0;font-size:12px;color:#64748b;line-height:1.4;';
        info.appendChild(descEl);
      }

      row.appendChild(info);

      // Delete button (only in editor mode)
      if(!readOnly){
        var delBtn = document.createElement('button');
        delBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
        delBtn.title = 'Remover documento';
        delBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:#dc2626;padding:4px;border-radius:4px;flex-shrink:0;opacity:0.6;transition:opacity .2s;';
        delBtn.onmouseenter = function(){ this.style.opacity='1'; };
        delBtn.onmouseleave = function(){ this.style.opacity='0.6'; };
        (function(secId, docIdx){
          delBtn.onclick = function(){
            if(confirm('Remover o documento "' + (docsState[secId][docIdx].nome || 'Documento') + '"?')){
              docsState[secId].splice(docIdx, 1);
              saveState();
              // Re-render
              var card = this.closest('[data-di-patched]');
              if(card) patchIndCorpo(card);
            }
          };
        })(secaoId, idx);
        row.appendChild(delBtn);
      }

      table.appendChild(row);
    });

    container.appendChild(table);
  }

  // ---- Renderizar formulário de upload ----
  function renderUploadForm(container, secaoId){
    var form = document.createElement('div');
    form.style.cssText = 'margin-top:12px;padding:14px;border:1px solid var(--line,#e2e8f0);border-radius:10px;background:var(--card,#fff);';

    // Header
    var header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:12px;';
    header.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
    var headerText = document.createElement('span');
    headerText.textContent = 'Adicionar Documento';
    headerText.style.cssText = 'font-weight:700;font-size:13px;color:var(--ink,#1e293b);letter-spacing:0.02em;';
    header.appendChild(headerText);
    form.appendChild(header);

    // Campo: Nome do Arquivo
    var nomeLabel = document.createElement('label');
    nomeLabel.style.cssText = 'display:block;font-size:11px;font-weight:700;color:var(--ink-soft,#64748b);letter-spacing:0.1em;margin-bottom:4px;';
    nomeLabel.textContent = 'NOME DO ARQUIVO';
    form.appendChild(nomeLabel);

    var nomeInput = document.createElement('input');
    nomeInput.type = 'text';
    nomeInput.placeholder = 'Ex: PPC do Curso de Enfermagem';
    nomeInput.style.cssText = 'width:100%;padding:8px 10px;border:1px solid var(--line,#e2e8f0);border-radius:6px;font-size:13px;margin-bottom:10px;background:var(--bg,#fff);color:var(--ink,#1e293b);box-sizing:border-box;';
    form.appendChild(nomeInput);

    // Campo: Descrição
    var descLabel = document.createElement('label');
    descLabel.style.cssText = 'display:block;font-size:11px;font-weight:700;color:var(--ink-soft,#64748b);letter-spacing:0.1em;margin-bottom:4px;';
    descLabel.textContent = 'DESCRIÇÃO';
    form.appendChild(descLabel);

    var descInput = document.createElement('textarea');
    descInput.placeholder = 'Breve descrição do documento (opcional)';
    descInput.rows = 2;
    descInput.style.cssText = 'width:100%;padding:8px 10px;border:1px solid var(--line,#e2e8f0);border-radius:6px;font-size:13px;margin-bottom:10px;background:var(--bg,#fff);color:var(--ink,#1e293b);resize:vertical;box-sizing:border-box;font-family:inherit;';
    form.appendChild(descInput);

    // Campo: Arquivo
    var fileLabel = document.createElement('label');
    fileLabel.style.cssText = 'display:block;font-size:11px;font-weight:700;color:var(--ink-soft,#64748b);letter-spacing:0.1em;margin-bottom:4px;';
    fileLabel.textContent = 'ARQUIVO';
    form.appendChild(fileLabel);

    var uploadZone = document.createElement('div');
    uploadZone.style.cssText = 'border:2px dashed #cbd5e1;border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:border-color .2s;';
    uploadZone.innerHTML = '<p style="margin:0;color:#64748b;font-size:13px;">📄 Clique para selecionar ou arraste o arquivo</p><p style="margin:4px 0 0;color:#94a3b8;font-size:11px;">PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX, JPG, PNG, ZIP, RAR (máx 50MB)</p>';

    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.pdf,.doc,.docx,.jpg,.jpeg,.png,.xls,.xlsx,.ppt,.pptx,.zip,.rar';
    fileInput.style.display = 'none';

    var selectedFile = null;

    uploadZone.addEventListener('click', function(){ fileInput.click(); });
    uploadZone.addEventListener('dragover', function(e){ e.preventDefault(); uploadZone.style.borderColor='#0d9488'; });
    uploadZone.addEventListener('dragleave', function(){ uploadZone.style.borderColor='#cbd5e1'; });
    uploadZone.addEventListener('drop', function(e){
      e.preventDefault();
      uploadZone.style.borderColor='#cbd5e1';
      if(e.dataTransfer.files.length){
        selectedFile = e.dataTransfer.files[0];
        uploadZone.innerHTML = '<p style="margin:0;color:#0d9488;font-size:13px;">✅ ' + selectedFile.name + '</p><p style="margin:4px 0 0;color:#94a3b8;font-size:11px;">Clique para trocar</p>';
        if(!nomeInput.value.trim()){
          nomeInput.value = selectedFile.name.replace(/\.[^.]+$/, '');
        }
      }
    });
    fileInput.addEventListener('change', function(){
      if(fileInput.files.length){
        selectedFile = fileInput.files[0];
        uploadZone.innerHTML = '<p style="margin:0;color:#0d9488;font-size:13px;">✅ ' + selectedFile.name + '</p><p style="margin:4px 0 0;color:#94a3b8;font-size:11px;">Clique para trocar</p>';
        if(!nomeInput.value.trim()){
          nomeInput.value = selectedFile.name.replace(/\.[^.]+$/, '');
        }
      }
    });

    form.appendChild(uploadZone);
    form.appendChild(fileInput);

    // Status
    var statusDiv = document.createElement('div');
    statusDiv.style.cssText = 'margin-top:8px;font-size:12px;display:none;';
    form.appendChild(statusDiv);

    // Botão Enviar
    var btnRow = document.createElement('div');
    btnRow.style.cssText = 'margin-top:12px;display:flex;justify-content:flex-end;';

    var submitBtn = document.createElement('button');
    submitBtn.textContent = 'Enviar Documento';
    submitBtn.style.cssText = 'background:#1d3a5f;color:#fff;border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s;';
    submitBtn.onmouseenter = function(){ this.style.background='#15304f'; };
    submitBtn.onmouseleave = function(){ this.style.background='#1d3a5f'; };

    submitBtn.onclick = async function(){
      if(!selectedFile){
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = '<span style="color:#dc2626;">⚠️ Selecione um arquivo primeiro.</span>';
        return;
      }
      if(!nomeInput.value.trim()){
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = '<span style="color:#dc2626;">⚠️ Informe o nome do documento.</span>';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.6';
      statusDiv.style.display = 'block';
      statusDiv.innerHTML = '<span style="color:#0d9488;">⏳ Enviando arquivo...</span>';

      try {
        var fd = new FormData();
        fd.append('file', selectedFile);
        fd.append('nomeArquivo', nomeInput.value.trim());
        fd.append('descricao', descInput.value.trim());
        fd.append('secao', secaoId);

        var resp = await fetch('/api/drive/upload-doc-institucional', {method:'POST', body:fd});
        if(!resp.ok) throw new Error('Erro ' + resp.status);
        var data = await resp.json();

        // Adicionar ao estado
        docsState[secaoId].push({
          nome: nomeInput.value.trim(),
          descricao: descInput.value.trim(),
          link: data.link,
          originalName: selectedFile.name,
          id: Date.now() + Math.random()
        });
        await saveState();

        statusDiv.innerHTML = '<span style="color:#16a34a;">✅ Documento enviado com sucesso!</span>';

        // Reset form
        nomeInput.value = '';
        descInput.value = '';
        selectedFile = null;
        fileInput.value = '';
        uploadZone.innerHTML = '<p style="margin:0;color:#64748b;font-size:13px;">📄 Clique para selecionar ou arraste o arquivo</p><p style="margin:4px 0 0;color:#94a3b8;font-size:11px;">PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX, JPG, PNG, ZIP, RAR (máx 50MB)</p>';

        // Re-render doc list
        var card = container.closest('[data-di-patched]');
        if(card) patchIndCorpo(card);

        setTimeout(function(){ statusDiv.style.display = 'none'; }, 3000);
      } catch(err){
        statusDiv.innerHTML = '<span style="color:#dc2626;">❌ Erro: ' + err.message + '</span>';
      } finally {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    };

    btnRow.appendChild(submitBtn);
    form.appendChild(btnRow);

    container.appendChild(form);
  }

  // ---- Patch do ind-corpo ----
  function patchIndCorpo(card){
    var indId = card.querySelector('.ind-id');
    if(!indId) return;
    var id = indId.textContent.trim();
    if(DI_IDS.indexOf(id) === -1) return;

    var corpo = card.querySelector('.ind-corpo');
    if(!corpo) return;

    // Mark as patched
    card.setAttribute('data-di-patched', id);

    var readOnly = isAvaliadorMode();

    // Hide the default content (aplic, texto5, crit-rot, crit-lista)
    var aplic = corpo.querySelector('.aplic');
    var texto5 = corpo.querySelector('.texto5');
    var critRot = corpo.querySelector('.crit-rot');
    var critLista = corpo.querySelector('.crit-lista');
    if(aplic) aplic.style.display = 'none';
    if(texto5) texto5.style.display = 'none';
    if(critRot) critRot.style.display = 'none';
    if(critLista) critLista.style.display = 'none';

    // Remove previous custom UI if re-rendering
    var existing = corpo.querySelector('.di-custom-ui');
    if(existing) existing.remove();

    // Create custom UI container
    var ui = document.createElement('div');
    ui.className = 'di-custom-ui';
    ui.style.cssText = 'padding:4px 0;';

    // Section header
    var secHeader = document.createElement('div');
    secHeader.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line,#e2e8f0);';
    secHeader.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
    var secTitle = document.createElement('span');
    secTitle.style.cssText = 'font-size:12px;font-weight:700;color:var(--ink-soft,#64748b);letter-spacing:0.08em;';
    secTitle.textContent = 'REPOSITÓRIO DE DOCUMENTOS';
    secHeader.appendChild(secTitle);

    var countBadge = document.createElement('span');
    countBadge.style.cssText = 'margin-left:auto;font-size:11px;background:var(--brand,#0f4c92);color:#fff;padding:2px 8px;border-radius:10px;font-weight:600;';
    countBadge.textContent = (docsState[id] || []).length + ' doc' + ((docsState[id] || []).length !== 1 ? 's' : '');
    secHeader.appendChild(countBadge);
    ui.appendChild(secHeader);

    // Document list
    var listContainer = document.createElement('div');
    renderDocList(listContainer, id, readOnly);
    ui.appendChild(listContainer);

    // Upload form (only in editor mode)
    if(!readOnly){
      renderUploadForm(ui, id);
    }

    corpo.appendChild(ui);
  }

  // ---- Ocultar badges/contadores dos DI.x ----
  function hideScoreBadges(){
    var allCards = document.querySelectorAll('.ind-card');
    allCards.forEach(function(card){
      var indId = card.querySelector('.ind-id');
      if(!indId) return;
      var id = indId.textContent.trim();
      if(DI_IDS.indexOf(id) === -1) return;
      // Hide ind-prog (e.g. "0/0"), ind-nota, and the dash
      var topo = card.querySelector('.ind-topo');
      if(!topo) return;
      var prog = topo.querySelector('.ind-prog');
      if(prog) prog.style.display = 'none';
      // Hide the nota badge (usually shows "—")
      var spans = topo.querySelectorAll('span');
      spans.forEach(function(s){
        var txt = s.textContent.trim();
        if(txt === '—' || txt === '-' || /^\d+\/\d+$/.test(txt) || /^nota/.test(txt)){
          s.style.display = 'none';
        }
      });
      // Also hide the dim-cab-nota if this is the dimension header
      var dimNota = card.querySelector('.dim-cab-nota');
      if(dimNota) dimNota.style.display = 'none';
    });
    // Also hide the nota for the DI dimension header in sidebar
    var dimBtns = document.querySelectorAll('button');
    dimBtns.forEach(function(btn){
      // Check direct text children for "Documentos Institucionais"
      var hasTitle = false;
      btn.childNodes.forEach(function(n){
        if(n.textContent && n.textContent.indexOf('Documentos Institucionais') >= 0) hasTitle = true;
      });
      if(!hasTitle) return;
      // Hide only the subtitle line that shows "0/4 · nota —" - look for small/span with that pattern
      var children = btn.querySelectorAll('*');
      children.forEach(function(el){
        var txt = el.textContent.trim();
        // Only hide leaf elements that contain score patterns
        if(el.children.length === 0){
          if(/^\d+\/\d+/.test(txt) || txt === '·' || /^nota\s/.test(txt) || txt === '—' || txt === '–'){
            el.style.display = 'none';
          }
        }
      });
    });
  }

  // ---- MutationObserver ----
  function scanAndPatch(){
    hideScoreBadges();
    var cards = document.querySelectorAll('.ind-card.aberto');
    cards.forEach(function(card){
      var indId = card.querySelector('.ind-id');
      if(!indId) return;
      var id = indId.textContent.trim();
      if(DI_IDS.indexOf(id) === -1) return;
      // Only patch if not already patched or if re-opened
      if(card.getAttribute('data-di-patched') !== id || !card.querySelector('.di-custom-ui')){
        patchIndCorpo(card);
      }
    });
  }

  var observer = new MutationObserver(function(mutations){
    var shouldScan = false;
    mutations.forEach(function(m){
      if(m.type === 'childList' && m.addedNodes.length > 0) shouldScan = true;
      if(m.type === 'attributes' && m.attributeName === 'class') shouldScan = true;
    });
    if(shouldScan) requestAnimationFrame(scanAndPatch);
  });

  // ---- Inicialização ----
  async function init(){
    await loadState();
    observer.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['class']});
    // Initial scan
    scanAndPatch();
  }

  // Wait for DOM ready
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>







<script>
// ---- JUSTIFICATIVA CONCEITO INJECT START ----
// ============================================================
// JUSTIFICATIVA DO CONCEITO - Injeção DOM
// Adiciona campo "Justificativa do Conceito" após os critérios
// nos indicadores das Dimensões 1, 2 e 3 (não nos DI.x)
// ============================================================

(function() {
  'use strict';

  var STORAGE_KEY = 'justificativas-conceito-v1';
  var DI_IDS = ['DI.1','DI.2','DI.3','DI.4'];
  var justState = {}; // { "1.1": "texto...", "2.1": "texto...", ... }
  var saveTimeout = null;

  // ---- Persistência ----
  async function loadState() {
    try {
      var resp = await fetch('/api/estado?chave=' + encodeURIComponent(STORAGE_KEY));
      if (resp.ok) {
        var data = await resp.json();
        if (data.value) {
          justState = JSON.parse(data.value);
        }
      }
    } catch(e) { console.warn('[JustConceito] Erro ao carregar:', e); }
  }

  async function saveState() {
    try {
      await fetch('/api/estado', {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({chave: STORAGE_KEY, valor: JSON.stringify(justState)})
      });
    } catch(e) { console.warn('[JustConceito] Erro ao salvar:', e); }
  }

  function debouncedSave() {
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveState, 800);
  }

  // ---- Injetar campo ----
  function injectJustificativa() {
    // Buscar todos os ind-card abertos (com classe 'aberto')
    var cards = document.querySelectorAll('.ind-card.aberto');
    cards.forEach(function(card) {
      // Pegar o ID do indicador
      var idEl = card.querySelector('.ind-id');
      if (!idEl) return;
      var indId = idEl.textContent.trim();
      
      // Não injetar nos DI.x
      if (DI_IDS.indexOf(indId) >= 0) return;
      
      // Não injetar se já existe
      if (card.querySelector('.just-conceito-box')) return;
      
      // Verificar se o indicador está marcado como NSA
      if (card.classList.contains('nsa')) return;
      
      // Buscar o ind-corpo
      var corpo = card.querySelector('.ind-corpo');
      if (!corpo) return;
      
      // Buscar o crit-lista dentro do corpo (onde os critérios estão)
      var critLista = corpo.querySelector('.crit-lista');
      if (!critLista) return;
      
      // Criar o container da justificativa
      var box = document.createElement('div');
      box.className = 'just-conceito-box';
      
      var currentText = justState[indId] || '';
      var isAvaliador = window.location.search.indexOf('perfil=avaliador') >= 0;
      
      if (isAvaliador) {
        // Modo avaliador: somente leitura
        box.innerHTML = 
          '<div class="just-conceito-header">' +
            '<span class="just-conceito-label f-code">JUSTIFICATIVA DO CONCEITO</span>' +
          '</div>' +
          '<div class="just-conceito-readonly">' + (currentText ? escapeHtml(currentText).replace(/\n/g, '<br>') : '<em style="color:var(--txt-3,#94a3b8)">Nenhuma justificativa registrada.</em>') + '</div>';
      } else {
        // Modo organização: editável pela equipe
        box.innerHTML = 
          '<div class="just-conceito-header">' +
            '<span class="just-conceito-label f-code">JUSTIFICATIVA DO CONCEITO</span>' +
          '</div>' +
          '<textarea class="just-conceito-textarea" ' +
            'rows="4" ' +
            'placeholder="Descreva aqui a justificativa do conceito atribuído, referenciando os documentos enviados como evidência para cada critério..." ' +
            'data-ind-id="' + indId + '"' +
          '>' + escapeHtml(currentText) + '</textarea>';
        
        // Adicionar evento de mudança
        var textarea = box.querySelector('.just-conceito-textarea');
        if (textarea) {
          textarea.addEventListener('input', function(e) {
            justState[indId] = e.target.value;
            debouncedSave();
          });
          textarea.addEventListener('blur', function(e) {
            justState[indId] = e.target.value;
            saveState();
          });
        }
      }
      
      // Inserir ANTES do crit-lista (entre critério de análise e documentos)
      critLista.parentNode.insertBefore(box, critLista);
    });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
  }

  // ---- CSS ----
  function injectStyles() {
    var style = document.createElement('style');
    style.textContent = `
      .just-conceito-box {
        margin-top: 16px;
        margin-bottom: 16px;
        padding: 14px 16px;
        background: var(--card-1, #f8f9fa);
        border: 1px solid var(--line-soft, #e2e8f0);
        border-radius: 8px;
        border-left: 3px solid #178A5E;
      }
      .just-conceito-header {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .just-conceito-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #178A5E;
        text-transform: uppercase;
      }
      .just-conceito-hint {
        font-size: 12px;
        color: var(--txt-2, #64748b);
        line-height: 1.4;
      }
      .just-conceito-textarea {
        width: 100%;
        min-height: 100px;
        padding: 12px;
        border: 1px solid var(--line-soft, #e2e8f0);
        border-radius: 6px;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.6;
        color: var(--txt-1, #1e293b);
        background: var(--bg, #fff);
        resize: vertical;
        transition: border-color 0.2s;
      }
      .just-conceito-textarea:focus {
        outline: none;
        border-color: #178A5E;
        box-shadow: 0 0 0 2px rgba(23, 138, 94, 0.1);
      }
      .just-conceito-textarea::placeholder {
        color: var(--txt-3, #94a3b8);
      }
      .just-conceito-readonly {
        padding: 12px;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.6;
        color: var(--txt-1, #1e293b);
        background: var(--bg, #fff);
        border: 1px solid var(--line-soft, #e2e8f0);
        border-radius: 6px;
        min-height: 40px;
        white-space: pre-wrap;
      }
    `;
    document.head.appendChild(style);
  }

  // ---- Observer ----
  function init() {
    injectStyles();
    loadState().then(function() {
      injectJustificativa();
    });

    // Observar mudanças no DOM para reinjetar quando indicadores são abertos/fechados
    var observer = new MutationObserver(function(mutations) {
      var shouldCheck = false;
      for (var i = 0; i < mutations.length; i++) {
        var m = mutations[i];
        if (m.type === 'childList' || 
            (m.type === 'attributes' && m.attributeName === 'class')) {
          shouldCheck = true;
          break;
        }
      }
      if (shouldCheck) {
        setTimeout(injectJustificativa, 50);
      }
    });

    var root = document.getElementById('root');
    if (root) {
      observer.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    }
  }

  // Iniciar quando o DOM estiver pronto
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

// ---- JUSTIFICATIVA CONCEITO INJECT END ----
</script>



























































<script>
// ============================================================
// LINKS DE PASTAS COMPARTILHADAS + MODOS A/B POR INDICADOR
// Modo A: Link único + marcação manual de critérios atendidos
// Modo B: Evidência por critério (comportamento original)
// ============================================================

(function() {
  'use strict';

  var STORAGE_KEY = 'links-pastas-enfermagem-v2';
  var MAIN_STATE_KEY = 'avaliacao-mec-enfermagem-uniego-v1';
  var MODE_KEY = 'indicador-modos-enfermagem-v1'; // Persiste modo A/B por indicador
  var MANUAL_KEY = 'indicador-manual-checks-enfermagem-v1'; // Persiste checkboxes manuais do modo A
  var MODEADOC_KEY = 'indicador-modeA-docs-v1'; // Persiste docs gerais do modo A
  var DI_IDS = ['DI.1','DI.2','DI.3','DI.4'];
  var VIRTUAL_DOC_LINK = '#__link-pasta-virtual__';

  // State objects
  var linksState = {}; // Links de pasta por critério (modo B)
  var modesState = {}; // { "1.1": "A" | "B", ... }
  var manualChecks = {}; // { "1.1": [0, 2, 4], ... } (índices marcados manualmente)
  var modeADocs = {}; // { "1.1": [{url, descricao, id}], ... } (docs gerais do modo A)
  var mainState = null;
  var saveTimeout = null;
  // Docs virtuais eliminados - links persistidos apenas em links-pastas-enfermagem-v2

  // ---- Persistência ----
  async function loadState() {
    try {
      var resp = await fetch('/api/estado?chave=' + encodeURIComponent(STORAGE_KEY));
      if (resp.ok) { var d = await resp.json(); if (d.value) linksState = JSON.parse(d.value); }
    } catch(e) {}
    // Estado carregado com sucesso
    try {
      var resp2 = await fetch('/api/estado?chave=' + encodeURIComponent(MODE_KEY));
      if (resp2.ok) { var d2 = await resp2.json(); if (d2.value) modesState = JSON.parse(d2.value); }
    } catch(e) {}
    try {
      var resp3 = await fetch('/api/estado?chave=' + encodeURIComponent(MANUAL_KEY));
      if (resp3.ok) { var d3 = await resp3.json(); if (d3.value) manualChecks = JSON.parse(d3.value); }
    } catch(e) {}
    try {
      var resp4 = await fetch('/api/estado?chave=' + encodeURIComponent(MODEADOC_KEY));
      if (resp4.ok) { var d4 = await resp4.json(); if (d4.value) modeADocs = JSON.parse(d4.value); }
    } catch(e) {}
    // Migração v1 - só executar se realmente há dados para migrar
    try {
      var respM = await fetch('/api/estado?chave=' + encodeURIComponent('links-pastas-enfermagem-v1'));
      if (respM.ok) {
        var dM = await respM.json();
        if (dM.value) {
          var old = JSON.parse(dM.value);
          var hasData = Object.keys(old).some(function(k) { return old[k] && old[k].length > 0; });
          if (hasData) {
            Object.keys(old).forEach(function(indId) {
              if (old[indId] && old[indId].length > 0) {
                var k = indId + '-0';
                if (!linksState[k]) linksState[k] = [];
                linksState[k] = linksState[k].concat(old[indId]);
              }
            });
            await saveLinksState();
            await fetch('/api/estado', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({chave:'links-pastas-enfermagem-v1', valor:JSON.stringify({})}) });
          }
        }
      }
    } catch(e) {}
  }

  async function loadMainState() {
    try {
      var resp = await fetch('/api/estado?chave=' + encodeURIComponent(MAIN_STATE_KEY));
      if (resp.ok) { var d = await resp.json(); if (d.value) mainState = JSON.parse(d.value); }
    } catch(e) {}
  }

  async function saveLinksState() {
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var resp = await fetch('/api/estado', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({chave:STORAGE_KEY, valor:JSON.stringify(linksState)}) });
        if (resp.ok) return;
      } catch(e) {}
      await new Promise(function(r) { setTimeout(r, 500); });
    }
    console.error('[ARCHE] Falha ao salvar links ap\u00f3s 3 tentativas');
  }
  async function saveModesState() {
    try { await fetch('/api/estado', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({chave:MODE_KEY, valor:JSON.stringify(modesState)}) }); } catch(e) {}
  }
  async function saveManualChecks() {
    try { await fetch('/api/estado', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({chave:MANUAL_KEY, valor:JSON.stringify(manualChecks)}) }); } catch(e) {}
  }
  async function saveModeADocs() {
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var resp = await fetch('/api/estado', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({chave:MODEADOC_KEY, valor:JSON.stringify(modeADocs)}) });
        if (resp.ok) return;
      } catch(e) {}
      await new Promise(function(r) { setTimeout(r, 500); });
    }
    console.error('[ARCHE] Falha ao salvar docs modo A ap\u00f3s 3 tentativas');
  }
  async function saveMainState() {
    try { await fetch('/api/estado', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({chave:MAIN_STATE_KEY, valor:JSON.stringify(mainState)}) }); } catch(e) {}
  }

  function debouncedSave(fn) {
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(fn, 500);
  }

  function isAvaliadorMode() {
    // Detectar via URL (link externo) ou via aba ativa no DOM (tab interna)
    if (window.location.search.indexOf('perfil=avaliador') >= 0) return true;
    var avTab = document.querySelector('[role="tab"][aria-selected="true"]');
    if (avTab && avTab.textContent.indexOf('Avaliador') >= 0) return true;
    return false;
  }

  function getMode(indId) {
    return modesState[indId] || 'B'; // Default: modo B (comportamento original)
  }

  // ---- SINCRONIZAÇÃO VISUAL (sem tocar no estado do React) ----
  // Os links são persistidos separadamente em links-pastas-enfermagem-v2.
  // A exibição visual é controlada pelo DOM (markCriterionAsAttended + updateDimensionCounts).
  // NÃO tocamos mais no estado principal do React para evitar conflitos.
  async function syncToMainState() {
    // Função mantida como no-op para compatibilidade de chamadas existentes
    // A sincronização visual é feita por injectInCriteria + updateDimensionCounts
    return;
  }

  // ---- Esconder docs virtuais renderizados pelo React ----
  function hideVirtualDocs() {
    var allDocLinks = document.querySelectorAll('a');
    allDocLinks.forEach(function(a) {
      var href = a.getAttribute('href') || '';
      if (href.indexOf('__link-pasta-virtual__') >= 0) {
        var docItem = a.closest('.doc-item');
        if (docItem) {
          docItem.style.display = 'none';
        } else {
          var docInfo = a.parentElement;
          if (docInfo && docInfo.parentElement) {
            docInfo.parentElement.style.display = 'none';
          }
        }
      }
    });
  }

  // ---- SELETOR DE MODO A/B ----
  function renderModeSelector(card, indId, readOnly) {
    // Não re-injetar se já existe
    if (card.querySelector('.mode-selector-ab')) return;

    var critRot = card.querySelector('.crit-rot');
    var critLista = card.querySelector('.crit-lista');
    // Precisa de pelo menos um ponto de inserção
    if (!critRot && !critLista) return;

    var mode = getMode(indId);
    var container = document.createElement('div');
    container.className = 'mode-selector-ab';
    container.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 16px;margin:8px 0 4px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;';

    var label = document.createElement('span');
    label.textContent = 'Modo de comprovação:';
    label.style.cssText = 'font-weight:600;color:#475569;font-size:11px;letter-spacing:0.03em;';
    container.appendChild(label);

    if (readOnly) {
      // No modo avaliador, apenas mostrar qual modo está ativo
      var modeLabel = document.createElement('span');
      modeLabel.style.cssText = 'padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;';
      if (mode === 'A') {
        modeLabel.textContent = 'A — Documento geral + marcação manual';
        modeLabel.style.background = '#dbeafe';
        modeLabel.style.color = '#1e40af';
      } else {
        modeLabel.textContent = 'B — Evidência por critério';
        modeLabel.style.background = '#d1fae5';
        modeLabel.style.color = '#065f46';
      }
      container.appendChild(modeLabel);
    } else {
      // Botões de seleção
      var btnA = document.createElement('button');
      btnA.textContent = 'A — Doc geral + marcação';
      btnA.style.cssText = 'padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid ' + (mode === 'A' ? '#3b82f6' : '#cbd5e1') + ';background:' + (mode === 'A' ? '#dbeafe' : '#fff') + ';color:' + (mode === 'A' ? '#1e40af' : '#64748b') + ';';

      var btnB = document.createElement('button');
      btnB.textContent = 'B — Evidência por critério';
      btnB.style.cssText = 'padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid ' + (mode === 'B' ? '#10b981' : '#cbd5e1') + ';background:' + (mode === 'B' ? '#d1fae5' : '#fff') + ';color:' + (mode === 'B' ? '#065f46' : '#64748b') + ';';

      btnA.onclick = async function() {
        _injecting = true;
        try {
          modesState[indId] = 'A';
          await saveModesState();
          await syncToMainState();
          // Re-render: remover elementos injetados e re-injetar (manter flag)
          cleanInjected(card, true);
          injectInCard(card, indId, false);
        } finally {
          _injecting = false;
        }
      };

      btnB.onclick = async function() {
        _injecting = true;
        try {
          modesState[indId] = 'B';
          await saveModesState();
          await syncToMainState();
          cleanInjected(card, true);
          injectInCard(card, indId, false);
        } finally {
          _injecting = false;
        }
      };

      container.appendChild(btnA);
      container.appendChild(btnB);
    }

    // Inserir após o crit-rot (ou antes do crit-lista se crit-rot não existe)
    if (critRot) {
      critRot.parentNode.insertBefore(container, critRot.nextSibling);
    } else if (critLista) {
      critLista.parentNode.insertBefore(container, critLista);
    }
  }

  // ---- MODO A: Renderizar documento geral + checkboxes manuais ----
  function renderModeA(card, indId, readOnly) {
    var critLista = card.querySelector('.crit-lista');
    if (!critLista) return;

    // Renderizar área de documento geral antes da lista de critérios
    var modeABox = document.createElement('div');
    modeABox.className = 'mode-a-box';
    modeABox.style.cssText = 'margin:8px 0 12px;padding:12px 16px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;';

    var title = document.createElement('p');
    title.style.cssText = 'font-size:11px;font-weight:700;color:#1e40af;letter-spacing:0.05em;margin:0 0 8px;';
    title.textContent = 'DOCUMENTOS E EVID\u00CANCIA GERAIS DO INDICADOR';
    modeABox.appendChild(title);

    // Renderizar docs existentes do modo A
    var docs = modeADocs[indId] || [];
    docs.forEach(function(doc, idx) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#fff;border:1px solid #dbeafe;border-radius:6px;margin-bottom:6px;';

      var linkEl = document.createElement('a');
      linkEl.href = doc.url;
      linkEl.target = '_blank';
      linkEl.rel = 'noopener noreferrer';
      linkEl.style.cssText = 'color:#1e40af;font-weight:600;font-size:12px;text-decoration:underline;flex:1;';
      var displayText = doc.descricao || doc.url;
      try {
        var urlObj = new URL(doc.url);
        var icon = '🔗';
        if (urlObj.hostname.includes('drive.google')) icon = '📁';
        else if (urlObj.hostname.includes('onedrive') || urlObj.hostname.includes('sharepoint')) icon = '📁';
        else if (urlObj.hostname.includes('dropbox')) icon = '📁';
        else if (urlObj.pathname.match(/\.(pdf|doc|docx|xls|xlsx|ppt|pptx)$/i)) icon = '📄';
        else if (urlObj.hostname.includes('gov.br') || urlObj.hostname.includes('.edu')) icon = '🏛️';
        if (!doc.descricao) displayText = icon + ' ' + urlObj.hostname + (urlObj.pathname.length > 1 ? urlObj.pathname.substring(0, 40) : '');
        else displayText = icon + ' ' + doc.descricao;
      } catch(e) { displayText = '🔗 ' + (doc.descricao || doc.url.substring(0, 50)); }
      linkEl.textContent = displayText;
      row.appendChild(linkEl);

      // Mostrar URL abaixo quando temos descrição (para o usuário ver o endereço real)
      if (doc.descricao) {
        var urlSmall = document.createElement('span');
        urlSmall.textContent = doc.url;
        urlSmall.style.cssText = 'font-size:10px;color:#94a3b8;flex:1;word-break:break-all;';
        row.appendChild(urlSmall);
      }

      if (!readOnly) {
        var delBtn = document.createElement('button');
        delBtn.innerHTML = '&times;';
        delBtn.style.cssText = 'background:none;border:none;color:#dc2626;font-size:16px;cursor:pointer;padding:0 4px;line-height:1;';
        delBtn.title = 'Remover';
        (function(i) {
          delBtn.onclick = async function() {
            modeADocs[indId].splice(i, 1);
            if (modeADocs[indId].length === 0) delete modeADocs[indId];
            await saveModeADocs();
            _injecting = true;
            cleanInjected(card);
            card.dataset.linksInjected = 'true';
            injectInCard(card, indId, false);
            _injecting = false;
          };
        })(idx);
        row.appendChild(delBtn);
      }

      modeABox.appendChild(row);
    });

    // Botão para adicionar doc geral (se não for avaliador)
    if (!readOnly) {
      var addBtn = document.createElement('button');
      addBtn.textContent = '+ Adicionar link de evid\u00eancia geral';
      addBtn.style.cssText = 'display:block;background:none;border:1px dashed #3b82f6;color:#3b82f6;padding:6px 14px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;margin-top:6px;transition:background .2s;';
      addBtn.onmouseenter = function(){ this.style.background='#eff6ff'; };
      addBtn.onmouseleave = function(){ this.style.background='none'; };

      addBtn.onclick = function() {
        var existing = modeABox.querySelector('.mode-a-form');
        if (existing) { existing.remove(); return; }

        var form = document.createElement('div');
        form.className = 'mode-a-form';
        form.style.cssText = 'margin-top:8px;padding:10px;border:1px solid #bfdbfe;border-radius:6px;background:#fff;';

        var urlInput = document.createElement('input');
        urlInput.type = 'text';
        urlInput.placeholder = 'Cole aqui o link (site, documento, pasta compartilhada...)';
        urlInput.style.cssText = 'width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;margin-bottom:6px;box-sizing:border-box;';
        form.appendChild(urlInput);

        var descInput = document.createElement('input');
        descInput.type = 'text';
        descInput.placeholder = 'Descri\u00e7\u00e3o do link (ex: Resolu\u00e7\u00e3o CEP, Site do programa...)';
        descInput.style.cssText = 'width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;margin-bottom:8px;box-sizing:border-box;';
        form.appendChild(descInput);

        var btnRow = document.createElement('div');
        btnRow.style.cssText = 'display:flex;gap:6px;justify-content:flex-end;';

        var cancelBtn = document.createElement('button');
        cancelBtn.textContent = 'Cancelar';
        cancelBtn.style.cssText = 'background:#f1f5f9;border:1px solid #e2e8f0;color:#64748b;padding:5px 10px;border-radius:5px;font-size:11px;cursor:pointer;';
        cancelBtn.onclick = function() { form.remove(); };
        btnRow.appendChild(cancelBtn);

        var saveBtn = document.createElement('button');
        saveBtn.textContent = 'Adicionar';
        saveBtn.style.cssText = 'background:#3b82f6;border:none;color:#fff;padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;';
        saveBtn.onclick = async function() {
          var url = urlInput.value.trim();
          if (!url || (!url.startsWith('http://') && !url.startsWith('https://'))) { urlInput.style.borderColor='#dc2626'; return; }
          if (!modeADocs[indId]) modeADocs[indId] = [];
          modeADocs[indId].push({ url: url, descricao: descInput.value.trim(), id: Date.now() });
          await saveModeADocs();
          showToast('\u2705 Link salvo com sucesso!');
          _injecting = true;
          cleanInjected(card);
          card.dataset.linksInjected = 'true';
          injectInCard(card, indId, false);
          _injecting = false;
        };
        btnRow.appendChild(saveBtn);
        form.appendChild(btnRow);
        modeABox.appendChild(form);
        urlInput.focus();
      };
      modeABox.appendChild(addBtn);
    }

    // Inserir antes do crit-lista
    critLista.parentNode.insertBefore(modeABox, critLista);

    // Resetar estado visual dos critérios para refletir modo A
    var checks = manualChecks[indId] || [];
    var crits = critLista.querySelectorAll('.crit');
    crits.forEach(function(critEl, idx) {
      // Resetar: só marcar como 'ok' se estiver nos manualChecks
      var isCheckedReset = checks.indexOf(idx) >= 0;
      if (!isCheckedReset) {
        critEl.classList.remove('ok');
        critEl.classList.add('pend');
        var checkSpan = critEl.querySelector('.crit-check');
        if (checkSpan) {
          checkSpan.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>';
        }
      }
    });

    // Agora, para cada critério, adicionar checkbox "Atendido"
    crits.forEach(function(critEl, idx) {
      var checkContainer = document.createElement('div');
      checkContainer.className = 'mode-a-check';
      checkContainer.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:6px;padding:6px 10px 6px 32px;';

      var isChecked = checks.indexOf(idx) >= 0;

      if (readOnly) {
        var badge = document.createElement('span');
        badge.style.cssText = 'display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;';
        if (isChecked) {
          badge.style.background = '#d1fae5';
          badge.style.color = '#065f46';
          badge.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Atendido';
        } else {
          badge.style.background = '#fef3c7';
          badge.style.color = '#92400e';
          badge.textContent = 'Pendente';
        }
        checkContainer.appendChild(badge);
      } else {
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = isChecked;
        cb.style.cssText = 'width:16px;height:16px;cursor:pointer;accent-color:#3b82f6;';
        cb.id = 'mode-a-check-' + indId + '-' + idx;

        var lbl = document.createElement('label');
        lbl.htmlFor = cb.id;
        lbl.textContent = isChecked ? 'Critério atendido' : 'Marcar como atendido';
        lbl.style.cssText = 'font-size:11px;font-weight:600;cursor:pointer;color:' + (isChecked ? '#065f46' : '#64748b') + ';';

        (function(critIdx) {
          cb.onchange = async function() {
            if (!manualChecks[indId]) manualChecks[indId] = [];
            var semDocEl = critEl.querySelector('.sem-doc');
            if (this.checked) {
              if (manualChecks[indId].indexOf(critIdx) < 0) manualChecks[indId].push(critIdx);
              lbl.textContent = 'Critério atendido';
              lbl.style.color = '#065f46';
              critEl.classList.add('ok');
              critEl.classList.remove('pend');
              if (semDocEl) semDocEl.style.display = 'none';
            } else {
              manualChecks[indId] = manualChecks[indId].filter(function(i) { return i !== critIdx; });
              lbl.textContent = 'Marcar como atendido';
              lbl.style.color = '#64748b';
              if (semDocEl) semDocEl.style.display = '';
              // Só remover 'ok' se não tiver doc real
              var docLista = critEl.querySelector('.doc-lista');
              var hasRealDoc = docLista && docLista.querySelector('.doc-item');
              if (!hasRealDoc) {
                critEl.classList.remove('ok');
                critEl.classList.add('pend');
              }
            }
            await saveManualChecks();
            await syncToMainState();
            updateIndicatorCount(card);
          };
        })(idx);

        checkContainer.appendChild(cb);
        checkContainer.appendChild(lbl);
      }

      // Marcar visualmente o critério como atendido se checkbox marcado
      if (isChecked) {
        critEl.classList.add('ok');
        critEl.classList.remove('pend');
      }

      critEl.appendChild(checkContainer);
    });

    // Esconder elementos do modo B (upload e links de pasta por critério) quando no modo A
    crits.forEach(function(critEl, idx) {
      var addDoc = critEl.querySelector('.add-doc');
      var docLista = critEl.querySelector('.doc-lista');
      var linksC = critEl.querySelector('.crit-links-container');
      var semDoc = critEl.querySelector('.sem-doc');
      if (addDoc) addDoc.style.display = 'none';
      if (docLista) docLista.style.display = 'none';
      if (linksC) linksC.style.display = 'none';
      // Esconder "Sem comprovante anexado" quando critério está marcado como atendido no modo A
      if (semDoc && checks.indexOf(idx) >= 0) semDoc.style.display = 'none';
    });
  }

  // ---- MODO B: Renderizar links de pasta por critério (comportamento original) ----
  function renderModeB(card, indId, readOnly) {
    var critLista = card.querySelector('.crit-lista');
    if (!critLista) return;

    var crits = critLista.querySelectorAll('.crit');
    crits.forEach(function(critEl, critIdx) {
      if (critEl.querySelector('.crit-links-container')) return;

      var critKey = indId + '-' + critIdx;
      var links = linksState[critKey] || [];

      if (readOnly && links.length === 0) return;

      if (links.length > 0) {
        markCriterionAsAttended(critEl, true);
      }

      var linksContainer = document.createElement('div');
      linksContainer.className = 'crit-links-container';
      linksContainer.style.cssText = 'margin-top:6px;padding-left:32px;';

      renderCritLinks(linksContainer, critKey, readOnly);

      if (!readOnly) {
        renderAddLinkButton(linksContainer, critKey);
      }

      critEl.appendChild(linksContainer);
    });
  }

    var links = linksState[critKey] || [];

    if (links.length === 0 && readOnly) return;

    links.forEach(function(link, idx) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#f0fdfa;border:1px solid #99f6e4;border-radius:6px;margin-top:6px;';

      var icon = document.createElement('span');

      var info = document.createElement('div');
      info.style.cssText = 'flex:1;min-width:0;';

      linkEl.href = link.url;
      linkEl.target = '_blank';
      linkEl.rel = 'noopener noreferrer';
      linkEl.style.cssText = 'color:#0d9488;font-weight:600;font-size:12px;text-decoration:underline;word-break:break-all;display:inline-flex;align-items:center;gap:3px;';
      var displayText = link.descricao || link.url;
      try {
        var urlObj = new URL(link.url);
        var icon = '🔗';
        if (urlObj.hostname.includes('drive.google')) icon = '📁';
        else if (urlObj.hostname.includes('onedrive') || urlObj.hostname.includes('sharepoint')) icon = '📁';
        else if (urlObj.hostname.includes('dropbox')) icon = '📁';
        else if (urlObj.pathname.match(/\.(pdf|doc|docx|xls|xlsx|ppt|pptx)$/i)) icon = '📄';
        else if (urlObj.hostname.includes('gov.br') || urlObj.hostname.includes('.edu')) icon = '🏛️';

        removeBtn.title = 'Remover link';
        (function(linkIdx, cKey) {
          removeBtn.onclick = async function() {
            linksState[cKey].splice(linkIdx, 1);
            if (linksState[cKey].length === 0) delete linksState[cKey];
            await saveLinksState();
            var parts = cKey.split('-');
            var critIdx = parts.pop();
            var indId2 = parts.join('-');

              await removeLinkDocFromMainState(indId2, critIdx);

              var linksC = critEl.querySelector('.crit-links-container');

        var url = urlInput.value.trim();
        if (!url || (!url.startsWith('http://') && !url.startsWith('https://'))) { urlInput.style.borderColor='#dc2626'; return; }
        if (!linksState[critKey]) linksState[critKey] = [];
        linksState[critKey].push({ url: url, descricao: descInput.value.trim(), id: Date.now() + Math.random() });
        await saveLinksState();
        var parts = critKey.split('-');
        var critIdx = parts.pop();
        var indId2 = parts.join('-');
        await addLinkDocToMainState(indId2, critIdx, url);

          var linksC = critEl.querySelector('.crit-links-container');

          var indCard = critEl.closest('.ind-card');
          if (indCard) updateIndicatorCount(indCard);

      };
      btnRow.appendChild(saveBtn);
      formDiv.appendChild(btnRow);
      btn.parentNode.insertBefore(formDiv, btn.nextSibling);

      urlInput.focus();

  }

  async function removeLinkDocFromMainState(indId, critIdx) {
