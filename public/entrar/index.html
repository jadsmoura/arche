<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · ARCHÉ · PROPPEX / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  :root{--bg:#eef1f4;--card:#fff;--ink:#182632;--muted:#657179;--line:#dde4e8;
    --teal:#1c3742;--teal2:#2d535c;--cyan:#40717e;--cyan-soft:#e6f5fa;
    --warn:#b26a00;--warn-soft:#fff3e0;--ok:#2e7d32;--ok-soft:#e8f5e9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Figtree',-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px;max-width:420px;width:100%;
    box-shadow:0 1px 2px rgba(24,38,50,.06),0 12px 34px rgba(24,38,50,.08);text-align:center}
  .logo{width:52px;height:52px;margin:0 auto 10px}
  h1{font-size:22px;font-weight:800;letter-spacing:2px;color:var(--teal)}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 24px}
  .aviso{border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:16px;text-align:left}
  .a-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #ffe0b2}
  .a-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #c8e6c9}
  .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
  input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font:inherit;font-size:14px;margin-bottom:10px}
  input:focus{outline:2px solid var(--cyan);border-color:var(--cyan)}
  .bt{width:100%;border:0;border-radius:9px;padding:12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;
    background:var(--teal);color:#fff}
  .bt:hover{background:var(--teal2)}
  .bt:disabled{opacity:.6;cursor:wait}
  #gbox{display:flex;justify-content:center;margin-bottom:4px}
  .volta{margin-top:22px;font-size:13px}
  .volta a{color:var(--cyan);text-decoration:none;font-weight:600}
  .rodape{color:var(--muted);font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="box">
  <svg class="logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <path d="M8 34 L8 20 A12 12 0 0 1 32 20 L32 34" fill="none" stroke="#1c3742" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="20" cy="21" r="4" fill="#40717e"/>
  </svg>
  <h1>ARCHÉ</h1>
  <div class="sub">Acesso aos setores de gestão da PROPPEX<br>(Pesquisa · Extensão · Inovação)</div>

  <div id="msg"></div>

  <div id="gbox"></div>

  <div class="sep">ou</div>

  <form id="passo1" onsubmit="return pedirCodigo(event)">
    <input type="email" id="email" placeholder="seu e-mail (ex.: nome@uniego.edu.br)" required>
    <button class="bt" id="bt-codigo" type="submit">Receber código por e-mail</button>
  </form>

  <form id="passo2" style="display:none" onsubmit="return confirmarCodigo(event)">
    <input type="text" id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
      placeholder="digite o código de 6 dígitos" style="text-align:center;font-size:22px;letter-spacing:8px;font-weight:800">
    <button class="bt" id="bt-verificar" type="submit">Entrar</button>
    <div style="margin-top:10px;font-size:12.5px;color:var(--muted)">
      Não chegou? Confira o spam ou <a href="#" onclick="voltarPasso1();return false" style="color:var(--cyan)">reenviar código</a>.
    </div>
  </form>

  <div class="volta"><a href="/">← voltar ao portal</a></div>
</div>
<div class="rodape">Contas @uniego.edu.br entram automaticamente · demais aguardam aprovação da PROPPEX</div>

<script>
const q = new URLSearchParams(location.search);
const NEXT = q.get("next") || "/";
const msg = document.getElementById("msg");
if (q.get("pendente")) msg.innerHTML = '<div class="aviso a-warn">⏳ Seu acesso está <b>aguardando aprovação</b> da PROPPEX. Você receberá a liberação em breve — tente novamente mais tarde.</div>';

function voltarPasso1(){
  document.getElementById("passo2").style.display="none";
  document.getElementById("passo1").style.display="block";
  const bt=document.getElementById("bt-codigo"); bt.disabled=false; bt.textContent="Receber código por e-mail";
}
async function pedirCodigo(e){
  e.preventDefault();
  const bt = document.getElementById("bt-codigo");
  bt.disabled = true; bt.textContent = "Enviando…";
  try{
    const r = await fetch("/auth/codigo", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email: document.getElementById("email").value.trim()})});
    const j = await r.json();
    if (j.ok){
      msg.innerHTML = '<div class="aviso a-ok">📬 Código enviado para <b>'+document.getElementById("email").value.trim()+'</b>. Digite-o abaixo (vale 10 minutos).</div>';
      document.getElementById("passo1").style.display="none";
      document.getElementById("passo2").style.display="block";
      document.getElementById("codigo").focus();
    } else { msg.innerHTML = '<div class="aviso a-warn">⚠ ' + (j.error||"Falha ao enviar") + '</div>'; bt.disabled=false; bt.textContent="Receber código por e-mail"; }
  }catch{ bt.disabled=false; bt.textContent="Receber código por e-mail"; }
  return false;
}
async function confirmarCodigo(e){
  e.preventDefault();
  const bt = document.getElementById("bt-verificar");
  bt.disabled = true; bt.textContent = "Verificando…";
  try{
    const r = await fetch("/auth/codigo/verificar", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email: document.getElementById("email").value.trim(),
        codigo: document.getElementById("codigo").value.trim()})});
    const j = await r.json();
    if (j.ok) location.href = j.papel === "pendente" ? "/entrar?pendente=1" : NEXT;
    else { msg.innerHTML = '<div class="aviso a-warn">⚠ ' + (j.error||"Código inválido") + '</div>'; bt.disabled=false; bt.textContent="Entrar"; }
  }catch{ bt.disabled=false; bt.textContent="Entrar"; }
  return false;
}

/* Botão Google (aparece só se o servidor tiver GOOGLE_WEB_CLIENT_ID) */
fetch("/api/authcfg").then(r=>r.json()).then(cfg=>{
  if(!cfg.googleClientId) return;
  const s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client"; s.async = true;
  s.onload = ()=>{
    google.accounts.id.initialize({
      client_id: cfg.googleClientId,
      callback: async (resp)=>{
        const r = await fetch("/auth/google", {method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({credential: resp.credential})});
        const j = await r.json();
        if (j.ok) location.href = j.papel === "pendente" ? "/entrar?pendente=1" : NEXT;
        else msg.innerHTML = '<div class="aviso a-warn">⚠ ' + (j.error||"Falha no login Google") + '</div>';
      },
    });
    google.accounts.id.renderButton(document.getElementById("gbox"),
      { theme:"outline", size:"large", text:"signin_with", locale:"pt-BR", width:340 });
  };
  document.head.appendChild(s);
});
</script>
</body>
</html>
