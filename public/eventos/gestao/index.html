<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHÉ EV · Eventos · PROPPEX / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
  :root{
    --brand:#1c3742; --brand-2:#2d535c; --brand-3:#40717e; --accent:#71c8e2;
    --bg:#eef1f4; --card:#fff; --line:#dde4e8; --line-2:#eceff3; --wash:#e6f5fa;
    --ink:#182632; --ink-soft:#3a4650; --muted:#657179; --muted-2:#a9b4c0;
    --ok:#3f8a5d; --ok-soft:#e5f3ea; --warn:#c98a2b; --warn-soft:#fbf3e4;
    --err:#a1524c; --err-soft:#f6e9e7; --info:#40717e; --info-soft:#e8f4fa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-3);text-decoration:none}
  a:hover{color:var(--brand-2)}
  ::selection{background:var(--accent);color:var(--brand)}
  button{font-family:Figtree,system-ui,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
  .f-disp{font-family:Sora,sans-serif}

  /* ------------------------------- casca ---------------------------------
     A mesma casca dos demais setores (ARCHÉ EX / IC): barra lateral escura
     fixa à esquerda, conteúdo com trilha e título à direita. A diferença do
     EV é o SELETOR DE EVENTO no topo da barra (molde Even3, pedido do dono):
     trocar ali troca o evento de TODAS as guias de evento de uma vez. */
  .app{display:flex;min-height:100vh}
  .side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side-marca{padding:20px 22px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
  .side-marca b{color:var(--accent);font-weight:800}
  .side-sel{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-sel .rot{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.4);font-weight:600;margin:0 2px 6px}
  .side-sel select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
    color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:Figtree,system-ui,sans-serif}
  .side-sel select:focus{outline:none;border-color:var(--accent);box-shadow:none}
  .side-sel select option,.side-sel select optgroup{color:var(--ink);background:#fff}
  .side-sel .todos{background:none;border:0;color:rgba(255,255,255,.55);cursor:pointer;
    font-size:11.5px;font-weight:600;padding:8px 2px 0}
  .side-sel .todos:hover{color:#fff}
  .side-nav{padding:10px 12px;flex:1;overflow-y:auto}
  .side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:12px 12px 6px}
  .side-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;
    margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
    border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
    transition:background .15s,color .15s}
  .side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
  .side-item svg{flex:none}
  .side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
  .side-pe .av{width:34px;height:34px;border-radius:50%;background:var(--brand-3);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
  .side-pe .av img{width:100%;height:100%;object-fit:cover}
  .side-pe .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
  .side-pe .pp{font-size:11px;color:rgba(255,255,255,.5)}
  .side-pe .sair{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-weight:600}
  .side-pe .sair:hover{color:#fff}

  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .topbar .dir{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .area{padding:28px 32px;flex:1}
  .limite{max-width:1180px}
  h1{font-family:Sora,sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}

  /* faixa do evento selecionado, no topo do conteúdo das guias de evento */
  .ctx{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--wash);
    border:1px solid #cfe6f2;border-radius:10px;padding:10px 14px;margin-bottom:18px}
  .ctx .nm{font-family:Sora,sans-serif;font-weight:700;font-size:14px;color:var(--brand)}
  .ctx .meta{font-size:12.5px;color:var(--muted)}
  .ctx .acoes{margin-left:auto;display:flex;gap:8px;align-items:center}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
  .sec-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:0 0 6px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .muted{color:var(--muted);font-size:12.5px;font-weight:400}
  .hide{display:none!important}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .grid2>*,.grid3>*,.stat>*{min-width:0}
  @media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px;
    text-transform:uppercase;letter-spacing:.04em}
  input,select,textarea{width:100%;border:1px solid #cfd6de;border-radius:8px;padding:10px 12px;
    font-family:Figtree,system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{min-height:84px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(64,113,126,.12)}

  .bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bt-pri{background:var(--brand);color:#fff}
  .bt-pri:hover{background:var(--brand-2)}
  .bt-sec{background:var(--info-soft);color:var(--brand);border-color:#cfe6f2}
  .bt-sec:hover{background:#dbeef8}
  .bt-ghost{background:#fff;color:var(--muted);border-color:#cfd6de}
  .bt-ghost:hover{color:var(--ink);border-color:var(--brand-3)}
  .bt-ok{background:var(--ok-soft);color:var(--ok);border-color:#cfeeda}
  .bt-warn{background:var(--warn-soft);color:var(--warn);border-color:#f0e0bd}
  .bt:disabled{opacity:.5;cursor:not-allowed}
  .exp{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .lk{background:none;border:0;color:var(--brand-3);cursor:pointer;font-weight:600;font-size:12.5px;padding:0}
  .lk:hover{color:var(--brand-2)}

  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .banner{border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500;line-height:1.5}
  .ba-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0e0bd}
  .ba-info{background:var(--info-soft);color:var(--brand);border:1px solid #cfe6f2}
  .ba-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #cfeeda}

  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:14px}
  .stat .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .s b{font-family:Sora,sans-serif;font-size:22px;display:block;color:var(--ink);line-height:1.1}
  .stat .s span{font-size:11.5px;color:var(--muted)}
  table.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.pt th{background:#f7f9fb;color:var(--muted);padding:9px 10px;text-align:left;font-size:11.5px;
    font-weight:600;border-bottom:1px solid var(--line)}
  table.pt td{border-bottom:1px solid var(--line-2);padding:8px 10px;color:var(--ink-soft)}
  .cnt{font-size:12.5px;color:var(--muted);margin:8px 0}
  .scrollx{overflow-x:auto}
  .linha{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .linha:last-child{border-bottom:0}
  .linha .txt{flex:1;min-width:0}
  .linha .p1{font-size:13px;color:var(--ink-soft);font-weight:600}

  /* --------------------------- lista de eventos --------------------------- */
  .ferramentas{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 14px}
  .ferramentas input{max-width:340px}
  .ferramentas select{max-width:100%;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 11px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
  .evcard{display:flex;gap:14px;align-items:stretch;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:12px;cursor:pointer;overflow:hidden;
    transition:border-color .15s,box-shadow .15s;text-align:left;width:100%;padding:0}
  .evcard:hover{border-color:var(--brand-3);box-shadow:0 2px 10px -4px rgba(28,55,66,.18)}
  .evcard .thumb{width:120px;flex:none;background:linear-gradient(135deg,var(--brand),var(--brand-3));
    display:grid;place-items:center;color:var(--accent);font-family:Sora,sans-serif;font-weight:800;font-size:28px}
  .evcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .evcard .corpo{flex:1;min-width:0;padding:14px 16px}
  .card-atalhos{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;
    padding-top:10px;border-top:1px dashed var(--line)}
  .evcard .nm{font-weight:700;font-size:15px;color:var(--ink)}
  .evcard .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .evcard .selos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .evcard .nums{font-size:12.5px;color:var(--ink-soft);margin-top:8px;font-weight:600}
  @media(max-width:560px){.evcard{flex-direction:column}.evcard .thumb{width:100%;height:90px}}

  /* --------------------------- editor de atividades ----------------------- */
  .atv-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fafbfc}
  .g-atv{display:grid;grid-template-columns:1fr 140px 106px 106px auto;gap:8px;align-items:center}
  .g-atv2{display:grid;grid-template-columns:1.2fr 1fr 96px 96px;gap:8px;margin-top:8px}
  .g-campo{display:grid;grid-template-columns:1.4fr 170px auto;gap:8px;align-items:center}
  @media(max-width:760px){.g-atv,.g-atv2,.g-campo{grid-template-columns:1fr}}
  .chk{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;
    font-weight:500;color:var(--ink);margin-top:8px}
  .chk input{width:auto}
  .rm{color:var(--err);cursor:pointer;font-weight:700}
  .tut{background:var(--info-soft);border:1px solid #cfe6f2;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px;line-height:1.6}

  /* ------------------------------ celular ---------------------------------
     A lateral vira cabeçalho: marca + usuário na 1ª linha, o seletor de
     evento logo abaixo e o menu horizontal ROLÁVEL por último (o mesmo
     comportamento responsivo do ARCHÉ EX, que o dono usa no celular). */
  @media(max-width:760px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .side-marca{border-bottom:0;padding:14px 16px}
    .side-sel{flex:1 1 100%;order:2;border-bottom:0;padding:0 12px 4px}
    .side-nav{padding:8px 10px;flex:1 1 100%;order:3;overflow-x:auto}
    .side-nav #menu{display:flex;gap:6px}
    .side-lab{display:none}
    .side-item{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px}
    .side-item.on{border-left:0;border-bottom-color:var(--accent)}
    .side-pe{border-top:0;margin-left:auto;order:1;padding:10px 14px}
    .area{padding:20px 14px}
    .topbar{padding:0 16px}
    .ctx .acoes{margin-left:0}
  }
  /* janela suspensa do "Cadastrar novo evento" */
  /* Escolher evento: com o passar dos anos a lista corrida vira rolagem —
     o botão abre uma janela com curso, ano e busca (pedido do dono, ago/2026) */
  .side-sel .sel-bt{width:100%;text-align:left;background:rgba(255,255,255,.08);color:#fff;
    border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:9px 30px 9px 11px;
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;position:relative;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
  .side-sel .sel-bt:hover{background:rgba(255,255,255,.16)}
  .side-sel .sel-bt::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-50%);
    opacity:.7;font-size:11px}
  .esc-filtros{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .esc-filtros select{flex:1 1 150px;width:auto}
  .esc-lista{max-height:52vh;overflow-y:auto;margin-top:10px;border-top:1px solid var(--line)}
  .esc-lab{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);padding:12px 2px 5px}
  .esc-it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2,#f0f2f6);
    padding:10px 10px;border-radius:9px;cursor:pointer;font-family:inherit;transition:.12s}
  .esc-it:hover{background:var(--accent-wash,#e6f5fa)}
  .esc-it.on{background:rgba(64,113,126,.12)}
  .esc-n{font-size:14px;font-weight:700;color:var(--ink)}
  .esc-m{font-size:12px;color:var(--muted);margin-top:2px}
  .esc-vazio{padding:22px 6px;color:var(--muted);font-size:13.5px;text-align:center}
  .ov{position:fixed;inset:0;background:rgba(24,38,50,.55);z-index:10050;display:flex;
    align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
  .ov-cx{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:22px 22px 18px;
    box-shadow:0 18px 60px rgba(0,0,0,.25);margin:auto 0}
  .ov-cx h2{font-size:19px;color:var(--brand);margin-bottom:4px}
  .ov-cx label{display:block;font-size:12px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
  .ov-cx input,.ov-cx select,.ov-cx textarea{width:100%;border:1.5px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff}
  .ov-cx input:focus,.ov-cx select:focus,.ov-cx textarea:focus{outline:none;
    border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(64,113,126,.13)}
  .ov-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  /* clique fora: a janela pisca em vez de fechar — o cadastro não se perde */
  @keyframes ovPiscar{0%{transform:scale(1)}35%{transform:scale(1.015)}100%{transform:scale(1)}}
  .wiz-op{display:grid;gap:10px;margin-top:8px}
  .wiz-op .op{display:block;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;
    background:#fff;transition:.15s}
  .wiz-op .op:hover{border-color:var(--brand-3)}
  .wiz-op .op.on{border-color:var(--brand);background:var(--wash);box-shadow:0 0 0 3px rgba(64,113,126,.12)}
  .wiz-op .op b{display:block;font-size:14px;color:var(--ink)}
  .wiz-op .op span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .ov-cx.ov-piscar{animation:ovPiscar .22s ease-out;box-shadow:0 0 0 3px rgba(64,113,126,.35),0 18px 60px rgba(0,0,0,.25)}
  @media(max-width:560px){.ov-2col{grid-template-columns:1fr}}
  /* assistente por etapas (dentro da mesma janela) */
  .wiz-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 2px}
  .wiz-passo{font-size:11px;font-weight:700;color:var(--brand-3);letter-spacing:.1em;text-transform:uppercase}
  .wiz-dots{display:flex;gap:6px}
  .wiz-dots i{width:26px;height:5px;border-radius:3px;background:var(--line);transition:background .2s}
  .wiz-dots i.on{background:var(--brand-3)}
  .wiz-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:8px 0 2px}
  .wiz-rev{border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-top:10px}
  .wiz-rev .li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--ink-soft)}
  .wiz-rev .li:last-child{border-bottom:0}
  .wiz-rev .li b{flex:none;width:150px;color:var(--muted);font-weight:600;font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
  @media(max-width:560px){.wiz-rev .li{flex-direction:column;gap:2px}.wiz-rev .li b{width:auto}}
  /* obrigatório em falta, na guia Dados do evento */
  .falta{border-color:#e0b25a!important;background:#fffaf0!important}
</style>
</head>
<body>
<div class="app">
  <!-- barra lateral -->
  <nav class="side">
    <a class="side-marca" href="/" title="Voltar ao portal">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 37 L8 20 A12 12 0 0 1 32 20 L32 37" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4" fill="#71c8e2"/></svg>
      <span>ARCHÉ <b>EV</b></span>
    </a>
    <div class="side-sel">
      <span class="rot">Evento em gestão</span>
      <button id="sel-evento" class="sel-bt" onclick="abrirEscolherEvento()"
        title="Escolher o evento em gestão — vale para todas as guias"></button>
      <button class="todos" onclick="nav('painel')">‹ ver todos os eventos</button>
    </div>
    <div class="side-nav"><div id="menu"></div></div>
    <div class="side-pe" id="rodape-usuario"></div>
  </nav>

  <!-- conteúdo -->
  <div class="conteudo">
    <div class="topbar">
      <div class="crumb">ARCHÉ EV <span style="color:var(--muted-2)">/</span> <b id="crumb">Painel geral</b></div>
      <div class="dir"><span id="vcAlvo"></span><span id="dir-info"></span></div>
    </div>
    <div class="area">
      <div class="limite">
      <div id="vcFaixa"></div>
        <h1 id="titulo">Painel geral</h1>
        <div class="sub" id="subtitulo"></div>
        <div id="ev-contexto"></div>

        <section id="v-painel" class="hide"></section>
        <section id="v-inicio" class="hide"></section>
        <section id="v-dados" class="hide"></section>
        <section id="v-inscritos" class="hide"></section>
        <section id="v-inscricoes" class="hide"></section>
        <section id="v-pagina" class="hide"></section>
        <section id="v-programacao" class="hide"></section>
        <section id="v-blocos" class="hide"></section>
        <section id="v-equipe" class="hide"></section>
        <section id="v-credenciamento" class="hide"></section>
        <section id="v-transmissao" class="hide"></section>
        <section id="v-exportacoes" class="hide"></section>
        <section id="v-certificados" class="hide"></section>
        <section id="v-acao" class="hide"></section>
      </div>
    </div>
  </div>
</div>

<script src="/assets/arche-vercomo.js"></script>
<script>
/* "Ver como…" (decisão do dono, ago/2026): a gestão abre o setor pelos olhos
   de quem o usa. O recorte é do SERVIDOR — a tela só manda o ?como= nas
   leituras, e nenhuma escrita passa enquanto a simulação está ligada. O botão

function numerosEventoLocal(a){
  const ev=a.evento||{}; const inscritos=a.participantes?.inscritos||[];
  const online=inscritos.filter(i=>i?.origem==="online").length;
  const presDe=(id)=>inscritos.filter(i=>(i?.presencas||[]).some(p=>String(p?.atividade||"")===id)).length;
  const marcou=(id)=>inscritos.filter(i=>Array.isArray(i?.atividades)&&i.atividades.includes(id)).length;
  const porAtividade=(ev.programacao||[])
    .filter(p=>p?.id&&(p.inscricao==="propria"||presDe(p.id)>0))
    .map(p=>({id:p.id,titulo:p.titulo||"",inscritos:marcou(p.id),presentes:presDe(p.id)}));
  return {
    inscritos:inscritos.length,
    presentes:inscritos.filter(i=>i?.presente===true).length,
    online, manuais:inscritos.length-online,
    presentesOnline:inscritos.filter(i=>/^online/.test(String(i?.presentePor||""))).length,
    porAtividade,
    comentariosMural:(ev.mural||[]).filter(m=>m&&!m.oculto).length,
  };
}

function montarSeletor(){
  const bt=$("sel-evento"); if(!bt) return;
  const a=ABERTO?ACOES.find(x=>x.id===ABERTO):null;

   A lista suspensa servia enquanto os eventos cabiam nela. Com o setor em
   uso, ela cresce todo semestre e vira rolagem — e o que a pessoa sabe do
   evento que procura não é a posição na lista: é o CURSO, o ANO e o nome.

   com poucos eventos o comportamento é o de antes.
   ====================================================================== */
let ESC={curso:"",ano:"",busca:""};

function abrirEscolherEvento(){
  const cx=document.createElement("div");
  cx.className="ov"; cx.id="ov-escolher";
  cx.onclick=(e)=>{ if(e.target===cx) fecharEscolher(); };
  const cursos=[...new Set(ACOES.filter(x=>x.evento).map(x=>x.curso).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const anos=anosDosEventos();
  cx.innerHTML=`<div class="ov-cx" style="max-width:600px">
    <h2>Escolher evento</h2>
    <p class="muted" style="margin:0">O evento escolhido vale para todas as guias do ARCHÉ EV.</p>
    <div class="esc-filtros">
      <select id="esc-curso" onchange="ESC.curso=this.value;pintarEscolher()">
        <option value="">Todos os cursos</option>
        ${cursos.map(c=>`<option value="${esc(c)}"${ESC.curso===c?" selected":""}>${esc(c)}</option>`).join("")}
      </select>
      <select id="esc-ano" onchange="ESC.ano=this.value;pintarEscolher()">
        <option value="">Todos os anos</option>
        ${anos.map(y=>`<option value="${esc(y)}"${ESC.ano===y?" selected":""}>${esc(y)}</option>`).join("")}
      </select>

    <div class="ov-bt" style="margin-top:14px"><button class="bt bt-sec" onclick="fecharEscolher()">Fechar</button></div>
  </div>`;
  document.body.appendChild(cx);
  pintarEscolher();
  setTimeout(()=>$("esc-busca")?.focus(),30);
  document.addEventListener("keydown",escTecla);
}
function escTecla(e){ if(e.key==="Escape") fecharEscolher(); }
function fecharEscolher(){
  document.getElementById("ov-escolher")?.remove();
  document.removeEventListener("keydown",escTecla);

function pintarEscolher(){
  const cx=$("esc-lista"); if(!cx) return;
  const norm=(t)=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const q=norm(ESC.busca);
  const cabe=(a)=>(!ESC.curso||a.curso===ESC.curso)
    && (!ESC.ano||anoDoEvento(a)===ESC.ano)
    && (!q||norm(a.proposta?.nomeAtividade).includes(q)||norm(a.numeroAcao).includes(q)||norm(a.curso).includes(q));
  const com=ACOES.filter(a=>a.evento&&cabe(a))
    .sort((x,z)=>String(z.proposta?.periodoInicio||"").localeCompare(String(x.proposta?.periodoInicio||"")));
  // ação sem evento não tem ano nem página: o filtro de ano não se aplica a ela
  const sem=ACOES.filter(a=>!a.evento&&!a.origemPapel
    &&(!ESC.curso||a.curso===ESC.curso)&&(!q||norm(a.proposta?.nomeAtividade).includes(q)));
  const per=(a)=>{
    const i=a.proposta?.periodoInicio,f=a.proposta?.periodoFim;
    return i?(f&&f!==i?`${fmt(i)} – ${fmt(f)}`:fmt(i)):"sem data";
  };
  const item=(a,extra)=>`<button class="esc-it${a.id===ABERTO?" on":""}" onclick="escolherEvento('${esc(a.id)}')">
    <div class="esc-n">${esc(a.proposta?.nomeAtividade||"(sem nome)")}</div>
    <div class="esc-m">${esc(a.curso||"sem curso")} · ${per(a)}${extra||""}</div></button>`;
  cx.innerHTML = (com.length||sem.length)
    ? (com.length?`<div class="esc-lab">Eventos · ${com.length}</div>`
        +com.map(a=>item(a,` · ${a.evento.ativo?"página no ar":"rascunho"}`)).join(""):"")
      +(sem.length?`<div class="esc-lab">Ações sem evento — configurar · ${sem.length}</div>`
        +sem.map(a=>item(a,"")).join(""):"")
    : `<div class="esc-vazio">Nenhum evento com esses filtros.<br>
        <span style="font-size:12.5px">Tente limpar o curso, o ano ou a busca.</span></div>`;
}

function escolherEvento(id){ fecharEscolher(); trocarEvento(id); }

/* Trocar o evento em gestão — pelo seletor da barra ou por um card do
   Painel geral (as duas coisas são o MESMO ato). Numa guia de evento,
   fica-se nela, agora com o outro evento; do Painel geral, vai-se ao
   Início do evento escolhido. */
function trocarEvento(id, guia){
  if(!id){ ABERTO=null; clearInterval(EV_TIMER); montarSeletor(); nav("painel"); return; }
  if(!ACOES.some(a=>a.id===id)) return;
  ABERTO=id; EV_CAPA=undefined;
  montarSeletor();
  // com guia pedida, vai direto a ela (é o "Completar dados" do cartão);
  // senão fica na guia atual, se ela for de evento
  if(guia && SECOES.some(s=>s.k===guia)) return nav(guia);
  const meta=SECOES.find(s=>s.k===SECAO);
  nav(meta&&meta.evento?SECAO:"inicio");
}
const selecionar = (id, guia)=>trocarEvento(id, guia);

/* Deep-link: a URL guarda "#<guia>" ou "#<guia>/<id da ação>" — recarregar
   a página volta à mesma guia com o mesmo evento selecionado. O formato da
   tela anterior ("#e/<id>") segue aceito e vira "#inicio/<id>". */
function nav(secao){
  const meta = SECOES.find(s=>s.k===secao) || SECOES[0];
  SECAO = meta.k;
  clearInterval(EV_TIMER);
  document.querySelectorAll(".limite > section").forEach(s=>s.classList.add("hide"));
  document.querySelectorAll(".side-item").forEach(b=>b.classList.toggle("on", b.dataset.k===SECAO));
  $("titulo").textContent = meta.tit;
  $("subtitulo").textContent = meta.sub;
  $("crumb").textContent = meta.rot;
  const a = ABERTO ? ACOES.find(x=>x.id===ABERTO) : null;
  if(a===null && ABERTO){ ABERTO=null; montarSeletor(); }
  try{ history.replaceState(null,"","#"+SECAO+(meta.evento&&a?"/"+encodeURIComponent(a.id):"")); }catch{}
  const alvo=$("v-"+SECAO);

  if(meta.evento && !a){
    $("ev-contexto").innerHTML="";
    alvo.innerHTML=`<div class="card" style="text-align:center;padding:34px 20px">
      <div style="font-size:15px;font-weight:700;color:var(--ink)">Nenhum evento selecionado.</div>
      <div class="muted" style="margin:8px 0 16px">Escolha o evento em gestão no seletor da barra
        lateral ou num card do Painel geral.</div>
      <button class="bt bt-sec" onclick="nav('painel')">Ir ao Painel geral</button></div>`;
    alvo.classList.remove("hide");
    window.scrollTo(0,0); return;
  }

  $("ev-contexto").innerHTML = meta.evento ? contextoHtml(a) : "";
  if(SECAO==="painel") renderPainel();
  else if(SECAO==="inicio") renderInicio(a);
  else if(SECAO==="dados") renderDados(a);
  else if(SECAO==="inscritos") renderInscritos(a);
  else if(SECAO==="inscricoes") renderInscricoes(a);
  else if(SECAO==="pagina") renderPagina(a);
  else if(SECAO==="programacao") renderProgramacao(a);
  else if(SECAO==="blocos") renderBlocos(a);
  else if(SECAO==="equipe") renderEquipe(a);
  else if(SECAO==="credenciamento") renderCredenciamento(a);
  else if(SECAO==="transmissao") renderTransmissao(a);
  else if(SECAO==="exportacoes") renderExportacoes(a);
  else if(SECAO==="certificados") renderCertificados(a);
  else if(SECAO==="acao") renderAcao(a);
  alvo.classList.remove("hide");
  if(meta.evento) agendarEvento(a.id);
  window.scrollTo(0,0);
}

/* faixa do evento em gestão, no topo das guias de evento */
function contextoHtml(a){
  const ev=a.evento||{}; const p=a.proposta||{};
  return `<div class="ctx">
    <span class="nm">${esc(p.nomeAtividade||"(sem nome)")}</span>
    <span class="meta">${esc(a.curso||"")}${a.numeroAcao?` · ${esc(a.numeroAcao)}`:" · ação ainda sem número"}${p.periodoInicio?` · ${fmt(p.periodoInicio)} – ${fmt(p.periodoFim)}`:""}</span>
    <span class="badge" style="background:${ev.ativo?"var(--ok-soft)":"#eceff3"};color:${ev.ativo?"var(--ok)":"var(--muted)"}">${ev.ativo?"página no ar":"rascunho"}</span>
    <span class="acoes">
      <button class="lk" onclick="nav('painel')" title="Escolher outro evento">trocar</button>
      <button class="bt bt-ghost" style="padding:5px 10px;font-size:12px" onclick="atualizarEvento('${esc(a.id)}')" title="Recarregar inscritos e presenças">↻ Atualizar</button>
    </span>
  </div>`;
}

/* ============================ PAINEL GERAL ============================== */
function renderPainel(){
  const com=ACOES.filter(a=>a.evento);
  const noAr=com.filter(a=>a.evento.ativo===true);
  const totais=com.reduce((t,a)=>{ const n=numerosEventoLocal(a);
    t.insc+=n.inscritos; t.pres+=n.presentes; return t; },{insc:0,pres:0});
  const hoje=hojeISO();
  const proximos=com
    .filter(a=>String(a.proposta?.periodoFim||"")>=hoje)
    .sort((x,y)=>String(x.proposta?.periodoInicio||"").localeCompare(String(y.proposta?.periodoInicio||"")))
    .slice(0,5);

  $("v-painel").innerHTML=`
    <div class="stat" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="s"><b>${noAr.length}</b><span>Eventos no ar</span></div>
      <div class="s"><b>${com.length-noAr.length}</b><span>Rascunhos</span></div>
      <div class="s"><b>${totais.insc}</b><span>Inscritos (todos)</span></div>
      <div class="s"><b style="color:var(--ok)">${totais.pres}</b><span>Presentes (todos)</span></div>
    </div>
    ${proximos.length?`<div class="card">
      <div class="sec-t">Próximos eventos</div>
      ${proximos.map(a=>`<div class="linha">
        <div class="txt">
          <div class="p1">${esc(a.proposta?.nomeAtividade||"(sem nome)")}</div>
          <div class="muted">${fmt(a.proposta?.periodoInicio)} – ${fmt(a.proposta?.periodoFim)} · ${esc(a.curso||"")} ·
            ${a.evento.ativo?"página no ar":"rascunho"} · ${numerosEventoLocal(a).inscritos} inscrito(s)</div>
        </div>
        <button class="bt bt-sec" style="padding:6px 12px;font-size:12.5px" onclick="selecionar('${esc(a.id)}')">Gerenciar →</button>
      </div>`).join("")}
    </div>`:""}
    <div class="ferramentas">
      <button class="bt bt-pri" style="white-space:nowrap" onclick="novoEvento()">＋ Cadastrar novo evento</button>
      <input id="l-busca" placeholder="Buscar evento por nome ou curso…" oninput="renderCardsPainel()">
      <select id="l-curso" onchange="renderCardsPainel()" title="Filtrar por curso">
        <option value="">Todos os cursos</option>
        ${cursosDosEventos().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}
      </select>
      <select id="l-ano" onchange="renderCardsPainel()" title="Filtrar por ano de realização">
        <option value="">Todos os anos</option>
        ${anosDosEventos().map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join("")}
      </select>
      <span class="muted" id="l-total"></span>
    </div>
    <div id="ev-cards"></div>
    <div id="sem-evento"></div>`;
  renderCardsPainel();
}

/* O ANO do evento é o de REALIZAÇÃO (início): com o tempo a lista cresce, e
   quem procura pensa "os eventos de 2026", não no ciclo de encerramento que
   a Extensão usa para fechar exercício. Curso e ano saem dos próprios
   eventos — nada de catálogo à parte que envelhece. */
const anoDoEvento=(a)=>String(a?.proposta?.periodoInicio||a?.proposta?.periodoFim||"").slice(0,4);
const cursosDosEventos=()=>[...new Set(ACOES.filter(a=>a.evento).map(a=>a.curso).filter(Boolean))].sort((x,y)=>x.localeCompare(y,"pt-BR"));
const anosDosEventos=()=>[...new Set(ACOES.filter(a=>a.evento).map(anoDoEvento).filter(Boolean))].sort().reverse();

function renderCardsPainel(){
  const q=($("l-busca")?.value||"").trim().toLowerCase();
  const fc=$("l-curso")?.value||"", fa=$("l-ano")?.value||"";
  const bate=(a)=>(!q || String(a.proposta?.nomeAtividade||"").toLowerCase().includes(q)
      || String(a.curso||"").toLowerCase().includes(q))
    && (!fc || a.curso===fc) && (!fa || anoDoEvento(a)===fa);
  const comEvento=ACOES.filter(a=>a.evento).filter(bate)
    .sort((x,y)=>Number(y.evento?.ativo===true)-Number(x.evento?.ativo===true)
      || String(y.proposta?.periodoInicio||"").localeCompare(String(x.proposta?.periodoInicio||"")));
  // o bloco "ações sem evento" segue só a busca: filtrar por ano esconderia
  // a ação recém-criada de quem quer configurá-la
  const semEvento=ACOES.filter(a=>!a.evento&&!a.origemPapel).filter(a=>!q
    || String(a.proposta?.nomeAtividade||"").toLowerCase().includes(q)
    || String(a.curso||"").toLowerCase().includes(q));
  const filtrando=!!(q||fc||fa);
  if($("l-total")) $("l-total").textContent = comEvento.length
    ? `${comEvento.length} evento(s)${filtrando?" no filtro":""}` : "";

  $("ev-cards").innerHTML = comEvento.length ? comEvento.map(cardLista).join("") :
    `<div class="card" style="text-align:center;padding:34px 20px">
      <div style="font-size:15px;font-weight:700;color:var(--ink)">${filtrando?"Nenhum evento encontrado com estes filtros.":"Nenhum evento ainda."}</div>
      <div class="muted" style="margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto">
        ${filtrando?"Limpe a busca, o curso ou o ano para ver os demais."
        :`Comece pelo botão <b>＋ Cadastrar novo evento</b> — ele registra a ação de
        extensão e já deixa o evento pronto para montar. Se preferir, a proposta
        completa também pode ser registrada no <a href="/extensao/">ARCHÉ EX</a>.`}</div>
      ${filtrando?"":`<button class="bt bt-pri" style="margin-top:14px" onclick="novoEvento()">＋ Cadastrar novo evento</button>`}
    </div>`;

  $("sem-evento").innerHTML = semEvento.length ? `
    <div class="card">
      <div class="sec-t">Ações sem evento</div>
      <div class="muted" style="margin-bottom:6px">Ações de extensão que você pode operar e que ainda
        não têm o evento configurado — dá para deixar tudo pronto antes mesmo da aprovação
        (só a ativação da página exige o Número da Ação).</div>
      ${semEvento.map(a=>`<div class="linha">
        <div class="txt">
          <div class="p1">${esc(a.proposta?.nomeAtividade||"(sem nome)")}</div>
          <div class="muted">${esc(a.curso||"")}${a.numeroAcao?` · ${esc(a.numeroAcao)}`:" · ainda sem número"}${a.proposta?.periodoInicio?` · ${fmt(a.proposta.periodoInicio)}–${fmt(a.proposta.periodoFim)}`:""}</div>
        </div>
        <button class="bt bt-sec" style="padding:7px 12px;font-size:12.5px" onclick="selecionar('${esc(a.id)}')">Configurar evento</button>
      </div>`).join("")}
    </div>` : "";
}

/* ------------------- cadastrar novo evento (fluxo único) ------------------
   O botão do Painel geral cria a AÇÃO DE EXTENSÃO com o essencial da
   proposta e já semeia a configuração do evento — a pessoa cai direto nas
   guias para montar programação, formulário e página. A proposta segue o
   caminho institucional de sempre: fila da PROPPEX no ARCHÉ EX (onde pode
   ser completada), e a página só ativa depois da aprovação. */
const CURSOS_EV = ["Administração","Agronomia","Ciências Contábeis","Direito","Educação Física",
  "Enfermagem","Engenharia Civil","Engenharia de Software","Engenharia Mecânica",
  "Medicina Veterinária","Odontologia","Psicologia","Institucional / PROPPEX"];

/* A régua da publicação da página — RÉPLICA de CAMPOS_PROJETO_EVENTO em
   lib/eventos.js, que é O DONO da régua (a SPA não importa módulos; ao mudar
   a lista lá, mude aqui também). É a mesma lista que a ativação confere no
   servidor: campo em falta = a página não publica. */
const CAMPOS_PROJETO_EV=[
  ["curso","curso"],
  ["nomeAtividade","nome do evento"],
  ["periodoInicio","data de início"],
  ["periodoFim","data de encerramento"],
  ["cargaHoraria","carga horária"],
  ["publicoAlvo","público-alvo"],
  ["local","local"],
  ["municipio","município"],
  ["justificativa","justificativa"],
  ["objetivoGeral","objetivo geral"],
  ["objetivosEspecificos","objetivos específicos"],
  ["metodologia","metodologia"],
  ["respNome","nome do responsável"],
  ["respCargo","cargo do responsável"],
  ["respTelefone","telefone do responsável"],
  ["respEmail","e-mail do responsável"],
];
const faltasProjetoEv=(a)=>{
  const p=a?.proposta||{};
  return CAMPOS_PROJETO_EV
    .filter(([c])=>!String((c==="curso"?a?.curso:p[c])||"").trim())
    .map(([,r])=>r);
};

/* O assistente pergunta POR ETAPAS (pedido do dono, ago/2026): título e
   curso; público e tema; datas e horários; revisão. Cada resposta fica em
   NE — voltar não perde nada — e a criação continua a mesma: a AÇÃO DE
   EXTENSÃO nasce submetida (fila da PROPPEX) e o evento é semeado em
   rascunho; o restante do projeto se completa na guia Dados do evento. */
let NE=null;
function novoEvento(){
  NE={passo:1, nome:"", curso:CURSOS_EV[0], publico:"", tema:"",
      inicio:"", fim:"", ch:"", municipio:"Goianésia/GO", controle:true, hotsite:true};
  const cx=document.createElement("div");
  cx.className="ov"; cx.id="ov-novo";
  // clicar fora NÃO descarta o cadastro (achado do dono, ago/2026): são 4
  // passos de digitação, e um clique ao lado jogava tudo fora. O fundo só
  // pisca a janela; sair é pelo Cancelar (que confirma se algo foi digitado).
  cx.onclick=(e)=>{ if(e.target===cx) piscarJanela(); };
  cx.innerHTML=`<div class="ov-cx" role="dialog" aria-modal="true" aria-label="Cadastrar novo evento" tabindex="-1"
    onkeydown="enterAvancaNE(event)"></div>`;
  document.body.appendChild(cx);
  document.addEventListener("keydown", escFechaNovo);
  renderPassoNE();
}
function escFechaNovo(e){ if(e.key==="Escape") cancelarNovo(); }
function piscarJanela(){
  const cx=$("ov-novo")?.querySelector(".ov-cx"); if(!cx) return;
  cx.classList.remove("ov-piscar"); void cx.offsetWidth; cx.classList.add("ov-piscar");
}
// algo digitado? então perguntar antes de perder
const novoTemDados=()=>!!NE && [NE.nome,NE.publico,NE.tema,NE.inicio,NE.fim,NE.ch]
  .some(v=>String(v||"").trim());
function cancelarNovo(){
  if(novoTemDados() && !confirm("Descartar o cadastro deste evento?\n\nO que você já preencheu será perdido.")) return;
  fecharNovo();
}
function fecharNovo(){ $("ov-novo")?.remove(); document.removeEventListener("keydown", escFechaNovo); NE=null; }
/* Enter avança a etapa (e, na revisão, cria) — menos em textarea e botão. */
function enterAvancaNE(e){
  if(e.key!=="Enter" || !NE) return;
  const t=e.target?.tagName;
  if(t==="TEXTAREA"||t==="BUTTON") return;
  e.preventDefault();
  if(NE.passo<4) nePasso(1); else criarNovoEvento();
}
function nePasso(d){
  if(d>0){
    const msg=$("ne-msg");
    if(NE.passo===1){
      if(!NE.nome.trim()) return msg.textContent="Dê um nome ao evento.";
      if(!NE.curso) return msg.textContent="Escolha o curso ou setor.";
    }
    if(NE.passo===3){
      if(!NE.inicio||!NE.fim) return msg.textContent="Informe o período do evento (início e encerramento).";
      if(NE.fim<NE.inicio) return msg.textContent="O encerramento não pode vir antes do início.";
    }
  }
  NE.passo=Math.min(4,Math.max(1,NE.passo+d));
  renderPassoNE();
}
function renderPassoNE(){
  const cx=document.querySelector("#ov-novo .ov-cx"); if(!cx||!NE) return;
  const TITULOS={1:"O evento",2:"Público e tema",3:"Datas e horários",4:"Revisão"};
  const passos=[1,2,3,4].map(n=>`<i class="${n<=NE.passo?"on":""}"></i>`).join("");
  const corpo =
    NE.passo===1 ? `
      <label for="ne-nome">Nome do evento *</label>
      <input id="ne-nome" maxlength="200" placeholder="Ex.: III Jornada de Solos do Cerrado"
        value="${esc(NE.nome)}" oninput="NE.nome=this.value">
      <label for="ne-curso">Curso / setor *</label>
      <select id="ne-curso" onchange="NE.curso=this.value">
        ${CURSOS_EV.map(c=>`<option${c===NE.curso?" selected":""}>${esc(c)}</option>`).join("")}</select>`
    : NE.passo===2 ? `
      <label for="ne-publico">Público-alvo</label>
      <input id="ne-publico" maxlength="200" placeholder="Ex.: acadêmicos, professores e comunidade externa"
        value="${esc(NE.publico)}" oninput="NE.publico=this.value">
      <label for="ne-tema">Tema central / breve descrição</label>
      <textarea id="ne-tema" rows="3" maxlength="2000" oninput="NE.tema=this.value"
        placeholder="Sai na página pública do evento — dá para refinar depois.">${esc(NE.tema)}</textarea>`
    : NE.passo===3 ? `
      <div class="ov-2col">
        <div><label for="ne-inicio">Início *</label>
          <input id="ne-inicio" type="date" value="${esc(NE.inicio)}" oninput="NE.inicio=this.value"></div>
        <div><label for="ne-fim">Encerramento *</label>
          <input id="ne-fim" type="date" value="${esc(NE.fim)}" oninput="NE.fim=this.value"></div>
        <div><label for="ne-ch">Carga horária (h)</label>
          <input id="ne-ch" inputmode="numeric" placeholder="Ex.: 20" value="${esc(NE.ch)}" oninput="NE.ch=this.value"></div>
        <div><label for="ne-municipio">Município</label>
          <input id="ne-municipio" maxlength="120" value="${esc(NE.municipio)}" oninput="NE.municipio=this.value"></div>
      </div>
      <div class="tut" style="font-size:12.5px;margin-top:10px">🕒 <b>Horários e locais entram por
        atividade</b>, na guia <b>Programação</b> (decisão do dono, ago/2026): num evento eles
        variam de uma palestra para um minicurso, e é lá que cada um tem o seu horário, sala e
        vagas. O endereço geral do evento (o que sai no mapa da página pública) fica na guia
        <b>Página do evento</b>.</div>
      <label style="margin-top:14px">Este evento terá controle de frequência? *</label>
      <div class="wiz-op">
        <label class="op ${NE.controle?"on":""}" onclick="NE.controle=true;renderPassoNE()">
          <b>Sim — vamos credenciar</b>
          <span>Os participantes apresentam o QR na entrada. Ao montar a programação, cada atividade
            escolhe o modo: frequência única, início e fim, ou sem controle naquela atividade.</span></label>
        <label class="op ${NE.controle?"":"on"}" onclick="NE.controle=false;renderPassoNE()">
          <b>Não — a inscrição já vale como presença</b>
          <span>Ninguém para na porta e todos os inscritos contam 100% de frequência. Para evento
            grande e aberto, em que credenciar é inviável.</span></label>
      </div>
      <label style="margin-top:14px">Este evento terá página pública (hotsite)? *</label>
      <div class="wiz-op">
        <label class="op ${NE.hotsite?"on":""}" onclick="NE.hotsite=true;renderPassoNE()">
          <b>Sim — quero a página do evento</b>
          <span>Capa, programação por dia, palestrantes, local no mapa e os blocos que você montar.
            O evento aparece na vitrine pública de eventos.</span></label>
        <label class="op ${NE.hotsite?"":"on"}" onclick="NE.hotsite=false;renderPassoNE()">
          <b>Não — só a folha de inscrição</b>
          <span>Sem site: o endereço do evento abre apenas o formulário de inscrição, para o QR que
            você projeta na palestra. Fica fora da vitrine. Credenciamento, presenças e exportações
            funcionam igual.</span></label>
      </div>`
    : `
      <div class="wiz-rev">
        ${[["Evento",NE.nome],["Curso / setor",NE.curso],["Público-alvo",NE.publico],
           ["Tema central",NE.tema],
           ["Período",NE.inicio?`${fmt(NE.inicio)} – ${fmt(NE.fim)}`:""],
           ["Carga horária",NE.ch?NE.ch+" h":""],["Município",NE.municipio],
           ["Frequência",NE.controle?"com credenciamento (por atividade)":"sem controle — inscrito conta presente"],
           ["Página pública",NE.hotsite?"hotsite completo":"só a folha de inscrição (sem site)"]]
          .map(([r,v])=>`<div class="li"><b>${r}</b><span>${esc(v)||'<span class="muted">—</span>'}</span></div>`).join("")}
      </div>
      <div class="tut" style="font-size:12.5px">
        Ao criar: <b>a ação de extensão será registrada</b> e segue a análise da PROPPEX;
        o restante do projeto (justificativa, objetivos, metodologia) se completa na guia
        <b>Dados do evento</b>; e a página pública só poderá ser <b>publicada com o projeto
        completo e a ação aprovada</b>.</div>`;

  cx.innerHTML=`
    <h2>Cadastrar novo evento</h2>
    <div class="wiz-topo">
      <span class="wiz-passo">Passo ${NE.passo} de 4</span>
      <span class="wiz-dots">${passos}</span>
    </div>
    <div class="wiz-t">${TITULOS[NE.passo]}</div>
    ${corpo}
    <div id="ne-msg" style="color:#c62828;font-size:13px;min-height:1.2em;margin-top:10px"></div>
    <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
      ${NE.passo>1?`<button class="bt bt-ghost" onclick="nePasso(-1)">‹ Voltar</button>`:""}
      ${NE.passo<4?`<button class="bt bt-pri" id="ne-bt" onclick="nePasso(1)">Avançar ›</button>`
                  :`<button class="bt bt-pri" id="ne-bt" onclick="criarNovoEvento()">Criar o evento</button>`}
      <button class="bt bt-sec" onclick="cancelarNovo()">Cancelar</button>
    </div>`;
  setTimeout(()=>{ (cx.querySelector("input,select,textarea")||cx).focus(); },50);
}

async function criarNovoEvento(){
  const msg=$("ne-msg"), bt=$("ne-bt");
  const nome=NE.nome.trim(), inicio=NE.inicio, fim=NE.fim;
  if(!nome) return msg.textContent="Dê um nome ao evento.";
  if(!inicio||!fim) return msg.textContent="Informe o período do evento (início e encerramento).";
  if(fim<inicio) return msg.textContent="O encerramento não pode vir antes do início.";
  bt.disabled=true; msg.textContent="";
  try{
    const agora=new Date().toISOString();
    const p=ME?.perfil||{};
    const registro={
      id:"ext-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      numeroAcao:null, status:"submetida",
      curso:NE.curso,
      criadoPor:EU, criadoPorNome:p.nome||ME?.nome||EU,
      criadoEm:agora, atualizadoEm:agora,
      proposta:{
        nomeAtividade:nome, classificacao:"Evento", departamento:NE.curso,
        temaCentral:NE.tema.trim(),
        periodoInicio:inicio, periodoFim:fim,
        // horário e local NÃO se pedem aqui: variam por atividade e entram na
        // guia Programação; o endereço geral fica na Página do evento
        cargaHoraria:NE.ch.trim(), publicoAlvo:NE.publico.trim(),
        municipio:NE.municipio.trim(),
        respNome:p.nome||ME?.nome||EU, respCargo:p.funcao==="professor"?"Professor(a)":"",
        respTelefone:p.telefone||"", respEmail:EU,
      },
      relatorio:{}, participantes:{inscritos:[],palestrantes:[],comissao:[]},
    };
    const r1=await fetch("/api/extensao",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({acoes:[registro]})});
    const j1=await r1.json().catch(()=>({}));
    if(!r1.ok||!j1.ok||!j1.gravadas) throw new Error(j1.error||"Não foi possível registrar a ação.");
    // semeia a configuração do evento (rascunho) — é o que o traz para o EV
    const r2=await fetch(`/api/extensao/${encodeURIComponent(registro.id)}/evento`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({descricao:NE.tema.trim(), controleFrequencia:NE.controle!==false,
        hotsite:NE.hotsite!==false})});
    if(!r2.ok) throw new Error((await r2.json().catch(()=>({}))).error||"A ação foi criada, mas a configuração do evento falhou — abra-a na lista.");
    fecharNovo();
    await carregar();
    // cai direto na guia Dados do evento, com as boas-vindas apontando o que falta
    ABERTO=registro.id; EV_CAPA=undefined; montarSeletor();
    DADOS_NOVO=true;
    nav("dados");
  }catch(e){ msg.textContent=e.message; bt.disabled=false; }
}

/* A gestão do evento acontece NO CARTÃO (decisão do dono, ago/2026): aprovar
   a ação e tirar a página do ar são os dois atos mais frequentes da
   coordenação, e estavam espalhados — a aprovação num setor à parte (o ARCHÉ
   EX) e a publicação numa guia interna. São dois botões, aqui: "Aprovar
   evento" (emite o Número da Ação) e "Despublicar evento".

   O Número da Ação NÃO se digita: ele sai da sequência oficial da Extensão,
   no servidor — por ano, na ordem em que as ações são aprovadas.

   Quem APROVA é a gestão da Extensão (é ato do setor que numera o processo);
   quem PUBLICA é quem opera o evento. O botão diz o que falta quando não dá
   para publicar, e quem recusa de verdade é o servidor.
   `stopPropagation` porque o cartão inteiro abre o evento. */
function atalhosCard(a){
  const ev=a.evento||{};
  const bt=(rot,fn,tit,cls)=>`<button class="bt ${cls||"bt-sec"}" style="padding:6px 12px;font-size:12.5px"
    title="${esc(tit)}" onclick="event.stopPropagation();${fn}">${rot}</button>`;
  const linha=(x)=>`<div class="card-atalhos" onclick="event.stopPropagation()">${x}</div>`;
  // excluir é o desfazer do cadastro errado: aparece em todos os estados,
  // porque o engano pode ser notado a qualquer momento
  const btExcluir = podeExcluir(a)
    ? bt("🗑 Excluir","excluirEvento('"+esc(a.id)+"')","Apaga este evento — não há como desfazer","bt-err")
    : "";
  /* ENCERRAR o evento no cartão (pedido do dono, ago/2026): é o ato que
     libera os certificados, e o coordenador não tem por que caçá-lo dentro
     de uma guia. Aparece depois do último dia e some quando já foi feito;
     para a gestão, o cartão mostra o pedido que espera decisão. */
  const st=(ev.encerramento||{}).status||"aberto";
  const acabou = a.proposta?.periodoFim && hojeISO() >= a.proposta.periodoFim;
  const btEncerrar = (a.numeroAcao && acabou && (st==="aberto"||st==="devolvido"))
    ? bt("🏁 Encerrar evento",`encerrarEvento('${esc(a.id)}')`,
        "Encerra o evento e envia à PROPPEX — validado, libera os certificados","bt-pri")
    : st==="solicitado"
      ? (GESTAO_EX
          ? bt("✓ Validar encerramento",`selecionar('${esc(a.id)}','certificados')`,
              "A coordenação encerrou; validar libera os certificados","bt-pri")
          : `<span class="muted" style="font-size:12px">🏁 encerrado — aguardando a PROPPEX</span>`)
      : st==="validado"
        ? bt("🎓 Certificados",`selecionar('${esc(a.id)}','certificados')`,"Evento encerrado e validado — emitir certificados")
        : "";
  if(ev.ativo){
    const link=ev.slug?location.origin+"/eventos/"+encodeURIComponent(ev.slug):"";
    return linha(
      bt("⏸ Despublicar evento",`publicarCard('${esc(a.id)}',false)`,"Recolhe a página pública; inscrições feitas continuam válidas")
      + (link?`<a class="bt bt-ghost" style="padding:6px 12px;font-size:12.5px" href="${esc(link)}"
          target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ ver a página</a>`:"")
      + btEncerrar + btExcluir);
  }
  if(!a.numeroAcao)
    return linha((GESTAO_EX
      ? bt("✓ Aprovar evento",`aprovarCard('${esc(a.id)}')`,
          "Aprova a ação de extensão e emite o Número da Ação — depois disso a página pode ir ao ar","bt-pri")
      : `<span class="muted" style="font-size:12px">⏳ aguarda a aprovação da ação (Número da Ação) para publicar</span>`)
      + btExcluir);
  const faltas=faltasProjetoEv(a);
  if(faltas.length)
    return linha(`<span class="muted" style="font-size:12px">📝 faltam ${faltas.length} campo(s) do projeto</span>`
      + bt("Completar dados",`selecionar('${esc(a.id)}','dados')`,"Abrir a guia Dados do evento: "+faltas.join(", "))
      + btEncerrar + btExcluir);
  return linha(bt("✓ Publicar evento",`publicarCard('${esc(a.id)}',true)`,
    "Coloca a página pública no ar e abre as inscrições","bt-pri") + btEncerrar + btExcluir);
}

/* EXCLUIR o evento (pedido do dono, ago/2026): cadastro errado precisa de
   desfazer, e até aqui só havia "despublicar" — que esconde a página e deixa
   o registro. A regra de QUEM pode e de O QUE some é do servidor; a tela
   antecipa as duas coisas para a confirmação dizer a verdade.

   Ação já aprovada não some: o Número da Ação vem da sequência oficial, e
   apagá-la abriria buraco na numeração e sumiria com a proposta do professor.
   Nesse caso o que se apaga é o EVENTO — página, programação e inscritos —,
   e a ação continua no ARCHÉ EX. */
const podeExcluir = (a) => GESTAO_EX || (!a.numeroAcao && ehMinha(a));
const ehMinha = (a) => !!EU && (a.criadoPor === EU || a.proposta?.respEmail === EU);

async function excluirEvento(id){
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  const nome=(a.proposta?.nomeAtividade||"").trim() || "(sem nome)";
  const n=numerosEventoLocal(a);
  const soOEvento = !!a.numeroAcao || !!a.relatorio?.entregueEm;
  const oQue = soOEvento
    ? `Isto apaga o EVENTO de "${nome}": a página pública, a programação, as atividades, `
      + `os inscritos e as presenças.\n\nA ação de extensão ${a.numeroAcao||""} CONTINUA no ARCHÉ EX, `
      + `com a proposta e o relatório — o número da ação não se apaga.`
    : `Isto apaga "${nome}" INTEIRO: a ação de extensão, a proposta, a página e tudo o que `
      + `foi cadastrado nela.`;
  const perdas = [];
  if(n.inscritos) perdas.push(`${n.inscritos} inscrito(s)`);
  if(n.presentes) perdas.push(`${n.presentes} presença(s) registrada(s)`);
  if((a.evento?.programacao||[]).length) perdas.push(`${a.evento.programacao.length} atividade(s)`);
  if(!confirm(`Excluir "${nome}"?\n\n${oQue}`
    + (perdas.length?`\n\nSerão apagados: ${perdas.join(", ")}.`:"")
    + `\n\n⚠ ESTA AÇÃO É IRREVERSÍVEL — não há como desfazer nem recuperar depois.`)) return;

  // com inscritos, a segunda confirmação é digitar o nome: é o que separa o
  // clique errado da decisão de apagar o cadastro de quem se inscreveu
  let confirmacao="";
  if(n.inscritos){
    confirmacao = prompt(`Última confirmação.\n\nEste evento tem ${n.inscritos} inscrito(s), `
      + `e os dados deles serão apagados.\n\nDigite o nome exato do evento para excluir:\n${nome}`) || "";
    if(confirmacao.trim()!==nome) { if(confirmacao) alert("O nome não confere — nada foi excluído."); return; }
  }
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/excluir`,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({confirmacao:confirmacao.trim()})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível excluir agora."); return; }
  if(ABERTO===id) ABERTO=null;   // o evento em gestão deixou de existir
  await carregar(); montarSeletor();
  nav("painel");
  alert(j.alcance==="evento"
    ? `Evento excluído. A ação ${j.numeroAcao||""} continua no ARCHÉ EX.`
    : `"${j.nome}" foi excluído.`);
}

/* Aprovar a ação daqui: o número é emitido pelo servidor, na sequência
   oficial da Extensão — a tela nunca o inventa nem o pede à gestão. */
async function aprovarCard(id){
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  const nome=a.proposta?.nomeAtividade||"este evento";
  if(!confirm(`Aprovar "${nome}" e emitir o Número da Ação?\n\nA ação de extensão passa a APROVADA e a página do evento fica liberada para publicação.`)) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/aprovar`,{method:"POST"});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível aprovar agora."); return; }
  await carregar(); montarSeletor(); nav(SECAO);
  alert(`✅ Evento aprovado!\nNúmero da Ação: ${j.numeroAcao}`);
}

async function publicarCard(id,ativo){
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  const nome=a.proposta?.nomeAtividade||"este evento";
  if(!confirm(ativo
    ? `Publicar a página de "${nome}"?\n\nA página fica pública e as inscrições abrem.`
    : `Despublicar "${nome}"?\n\nA página deixa de ser pública. As inscrições já feitas continuam válidas e o credenciamento segue funcionando.`)) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/evento`,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({ativo})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível concluir agora."); return; }
  await carregar(); montarSeletor(); nav(SECAO);
}

/* ====================== GESTÃO · DADOS DO EVENTO ========================
   O PROJETO DE EVENTO da Extensão — a proposta da ação, editável aqui para
   quem cria pelo assistente não precisar ir ao ARCHÉ EX completar. Os
   obrigatórios (a régua de CAMPOS_PROJETO_EV, a mesma do servidor) saem
   marcados com * e realçados quando vazios; o sumário do topo diz o que
   ainda falta para a página poder ser publicada.

   PERMISSÃO: a gravação é pelo POST /api/extensao em bloco, e o servidor só
   aceita do DONO da ação e da gestão da Extensão — o coordenador só do
   módulo `eventos` opera o evento, mas a proposta não é dele: para ele a
   guia é somente-leitura. */
let DD=null, DADOS_NOVO=false;
const DD_CAMPOS=["nomeAtividade","temaCentral","periodoInicio","periodoFim","cargaHoraria",
  "publicoAlvo","local","municipio","justificativa","objetivoGeral","objetivosEspecificos",
  "metodologia","programacao","certificacaoSolicitada","parceria","recursoInstalacao",
  "recursoMultimidia","recursoOutros","comissaoTexto","respNome","respCargo","respTelefone","respEmail"];
const DD_OBRIGATORIOS=new Set(CAMPOS_PROJETO_EV.map(([c])=>c));

function soLeituraDados(a){
  const eu=String(EU||"").toLowerCase();
  return GESTAO_EV && !GESTAO_EX
    && String(a.criadoPor||"").toLowerCase()!==eu
    && String(a.proposta?.respEmail||"").toLowerCase()!==eu;
}

function renderDados(a){
  const p=a.proposta||{};
  const ro=soLeituraDados(a);
  DD={curso:a.curso||""};
  for(const c of DD_CAMPOS) DD[c]=p[c]||"";
  const boasVindas=DADOS_NOVO; DADOS_NOVO=false;
  const dis=ro?" disabled":"";
  // um campo do formulário: rótulo (com * nos obrigatórios), input/textarea,
  // realce .falta quando obrigatório vazio — atualizado a cada tecla
  const campo=(c,rotulo,{area=false,tipo="text",ph="",dica=""}={})=>{
    const obg=DD_OBRIGATORIOS.has(c);
    const cls=obg&&!String(DD[c]).trim()?" class=\"falta\"":"";
    const lab=`<label for="dd-${c}">${rotulo}${obg?" *":""}${dica?` <span class="muted">(${dica})</span>`:""}</label>`;
    return area
      ? `${lab}<textarea id="dd-${c}"${cls}${dis} data-campo="${c}" oninput="ddMudou(this)" placeholder="${esc(ph)}">${esc(DD[c])}</textarea>`
      : `${lab}<input id="dd-${c}"${cls}${dis} data-campo="${c}" type="${tipo}" value="${esc(DD[c])}" oninput="ddMudou(this)" placeholder="${esc(ph)}">`;
  };
  const cursoOpcoes=(CURSOS_EV.includes(DD.curso)||!DD.curso?CURSOS_EV:[DD.curso,...CURSOS_EV])
    .map(c=>`<option${c===DD.curso?" selected":""}>${esc(c)}</option>`).join("");

  $("v-dados").innerHTML=`
    ${boasVindas?`<div class="banner ba-info">✓ <b>Evento criado!</b> A ação de extensão foi registrada e
      segue a análise da PROPPEX. Complete abaixo o projeto do evento — a página pública só poderá ser
      publicada com os campos obrigatórios preenchidos e a ação aprovada.</div>`:""}
    ${ro?`<div class="banner ba-info">Guia em <b>somente leitura</b>: os dados do projeto são do
      responsável pela ação e da gestão da Extensão.</div>`:""}
    <div id="dd-faltas"></div>
    <div class="card">
      <div class="sec-t">Identificação</div>
      ${campo("nomeAtividade","Nome do evento",{ph:"Ex.: III Jornada de Solos do Cerrado"})}
      <div class="grid2">
        <div><label for="dd-curso">Curso / setor *</label>
          <select id="dd-curso"${(!String(DD.curso).trim())?' class="falta"':""}${dis} data-campo="curso" onchange="ddMudou(this)">${cursoOpcoes}</select></div>
        <div>${campo("temaCentral","Tema central")}</div>
      </div>
      <div class="grid3">
        <div>${campo("periodoInicio","Início",{tipo:"date"})}</div>
        <div>${campo("periodoFim","Encerramento",{tipo:"date"})}</div>
        <div>${campo("cargaHoraria","Carga horária (h)",{ph:"Ex.: 20"})}</div>
      </div>
      ${campo("publicoAlvo","Público-alvo",{ph:"Ex.: acadêmicos, professores e comunidade externa"})}
      <div class="grid2">
        <div>${campo("local","Local",{ph:"Ex.: Auditório central do UNIEGO"})}</div>
        <div>${campo("municipio","Município",{ph:"Ex.: Goianésia/GO"})}</div>
      </div>
    </div>

    <div class="card">
      <div class="sec-t">O projeto</div>
      ${campo("justificativa","Justificativa",{area:true,ph:"Por que este evento — a demanda que ele atende."})}
      ${campo("objetivoGeral","Objetivo geral",{area:true})}
      ${campo("objetivosEspecificos","Objetivos específicos",{area:true,ph:"Um por linha."})}
      ${campo("metodologia","Metodologia",{area:true,ph:"Como o evento acontece — palestras, oficinas, rodas…"})}
      ${campo("programacao","Programação (texto)",{area:true,dica:"a da proposta; as atividades detalhadas ficam na guia Programação"})}
    </div>

/* O sumário do topo: o que ainda falta para a publicação — some quando completo. */
function ddResumoFaltas(){
  const el=$("dd-faltas"); if(!el||!DD) return;

/* Grava a proposta pelo POST /api/extensao em bloco — a ação INTEIRA como
   está carregada, com a proposta editada por cima. O servidor preserva
   evento e inscritos pela mescla, e número/situação/apreciação são da
   gestão (aqui vão os valores já gravados, por clareza). */
async function salvarDados(id){
  const a=ACOES.find(x=>x.id===id); if(!a||!DD) return;
  const msg=$("dd-msg"); if(msg) msg.textContent="Salvando…";
  const proposta={...(a.proposta||{})};
  for(const c of DD_CAMPOS) proposta[c]=String(DD[c]??"").trim();
  const final={...a, curso:String(DD.curso||"").trim(),
    numeroAcao:a.numeroAcao??null, status:a.status, apreciacao:a.apreciacao,
    proposta, atualizadoEm:new Date().toISOString()};
  try{
    const r=await fetch("/api/extensao",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({acoes:[final]})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok) throw new Error(j.error||r.status);
    if(!j.gravadas) throw new Error("a gravação foi recusada — os dados do projeto são do responsável pela ação e da gestão da Extensão.");
    await carregar(); montarSeletor(); nav("dados");
    const m=$("dd-msg"); if(m){ m.textContent="✓ salvo"; setTimeout(()=>{ if($("dd-msg")) $("dd-msg").textContent=""; },3000); }
  }catch(e){
    if($("dd-msg")) $("dd-msg").textContent="";
    alert("Não foi possível salvar os dados do evento: "+e.message);
  }
}

    temFoto:p.temFoto===true, instituicao:p.instituicao||"", miniBio:p.miniBio||"",

/* PROGRAMAÇÃO ÚNICA (pedido do dono, ago/2026): nem todo evento tem uma
   grade — a reunião de práticas docentes, a palestra de uma tarde. Só que a
   carga horária do CERTIFICADO sai das atividades em que a pessoa teve
   presença; sem nenhuma atividade, ela cai na CH da ação inteira, e é daí
   que vinham as horas erradas. Um clique cria a atividade que espelha o
   próprio evento — mesmo nome, mesmas datas, mesmo local, mesma CH — e o
   evento passa a ter programação sem que ninguém precise montar uma.
   Ela nasce "geral": ninguém tem de marcá-la no formulário, e a etapa de
   escolha do credenciamento continua sendo pulada. */
function programacaoUnica(id){
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  const p=a.proposta||{};
  if(EV_PROG.length && !confirm(`Já há ${EV_PROG.length} atividade(s) na programação.\n\n`
    +"Acrescentar mesmo assim uma atividade única com os dados do evento?")) return;
  EV_PROG.push({ id:"", tipo:"palestra", titulo:p.nomeAtividade||"Atividade do evento",
    descricao:"", dia:p.periodoInicio||"", horaInicio:"", horaFim:"",
    local:p.local||"", responsavel:p.respNome||"", vagas:0, ch:String(p.cargaHoraria||""),
    inscricao:"geral", modalidade:"presencial", temFoto:false,
    instituicao:"", miniBio:"", frequencia:"entrada" });
  renderProgEv();
  const cx=$("ev-prog"); cx?.lastElementChild?.scrollIntoView({behavior:"smooth",block:"center"});
}

/* A soma das atividades ao lado da CH declarada: quem esquecer de preencher
   a CH de uma atividade vê na hora, em vez de descobrir no certificado. A CH
   da AÇÃO continua mandando (é a que a PROPPEX aprovou) — isto é conferência,
   não substituição. */
function somaChHtml(a){
  const num=(v)=>{ const m=String(v??"").replace(",",".").match(/\d+(?:\.\d+)?/); 
    const n=m?Number(m[0]):NaN; return Number.isFinite(n)&&n>0?n:0; };
  const decl=num(a.proposta?.cargaHoraria);
  if(!EV_PROG.length) return decl
    ? `Sem programação: o certificado usa a carga horária da ação (<b>${decl}h</b>). `
      +"Com atividades, ele soma as horas daquelas em que a pessoa teve presença."
    : "";
  const semCh=EV_PROG.filter(p=>!num(p.ch)).length;
  const soma=EV_PROG.reduce((s,p)=>s+num(p.ch),0);
  return `Soma das atividades: <b>${soma}h</b>${decl?` · carga horária da ação: <b>${decl}h</b>`:""}`
    +(semCh?` · <span style="color:var(--warn)">${semCh} atividade(s) sem carga horária</span>`:"")
    +(decl&&soma&&soma!==decl?` · <span style="color:var(--warn)">os dois números divergem</span>`:"");
}

function renderCredenciamento(a){
  const ev=a.evento||{};

/* O QR em tela cheia: é o que se projeta no telão no fim da reunião. Abre
   numa janela limpa — nome do evento, QR grande e o endereço escrito, para
   quem preferir digitar. */
function qrTelaCheia(slug, nome){
  const w = window.open("", "_blank");
  if(!w){ alert("O navegador bloqueou a janela. Libere as janelas para este site e tente de novo."); return; }
  const url = location.origin + "/eventos/" + encodeURIComponent(slug);
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
    <title>Inscreva-se — ${esc(nome||"evento")}</title>
    <style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:18px;background:#0f2027;color:#fff;

      code{font-size:clamp(13px,1.5vw,19px);background:rgba(255,255,255,.12);padding:8px 14px;border-radius:10px}</style>

      <p>Aponte a câmera do celular para o código e faça a sua inscrição</p>

}

/* ==================== COMISSÃO E PALESTRANTES ==========================
   Quem ORGANIZA e quem MINISTRA recebe certificado à parte do participante,
   e quem emite é o sistema da AEE, a partir da planilha que o ARCHÉ exporta.
   A planilha tem colunas fixas — CPF/matrícula, nome, e-mail, telefone (e a
   palestra, no palestrante) —, e linha incompleta lá é certificado que não
   sai: por isso os campos são obrigatórios AQUI, na hora do cadastro, e não
   uma surpresa na véspera (decisão do dono, ago/2026). */
let EQ_PAL = [], EQ_COM = [];
let PAPEIS_COM = [["coordenacao","Coordenação do evento"],["professor","Professor(a)"],
  ["monitor","Monitor(a)"],["aluno","Aluno(a) organizador(a)"],["colaborador","Colaborador(a)"],
  ["apoio","Apoio técnico"]];

const faltaCert = (x, pal) => {
  const f = [];
  const tem = (v) => String(v ?? "").trim().length > 0;
  if (!tem(x.nome)) f.push("nome");
  if (!tem(x.cpf) && !tem(x.matricula)) f.push("CPF ou matrícula");
  if (!tem(x.email)) f.push("e-mail");
  if (!tem(x.telefone)) f.push("telefone");
  if (pal && !tem(x.palestra)) f.push("título da palestra");
  return f;
};

  const ch = a.proposta?.cargaHoraria || "";
  $("v-equipe").innerHTML = `
    <div class="banner ba-info">Estes dados vão para a <b>planilha de certificados</b> (o sistema da AEE emite):
      CPF ou matrícula, nome, e-mail e telefone são <b>obrigatórios</b> em cada linha — e o título da palestra,
      no caso dos palestrantes. Sem eles o certificado não sai. A carga horária em branco usa a do evento${ch?` (${esc(ch)}h)`:""}.</div>

    <div class="card">
      <div class="sec-t">Palestrantes e ministrantes</div>
      <div class="muted" style="margin:8px 0">Quem apresenta palestra, oficina ou minicurso. O <b>título da

async function salvarEquipe(id){
  try{

      body:JSON.stringify({palestrantes:EQ_PAL, comissao:EQ_COM})});

async function lerLogo(inp,i,j){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ alert("O logotipo deve ser JPEG, PNG ou WebP."); inp.value=""; return; }
  if(f.size>CAPA_MAX_ARQUIVO){ alert("A imagem passa de 10 MB."); inp.value=""; return; }
  try{
    EV_BLOCOS[i].itens[j].logo = await reduzirLargura(f, 320, 60*1024);
    EV_BLOCOS[i].itens[j].temLogo = true;
    const prev=$(`logo-prev-${i}-${j}`);
    if(prev) prev.innerHTML=`<img src="${EV_BLOCOS[i].itens[j].logo}" alt="" style="max-height:40px;max-width:130px">
      <button class="bt bt-ghost" style="padding:4px 8px;font-size:11px" onclick="removerLogo(${i},${j})">✕ remover</button>`;
  }catch(e){ alert("Não foi possível preparar a imagem neste navegador."); }
}
function removerLogo(i,j){
  EV_BLOCOS[i].itens[j].logo=""; EV_BLOCOS[i].itens[j].temLogo=false;
  const prev=$(`logo-prev-${i}-${j}`);
  if(prev) prev.innerHTML='<span class="muted" style="font-size:12px">logotipo marcado para remoção — grava no "Salvar blocos".</span>';
}
/* Redução sem recorte (logotipo não se corta: a marca é o que é) */
async function reduzirLargura(f, largura, teto){
  const bmp = await createImageBitmap(f);
  const escala = Math.min(1, largura / bmp.width);
  const w = Math.max(1, Math.round(bmp.width*escala)), h = Math.max(1, Math.round(bmp.height*escala));
  const c = document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
  ctx.drawImage(bmp,0,0,w,h);
  bmp.close && bmp.close();
  let q=0.9, url=c.toDataURL("image/jpeg",q);
  while(url.length*3/4>teto && q>0.4){ q-=0.1; url=c.toDataURL("image/jpeg",q); }
  return url;
}

/* ----------------------------- capa -------------------------------------
   A arte sai do designer em alta (5, 8, 10 MB é o normal), e exigir que
   alguém a reduza antes de enviar é passar ao usuário um trabalho que o
   navegador faz sozinho. Agora o arquivo entra com até 10 MB e é REDUZIDO
   AQUI, para 1600 px de largura — que é a medida da arte — antes de subir.
   O que fica guardado continua pequeno: a capa viaja dentro do registro da
   ação, que é regravado inteiro a cada gravação. */
const CAPA_MAX_ARQUIVO = 10 * 1024 * 1024;   // o que se aceita do disco
const CAPA_LARGURA = 1600;                   // a medida da arte no hotsite
const CAPA_MAX_GRAVADA = 900 * 1024;         // o que se guarda, já reduzido

async function reduzirCapa(f){
  const bmp = await createImageBitmap(f);
  const escala = Math.min(1, CAPA_LARGURA / bmp.width);
  const w = Math.max(1, Math.round(bmp.width * escala));
  const h = Math.max(1, Math.round(bmp.height * escala));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  // fundo branco: PNG com transparência viraria preto no JPEG
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bmp, 0, 0, w, h);
  bmp.close && bmp.close();
  let q = 0.85, url = c.toDataURL("image/jpeg", q);
  while (url.length * 3 / 4 > CAPA_MAX_GRAVADA && q > 0.4){ q -= 0.1; url = c.toDataURL("image/jpeg", q); }
  return url;
}

async function lerCapaEv(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ alert("A capa deve ser JPEG, PNG ou WebP."); inp.value=""; return; }
  if(f.size>CAPA_MAX_ARQUIVO){ alert("A arte passa de 10 MB — exporte a imagem em qualidade um pouco menor."); inp.value=""; return; }
  const prev=$("ev-capa-prev");
  if(prev) prev.innerHTML='<span class="muted" style="font-size:12.5px">preparando a imagem…</span>';
  try{
    EV_CAPA = await reduzirCapa(f);
  }catch(e){
    // navegador sem createImageBitmap: segue com o arquivo como veio, se couber
    if(f.size > CAPA_MAX_GRAVADA){
      alert("Não consegui reduzir a imagem neste navegador. Envie uma arte de até 900 KB.");
      inp.value=""; if(prev) prev.innerHTML='<span class="muted" style="font-size:12.5px">— sem capa.</span>';
      return;
    }
    EV_CAPA = await new Promise((ok)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result||"")); r.readAsDataURL(f); });
  }
  const kb = Math.round(EV_CAPA.length * 3 / 4 / 1024);
  if(prev) prev.innerHTML=`<img src="${EV_CAPA}" alt="capa nova" style="height:64px;border-radius:8px;border:1px solid var(--line)">
    <span class="muted" style="font-size:12px;display:block">prévia (${kb} KB depois do ajuste) — grava no "Salvar página"</span>`;
}
/* Foto de quem ministra: mesma ideia da capa, em miniatura. Entra do disco
   como a pessoa tiver (até 10 MB), sai daqui recortada no QUADRADO e reduzida
   a 400 px — a vitrine de palestrantes é redonda, e guardar a foto original
   engordaria o registro da ação à toa. */
function fotoPrevia(p,i){
  if(p.foto) return `<img src="${p.foto}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--line)">`;
  const ev = (ABERTO ? ACOES.find(x=>x.id===ABERTO) : null)?.evento;
  if(p.temFoto && ev?.slug && ev?.ativo)
    return `<img src="/api/publico/eventos/${encodeURIComponent(ev.slug)}/atividade/${encodeURIComponent(p.id||"")}/foto?v=${Date.now()}"
      alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--line)" onerror="this.remove()">`;
  if(p.temFoto) return '<span class="muted" style="font-size:12px">✓ foto enviada</span>';
  return '<span class="muted" style="font-size:12px">— sem foto</span>';
}
async function lerFotoAtv(inp,i){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ alert("A foto deve ser JPEG, PNG ou WebP."); inp.value=""; return; }
  if(f.size>CAPA_MAX_ARQUIVO){ alert("A imagem passa de 10 MB — exporte em qualidade um pouco menor."); inp.value=""; return; }
  try{
    EV_PROG[i].foto = await recortarQuadrado(f, 400);
    EV_PROG[i].temFoto = true;
    const prev=$("foto-prev-"+i);
    if(prev) prev.innerHTML=`<img src="${EV_PROG[i].foto}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--line)">
      <button class="bt bt-ghost" style="padding:4px 8px;font-size:11px" onclick="removerFotoAtv(${i})">✕ remover</button>`;
  }catch(e){ alert("Não foi possível preparar a imagem neste navegador."); }
}
function removerFotoAtv(i){
  EV_PROG[i].foto=""; EV_PROG[i].temFoto=false;
  const prev=$("foto-prev-"+i);
  if(prev) prev.innerHTML='<span class="muted" style="font-size:12px">foto marcada para remoção — grava no "Salvar programação".</span>';
}
/* Recorte central em quadrado + redução: a mesma conta da capa, com o corte
   do lado menor (foto de retrato não pode entrar esticada no círculo). */
async function recortarQuadrado(f, lado){
  const bmp = await createImageBitmap(f);
  const min = Math.min(bmp.width, bmp.height);
  const sx = (bmp.width - min) / 2, sy = (bmp.height - min) / 2;
  const c = document.createElement("canvas");
  c.width = c.height = Math.min(lado, min);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(bmp, sx, sy, min, min, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  let q = 0.85, url = c.toDataURL("image/jpeg", q);
  while (url.length * 3 / 4 > 80 * 1024 && q > 0.4) { q -= 0.1; url = c.toDataURL("image/jpeg", q); }
  return url;
}
