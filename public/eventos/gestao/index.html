    <div class="banner ba-info">A pessoa digita o código no formulário de inscrição e vê na hora quanto fica. O desconto entra
      <b>depois do lote</b> e nunca deixa o valor negativo — desconto que zera o valor torna a inscrição isenta, com a credencial na hora.
      O <b>limite</b> conta as inscrições pagas, isentas e as reservas em aberto; reserva vencida devolve o uso.</div>
    <div class="card">
      <div class="sec-t">Vouchers</div>
      <div id="vou-lista"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button class="bt bt-ghost" style="padding:7px 12px;font-size:12.5px" onclick="EV_VOU.push({codigo:gerarCodigoVoucher(),desconto:'',categorias:[],limite:0,ate:'',ativo:true,descricao:'',usos:0});renderVouLista()">＋ Gerar voucher</button>
        <button class="bt bt-ghost" style="padding:7px 12px;font-size:12.5px" onclick="EV_VOU.push({codigo:'',desconto:'',categorias:[],limite:0,ate:'',ativo:true,descricao:'',usos:0});renderVouLista()">＋ Voucher com código próprio</button>
      </div>
    </div>
    <div class="exp" style="margin:0 0 18px">
      <button class="bt bt-pri" onclick="salvarVouchers('${esc(a.id)}')">💾 Salvar vouchers</button>
      <span class="muted" id="vou-msg" style="align-self:center"></span>
    </div>`;

function gerarCodigoVoucher(){
  const alf="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  const b=crypto.getRandomValues(new Uint8Array(8)); for(const x of b) s+=alf[x%alf.length];
  return s;
}

      <div><label style="margin-top:0">Código</label><input value="${esc(v.codigo)}" placeholder="ex.: MONITOR2026" style="text-transform:uppercase;font-family:ui-monospace,monospace" oninput="EV_VOU[${i}].codigo=this.value"></div>

  const linha=(n,rot,onde)=>n?`<li><b>${n}</b> ${rot} ${n===1?"está":"estão"} sem os dados completos — ${onde}</li>`:"";

    <ul style="margin:6px 0 0 18px;line-height:1.6">

/* ==================== COMISSÃO E PALESTRANTES ==========================
   Quem ORGANIZA e quem MINISTRA recebe certificado à parte do participante,
   e quem emite é o sistema da AEE, a partir da planilha que o ARCHÉ exporta.
   A planilha tem colunas fixas — CPF/matrícula, nome, e-mail, telefone (e a
   palestra, no palestrante) —, e linha incompleta lá é certificado que não
   sai: por isso os campos são obrigatórios AQUI, na hora do cadastro, e não
   uma surpresa na véspera (decisão do dono, ago/2026). */
let EQ_PAL = [], EQ_COM = [];
let PAPEIS_COM = [["coordenacao","Coordenação do evento"],["professor","Professor(a)"],
  ["monitor","Monitor(a)"],["aluno","Aluno(a) organizador(a)"],["colaborador","Colaborador(a)"],
  ["apoio","Apoio técnico"]];

const faltaCert = (x, pal) => {
  const f = [];
  const tem = (v) => String(v ?? "").trim().length > 0;
  // escolhido na busca de pessoas: CPF e telefone vêm do cadastro da conta ao
  // salvar (a busca não os entrega) — só contam como faltando se a conta não os tem
  const doPortal = x.conta && x.conta === String(x.email || "").trim().toLowerCase();
  if (!tem(x.nome)) f.push("nome");
  if (!tem(x.cpf) && !tem(x.matricula) && !(doPortal && x.contaTemCpf)) f.push("CPF ou matrícula");
  if (!tem(x.email)) f.push("e-mail");
  if (!tem(x.telefone) && !(doPortal && x.contaTemTelefone)) f.push("telefone");
  if (pal && !tem(x.palestra)) f.push("título da palestra");
  return f;
};

const fmtDH = (iso) => iso ? new Date(iso).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
async function trPost(caminho, corpo){
  const r=await fetch(`/api/extensao/${encodeURIComponent(ABERTO)}/trabalhos/${caminho}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corpo||{})});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||`Falha ${r.status}`); return j;
}
async function trDesignar(tid){
  const ind=$(`tr-ind-${tid}`); const indicado=!!(ind&&ind.checked&&!ind.disabled);
  const nome=($(`tr-rnome-${tid}`)||{}).value||"", email=(($(`tr-remail-${tid}`)||{}).value||"").trim();
  const revisores=email?[{nome, email}]:[];
  if(!indicado&&!revisores.length) return alert("Marque o revisor indicado ou escreva o e-mail de outro revisor.");
  try{
    const j=await trPost(`${encodeURIComponent(tid)}/designar`,{indicado, revisores, prazo:$(`tr-prazo-${tid}`).value, mensagem:$(`tr-msg-${tid}`).value});
    alert(`✅ ${j.designados} revisor(es) designado(s). O convite com o link pessoal foi enviado por e-mail.`);
    renderTrabalhos({id:ABERTO});
  }catch(e){ alert(e.message); }
}
async function trLembrar(tid){
  if(!confirm("Reenviar o convite a quem ainda não entregou o parecer?")) return;
  try{ const j=await trPost(`${encodeURIComponent(tid)}/lembrar`,{}); alert(`Lembrete enviado a ${j.lembrados} revisor(es).`); }
  catch(e){ alert(e.message); }
}
async function trDecidir(tid){
  const codigo=$(`tr-dec-${tid}`).value, mensagem=$(`tr-decmsg-${tid}`).value;
  const nome=(TR.catalogos.decisoes.find(d=>d.codigo===codigo)||{}).nome||codigo;
  if(!confirm(`${nome}?\n\nO autor recebe a decisão por e-mail${codigo!=="rejeitado"?" com os pareceres (sem os nomes dos revisores)":""}.`)) return;
  try{ await trPost(`${encodeURIComponent(tid)}/decidir`,{codigo, mensagem}); renderTrabalhos({id:ABERTO}); }
  catch(e){ alert(e.message); }
}

/* A BUSCA DE PESSOAS (pedido do dono, set/2026): escreve-se o nome, a lista
   traz as contas do portal que casam, e o clique preenche nome e e-mail —
   CPF e telefone o servidor completa do cadastro ao salvar (a busca não os
   entrega). Quem vem da busca fica marcado em `conta`; mexer no nome depois
   desfaz a marca, senão a linha continuaria dizendo que é a conta X com
   outro nome em cima. */
let SUG_TIMER = null, SUG_SEQ = 0;
function buscaPessoa(q, qual, i){
  clearTimeout(SUG_TIMER);
  const alvo = $(`sug-${qual}-${i}`); if(!alvo) return;
  const termo = String(q||"").trim();
  if(termo.length < 3){ alvo.hidden = true; return; }
  const seq = ++SUG_SEQ;
  SUG_TIMER = setTimeout(async()=>{
    try{
      const r = await fetch(`/api/eventos/pessoas?q=${encodeURIComponent(termo)}`);
      const j = await r.json().catch(()=>({}));
      if(seq !== SUG_SEQ || !r.ok) return;
      const lista = j.pessoas || [];
      alvo.innerHTML = lista.length ? lista.map(p=>`<button type="button"
          onmousedown="event.preventDefault()" onclick="escolhePessoa('${qual}',${i},${esc(JSON.stringify(p)).replace(/'/g,"&#39;")})">
          ${esc(p.nome)}<small>${esc([p.email, p.funcao, p.curso].filter(Boolean).join(" · "))}${p.temCpf&&p.temTelefone?"":" · <b>cadastro sem "+[!p.temCpf?"CPF":"",!p.temTelefone?"telefone":""].filter(Boolean).join(" e ")+"</b>"}</small></button>`).join("")
        : `<div class="vazio">Ninguém com esse nome entre as contas do portal — preencha a linha à mão.</div>`;
      alvo.hidden = false;
    }catch{ /* sem sugestão, a digitação segue */ }
  }, 220);
}
function fechaSug(qual, i){ const alvo=$(`sug-${qual}-${i}`); if(alvo) alvo.hidden = true; }
function escolhePessoa(qual, i, p){
  const lista = qual==="pal" ? EQ_PAL : EQ_COM;
  const x = lista[i]; if(!x) return;
  x.nome = p.nome; x.email = p.email; x.conta = p.email;
  x.contaTemCpf = !!p.temCpf; x.contaTemTelefone = !!p.temTelefone;
  if(qual==="pal") renderEqPal(); else renderEqCom();
  // o cursor vai ao que ainda é da pessoa que preenche: a CH ou a palestra
  const card = $(`sug-${qual}-${i}`)?.closest(".atv-card");
  const prox = card && [...card.querySelectorAll("input")].find(el=>/CH|palestra/.test(el.placeholder));
  if(prox) prox.focus();
}
function saiuDoPortal(x){ if(x && x.conta){ /* nome alterado à mão: a linha deixa de ser a conta */ delete x.conta; delete x.contaTemCpf; delete x.contaTemTelefone; } }

/* o aviso do que falta acompanha a digitação, sem redesenhar a linha (o campo
   perderia o foco a cada tecla) */
function marcaFalta(i, qual){
  const alvo=$(`falta-${qual}-${i}`); if(!alvo) return;
  const x = qual==="pal" ? EQ_PAL[i] : EQ_COM[i];
  alvo.innerHTML = linhaFalta(faltaCert(x, qual==="pal"));
}

async function lerLogo(inp,i,j){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ alert("O logotipo deve ser JPEG, PNG ou WebP."); inp.value=""; return; }
  if(f.size>CAPA_MAX_ARQUIVO){ alert("A imagem passa de 10 MB."); inp.value=""; return; }
  try{
    EV_BLOCOS[i].itens[j].logo = await reduzirLargura(f, 320, 60*1024);
    EV_BLOCOS[i].itens[j].temLogo = true;
    const prev=$(`logo-prev-${i}-${j}`);
    if(prev) prev.innerHTML=`<img src="${EV_BLOCOS[i].itens[j].logo}" alt="" style="max-height:40px;max-width:130px">
      <button class="bt bt-ghost" style="padding:4px 8px;font-size:11px" onclick="removerLogo(${i},${j})">✕ remover</button>`;
  }catch(e){ alert("Não foi possível preparar a imagem neste navegador."); }
}
/* a foto do bloco de imagens: mesmo campo do logotipo, teto maior (é foto) */
async function lerImagemGaleria(inp,i,j){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ alert("A imagem deve ser JPEG, PNG ou WebP."); inp.value=""; return; }
  if(f.size>CAPA_MAX_ARQUIVO){ alert("A imagem passa de 10 MB."); inp.value=""; return; }
  try{
    EV_BLOCOS[i].itens[j].logo = await reduzirLargura(f, 1400, 380*1024);
    EV_BLOCOS[i].itens[j].temLogo = true;
    const prev=$(`logo-prev-${i}-${j}`);

function removerLogo(i,j){

/* Redução sem recorte (logotipo não se corta: a marca é o que é) */
async function reduzirLargura(f, largura, teto){
  const bmp = await createImageBitmap(f);
  const escala = Math.min(1, largura / bmp.width);
  const w = Math.max(1, Math.round(bmp.width*escala)), h = Math.max(1, Math.round(bmp.height*escala));
  const c = document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
  ctx.drawImage(bmp,0,0,w,h);
  bmp.close && bmp.close();
  let q=0.9, url=c.toDataURL("image/jpeg",q);
  while(url.length*3/4>teto && q>0.4){ q-=0.1; url=c.toDataURL("image/jpeg",q); }
  return url;
}

/* ----------------------------- capa -------------------------------------
   A arte sai do designer em alta (5, 8, 10 MB é o normal), e exigir que
   alguém a reduza antes de enviar é passar ao usuário um trabalho que o
   navegador faz sozinho. Agora o arquivo entra com até 10 MB e é REDUZIDO
   AQUI, para 1600 px de largura — que é a medida da arte — antes de subir.
   O que fica guardado continua pequeno: a capa viaja dentro do registro da
   ação, que é regravado inteiro a cada gravação. */
const CAPA_MAX_ARQUIVO = 10 * 1024 * 1024;   // o que se aceita do disco
const CAPA_LARGURA = 1600;                   // a medida da arte no hotsite
const CAPA_MAX_GRAVADA = 900 * 1024;         // o que se guarda, já reduzido

async function reduzirCapa(f){
  const bmp = await createImageBitmap(f);
  const escala = Math.min(1, CAPA_LARGURA / bmp.width);
  const w = Math.max(1, Math.round(bmp.width * escala));
  const h = Math.max(1, Math.round(bmp.height * escala));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  // fundo branco: PNG com transparência viraria preto no JPEG
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bmp, 0, 0, w, h);
  bmp.close && bmp.close();
  let q = 0.85, url = c.toDataURL("image/jpeg", q);
  while (url.length * 3 / 4 > CAPA_MAX_GRAVADA && q > 0.4){ q -= 0.1; url = c.toDataURL("image/jpeg", q); }
  return url;
}

async function lerCapaEv(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ alert("A capa deve ser JPEG, PNG ou WebP."); inp.value=""; return; }
  if(f.size>CAPA_MAX_ARQUIVO){ alert("A arte passa de 10 MB — exporte a imagem em qualidade um pouco menor."); inp.value=""; return; }
  const prev=$("ev-capa-prev");
  if(prev) prev.innerHTML='<span class="muted" style="font-size:12.5px">preparando a imagem…</span>';
  try{
    EV_CAPA = await reduzirCapa(f);
  }catch(e){
    // navegador sem createImageBitmap: segue com o arquivo como veio, se couber
    if(f.size > CAPA_MAX_GRAVADA){
      alert("Não consegui reduzir a imagem neste navegador. Envie uma arte de até 900 KB.");
      inp.value=""; if(prev) prev.innerHTML='<span class="muted" style="font-size:12.5px">— sem capa.</span>';
      return;
    }
    EV_CAPA = await new Promise((ok)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result||"")); r.readAsDataURL(f); });
  }
  const kb = Math.round(EV_CAPA.length * 3 / 4 / 1024);
  if(prev) prev.innerHTML=`<img src="${EV_CAPA}" alt="capa nova" style="height:64px;border-radius:8px;border:1px solid var(--line)">
    <span class="muted" style="font-size:12px;display:block">prévia (${kb} KB depois do ajuste) — grava no "Salvar página"</span>`;
}
/* Foto de quem ministra: mesma ideia da capa, em miniatura. Entra do disco
   como a pessoa tiver (até 10 MB), sai daqui recortada no QUADRADO e reduzida
   a 400 px — a vitrine de palestrantes é redonda, e guardar a foto original
   engordaria o registro da ação à toa. */
function fotoPrevia(p,i){
  if(p.foto) return `<img src="${p.foto}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--line)">`;
  const ev = (ABERTO ? ACOES.find(x=>x.id===ABERTO) : null)?.evento;
  if(p.temFoto && ev?.slug && ev?.ativo)
    return `<img src="/api/publico/eventos/${encodeURIComponent(ev.slug)}/atividade/${encodeURIComponent(p.id||"")}/foto?v=${Date.now()}"
      alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--line)" onerror="this.remove()">`;
  if(p.temFoto) return '<span class="muted" style="font-size:12px">✓ foto enviada</span>';
  return '<span class="muted" style="font-size:12px">— sem foto</span>';
}
async function lerFotoAtv(inp,i){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ alert("A foto deve ser JPEG, PNG ou WebP."); inp.value=""; return; }
  if(f.size>CAPA_MAX_ARQUIVO){ alert("A imagem passa de 10 MB — exporte em qualidade um pouco menor."); inp.value=""; return; }
  try{
    EV_PROG[i].foto = await recortarQuadrado(f, 400);
    EV_PROG[i].temFoto = true;
    const prev=$("foto-prev-"+i);
    if(prev) prev.innerHTML=`<img src="${EV_PROG[i].foto}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--line)">
      <button class="bt bt-ghost" style="padding:4px 8px;font-size:11px" onclick="removerFotoAtv(${i})">✕ remover</button>`;
  }catch(e){ alert("Não foi possível preparar a imagem neste navegador."); }
}
function removerFotoAtv(i){
  EV_PROG[i].foto=""; EV_PROG[i].temFoto=false;
  const prev=$("foto-prev-"+i);
  if(prev) prev.innerHTML='<span class="muted" style="font-size:12px">foto marcada para remoção — grava no "Salvar programação".</span>';
}
/* Recorte central em quadrado + redução: a mesma conta da capa, com o corte
   do lado menor (foto de retrato não pode entrar esticada no círculo). */
async function recortarQuadrado(f, lado){
  const bmp = await createImageBitmap(f);
  const min = Math.min(bmp.width, bmp.height);
  const sx = (bmp.width - min) / 2, sy = (bmp.height - min) / 2;
  const c = document.createElement("canvas");
  c.width = c.height = Math.min(lado, min);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(bmp, sx, sy, min, min, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  let q = 0.85, url = c.toDataURL("image/jpeg", q);
  while (url.length * 3 / 4 > 80 * 1024 && q > 0.4) { q -= 0.1; url = c.toDataURL("image/jpeg", q); }
  return url;
}

      <div class="txt">
        <div class="p1">${esc(m.nome||"—")} <span class="muted" style="font-weight:400">· ${fmtDataHora(m.em)}</span>
          ${m.oculto?'<span class="badge" style="background:var(--err-soft);color:var(--err);margin-left:6px">oculta</span>':""}</div>

async function moderarMural(id,mid,oculto){
  try{
    const r=await fetch(`/api/extensao/${id}/mural/${encodeURIComponent(mid)}`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({oculto})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    const a=ACOES.find(x=>x.id===id);
    const m=a?.evento?.mural?.find(x=>x.id===mid);
    if(m) m.oculto=oculto;
    renderMuralEv(a);
  }catch(e){ alert("Não foi possível moderar: "+e.message); }
}

/* ------------------------ inscritos e presenças -------------------------- */
/* FILTROS DA LISTA DE INSCRITOS (pedido do dono, set/2026: "coloque filtros por
   curso, período, pagos etc. — este evento terá muitos alunos"): curso, cada
   campo extra de SELEÇÃO do formulário (é assim que "período" entra: como
   campo extra com opções), situação do pagamento, presença e origem. Os
   valores dos filtros ficam em EV_FILTROS e a lista se redesenha do zero. */
let EV_FILTROS={};
const sel=(id,rotulo,opcoes,valor)=>`<label style="margin:0;display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--muted)">${esc(rotulo)}
  <select style="width:auto;max-width:220px;font-size:12.5px;padding:6px 30px 6px 8px" onchange="EV_FILTROS['${esc(id)}']=this.value;ArchePag.zerar('ev-inscritos');renderInscritosEv(ACOES.find(x=>x.id===ABERTO))">
    <option value="">todos</option>${opcoes.map(o=>`<option value="${esc(o.v)}" ${valor===o.v?"selected":""}>${esc(o.r)}${o.n!=null?` (${o.n})`:""}</option>`).join("")}</select></label>`;
function filtrosInscritosHtml(a){
  const todos=a.participantes?.inscritos||[];
  const cont=(fn)=>{ const m=new Map(); for(const x of todos){ for(const v of [].concat(fn(x)||[])){ if(v) m.set(v,(m.get(v)||0)+1); } } return [...m.entries()].sort((p,q)=>String(p[0]).localeCompare(String(q[0]),"pt-BR")).map(([v,n])=>({v,r:v,n})); };
  const partes=[];
  const cursos=cont(x=>x.curso);
  if(cursos.length>1) partes.push(sel("curso","Curso",cursos,EV_FILTROS.curso||""));
  for(const c of (a.evento?.formulario||[])){
    if(!["selecao","multipla"].includes(c.tipo)) continue;
    const ops=cont(x=>x.filtros?.[c.id]);
    if(ops.length) partes.push(sel("campo:"+c.id,c.rotulo,ops,EV_FILTROS["campo:"+c.id]||""));
  }
  if(a.evento?.cobranca?.ativa||todos.some(x=>x.pagamento)){
    const pg=cont(x=>x.pagamento?x.pagamento.status:"sem-cobranca").map(o=>({...o,r:o.v==="sem-cobranca"?"sem cobrança":(ROTULO_PG[o.v]||o.v)}));
    pg.unshift({v:"__validas",r:"confirmadas (pagas, isentas ou sem cobrança)",n:todos.filter(x=>!x.pagamento||["pago","isento"].includes(x.pagamento.status)).length});
    partes.push(sel("pagamento","Pagamento",pg,EV_FILTROS.pagamento||""));
  }
  partes.push(sel("presenca","Presença",[{v:"sim",r:"presentes",n:todos.filter(x=>x.presente===true).length},{v:"nao",r:"ausentes",n:todos.filter(x=>x.presente!==true).length}],EV_FILTROS.presenca||""));
  if(todos.some(x=>x.origem!=="online")) partes.push(sel("origem","Origem",[{v:"online",r:"inscrição online",n:todos.filter(x=>x.origem==="online").length},{v:"lista",r:"lista da coordenação",n:todos.filter(x=>x.origem!=="online").length}],EV_FILTROS.origem||""));
  const ativos=Object.values(EV_FILTROS).filter(Boolean).length;
  return partes.join("")+(ativos?`<button class="bt bt-ghost" style="padding:5px 10px;font-size:12px" onclick="EV_FILTROS={};ArchePag.zerar('ev-inscritos');renderInscritos(ACOES.find(x=>x.id===ABERTO))">✕ Limpar filtros</button>`:"");
}
function passaFiltros(x){
  const f=EV_FILTROS;
  if(f.curso&&x.curso!==f.curso) return false;
  for(const k of Object.keys(f)){ if(!k.startsWith("campo:")||!f[k]) continue; const v=x.filtros?.[k.slice(6)]; if(!(Array.isArray(v)?v.includes(f[k]):v===f[k])) return false; }
  if(f.pagamento){
    if(f.pagamento==="__validas"){ if(x.pagamento&&!["pago","isento"].includes(x.pagamento.status)) return false; }
    else if(f.pagamento==="sem-cobranca"){ if(x.pagamento) return false; }
    else if(!x.pagamento||x.pagamento.status!==f.pagamento) return false;
  }
  if(f.presenca==="sim"&&x.presente!==true) return false;
  if(f.presenca==="nao"&&x.presente===true) return false;
  if(f.origem==="online"&&x.origem!=="online") return false;
  if(f.origem==="lista"&&x.origem==="online") return false;
  return true;
}
function renderInscritosEv(a){
  const el=$("ev-inscritos"); if(!el||!a) return;
  const q=($("ev-busca")?.value||"").trim().toLowerCase();
  const todos=a.participantes?.inscritos||[];
  const prog=a.evento?.programacao||[];
  const tituloAtv=(id)=>prog.find(p=>p?.id===id)?.titulo||"?";
  const lista=todos.filter(passaFiltros).filter(x=>!q
    || String(x.nome||"").toLowerCase().includes(q)
    || String(x.email||"").toLowerCase().includes(q)
    || String(x.cpf||"").replace(/\D/g,"").includes(q.replace(/\D/g,"")||"§"));
  const hora=(iso)=>{ try{ return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch{ return ""; } };
  // um evento grande passa de trezentos inscritos, e a guia é operada NO DIA,
  // com o telão ao lado: paginada como as demais listas do portal
  // o redesenho REBUSCA a ação: a guia se recarrega sozinha a cada 30 s no dia
  // do evento, e um fechamento sobre o objeto antigo mostraria a página 2 com
  // a lista de inscritos de trinta segundos atrás
  const pag=ArchePag.recorte("ev-inscritos",lista,()=>renderInscritosEv(ACOES.find(x=>x.id===a.id)||a));
  el.innerHTML = lista.length ? `${pag.barra}<table class="pt">
    <thead><tr><th>Nome</th><th>Contato</th><th>Origem</th><th>Código</th><th>Atividades</th><th>Presença</th></tr></thead>
    <tbody>${pag.itens.map(x=>{
      const marcadas=(x.atividades||[]).map(tituloAtv);
      const porAtv=(x.presencas||[]).filter(p=>p&&p.atividade);
      return `<tr>
      <td>${esc(x.nome)}</td>
      <td>${esc(x.email||"")}${x.telefone?`<br><span class="muted">${esc(x.telefone)}</span>`:""}</td>
      <td>${x.origem==="online"?`online${x.inscritoEm?` <span class="muted">${esc(hora(x.inscritoEm))}</span>`:""}`:"lista da coordenação"}${x.curso?`<br><span class="muted" style="font-size:11.5px">${esc(x.curso)}</span>`:""}${x.pagamento?`<br>${badgePg(x.pagamento)}${["aguardando","expirado","recusado"].includes(x.pagamento.status)&&x.token?` <button class="bt bt-ok" style="padding:1px 8px;font-size:11px" title="Confirmar a inscrição SEM pagamento (monitor, professor, convidado): a credencial passa a valer e o e-mail com o QR sai agora" onclick="isentarInscrito('${esc(a.id)}','${esc(x.token)}','${esc(x.nome)}')">isentar</button>`:""}`
        :a.evento?.cobranca?.ativa?`<br><span class="badge" style="background:#eceff3;color:var(--muted)" title="Esta inscrição não tem cobrança: entrou antes de a cobrança ser ligada, ou veio da lista da coordenação. Vale como confirmada.">sem cobrança</span>`:""}</td>
      <td style="font-family:ui-monospace,monospace">${x.token?esc(x.token.slice(0,6).toUpperCase()):"—"}</td>
      <td title="${esc(marcadas.join(" · "))}">${marcadas.length||"—"}</td>
      <td>${x.presente===true
        ? `<span class="badge" style="background:var(--ok-soft);color:var(--ok)" title="${esc(porAtv.map(p=>tituloAtv(p.atividade)).join(" · "))}">✓ ${esc(hora(x.presenteEm))}${porAtv.length?` · ${porAtv.length} atv`:""}</span>
           <button class="lk" style="margin-left:6px;font-size:11px" title="Desfazer a presença geral"
             onclick="marcarPresencaEv('${esc(a.id)}','${esc(x.token||"")}','${esc(x.cpf||"")}','${esc(x.email||"")}',false)">desfazer</button>
           ${$("ev-atv-sel")?.value?`<button class="bt bt-sec" style="padding:2px 9px;font-size:11px;margin-left:4px" title="Registrar presença também na atividade escolhida acima"
             onclick="presencaAtividadeEv('${esc(a.id)}','${esc(x.token||"")}','${esc(x.cpf||"")}','${esc(x.email||"")}')">＋ na atividade</button>`:""}`
        : `<button class="bt bt-sec" style="padding:2px 9px;font-size:11px" title="Marcar presença à mão — na atividade escolhida acima (quem tem QR) ou na entrada geral"
             onclick="presencaManualEv('${esc(a.id)}','${esc(x.token||"")}','${esc(x.cpf||"")}','${esc(x.email||"")}')">✓ presente</button>`}</td>
    </tr>`;}).join("")}</tbody></table>
    <div class="cnt">${lista.length} de ${todos.length} inscrito(s)${q?" no filtro":""}.</div>`
    : `<div class="cnt">— ${todos.length?"ninguém encontrado com esta busca.":"nenhum inscrito ainda."}</div>`;
}

/* Atualiza os números da guia aberta sem tocar em formulário: cada bloco só
   existe numa guia, e quem não está na tela é ignorado. */
function atualizarContadoresEvento(a){
  const inscritos=a.participantes?.inscritos||[];
  const ev=a.evento||{};
  if($("ev-cnt-insc")) $("ev-cnt-insc").textContent=inscritos.length;
  if($("ev-cnt-pres")) $("ev-cnt-pres").textContent=inscritos.filter(x=>x.presente===true).length;
  if($("ev-cnt-vagas")) $("ev-cnt-vagas").textContent=Number(ev.vagas)>0
    ? `${Math.max(0,Number(ev.vagas)-inscritos.length)} de ${ev.vagas}` : "ilimitadas";
  if($("ev-cnt-atv")) $("ev-cnt-atv").innerHTML=contadoresAtividadeHtml(a)
    ||'<div class="cnt">— sem atividade com inscrição própria ou presença registrada.</div>';
  renderMuralEv(a);
}

// as únicas guias com elemento que muda sozinho: contadores do Início,
// tabela de inscritos, contadores por atividade e o mural da transmissão
const GUIAS_AO_VIVO = ["inicio","inscritos","programacao","transmissao"];
let AO_VIVO_ID=null;
/* Recarrega SÓ a ação aberta (set/2026): o poll baixava o GET /api/extensao
   inteiro — todas as ações com todos os inscritos — para pintar os contadores
   de um evento; agora pede a rota da ação e troca a entrada em ACOES. */
async function recarregarAcao(id){
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}`,{cache:"no-store"});
  if(!r.ok) throw new Error("falha ao recarregar a ação");
  const a=(await r.json()).acao; if(!a) return null;
  a.proposta=a.proposta||{}; const p=a.participantes||(a.participantes={}); p.inscritos=p.inscritos||[];
  const i=ACOES.findIndex(x=>x.id===id);
  if(i>=0) ACOES[i]=a; else ACOES.push(a);
  return a;
}
async function aoVoltarAba(){
  if(document.visibilityState!=="visible"||!AO_VIVO_ID) return;
  if(!GUIAS_AO_VIVO.includes(SECAO)||ABERTO!==AO_VIVO_ID) return;
  try{
    const a=await recarregarAcao(AO_VIVO_ID); if(!a) return;
    atualizarContadoresEvento(a);
  }catch{ /* sem rede agora — o intervalo tenta de novo */ }
}

/* Contadores "ao vivo" no dia do evento: enquanto uma guia de evento está
   aberta e a página do evento ativa, recarrega a cada 60 s — só números, a
   tabela de inscritos e o mural, sem tocar nos formulários (senão o
   refresco apagaria o que se digita). */
function agendarEvento(id){
  clearInterval(EV_TIMER);
  document.removeEventListener("visibilitychange", aoVoltarAba);
  const a0=ACOES.find(x=>x.id===id);
  if(!a0?.evento?.ativo) return;
  // voltar para a aba atualiza na hora: sem isto, quem volta olha um número
  // de até 60 s atrás achando que é o de agora
  AO_VIVO_ID=id;
  document.addEventListener("visibilitychange", aoVoltarAba);
  EV_TIMER=setInterval(async()=>{
    const meta=SECOES.find(s=>s.k===SECAO);
    if(!meta?.evento||ABERTO!==id){ clearInterval(EV_TIMER); return; }
    // Só as guias que TÊM algo ao vivo, e só com a aba à vista (varredura de
    // ago/2026): `carregar()` é o GET /api/extensao inteiro, e o gatilho era
    // qualquer guia de evento — nas outras nove o poll baixava tudo para não
    // pintar nada. Uma aba esquecida aberta à noite somava alguns GB sozinha.
    if(!GUIAS_AO_VIVO.includes(SECAO)) return;
    if(document.visibilityState!=="visible") return;
    try{
      // só a ação aberta, e a cada 60 s (set/2026): a lista inteira a cada
      // 30 s era o maior gasto de banda da gestão com a aba aberta o dia todo
      const a=await recarregarAcao(id); if(!a) return;
      atualizarContadoresEvento(a); renderInscritosEv(a);
    }catch{ /* sem rede agora — a próxima volta tenta de novo */ }
  },60000);
}

async function atualizarEvento(id){
  try{ await carregar(); }catch(e){ alert(e.message); return; }
  montarSeletor();
  nav(SECAO);
}

/* presença manual (gestão): para quem veio da lista da coordenação (sem QR)
   ou assinou o papel — o credenciamento por QR é dos inscritos online.
   SEMPRE pela rota autenticada da gestão: o registro sai assinado
   "gestão (email)", nunca "monitor". */
/* Acha o inscrito na cópia que a tela já tem, pela mesma chave que foi
   enviada ao servidor. Serve para atualizar a LINHA em vez de recarregar a
   base inteira a cada clique. */
function acharInscritoLocal(a, token, cpf, email){
  const ins=a?.participantes?.inscritos||[];
  const dig=(v)=>String(v||"").replace(/\D/g,"");
  return ins.find(x=>token&&String(x.token||"").toLowerCase()===String(token).toLowerCase())
    || ins.find(x=>dig(cpf)&&dig(x.cpf)===dig(cpf))
    || ins.find(x=>email&&String(x.email||"").toLowerCase()===String(email).toLowerCase())
    || null;
}

/* Marcar presença NÃO recarrega mais a base inteira (varredura de ago/2026):
   `carregar()` é o GET /api/extensao completo, com todos os inscritos de
   todas as ações — centenas de KB por clique, numa tarefa que a gestão faz
   em série, 300 vezes seguidas. A resposta da rota já traz o que mudou; a
   tela aplica na própria cópia e redesenha a lista. */
async function marcarPresencaEv(id, token, cpf, email, presente){
  try{
    const r=await fetch("/api/extensao/"+id+"/presenca",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token,cpf,email,presente})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    const a=ACOES.find(x=>x.id===id);
    const i=acharInscritoLocal(a, token, cpf, email);
    if(i){
      i.presente=j.presente===true; i.presenteEm=j.presenteEm||"";
      // desfazer tira o registro GERAL de presencas, como o servidor faz —
      // as presenças por atividade ficam
      if(!i.presente && Array.isArray(i.presencas))
        i.presencas=i.presencas.filter(p=>String(p?.atividade||"")!=="");
    }
    if(a){ atualizarContadoresEvento(a); renderInscritosEv(a); }
  }catch(e){ alert("Não foi possível marcar a presença: "+e.message); }
}
/* Presença manual COM atividade — mesma rota autenticada; funciona também
   para o inscrito da lista em papel, sem token: a rota acha por CPF/e-mail. */
async function presencaAtividadeEv(id, token, cpf, email){
  const atv=$("ev-atv-sel")?.value||"";
  try{
    const r=await fetch("/api/extensao/"+id+"/presenca",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token, cpf, email, atividade:atv, presente:true})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    const a2=ACOES.find(x=>x.id===id);
    const i=acharInscritoLocal(a2, token, cpf, email);
    if(i && atv){
      i.presencas=Array.isArray(i.presencas)?i.presencas:[];
      const tem=i.presencas.some(p=>String(p?.atividade||"")===atv);
      if(j.naAtividade && !tem) i.presencas.push({atividade:atv, em:new Date().toISOString(), por:"gestão"});
      if(!j.naAtividade && tem) i.presencas=i.presencas.filter(p=>String(p?.atividade||"")!==atv);
      i.presente=j.presente===true; i.presenteEm=j.presenteEm||i.presenteEm||"";
    }
    if(a2){ atualizarContadoresEvento(a2); renderInscritosEv(a2); }
  }catch(e){ alert("Não foi possível registrar na atividade: "+e.message); }
}
function presencaManualEv(id, token, cpf, email){

/* --------------------------- salvar / publicar ---------------------------
   Cada guia salva SÓ o que edita: a rota do evento aplica campo a campo o
   que veio no corpo, então o que a guia não mandou fica exatamente como
   está. Nunca se envia a configuração inteira de uma vez. */
async function salvarParteEvento(id, body){
  const msg=$("ev-msg"); if(msg){ msg.textContent="Salvando…"; msg.style.color=""; }
  try{
    const r=await fetch(`/api/extensao/${id}/evento`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    await carregar(); montarSeletor(); nav(SECAO);
    const m=$("ev-msg"); if(m){ m.textContent="✓ salvo"; setTimeout(()=>{ if($("ev-msg")) $("ev-msg").textContent=""; },3000); }
    return true;
  }catch(e){
    // a recusa do servidor sai COMO VEIO (é o caso da trava de publicação:
    // o 400 lista o que falta no projeto) — na tela quando há onde, senão no alerta
    const m=$("ev-msg");
    if(m){ m.textContent="✕ "+e.message; m.style.color="var(--err)"; }
    else alert("Não foi possível salvar o evento: "+e.message);
    return false;
  }
}

/* Página do evento: ativação, endereço, descrição, local e capa. A capa só
   entra no corpo quando a tela mexeu nela — mandar sempre apagaria a que
   está gravada (o payload nunca traz o base64 de volta). */
function salvarPagina(id){
  // o interruptor da frequência mora aqui: é decisão do evento, não da página
  const freq = document.querySelector('input[name="ev-freq"]:checked');
  const body={
    ativo:$("ev-ativo")?.checked||false,
    descricao:$("ev-desc")?.value||"",

  if(slugEl&&slugEl.value.trim()) body.slug=slugEl.value.trim();
  return salvarParteEvento(id, body);
}

/* ======================================================================
   ENCERRAR O EVENTO = ENTREGAR O RELATÓRIO FINAL DA AÇÃO

   Pedido do dono (ago/2026), depois do primeiro evento gerido de ponta a
   ponta: o evento encerrou, os certificados saíram — e a ação continuou
   sem relatório no ARCHÉ EX, porque quem organiza o evento termina o
   trabalho AQUI e não volta ao outro setor. Encerrar passa a pedir o que o
   relatório pede (os campos e as fotos), e a mesma régua do formulário do
   EX vale aqui: quem confere é o servidor (lib/relatorioEx.js).
   ====================================================================== */
/* A foto do portfólio entra no PDF do relatório, e o PDFKit embute o
   arquivo como ele é: 24 fotos de celular davam 61 MB. 1600 px é bem mais do
   que a moldura de 8 cm precisa. Documento não-imagem sobe intacto, e se o
   navegador não souber ler, vai o original — perder o anexo seria pior. */
const FOTO_PORTFOLIO_LARGURA = 1600;
async function reduzirFotoPortfolio(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type||"")) return f;
  try{
    const bmp = await createImageBitmap(f);
    if(bmp.width<=FOTO_PORTFOLIO_LARGURA && f.size<=900*1024){ bmp.close&&bmp.close(); return f; }
    const escala = Math.min(1, FOTO_PORTFOLIO_LARGURA/bmp.width);
    const w=Math.max(1,Math.round(bmp.width*escala)), h=Math.max(1,Math.round(bmp.height*escala));
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
    ctx.drawImage(bmp,0,0,w,h);
    bmp.close&&bmp.close();
    const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.85));
    if(!blob||blob.size>=f.size) return f;
    const nome=String(f.name||"foto").replace(/\.[^.]+$/,"")+".jpg";
    return new File([blob],nome,{type:"image/jpeg"});
  }catch{ return f; }
}

const ehFotoAnexo=(x)=>{ const t=String(x?.tipo||"");
  return t?t.startsWith("image/"):/\.(jpe?g|png|webp|heic|heif|gif|bmp|tiff?)$/i.test(String(x?.name||"")); };
const fotosDa=(a)=>(a?.portfolio?.anexos||[]).filter(ehFotoAnexo);

function encerrarEvento(id){

  const r=a.relatorio||{}, n=numerosEventoLocal(a);

     longo do módulo, e o único campo que o sistema não preenche — a
     avaliação/resultados — é justamente o que a pessoa acabou de escrever à
     mão. Um clique na faixa ao lado jogava tudo fora, sem perguntar. É o
     mesmo cuidado que o assistente de novo evento já tinha. */
  cx.onclick=(e)=>{ if(e.target===cx) piscarEncerrar(); };
  const campo=(c)=>{
    const v=esc(r[c.chave]??"");
    const req=c.obrigatorio?` <span style="color:var(--err)">*</span>`:"";
    if(c.tipo==="longo") return `<label>${esc(c.rotulo)}${req}</label>

      <input type="number" min="0" id="enc-${c.chave}" value="${v}"></div>`;
    return `<div><label>${esc(c.rotulo)}${req}</label>
      <input id="enc-${c.chave}" value="${v}" placeholder="${esc(c.dica||"")}"></div>`;
  };
  const curtos=CAMPOS_REL.filter(c=>c.tipo!=="longo").map(campo).join("");
  cx.innerHTML=`<div class="ov-cx" style="max-width:720px">
    <h2>Encerrar o evento e entregar o relatório final</h2>
    <p class="muted" style="margin:0 0 4px">Encerrar é entregar: estes são os campos do relatório
      final da ação no ARCHÉ EX. A PROPPEX valida o encerramento e, com isso, os certificados de
      participantes, palestrantes e comissão passam a existir.</p>
    <div class="banner ba-info" style="margin:12px 0">
      <b>Números do sistema</b> — ${n.inscritos} inscrito(s), ${n.presentes} presente(s).
      Eles entram no relatório como estão agora: confira as presenças antes de encerrar.</div>
    <div id="enc-sugestao"></div>
    <div class="ov-2col">${curtos}</div>
    ${CAMPOS_REL.filter(c=>c.tipo==="longo").map(campo).join("")}
    <div class="sec-t" style="margin-top:16px">Registro fotográfico</div>
    <div class="muted" style="margin-bottom:6px">O relatório exige no mínimo ${MIN_FOTOS} fotos —
      é o que a PROPPEX arquiva e o avaliador pede para ver. Documentos (lista de presença,
      folder) podem ser anexados aqui também, e não contam para o mínimo.</div>
    <div id="enc-fotos"></div>
    <input type="file" id="enc-file" multiple accept="image/*,.pdf,.doc,.docx" style="margin-top:8px">
    <button class="bt bt-sec" style="margin-top:8px" onclick="subirAnexosEncerramento('${a.id}')">⬆ Anexar</button>
    <label style="margin-top:16px">Observação para a PROPPEX <span class="muted">(opcional)</span></label>
    <textarea id="enc-obs" style="min-height:60px"></textarea>
    <div class="ov-bt" style="margin-top:16px">
      <button class="bt bt-sec" onclick="cancelarEncerramento()">Cancelar</button>
      <button class="bt bt-pri" onclick="confirmarEncerramento('${a.id}')">Encerrar e entregar</button>
    </div>
  </div>`;
  document.body.appendChild(cx);
  pintarFotosEncerramento(id);
  preencherDoEvento(id);
  document.addEventListener("keydown",encTecla);
}
/* O rascunho que o sistema já sabe escrever: programação, palestrantes,
   comissão e contagens estão lançados aqui mesmo — pedir que o coordenador
   os copie à mão no encerramento seria trabalho perdido. Quem monta é o
   SERVIDOR (lib/relatorioEx.js), a mesma sugestão que o ARCHÉ EX aplica; só
   entra em campo vazio, e a avaliação/resultados nunca vem pronta. */
async function preencherDoEvento(id){
  let j;
  try{
    const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/relatorio-sugestao`);
    j=await r.json(); if(!r.ok) throw new Error("");
  }catch{ return; }
  const postos=[];
  for(const [k,v] of Object.entries(j.campos||{})){
    const el=$("enc-"+k); if(!el || String(el.value||"").trim()) continue;
    el.value=v; postos.push(k);
  }
  const cx=$("enc-sugestao");
  if(cx && postos.length) cx.innerHTML=`<div class="banner ba-ok" style="margin:0 0 12px">
    ✨ <b>${postos.length} campo(s) preenchidos com os dados do evento.</b> Confira antes de
    encerrar. A <b>avaliação / resultados</b> é a única que não se preenche sozinha — é o
    juízo de quem conduziu a ação.</div>`;
}

function piscarEncerrar(){
  const cx=$("ov-encerrar")?.querySelector(".ov-cx"); if(!cx) return;
  cx.classList.remove("ov-piscar"); void cx.offsetWidth; cx.classList.add("ov-piscar");
}
// algo digitado? então perguntar antes de perder
function encTemDados(){
  return CAMPOS_REL.some(c=>String($("enc-"+c.chave)?.value||"").trim())
    || String($("enc-obs")?.value||"").trim();
}
function cancelarEncerramento(){
  if(encTemDados() && !confirm("Descartar o encerramento deste evento?\n\n"
    +"O que você já preencheu do relatório será perdido — as fotos anexadas ficam.")) return;
  fecharEncerrar();
}
function encTecla(e){ if(e.key==="Escape") cancelarEncerramento(); }
function fecharEncerrar(){
  document.getElementById("ov-encerrar")?.remove();
  document.removeEventListener("keydown",encTecla);
}

function pintarFotosEncerramento(id){
  const a=ACOES.find(x=>x.id===id), cx=$("enc-fotos"); if(!cx) return;
  const anexos=a?.portfolio?.anexos||[], fotos=fotosDa(a).length;
  const falta=Math.max(0,MIN_FOTOS-fotos);
  cx.innerHTML=`<div class="banner ${falta?"ba-warn":"ba-ok"}" style="margin:0 0 8px">
      ${falta?`Faltam <b>${falta}</b> foto(s) — há ${fotos} de ${MIN_FOTOS}.`
             :`<b>${fotos}</b> foto(s) anexada(s) — o mínimo está cumprido.`}</div>
    ${anexos.length?`<div class="enc-anexos">${anexos.map((x,i)=>`
      <div class="enc-anexo">
        ${ehFotoAnexo(x)&&x.link?`<img src="${esc(x.link)}" alt="" loading="lazy">`
          :`<div class="sem">${ehFotoAnexo(x)?"🖼":"📎"}</div>`}
        <button class="rm" title="Remover este anexo"
          onclick="removerAnexoEncerramento('${esc(id)}','${esc(x.fileId||("i:"+i))}','${esc(x.name||x.nome||"")}')">✕</button>
        <div class="cap">${esc(x.name||x.nome||"anexo")}</div>
      </div>`).join("")}</div>`
      :`<div class="muted" style="font-size:12.5px">Nenhum arquivo anexado ainda.</div>`}`;
}

/* Os anexos usam a MESMA rota do portfólio do ARCHÉ EX (/api/extensao/anexo):
   é o mesmo portfólio da mesma ação — duas rotas gravariam duas listas. */
async function subirAnexosEncerramento(id){
  const inp=$("enc-file"), arqs=[...(inp?.files||[])];
  if(!arqs.length){ alert("Escolha os arquivos primeiro."); return; }
  const a=ACOES.find(x=>x.id===id);
  for(const f of arqs){
    const fd=new FormData(); fd.append("file", await reduzirFotoPortfolio(f)); fd.append("id",id);
    const r=await fetch("/api/extensao/anexo",{method:"POST",body:fd});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ alert(`Não foi possível anexar "${f.name}": ${j.error||r.status}`); break; }
    a.portfolio=a.portfolio||{}; a.portfolio.anexos=j.anexos||a.portfolio.anexos||[];
  }
  if(inp) inp.value="";
  pintarFotosEncerramento(id);
}

/* Apagar a foto que subiu errada (pedido do dono, ago/2026). A rota é
   PRÓPRIA — não se reescreve a ação inteira: aqui não há o formulário
   completo em mãos, e uma aba velha apagaria o que outra pessoa acabou de
   anexar. O arquivo continua no Drive da PROPPEX; o que sai é o registro. */
async function removerAnexoEncerramento(id,ref,nome){
  if(!confirm(`Remover "${nome||"este anexo"}" do relatório?\n\nO arquivo continua arquivado no Drive da PROPPEX — o que sai é a referência no relatório.`)) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/anexo/${encodeURIComponent(ref)}`
    +`?nome=${encodeURIComponent(nome||"")}`,{method:"DELETE"});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível remover."); return; }
  const a=ACOES.find(x=>x.id===id);
  if(a){ a.portfolio=a.portfolio||{}; a.portfolio.anexos=j.anexos||[]; }
  pintarFotosEncerramento(id);
}

async function confirmarEncerramento(id){
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  const relatorio={};
  for(const c of CAMPOS_REL) relatorio[c.chave]=($(`enc-${c.chave}`)?.value||"").trim();
  const falta=CAMPOS_REL.find(c=>c.obrigatorio&&!relatorio[c.chave]);
  if(falta){ alert(`Preencha “${falta.rotulo}” — é o que a PROPPEX lê no relatório.`);
    $(`enc-${falta.chave}`)?.focus(); return; }
  if(fotosDa(a).length<MIN_FOTOS){
    alert(`O relatório precisa de pelo menos ${MIN_FOTOS} fotos. Anexe as que faltam acima.`); return; }
  if(!confirm(`Encerrar "${a.proposta?.nomeAtividade||"este evento"}" e entregar o relatório final?\n\n`
    +"O relatório vai à PROPPEX junto com o pedido de encerramento. Validado, os certificados são liberados.")) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/evento/encerrar`,{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({observacao:($("enc-obs")?.value||"").trim(),relatorio})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível encerrar."); return; }
  fecharEncerrar();
  await carregar(); nav("certificados");
  alert("Evento encerrado e relatório final entregue.\n\nA PROPPEX foi avisada — os certificados "
    +"saem depois da validação, e o relatório já aparece na ação, no ARCHÉ EX.");
}

async function decidirEncerramento(id,decisao){
  const parecer = decisao==="devolvido"
    ? (prompt("O que precisa ser corrigido? (a coordenação vai ler)","")||"").trim()
    : (prompt("Observação da validação (opcional)","")||"").trim();
  if(decisao==="devolvido"&&parecer.length<10){ alert("Escreva o que precisa ser corrigido."); return; }
  if(decisao==="validado"&&!confirm("Validar o encerramento e LIBERAR os certificados deste evento?\n\n"
    +"Todos com direito a certificado — participantes, palestrantes e comissão — recebem um "
    +"e-mail avisando que o documento está pronto, com o link para baixá-lo.")) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/evento/encerramento`,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({decisao,parecer})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível registrar a decisão."); return; }
  await carregar(); nav("certificados");
  if(decisao!=="validado"){ alert("Encerramento devolvido à coordenação."); return; }
  const av=j.avisos||{};
  alert("Encerramento validado — os certificados estão liberados.\n\n"
    +`Avisos enviados: ${av.enviados||0} de ${av.previstos||0}`
    +(av.semEmail?`\n${av.semEmail} pessoa(s) sem e-mail no cadastro — essas não foram avisadas.`:""));
}

/* "Usar a minha" (pedido do dono, ago/2026): quem já enviou o PNG uma vez —
   no perfil ou noutro módulo — não o reenvia a cada evento. Só a PRÓPRIA
   assinatura se aproveita num clique; a de outra pessoa continua entrando
   pelo arquivo, por quem responde por ela. */
async function usarMinhaAssinatura(id, quem) {
  const nome = ($(`as-nome-${quem}`)||{}).value || "";
  const cargo = ($(`as-cargo-${quem}`)||{}).value || "";
  const r = await fetch(`/api/extensao/${encodeURIComponent(id)}/assinatura/minha`, { method:"POST",
    headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ quem, nome, cargo }) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) { alert(j.error || "Não foi possível usar a sua assinatura."); return; }
  await carregar(); nav("certificados");
}

async function enviarAssinatura(id,quem){
  const f=$("as-file-"+quem)?.files?.[0];
  const nome=($("as-nome-"+quem)?.value||"").trim();
  if(!nome){ alert("Informe o nome de quem assina — é ele que sai impresso."); return; }
  if(!f){ alert("Escolha o arquivo PNG da assinatura."); return; }
  const fd=new FormData();
  fd.append("file",f); fd.append("quem",quem); fd.append("nome",nome);
  fd.append("cargo",($("as-cargo-"+quem)?.value||"").trim());
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/assinatura`,{method:"POST",body:fd});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível salvar a assinatura."); return; }
  await carregar(); nav("certificados");
}

async function removerAssinatura(id,quem){
  if(!confirm("Remover esta assinatura do certificado?")) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/assinatura?quem=${quem}`,{method:"DELETE"});
  if(!r.ok){ alert("Não foi possível remover."); return; }
  await carregar(); nav("certificados");
}
</script>
