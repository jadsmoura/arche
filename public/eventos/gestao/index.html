     entrar procurando um documento que ainda não existia; "Encerrar evento"
     diz o que a coordenação vem fazer. Os certificados continuam aqui, e a
     chave da guia (`certificados`) não muda — é ela que os atalhos usam. */
  {k:"certificados", rot:"Encerrar evento", grupo:"PÓS-EVENTO", ic:IC.certificados, evento:true,
   tit:"Encerrar o evento e emitir os certificados",
   sub:"O encerramento entrega o relatório final da ação; validado pela PROPPEX, os certificados passam a existir — com as assinaturas configuradas aqui."},
];
/* A AÇÃO DE EXTENSÃO NÃO É UMA GUIA (pergunta do dono, ago/2026). Ela era uma
   tela inteira para dizer uma frase e oferecer um link — e ficava numa fase do
   evento, quando a ação-mãe não é fase nenhuma: ela nasce antes da proposta e
   sobrevive ao encerramento. O link continua, porque o encerramento não cobre
   tudo o que mora lá (o PDF do projeto e o do relatório, o Número da Ação, a
   curricularização, os cursos corealizadores, o portfólio e o registro pela
   PROPPEX), mas agora é o que sempre foi: uma SAÍDA do módulo, no pé da barra,
   separada das guias — e que abre a ação DESTE evento, não a lista inteira. */

function montarSidebar(){
  let grupo=null;
  $("menu").innerHTML = SECOES.map(s=>{
    const cab = (s.grupo && s.grupo!==grupo) ? `<div class="side-lab">${s.grupo}</div>` : "";
    grupo=s.grupo;
    return cab+`<button class="side-item" data-k="${s.k}" onclick="nav('${s.k}')">${icone(s.ic)}${s.rot}</button>`;
  }).join("");

  $("menu").insertAdjacentHTML("beforeend",
    `<a class="side-saida" id="side-acao" href="/extensao/" style="display:none">${icone(IC.acao)}Ação de extensão ↗</a>`);
  atualizarSaidaAcao();

  const p = ME?.perfil||{};
  const nome = p.tratamento || p.nome || (ME?.nome && ME.nome!==ME?.email ? ME.nome : (ME?.email||"—"));
  const papel = GESTAO_EX ? "Coordenação · PROPPEX" : GESTAO_EV ? "Coordenação de eventos" : "Operação dos meus eventos";
  const base = (p.nome || (ME?.email||"?").split("@")[0].replace(/[._-]/g," ")).trim().split(/\s+/);
  const sigla = ((base[0]||"?")[0] + ((base[1]||"")[0]||"")).toUpperCase();
  $("rodape-usuario").innerHTML = ME ? `
    <a class="av" href="/perfil/" title="Meu perfil">${p.foto?`<img src="${esc(p.foto)}" alt="">`:esc(sigla)}</a>
    <a href="/perfil/" style="line-height:1.3;min-width:0;text-decoration:none">
      <div class="nm">${esc(nome)}</div><div class="pp">${esc(papel)}</div></a>
    <button class="sair" onclick="sair()">sair</button>` : "";

  $("dir-info").textContent = GESTAO_EX ? "Você vê e opera todos os eventos"
    : GESTAO_EV ? "Você opera todos os eventos das ações de extensão"
    : (EU ? "Você opera os eventos das suas próprias ações" : "");
}

async function sair(){
  try{ await fetch("/auth/sair",{method:"POST"}); }catch{ /* ignora */ }
  location.href="/";
}

/* O seletor de evento da barra lateral: os eventos que a pessoa enxerga
   (nome + no ar/rascunho) e, num grupo à parte, as ações que ainda não têm
   o evento configurado. Trocar aqui troca o evento de TODAS as guias. */
function montarSeletor(){
  const bt=$("sel-evento"); if(!bt) return;
  const a=ABERTO?ACOES.find(x=>x.id===ABERTO):null;
  bt.textContent = a ? (a.proposta?.nomeAtividade||"(sem nome)") : "— escolher evento —";
  bt.title = a ? `${a.proposta?.nomeAtividade||""} · ${cursosEmTexto(a)}\nTrocar aqui troca o evento de todas as guias`
    : "Escolher o evento em gestão";
}

/* ======================================================================
   ESCOLHER O EVENTO (pedido do dono, ago/2026)

   A lista suspensa servia enquanto os eventos cabiam nela. Com o setor em
   uso, ela cresce todo semestre e vira rolagem — e o que a pessoa sabe do
   evento que procura não é a posição na lista: é o CURSO, o ANO e o nome.
   A janela pergunta por esses três, na ordem em que se lembra deles, e a
   lista responde a cada tecla. Sem filtro nenhum ela mostra tudo, então
   com poucos eventos o comportamento é o de antes.
   ====================================================================== */
let ESC={curso:"",ano:"",busca:""};

function abrirEscolherEvento(){
  const cx=document.createElement("div");
  cx.className="ov"; cx.id="ov-escolher";
  cx.onclick=(e)=>{ if(e.target===cx) fecharEscolher(); };
  const cursos=[...new Set(ACOES.filter(x=>x.evento).flatMap(cursosDaAcao))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const anos=anosDosEventos();
  cx.innerHTML=`<div class="ov-cx" style="max-width:600px">
    <h2>Escolher evento</h2>
    <p class="muted" style="margin:0">O evento escolhido vale para todas as guias do ARCHÉ EV.</p>
    <div class="esc-filtros">
      <select id="esc-curso" onchange="ESC.curso=this.value;pintarEscolher()">
        <option value="">Todos os cursos</option>
        ${cursos.map(c=>`<option value="${esc(c)}"${ESC.curso===c?" selected":""}>${esc(c)}</option>`).join("")}
      </select>
      <select id="esc-ano" onchange="ESC.ano=this.value;pintarEscolher()">
        <option value="">Todos os anos</option>
        ${anos.map(y=>`<option value="${esc(y)}"${ESC.ano===y?" selected":""}>${esc(y)}</option>`).join("")}
      </select>
    </div>
    <input id="esc-busca" placeholder="Buscar pelo nome do evento…" value="${esc(ESC.busca)}"
      oninput="ESC.busca=this.value;pintarEscolher()">
    <div class="esc-lista" id="esc-lista"></div>
    <div class="ov-bt" style="margin-top:14px"><button class="bt bt-sec" onclick="fecharEscolher()">Fechar</button></div>
  </div>`;
  document.body.appendChild(cx);
  pintarEscolher();
  setTimeout(()=>$("esc-busca")?.focus(),30);
  document.addEventListener("keydown",escTecla);
}
function escTecla(e){ if(e.key==="Escape") fecharEscolher(); }
function fecharEscolher(){
  document.getElementById("ov-escolher")?.remove();
  document.removeEventListener("keydown",escTecla);
}

function pintarEscolher(){
  const cx=$("esc-lista"); if(!cx) return;
  const norm=(t)=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const q=norm(ESC.busca);
  const cabe=(a)=>(!ESC.curso||acaoDoCurso(a,ESC.curso))
    && (!ESC.ano||anoDoEvento(a)===ESC.ano)
    && (!q||norm(a.proposta?.nomeAtividade).includes(q)||norm(a.numeroAcao).includes(q)||norm(a.curso).includes(q));
  const com=ACOES.filter(a=>a.evento&&cabe(a))
    .sort((x,z)=>String(z.proposta?.periodoInicio||"").localeCompare(String(x.proposta?.periodoInicio||"")));
  // ação sem evento não tem ano nem página: o filtro de ano não se aplica a ela
  const sem=ACOES.filter(a=>!a.evento&&!a.origemPapel
    &&(!ESC.curso||acaoDoCurso(a,ESC.curso))&&(!q||norm(a.proposta?.nomeAtividade).includes(q)));
  const per=(a)=>{
    const i=a.proposta?.periodoInicio,f=a.proposta?.periodoFim;
    return i?(f&&f!==i?`${fmt(i)} – ${fmt(f)}`:fmt(i)):"sem data";
  };
  const item=(a,extra)=>`<button class="esc-it${a.id===ABERTO?" on":""}" onclick="escolherEvento('${esc(a.id)}')">
    <div class="esc-n">${esc(a.proposta?.nomeAtividade||"(sem nome)")}</div>
    <div class="esc-m">${esc(cursosEmTexto(a)||"sem curso")} · ${per(a)}${extra||""}</div></button>`;
  cx.innerHTML = (com.length||sem.length)
    ? (com.length?`<div class="esc-lab">Eventos · ${com.length}</div>`
        +com.map(a=>item(a,` · ${a.evento.ativo?"página no ar":"rascunho"}`)).join(""):"")
      +(sem.length?`<div class="esc-lab">Ações sem evento — configurar · ${sem.length}</div>`
        +sem.map(a=>item(a,"")).join(""):"")
    : `<div class="esc-vazio">Nenhum evento com esses filtros.<br>
        <span style="font-size:12.5px">Tente limpar o curso, o ano ou a busca.</span></div>`;
}

function escolherEvento(id){ fecharEscolher(); trocarEvento(id); }

/* Trocar o evento em gestão — pelo seletor da barra ou por um card do
   Painel geral (as duas coisas são o MESMO ato). Numa guia de evento,
   fica-se nela, agora com o outro evento; do Painel geral, vai-se ao
   Início do evento escolhido. */
function trocarEvento(id, guia){
  if(!id){ ABERTO=null; clearInterval(EV_TIMER); montarSeletor(); nav("painel"); return; }
  if(!ACOES.some(a=>a.id===id)) return;
  ABERTO=id; EV_CAPA=undefined;
  montarSeletor();
  // com guia pedida, vai direto a ela (é o "Completar dados" do cartão);
  // senão fica na guia atual, se ela for de evento
  if(guia && SECOES.some(s=>s.k===guia)) return nav(guia);
  const meta=SECOES.find(s=>s.k===SECAO);
  nav(meta&&meta.evento?SECAO:"inicio");
}
const selecionar = (id, guia)=>trocarEvento(id, guia);

/* Deep-link: a URL guarda "#<guia>" ou "#<guia>/<id da ação>" — recarregar
   a página volta à mesma guia com o mesmo evento selecionado. O formato da
   tela anterior ("#e/<id>") segue aceito e vira "#inicio/<id>". */
/** A saída para a ação-mãe: aponta para ESTE evento, e some quando não há
    evento escolhido — um link para "a ação de qual evento?" não leva a lugar
    nenhum. Fica no pé da barra porque é saída, não guia. */
function atualizarSaidaAcao(){
  const el=$("side-acao"); if(!el) return;
  const a = ABERTO ? ACOES.find(x=>x.id===ABERTO) : null;
  el.style.display = a ? "flex" : "none";
  if(a){
    el.href = "/extensao/#acao/"+encodeURIComponent(a.id);
    el.title = "Abrir no ARCHÉ EX: "+(a.proposta?.nomeAtividade||"a ação deste evento")
      + (a.numeroAcao?" · "+a.numeroAcao:" · ainda sem número");
  }
}

function nav(secao){
  const meta = SECOES.find(s=>s.k===secao) || SECOES[0];
  SECAO = meta.k;
  clearInterval(EV_TIMER);
  document.querySelectorAll(".limite > section").forEach(s=>s.classList.add("hide"));
  document.querySelectorAll(".side-item").forEach(b=>b.classList.toggle("on", b.dataset.k===SECAO));
  $("titulo").textContent = meta.tit;
  $("subtitulo").textContent = meta.sub;
  $("crumb").textContent = meta.rot;
  const a = ABERTO ? ACOES.find(x=>x.id===ABERTO) : null;
  if(a===null && ABERTO){ ABERTO=null; montarSeletor(); }
  atualizarSaidaAcao();
  try{ history.replaceState(null,"","#"+SECAO+(meta.evento&&a?"/"+encodeURIComponent(a.id):"")); }catch{}
  const alvo=$("v-"+SECAO);

  if(meta.evento && !a){
    $("ev-contexto").innerHTML="";
    alvo.innerHTML=`<div class="card" style="text-align:center;padding:34px 20px">
      <div style="font-size:15px;font-weight:700;color:var(--ink)">Nenhum evento selecionado.</div>
      <div class="muted" style="margin:8px 0 16px">Escolha o evento em gestão no seletor da barra
        lateral ou num card do Painel geral.</div>
      <button class="bt bt-sec" onclick="nav('painel')">Ir ao Painel geral</button></div>`;
    alvo.classList.remove("hide");
    window.scrollTo(0,0); return;
  }

  $("ev-contexto").innerHTML = meta.evento ? contextoHtml(a) : "";
  if(SECAO==="painel") renderPainel();
  else if(SECAO==="inicio") renderInicio(a);
  else if(SECAO==="dados") renderDados(a);
  else if(SECAO==="inscritos") renderInscritos(a);
  else if(SECAO==="inscricoes") renderInscricoes(a);
  else if(SECAO==="pagina") renderPagina(a);
  else if(SECAO==="programacao") renderProgramacao(a);
  else if(SECAO==="blocos") renderBlocos(a);
  else if(SECAO==="equipe") renderEquipe(a);
  else if(SECAO==="trabalhos") renderTrabalhos(a);
  else if(SECAO==="credenciamento") renderCredenciamento(a);
  else if(SECAO==="transmissao") renderTransmissao(a);
  else if(SECAO==="cobranca") renderCobranca(a);
  else if(SECAO==="vouchers") renderVouchers(a);
  else if(SECAO==="financeiro") renderFinanceiro(a);
  else if(SECAO==="exportacoes") renderExportacoes(a);
  else if(SECAO==="editais") window.ArcheEditais?.montar($("v-editais"),{setores:["eventos"]});
  else if(SECAO==="certificados") renderCertificados(a);
  alvo.classList.remove("hide");
  if(meta.evento) agendarEvento(a.id);
  window.scrollTo(0,0);
}

/* faixa do evento em gestão, no topo das guias de evento */
function contextoHtml(a){
  const ev=a.evento||{}; const p=a.proposta||{};
  return `<div class="ctx">
    <span class="nm">${esc(p.nomeAtividade||"(sem nome)")}</span>
    <span class="meta">${esc(cursosEmTexto(a))}${a.numeroAcao?` · ${esc(a.numeroAcao)}`:" · ação ainda sem número"}${p.periodoInicio?` · ${fmt(p.periodoInicio)} – ${fmt(p.periodoFim)}`:""}</span>
    ${seloEtapa(a)}
    <span class="badge" style="background:${ev.ativo?"var(--ok-soft)":"#eceff3"};color:${ev.ativo?"var(--ok)":"var(--muted)"}">${ev.ativo?"publicado":"não publicado"}</span>
    <span class="acoes">
      <button class="lk" onclick="nav('painel')" title="Escolher outro evento">trocar</button>
      <button class="bt bt-ghost" style="padding:5px 10px;font-size:12px" onclick="atualizarEvento('${esc(a.id)}')" title="Recarregar inscritos e presenças">↻ Atualizar</button>
    </span>
  </div>`;
}

/* ============================ PAINEL GERAL ============================== */
function renderPainel(){
  const com=ACOES.filter(a=>a.evento);
  const noAr=com.filter(a=>a.evento.ativo===true);
  const totais=com.reduce((t,a)=>{ const n=numerosEventoLocal(a);
    t.insc+=n.inscritos; t.pres+=n.presentes; return t; },{insc:0,pres:0});
  const hoje=hojeISO();
  const proximos=com
    .filter(a=>String(a.proposta?.periodoFim||"")>=hoje)
    .sort((x,y)=>String(x.proposta?.periodoInicio||"").localeCompare(String(y.proposta?.periodoInicio||"")))
    .slice(0,5);

  $("v-painel").innerHTML=`
    <div class="stat" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="s"><b>${noAr.length}</b><span>Páginas publicadas</span></div>
      <div class="s"><b>${com.length-noAr.length}</b><span>Não publicadas</span></div>
      <div class="s"><b>${totais.insc}</b><span>Inscritos (todos)</span></div>
      <div class="s"><b style="color:var(--ok)">${totais.pres}</b><span>Presentes (todos)</span></div>
    </div>
    ${proximos.length?`<div class="card">
      <div class="sec-t">Próximos eventos</div>
      ${proximos.map(a=>`<div class="linha">
        <div class="txt">
          <div class="p1">${esc(a.proposta?.nomeAtividade||"(sem nome)")}</div>
          <div class="muted">${fmt(a.proposta?.periodoInicio)} – ${fmt(a.proposta?.periodoFim)} · ${esc(cursosEmTexto(a))} ·
            ${a.evento.ativo?"página no ar":"rascunho"} · ${numerosEventoLocal(a).inscritos} inscrito(s)</div>
        </div>
        <button class="bt bt-sec" style="padding:6px 12px;font-size:12.5px" onclick="selecionar('${esc(a.id)}')">Gerenciar →</button>
      </div>`).join("")}
    </div>`:""}
    <div class="ferramentas">
      <button class="bt bt-pri" style="white-space:nowrap" onclick="novoEvento()">＋ Cadastrar novo evento</button>
      <input id="l-busca" placeholder="Buscar evento por nome ou curso…" oninput="renderCardsPainel()">
      <select id="l-curso" onchange="renderCardsPainel()" title="Filtrar por curso">
        <option value="">Todos os cursos</option>
        ${cursosDosEventos().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}
      </select>
      <select id="l-ano" onchange="renderCardsPainel()" title="Filtrar por ano de realização">
        <option value="">Todos os anos</option>
        ${anosDosEventos().map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join("")}
      </select>
      <select id="l-etapa" onchange="renderCardsPainel()" title="Filtrar por situação">
        <option value="">Todas as situações</option>
        ${ETAPAS_EV.map(k=>`<option value="${k}">${esc(ETAPA_ROTULO_EV[k])}</option>`).join("")}
      </select>
      <span class="muted" id="l-total"></span>
    </div>
    <div id="ev-cards"></div>
    <div id="sem-evento"></div>`;
  renderCardsPainel();
}

/* O ANO do evento é o de REALIZAÇÃO (início): com o tempo a lista cresce, e
   quem procura pensa "os eventos de 2026", não no ciclo de encerramento que
   a Extensão usa para fechar exercício. Curso e ano saem dos próprios
   eventos — nada de catálogo à parte que envelhece. */
const anoDoEvento=(a)=>String(a?.proposta?.periodoInicio||a?.proposta?.periodoFim||"").slice(0,4);
const cursosDosEventos=()=>[...new Set(ACOES.filter(a=>a.evento).flatMap(cursosDaAcao))].sort((x,y)=>x.localeCompare(y,"pt-BR"));
const anosDosEventos=()=>[...new Set(ACOES.filter(a=>a.evento).map(anoDoEvento).filter(Boolean))].sort().reverse();

/* ------------------- A LISTA SE AGRUPA POR SITUAÇÃO ---------------------
   Pedido do dono (set/2026): "fui procurar eventos para aprovar e estavam
   misturados com eventos aprovados e encerrados". A lista era uma fileira
   só, ordenada por publicação e data — e a ETAPA de cada evento só se lia no
   selo, cartão a cartão. Agora é um bloco por etapa, na ORDEM DO PROCESSO
   (é a mesma régua e o mesmo desenho da lista de propostas do ARCHÉ EX):
   quem vem aprovar abre "Aguardando validação" e encontra só o que espera
   decisão. O que ESPERA alguém nasce aberto; encerrado e reprovada nascem
   fechados (são os que mais crescem). A escolha fica no navegador, e
   filtrando por situação o bloco que sobrou abre. A situação vem PRONTA do
   servidor (`a.situacao`, lib/situacao.js) — a tela não refaz a régua. */
const ETAPAS_EV = ["preenchimento","aguardando-validacao","validado","aguardando-encerramento",
  "encerramento-em-validacao","encerrado","reprovada"];
const ETAPA_ROTULO_EV = {preenchimento:"Em preenchimento","aguardando-validacao":"Aguardando validação",
  validado:"Validado / em andamento","aguardando-encerramento":"Aguardando encerramento",
  "encerramento-em-validacao":"Encerramento aguardando validação",
  encerrado:"Encerrado · certificados emitidos",reprovada:"Reprovada"};
const ETAPA_DICA_EV = {preenchimento:"o projeto ainda não foi completado ou enviado",
  "aguardando-validacao":"a PROPPEX ainda não aprovou — é aqui que se aprova",
  validado:"aprovados, com a página pronta ou no ar", "aguardando-encerramento":"o evento passou e ninguém encerrou",
  "encerramento-em-validacao":"o coordenador encerrou; falta a PROPPEX validar",
  encerrado:"ciclo fechado", reprovada:"fora do fluxo, por decisão"};
const ETAPA_FECHADA_EV = new Set(["encerrado","reprovada"]);
const chaveGrupoEv=(etapa)=>`arche-ev-grupo-${etapa}`;
function grupoAbertoEv(etapa,filtrando){
  if(filtrando) return true;
  let g=null; try{ g=localStorage.getItem(chaveGrupoEv(etapa)); }catch{ /* aba privada */ }
  return g===null ? !ETAPA_FECHADA_EV.has(etapa) : g==="1";
}
function alternarGrupoEv(etapa,el){
  try{ localStorage.setItem(chaveGrupoEv(etapa), el.open?"1":"0"); }catch{ /* aba privada */ }
}

function renderCardsPainel(){
  const q=($("l-busca")?.value||"").trim().toLowerCase();
  const fc=$("l-curso")?.value||"", fa=$("l-ano")?.value||"", fe=$("l-etapa")?.value||"";
  const etapaDe=(a)=>a.situacao?.etapa||"preenchimento";
  const bate=(a)=>(!q || String(a.proposta?.nomeAtividade||"").toLowerCase().includes(q)
      || cursosEmTexto(a).toLowerCase().includes(q))
    && (!fc || acaoDoCurso(a,fc)) && (!fa || anoDoEvento(a)===fa) && (!fe || etapaDe(a)===fe);
  const comEvento=ACOES.filter(a=>a.evento).filter(bate)
    .sort((x,y)=>Number(y.evento?.ativo===true)-Number(x.evento?.ativo===true)
      || String(y.proposta?.periodoInicio||"").localeCompare(String(x.proposta?.periodoInicio||"")));
  // o bloco "ações sem evento" segue só a busca: filtrar por ano esconderia
  // a ação recém-criada de quem quer configurá-la
  const semEvento=ACOES.filter(a=>!a.evento&&!a.origemPapel).filter(a=>!q
    || String(a.proposta?.nomeAtividade||"").toLowerCase().includes(q)
    || cursosEmTexto(a).toLowerCase().includes(q));
  const filtrando=!!(q||fc||fa||fe);
  if($("l-total")) $("l-total").textContent = comEvento.length
    ? `${comEvento.length} evento(s)${filtrando?" no filtro":""}` : "";

  // um bloco por etapa, na ordem do processo; etapa fora do catálogo (não
  // deve acontecer) entra no fim em vez de sumir
  const grupos={};
  for(const a of comEvento){ const e=etapaDe(a); (grupos[e]=grupos[e]||[]).push(a); }
  const ordem=ETAPAS_EV.filter(k=>grupos[k]);
  for(const k of Object.keys(grupos)) if(!ordem.includes(k)) ordem.push(k);
  const blocos=ordem.map(k=>{
    const itens=grupos[k];
    const [,cor]=CORES_ETAPA[k]||["","var(--brand-3)"];
    return `<details class="grupo"${grupoAbertoEv(k,!!fe)?" open":""} ontoggle="alternarGrupoEv('${k}',this)">
      <summary><span class="pt" style="background:${cor}"></span>
        ${esc(ETAPA_ROTULO_EV[k]||k)}
        ${ETAPA_DICA_EV[k]?`<span class="dica">— ${esc(ETAPA_DICA_EV[k])}</span>`:""}
        <span class="qt">${itens.length} ${itens.length===1?"evento":"eventos"}</span>
        <span class="seta">▼</span></summary>
      <div class="corpo">${itens.map(cardLista).join("")}</div>
    </details>`;
  }).join("");

  $("ev-cards").innerHTML = comEvento.length ? blocos :
    `<div class="card" style="text-align:center;padding:34px 20px">
      <div style="font-size:15px;font-weight:700;color:var(--ink)">${filtrando?"Nenhum evento encontrado com estes filtros.":"Nenhum evento ainda."}</div>
      <div class="muted" style="margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto">
        ${filtrando?"Limpe a busca, o curso, o ano ou a situação para ver os demais."
        :`Comece pelo botão <b>＋ Cadastrar novo evento</b> — ele registra a ação de
        extensão e já deixa o evento pronto para montar. Se preferir, a proposta
        completa também pode ser registrada no <a href="/extensao/">ARCHÉ EX</a>.`}</div>
      ${filtrando?"":`<button class="bt bt-pri" style="margin-top:14px" onclick="novoEvento()">＋ Cadastrar novo evento</button>`}
    </div>`;

  $("sem-evento").innerHTML = semEvento.length ? `
    <div class="card">
      <div class="sec-t">Ações sem evento</div>
      <div class="muted" style="margin-bottom:6px">Ações de extensão que você pode operar e que ainda
        não têm o evento configurado — dá para deixar tudo pronto antes mesmo da aprovação
        (só a ativação da página exige o Número da Ação).</div>
      ${semEvento.map(a=>`<div class="linha">
        <div class="txt">
          <div class="p1">${esc(a.proposta?.nomeAtividade||"(sem nome)")}</div>
          <div class="muted">${esc(cursosEmTexto(a))}${a.numeroAcao?` · ${esc(a.numeroAcao)}`:" · ainda sem número"}${a.proposta?.periodoInicio?` · ${fmt(a.proposta.periodoInicio)}–${fmt(a.proposta.periodoFim)}`:""}</div>
        </div>
        <button class="bt bt-sec" style="padding:7px 12px;font-size:12.5px" onclick="selecionar('${esc(a.id)}')">Configurar evento</button>
      </div>`).join("")}
    </div>` : "";
}

/* ------------------- cadastrar novo evento (fluxo único) ------------------
   O botão do Painel geral cria a AÇÃO DE EXTENSÃO com o essencial da
   proposta e já semeia a configuração do evento — a pessoa cai direto nas
   guias para montar programação, formulário e página. A proposta segue o
   caminho institucional de sempre: fila da PROPPEX no ARCHÉ EX (onde pode
   ser completada), e a página só ativa depois da aprovação. */
const CURSOS_EV = ["Administração","Agronomia","Ciências Contábeis","Direito","Educação Física",
  "Enfermagem","Engenharia Civil","Engenharia de Software","Engenharia Mecânica",
  "Medicina Veterinária","Odontologia","Psicologia","Institucional / PROPPEX"];
/* O catálogo vem do servidor (painel /curso/ do gestor, ago/2026): as telas
   do EV desenham sob demanda, então basta a lista estar atualizada. */
fetch("/api/cursos").then(r=>r.ok?r.json():null).then(j=>{
  if(j&&(j.cursos||[]).length)
    CURSOS_EV.splice(0,CURSOS_EV.length,...j.cursos.map(c=>c.nome),"Institucional / PROPPEX");
}).catch(()=>{});

/* ------------------- a ação de MAIS DE UM CURSO -------------------------
   Pedido de um professor (ago/2026): a jornada é de Engenharia Mecânica E
   de Engenharia Civil. Abrir duas ações para o mesmo evento partiria a
   proposta, o número da ação e a contagem de participantes ao meio — então
   o curso PRINCIPAL continua sendo um (é ele que nomeia a pasta no Drive) e
   os demais entram como CO-REALIZADORES. A régua é do servidor; aqui é a
   tela que a espelha. */
const MAX_EXTRAS = 4;
const chaveC = (v) => String(v??"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const cursosDaAcao = (a) => [a?.curso, ...(Array.isArray(a?.cursosExtras)?a.cursosExtras:[])]
  .map(c=>String(c??"").trim()).filter(Boolean);
const cursosEmTexto = (a) => { const c=cursosDaAcao(a);
  return c.length<=1 ? (c[0]||"") : c.slice(0,-1).join(", ")+" e "+c[c.length-1]; };
const acaoDoCurso = (a,curso) => { const k=chaveC(curso);
  return !!k && cursosDaAcao(a).some(c=>chaveC(c)===k); };
/** Os cursos ainda disponíveis para incluir (fora o principal e os já postos). */
const cursosLivres = (principal, postos) => CURSOS_EV.filter(c =>
  chaveC(c)!==chaveC(principal) && !(postos||[]).some(x=>chaveC(x)===chaveC(c)));

/**
 * O bloco "+ incluir outro curso", usado nos DOIS lugares em que se escolhe
 * curso — o assistente e a guia Dados do evento. `onMudar` recebe a lista
 * nova; quem chama decide onde guardá-la.
 */
function blocoCursosExtras(id, principal, extras, fnMudar, ro){
  const livres = cursosLivres(principal, extras);
  const linhas = (extras||[]).map((c,i)=>`
    <span class="ce-tag">${esc(c)}${ro?"":`
      <button type="button" class="rm" title="Retirar este curso"
        onclick="${fnMudar}(${i},null)">✕</button>`}</span>`).join("");
  return `<div class="ce" id="${id}">
    ${linhas||""}
    ${ro||!livres.length?"":`
      <select class="ce-add" onchange="${fnMudar}(-1,this.value);this.value=''">
        <option value="">+ incluir outro curso…</option>
        ${livres.map(c=>`<option>${esc(c)}</option>`).join("")}
      </select>`}
    ${extras&&extras.length?`<div class="ce-nota">Curso principal: <b>${esc(principal||"—")}</b> —
      é ele que responde pela ação e nomeia a pasta dos arquivos. Os demais constam como
      corealizadores${extras.length>=MAX_EXTRAS?" (limite atingido)":""}.</div>`:""}
  </div>`;
}

/* A régua da publicação da página — RÉPLICA de CAMPOS_PROJETO_EVENTO em
   lib/eventos.js, que é O DONO da régua (a SPA não importa módulos; ao mudar
   a lista lá, mude aqui também). É a mesma lista que a ativação confere no
   servidor: campo em falta = a página não publica. */
const CAMPOS_PROJETO_EV=[
  ["curso","curso"],
  ["nomeAtividade","nome do evento"],
  ["periodoInicio","data de início"],
  ["periodoFim","data de encerramento"],
  ["cargaHoraria","carga horária"],
  ["publicoAlvo","público-alvo"],
  ["local","local"],
  ["municipio","município"],
  ["justificativa","justificativa"],
  ["objetivoGeral","objetivo geral"],
  ["objetivosEspecificos","objetivos específicos"],
  ["metodologia","metodologia"],
  ["respNome","nome do responsável"],
  ["respCargo","cargo do responsável"],
  ["respTelefone","telefone do responsável"],
  ["respEmail","e-mail do responsável"],
];
const faltasProjetoEv=(a)=>{
  const p=a?.proposta||{};
  return CAMPOS_PROJETO_EV
    .filter(([c])=>!String((c==="curso"?a?.curso:p[c])||"").trim())
    .map(([,r])=>r);
};

/* O assistente pergunta POR ETAPAS (pedido do dono, ago/2026): título e
   curso; público e tema; datas e horários; revisão. Cada resposta fica em
   NE — voltar não perde nada — e a criação continua a mesma: a AÇÃO DE
   EXTENSÃO nasce submetida (fila da PROPPEX) e o evento é semeado em
   rascunho; o restante do projeto se completa na guia Dados do evento. */
let NE=null;
function novoEvento(){
  NE={passo:1, nome:"", curso:CURSOS_EV[0], cursosExtras:[], publico:"", tema:"",
      inicio:"", fim:"", ch:"", municipio:"Goianésia/GO", controle:true, hotsite:true};
  const cx=document.createElement("div");
  cx.className="ov"; cx.id="ov-novo";
  // clicar fora NÃO descarta o cadastro (achado do dono, ago/2026): são 4
  // passos de digitação, e um clique ao lado jogava tudo fora. O fundo só
  // pisca a janela; sair é pelo Cancelar (que confirma se algo foi digitado).
  cx.onclick=(e)=>{ if(e.target===cx) piscarJanela(); };
  cx.innerHTML=`<div class="ov-cx" role="dialog" aria-modal="true" aria-label="Cadastrar novo evento" tabindex="-1"
    onkeydown="enterAvancaNE(event)"></div>`;
  document.body.appendChild(cx);
  document.addEventListener("keydown", escFechaNovo);
  renderPassoNE();
}
function escFechaNovo(e){ if(e.key==="Escape") cancelarNovo(); }
function piscarJanela(){
  const cx=$("ov-novo")?.querySelector(".ov-cx"); if(!cx) return;
  cx.classList.remove("ov-piscar"); void cx.offsetWidth; cx.classList.add("ov-piscar");
}
// algo digitado? então perguntar antes de perder
const novoTemDados=()=>!!NE && [NE.nome,NE.publico,NE.tema,NE.inicio,NE.fim,NE.ch]
  .some(v=>String(v||"").trim());
function cancelarNovo(){
  if(novoTemDados() && !confirm("Descartar o cadastro deste evento?\n\nO que você já preencheu será perdido.")) return;
  fecharNovo();
}
function fecharNovo(){ $("ov-novo")?.remove(); document.removeEventListener("keydown", escFechaNovo); NE=null; }
/* Enter avança a etapa (e, na revisão, cria) — menos em textarea e botão. */
function enterAvancaNE(e){
  if(e.key!=="Enter" || !NE) return;
  const t=e.target?.tagName;
  if(t==="TEXTAREA"||t==="BUTTON") return;
  e.preventDefault();
  if(NE.passo<4) nePasso(1); else criarNovoEvento();
}
function nePasso(d){
  if(d>0){
    const msg=$("ne-msg");
    if(NE.passo===1){
      if(!NE.nome.trim()) return msg.textContent="Dê um nome ao evento.";
      if(!NE.curso) return msg.textContent="Escolha o curso ou setor.";
    }
    if(NE.passo===3){
      if(!NE.inicio||!NE.fim) return msg.textContent="Informe o período do evento (início e encerramento).";
      if(NE.fim<NE.inicio) return msg.textContent="O encerramento não pode vir antes do início.";
    }
  }
  NE.passo=Math.min(4,Math.max(1,NE.passo+d));
  renderPassoNE();
}
function renderPassoNE(){
  const cx=document.querySelector("#ov-novo .ov-cx"); if(!cx||!NE) return;
  const TITULOS={1:"O evento",2:"Público e tema",3:"Datas e horários",4:"Revisão"};
  const passos=[1,2,3,4].map(n=>`<i class="${n<=NE.passo?"on":""}"></i>`).join("");
  const corpo =
    NE.passo===1 ? `
      <label for="ne-nome">Nome do evento *</label>
      <input id="ne-nome" maxlength="200" placeholder="Ex.: III Jornada de Solos do Cerrado"
        value="${esc(NE.nome)}" oninput="NE.nome=this.value">
      <label for="ne-curso">Curso / setor *</label>
      <select id="ne-curso" onchange="neTrocaCurso(this.value)">
        ${CURSOS_EV.map(c=>`<option${c===NE.curso?" selected":""}>${esc(c)}</option>`).join("")}</select>
      ${blocoCursosExtras("ne-ce", NE.curso, NE.cursosExtras, "neCurso")}`
    : NE.passo===2 ? `
      <label for="ne-publico">Público-alvo</label>
      <input id="ne-publico" maxlength="200" placeholder="Ex.: acadêmicos, professores e comunidade externa"
        value="${esc(NE.publico)}" oninput="NE.publico=this.value">
      <label for="ne-tema">Tema central / breve descrição</label>
      <textarea id="ne-tema" rows="3" maxlength="2000" oninput="NE.tema=this.value"
        placeholder="Sai na página pública do evento — dá para refinar depois.">${esc(NE.tema)}</textarea>`
    : NE.passo===3 ? `
      <div class="ov-2col">
        <div><label for="ne-inicio">Início *</label>
          <input id="ne-inicio" type="date" value="${esc(NE.inicio)}" oninput="NE.inicio=this.value"></div>
        <div><label for="ne-fim">Encerramento *</label>
          <input id="ne-fim" type="date" value="${esc(NE.fim)}" oninput="NE.fim=this.value"></div>
        <div><label for="ne-ch">Carga horária (h)</label>
          <input id="ne-ch" inputmode="numeric" placeholder="Ex.: 20" value="${esc(NE.ch)}" oninput="NE.ch=this.value"></div>
        <div><label for="ne-municipio">Município</label>
          <input id="ne-municipio" maxlength="120" value="${esc(NE.municipio)}" oninput="NE.municipio=this.value"></div>
      </div>
      <div class="tut" style="font-size:12.5px;margin-top:10px">🕒 <b>Horários e locais entram por
        atividade</b>, na guia <b>Programação</b> (decisão do dono, ago/2026): num evento eles
        variam de uma palestra para um minicurso, e é lá que cada um tem o seu horário, sala e
        vagas. O endereço geral do evento (o que sai no mapa da página pública) fica na guia
        <b>Página do evento</b>.</div>
      <label style="margin-top:14px">Este evento terá controle de frequência? *</label>
      <div class="wiz-op">
        <label class="op ${NE.controle?"on":""}" onclick="NE.controle=true;renderPassoNE()">
          <b>Sim — vamos credenciar</b>
          <span>Os participantes apresentam o QR na entrada. Ao montar a programação, cada atividade
            escolhe o modo: frequência única, início e fim, ou sem controle naquela atividade.</span></label>
        <label class="op ${NE.controle?"":"on"}" onclick="NE.controle=false;renderPassoNE()">
          <b>Não — a inscrição já vale como presença</b>
          <span>Ninguém para na porta e todos os inscritos contam 100% de frequência. Para evento
            grande e aberto, em que credenciar é inviável.</span></label>
      </div>
      <label style="margin-top:14px">Este evento terá página pública (hotsite)? *</label>
      <div class="wiz-op">
        <label class="op ${NE.hotsite?"on":""}" onclick="NE.hotsite=true;renderPassoNE()">
          <b>Sim — quero a página do evento</b>
          <span>Capa, programação por dia, palestrantes, local no mapa e os blocos que você montar.
            O evento aparece na vitrine pública de eventos.</span></label>
        <label class="op ${NE.hotsite?"":"on"}" onclick="NE.hotsite=false;renderPassoNE()">
          <b>Não — só a folha de inscrição</b>
          <span>Sem site: o endereço do evento abre apenas o formulário de inscrição, para o QR que
            você projeta na palestra. Fica fora da vitrine. Credenciamento, presenças e exportações
            funcionam igual.</span></label>
      </div>`
    : `
      <div class="wiz-rev">
        ${[["Evento",NE.nome],["Curso / setor",cursosEmTexto(NE)],["Público-alvo",NE.publico],
           ["Tema central",NE.tema],
           ["Período",NE.inicio?`${fmt(NE.inicio)} – ${fmt(NE.fim)}`:""],
           ["Carga horária",NE.ch?NE.ch+" h":""],["Município",NE.municipio],
           ["Frequência",NE.controle?"com credenciamento (por atividade)":"sem controle — inscrito conta presente"],
           ["Página pública",NE.hotsite?"hotsite completo":"só a folha de inscrição (sem site)"]]
          .map(([r,v])=>`<div class="li"><b>${r}</b><span>${esc(v)||'<span class="muted">—</span>'}</span></div>`).join("")}
      </div>
      <div class="tut" style="font-size:12.5px">
        Ao criar: <b>a ação de extensão será registrada</b> e segue a análise da PROPPEX;
        o restante do projeto (justificativa, objetivos, metodologia) se completa na guia
        <b>Dados do evento</b>; e a página pública só poderá ser <b>publicada com o projeto
        completo e a ação aprovada</b>.</div>`;

  cx.innerHTML=`
    <h2>Cadastrar novo evento</h2>
    <div class="wiz-topo">
      <span class="wiz-passo">Passo ${NE.passo} de 4</span>
      <span class="wiz-dots">${passos}</span>
    </div>
    <div class="wiz-t">${TITULOS[NE.passo]}</div>
    ${corpo}
    <div id="ne-msg" style="color:#c62828;font-size:13px;min-height:1.2em;margin-top:10px"></div>
    <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
      ${NE.passo>1?`<button class="bt bt-ghost" onclick="nePasso(-1)">‹ Voltar</button>`:""}
      ${NE.passo<4?`<button class="bt bt-pri" id="ne-bt" onclick="nePasso(1)">Avançar ›</button>`
                  :`<button class="bt bt-pri" id="ne-bt" onclick="criarNovoEvento()">Criar o evento</button>`}
      <button class="bt bt-sec" onclick="cancelarNovo()">Cancelar</button>
    </div>`;
  setTimeout(()=>{ (cx.querySelector("input,select,textarea")||cx).focus(); },50);
}

/* Trocar o curso PRINCIPAL tira-o dos corealizadores, se lá estiver — senão
   a ficha diria "Enfermagem e Enfermagem". */
function neTrocaCurso(v){
  NE.curso=v;
  NE.cursosExtras=(NE.cursosExtras||[]).filter(c=>chaveC(c)!==chaveC(v));
  renderPassoNE();
}
/** i>=0 remove aquele; i=-1 acrescenta o escolhido. */
function neCurso(i,valor){
  const l=[...(NE.cursosExtras||[])];
  if(i>=0) l.splice(i,1);
  else if(valor && l.length<MAX_EXTRAS && chaveC(valor)!==chaveC(NE.curso)
    && !l.some(c=>chaveC(c)===chaveC(valor))) l.push(valor);
  NE.cursosExtras=l;
  renderPassoNE();
}

async function criarNovoEvento(){
  const msg=$("ne-msg"), bt=$("ne-bt");
  const nome=NE.nome.trim(), inicio=NE.inicio, fim=NE.fim;
  if(!nome) return msg.textContent="Dê um nome ao evento.";
  if(!inicio||!fim) return msg.textContent="Informe o período do evento (início e encerramento).";
  if(fim<inicio) return msg.textContent="O encerramento não pode vir antes do início.";
  bt.disabled=true; msg.textContent="";
  try{
    const agora=new Date().toISOString();
    const p=ME?.perfil||{};
    const registro={
      id:"ext-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      numeroAcao:null, status:"submetida",
      curso:NE.curso, cursosExtras:NE.cursosExtras||[],
      criadoPor:EU, criadoPorNome:p.nome||ME?.nome||EU,
      criadoEm:agora, atualizadoEm:agora,
      proposta:{
        nomeAtividade:nome, classificacao:"Evento", departamento:cursosEmTexto(NE),
        temaCentral:NE.tema.trim(),
        periodoInicio:inicio, periodoFim:fim,
        // horário e local NÃO se pedem aqui: variam por atividade e entram na
        // guia Programação; o endereço geral fica na Página do evento
        cargaHoraria:NE.ch.trim(), publicoAlvo:NE.publico.trim(),
        municipio:NE.municipio.trim(),
        respNome:p.nome||ME?.nome||EU, respCargo:p.funcao==="professor"?"Professor(a)":"",
        respTelefone:p.telefone||"", respEmail:EU,
      },
      relatorio:{}, participantes:{inscritos:[],palestrantes:[],comissao:[]},
    };
    const r1=await fetch("/api/extensao",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({acoes:[registro]})});
    const j1=await r1.json().catch(()=>({}));
    if(!r1.ok||!j1.ok||!j1.gravadas) throw new Error(j1.error||"Não foi possível registrar a ação.");
    // semeia a configuração do evento (rascunho) — é o que o traz para o EV
    const r2=await fetch(`/api/extensao/${encodeURIComponent(registro.id)}/evento`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({descricao:NE.tema.trim(), controleFrequencia:NE.controle!==false,
        hotsite:NE.hotsite!==false})});
    if(!r2.ok) throw new Error((await r2.json().catch(()=>({}))).error||"A ação foi criada, mas a configuração do evento falhou — abra-a na lista.");
    fecharNovo();
    await carregar();
    // cai direto na guia Dados do evento, com as boas-vindas apontando o que falta
    ABERTO=registro.id; EV_CAPA=undefined; montarSeletor();
    DADOS_NOVO=true;
    nav("dados");
  }catch(e){ msg.textContent=e.message; bt.disabled=false; }
}

function cardLista(a){
  const ev=a.evento||{};
  const n=numerosEventoLocal(a);
  const p=a.proposta||{};
  const periodo=p.periodoInicio?`${fmt(p.periodoInicio)} – ${fmt(p.periodoFim)}`:"";
  const capa = ev.temCapa && ev.slug && ev.ativo
    ? `<img src="/api/publico/eventos/${encodeURIComponent(ev.slug)}/capa" alt="" onerror="this.remove()">` : "";
  const inicial=esc((p.nomeAtividade||"E").trim().charAt(0).toUpperCase());
  const tr=ev.transmissao||{};
  // DIV, não BUTTON: os atalhos de publicar/tirar do ar são botões, e HTML
  // não permite botão dentro de botão — o navegador desmontava o cartão
  return `<div class="evcard" role="button" tabindex="0" onclick="selecionar('${esc(a.id)}')"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selecionar('${esc(a.id)}')}">
    <div class="thumb">${capa||inicial}</div>
    <div class="corpo">
      <div class="nm">${esc(p.nomeAtividade||"(sem nome)")}</div>
      <div class="meta">${esc(a.curso||"")}${a.numeroAcao?` · ${esc(a.numeroAcao)}`:""}${periodo?` · ${periodo}`:""}</div>
      <div class="selos">
        ${seloEtapa(a)}
        <span class="badge" style="background:${ev.ativo?"var(--ok-soft)":"#eceff3"};color:${ev.ativo?"var(--ok)":"var(--muted)"}">${ev.ativo?"publicado":"não publicado"}</span>
        ${tr.publicada?'<span class="badge" style="background:var(--wash);color:var(--brand-3)">▶ transmissão publicada</span>':""}
      </div>
      <div class="nums">${n.inscritos} inscrito(s) · ${n.presentes} presente(s) · ${(ev.programacao||[]).length} atividade(s)</div>
      ${atalhosCard(a)}
    </div>
  </div>`;
}

/* ------------------------ o selo da ETAPA do processo ---------------------
   A situação vem PRONTA do servidor (lib/situacao.js, em `a.situacao`) e é a
   MESMA que o ARCHÉ EX desenha — são dois eixos: a ETAPA (em preenchimento ·
   aguardando validação · validado / em andamento · aguardando encerramento ·
   aguardando validação do encerramento · encerrado) e a PUBLICAÇÃO da página,
   que é decisão independente de quem organiza. Antes o cartão mostrava só a
   publicação ("página no ar" / "rascunho"), e por isso um evento validado e
   um sem projeto completo pareciam a mesma coisa aqui.                       */
const CORES_ETAPA = {
  preenchimento:["#fdf3e3","#a9701f"], "aguardando-validacao":["#e6f0f4","#2d6070"],
  validado:["#e6f4ec","#2f7a51"], "aguardando-encerramento":["#fdf3e3","#a9701f"],
  "encerramento-em-validacao":["#eceaf6","#5e5091"], encerrado:["#eceff3","#657179"],
};
function seloEtapa(a){
  const s = a.situacao; if(!s?.rotulo) return "";
  const [bg,fg] = CORES_ETAPA[s.etapa] || ["#eceff3","#657179"];
  return `<span class="badge" style="background:${bg};color:${fg}" title="${esc(s.detalhe||"")}">${esc(s.rotulo)}</span>`;
}

/* A gestão do evento acontece NO CARTÃO (decisão do dono, ago/2026): aprovar
   a ação e tirar a página do ar são os dois atos mais frequentes da
   coordenação, e estavam espalhados — a aprovação num setor à parte (o ARCHÉ
   EX) e a publicação numa guia interna. São dois botões, aqui: "Aprovar
   evento" (emite o Número da Ação) e "Despublicar evento".

   O Número da Ação NÃO se digita: ele sai da sequência oficial da Extensão,
   no servidor — por ano, na ordem em que as ações são aprovadas.

   Quem APROVA é a gestão da Extensão (é ato do setor que numera o processo);
   quem PUBLICA é quem opera o evento. O botão diz o que falta quando não dá
   para publicar, e quem recusa de verdade é o servidor.
   `stopPropagation` porque o cartão inteiro abre o evento. */
function atalhosCard(a){
  const ev=a.evento||{};
  const bt=(rot,fn,tit,cls)=>`<button class="bt ${cls||"bt-sec"}" style="padding:6px 12px;font-size:12.5px"
    title="${esc(tit)}" onclick="event.stopPropagation();${fn}">${rot}</button>`;
  const linha=(x)=>`<div class="card-atalhos" onclick="event.stopPropagation()">${x}</div>`;
  // excluir é o desfazer do cadastro errado: aparece em todos os estados,
  // porque o engano pode ser notado a qualquer momento
  const btExcluir = podeExcluir(a)
    ? bt("🗑 Excluir","excluirEvento('"+esc(a.id)+"')","Apaga este evento — não há como desfazer","bt-err")
    : "";
  /* ENCERRAR o evento no cartão (pedido do dono, ago/2026): é o ato que
     libera os certificados, e o coordenador não tem por que caçá-lo dentro
     de uma guia. Aparece depois do último dia e some quando já foi feito;
     para a gestão, o cartão mostra o pedido que espera decisão. */
  const st=(ev.encerramento||{}).status||"aberto";
  const acabou = a.proposta?.periodoFim && hojeISO() >= a.proposta.periodoFim;
  const btEncerrar = (a.numeroAcao && acabou && (st==="aberto"||st==="devolvido"))
    ? bt("🏁 Encerrar evento",`encerrarEvento('${esc(a.id)}')`,
        "Encerra o evento e envia à PROPPEX — validado, libera os certificados","bt-pri")
    : st==="solicitado"
      ? (GESTAO_EX
          ? bt("✓ Validar encerramento",`selecionar('${esc(a.id)}','certificados')`,
              "A coordenação encerrou; validar libera os certificados","bt-pri")
          : `<span class="muted" style="font-size:12px">🏁 encerrado — aguardando a PROPPEX</span>`)
      : st==="validado"
        ? bt("🎓 Certificados",`selecionar('${esc(a.id)}','certificados')`,"Evento encerrado e validado — emitir certificados")
        : "";
  if(ev.ativo){
    const link=ev.slug?location.origin+"/eventos/"+encodeURIComponent(ev.slug):"";
    return linha(
      bt("⏸ Despublicar evento",`publicarCard('${esc(a.id)}',false)`,"Recolhe a página pública; inscrições feitas continuam válidas")
      + (link?`<a class="bt bt-ghost" style="padding:6px 12px;font-size:12.5px" href="${esc(link)}"
          target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ ver a página</a>`:"")
      + btEncerrar + btExcluir);
  }
  if(!a.numeroAcao){
    /* Reprovada não tem aprovação a oferecer: o botão devolveria 400 sempre
       (revisão adversarial, ago/2026) — o cartão diz a decisão. */
    if(a.status==="reprovada")
      return linha(`<span class="muted" style="font-size:12px">✗ proposta reprovada pela PROPPEX
        — o registro fica arquivado</span>` + btExcluir);
    /* Aprovar o evento É VALIDAR O PROJETO (pedido do dono, ago/2026): o
       servidor recusa a aprovação com o projeto pela metade, e a tela diz
       isso ANTES do clique — botão que erra sempre é pior que botão ausente. */
    const pendentes=faltasProjetoEv(a);
    return linha((pendentes.length
      ? `<span class="muted" style="font-size:12px">📝 o projeto ainda está incompleto (${pendentes.length} campo(s))</span>`
        + bt("Completar o projeto",`selecionar('${esc(a.id)}','dados')`,
            "Abrir a guia Dados do evento: "+pendentes.join(", "))
      : GESTAO_EX
        ? bt("✓ Validar evento e projeto",`aprovarCard('${esc(a.id)}')`,
            "Valida a ação de extensão e emite o Número da Ação — o projeto é validado no mesmo ato","bt-pri")
        : `<span class="muted" style="font-size:12px">⏳ projeto completo — aguardando a validação da PROPPEX</span>`)
      + btExcluir);
  }
  const faltas=faltasProjetoEv(a);
  if(faltas.length)
    return linha(`<span class="muted" style="font-size:12px">📝 faltam ${faltas.length} campo(s) do projeto</span>`
      + bt("Completar dados",`selecionar('${esc(a.id)}','dados')`,"Abrir a guia Dados do evento: "+faltas.join(", "))
      + btEncerrar + btExcluir);
  return linha(bt("✓ Publicar evento",`publicarCard('${esc(a.id)}',true)`,
    "Coloca a página pública no ar e abre as inscrições","bt-pri") + btEncerrar + btExcluir);
}

/* EXCLUIR o evento (pedido do dono, ago/2026): cadastro errado precisa de
   desfazer, e até aqui só havia "despublicar" — que esconde a página e deixa
   o registro. A regra de QUEM pode e de O QUE some é do servidor; a tela
   antecipa as duas coisas para a confirmação dizer a verdade.

   Ação já aprovada não some: o Número da Ação vem da sequência oficial, e
   apagá-la abriria buraco na numeração e sumiria com a proposta do professor.
   Nesse caso o que se apaga é o EVENTO — página, programação e inscritos —,
   e a ação continua no ARCHÉ EX. */
const podeExcluir = (a) => GESTAO_EX || (!a.numeroAcao && ehMinha(a));
const ehMinha = (a) => !!EU && (a.criadoPor === EU || a.proposta?.respEmail === EU);

async function excluirEvento(id){
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  const nome=(a.proposta?.nomeAtividade||"").trim() || "(sem nome)";
  const n=numerosEventoLocal(a);
  const soOEvento = !!a.numeroAcao || !!a.relatorio?.entregueEm;
  const oQue = soOEvento
    ? `Isto apaga o EVENTO de "${nome}": a página pública, a programação, as atividades, `
      + `os inscritos e as presenças.\n\nA ação de extensão ${a.numeroAcao||""} CONTINUA no ARCHÉ EX, `
      + `com a proposta e o relatório — o número da ação não se apaga.`
    : `Isto apaga "${nome}" INTEIRO: a ação de extensão, a proposta, a página e tudo o que `
      + `foi cadastrado nela.`;
  const perdas = [];
  if(n.inscritos) perdas.push(`${n.inscritos} inscrito(s)`);
  if(n.presentes) perdas.push(`${n.presentes} presença(s) registrada(s)`);
  if((a.evento?.programacao||[]).length) perdas.push(`${a.evento.programacao.length} atividade(s)`);
  if(!confirm(`Excluir "${nome}"?\n\n${oQue}`
    + (perdas.length?`\n\nSerão apagados: ${perdas.join(", ")}.`:"")
    + `\n\n⚠ ESTA AÇÃO É IRREVERSÍVEL — não há como desfazer nem recuperar depois.`)) return;

  // com inscritos, a segunda confirmação é digitar o nome: é o que separa o
  // clique errado da decisão de apagar o cadastro de quem se inscreveu
  let confirmacao="";
  if(n.inscritos){
    confirmacao = prompt(`Última confirmação.\n\nEste evento tem ${n.inscritos} inscrito(s), `
      + `e os dados deles serão apagados.\n\nDigite o nome exato do evento para excluir:\n${nome}`) || "";
    if(confirmacao.trim()!==nome) { if(confirmacao) alert("O nome não confere — nada foi excluído."); return; }
  }
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/excluir`,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({confirmacao:confirmacao.trim()})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível excluir agora."); return; }
  if(ABERTO===id) ABERTO=null;   // o evento em gestão deixou de existir
  await carregar(); montarSeletor();
  nav("painel");
  alert(j.alcance==="evento"
    ? `Evento excluído. A ação ${j.numeroAcao||""} continua no ARCHÉ EX.`
    : `"${j.nome}" foi excluído.`);
}

/* Aprovar a ação daqui: o número é emitido pelo servidor, na sequência
   oficial da Extensão — a tela nunca o inventa nem o pede à gestão. */
async function aprovarCard(id){
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  const nome=a.proposta?.nomeAtividade||"este evento";
  if(!confirm(`Aprovar "${nome}" e emitir o Número da Ação?\n\nA ação de extensão passa a APROVADA e a página do evento fica liberada para publicação.`)) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/aprovar`,{method:"POST"});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível aprovar agora."); return; }
  await carregar(); montarSeletor(); nav(SECAO);
  alert(`✅ Evento aprovado!\nNúmero da Ação: ${j.numeroAcao}`);
}

async function publicarCard(id,ativo){
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  const nome=a.proposta?.nomeAtividade||"este evento";
  if(!confirm(ativo
    ? `Publicar a página de "${nome}"?\n\nA página fica pública e as inscrições abrem.`
    : `Despublicar "${nome}"?\n\nA página deixa de ser pública. As inscrições já feitas continuam válidas e o credenciamento segue funcionando.`)) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/evento`,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({ativo})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível concluir agora."); return; }
  await carregar(); montarSeletor(); nav(SECAO);
}

/** Abre a ação DESTE evento no ARCHÉ EX — o mesmo deep-link da saída da barra. */
function abrirAcaoNoEx(id){ window.open("/extensao/#acao/"+encodeURIComponent(id), "_blank", "noopener"); }

/* ---------------------- OS TRÊS DOCUMENTOS DO EVENTO ----------------------
   Pedido do dono, ago/2026: "todo evento tem que ter três tipos de documentos:
   projeto, relatório e certificados". Eles existem, e nesta ordem — mas quem
   organiza o evento os via em dois setores e com dois vocabulários, e não
   sabia em qual degrau estava. Este trilho é o mapa: o que já existe, o que
   falta e o ato que produz cada um, sempre com o caminho para lá.

   Nenhum deles é criado à mão: cadastrar o evento CRIA o projeto; encerrar o
   evento ENTREGA o relatório final; validar o encerramento VALIDA o relatório
   e libera os certificados — um ato só, na PROPPEX.                          */
function trilhoDocumentos(a){
  const s=a.situacao||{}; const enc=(a.evento?.encerramento||{}).status||"aberto";
  const passo=(rot,estado,cor,txt,botao)=>`<div class="doc">
    <div class="doc-t">${rot}</div>
    <div class="doc-e" style="color:${cor}">${estado}</div>
    <div class="doc-d">${txt}</div>${botao||""}</div>`;
  const lk=(rot,fn)=>`<button class="lk" style="margin-top:6px" onclick="${fn}">${rot}</button>`;
  const proj = a.numeroAcao
    ? passo("1 · Projeto","validado","var(--ok)",`Ação ${esc(a.numeroAcao)} — validada pela PROPPEX.`,
        lk("ver o PDF do projeto",`abrirAcaoNoEx('${esc(a.id)}')`))
    : passo("1 · Projeto", s.etapa==="aguardando-validacao"?"aguardando validação":"em preenchimento",
        "var(--warn)", s.etapa==="aguardando-validacao"
          ? "O projeto está completo — a PROPPEX valida e emite o Número da Ação."
          : "Cadastrar o evento já criou o projeto; complete os campos que faltam.",
        lk("Dados do evento","nav('dados')"));
  const rel = a.relatorio?.entregueEm
    ? passo("2 · Relatório final", enc==="validado"?"validado e encerrado":"entregue, aguardando validação",
        enc==="validado"?"var(--ok)":"var(--roxo)",
        enc==="validado" ? "A PROPPEX validou o encerramento — o relatório está encerrado."
          : "Encerrar o evento entregou o relatório final na Extensão.",
        lk("ver o relatório",`abrirAcaoNoEx('${esc(a.id)}')`))
    : passo("2 · Relatório final","a entregar","var(--muted)",
        "Ele nasce do <b>encerramento</b>: os campos e as fotos são pedidos ali.",
        lk("Encerrar evento","nav('certificados')"));
  const cert = enc==="validado"
    ? passo("3 · Certificados","emitidos","var(--ok)",
        "Participantes, palestrantes e comissão já podem baixar.", lk("emitir / baixar","nav('certificados')"))
    : passo("3 · Certificados","bloqueados","var(--muted)",
        "Saem quando a PROPPEX validar o encerramento — e é o mesmo ato que encerra o relatório final.","");
  return `<div class="card"><div class="sec-t">Os três documentos deste evento</div>
    <div class="muted" style="margin-top:8px">Projeto, relatório final e certificados — o ARCHÉ cria os
    três a partir do próprio evento: cadastrar faz o projeto, encerrar entrega o relatório e a validação
    da PROPPEX encerra o relatório e libera os certificados, num ato só.</div>
    <div class="docs">${proj}${rel}${cert}</div></div>`;
}

/* ========================= GESTÃO · INÍCIO ============================== */
function renderInicio(a){
  const ev=a.evento||{};
  const n=numerosEventoLocal(a);
  const tr=ev.transmissao||{};
  const link=ev.slug?location.origin+"/eventos/"+encodeURIComponent(ev.slug):"";
  const vagasTxt=Number(ev.vagas)>0?`${Math.max(0,Number(ev.vagas)-n.inscritos)} de ${ev.vagas}`:"ilimitadas";

  // pendências: o que espera um ato da coordenação
  const pend=[];
  // reprovada não espera aprovação: oferecer o botão seria uma porta que o
  // servidor sempre recusa (revisão adversarial, ago/2026)
  if(a.status==="reprovada") pend.push(`✗ <b>A proposta desta ação foi reprovada pela PROPPEX</b>${
    a.motivoReprovacao?` — motivo: ${esc(a.motivoReprovacao)}`:""}. O evento não vai ao ar; o registro
    fica arquivado. Uma nova atividade entra como nova proposta, no ARCHÉ EX.`);
  else if(!a.numeroAcao) pend.push(`⏳ <b>A ativação da página depende da aprovação da ação</b> — o evento
    já pode ficar todo configurado (inscrições, página, programação e transmissão), mas só vai ao ar
    depois do Número da Ação. ${GESTAO_EX
      ? `<button class="lk" onclick="aprovarCard('${esc(a.id)}')">Aprovar evento agora</button>`
      : "A aprovação é da gestão da Extensão."}`);
  const faltasProj=faltasProjetoEv(a);
  if(faltasProj.length) pend.push(`<b>Projeto do evento incompleto para publicação</b> — falta:
    ${esc(faltasProj.join(", "))}. Complete na guia
    <button class="lk" onclick="nav('dados')">Dados do evento</button>.`);
  if(a.numeroAcao && !ev.ativo) pend.push(`A página pública ainda <b>não está publicada</b> — publicar é
    decisão sua, e independe da validação: publique na guia
    <button class="lk" onclick="nav('pagina')">Página do evento</button>.`);
  if(ev.ativo && !(ev.programacao||[]).length) pend.push(`A página está no ar <b>sem programação</b> —
    monte as atividades na guia <button class="lk" onclick="nav('programacao')">Programação</button>.`);
  if(ev.ativo && ev.inscricoesAte && ev.inscricoesAte<hojeISO()) pend.push(`O prazo de inscrição
    (${fmt(ev.inscricoesAte)}) já passou — a página segue no ar, mas sem inscrição nova.`);

  $("v-inicio").innerHTML=`
    ${trilhoDocumentos(a)}
    ${pend.map(t=>`<div class="banner ${t.startsWith("⏳")?"ba-warn":"ba-info"}">${t}</div>`).join("")}
    <div class="stat" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      <div class="s"><b id="ev-cnt-insc">${n.inscritos}</b><span>Inscritos</span></div>
      <div class="s"><b id="ev-cnt-pres" style="color:var(--ok)">${n.presentes}</b><span>Presentes (credenciados)</span></div>
      <div class="s"><b id="ev-cnt-vagas">${vagasTxt}</b><span>Vagas restantes</span></div>
      <div class="s"><b>${(ev.programacao||[]).length}</b><span>Atividades</span></div>
      <div class="s"><b>${n.comentariosMural}</b><span>Mensagens no mural</span></div>
    </div>

    <div class="card">
      <div class="sec-t">Situação</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px">
        ${seloEtapa(a)}
        <span class="badge" style="background:${ev.ativo?"var(--ok-soft)":"#eceff3"};color:${ev.ativo?"var(--ok)":"var(--muted)"}">${ev.ativo?"página publicada":"página não publicada"}</span>
        <span class="badge" style="background:${tr.publicada?"var(--wash)":"#eceff3"};color:${tr.publicada?"var(--brand-3)":"var(--muted)"}">${tr.publicada?"▶ transmissão publicada":"transmissão não publicada"}</span>
      </div>
      ${link&&ev.ativo?`<div class="banner ba-info" style="margin:12px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <b>Link público:</b>
        <a href="${esc(link)}" target="_blank" rel="noopener" style="word-break:break-all">${esc(link)}</a>
        <button class="bt bt-sec" style="padding:5px 10px;font-size:12px" onclick="copiarTexto('${esc(link)}',this)">⧉ copiar</button>
      </div>`:""}
      <div class="muted" style="margin-top:12px">Página pública de inscrição gratuita, credenciamento
        por QR na entrada (geral e por atividade) e transmissão online. Os <b>certificados são emitidos
        pelo próprio ARCHÉ</b>, na guia Encerrar evento, depois que a PROPPEX validar o encerramento; a
        planilha da AEE continua nas Exportações para quem precisar dela.</div>
    </div>

    <div class="card">
      <div class="sec-t">Atalhos do evento</div>
      <div class="exp">
        <button class="bt bt-sec" onclick="nav('inscricoes')">Inscrições</button>
        <button class="bt bt-sec" onclick="nav('pagina')">Página do evento</button>
        <button class="bt bt-sec" onclick="nav('programacao')">Programação</button>
        <button class="bt bt-sec" onclick="nav('inscritos')">Inscritos e presenças</button>
        <button class="bt bt-sec" onclick="nav('credenciamento')">Credenciamento</button>
        <button class="bt bt-sec" onclick="nav('transmissao')">Transmissão e mural</button>
        <button class="bt bt-sec" onclick="nav('exportacoes')">Exportações</button>
      </div>
    </div>`;
}

/* ====================== GESTÃO · DADOS DO EVENTO ========================
   O PROJETO DE EVENTO da Extensão — a proposta da ação, editável aqui para
   quem cria pelo assistente não precisar ir ao ARCHÉ EX completar. Os
   obrigatórios (a régua de CAMPOS_PROJETO_EV, a mesma do servidor) saem
   marcados com * e realçados quando vazios; o sumário do topo diz o que
   ainda falta para a página poder ser publicada.

   PERMISSÃO: a gravação é pelo POST /api/extensao em bloco, e o servidor só
   aceita do DONO da ação e da gestão da Extensão — o coordenador só do
   módulo `eventos` opera o evento, mas a proposta não é dele: para ele a
   guia é somente-leitura. */
let DD=null, DADOS_NOVO=false;
const DD_CAMPOS=["nomeAtividade","temaCentral","periodoInicio","periodoFim","cargaHoraria",
  "publicoAlvo","local","municipio","justificativa","objetivoGeral","objetivosEspecificos",
  "metodologia","programacao","certificacaoSolicitada","parceria","recursoInstalacao",
  "recursoMultimidia","recursoOutros","comissaoTexto","respNome","respCargo","respTelefone","respEmail"];
const DD_OBRIGATORIOS=new Set(CAMPOS_PROJETO_EV.map(([c])=>c));

function soLeituraDados(a){
  const eu=String(EU||"").toLowerCase();
  return GESTAO_EV && !GESTAO_EX
    && String(a.criadoPor||"").toLowerCase()!==eu
    && String(a.proposta?.respEmail||"").toLowerCase()!==eu;
}

function renderDados(a){
  const p=a.proposta||{};
  const ro=soLeituraDados(a);
  DD={curso:a.curso||"", cursosExtras:[...(a.cursosExtras||[])]};
  for(const c of DD_CAMPOS) DD[c]=p[c]||"";
  const boasVindas=DADOS_NOVO; DADOS_NOVO=false;
  const dis=ro?" disabled":"";
  // um campo do formulário: rótulo (com * nos obrigatórios), input/textarea,
  // realce .falta quando obrigatório vazio — atualizado a cada tecla
  const campo=(c,rotulo,{area=false,tipo="text",ph="",dica=""}={})=>{

function ddMudou(el){
  if(!DD) return;
  const c=el.dataset.campo;
  DD[c]=el.value;
  // trocar o principal tira-o dos corealizadores — senão a ficha diria
  // "Enfermagem e Enfermagem"
  if(c==="curso"){
    DD.cursosExtras=(DD.cursosExtras||[]).filter(x=>chaveC(x)!==chaveC(el.value));
    ddPintarExtras();
  }
  if(c==="curso"||DD_OBRIGATORIOS.has(c)) el.classList.toggle("falta", !String(el.value).trim());
  ddResumoFaltas();
}
/* Só o bloco dos cursos se redesenha: redesenhar a guia inteira tiraria o
   cursor de quem está no meio da justificativa. */
function ddPintarExtras(){
  const el=$("dd-ce"); if(!el||!DD) return;
  el.outerHTML=blocoCursosExtras("dd-ce", DD.curso, DD.cursosExtras, "ddCurso", soLeituraDados(ACOES.find(x=>x.id===ABERTO)||{}));
}
/** i>=0 remove aquele; i=-1 acrescenta o escolhido. */
function ddCurso(i,valor){
  if(!DD) return;
  const l=[...(DD.cursosExtras||[])];
  if(i>=0) l.splice(i,1);
  else if(valor && l.length<MAX_EXTRAS && chaveC(valor)!==chaveC(DD.curso)
    && !l.some(c=>chaveC(c)===chaveC(valor))) l.push(valor);
  DD.cursosExtras=l;
  ddPintarExtras();
}
/* O sumário do topo: o que ainda falta para a publicação — some quando completo. */
function ddResumoFaltas(){
  const el=$("dd-faltas"); if(!el||!DD) return;
  const faltas=faltasProjetoEv({curso:DD.curso, proposta:DD});
  el.innerHTML=faltas.length
    ? `<div class="banner ba-warn"><b>Faltam para a publicação:</b> ${esc(faltas.join(", "))}.
       Os campos estão marcados com * e realçados abaixo.</div>`
    : `<div class="banner ba-info" style="background:var(--ok-soft);color:var(--ok);border-color:#cfeeda">
       ✓ Projeto completo — a página pode ser publicada (com a ação aprovada).</div>`;
}

/* Grava a proposta pelo POST /api/extensao em bloco — a ação INTEIRA como
   está carregada, com a proposta editada por cima. O servidor preserva
   evento e inscritos pela mescla, e número/situação/apreciação são da
   gestão (aqui vão os valores já gravados, por clareza). */
async function salvarDados(id){
  const a=ACOES.find(x=>x.id===id); if(!a||!DD) return;
  const msg=$("dd-msg"); if(msg) msg.textContent="Salvando…";
  const proposta={...(a.proposta||{})};
  for(const c of DD_CAMPOS) proposta[c]=String(DD[c]??"").trim();
  const final={...a, curso:String(DD.curso||"").trim(), cursosExtras:[...(DD.cursosExtras||[])],
    numeroAcao:a.numeroAcao??null, status:a.status, apreciacao:a.apreciacao,
    proposta, atualizadoEm:new Date().toISOString()};
  try{
    const r=await fetch("/api/extensao",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({acoes:[final]})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok) throw new Error(j.error||r.status);
    if(!j.gravadas) throw new Error("a gravação foi recusada — os dados do projeto são do responsável pela ação e da gestão da Extensão.");
    await carregar(); montarSeletor(); nav("dados");
    const m=$("dd-msg"); if(m){ m.textContent="✓ salvo"; setTimeout(()=>{ if($("dd-msg")) $("dd-msg").textContent=""; },3000); }
  }catch(e){
    if($("dd-msg")) $("dd-msg").textContent="";
    alert("Não foi possível salvar os dados do evento: "+e.message);
  }
}

/* PROGRAMAÇÃO ÚNICA (pedido do dono, ago/2026): nem todo evento tem uma
   grade — a reunião de práticas docentes, a palestra de uma tarde. Só que a
   carga horária do CERTIFICADO sai das atividades em que a pessoa teve
   presença; sem nenhuma atividade, ela cai na CH da ação inteira, e é daí
   que vinham as horas erradas. Um clique cria a atividade que espelha o
   próprio evento — mesmo nome, mesmas datas, mesmo local, mesma CH — e o
   evento passa a ter programação sem que ninguém precise montar uma.
   Ela nasce "geral": ninguém tem de marcá-la no formulário, e a etapa de
   escolha do credenciamento continua sendo pulada. */
function programacaoUnica(id){
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  const p=a.proposta||{};
  if(EV_PROG.length && !confirm(`Já há ${EV_PROG.length} atividade(s) na programação.\n\n`
    +"Acrescentar mesmo assim uma atividade única com os dados do evento?")) return;
  EV_PROG.push({ id:"", tipo:"palestra", titulo:p.nomeAtividade||"Atividade do evento",
    descricao:"", dia:p.periodoInicio||"", horaInicio:"", horaFim:"",
    local:p.local||"", responsavel:p.respNome||"", vagas:0, ch:String(p.cargaHoraria||""),
    inscricao:"geral", modalidade:"presencial", temFoto:false,
    instituicao:"", miniBio:"", frequencia:"entrada" });
  renderProgEv();
  const cx=$("ev-prog"); cx?.lastElementChild?.scrollIntoView({behavior:"smooth",block:"center"});
}

/* A soma das atividades ao lado da CH declarada: quem esquecer de preencher
   a CH de uma atividade vê na hora, em vez de descobrir no certificado. A CH
   da AÇÃO continua mandando (é a que a PROPPEX aprovou) — isto é conferência,
   não substituição. */
function somaChHtml(a){
  const num=(v)=>{ const m=String(v??"").replace(",",".").match(/\d+(?:\.\d+)?/); 
    const n=m?Number(m[0]):NaN; return Number.isFinite(n)&&n>0?n:0; };
  const decl=num(a.proposta?.cargaHoraria);
  if(!EV_PROG.length) return decl
    ? `Sem programação: o certificado usa a carga horária da ação (<b>${decl}h</b>). `
      +"Com atividades, ele soma as horas daquelas em que a pessoa teve presença."
    : "";
  const semCh=EV_PROG.filter(p=>!num(p.ch)).length;
  const soma=EV_PROG.reduce((s,p)=>s+num(p.ch),0);
  return `Soma das atividades: <b>${soma}h</b>${decl?` · carga horária da ação: <b>${decl}h</b>`:""}`
    +(semCh?` · <span style="color:var(--warn)">${semCh} atividade(s) sem carga horária</span>`:"")
    +(decl&&soma&&soma!==decl?` · <span style="color:var(--warn)">os dois números divergem</span>`:"");
}

/* PRESENÇA PELO TELÃO (decisão do dono, set/2026): na palestra grande o QR
   vai ao telão e é o participante quem registra a própria presença. O card
   lista as atividades marcadas com esse modo na Programação, abre a página
   de PROJEÇÃO (código rotativo, que se renova a cada janela) e gera o QR
   ESTÁTICO com hora de validade para o slide que ninguém atualiza. */
function cardTelao(a){
  const ev=a.evento||{};
  if(ev.controleFrequencia===false) return "";
  const dupla=(f)=>f==="entrada_saida"||f==="telao_entrada_saida";
  const atvs=(ev.programacao||[]).filter(p=>p&&p.id&&/^telao/.test(String(p.frequencia||"")));
  const quando=(p)=>[p.dia?p.dia.split("-").reverse().slice(0,2).join("/"):"",p.horaInicio?p.horaInicio+(p.horaFim?"–"+p.horaFim:""):""].filter(Boolean).join(" · ");
  // validade padrão do QR estático: o fim da atividade + 1 h, ou hoje às 23:00
  const validadePadrao=(p)=>{
    if(p.dia&&(p.horaFim||p.horaInicio)){
      const [h,mi]=(p.horaFim||p.horaInicio).split(":").map(Number);
      return `${p.dia}T${String(Math.min(23,h+1)).padStart(2,"0")}:${String(mi).padStart(2,"0")}`;
    }
    return new Date().toISOString().slice(0,10)+"T23:00";
  };
  return `<div class="card">
      <div class="sec-t">Presença pelo telão</div>
      <div class="muted" style="margin:8px 0">Na palestra grande, em vez de a equipe ler crachá por crachá, o QR vai ao
        <b>telão</b> e cada participante registra a própria presença pelo celular (CPF e e-mail da inscrição, ou a
        conta do portal). O modo se escolhe <b>por atividade</b>, na guia Programação — "telão, uma leitura" ou
        "telão, início e fim".</div>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:10px 0 4px">
        <div><label style="margin-top:0">Renovação do QR projetado <span class="muted">(segundos)</span></label>

        <button class="bt bt-sec" style="padding:8px 12px" onclick="salvarJanelaTelao('${esc(a.id)}')">💾 Salvar</button>
        <span class="muted" style="font-size:12px;max-width:420px;line-height:1.45">O código do telão troca sozinho nesse intervalo e o servidor aceita
          também o anterior — uma foto do telão vale no máximo o dobro disso. Padrão: 60 s.</span>
      </div>
      ${atvs.length?atvs.map((p,i)=>`
      <div style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between">
          <div><b>${esc(p.titulo)}</b> <span class="muted" style="font-size:12px">${esc(quando(p))} · ${dupla(p.frequencia)?"início e fim":"uma leitura"}</span></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <a class="bt bt-pri" style="padding:6px 12px;font-size:12.5px" target="_blank" rel="noopener"
              href="/eventos/${encodeURIComponent(ev.slug)}/telao/${encodeURIComponent(p.id)}?acao=${encodeURIComponent(a.id)}&fase=entrada">🖥 Projetar${dupla(p.frequencia)?" (entrada)":""}</a>
            ${dupla(p.frequencia)?`<a class="bt bt-sec" style="padding:6px 12px;font-size:12.5px" target="_blank" rel="noopener"
              href="/eventos/${encodeURIComponent(ev.slug)}/telao/${encodeURIComponent(p.id)}?acao=${encodeURIComponent(a.id)}&fase=saida">🖥 Projetar (saída)</a>`:""}
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:10px">
          <div><label style="margin-top:0;font-size:11px">QR estático para o slide — vale até</label>
            <input type="datetime-local" id="telao-ate-${i}" value="${esc(validadePadrao(p))}" style="max-width:220px"></div>
          ${dupla(p.frequencia)?`<div><label style="margin-top:0;font-size:11px">fase</label>
            <select id="telao-fase-${i}" style="width:auto;padding:8px 30px 8px 10px"><option value="entrada">entrada</option><option value="saida">saída</option></select></div>`:""}
          <button class="bt bt-ghost" style="padding:8px 12px" onclick="baixarQrTelao('${esc(a.id)}','${esc(p.id)}',${i})">⬇ Baixar o QR (PNG)</button>

          ele vale até a hora marcada e morre depois — quem fotografar e mandar adiante não registra nada fora dela.</div>
      </div>`).join("")
      :`<div class="cnt" style="margin-top:8px">— nenhuma atividade no modo telão. Na guia Programação, escolha "telão" na frequência da atividade que vai usar o QR projetado.</div>`}
    </div>`;
}
async function salvarJanelaTelao(id){
  const v=$("ev-telao-janela").value;
  try{
    const r=await fetch(`/api/extensao/${id}/evento`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({telaoJanela:v===""?"":Number(v)})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    await carregar(); nav(SECAO);
  }catch(e){ alert("Não foi possível salvar: "+e.message); }
}
function baixarQrTelao(id,aid,i){
  const ate=$(`telao-ate-${i}`).value;
  if(!ate){ alert("Informe até quando o QR estático vale."); return; }
  // a validade é lida no fuso de Brasília — é onde o telão está
  const iso=new Date(ate).toISOString();
  if(Date.parse(iso)<=Date.now()){ alert("A validade precisa estar no futuro."); return; }
  const fase=$(`telao-fase-${i}`)?$(`telao-fase-${i}`).value:"entrada";
  window.open(`/api/extensao/${encodeURIComponent(id)}/telao/${encodeURIComponent(aid)}/qr.png?estatico=${encodeURIComponent(iso)}&fase=${fase}&baixar`,"_blank");
}

    </head><body>
      <h1>${esc(nome||"Inscreva-se")}</h1>

      <code>${esc(url)}</code>

  w.document.close();
}

/* ==================== PRÉ-EVENTO · COBRANÇA (set/2026) =================== */
/* A configuração vive em `evento.cobranca` e passa pela régua do servidor
   (lib/pagamentos.js): a tela edita em reais, o servidor grava em centavos.
   O PREÇO que cada inscrito paga é SEMPRE calculado no servidor — a tela só
   mostra a tabela. */
let EV_COB=null;
const reaisDe=(c)=>(Math.round(Number(c)||0)/100).toFixed(2).replace(".",",");
const ROTULO_PG={aguardando:"aguardando",pago:"pago",isento:"isento",expirado:"expirado",recusado:"recusado",estornado:"estornado",contestado:"contestado"};
const COR_PG={pago:["var(--ok-soft)","var(--ok)"],isento:["var(--ok-soft)","var(--ok)"],aguardando:["var(--warn-soft)","var(--warn)"],
  recusado:["var(--err-soft)","var(--err)"],expirado:["#eceff3","var(--muted)"],estornado:["#eceff3","var(--muted)"],contestado:["var(--err-soft)","var(--err)"]};
const badgePg=(pg)=>{ if(!pg) return ""; const [bg,fg]=COR_PG[pg.status]||["#eceff3","var(--muted)"];
  return `<span class="badge" style="background:${bg};color:${fg}" title="${esc((pg.categoriaNome||"")+" · R$ "+reaisDe(pg.valor))}">${esc(ROTULO_PG[pg.status]||pg.status)}${pg.divergencia?" ⚠":""}</span>`; };

async function renderCobranca(a){
  const ev=a.evento||{};
  const c=ev.cobranca||{};
  // a tela edita em REAIS; o gravado está em centavos (emCentavos:true)

/* Testa a credencial do provedor: o resultado diz o AMBIENTE (produção ×
   Sandbox) e o host, porque o engano mais comum é a credencial de um
   ambiente no host do outro — e a recusa do PicPay é a mesma frase nos dois. */
async function testarCredencial(id){
  const bt=$("bt-cob-teste"), out=$("cob-teste");
  if(bt) bt.disabled=true;
  if(out) out.innerHTML=`<span class="muted">Testando…</span>`;
  try{
    const r=await fetch(`/api/extensao/${id}/cobranca/testar`,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||`HTTP ${r.status}`);
    const t=j.teste||{};
    const amb=t.ambiente?` no ambiente de <b>${esc(t.ambiente)}</b>`:"";
    const host=t.host?` (<span style="font-family:ui-monospace,monospace">${esc(t.host)}</span>)`:"";
    const mono=(s)=>`<span style="font-family:ui-monospace,monospace">${esc(s||"sem detalhe")}</span>`;
    const PP=t.provedor==="picpay", MP=t.provedor==="mercadopago";
    // cada adaptador diz o que conferiu em `texto`; o PicPay cria dois links de centavo, o Mercado Pago lê os meios ATIVOS da conta
    const linhaMeio=(nome,m)=>m?`<div>${m.ok?"✓":"✗"} <b>${nome}</b>: ${m.ok?esc(m.texto||(PP?"o PicPay criou o link de teste (R$ 0,01, vence amanhã, ninguém paga)":"disponível")):mono(m.erro)}</div>`:"";
    const conta=t.conta?` — conta <b>${esc(t.conta.apelido||t.conta.id||"")}</b>${t.conta.tipoToken==="teste"?" (token de TESTE)":""}`:"";
    const aviso=t.aviso?`<div>⚠ ${esc(t.aviso)}</div>`:"";
    if(t.credencial&&t.api){
      // é a CRIAÇÃO da cobrança que separa "API responde" de "a conta pode cobrar"
      const meios=linhaMeio("Pix",t.pix)+linhaMeio("Cartão",t.cartao)+linhaMeio("Boleto",t.boleto)
        +(t.cobranca?`<div>${t.cobranca.ok?"✓":"✗"} <b>Criação da cobrança</b>: ${t.cobranca.ok?"o Mercado Pago criou a preferência de teste (R$ 0,01, vence amanhã, ninguém paga)":mono(t.cobranca.erro)}</div>`:"");
      out.innerHTML=t.ok
        ?`<div class="banner ba-ok" style="margin:0">✓ Credencial aceita e API respondendo${amb}${host}${conta}.${t.trocouDe?` O host <span style="font-family:ui-monospace,monospace">${esc(t.trocouDe)}</span> bloqueou e o sistema passou ao seguinte sozinho.`:""}${aviso}${meios}${t.pix&&!t.pix.ok?`<div>O evento cobra pelos meios ativos enquanto o Pix da conta não estiver ativo.</div>`:""}</div>`
        :`<div class="banner ba-warn" style="margin:0">✓ Credencial aceita e API respondendo${amb}${host}${conta}, mas <b>a conta não consegue cobrar</b>:${aviso}${meios}<div>${PP
          ?"Isso não se resolve no ARCHÉ nem no Render: a conta precisa ser habilitada no serviço Link de Pagamento - API pelo <b>suporte do PicPay</b> (e o Pix ativado em Gerenciar recebimentos)."
          :"Confira na conta do Mercado Pago (<b>Seu negócio → Configurações → Meios de pagamento</b>) se o Pix e o cartão estão ativos, e em <b>developers.mercadopago.com → Suas integrações</b> se a aplicação está em produção com o token que foi ao Render."}</div></div>`;
    }else if(t.credencial){
      // a credencial vale, mas a API não responde: o caso do firewall do PicPay (set/2026)
      out.innerHTML=`<div class="banner ba-warn" style="margin:0">✓ Credencial aceita${amb}${host}${conta}, mas <b>a API está ${t.bloqueio?"BLOQUEADA":"sem responder"}</b>: ${mono(t.erro)}.
        ${t.bloqueio&&PP?`O PicPay recusa as chamadas que o servidor faz (o token passa, as rotas de cobrança não). Isso não se resolve no ARCHÉ nem no Render: é preciso pedir ao <b>suporte do PicPay</b> (Link de Pagamento - API) a liberação dos IPs de saída do servidor, citando o Ray ID acima.`:""}</div>`;
    }else{
      out.innerHTML=`<div class="banner ba-warn" style="margin:0">✗ Credencial <b>recusada</b>${amb}${host}: ${mono(t.erro)}.
        ${PP&&/invalid_client|Invalid client/i.test(t.erro||"")?`Confira no Render se <b>PICPAY_CLIENT_ID</b> e <b>PICPAY_CLIENT_SECRET</b> são do MESMO cartão que o ambiente indica — as credenciais do Sandbox só valem com <b>PICPAY_AMBIENTE=staging</b>, e as de produção só SEM essa variável — e se foram coladas inteiras, sem espaço no fim.`:""}
        ${MP?`Confira no Render se <b>MP_ACCESS_TOKEN</b> é o <b>Access Token de produção</b> da aplicação (começa com <span style="font-family:ui-monospace,monospace">APP_USR-</span>; em developers.mercadopago.com → Suas integrações → a aplicação → Credenciais de produção), colado inteiro, sem espaço no fim. Token vencido ou renovado no painel também recusa assim.`:""}</div>`;
    }
  }catch(e){ if(out) out.innerHTML=`<div class="banner ba-warn" style="margin:0">${esc(e.message)}</div>`; }
  finally{ if(bt) bt.disabled=false; }
}
/* ========================= VOUCHERS DE DESCONTO ===========================
   Pedido do dono (set/2026): "uma guia para gerar voucher de descontos, com
   códigos com descontos para algumas categorias; ilimitados ou limitados em
   quantidade ou tempo". A lista vive em cobranca.vouchers; os USOS vêm
   contados das inscrições (pagas, isentas e reservas vivas), não de um
   contador — regravar a guia nunca zera o que já foi usado. */
let EV_VOU=[];
const usosVoucher=(a,codigo)=>(a.participantes?.inscritos||[]).filter(i=>i.pagamento?.voucher?.codigo===codigo
  &&(["pago","isento","contestado"].includes(i.pagamento.status)||(i.pagamento.status==="aguardando"&&!(i.pagamento.expiraEm&&new Date(i.pagamento.expiraEm)<new Date())))).length;
const descontoTxt=(d)=>!d||!(d.valor>0)?"":d.modo==="fixo"?reaisDe(d.valor):String(d.valor).replace(".",",")+"%";
function renderVouchers(a){
  const ev=a.evento||{}, c=ev.cobranca||{};

  EV_VOU=(c.vouchers||[]).map(v=>({codigo:v.codigo,desconto:descontoTxt(v.desconto),categorias:[...(v.categorias||[])],limite:v.limite||0,ate:v.ate||"",ativo:v.ativo!==false,descricao:v.descricao||"",usos:usosVoucher(a,v.codigo)}));
  $("v-vouchers").innerHTML=`
    ${!c.ativa||!cats.some(k=>k.valor>0)?`<div class="banner ba-warn">Este evento ainda não cobra inscrição — os vouchers só têm efeito com a
