// as únicas guias com elemento que muda sozinho: contadores do Início,
// tabela de inscritos, contadores por atividade e o mural da transmissão
const GUIAS_AO_VIVO = ["inicio","inscritos","programacao","transmissao"];
let AO_VIVO_ID=null;
async function aoVoltarAba(){
  if(document.visibilityState!=="visible"||!AO_VIVO_ID) return;
  if(!GUIAS_AO_VIVO.includes(SECAO)||ABERTO!==AO_VIVO_ID) return;
  try{
    await carregar();
    const a=ACOES.find(x=>x.id===AO_VIVO_ID); if(!a) return;
    atualizarContadoresEvento(a);
  }catch{ /* sem rede agora — o intervalo tenta de novo */ }
}

/* Contadores "ao vivo" no dia do evento: enquanto uma guia de evento está
   aberta e a página do evento ativa, recarrega a cada 30 s — só números, a
   tabela de inscritos e o mural, sem tocar nos formulários (senão o
   refresco apagaria o que se digita). */
function agendarEvento(id){
  clearInterval(EV_TIMER);
  document.removeEventListener("visibilitychange", aoVoltarAba);
  const a0=ACOES.find(x=>x.id===id);
  if(!a0?.evento?.ativo) return;
  // voltar para a aba atualiza na hora: sem isto, quem volta olha um número
  // de até 30 s atrás achando que é o de agora
  AO_VIVO_ID=id;
  document.addEventListener("visibilitychange", aoVoltarAba);
  EV_TIMER=setInterval(async()=>{
    const meta=SECOES.find(s=>s.k===SECAO);
    if(!meta?.evento||ABERTO!==id){ clearInterval(EV_TIMER); return; }
    // Só as guias que TÊM algo ao vivo, e só com a aba à vista (varredura de
    // ago/2026): `carregar()` é o GET /api/extensao inteiro, e o gatilho era
    // qualquer guia de evento — nas outras nove o poll baixava tudo para não
    // pintar nada. Uma aba esquecida aberta à noite somava alguns GB sozinha.
    if(!GUIAS_AO_VIVO.includes(SECAO)) return;
    if(document.visibilityState!=="visible") return;
    try{
      await carregar();
      const a=ACOES.find(x=>x.id===id); if(!a) return;
      atualizarContadoresEvento(a); renderInscritosEv(a);
    }catch{ /* sem rede agora — a próxima volta tenta de novo */ }
  },30000);
}

async function atualizarEvento(id){
  try{ await carregar(); }catch(e){ alert(e.message); return; }
  montarSeletor();
  nav(SECAO);
}

/* presença manual (gestão): para quem veio da lista da coordenação (sem QR)
   ou assinou o papel — o credenciamento por QR é dos inscritos online.
   SEMPRE pela rota autenticada da gestão: o registro sai assinado
   "gestão (email)", nunca "monitor". */
/* Acha o inscrito na cópia que a tela já tem, pela mesma chave que foi
   enviada ao servidor. Serve para atualizar a LINHA em vez de recarregar a
   base inteira a cada clique. */
function acharInscritoLocal(a, token, cpf, email){
  const ins=a?.participantes?.inscritos||[];
  const dig=(v)=>String(v||"").replace(/\D/g,"");
  return ins.find(x=>token&&String(x.token||"").toLowerCase()===String(token).toLowerCase())
    || ins.find(x=>dig(cpf)&&dig(x.cpf)===dig(cpf))
    || ins.find(x=>email&&String(x.email||"").toLowerCase()===String(email).toLowerCase())
    || null;
}

/* Marcar presença NÃO recarrega mais a base inteira (varredura de ago/2026):
   `carregar()` é o GET /api/extensao completo, com todos os inscritos de
   todas as ações — centenas de KB por clique, numa tarefa que a gestão faz
   em série, 300 vezes seguidas. A resposta da rota já traz o que mudou; a
   tela aplica na própria cópia e redesenha a lista. */
async function marcarPresencaEv(id, token, cpf, email, presente){
  try{
    const r=await fetch("/api/extensao/"+id+"/presenca",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token,cpf,email,presente})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    const a=ACOES.find(x=>x.id===id);
    const i=acharInscritoLocal(a, token, cpf, email);
    if(i){
      i.presente=j.presente===true; i.presenteEm=j.presenteEm||"";
      // desfazer tira o registro GERAL de presencas, como o servidor faz —
      // as presenças por atividade ficam
      if(!i.presente && Array.isArray(i.presencas))
        i.presencas=i.presencas.filter(p=>String(p?.atividade||"")!=="");
    }
    if(a){ atualizarContadoresEvento(a); renderInscritosEv(a); }
  }catch(e){ alert("Não foi possível marcar a presença: "+e.message); }
}
/* Presença manual COM atividade — mesma rota autenticada; funciona também
   para o inscrito da lista em papel, sem token: a rota acha por CPF/e-mail. */
async function presencaAtividadeEv(id, token, cpf, email){
  const atv=$("ev-atv-sel")?.value||"";
  try{
    const r=await fetch("/api/extensao/"+id+"/presenca",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token, cpf, email, atividade:atv, presente:true})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    const a2=ACOES.find(x=>x.id===id);
    const i=acharInscritoLocal(a2, token, cpf, email);
    if(i && atv){
      i.presencas=Array.isArray(i.presencas)?i.presencas:[];
      const tem=i.presencas.some(p=>String(p?.atividade||"")===atv);
      if(j.naAtividade && !tem) i.presencas.push({atividade:atv, em:new Date().toISOString(), por:"gestão"});
      if(!j.naAtividade && tem) i.presencas=i.presencas.filter(p=>String(p?.atividade||"")!==atv);
      i.presente=j.presente===true; i.presenteEm=j.presenteEm||i.presenteEm||"";
    }
    if(a2){ atualizarContadoresEvento(a2); renderInscritosEv(a2); }
  }catch(e){ alert("Não foi possível registrar na atividade: "+e.message); }
}
function presencaManualEv(id, token, cpf, email){
  const atv=$("ev-atv-sel")?.value||"";
  if(atv) return presencaAtividadeEv(id, token, cpf, email);
  return marcarPresencaEv(id, token, cpf, email, true);
}

/* --------------------------- salvar / publicar ---------------------------
   Cada guia salva SÓ o que edita: a rota do evento aplica campo a campo o
   que veio no corpo, então o que a guia não mandou fica exatamente como
   está. Nunca se envia a configuração inteira de uma vez. */
async function salvarParteEvento(id, body){
  const msg=$("ev-msg"); if(msg){ msg.textContent="Salvando…"; msg.style.color=""; }
  try{
    const r=await fetch(`/api/extensao/${id}/evento`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    await carregar(); montarSeletor(); nav(SECAO);
    const m=$("ev-msg"); if(m){ m.textContent="✓ salvo"; setTimeout(()=>{ if($("ev-msg")) $("ev-msg").textContent=""; },3000); }
    return true;
  }catch(e){
    // a recusa do servidor sai COMO VEIO (é o caso da trava de publicação:
    // o 400 lista o que falta no projeto) — na tela quando há onde, senão no alerta
    const m=$("ev-msg");
    if(m){ m.textContent="✕ "+e.message; m.style.color="var(--err)"; }
    else alert("Não foi possível salvar o evento: "+e.message);
    return false;
  }
}

/* Página do evento: ativação, endereço, descrição, local e capa. A capa só
   entra no corpo quando a tela mexeu nela — mandar sempre apagaria a que
   está gravada (o payload nunca traz o base64 de volta). */
function salvarPagina(id){
  // o interruptor da frequência mora aqui: é decisão do evento, não da página
  const freq = document.querySelector('input[name="ev-freq"]:checked');
  const body={
    ativo:$("ev-ativo")?.checked||false,

  return salvarParteEvento(id, body);

   ENCERRAR O EVENTO = ENTREGAR O RELATÓRIO FINAL DA AÇÃO

   Pedido do dono (ago/2026), depois do primeiro evento gerido de ponta a
   ponta: o evento encerrou, os certificados saíram — e a ação continuou
   sem relatório no ARCHÉ EX, porque quem organiza o evento termina o
   trabalho AQUI e não volta ao outro setor. Encerrar passa a pedir o que o
   relatório pede (os campos e as fotos), e a mesma régua do formulário do
   EX vale aqui: quem confere é o servidor (lib/relatorioEx.js).

/* A foto do portfólio entra no PDF do relatório, e o PDFKit embute o
   arquivo como ele é: 24 fotos de celular davam 61 MB. 1600 px é bem mais do
   que a moldura de 8 cm precisa. Documento não-imagem sobe intacto, e se o
   navegador não souber ler, vai o original — perder o anexo seria pior. */
const FOTO_PORTFOLIO_LARGURA = 1600;
async function reduzirFotoPortfolio(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type||"")) return f;
  try{
    const bmp = await createImageBitmap(f);
    if(bmp.width<=FOTO_PORTFOLIO_LARGURA && f.size<=900*1024){ bmp.close&&bmp.close(); return f; }
    const escala = Math.min(1, FOTO_PORTFOLIO_LARGURA/bmp.width);
    const w=Math.max(1,Math.round(bmp.width*escala)), h=Math.max(1,Math.round(bmp.height*escala));
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
    ctx.drawImage(bmp,0,0,w,h);
    bmp.close&&bmp.close();
    const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.85));
    if(!blob||blob.size>=f.size) return f;
    const nome=String(f.name||"foto").replace(/\.[^.]+$/,"")+".jpg";
    return new File([blob],nome,{type:"image/jpeg"});
  }catch{ return f; }
}

/* O rascunho que o sistema já sabe escrever: programação, palestrantes,

   os copie à mão no encerramento seria trabalho perdido. Quem monta é o
   SERVIDOR (lib/relatorioEx.js), a mesma sugestão que o ARCHÉ EX aplica; só
   entra em campo vazio, e a avaliação/resultados nunca vem pronta. */
async function preencherDoEvento(id){
  let j;
  try{
    const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/relatorio-sugestao`);
    j=await r.json(); if(!r.ok) throw new Error("");
  }catch{ return; }
  const postos=[];
  for(const [k,v] of Object.entries(j.campos||{})){
    const el=$("enc-"+k); if(!el || String(el.value||"").trim()) continue;
    el.value=v; postos.push(k);
  }
  const cx=$("enc-sugestao");
  if(cx && postos.length) cx.innerHTML=`<div class="banner ba-ok" style="margin:0 0 12px">
    ✨ <b>${postos.length} campo(s) preenchidos com os dados do evento.</b> Confira antes de
    encerrar. A <b>avaliação / resultados</b> é a única que não se preenche sozinha — é o
    juízo de quem conduziu a ação.</div>`;
}

function piscarEncerrar(){
  const cx=$("ov-encerrar")?.querySelector(".ov-cx"); if(!cx) return;
  cx.classList.remove("ov-piscar"); void cx.offsetWidth; cx.classList.add("ov-piscar");
}
// algo digitado? então perguntar antes de perder
function encTemDados(){
  return CAMPOS_REL.some(c=>String($("enc-"+c.chave)?.value||"").trim())
    || String($("enc-obs")?.value||"").trim();
}
function cancelarEncerramento(){
  if(encTemDados() && !confirm("Descartar o encerramento deste evento?\n\n"
    +"O que você já preencheu do relatório será perdido — as fotos anexadas ficam.")) return;
  fecharEncerrar();
}
function encTecla(e){ if(e.key==="Escape") cancelarEncerramento(); }
function fecharEncerrar(){
  document.getElementById("ov-encerrar")?.remove();
  document.removeEventListener("keydown",encTecla);
}

function pintarFotosEncerramento(id){
  const a=ACOES.find(x=>x.id===id), cx=$("enc-fotos"); if(!cx) return;
  const anexos=a?.portfolio?.anexos||[], fotos=fotosDa(a).length;
  const falta=Math.max(0,MIN_FOTOS-fotos);
  cx.innerHTML=`<div class="banner ${falta?"ba-warn":"ba-ok"}" style="margin:0 0 8px">
      ${falta?`Faltam <b>${falta}</b> foto(s) — há ${fotos} de ${MIN_FOTOS}.`
             :`<b>${fotos}</b> foto(s) anexada(s) — o mínimo está cumprido.`}</div>
    ${anexos.length?`<div class="muted" style="font-size:12.5px">${anexos.map(x=>
      `${ehFotoAnexo(x)?"🖼":"📎"} ${esc(x.name||x.nome||"anexo")}`).join("<br>")}</div>`
      :`<div class="muted" style="font-size:12.5px">Nenhum arquivo anexado ainda.</div>`}`;
}

/* Os anexos usam a MESMA rota do portfólio do ARCHÉ EX (/api/extensao/anexo):
   é o mesmo portfólio da mesma ação — duas rotas gravariam duas listas. */
async function subirAnexosEncerramento(id){
  const inp=$("enc-file"), arqs=[...(inp?.files||[])];
  if(!arqs.length){ alert("Escolha os arquivos primeiro."); return; }
  const a=ACOES.find(x=>x.id===id);
  for(const f of arqs){
    const fd=new FormData(); fd.append("file", await reduzirFotoPortfolio(f)); fd.append("id",id);
    const r=await fetch("/api/extensao/anexo",{method:"POST",body:fd});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ alert(`Não foi possível anexar "${f.name}": ${j.error||r.status}`); break; }
    a.portfolio=a.portfolio||{}; a.portfolio.anexos=j.anexos||a.portfolio.anexos||[];
  }
  if(inp) inp.value="";
  pintarFotosEncerramento(id);
}

async function confirmarEncerramento(id){
  const a=ACOES.find(x=>x.id===id); if(!a) return;
  const relatorio={};
  for(const c of CAMPOS_REL) relatorio[c.chave]=($(`enc-${c.chave}`)?.value||"").trim();
  const falta=CAMPOS_REL.find(c=>c.obrigatorio&&!relatorio[c.chave]);
  if(falta){ alert(`Preencha “${falta.rotulo}” — é o que a PROPPEX lê no relatório.`);
    $(`enc-${falta.chave}`)?.focus(); return; }
  if(fotosDa(a).length<MIN_FOTOS){
    alert(`O relatório precisa de pelo menos ${MIN_FOTOS} fotos. Anexe as que faltam acima.`); return; }
  if(!confirm(`Encerrar "${a.proposta?.nomeAtividade||"este evento"}" e entregar o relatório final?\n\n`
    +"O relatório vai à PROPPEX junto com o pedido de encerramento. Validado, os certificados são liberados.")) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/evento/encerrar`,{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({observacao:($("enc-obs")?.value||"").trim(),relatorio})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível encerrar."); return; }
  fecharEncerrar();
  await carregar(); nav("certificados");
  alert("Evento encerrado e relatório final entregue.\n\nA PROPPEX foi avisada — os certificados "
    +"saem depois da validação, e o relatório já aparece na ação, no ARCHÉ EX.");
}

async function decidirEncerramento(id,decisao){
  const parecer = decisao==="devolvido"
    ? (prompt("O que precisa ser corrigido? (a coordenação vai ler)","")||"").trim()
    : (prompt("Observação da validação (opcional)","")||"").trim();
  if(decisao==="devolvido"&&parecer.length<10){ alert("Escreva o que precisa ser corrigido."); return; }
  if(decisao==="validado"&&!confirm("Validar o encerramento e LIBERAR os certificados deste evento?\n\n"
    +"Todos com direito a certificado — participantes, palestrantes e comissão — recebem um "
    +"e-mail avisando que o documento está pronto, com o link para baixá-lo.")) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/evento/encerramento`,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({decisao,parecer})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível registrar a decisão."); return; }
  await carregar(); nav("certificados");
  if(decisao!=="validado"){ alert("Encerramento devolvido à coordenação."); return; }
  const av=j.avisos||{};
  alert("Encerramento validado — os certificados estão liberados.\n\n"
    +`Avisos enviados: ${av.enviados||0} de ${av.previstos||0}`
    +(av.semEmail?`\n${av.semEmail} pessoa(s) sem e-mail no cadastro — essas não foram avisadas.`:""));
}

async function enviarAssinatura(id,quem){
  const f=$("as-file-"+quem)?.files?.[0];
  const nome=($("as-nome-"+quem)?.value||"").trim();
  if(!nome){ alert("Informe o nome de quem assina — é ele que sai impresso."); return; }
  if(!f){ alert("Escolha o arquivo PNG da assinatura."); return; }
  const fd=new FormData();
  fd.append("file",f); fd.append("quem",quem); fd.append("nome",nome);
  fd.append("cargo",($("as-cargo-"+quem)?.value||"").trim());
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/assinatura`,{method:"POST",body:fd});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Não foi possível salvar a assinatura."); return; }
  await carregar(); nav("certificados");
}

async function removerAssinatura(id,quem){
  if(!confirm("Remover esta assinatura do certificado?")) return;
  const r=await fetch(`/api/extensao/${encodeURIComponent(id)}/assinatura?quem=${quem}`,{method:"DELETE"});
  if(!r.ok){ alert("Não foi possível remover."); return; }
  await carregar(); nav("certificados");
}
</script>
