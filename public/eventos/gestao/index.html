<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHÉ EV · Eventos · PROPPEX / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
  :root{
    --brand:#1c3742; --brand-2:#2d535c; --brand-3:#40717e; --accent:#71c8e2;
    --bg:#eef1f4; --card:#fff; --line:#dde4e8; --line-2:#eceff3; --wash:#e6f5fa;
    --ink:#182632; --ink-soft:#3a4650; --muted:#657179; --muted-2:#a9b4c0;
    --ok:#3f8a5d; --ok-soft:#e5f3ea; --warn:#c98a2b; --warn-soft:#fbf3e4;
    --err:#a1524c; --err-soft:#f6e9e7; --info:#40717e; --info-soft:#e8f4fa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-3);text-decoration:none}
  a:hover{color:var(--brand-2)}
  ::selection{background:var(--accent);color:var(--brand)}
  button{font-family:Figtree,system-ui,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
  .f-disp{font-family:Sora,sans-serif}

  /* ------------------------------- casca ---------------------------------
     A mesma casca dos demais setores (ARCHÉ EX / IC): barra lateral escura
     fixa à esquerda, conteúdo com trilha e título à direita. A diferença do
     EV é o SELETOR DE EVENTO no topo da barra (molde Even3, pedido do dono):
     trocar ali troca o evento de TODAS as guias de evento de uma vez. */
  .app{display:flex;min-height:100vh}
  .side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side-marca{padding:20px 22px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
  .side-marca b{color:var(--accent);font-weight:800}
  .side-sel{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-sel .rot{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.4);font-weight:600;margin:0 2px 6px}
  .side-sel select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
    color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:Figtree,system-ui,sans-serif}
  .side-sel select:focus{outline:none;border-color:var(--accent);box-shadow:none}
  .side-sel select option,.side-sel select optgroup{color:var(--ink);background:#fff}
  .side-sel .todos{background:none;border:0;color:rgba(255,255,255,.55);cursor:pointer;
    font-size:11.5px;font-weight:600;padding:8px 2px 0}
  .side-sel .todos:hover{color:#fff}
  .side-nav{padding:10px 12px;flex:1;overflow-y:auto}
  .side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:12px 12px 6px}
  .side-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;
    margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
    border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
    transition:background .15s,color .15s}
  .side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
  .side-item svg{flex:none}
  .side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
  .side-pe .av{width:34px;height:34px;border-radius:50%;background:var(--brand-3);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
  .side-pe .av img{width:100%;height:100%;object-fit:cover}
  .side-pe .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
  .side-pe .pp{font-size:11px;color:rgba(255,255,255,.5)}
  .side-pe .sair{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-weight:600}
  .side-pe .sair:hover{color:#fff}

  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .topbar .dir{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .area{padding:28px 32px;flex:1}
  .limite{max-width:1180px}
  h1{font-family:Sora,sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}

  /* faixa do evento selecionado, no topo do conteúdo das guias de evento */
  .ctx{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--wash);
    border:1px solid #cfe6f2;border-radius:10px;padding:10px 14px;margin-bottom:18px}
  .ctx .nm{font-family:Sora,sans-serif;font-weight:700;font-size:14px;color:var(--brand)}
  .ctx .meta{font-size:12.5px;color:var(--muted)}
  .ctx .acoes{margin-left:auto;display:flex;gap:8px;align-items:center}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
  .sec-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:0 0 6px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .muted{color:var(--muted);font-size:12.5px;font-weight:400}
  .hide{display:none!important}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .grid2>*,.grid3>*,.stat>*{min-width:0}
  @media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px;
    text-transform:uppercase;letter-spacing:.04em}
  input,select,textarea{width:100%;border:1px solid #cfd6de;border-radius:8px;padding:10px 12px;
    font-family:Figtree,system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{min-height:84px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(64,113,126,.12)}

  .bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bt-pri{background:var(--brand);color:#fff}
  .bt-pri:hover{background:var(--brand-2)}
  .bt-sec{background:var(--info-soft);color:var(--brand);border-color:#cfe6f2}
  .bt-sec:hover{background:#dbeef8}
  .bt-ghost{background:#fff;color:var(--muted);border-color:#cfd6de}
  .bt-ghost:hover{color:var(--ink);border-color:var(--brand-3)}
  .bt-ok{background:var(--ok-soft);color:var(--ok);border-color:#cfeeda}
  .bt-warn{background:var(--warn-soft);color:var(--warn);border-color:#f0e0bd}
  .bt:disabled{opacity:.5;cursor:not-allowed}
  .exp{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .lk{background:none;border:0;color:var(--brand-3);cursor:pointer;font-weight:600;font-size:12.5px;padding:0}
  .lk:hover{color:var(--brand-2)}

  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .banner{border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500;line-height:1.5}
  .ba-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0e0bd}
  .ba-info{background:var(--info-soft);color:var(--brand);border:1px solid #cfe6f2}

  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:14px}
  .stat .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .s b{font-family:Sora,sans-serif;font-size:22px;display:block;color:var(--ink);line-height:1.1}
  .stat .s span{font-size:11.5px;color:var(--muted)}
  table.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.pt th{background:#f7f9fb;color:var(--muted);padding:9px 10px;text-align:left;font-size:11.5px;
    font-weight:600;border-bottom:1px solid var(--line)}
  table.pt td{border-bottom:1px solid var(--line-2);padding:8px 10px;color:var(--ink-soft)}
  .cnt{font-size:12.5px;color:var(--muted);margin:8px 0}
  .scrollx{overflow-x:auto}
  .linha{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .linha:last-child{border-bottom:0}
  .linha .txt{flex:1;min-width:0}
  .linha .p1{font-size:13px;color:var(--ink-soft);font-weight:600}

  /* --------------------------- lista de eventos --------------------------- */
  .ferramentas{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 14px}
  .ferramentas input{max-width:340px}
  .evcard{display:flex;gap:14px;align-items:stretch;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:12px;cursor:pointer;overflow:hidden;
    transition:border-color .15s,box-shadow .15s;text-align:left;width:100%;padding:0}
  .evcard:hover{border-color:var(--brand-3);box-shadow:0 2px 10px -4px rgba(28,55,66,.18)}
  .evcard .thumb{width:120px;flex:none;background:linear-gradient(135deg,var(--brand),var(--brand-3));
    display:grid;place-items:center;color:var(--accent);font-family:Sora,sans-serif;font-weight:800;font-size:28px}
  .evcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .evcard .corpo{flex:1;min-width:0;padding:14px 16px}
  .evcard .nm{font-weight:700;font-size:15px;color:var(--ink)}
  .evcard .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .evcard .selos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .evcard .nums{font-size:12.5px;color:var(--ink-soft);margin-top:8px;font-weight:600}
  @media(max-width:560px){.evcard{flex-direction:column}.evcard .thumb{width:100%;height:90px}}

  /* --------------------------- editor de atividades ----------------------- */
  .atv-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fafbfc}
  .g-atv{display:grid;grid-template-columns:1fr 140px 106px 106px auto;gap:8px;align-items:center}
  .g-atv2{display:grid;grid-template-columns:1.2fr 1fr 96px 96px;gap:8px;margin-top:8px}
  .g-campo{display:grid;grid-template-columns:1.4fr 170px auto;gap:8px;align-items:center}
  @media(max-width:760px){.g-atv,.g-atv2,.g-campo{grid-template-columns:1fr}}
  .chk{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;
    font-weight:500;color:var(--ink);margin-top:8px}
  .chk input{width:auto}
  .rm{color:var(--err);cursor:pointer;font-weight:700}
  .tut{background:var(--info-soft);border:1px solid #cfe6f2;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px;line-height:1.6}

  /* ------------------------------ celular ---------------------------------
     A lateral vira cabeçalho: marca + usuário na 1ª linha, o seletor de
     evento logo abaixo e o menu horizontal ROLÁVEL por último (o mesmo
     comportamento responsivo do ARCHÉ EX, que o dono usa no celular). */
  @media(max-width:760px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .side-marca{border-bottom:0;padding:14px 16px}
    .side-sel{flex:1 1 100%;order:2;border-bottom:0;padding:0 12px 4px}
    .side-nav{padding:8px 10px;flex:1 1 100%;order:3;overflow-x:auto}
    .side-nav #menu{display:flex;gap:6px}
    .side-lab{display:none}
    .side-item{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px}
    .side-item.on{border-left:0;border-bottom-color:var(--accent)}
    .side-pe{border-top:0;margin-left:auto;order:1;padding:10px 14px}
    .area{padding:20px 14px}
    .topbar{padding:0 16px}
    .ctx .acoes{margin-left:0}
  }
</style>
</head>
<body>
<div class="app">
  <!-- barra lateral -->
  <nav class="side">
    <a class="side-marca" href="/" title="Voltar ao portal">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 37 L8 20 A12 12 0 0 1 32 20 L32 37" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4" fill="#71c8e2"/></svg>
      <span>ARCHÉ <b>EV</b></span>
    </a>
    <div class="side-sel">
      <span class="rot">Evento em gestão</span>
      <select id="sel-evento" onchange="trocarEvento(this.value)" title="Trocar aqui troca o evento de todas as guias"></select>
      <button class="todos" onclick="nav('painel')">‹ ver todos os eventos</button>
    </div>
    <div class="side-nav"><div id="menu"></div></div>
    <div class="side-pe" id="rodape-usuario"></div>
  </nav>

  <!-- conteúdo -->
  <div class="conteudo">
    <div class="topbar">
      <div class="crumb">ARCHÉ EV <span style="color:var(--muted-2)">/</span> <b id="crumb">Painel geral</b></div>
      <div class="dir"><span id="dir-info"></span></div>
    </div>
    <div class="area">
      <div class="limite">
        <h1 id="titulo">Painel geral</h1>
        <div class="sub" id="subtitulo"></div>
        <div id="ev-contexto"></div>

        <section id="v-painel" class="hide"></section>
        <section id="v-inicio" class="hide"></section>
        <section id="v-inscritos" class="hide"></section>
        <section id="v-inscricoes" class="hide"></section>
        <section id="v-pagina" class="hide"></section>
        <section id="v-programacao" class="hide"></section>
        <section id="v-credenciamento" class="hide"></section>
        <section id="v-transmissao" class="hide"></section>
        <section id="v-exportacoes" class="hide"></section>
        <section id="v-acao" class="hide"></section>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   ARCHÉ EV — a sala de operação dos eventos, agora na casca padrão dos
   setores (barra lateral à esquerda) com o SELETOR DE EVENTO no topo da
   barra, no molde do painel do organizador do Even3 (pedido do dono):
   escolhe-se ali (ou num card do Painel geral) o evento em gestão, e as
   guias de evento — Início, Inscritos, Inscrições, Página, Programação,
   Credenciamento, Transmissão, Exportações, Ação — passam a operá-lo.

   O evento nasce de uma ação de extensão (é `a.evento`); toda escrita passa
   pelas rotas dedicadas do servidor (POST /:id/evento, /presenca,
   /mural/:mid) — NUNCA pelo POST /api/extensao em bloco: a coordenação do
   módulo "eventos" não tem essa permissão, e um save em bloco poderia
   recusar. Cada guia salva SÓ os campos que edita (a rota do evento aplica
   campo a campo o que veio no corpo, então o resto fica como está).
   ========================================================================= */
let ACOES = [], ME = null, EU = "", GESTAO_EX = false, GESTAO_EV = false;
let TIPOS_ATV = [["palestra","Palestra"],["minicurso","Minicurso"],["oficina","Oficina"],["curso","Curso"],
  ["mesa","Mesa-redonda"],["roda","Roda de conversa"],["mostra","Mostra"],["apresentacao","Apresentação"],
  ["outro","Outro"]].map(([codigo,rotulo])=>({codigo,rotulo}));
let LGPD_PADRAO = "";
let EV_PROG = [], EV_FORM = [], EV_TIMER = null;
let ABERTO = null;      // id da AÇÃO do evento em gestão (o do seletor da barra)
let SECAO = "painel";   // guia atual
// a capa nunca viaja nos payloads (só `temCapa`): o que a tela envia fica
// aqui — undefined = não mexeu; "" = remover; dataURL = capa nova
let EV_CAPA;

const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (d)=>{ const [a,m,dd]=String(d||"").slice(0,10).split("-"); return (a&&m&&dd)?`${dd}/${m}/${a}`:""; };
function fmtDataHora(iso){
  const d=iso?new Date(iso):null;
  if(!d||isNaN(d)) return "—";
  const z=(n)=>String(n).padStart(2,"0");
  return `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} às ${z(d.getHours())}h${z(d.getMinutes())}`;
}
function fmtCPF(v){ const d=String(v||"").replace(/\D/g,""); return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4"):v; }
// data de hoje no fuso institucional (America/Sao_Paulo)
const hojeISO = ()=>{
  try{
    return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",
      year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  }catch{ return new Date(Date.now()-3*3600*1000).toISOString().slice(0,10); }
};

async function carregar(){
  const r = await fetch("/api/extensao");
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || "Falha ao carregar os eventos");
  const j = await r.json();
  ACOES = j.acoes || [];
  GESTAO_EX = j.gestao === true;
  GESTAO_EV = j.gestaoEventos === true;
  EU = j.eu || EU;
  if(Array.isArray(j.tiposAtividade) && j.tiposAtividade.length) TIPOS_ATV = j.tiposAtividade;
  if(j.lgpdPadrao) LGPD_PADRAO = j.lgpdPadrao;
  for(const a of ACOES){
    a.proposta = a.proposta || {};
    const p = a.participantes || (a.participantes = {});
    p.inscritos = p.inscritos || [];
  }
}

/* Réplica local de numerosDoEvento (lib/eventos.js): os contadores da lista
   e os por atividade se calculam do que a tela já tem. */
function numerosEventoLocal(a){
  const ev=a.evento||{}; const inscritos=a.participantes?.inscritos||[];
  const online=inscritos.filter(i=>i?.origem==="online").length;
  const presDe=(id)=>inscritos.filter(i=>(i?.presencas||[]).some(p=>String(p?.atividade||"")===id)).length;
  const marcou=(id)=>inscritos.filter(i=>Array.isArray(i?.atividades)&&i.atividades.includes(id)).length;
  const porAtividade=(ev.programacao||[])
    .filter(p=>p?.id&&(p.inscricao==="propria"||presDe(p.id)>0))
    .map(p=>({id:p.id,titulo:p.titulo||"",inscritos:marcou(p.id),presentes:presDe(p.id)}));
  return {
    inscritos:inscritos.length,
    presentes:inscritos.filter(i=>i?.presente===true).length,
    online, manuais:inscritos.length-online,
    presentesOnline:inscritos.filter(i=>/^online/.test(String(i?.presentePor||""))).length,
    porAtividade,
    comentariosMural:(ev.mural||[]).filter(m=>m&&!m.oculto).length,
  };
}

/* ============================== NAVEGAÇÃO ================================
   Guias no molde Even3, adaptadas ao ARCHÉ EV: Painel geral em cima de
   tudo; depois as guias do EVENTO SELECIONADO agrupadas em GESTÃO,
   PRÉ-EVENTO, EVENTO e GERAL. `evento:true` = exige evento selecionado. */
const IC = {
  painel:'<rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect>',
  inicio:'<path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h5v-6h4v6h5V9.5"></path>',
  inscritos:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>',
  inscricoes:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path>',
  pagina:'<circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path>',
  programacao:'<rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 9h18"></path>',

function montarSidebar(){
  let grupo=null;
  $("menu").innerHTML = SECOES.map(s=>{
    const cab = (s.grupo && s.grupo!==grupo) ? `<div class="side-lab">${s.grupo}</div>` : "";
    grupo=s.grupo;
    return cab+`<button class="side-item" data-k="${s.k}" onclick="nav('${s.k}')">${icone(s.ic)}${s.rot}</button>`;
  }).join("");

  const p = ME?.perfil||{};
  const nome = p.tratamento || p.nome || (ME?.nome && ME.nome!==ME?.email ? ME.nome : (ME?.email||"—"));
  const papel = GESTAO_EX ? "Coordenação · PROPPEX" : GESTAO_EV ? "Coordenação de eventos" : "Operação dos meus eventos";
  const base = (p.nome || (ME?.email||"?").split("@")[0].replace(/[._-]/g," ")).trim().split(/\s+/);
  const sigla = ((base[0]||"?")[0] + ((base[1]||"")[0]||"")).toUpperCase();
  $("rodape-usuario").innerHTML = ME ? `
    <a class="av" href="/perfil/" title="Meu perfil">${p.foto?`<img src="${esc(p.foto)}" alt="">`:esc(sigla)}</a>

      <div class="nm">${esc(nome)}</div><div class="pp">${esc(papel)}</div></a>
    <button class="sair" onclick="sair()">sair</button>` : "";

  $("dir-info").textContent = GESTAO_EX ? "Você vê e opera todos os eventos"

async function sair(){
  try{ await fetch("/auth/sair",{method:"POST"}); }catch{ /* ignora */ }
  location.href="/";
}

/* O seletor de evento da barra lateral: os eventos que a pessoa enxerga
   (nome + no ar/rascunho) e, num grupo à parte, as ações que ainda não têm
   o evento configurado. Trocar aqui troca o evento de TODAS as guias. */
function montarSeletor(){
  const sel=$("sel-evento"); if(!sel) return;
  const nomeDe=(a)=>a.proposta?.nomeAtividade||"(sem nome)";
  const com=ACOES.filter(a=>a.evento), sem=ACOES.filter(a=>!a.evento);
  sel.innerHTML = `<option value=""${ABERTO?"":" selected"}>— escolher evento —</option>`
    + com.map(a=>`<option value="${esc(a.id)}"${a.id===ABERTO?" selected":""}>${esc(nomeDe(a))} · ${a.evento.ativo?"no ar":"rascunho"}</option>`).join("")
    + (sem.length?`<optgroup label="Ações sem evento (configurar)">${
        sem.map(a=>`<option value="${esc(a.id)}"${a.id===ABERTO?" selected":""}>${esc(nomeDe(a))}</option>`).join("")}</optgroup>`:"");
}

/* Trocar o evento em gestão — pelo seletor da barra ou por um card do
   Painel geral (as duas coisas são o MESMO ato). Numa guia de evento,
   fica-se nela, agora com o outro evento; do Painel geral, vai-se ao
   Início do evento escolhido. */
function trocarEvento(id){
  if(!id){ ABERTO=null; clearInterval(EV_TIMER); montarSeletor(); nav("painel"); return; }
  if(!ACOES.some(a=>a.id===id)) return;
  ABERTO=id; EV_CAPA=undefined;
  montarSeletor();
  const meta=SECOES.find(s=>s.k===SECAO);
  nav(meta&&meta.evento?SECAO:"inicio");
}
const selecionar = (id)=>trocarEvento(id);

/* Deep-link: a URL guarda "#<guia>" ou "#<guia>/<id da ação>" — recarregar
   a página volta à mesma guia com o mesmo evento selecionado. O formato da
   tela anterior ("#e/<id>") segue aceito e vira "#inicio/<id>". */
function nav(secao){
  const meta = SECOES.find(s=>s.k===secao) || SECOES[0];
  SECAO = meta.k;
  clearInterval(EV_TIMER);
  document.querySelectorAll(".limite > section").forEach(s=>s.classList.add("hide"));
  document.querySelectorAll(".side-item").forEach(b=>b.classList.toggle("on", b.dataset.k===SECAO));
  $("titulo").textContent = meta.tit;
  $("subtitulo").textContent = meta.sub;
  $("crumb").textContent = meta.rot;
  const a = ABERTO ? ACOES.find(x=>x.id===ABERTO) : null;
  if(a===null && ABERTO){ ABERTO=null; montarSeletor(); }
  try{ history.replaceState(null,"","#"+SECAO+(meta.evento&&a?"/"+encodeURIComponent(a.id):"")); }catch{}
  const alvo=$("v-"+SECAO);

  if(meta.evento && !a){
    $("ev-contexto").innerHTML="";
    alvo.innerHTML=`<div class="card" style="text-align:center;padding:34px 20px">
      <div style="font-size:15px;font-weight:700;color:var(--ink)">Nenhum evento selecionado.</div>
      <div class="muted" style="margin:8px 0 16px">Escolha o evento em gestão no seletor da barra
        lateral ou num card do Painel geral.</div>
      <button class="bt bt-sec" onclick="nav('painel')">Ir ao Painel geral</button></div>`;
    alvo.classList.remove("hide");
    window.scrollTo(0,0); return;
  }

  $("ev-contexto").innerHTML = meta.evento ? contextoHtml(a) : "";
  if(SECAO==="painel") renderPainel();
  else if(SECAO==="inicio") renderInicio(a);
  else if(SECAO==="inscritos") renderInscritos(a);
  else if(SECAO==="inscricoes") renderInscricoes(a);
  else if(SECAO==="pagina") renderPagina(a);
  else if(SECAO==="programacao") renderProgramacao(a);
  else if(SECAO==="credenciamento") renderCredenciamento(a);
  else if(SECAO==="transmissao") renderTransmissao(a);
  else if(SECAO==="exportacoes") renderExportacoes(a);
  else if(SECAO==="acao") renderAcao(a);
  alvo.classList.remove("hide");
  if(meta.evento) agendarEvento(a.id);
  window.scrollTo(0,0);
}

/* faixa do evento em gestão, no topo das guias de evento */
function contextoHtml(a){
  const ev=a.evento||{}; const p=a.proposta||{};
  return `<div class="ctx">
    <span class="nm">${esc(p.nomeAtividade||"(sem nome)")}</span>
    <span class="meta">${esc(a.curso||"")}${a.numeroAcao?` · ${esc(a.numeroAcao)}`:" · ação ainda sem número"}${p.periodoInicio?` · ${fmt(p.periodoInicio)} – ${fmt(p.periodoFim)}`:""}</span>
    <span class="badge" style="background:${ev.ativo?"var(--ok-soft)":"#eceff3"};color:${ev.ativo?"var(--ok)":"var(--muted)"}">${ev.ativo?"página no ar":"rascunho"}</span>
    <span class="acoes">
      <button class="lk" onclick="nav('painel')" title="Escolher outro evento">trocar</button>
      <button class="bt bt-ghost" style="padding:5px 10px;font-size:12px" onclick="atualizarEvento('${esc(a.id)}')" title="Recarregar inscritos e presenças">↻ Atualizar</button>
    </span>
  </div>`;
}

/* ============================ PAINEL GERAL ============================== */
function renderPainel(){
  const com=ACOES.filter(a=>a.evento);
  const noAr=com.filter(a=>a.evento.ativo===true);
  const totais=com.reduce((t,a)=>{ const n=numerosEventoLocal(a);
    t.insc+=n.inscritos; t.pres+=n.presentes; return t; },{insc:0,pres:0});
  const hoje=hojeISO();
  const proximos=com
    .filter(a=>String(a.proposta?.periodoFim||"")>=hoje)
    .sort((x,y)=>String(x.proposta?.periodoInicio||"").localeCompare(String(y.proposta?.periodoInicio||"")))
    .slice(0,5);

  $("v-painel").innerHTML=`
    <div class="stat" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="s"><b>${noAr.length}</b><span>Eventos no ar</span></div>
      <div class="s"><b>${com.length-noAr.length}</b><span>Rascunhos</span></div>
      <div class="s"><b>${totais.insc}</b><span>Inscritos (todos)</span></div>
      <div class="s"><b style="color:var(--ok)">${totais.pres}</b><span>Presentes (todos)</span></div>
    </div>
    ${proximos.length?`<div class="card">
      <div class="sec-t">Próximos eventos</div>
      ${proximos.map(a=>`<div class="linha">
        <div class="txt">
          <div class="p1">${esc(a.proposta?.nomeAtividade||"(sem nome)")}</div>
          <div class="muted">${fmt(a.proposta?.periodoInicio)} – ${fmt(a.proposta?.periodoFim)} · ${esc(a.curso||"")} ·
            ${a.evento.ativo?"página no ar":"rascunho"} · ${numerosEventoLocal(a).inscritos} inscrito(s)</div>
        </div>
        <button class="bt bt-sec" style="padding:6px 12px;font-size:12.5px" onclick="selecionar('${esc(a.id)}')">Gerenciar →</button>
      </div>`).join("")}
    </div>`:""}
    <div class="ferramentas">
      <input id="l-busca" placeholder="Buscar evento por nome ou curso…" oninput="renderCardsPainel()">
      <span class="muted" id="l-total"></span>
    </div>
    <div id="ev-cards"></div>
    <div id="sem-evento"></div>`;
  renderCardsPainel();
}

function renderCardsPainel(){
  const q=($("l-busca")?.value||"").trim().toLowerCase();
  const bate=(a)=>!q || String(a.proposta?.nomeAtividade||"").toLowerCase().includes(q)
    || String(a.curso||"").toLowerCase().includes(q);
  const comEvento=ACOES.filter(a=>a.evento).filter(bate)
    .sort((x,y)=>Number(y.evento?.ativo===true)-Number(x.evento?.ativo===true)
      || String(y.proposta?.periodoInicio||"").localeCompare(String(x.proposta?.periodoInicio||"")));
  const semEvento=ACOES.filter(a=>!a.evento).filter(bate);
  if($("l-total")) $("l-total").textContent = comEvento.length
    ? `${comEvento.length} evento(s)${q?" no filtro":""}` : "";

  $("ev-cards").innerHTML = comEvento.length ? comEvento.map(cardLista).join("") :
    `<div class="card" style="text-align:center;padding:34px 20px">
      <div style="font-size:15px;font-weight:700;color:var(--ink)">${q?"Nenhum evento encontrado com esta busca.":"Nenhum evento ainda."}</div>
      <div class="muted" style="margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto">
        O evento nasce de uma <b>ação de extensão</b>: registre a proposta no
        <a href="/extensao/">ARCHÉ EX</a> e volte aqui para montar a página pública,
        as inscrições e o credenciamento.</div>
    </div>`;

  $("sem-evento").innerHTML = semEvento.length ? `
    <div class="card">
      <div class="sec-t">Ações sem evento</div>
      <div class="muted" style="margin-bottom:6px">Ações de extensão que você pode operar e que ainda
        não têm o evento configurado — dá para deixar tudo pronto antes mesmo da aprovação
        (só a ativação da página exige o Número da Ação).</div>
      ${semEvento.map(a=>`<div class="linha">
        <div class="txt">
          <div class="p1">${esc(a.proposta?.nomeAtividade||"(sem nome)")}</div>
          <div class="muted">${esc(a.curso||"")}${a.numeroAcao?` · ${esc(a.numeroAcao)}`:" · ainda sem número"}${a.proposta?.periodoInicio?` · ${fmt(a.proposta.periodoInicio)}–${fmt(a.proposta.periodoFim)}`:""}</div>
        </div>
        <button class="bt bt-sec" style="padding:7px 12px;font-size:12.5px" onclick="selecionar('${esc(a.id)}')">Configurar evento</button>
      </div>`).join("")}
    </div>` : "";
}

function cardLista(a){
  const ev=a.evento||{};
  const n=numerosEventoLocal(a);
  const p=a.proposta||{};
  const periodo=p.periodoInicio?`${fmt(p.periodoInicio)} – ${fmt(p.periodoFim)}`:"";
  const capa = ev.temCapa && ev.slug && ev.ativo
    ? `<img src="/api/publico/eventos/${encodeURIComponent(ev.slug)}/capa" alt="" onerror="this.remove()">` : "";
  const inicial=esc((p.nomeAtividade||"E").trim().charAt(0).toUpperCase());
  const tr=ev.transmissao||{};
  return `<button class="evcard" onclick="selecionar('${esc(a.id)}')">
    <div class="thumb">${capa||inicial}</div>
    <div class="corpo">
      <div class="nm">${esc(p.nomeAtividade||"(sem nome)")}</div>
      <div class="meta">${esc(a.curso||"")}${a.numeroAcao?` · ${esc(a.numeroAcao)}`:""}${periodo?` · ${periodo}`:""}</div>
      <div class="selos">
        <span class="badge" style="background:${ev.ativo?"var(--ok-soft)":"#eceff3"};color:${ev.ativo?"var(--ok)":"var(--muted)"}">${ev.ativo?"página no ar":"rascunho"}</span>
        ${tr.publicada?'<span class="badge" style="background:var(--wash);color:var(--brand-3)">▶ transmissão publicada</span>':""}
      </div>
      <div class="nums">${n.inscritos} inscrito(s) · ${n.presentes} presente(s) · ${(ev.programacao||[]).length} atividade(s)</div>
    </div>
  </button>`;
}

/* ========================= GESTÃO · INÍCIO ============================== */
function renderInicio(a){
  const ev=a.evento||{};
  const n=numerosEventoLocal(a);
  const tr=ev.transmissao||{};
  const link=ev.slug?location.origin+"/eventos/"+encodeURIComponent(ev.slug):"";
  const vagasTxt=Number(ev.vagas)>0?`${Math.max(0,Number(ev.vagas)-n.inscritos)} de ${ev.vagas}`:"ilimitadas";

  // pendências: o que espera um ato da coordenação
  const pend=[];
  if(!a.numeroAcao) pend.push(`⏳ <b>A ativação da página depende da aprovação da ação</b> (o Número
    da Ação sai no ARCHÉ EX) — mas o evento já pode ficar todo configurado: inscrições, página,
    programação e transmissão.`);
  if(a.numeroAcao && !ev.ativo) pend.push(`A página pública está em <b>rascunho</b> — ative na guia
    <button class="lk" onclick="nav('pagina')">Página do evento</button>.`);
  if(ev.ativo && !(ev.programacao||[]).length) pend.push(`A página está no ar <b>sem programação</b> —
    monte as atividades na guia <button class="lk" onclick="nav('programacao')">Programação</button>.`);
  if(ev.ativo && ev.inscricoesAte && ev.inscricoesAte<hojeISO()) pend.push(`O prazo de inscrição
    (${fmt(ev.inscricoesAte)}) já passou — a página segue no ar, mas sem inscrição nova.`);

  $("v-inicio").innerHTML=`
    ${pend.map(t=>`<div class="banner ${t.startsWith("⏳")?"ba-warn":"ba-info"}">${t}</div>`).join("")}
    <div class="stat" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      <div class="s"><b id="ev-cnt-insc">${n.inscritos}</b><span>Inscritos</span></div>
      <div class="s"><b id="ev-cnt-pres" style="color:var(--ok)">${n.presentes}</b><span>Presentes (credenciados)</span></div>
      <div class="s"><b id="ev-cnt-vagas">${vagasTxt}</b><span>Vagas restantes</span></div>
      <div class="s"><b>${(ev.programacao||[]).length}</b><span>Atividades</span></div>
      <div class="s"><b>${n.comentariosMural}</b><span>Mensagens no mural</span></div>
    </div>

    <div class="card">
      <div class="sec-t">Situação</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px">
        <span class="badge" style="background:${ev.ativo?"var(--ok-soft)":"#eceff3"};color:${ev.ativo?"var(--ok)":"var(--muted)"}">${ev.ativo?"página no ar":"página em rascunho"}</span>
        <span class="badge" style="background:${tr.publicada?"var(--wash)":"#eceff3"};color:${tr.publicada?"var(--brand-3)":"var(--muted)"}">${tr.publicada?"▶ transmissão publicada":"transmissão não publicada"}</span>
      </div>
      ${link&&ev.ativo?`<div class="banner ba-info" style="margin:12px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <b>Link público:</b>
        <a href="${esc(link)}" target="_blank" rel="noopener" style="word-break:break-all">${esc(link)}</a>
        <button class="bt bt-sec" style="padding:5px 10px;font-size:12px" onclick="copiarTexto('${esc(link)}',this)">⧉ copiar</button>
      </div>`:""}
      <div class="muted" style="margin-top:12px">Página pública de inscrição gratuita, credenciamento
        por QR na entrada (geral e por atividade) e transmissão online. A <b>certificação continua no
        sistema da AEE</b> — exporte a planilha na guia Exportações e importe lá.</div>
    </div>

    <div class="card">
      <div class="sec-t">Atalhos do evento</div>
      <div class="exp">
        <button class="bt bt-sec" onclick="nav('inscricoes')">Inscrições</button>

        <button class="bt bt-sec" onclick="nav('inscritos')">Inscritos e presenças</button>
        <button class="bt bt-sec" onclick="nav('credenciamento')">Credenciamento</button>
        <button class="bt bt-sec" onclick="nav('transmissao')">Transmissão e mural</button>
        <button class="bt bt-sec" onclick="nav('exportacoes')">Exportações</button>
      </div>
    </div>`;
}

/* ------------------------ editor de atividades --------------------------- */
function novaAtividadeEv(){
  EV_PROG.push({id:"",tipo:"palestra",titulo:"",descricao:"",dia:"",horaInicio:"",horaFim:"",
    local:"",responsavel:"",vagas:0,ch:"",inscricao:"geral",modalidade:"presencial"});
  renderProgEv();
}
function moverAtvEv(i,d){
  const j=i+d; if(j<0||j>=EV_PROG.length) return;
  [EV_PROG[i],EV_PROG[j]]=[EV_PROG[j],EV_PROG[i]];
  renderProgEv();
}
/* Editor das atividades: um card por atividade. O id é preservado escondido
   no próprio objeto — é ele que os inscritos marcaram, e mudar id romperia
   os vínculos. */
function renderProgEv(){
  const el=$("ev-prog"); if(!el) return;
  el.innerHTML = EV_PROG.length ? EV_PROG.map((p,i)=>`
    <div class="atv-card">
      <div class="g-atv">
        <select onchange="EV_PROG[${i}].tipo=this.value">
          ${TIPOS_ATV.map(t=>`<option value="${esc(t.codigo)}" ${p.tipo===t.codigo?"selected":""}>${esc(t.rotulo)}</option>`).join("")}</select>
        <input type="date" value="${esc(p.dia)}" oninput="EV_PROG[${i}].dia=this.value">
        <input type="time" title="hora de início" value="${esc(p.horaInicio)}" oninput="EV_PROG[${i}].horaInicio=this.value">
        <input type="time" title="hora de término" value="${esc(p.horaFim)}" oninput="EV_PROG[${i}].horaFim=this.value">
        <span style="display:flex;gap:4px;justify-content:flex-end">
          <button class="bt bt-ghost" style="padding:5px 9px;font-size:12px" title="subir" ${i===0?"disabled":""} onclick="moverAtvEv(${i},-1)">↑</button>
          <button class="bt bt-ghost" style="padding:5px 9px;font-size:12px" title="descer" ${i===EV_PROG.length-1?"disabled":""} onclick="moverAtvEv(${i},1)">↓</button>
          <button class="bt bt-ghost" style="padding:5px 9px;font-size:12px;color:var(--err)" title="remover atividade" onclick="EV_PROG.splice(${i},1);renderProgEv()">✕</button>
        </span>
      </div>
      <input placeholder="título da atividade *" value="${esc(p.titulo)}" oninput="EV_PROG[${i}].titulo=this.value" style="margin-top:8px">
      <div class="g-atv2">
        <input placeholder="responsável / ministrante" value="${esc(p.responsavel)}" oninput="EV_PROG[${i}].responsavel=this.value">
        <input placeholder="local / sala" value="${esc(p.local)}" oninput="EV_PROG[${i}].local=this.value">
        <input type="number" min="0" placeholder="vagas" title="vagas da atividade (0 = sem limite próprio)" value="${p.vagas||""}" oninput="EV_PROG[${i}].vagas=this.value">
        <input placeholder="CH (4h)" title="carga horária da atividade — usada no export da AEE por atividade" value="${esc(p.ch)}" oninput="EV_PROG[${i}].ch=this.value">
      </div>
      <div style="display:flex;gap:18px;align-items:center;margin-top:8px;flex-wrap:wrap">
        <label class="chk" style="margin:0;font-size:12.5px">
          <input type="checkbox" ${p.inscricao==="propria"?"checked":""}
            onchange="EV_PROG[${i}].inscricao=this.checked?'propria':'geral'">
          exige inscrição própria (o participante marca; conta vaga)</label>
        <label class="chk" style="margin:0;font-size:12.5px">
          modalidade

/* ----------------------------- capa ------------------------------------- */
function lerCapaEv(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ alert("A capa deve ser JPEG, PNG ou WebP."); inp.value=""; return; }
  if(f.size>500*1024){ alert("A capa passa de 500 KB — reduza a imagem antes de enviar."); inp.value=""; return; }
  const r=new FileReader();
  r.onload=()=>{
    EV_CAPA=String(r.result||"");
    const prev=$("ev-capa-prev");
    if(prev) prev.innerHTML=`<img src="${EV_CAPA}" alt="capa nova" style="height:64px;border-radius:8px;border:1px solid var(--line)">
      <span class="muted" style="font-size:12px;display:block">prévia — grava no "Salvar página"</span>`;
  };
  r.readAsDataURL(f);
}
function removerCapaEv(){
  EV_CAPA="";
  const prev=$("ev-capa-prev");
  if(prev) prev.innerHTML='<span class="muted" style="font-size:12.5px">capa marcada para remoção — grava no "Salvar página".</span>';
  const inp=$("ev-capa-file"); if(inp) inp.value="";
}

/* --------------------------- mural (moderação) --------------------------- */
function renderMuralEv(a){

    <div class="linha" style="align-items:flex-start;${m.oculto?"opacity:.55":""}">
      <div class="txt">
        <div class="p1">${esc(m.nome||"—")} <span class="muted" style="font-weight:400">· ${fmtDataHora(m.em)}</span>
          ${m.oculto?'<span class="badge" style="background:var(--err-soft);color:var(--err);margin-left:6px">oculta</span>':""}</div>
        <div style="font-size:13px;color:var(--ink-soft);white-space:pre-line;margin-top:2px">${esc(m.texto||"")}</div>
      </div>
      <button class="bt ${m.oculto?"bt-ok":"bt-ghost"}" style="padding:4px 10px;font-size:11.5px"
        onclick="moderarMural('${esc(a.id)}','${esc(m.id)}',${m.oculto?"false":"true"})">${m.oculto?"reexibir":"ocultar"}</button>

    : '<div class="cnt">— nenhuma mensagem no mural ainda.</div>';
}
async function moderarMural(id,mid,oculto){
  try{
    const r=await fetch(`/api/extensao/${id}/mural/${encodeURIComponent(mid)}`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({oculto})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    const a=ACOES.find(x=>x.id===id);
    const m=a?.evento?.mural?.find(x=>x.id===mid);
    if(m) m.oculto=oculto;
    renderMuralEv(a);
  }catch(e){ alert("Não foi possível moderar: "+e.message); }
}

/* ------------------------ inscritos e presenças -------------------------- */
function renderInscritosEv(a){
  const el=$("ev-inscritos"); if(!el||!a) return;
  const q=($("ev-busca")?.value||"").trim().toLowerCase();
  const todos=a.participantes?.inscritos||[];
  const prog=a.evento?.programacao||[];
  const tituloAtv=(id)=>prog.find(p=>p?.id===id)?.titulo||"?";
  const lista=todos.filter(x=>!q
    || String(x.nome||"").toLowerCase().includes(q)
    || String(x.email||"").toLowerCase().includes(q)
    || String(x.cpf||"").replace(/\D/g,"").includes(q.replace(/\D/g,"")||"§"));
  const hora=(iso)=>{ try{ return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch{ return ""; } };
  el.innerHTML = lista.length ? `<table class="pt">
    <thead><tr><th>Nome</th><th>Contato</th><th>Origem</th><th>Código</th><th>Atividades</th><th>Presença</th></tr></thead>
    <tbody>${lista.map(x=>{
      const marcadas=(x.atividades||[]).map(tituloAtv);
      const porAtv=(x.presencas||[]).filter(p=>p&&p.atividade);
      return `<tr>
      <td>${esc(x.nome)}</td>
      <td>${esc(x.email||"")}${x.telefone?`<br><span class="muted">${esc(x.telefone)}</span>`:""}</td>
      <td>${x.origem==="online"?`online${x.inscritoEm?` <span class="muted">${esc(hora(x.inscritoEm))}</span>`:""}`:"lista da coordenação"}</td>
      <td style="font-family:ui-monospace,monospace">${x.token?esc(x.token.slice(0,6).toUpperCase()):"—"}</td>
      <td title="${esc(marcadas.join(" · "))}">${marcadas.length||"—"}</td>
      <td>${x.presente===true
        ? `<span class="badge" style="background:var(--ok-soft);color:var(--ok)" title="${esc(porAtv.map(p=>tituloAtv(p.atividade)).join(" · "))}">✓ ${esc(hora(x.presenteEm))}${porAtv.length?` · ${porAtv.length} atv`:""}</span>
           <button class="lk" style="margin-left:6px;font-size:11px" title="Desfazer a presença geral"
             onclick="marcarPresencaEv('${esc(a.id)}','${esc(x.token||"")}','${esc(x.cpf||"")}','${esc(x.email||"")}',false)">desfazer</button>
           ${$("ev-atv-sel")?.value?`<button class="bt bt-sec" style="padding:2px 9px;font-size:11px;margin-left:4px" title="Registrar presença também na atividade escolhida acima"
             onclick="presencaAtividadeEv('${esc(a.id)}','${esc(x.token||"")}','${esc(x.cpf||"")}','${esc(x.email||"")}')">＋ na atividade</button>`:""}`
        : `<button class="bt bt-sec" style="padding:2px 9px;font-size:11px" title="Marcar presença à mão — na atividade escolhida acima (quem tem QR) ou na entrada geral"
             onclick="presencaManualEv('${esc(a.id)}','${esc(x.token||"")}','${esc(x.cpf||"")}','${esc(x.email||"")}')">✓ presente</button>`}</td>
    </tr>`;}).join("")}</tbody></table>
    <div class="cnt">${lista.length} de ${todos.length} inscrito(s)${q?" no filtro":""}.</div>`
    : `<div class="cnt">— ${todos.length?"ninguém encontrado com esta busca.":"nenhum inscrito ainda."}</div>`;
}

/* Atualiza os números da guia aberta sem tocar em formulário: cada bloco só
   existe numa guia, e quem não está na tela é ignorado. */
function atualizarContadoresEvento(a){
  const inscritos=a.participantes?.inscritos||[];
  const ev=a.evento||{};
  if($("ev-cnt-insc")) $("ev-cnt-insc").textContent=inscritos.length;
  if($("ev-cnt-pres")) $("ev-cnt-pres").textContent=inscritos.filter(x=>x.presente===true).length;
  if($("ev-cnt-vagas")) $("ev-cnt-vagas").textContent=Number(ev.vagas)>0
    ? `${Math.max(0,Number(ev.vagas)-inscritos.length)} de ${ev.vagas}` : "ilimitadas";
  if($("ev-cnt-atv")) $("ev-cnt-atv").innerHTML=contadoresAtividadeHtml(a)
    ||'<div class="cnt">— sem atividade com inscrição própria ou presença registrada.</div>';
  renderMuralEv(a);
}

/* Contadores "ao vivo" no dia do evento: enquanto uma guia de evento está
   aberta e a página do evento ativa, recarrega a cada 30 s — só números, a
   tabela de inscritos e o mural, sem tocar nos formulários (senão o
   refresco apagaria o que se digita). */
function agendarEvento(id){
  clearInterval(EV_TIMER);
  const a0=ACOES.find(x=>x.id===id);
  if(!a0?.evento?.ativo) return;
  EV_TIMER=setInterval(async()=>{
    const meta=SECOES.find(s=>s.k===SECAO);
    if(!meta?.evento||ABERTO!==id){ clearInterval(EV_TIMER); return; }
    try{
      await carregar();
      const a=ACOES.find(x=>x.id===id); if(!a) return;
      atualizarContadoresEvento(a); renderInscritosEv(a);
    }catch{ /* sem rede agora — a próxima volta tenta de novo */ }
  },30000);
}

async function atualizarEvento(id){
  try{ await carregar(); }catch(e){ alert(e.message); return; }
  montarSeletor();
  nav(SECAO);
}

/* presença manual (gestão): para quem veio da lista da coordenação (sem QR)
   ou assinou o papel — o credenciamento por QR é dos inscritos online.
   SEMPRE pela rota autenticada da gestão: o registro sai assinado
   "gestão (email)", nunca "monitor". */
async function marcarPresencaEv(id, token, cpf, email, presente){
  try{
    const r=await fetch("/api/extensao/"+id+"/presenca",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token,cpf,email,presente})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    await carregar();
    const a=ACOES.find(x=>x.id===id);
    if(a){ atualizarContadoresEvento(a); renderInscritosEv(a); }
  }catch(e){ alert("Não foi possível marcar a presença: "+e.message); }
}
/* Presença manual COM atividade — mesma rota autenticada; funciona também
   para o inscrito da lista em papel, sem token: a rota acha por CPF/e-mail. */
async function presencaAtividadeEv(id, token, cpf, email){
  const atv=$("ev-atv-sel")?.value||"";
  try{
    const r=await fetch("/api/extensao/"+id+"/presenca",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token, cpf, email, atividade:atv, presente:true})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    await carregar();
    const a2=ACOES.find(x=>x.id===id);
    if(a2){ atualizarContadoresEvento(a2); renderInscritosEv(a2); }
  }catch(e){ alert("Não foi possível registrar na atividade: "+e.message); }
}
function presencaManualEv(id, token, cpf, email){
  const atv=$("ev-atv-sel")?.value||"";
  if(atv) return presencaAtividadeEv(id, token, cpf, email);
  return marcarPresencaEv(id, token, cpf, email, true);
}

/* --------------------------- salvar / publicar ---------------------------
   Cada guia salva SÓ o que edita: a rota do evento aplica campo a campo o
   que veio no corpo, então o que a guia não mandou fica exatamente como
   está. Nunca se envia a configuração inteira de uma vez. */
async function salvarParteEvento(id, body){
  const msg=$("ev-msg"); if(msg) msg.textContent="Salvando…";
  try{
    const r=await fetch(`/api/extensao/${id}/evento`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||r.status);
    await carregar(); montarSeletor(); nav(SECAO);
    const m=$("ev-msg"); if(m){ m.textContent="✓ salvo"; setTimeout(()=>{ if($("ev-msg")) $("ev-msg").textContent=""; },3000); }
    return true;
  }catch(e){
    if($("ev-msg")) $("ev-msg").textContent="";
    alert("Não foi possível salvar o evento: "+e.message);
    return false;
  }
}

/* Página do evento: ativação, endereço, descrição, local e capa. A capa só
   entra no corpo quando a tela mexeu nela — mandar sempre apagaria a que
   está gravada (o payload nunca traz o base64 de volta). */
function salvarPagina(id){
  const body={
    ativo:$("ev-ativo")?.checked||false,
    descricao:$("ev-desc")?.value||"",
    local:$("ev-local")?.value||"",
  };
  if(EV_CAPA!==undefined) body.capa=EV_CAPA;
  const slugEl=$("ev-slug");
  if(slugEl&&slugEl.value.trim()) body.slug=slugEl.value.trim();
  return salvarParteEvento(id, body);
}

/* Inscrições: vagas, prazo, campos extras e o texto LGPD. */
function salvarInscricoes(id){
  return salvarParteEvento(id, {
    vagas:$("ev-vagas")?.value||0,
    inscricoesAte:$("ev-prazo")?.value||"",
    formulario:EV_FORM.map(c=>({ id:c.id||"", rotulo:c.rotulo||"", tipo:c.tipo||"texto",
      opcoes:String(c.opcoesTxt||"").split(",").map(s=>s.trim()).filter(Boolean),
      obrigatorio:!!c.obrigatorio, instrucoes:c.instrucoes||"" })),
    lgpdTexto:$("ev-lgpd")?.value||"",
  });
}

/* Programação: só a lista de atividades — os ids vão preservados no próprio
   objeto (são a chave das marcações dos inscritos). */
function salvarProgramacao(id){
  return salvarParteEvento(id, {programacao:EV_PROG});
}

function lerTransmissaoEv(publicada){
  const tipo=$("ev-tr-tipo")?.value||"";
  const valor=$("ev-tr-link")?.value.trim()||"";
  return {
    tipo,
    youtubeId: tipo==="youtube"?valor:"",     // URL ou ID — o servidor extrai
    zoomUrl: tipo==="zoom"?valor:"",
    chatYoutube: $("ev-tr-chat")?.checked||false,
    presencaMinutos: Number($("ev-tr-min")?.value)||0,
    publicada,
  };
}
/* Transmissão: sem o parâmetro, publicar/recolher não muda no salvar comum. */
function salvarTransmissao(id,{publicada}={}){
  const atual=ACOES.find(x=>x.id===id);
  const pub = publicada===undefined ? atual?.evento?.transmissao?.publicada===true : publicada;
  return salvarParteEvento(id, {transmissao:lerTransmissaoEv(pub)});
}

/* Publicar/recolher é o interruptor explícito da transmissão — passa pelo
   MESMO salvar da guia, só virando a chave `publicada`. */
async function publicarTransmissaoEv(id, publicar){
  if(publicar && !($("ev-tr-tipo")?.value))
    return alert("Escolha o tipo da transmissão (YouTube ou Zoom) e informe o link antes de publicar.");
  if(!publicar && !confirm("Recolher a transmissão?\n\nA página de assistir deixa de funcionar para os inscritos até você publicar de novo.")) return;
  await salvarTransmissao(id, {publicada:publicar});
}

function mostrarMonitorEv(bt){
  const el=$("ev-moncode"); if(!el) return;
  const oculto=el.textContent.includes("•");

async function regenerarMonitorEv(id){
  if(!confirm("Gerar um NOVO código do monitor?\n\nO código atual deixa de valer na hora — a equipe da porta precisa receber o novo.")) return;

    if(!r.ok) throw new Error(j.error||r.status);
    await carregar(); montarSeletor(); nav(SECAO);

}

function copiarTexto(txt,bt){
  (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>{
    const t=bt.textContent; bt.textContent="✓ copiado"; setTimeout(()=>bt.textContent=t,2000);
  }).catch(()=>prompt("Copie o endereço:",txt));
}

/* A lista em PAPEL — contingência do dia: se o celular do monitor falhar,

    <tbody>${inscritos.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.nome||"")}</td>
      <td>${esc(fmtCPF(x.cpf||"")||x.matricula||"")}</td>

      <td class="ass"></td></tr>`).join("")}</tbody></table></body></html>`);

}

/* ================================ INIT ================================== */
(async function init(){
  try{
    const r = await fetch("/api/me");
    if(r.status===401){ location.href="/entrar?next="+encodeURIComponent(location.pathname); return; }
    ME = await r.json();
    if(ME.papel==="pendente"){ location.href="/entrar?pendente=1"; return; }
    EU = ME.email||"";
  }catch{ /* segue sem sessão (modo dev) — a guarda de verdade é a do servidor */ }
  try{ await carregar(); }
  catch(e){
    montarSidebar();
    $("v-painel").innerHTML=`<div class="card">⚠ ${esc(e.message)}</div>`;
    $("v-painel").classList.remove("hide");
    return;
  }
  montarSidebar();
  // deep-link: "#<guia>" ou "#<guia>/<id>"; o formato antigo "#e/<id>"
  // (da tela anterior a esta casca) vira "#inicio/<id>"
  let guia="painel";
  let m=location.hash.match(/^#e\/(.+)$/);
  if(m){
    const id=decodeURIComponent(m[1]);
    if(ACOES.some(a=>a.id===id)){ ABERTO=id; guia="inicio"; }
  }else{
    m=location.hash.match(/^#([a-z]+)(?:\/(.+))?$/);
    if(m && SECOES.some(s=>s.k===m[1])){
      guia=m[1];
      if(m[2]){
        const id=decodeURIComponent(m[2]);
        if(ACOES.some(a=>a.id===id)) ABERTO=id;
      }
    }
  }
  montarSeletor();
  nav(guia);
})();
