<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evento — UNIEGO</title>
<!-- A PRÉVIA DO LINK (set/2026, achado do dono: "copiei e colei o link do evento
     no WhatsApp e o resumo da página deu só 'Evento'"). Esta página é uma SPA:
     o nome do evento e a arte só existem DEPOIS de o JavaScript rodar, e o robô
     do WhatsApp não roda JavaScript — ele lê o HTML como veio e encontra este
     título genérico. Por isso o SERVIDOR troca a linha abaixo pelas og:* do
     evento (`paginaDoEvento` em server.js) antes de mandar a página: nome,
     descrição e a arte cadastrada no ARCHÉ EV. Não remova o marcador. -->
<!--ARCHE-OG-->
<link rel="icon" href="/arche/favicon.svg">
<link rel="stylesheet" href="/assets/arche-ui.css">
<style>
  /* Página PÚBLICA do evento (servida em /eventos/<slug>): o slug sai do
     próprio endereço. Nada aqui exige login; a API só devolve o retrato
     institucional do evento — a lista de inscritos nunca sai por ela.
     O desenho é mobile-first: quem se inscreve chega pelo celular. */
  .selo{font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .selo.b{background:var(--ok-soft);color:var(--ok)}
  .selo.e{background:var(--warn-soft);color:var(--warn)}
  .selo.v{background:var(--wash);color:var(--muted)}

  /* ------------------------------- hero --------------------------------- */
  /* A capa (quando o evento tem) entra como fundo com um véu escuro por
     cima — o texto branco precisa ler em qualquer fotografia; sem capa, o
     gradiente da marca faz o mesmo papel. */
  .hero-ev{border-radius:20px;overflow:hidden;margin-top:20px;color:#fff;position:relative;
    background:linear-gradient(135deg,#1c3742 0%,#2d535c 55%,#40717e 100%);
    background-size:cover;background-position:center;box-shadow:var(--shadow-lg)}
  .hero-in{padding:44px 34px 36px;background:linear-gradient(180deg,rgba(16,32,39,.58) 0%,rgba(16,32,39,.82) 100%)}
  .hero-ev .eyebrow{color:#a9dff0}
  .hero-ev h1{font-family:'Archivo',sans-serif;font-size:34px;font-weight:800;letter-spacing:-.02em;
    line-height:1.12;margin:12px 0 0;text-wrap:balance}
  .hero-meta{font-size:14.5px;margin-top:12px;line-height:1.6;color:#e9f3f7}
  .hero-meta b{color:#fff}
  .hero-selos{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .hero-selos .selo{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .hero-selos .selo.on{background:rgba(113,200,226,.28);border-color:rgba(113,200,226,.6)}
  .hero-cta{margin-top:22px}
  @media(max-width:640px){.hero-in{padding:30px 20px 26px}.hero-ev h1{font-size:26px}}

  /* botão flutuante persistente — some depois da inscrição feita */
  .flutua{position:fixed;right:18px;bottom:18px;z-index:40;box-shadow:0 10px 30px -8px rgba(20,45,55,.6)}

  /* --------------------------- programação ------------------------------ */
  .abas{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-top:14px}
  .aba{flex:none;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink-soft);
    border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
    font-family:'IBM Plex Sans',system-ui,sans-serif}
  .aba.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .atv{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;background:var(--card)}
  .atv-topo{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .atv-h{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;color:var(--brand-2);white-space:nowrap}
  .atv-t{font-weight:600;font-size:15px;color:var(--ink);flex:1;min-width:200px}
  .atv-meta{font-size:12.5px;color:var(--muted);margin-top:5px}
  .atv-selos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .atv details{margin-top:8px}
  .atv summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--brand-2)}
  .atv details p{font-size:13.5px;color:var(--ink-soft);margin-top:6px;white-space:pre-line;line-height:1.6}
  /* etiqueta do tipo de atividade — cores discretas, uma por tipo */
  .tp{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    border-radius:6px;padding:2px 8px;white-space:nowrap}
  .tp-palestra{background:#e6f5fa;color:#2d535c}
  .tp-minicurso{background:#e8f5e9;color:#2e7d32}
  .tp-oficina{background:#fff3e0;color:#b26a00}
  .tp-curso{background:#ecebf6;color:#5e5091}
  .tp-mesa{background:#fdecea;color:#a1524c}
  .tp-roda{background:#eef3f5;color:#40717e}
  .tp-mostra{background:#f5e9f0;color:#a14c7c}
  .tp-apresentacao{background:#e9eef5;color:#35608d}
  .tp-outro{background:#eceff3;color:#657179}

  /* ---------------------------- inscrição ------------------------------- */
  .duas{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start;margin-top:22px}
  @media(max-width:860px){.duas{grid-template-columns:1fr}}
  .msg-erro{background:var(--err-soft);color:var(--err);border-radius:10px;padding:11px 14px;
    font-size:13.5px;font-weight:600;margin-top:12px}
  .msg-ok{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:11px 14px;
    font-size:13.5px;font-weight:600;margin-top:12px}
  /* o aviso do preenchimento automático fica recolhido: uma linha só, que
     abre quando o visitante quiser saber de onde vieram os dados */
  details.av-conta{margin:0 0 14px;padding:0}
  details.av-conta summary{cursor:pointer;list-style:none;padding:9px 14px;font-size:13px;font-weight:600}
  details.av-conta summary::-webkit-details-marker{display:none}
  details.av-conta summary::after{content:" ⌄";opacity:.7}
  details.av-conta[open] summary::after{content:" ⌃"}
  .av-conta-corpo{padding:0 14px 12px;font-size:13px;font-weight:500;line-height:1.55}
  .av-conta-corpo button{display:block;margin-top:8px;background:none;border:0;padding:0;
    color:inherit;text-decoration:underline;cursor:pointer;font:inherit;font-weight:600}
  .msg-aviso{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:11px 14px;
    font-size:13px;font-weight:500;margin-top:10px;line-height:1.55}
  .card + .card{margin-top:20px}
  details.reenvio summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--brand-2);margin-top:14px}
  .qr-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:inline-block}
  .qr-box img{width:180px;height:180px;display:block}
  .chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13.5px;color:var(--ink-soft);
    line-height:1.5;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500}
  .chk input{margin-top:3px}
  .esc-dia{font-family:'Archivo',sans-serif;font-weight:700;font-size:12.5px;color:var(--brand-2);
    margin:12px 0 4px;letter-spacing:.02em}
  .esc-atv{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);
    border-radius:10px;margin-top:6px;cursor:pointer;transition:.15s;font-weight:500;
    text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)}
  .esc-atv:hover{border-color:var(--brand-2)}
  .esc-atv input{margin-top:3px}
  .esc-atv .d{flex:1;min-width:0}
  .esc-atv .m{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  .esc-atv.lotada{opacity:.55;cursor:not-allowed}
  /* linha de valor na chamada da inscrição: é leitura, não escolha — mesmo
     desenho da categoria do formulário, sem cursor de clique e sem hover */
  .val-cat{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);
    border-radius:10px;margin-top:6px;font-weight:500;font-size:13.5px;color:var(--ink)}
  .val-cat .m{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  /* a tabela dos lotes: quanto custa em cada período, com o de hoje marcado.
     Ela rola na horizontal no celular — a página nunca rola de lado */
  .rolo-lotes{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
  .tab-lotes{border-collapse:collapse;width:100%;min-width:340px;font-size:13px}
  .tab-lotes th,.tab-lotes td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  .tab-lotes th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .tab-lotes td+td,.tab-lotes th+th{text-align:right}
  .tab-lotes th:nth-child(2),.tab-lotes td:nth-child(2){text-align:left}
  .tab-lotes tbody tr:last-child td{border-bottom:0}
  .tab-lotes tr.agora{background:var(--wash)}
  .tab-lotes tr.agora td{font-weight:700;color:var(--brand)}
  .tab-lotes .agora-selo{display:inline-block;background:var(--brand);color:#fff;border-radius:20px;
    padding:1px 7px;font-size:10px;font-weight:700;letter-spacing:.03em;margin-left:6px;vertical-align:1px}
  .tab-lotes tr.passou td{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
  .dica-campo{font-size:11.5px;color:var(--muted);margin:-6px 0 2px}
  .lgpd-box{background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    font-size:12px;color:var(--ink-soft);line-height:1.6;max-height:170px;overflow-y:auto;margin-top:8px}
  .secao-t{font-family:'Archivo',sans-serif;font-weight:700;font-size:22px;color:var(--ink);
    letter-spacing:-.01em;margin:34px 0 4px}
  .secao-s{font-size:13px;color:var(--muted)}
  /* ------------------- palestrantes (banner rotativo) -------------------- */
  .pal-wrap{position:relative;margin-top:14px}
  .pal-palco{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:var(--shadow);display:grid;grid-template-columns:230px 1fr;min-height:230px}
  .pal-foto{background:linear-gradient(135deg,#1c3742,#40717e);position:relative}
  .pal-foto img{width:100%;height:100%;object-fit:cover;display:block}
  .pal-foto .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;opacity:.4;font-family:'Archivo',sans-serif;font-size:64px;font-weight:800}
  .pal-txt{padding:24px 26px;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .pal-nome{font-family:'Archivo',sans-serif;font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
  .pal-inst{font-size:13px;color:var(--brand-2);font-weight:600}
  .pal-bio{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-top:4px}
  .pal-atv{font-size:14px;color:var(--ink);margin-top:10px;border-top:1px solid var(--line-soft);padding-top:10px}
  .pal-atv b{color:var(--brand)}
  .pal-quando{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);margin-top:3px}
  .pal-navs{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .pal-mini{width:44px;height:44px;border-radius:50%;border:2px solid transparent;overflow:hidden;
    cursor:pointer;background:linear-gradient(135deg,#1c3742,#40717e);padding:0;flex:none;transition:.15s}
  .pal-mini img{width:100%;height:100%;object-fit:cover;display:block}
  .pal-mini span{color:#fff;font-weight:700;font-size:15px;line-height:40px;display:block}
  .pal-mini.on{border-color:var(--brand-2);transform:scale(1.12)}
  .pal-seta{position:absolute;top:96px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.94);color:var(--brand);font-size:17px;cursor:pointer;display:grid;place-items:center;
    box-shadow:var(--shadow);z-index:2}
  .pal-seta.esq{left:-14px}.pal-seta.dir{right:-14px}
  @media(max-width:640px){
    .pal-palco{grid-template-columns:1fr}
    .pal-foto{height:220px}
    .pal-seta{top:auto;bottom:-8px}.pal-seta.esq{left:8px}.pal-seta.dir{right:8px}
  }
  /* miniatura de quem ministra, na linha da programação */
  .atv-quem{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--ink-soft)}
  .atv-quem img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}

  /* --------------------------- blocos da página -------------------------- */
  /* a barra de seções sangra até a borda do <main>, e por isso a margem
     negativa tem de ser EXATAMENTE o padding dele (26px, 18px abaixo de
     760px em arche-ui.css). Com o -20px fixo de antes, no celular ela passava
     2px de cada lado e a PÁGINA INTEIRA rolava na horizontal. */
  .subnav{position:sticky;top:0;z-index:30;background:rgba(238,241,244,.92);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);margin:18px -26px 0;padding:10px 26px;display:flex;gap:8px;
    overflow-x:auto;white-space:nowrap}
  @media(max-width:760px){.subnav{margin:18px -18px 0;padding:10px 18px}}
  .subnav a{font-size:13px;font-weight:600;color:var(--ink-soft);text-decoration:none;padding:6px 12px;
    border-radius:999px;border:1px solid transparent}
  .subnav a:hover{background:var(--card);border-color:var(--line);color:var(--brand)}
  .prazos{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .prazo{background:var(--wash);border-radius:10px;padding:10px 14px;min-width:150px}
  .prazo b{display:block;font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--brand)}
  .prazo span{font-size:12px;color:var(--muted)}
  .anais-li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line-soft)}
  .anais-li:first-child{border-top:0}
  /* vídeo do bloco: 16:9 responsivo, sem biblioteca */
  .video-wrap{position:relative;padding-top:56.25%;margin-top:12px;border-radius:16px;overflow:hidden;
    background:#000;box-shadow:var(--shadow)}
  .video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  /* mídias sociais */
  .redes{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .rede{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:9px 16px;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:600;
    transition:.15s}
  .rede:hover{border-color:var(--brand-2);color:var(--brand);transform:translateY(-1px)}
  .rede svg{flex:none}
  .rede-instagram:hover{color:#c13584}.rede-facebook:hover{color:#1877f2}.rede-youtube:hover{color:#ff0000}
  .rede-linkedin:hover{color:#0a66c2}.rede-tiktok:hover{color:#010101}.rede-whatsapp:hover{color:#25d366}
  .rede-telegram:hover{color:#229ed9}
  /* APOIO (set/2026): quem realiza, patrocina e apoia é parceria institucional
     — no tamanho de antes (44 px de altura numa caixa de 64) o logotipo virava
     miniatura, e patrocinador em miniatura não é patrocinador reconhecido.
     A REALIZAÇÃO tem um degrau a mais: é quem responde pelo evento. */
  .apoio-grupo{margin-top:22px}
  .apoio-t{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .apoio-grade{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch;margin-top:12px}
  /* o bloco de imagens (set/2026): grade de fotos com legenda, na ordem da lista */
  .galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
  .galeria-item{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .galeria-item img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
  .galeria-item figcaption{font-size:12.5px;color:var(--ink-soft);padding:8px 10px;line-height:1.45}
  @media(max-width:520px){.galeria{grid-template-columns:repeat(2,1fr);gap:8px}}
  .apoio-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 24px;
    display:flex;align-items:center;justify-content:center;gap:10px;min-height:104px;min-width:150px;
    text-decoration:none;color:var(--ink-soft);font-size:14px;font-weight:600;text-align:center;
    transition:border-color .15s,box-shadow .15s,transform .15s}
  .apoio-item img{height:64px;width:auto;max-width:230px;object-fit:contain;display:block}
  a.apoio-item:hover{border-color:var(--brand-2);box-shadow:0 6px 18px rgba(28,55,66,.10);transform:translateY(-2px)}
  .apoio-grupo-realizacao .apoio-item{min-height:132px;padding:20px 28px;min-width:180px}
  .apoio-grupo-realizacao .apoio-item img{height:88px;max-width:280px}
  @media(max-width:520px){
    .apoio-grade{gap:12px}
    .apoio-item{padding:14px 16px;min-height:88px;min-width:120px;flex:1 1 140px}
    .apoio-item img{height:52px;max-width:100%}
    .apoio-grupo-realizacao .apoio-item{min-height:108px;padding:16px 18px}
    .apoio-grupo-realizacao .apoio-item img{height:70px;max-width:100%}
  }
  .org{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .org .quadro{background:var(--wash);border-radius:12px;padding:12px 18px;font-size:13.5px}
  .org .quadro b{display:block;color:var(--brand)}
</style>
<link rel="stylesheet" href="/assets/arche-celular.css"><!-- a camada do celular: campo de 16px (o iPhone amplia a página em campo menor), alvo de toque e rótulo legível. Vai por ÚLTIMO, depois do estilo da página, que é o que a faz vencer na cascata. -->
</head>
<body>
<header class="topo">
  <div class="topo-rule"></div>
  <div class="topo-inner">
    <img class="u" src="/assets/logo-uniego.png" alt="UNIEGO" onerror="this.style.display='none'">
    <div class="vr"></div>
    <div class="topo-txt">
      <div class="topo-t"><span class="arche-wm"><span class="arche-tx">Eventos</span></span></div>
      <div class="topo-s">Extensão · PROPPEX · Centro Universitário Evangélico de Goianésia — UNIEGO</div>
    </div>
    <nav class="topo-nav"><a id="lk-participante" href="#" hidden>Área do inscrito</a><a href="/eventos/">Todos os eventos</a><a href="/">Portal</a></nav>
  </div>
</header>

<main id="main"><div class="card" style="margin-top:20px"><p style="color:var(--muted)">Carregando…</p></div></main>
<a class="bt bt-pri flutua" id="cta-flutua" href="#" style="display:none">Inscreva-se</a>

<footer>
  <img class="u" src="/assets/logo-uniego.png" alt="UNIEGO" onerror="this.style.display='none'">
  <div class="sep"></div>
  <p>PROPPEX — Pró-Reitoria de Pós-Graduação, Pesquisa, Extensão e Ação Comunitária.<br>
    Página pública · dados fornecidos pelo sistema ARCHÉ.</p>
</footer>

<script src="/assets/arche-wallet.js"></script>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => (/^\d{4}-\d{2}-\d{2}$/.test(String(iso || "")) ? iso.split("-").reverse().join("/") : "—");
const $ = (id) => document.getElementById(id);
// o slug é o primeiro segmento depois de /eventos/
const SLUG = decodeURIComponent((location.pathname.match(/^\/eventos\/([^/]+)/) || [])[1] || "");
/* A FICHA DE INSCRIÇÃO (/eventos/<slug>/inscrever, set/2026): o mesmo arquivo,
   sem o hotsite — só o cabeçalho do evento e o formulário. O dono pediu a
   página do evento mais fluida ("coloque só um botão de Inscreva-se"), e o
   formulário inteiro dentro dela — nome, CPF, e-mail, telefone, categoria,
   LGPD — era metade da poluição. Aqui não se duplica nada: é o modo em que a
   página já desenhava o evento SEM hotsite. */
const FICHA = /^\/eventos\/[^/]+\/inscrever\/?$/.test(location.pathname);
let EV = null;
let ME = null;   // a conta logada (o /api/me), consultada ANTES de desenhar: decide se o formulário aparece
/* A SITUAÇÃO DA CONTA NESTE EVENTO (set/2026, pedido do dono: "se não estiver
   logado, aparecer Inscreva-se; se logado mas não inscrito, Inscreva-se; se
   logado e inscrito, Acesse a área do inscrito"). Vem da rota CURTA
   `/minha-inscricao` — quatro campos —, e não da área do inscrito, que
   devolveria o evento inteiro só para escolher o rótulo de um botão. */
let MINHA = { logado: false, inscrito: false, valida: false, pagamentoPendente: false };
// o botão da carteira digital só existe onde a instituição tem a conta de emissor
let WALLET = false;
let DIA_SEL = "";                 // aba de dia escolhida na programação
let ESCOLHIDAS = new Set();       // ids das atividades marcadas no formulário
let VOUCHER = "";                 // o código de desconto aplicado (o servidor o confere de novo ao inscrever)

/* O VOUCHER (set/2026): a pessoa digita o código, o servidor diz se vale
   para a categoria marcada e quanto fica — o mesmo cálculo da inscrição.
   Trocar de categoria reconfere, porque o voucher pode valer só para uma. */
async function aplicarVoucher() {
  const inp = $("i-voucher"), out = $("i-voucher-msg");
  if (!inp || !out) return;
  const codigo = inp.value.trim().toUpperCase();
  if (!codigo) { VOUCHER = ""; out.innerHTML = ""; return; }
  const categoria = document.querySelector('input[name="i-categoria"]:checked')?.value || "";
  out.innerHTML = `<span style="color:var(--muted)">Conferindo…</span>`;
  try {
    const r = await fetch(`/api/publico/eventos/${encodeURIComponent(SLUG)}/voucher?codigo=${encodeURIComponent(codigo)}&categoria=${encodeURIComponent(categoria)}`);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Não foi possível conferir o voucher agora.");
    if (!j.ok) { VOUCHER = ""; out.innerHTML = `<span style="color:var(--err)">${esc(j.motivo)}</span>`; return; }
    VOUCHER = j.codigo;
    out.innerHTML = `<span style="color:var(--ok);font-weight:600">✓ Voucher ${esc(j.codigo)} aplicado — desconto de ${esc(j.descontoTexto)} (${reais(j.desconto)}): ${j.gratuita ? "a inscrição fica <b>gratuita</b>" : `você paga <b>${reais(j.valor)}</b>${j.valorCartao > j.valor ? ` no Pix (${reais(j.valorCartao)} no cartão)` : ""}`}.</span>`;
  } catch (e) { VOUCHER = ""; out.innerHTML = `<span style="color:var(--err)">${esc(e.message)}</span>`; }
}
document.addEventListener("change", (ev) => { if (ev.target?.name === "i-categoria" && $("i-voucher")?.value.trim()) aplicarVoucher(); });

// rótulos dos tipos de atividade (códigos do catálogo de lib/eventos.js —
// estáveis por contrato; o rótulo mora aqui para a página não depender de
// mais uma chamada)
const TIPOS = { palestra: "Palestra", minicurso: "Minicurso", oficina: "Oficina", curso: "Curso",
  mesa: "Mesa-redonda", roda: "Roda de conversa", mostra: "Mostra", apresentacao: "Apresentação", outro: "Atividade" };
const MODAL_ROTULO = { presencial: "Presencial", online: "Online", hibrido: "Híbrido" };

// hoje no fuso institucional — é com ele que a página decide "evento já foi"
const hojeISO = () => {
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo",
      year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  } catch { return new Date(Date.now() - 3 * 3600 * 1000).toISOString().slice(0, 10); }
};

const diaLongo = (iso) => {
  try {
    const d = new Date(iso + "T12:00:00-03:00");
    const s = d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
    return s.charAt(0).toUpperCase() + s.slice(1);
  } catch { return fmt(iso); }
};
// "terça, 12/05" — o rótulo curto das abas por dia
const diaAba = (iso) => {
  try {
    const d = new Date(iso + "T12:00:00-03:00");
    const w = d.toLocaleDateString("pt-BR", { weekday: "long" }).replace(/-feira$/, "");
    return `${w}, ${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
  } catch { return fmt(iso); }
};
/* Período compacto do jeito que se fala: "12–15 de maio de 2026" quando o
   evento cabe num mês; por extenso nas pontas quando cruza mês ou ano. */
function periodoCompacto(ini, fim) {
  const ok = (x) => /^\d{4}-\d{2}-\d{2}$/.test(String(x || ""));
  if (!ok(ini) && !ok(fim)) return "";
  if (!ok(fim) || ini === fim) return dataExtensa(ok(ini) ? ini : fim);
  if (!ok(ini)) return dataExtensa(fim);
  const mesAno = (x) => x.slice(0, 7);
  if (mesAno(ini) === mesAno(fim))
    return `${Number(ini.slice(8, 10))}–${dataExtensa(fim)}`;
  if (ini.slice(0, 4) === fim.slice(0, 4))
    return `${dataExtensa(ini, { semAno: true })} – ${dataExtensa(fim)}`;
  return `${dataExtensa(ini)} – ${dataExtensa(fim)}`;
}
function dataExtensa(iso, { semAno = false } = {}) {
  try {
    const d = new Date(iso + "T12:00:00-03:00");
    const op = semAno ? { day: "numeric", month: "long" } : { day: "numeric", month: "long", year: "numeric" };
    return d.toLocaleDateString("pt-BR", op);
  } catch { return fmt(iso); }
}

/* Conflito de horário — a MESMA régua de lib/eventos.js, replicada aqui só
   para o aviso amarelo do formulário (quem barra ou deixa é o participante;
   o servidor não recusa por conflito). */
function conflita(a, b) {
  if (!a?.dia || !b?.dia || a.dia !== b.dia) return false;
  if (!a.horaInicio || !b.horaInicio) return false;
  const mais1 = (h) => { const [x, y] = h.split(":").map(Number); const t = x * 60 + y + 1;
    return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
  const fim = (x) => (x.horaFim && x.horaFim > x.horaInicio ? x.horaFim : mais1(x.horaInicio));
  return a.horaInicio < fim(b) && b.horaInicio < fim(a);
}

const faixaHora = (p) => p.horaInicio ? (p.horaInicio + (p.horaFim ? "–" + p.horaFim : "")) : "—";
const atvPorId = (id) => (EV?.programacao || []).find((x) => x.id === id);

/* =============================== RENDER ================================== */
function render() {
  const e = EV;
  const encerrado = e.periodoFim && e.periodoFim < hojeISO();
  const abertas = e.inscricoesAbertas;
  const jaTem = localStorage.getItem("arche-ev-" + SLUG);
  const capa = e.temCapa ? `/api/publico/eventos/${encodeURIComponent(SLUG)}/capa` : "";

  /* ------ 1. hero ------ */
  const selos = [
    e.modalidade ? `<span class="selo on">${MODAL_ROTULO[e.modalidade] || esc(e.modalidade)}</span>` : "",
    abertas ? `<span class="selo">Inscrições abertas${e.inscricoesAte ? " até " + fmt(e.inscricoesAte)
      + (e.inscricoesAteHora ? ", às " + e.inscricoesAteHora : "") : ""}</span>`
      : `<span class="selo">Inscrições encerradas</span>`,
    e.vagasRestantes === null ? "" : e.vagasRestantes > 0
      ? `<span class="selo">${e.vagasRestantes} vaga(s) restante(s)</span>`
      : `<span class="selo">Vagas esgotadas</span>`,
    e.cargaHoraria ? `<span class="selo">${esc(e.cargaHoraria)}h de carga horária</span>` : "",
    /* O LOTE DE HOJE, no alto (set/2026, pedido do dono: "acho importante
       alguma informação sobre os lotes e datas"): o prazo do PREÇO é o que
       faz alguém se inscrever agora, e ele só existia lá embaixo, na seção
       Inscrição. Com data de fim o selo vem em destaque — é ela que corre. */
    seloDoLote(e),
  ].filter(Boolean).join("");
  const hero = `
    <div class="hero-ev" ${capa ? `style="background-image:url('${capa}')"` : ""}>
      <div class="hero-in">
        <div class="eyebrow">Evento de extensão · ${esc(rotuloPreco(e))}</div>
        <h1>${esc(e.nome)}</h1>
        <div class="hero-meta">
          <b>${esc(periodoCompacto(e.periodoInicio, e.periodoFim)) || "datas a divulgar"}</b><br>

        </div>
        <div class="hero-selos">${selos}</div>
        ${abertas || MINHA.inscrito ? `<div class="hero-cta"><a class="bt bt-pri" href="${destinoInscricao()}"
          style="background:#fff;color:var(--brand);box-shadow:none">${rotuloInscricao(e)}</a></div>` : ""}
      </div>
    </div>
    ${encerrado ? `<div class="msg-ok" style="background:var(--wash);color:var(--ink-soft)">
      Este evento já foi realizado. <a href="/eventos/" style="text-decoration:underline;font-weight:700">
      Veja os eventos com inscrições abertas →</a></div>` : ""}`;

  /* ------ 2. sobre ------ */
  const sobre = (e.descricao || e.temaCentral || e.publicoAlvo) ? `
    <div class="secao-t" id="sobre">Sobre o evento</div>
    <div class="card" style="margin-top:12px">
      ${e.temaCentral ? `<p style="font-size:14px;font-weight:600;color:var(--brand-2)">${esc(e.temaCentral)}</p>` : ""}
      ${e.descricao ? `<p style="font-size:14.5px;line-height:1.7;margin-top:${e.temaCentral ? 10 : 0}px;white-space:pre-line">${esc(e.descricao)}</p>` : ""}
      ${e.publicoAlvo ? `<p style="font-size:13px;color:var(--muted);margin-top:12px"><b>Público-alvo:</b> ${esc(e.publicoAlvo)}</p>` : ""}
    </div>` : "";

  /* ------ 2b. palestrantes (banner rotativo) e blocos do organizador ------ */
  const palestrantes = secaoPalestrantes(e);
  // com um bloco de submissão do ARCHÉ, a seção sai no lugar dele (e uma vez só)
  const blocosAntes = (blocoTrArche(e) ? "" : secaoTrabalhos(e)) + (e.blocos || []).filter((b) => b.tipo !== "apoiadores").map(blocoHtml).join("");
  const blocosApoio = (e.blocos || []).filter((b) => b.tipo === "apoiadores").map(blocoHtml).join("");

  /* ------ 3. programação (bloco próprio — a aba redesenha SÓ ele) ------ */
  const progHtml = `<div id="prog-wrap">${progSecao(e)}</div>`;

  /* ------ 4. inscrição ------ */
  const insc = `
    <div class="secao-t" id="inscricao">Inscrição</div>
    <div class="secao-s">${e.cobranca ? "Feita aqui mesmo, com o pagamento online" : "Gratuita e feita aqui mesmo"} — no dia, apresente na entrada o QR que você recebe.</div>
    <div class="duas">
      <div class="card" id="card-inscricao">
        ${jaTem && !MINHA.inscrito ? `<div class="msg-ok" style="margin-top:0;margin-bottom:12px">Você já se inscreveu neste evento por este aparelho.
            <a href="/eventos/${encodeURIComponent(SLUG)}/inscricao/${encodeURIComponent(jaTem)}" style="text-decoration:underline">Abrir minha inscrição →</a></div>` : ""}
        ${abertas || MINHA.inscrito ? chamadaInscricao(e) : `<p style="font-size:13.5px;color:var(--muted)">As inscrições deste evento
            não estão abertas${e.vagasRestantes === 0 ? " — as vagas se esgotaram" : ""}.
            Quem já se inscreveu segue com a inscrição válida.</p>`}
        <details class="reenvio">
          <summary>Já me inscrevi e perdi o link</summary>
          <p style="font-size:12.5px;color:var(--muted);margin-top:6px">Informe o CPF e o e-mail
            usados na inscrição — os dois precisam bater — e o link reaparece.</p>
          <label for="r-cpf">CPF</label><input id="r-cpf" inputmode="numeric">
          <label for="r-email">E-mail</label><input id="r-email" type="email">
          <div id="r-msg"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
            <button class="bt bt-sec" onclick="recuperar()" type="button">Reaver o meu link</button>
            <button class="bt bt-sec" onclick="recuperar(true)" type="button"
              title="Manda de novo o e-mail de confirmação, com o QR, para o endereço da inscrição">✉ Reenviar o e-mail</button>
          </div>
        </details>
      </div>
      <div>
        ${blocoLocal(e)}
        ${blocoOrganizacao(e)}
      </div>
    </div>`;

  /* ------ FOLHA DE INSCRIÇÃO ------
     Dois caminhos chegam aqui, e a tela é a mesma. (1) EVENTO SEM HOTSITE
     (pedido do dono, ago/2026): o professor que dá uma palestra e quer só a
     lista de presença por QR não tem por que montar um site. (2) A FICHA do
     evento COM hotsite (set/2026): o formulário saiu da página do evento e
     mora em /inscrever. Nos dois, o nome do evento, quando e onde, e o
     formulário — sem capa, sem hero, sem programação, sem blocos. A
     inscrição, a credencial e o QR são exatamente os mesmos. */
  if (e.hotsite === false || FICHA) {
    const voltar = e.hotsite === false ? "" : `<a href="/eventos/${encodeURIComponent(SLUG)}"
      style="display:inline-block;font-size:13px;color:var(--brand-2);font-weight:600;
        text-decoration:none;margin-top:18px">← Voltar à página do evento</a>`;
    $("main").innerHTML = `
      ${voltar}
      <div class="card" style="margin-top:${voltar ? 10 : 20}px;padding:22px 24px">
        <div class="eyebrow">Inscrição · evento de extensão · ${esc(rotuloPreco(e).replace(/^inscrição:?\s*/i, ""))}</div>
        <h1 style="font-family:'Archivo',sans-serif;font-size:26px;font-weight:800;
          letter-spacing:-.02em;margin:6px 0 0">${esc(e.nome)}</h1>
        <div style="font-size:14px;color:var(--ink-soft);margin-top:8px;line-height:1.6">
          <b>${esc(periodoCompacto(e.periodoInicio, e.periodoFim)) || "datas a divulgar"}</b><br>
          ${esc(e.local) || "local a divulgar"}${e.municipio ? " — " + esc(e.municipio) : ""} · ${esc(e.curso)}
          ${e.cargaHoraria ? ` · ${esc(e.cargaHoraria)}h` : ""}
        </div>
        ${e.descricao ? `<p style="font-size:14px;line-height:1.65;margin-top:12px;
          white-space:pre-line;color:var(--ink-soft)">${esc(e.descricao)}</p>` : ""}
      </div>
      ${encerrado ? `<div class="msg-ok" style="background:var(--wash);color:var(--ink-soft)">
        Este evento já foi realizado.</div>` : ""}
      <div class="card" id="card-inscricao" style="margin-top:14px">
        ${jaTem && !MINHA.inscrito ? `<div class="msg-ok" style="margin-top:0;margin-bottom:12px">Você já se inscreveu neste evento por este aparelho.
          <a href="/eventos/${encodeURIComponent(SLUG)}/inscricao/${encodeURIComponent(jaTem)}" style="text-decoration:underline">Abrir minha inscrição →</a></div>` : ""}
        ${abertas ? formInscricao(e) : `<p style="font-size:13.5px;color:var(--muted)">As inscrições deste evento
          não estão abertas${e.vagasRestantes === 0 ? " — as vagas se esgotaram" : ""}.
          Quem já se inscreveu segue com a inscrição válida.</p>`}
        <details class="reenvio">
          <summary>Já me inscrevi e perdi o link</summary>
          <p style="font-size:12.5px;color:var(--muted);margin-top:6px">Informe o CPF e o e-mail
            usados na inscrição — os dois precisam bater — e o link reaparece.</p>
          <label for="r-cpf">CPF</label><input id="r-cpf" inputmode="numeric">
          <label for="r-email">E-mail</label><input id="r-email" type="email">
          <div id="r-msg"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
            <button class="bt bt-sec" onclick="recuperar()" type="button">Reaver o meu link</button>
            <button class="bt bt-sec" onclick="recuperar(true)" type="button"
              title="Manda de novo o e-mail de confirmação, com o QR, para o endereço da inscrição">✉ Reenviar o e-mail</button>
          </div>
        </details>
      </div>`;
    $("cta-flutua").style.display = "none";
    // o formulário nasce preenchido para quem está logado — aqui também, que
    // é onde ele mora desde set/2026 (antes esta saída voltava sem chamar)
    avisoConflito();
    if (abertas) preencherComOUsuario();
    return;
  }

  $("main").innerHTML = hero + subnav(e) + sobre + palestrantes + progHtml + blocosAntes + insc + blocosApoio;
  girarPalestrantes();
  $("cta-flutua").href = destinoInscricao();
  $("cta-flutua").textContent = rotuloInscricao(e);
  $("cta-flutua").style.display = (abertas || MINHA.inscrito) && !document.querySelector("#pos-inscricao") ? "" : "none";
  // o botão flutuante é persistente, mas não precisa cobrir o próprio
  // formulário: some enquanto a seção de inscrição está na tela
  try {
    new IntersectionObserver((ents) => {
      const fl = $("cta-flutua");
      if (!fl || (!abertas && !MINHA.inscrito) || document.querySelector("#pos-inscricao")) return;
      fl.style.display = ents.some((x) => x.isIntersecting) ? "none" : "";
    }).observe($("card-inscricao"));
  } catch { /* sem IntersectionObserver, o botão só fica fixo */ }
  avisoConflito();
  if (abertas) preencherComOUsuario();
}

/* Quem já tem conta no ARCHÉ não precisa digitar de novo o que a instituição
   já sabe (pedido do dono, ago/2026). A página é pública e continua servindo
   ao participante EXTERNO — o formulário só nasce preenchido para quem está
   logado, e só com os dados da PRÓPRIA conta (o /api/me responde pelo cookie
   de quem pergunta). Nada é enviado sozinho: a pessoa confere, corrige o que
   quiser e clica em inscrever-se como qualquer outra. */
async function preencherComOUsuario() {
  try {
    const r = await fetch("/api/me");
    if (!r.ok) return;                       // visitante sem conta: formulário em branco
    const u = await r.json();
    const p = u.perfil || {};
    const põe = (id, v) => {
      const el = $(id);
      if (el && !el.value && v) { el.value = String(v); return true; }
      return false;
    };
    const cpf = String(p.cpf || "").replace(/\D/g, "");
    // o nome da conta só entra se for nome de GENTE: quem entra por código ou
    // senha carrega o e-mail como nome, e ele ia parar no campo Nome (achado
    // do dono, set/2026 — inscritos com o e-mail no lugar do nome)
    const nomeDeGente = (v) => (v && !String(v).includes("@") ? v : "");
    const algum = [
      põe("i-nome", nomeDeGente(p.nome) || nomeDeGente(u.nome)),
      põe("i-cpf", cpf.length === 11 ? cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : cpf),
      põe("i-email", u.email),
      põe("i-tel", p.telefone),
      põe("i-curso", p.curso),
    ].some(Boolean);
    if (!algum) return;
    const form = $("f");
    if (!form) return;
    // o aviso entra RECOLHIDO (pedido do dono, ago/2026): quem reconhece os
    // próprios dados no formulário não precisa de um bloco explicando; quem
    // estranhar abre e encontra a conta usada e o "não sou eu"
    // evento que exige conta: o e-mail É o da conta (o servidor o impõe), e
    // "não sou eu" significa trocar de conta, não limpar os campos
    const comConta = EV?.inscricaoComConta === true;
    if (comConta) { $("i-email").value = u.email; $("i-email").readOnly = true; }
    const av = document.createElement("details");
    av.className = "msg-ok av-conta";
    av.innerHTML = `<summary>✓ Preenchido com os dados da sua conta</summary>
      <div class="av-conta-corpo">Estes campos vieram da sua conta <b>${esc(u.email)}</b> —
        confira e ajuste o que precisar antes de enviar.${comConta ? " A inscrição fica ligada a esta conta, e a credencial vai para este e-mail." : ""}
        <button type="button" id="i-limpar">${comConta ? "Não sou eu, entrar com outra conta" : "Não sou eu, limpar os campos"}</button></div>`;
    form.insertBefore(av, form.firstChild);
    $("i-limpar").addEventListener("click", async () => {
      if (comConta) {
        try { await fetch("/auth/sair", { method: "POST" }); } catch { /* sem rede: a tela de entrada resolve */ }
        location.href = "/entrar/?next=" + encodeURIComponent(location.pathname);
        return;
      }
      for (const id of ["i-nome", "i-cpf", "i-email", "i-tel", "i-curso"]) { const el = $(id); if (el) el.value = ""; }
      av.remove();
      $("i-nome").focus();
    });
  } catch { /* sem rede para o /api/me: o formulário segue em branco */ }
}

/* -------------------- a barra de seções (navegabilidade) -----------------
   Com palestrantes, submissão de trabalhos, anais e apoio, a página deixou de
   caber numa rolagem só — a barra grudada no topo é o que a mantém navegável
   (pedido do dono, ago/2026). Só aparece com seções suficientes para valer. */
function subnav(e) {
  const itens = [
    (e.descricao || e.temaCentral || e.publicoAlvo) ? ["#sobre", "Sobre"] : null,
    palestrantesDe(e).length ? ["#palestrantes", "Palestrantes"] : null,
    (e.programacao || []).length ? ["#programacao", "Programação"] : null,
    e.trabalhos && !blocoTrArche(e) ? ["#trabalhos", "Trabalhos"] : null,
    ...(e.blocos || []).map((b) => [`#bloco-${b.id}`, b.titulo || rotuloBloco(b.tipo)]),
    e.inscricoesAbertas ? ["#inscricao", "Inscrição"] : null,
  ].filter(Boolean);
  if (itens.length < 3) return "";
  return `<nav class="subnav">${itens.map(([href, rot]) =>
    `<a href="${href}">${esc(rot)}</a>`).join("")}</nav>`;
}
const rotuloBloco = (t) => ({ texto: "Informações", submissao: "Trabalhos", anais: "Anais",
  apoiadores: "Apoio", video: "Vídeo", redes: "Redes", galeria: "Imagens" }[t] || "Seção");

/* Ícones das redes em SVG inline: nada de biblioteca externa numa página
   pública que precisa abrir rápido no celular da fila do evento. */
const ROTULO_REDE = { instagram: "Instagram", facebook: "Facebook", youtube: "YouTube",
  linkedin: "LinkedIn", tiktok: "TikTok", x: "X", whatsapp: "WhatsApp", telegram: "Telegram", site: "Site" };

/* ---------------------- palestrantes: banner rotativo --------------------
   Quem ministra é o que o participante quer ver primeiro numa página de
   evento acadêmico — é o mesmo lugar que Even3 e Sympla dão aos palestrantes
   nos hotsites deles. Aqui a vitrine sai da PRÓPRIA programação (não há
   cadastro de palestrante à parte): toda atividade com responsável entra, e a
   foto, quando o organizador a enviou. O banner gira sozinho de 6 em 6
   segundos, para e volta no toque/foco, e respeita quem pediu menos
   movimento no sistema. */
function palestrantesDe(e) {
  const todos = (e.programacao || []).filter((p) => p.responsavel && (p.temFoto || p.miniBio || p.instituicao || p.tipo !== "outro"));
  /* Marcadas em DESTAQUE (pedido do dono, set/2026: "não é toda programação
     que é interessante de ser destacada"), só elas giram no carrossel; sem
     nenhuma marca, giram todas — o evento que nunca marcou nada não perde a
     vitrine. */
  const destacadas = todos.filter((p) => p.destaque === true);
  return destacadas.length ? destacadas : todos;
}
let PAL = 0, PAL_TIMER = null;
function secaoPalestrantes(e) {
  const lista = palestrantesDe(e);
  if (!lista.length) return "";
  return `
    <div class="secao-t" id="palestrantes">Palestrantes e convidados</div>
    <div class="secao-s">Quem conduz as atividades do evento.</div>
    <div class="pal-wrap">
      ${lista.length > 1 ? '<button class="pal-seta esq" onclick="passaPalestrante(-1)" aria-label="Anterior">‹</button>'
        + '<button class="pal-seta dir" onclick="passaPalestrante(1)" aria-label="Próximo">›</button>' : ""}
      <div class="pal-palco" id="pal-palco" onmouseenter="pausaPalestrantes()" onmouseleave="girarPalestrantes()"
        onfocusin="pausaPalestrantes()">${palestranteCartao(lista[0])}</div>
      ${lista.length > 1 ? `<div class="pal-navs" id="pal-navs">${lista.map((p, i) =>
        `<button class="pal-mini ${i === 0 ? "on" : ""}" onclick="mostraPalestrante(${i})"
          title="${esc(p.responsavel)}" aria-label="${esc(p.responsavel)}">${miniFoto(p)}</button>`).join("")}</div>` : ""}
    </div>`;
}
const fotoUrl = (p) => `/api/publico/eventos/${encodeURIComponent(SLUG)}/atividade/${encodeURIComponent(p.id)}/foto`;
const iniciais = (n) => String(n || "?").trim().split(/\s+/).slice(0, 2).map((x) => x[0] || "").join("").toUpperCase();
const miniFoto = (p) => p.temFoto
  ? `<img src="${fotoUrl(p)}" alt="" loading="lazy">`
  : `<span>${esc(iniciais(p.responsavel))}</span>`;
function palestranteCartao(p) {
  return `
    <div class="pal-foto">
      ${p.temFoto ? `<img src="${fotoUrl(p)}" alt="${esc(p.responsavel)}" loading="lazy">`
        : `<div class="ini">${esc(iniciais(p.responsavel))}</div>`}
    </div>
    <div class="pal-txt">
      <div class="pal-nome">${esc(p.responsavel)}</div>
      ${p.instituicao ? `<div class="pal-inst">${esc(p.instituicao)}</div>` : ""}
      ${p.miniBio ? `<div class="pal-bio">${esc(p.miniBio)}</div>` : ""}
      <div class="pal-atv"><b>${esc(p.titulo)}</b>
        <div class="pal-quando">${esc([p.dia ? fmt(p.dia) : "", faixaHora(p), p.local || ""].filter(Boolean).join(" · "))}</div>
      </div>
    </div>`;
}
function mostraPalestrante(i) {
  const lista = palestrantesDe(EV);
  if (!lista.length) return;
  PAL = (i + lista.length) % lista.length;
  const palco = $("pal-palco");
  if (!palco) return;
  palco.innerHTML = palestranteCartao(lista[PAL]);
  const navs = $("pal-navs");
  if (navs) [...navs.children].forEach((b, n) => b.classList.toggle("on", n === PAL));
}
function passaPalestrante(d) { pausaPalestrantes(); mostraPalestrante(PAL + d); girarPalestrantes(); }
function pausaPalestrantes() { if (PAL_TIMER) { clearInterval(PAL_TIMER); PAL_TIMER = null; } }
function girarPalestrantes() {
  pausaPalestrantes();
  if (window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) return;
  if (palestrantesDe(EV).length < 2) return;
  PAL_TIMER = setInterval(() => mostraPalestrante(PAL + 1), 6000);
}

/* ------------------------- blocos do organizador -------------------------
   O que o hotsite não previu, o organizador monta: texto livre, submissão de
   trabalhos (que leva ao OJS — o sistema oficial de submissão da revista; o
   ARCHÉ não recebe resumo, senão haveria duas filas para o mesmo trabalho),
   anais do evento e desta e de outras edições, e apoio/patrocínio. */
/* ARCHÉ TR (set/2026): a submissão de trabalhos DENTRO do ARCHÉ. A seção sai
   quando a coordenação liga o módulo no evento; o bloco "submissão" de link
   continua existindo para quem usa o OJS. */
/* O bloco "Submissão de trabalhos" com origem `arche` (pedido do dono,
   set/2026) É esta seção, no lugar em que o organizador o pôs — com o título
   e o texto dele; sem bloco, a seção sai sozinha quando o módulo está ligado. */
const blocoTrArche = (e) => (e.blocos || []).find((b) => b.tipo === "submissao" && b.origem === "arche");
function secaoTrabalhos(e, b = null) {
  const t = e.trabalhos;
  const url = `/eventos/${encodeURIComponent(e.slug)}/trabalhos`;
  if (!t) {
    if (!b) return "";
    return `
    <div class="secao-t" id="bloco-${esc(b.id)}">${esc(b.titulo || "Submissão de trabalhos")}</div>
    <div class="card" style="margin-top:12px">
      ${b.texto ? `<p style="font-size:14.5px;line-height:1.7;white-space:pre-line">${esc(b.texto)}</p>` : ""}
      <p style="font-size:14px;color:var(--muted)">A submissão de trabalhos ainda não está aberta neste evento.</p>
    </div>`;
  }
  return `
    <div class="secao-t" id="${b ? `bloco-${esc(b.id)}` : "trabalhos"}">${esc(b?.titulo || "Submissão de trabalhos")}</div>
    <div class="card" style="margin-top:12px">
      ${b?.texto ? `<p style="font-size:14.5px;line-height:1.7;white-space:pre-line">${esc(b.texto)}</p>` : ""}
      <p style="font-size:14.5px;line-height:1.7">${t.aberta
        ? `Submissões <b>abertas</b>${t.prazoSubmissao ? ` até <b>${esc(fmt(t.prazoSubmissao))}</b>` : ""} — ${t.modalidades.map((m) => esc(m.nome.toLowerCase())).join(", ")}.
           A avaliação é feita por pareceristas, às cegas, e o resultado chega por e-mail.`
        : esc(t.motivo)}</p>
      ${t.orientacoes ? `<p style="font-size:14px;line-height:1.7;white-space:pre-line;color:var(--ink-soft)">${esc(t.orientacoes)}</p>` : ""}
      ${t.areas.length ? `<p style="font-size:13px;color:var(--muted)"><b>Áreas:</b> ${t.areas.map(esc).join(" · ")}</p>` : ""}
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        ${t.aberta ? `<a class="bt bt-pri" href="${url}" style="margin-top:14px">${esc(b?.rotuloBotao || "Submeter trabalho")}</a>` : ""}
        ${t.normas ? `<a class="bt bt-sec" href="${url}#normas" style="margin-top:14px">Normas de submissão</a>` : ""}
        ${t.normasUrl ? `<a class="bt bt-sec" href="${esc(t.normasUrl)}" target="_blank" rel="noopener" style="margin-top:14px">Normas ↗</a>` : ""}
        ${t.modeloUrl ? `<a class="bt bt-sec" href="${esc(t.modeloUrl)}" target="_blank" rel="noopener" style="margin-top:14px">Modelo ↗</a>` : ""}
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:10px">Já submeteu? O acompanhamento é pelo link que chegou ao seu e-mail.</p>
    </div>`;
}
function blocoHtml(b) {
  const titulo = esc(b.titulo || rotuloBloco(b.tipo));
  const texto = b.texto ? `<p style="font-size:14.5px;line-height:1.7;white-space:pre-line">${esc(b.texto)}</p>` : "";
  const botao = b.url ? `<a class="bt bt-pri" href="${esc(b.url)}" target="_blank" rel="noopener"
    style="margin-top:14px">${esc(b.rotuloBotao || "Acessar")} ↗</a>` : "";
  if (b.tipo === "submissao" && b.origem === "arche") return secaoTrabalhos(EV, b);
  if (b.tipo === "submissao") {
    const prazos = (b.prazos || []).length ? `<div class="prazos">${b.prazos.map((p) =>
      `<div class="prazo"><b>${esc(p.data ? fmt(p.data) : "—")}</b><span>${esc(p.rotulo)}</span></div>`).join("")}</div>` : "";
    return `
      <div class="secao-t" id="bloco-${esc(b.id)}">${titulo}</div>
      <div class="card" style="margin-top:12px">
        ${texto || '<p style="font-size:14.5px;line-height:1.7">A submissão de trabalhos é feita no sistema oficial da revista.</p>'}
        ${prazos}
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          ${b.url ? `<a class="bt bt-pri" href="${esc(b.url)}" target="_blank" rel="noopener"
            style="margin-top:14px">${esc(b.rotuloBotao || "Submeter trabalho")} ↗</a>` : ""}
          ${b.normasUrl ? `<a class="bt bt-sec" href="${esc(b.normasUrl)}" target="_blank" rel="noopener"
            style="margin-top:14px">Normas e modelo ↗</a>` : ""}
        </div>
      </div>`;
  }
  if (b.tipo === "anais") {
    const itens = (b.itens || []).map((i) => `
      <div class="anais-li">
        <div style="flex:1">
          <div style="font-size:14.5px;font-weight:600">${esc(i.titulo)}</div>
          <div style="font-size:12.5px;color:var(--muted)">${esc([i.ano, i.issn ? "ISSN " + i.issn : ""].filter(Boolean).join(" · "))}</div>
        </div>
        ${i.url ? `<a class="bt bt-sec" style="margin:0;padding:8px 14px;font-size:13px"
          href="${esc(i.url)}" target="_blank" rel="noopener">Acessar ↗</a>` : ""}
      </div>`).join("");
    return `
      <div class="secao-t" id="bloco-${esc(b.id)}">${titulo}</div>
      <div class="card" style="margin-top:12px">${texto}${itens}${botao}</div>`;
  }
  if (b.tipo === "video") {
    if (!b.youtubeId) return "";
    return `
      <div class="secao-t" id="bloco-${esc(b.id)}">${titulo}</div>
      ${b.texto ? `<div class="secao-s">${esc(b.texto)}</div>` : ""}
      <div class="video-wrap">
        <iframe src="https://www.youtube-nocookie.com/embed/${esc(b.youtubeId)}" title="${titulo}"
          loading="lazy" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>`;
  }
  if (b.tipo === "redes") {
    const itens = (b.itens || []).filter((i) => i.url);
    if (!itens.length) return "";
    return `
      <div class="secao-t" id="bloco-${esc(b.id)}">${titulo}</div>
      ${b.texto ? `<div class="secao-s">${esc(b.texto)}</div>` : ""}
      <div class="redes">${itens.map((i) => `
        <a class="rede rede-${esc(i.rede)}" href="${esc(i.url)}" target="_blank" rel="noopener">
          ${ICONE_REDE[i.rede] || ICONE_REDE.site}
          <span>${esc(i.rotulo || ROTULO_REDE[i.rede] || "Perfil")}</span></a>`).join("")}</div>`;
  }
  if (b.tipo === "galeria") {
    // a imagem sai pela mesma rota do logotipo (é o mesmo campo, ver lib/eventos.js)
    const src = (i) => `/api/publico/eventos/${encodeURIComponent(SLUG)}/apoiador/${encodeURIComponent(i.id)}/logo`;
    const itens = (b.itens || []).filter((i) => i.temLogo);
    return `
      <div class="secao-t" id="bloco-${esc(b.id)}">${titulo}</div>
      ${texto ? `<div class="secao-s">${esc(b.texto)}</div>` : ""}
      <div class="galeria">${itens.map((i) => `<figure class="galeria-item">
        <a href="${src(i)}" target="_blank" rel="noopener"><img src="${src(i)}" alt="${esc(i.legenda)}" loading="lazy"></a>
        ${i.legenda ? `<figcaption>${esc(i.legenda)}</figcaption>` : ""}
      </figure>`).join("")}</div>`;
  }
  if (b.tipo === "apoiadores") {
    const cat = [["realizacao", "Realização"], ["patrocinio", "Patrocínio"], ["apoio", "Apoio"]];
    const grupos = cat.map(([codigo, rotulo]) => {
      const itens = (b.itens || []).filter((i) => i.categoria === codigo);
      if (!itens.length) return "";
      return `<div class="apoio-grupo apoio-grupo-${codigo}"><div class="apoio-t">${rotulo}</div>
        <div class="apoio-grade">${itens.map((i) => {
          const dentro = i.temLogo
            ? `<img src="/api/publico/eventos/${encodeURIComponent(SLUG)}/apoiador/${encodeURIComponent(i.id)}/logo"
                 alt="${esc(i.nome)}" loading="lazy">`
            : `<span>${esc(i.nome)}</span>`;
          return i.url
            ? `<a class="apoio-item" href="${esc(i.url)}" target="_blank" rel="noopener">${dentro}</a>`
            : `<div class="apoio-item">${dentro}</div>`;
        }).join("")}</div></div>`;
    }).join("");
    return `
      <div class="secao-t" id="bloco-${esc(b.id)}">${titulo}</div>
      ${texto ? `<div class="secao-s">${esc(b.texto)}</div>` : ""}
      ${grupos}`;
  }
  return `
    <div class="secao-t" id="bloco-${esc(b.id)}">${titulo}</div>
    <div class="card" style="margin-top:12px">${texto}${botao}</div>`;
}

/* A seção da programação, isolada: a troca de aba de dia redesenha SÓ este
   bloco — redesenhar a página inteira apagava o que o visitante já tinha
   digitado no formulário de inscrição (achado da revisão de ago/2026). */
function progSecao(e) {
  const prog = e.programacao || [];
  const dias = [...new Set(prog.map((p) => p.dia || ""))];
  if (!DIA_SEL || !dias.includes(DIA_SEL)) DIA_SEL = dias[0] ?? "";
  const abas = dias.length > 1 ? `<div class="abas">${dias.map((d) =>
    `<button class="aba ${d === DIA_SEL ? "on" : ""}" type="button" onclick="trocarDia('${esc(d)}')">
      ${d ? esc(diaAba(d)) : "A definir"}</button>`).join("")}</div>` : "";
  const doDia = prog.filter((p) => (p.dia || "") === DIA_SEL);
  const cards = doDia.map((p) => `
    <div class="atv">
      <div class="atv-topo">
        <span class="atv-h">${esc(faixaHora(p))}</span>
        <span class="atv-t">${esc(p.titulo)}</span>
        <span class="tp tp-${esc(p.tipo || "outro")}">${TIPOS[p.tipo] || "Atividade"}</span>
      </div>
      ${p.local || p.ch ? `<div class="atv-meta">
        ${[p.local, p.ch ? p.ch + " de carga horária" : ""].filter(Boolean).map(esc).join(" · ")}</div>` : ""}
      ${p.responsavel ? `<div class="atv-quem">

function trocarDia(d) {

/* Para onde o botão de inscrição leva, e o que ele diz — a MESMA régua no
   hero, no botão flutuante e na seção Inscrição: quem já está inscrito vai à

const destinoInscricao = () => `/eventos/${encodeURIComponent(SLUG)}/${MINHA.inscrito ? "participante" : "inscrever"}`;
const rotuloInscricao = (e) => (MINHA.inscrito
  ? (MINHA.pagamentoPendente ? "💳 Realizar pagamento" : "Área do inscrito")

/* A CHAMADA DA PÁGINA DO EVENTO (set/2026, pedido do dono: "coloque só um
   botão de Inscreva-se e direciona para a página do inscrito — estou achando
   isso poluindo a página do evento"). O formulário inteiro — nome, CPF,
   e-mail, telefone, curso, categoria, campos extras e o texto da LGPD — vivia
   no meio do hotsite, entre a programação e o rodapé: quem entrava para LER
   sobre o evento levava um cadastro na cara, e quem entrava para SE INSCREVER
   rolava a página inteira até achá-lo. Aqui fica o que ajuda a DECIDIR (o
   prazo, as vagas e quanto custa cada categoria, com o lote de hoje) e um
   botão só; o cadastro é a etapa seguinte, com endereço próprio. */
function chamadaInscricao(e) {
  const c = e.cobranca;
  const cats = (c?.categorias || []);
  const prazo = e.inscricoesAte
    ? `Inscrições até <b>${esc(fmt(e.inscricoesAte))}</b>${e.inscricoesAteHora ? `, às ${esc(e.inscricoesAteHora)}` : ""}.`
    : "Inscrições abertas.";
  const vagas = e.vagasRestantes === null ? "" : ` Restam <b>${e.vagasRestantes} vaga(s)</b>.`;
  const valores = cats.length ? `
    <div class="secao-t" style="font-size:15px;margin:18px 0 0">Valores</div>
    ${avisoLote(c)}
    ${cats.map((k) => `<div class="val-cat">
      <span style="flex:1"><b>${esc(k.nome)}</b>${k.descricao ? `<div class="m">${esc(k.descricao)}</div>` : ""}</span>
      <b style="white-space:nowrap">${k.valor > 0 ? reais(k.valor) : "gratuita"}${k.valor > 0 && k.valorCartao > k.valor
        ? `<span class="m" style="display:block;font-weight:500;text-align:right">no Pix · ${reais(k.valorCartao)} no cartão</span>` : ""}</b>
    </div>`).join("")}
    ${tabelaLotes(c)}` : "";
  /* TRÊS ESTADOS, UM BOTÃO (pedido do dono, set/2026): sem conta e com conta
     sem inscrição, o ato é INSCREVER-SE; com a inscrição feita, o ato é ABRIR
     A ÁREA — é lá que estão o pagamento, a credencial, a programação e os
     trabalhos. Oferecer "Inscreva-se" a quem já se inscreveu manda a pessoa a
     um formulário que o servidor vai recusar. */
  if (MINHA.inscrito) {
    return `<p style="font-size:14.5px;line-height:1.65">✓ <b>Você já está inscrito neste evento.</b>
      ${MINHA.pagamentoPendente ? "Falta concluir o <b>pagamento</b> — a credencial sai depois da confirmação."
        : "A sua credencial com o QR está na área do inscrito."}</p>
    ${valores}
    <a class="bt bt-pri" style="width:100%;margin-top:18px;text-align:center;display:block"
      href="/eventos/${encodeURIComponent(SLUG)}/participante">${MINHA.pagamentoPendente ? "💳 Realizar pagamento — área do inscrito" : "Acesse a área do inscrito"}</a>
    <p style="font-size:12.5px;color:var(--muted);margin-top:10px">Na área do inscrito você
      ${c ? "conclui o pagamento, " : ""}abre a credencial, escolhe as atividades com vaga própria
      e acompanha os seus trabalhos.</p>`;
  }
  return `<p style="font-size:14.5px;line-height:1.65">${prazo}${vagas}</p>
    ${valores}
    <a class="bt bt-pri" style="width:100%;margin-top:18px;text-align:center;display:block"
      href="/eventos/${encodeURIComponent(SLUG)}/inscrever">${c ? "Inscreva-se" : "Inscreva-se gratuitamente"}</a>
    <p style="font-size:12.5px;color:var(--muted);margin-top:10px">Na página seguinte você preenche os
      seus dados${c ? " e escolhe a forma de pagamento" : ""}. A credencial com o QR chega por e-mail.</p>`;
}

/* ---------------------- formulário de inscrição -------------------------- */
function formInscricao(e) {
  /* A CONTA ANTES DA INSCRIÇÃO (decisão do dono, set/2026): com a chave do
     evento ligada, quem não está logado vê o convite para entrar — ou criar

  if (e.inscricaoComConta && !ME) {

  const escolha = blocoEscolhaAtividades(e);

  return `<form id="f" onsubmit="inscrever(event)">
    <label for="i-nome">Nome completo *</label><input id="i-nome" required autocomplete="name">
    <label for="i-cpf">CPF *</label><input id="i-cpf" required inputmode="numeric" placeholder="000.000.000-00">
    <label for="i-email">E-mail *</label><input id="i-email" type="email" required autocomplete="email" placeholder="voce@exemplo.com">
    <label for="i-tel">Telefone (WhatsApp) *</label><input id="i-tel" required autocomplete="tel" placeholder="(62) 9…">
    <div class="dica-campo">Vai na planilha de emissão do certificado — sem ele o certificado não sai.</div>
    <label for="i-curso">Curso / instituição de origem</label><input id="i-curso" placeholder="Ex.: Enfermagem — UNIEGO">
    ${blocoCategoria(e)}
    ${escolha}
    ${extras}
    <div class="secao-t" style="font-size:15px;margin:20px 0 0">Tratamento de dados pessoais</div>
    <div class="lgpd-box">${esc(e.lgpdTexto || "")}</div>
    <label class="chk"><input type="checkbox" id="i-lgpd">
