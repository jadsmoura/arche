    <label class="chk"><input type="checkbox" id="i-comunic">
      <span>Aceito receber comunicações da PROPPEX/UNIEGO sobre eventos futuros.</span></label>
    <div id="f-msg"></div>
    <button class="bt bt-pri" style="width:100%;margin-top:16px" id="f-bt">${e.cobranca ? "Inscrever-me e ir para o pagamento" : "Inscrever-me gratuitamente"}</button>
  </form>`;
}

/* Escolha de atividades: só as com inscrição própria, agrupadas por dia,
   com as vagas restantes ao lado. Conflito de horário AVISA e não trava. */
function blocoEscolhaAtividades(e) {
  const proprias = (e.programacao || []).filter((p) => p.inscricao === "propria");
  if (!proprias.length) return "";
  /* NO EVENTO PAGO a escolha fica para DEPOIS da confirmação, na área do
     inscrito (decisão do dono, set/2026): a vaga limitada se esgota com quem
     pagou — o servidor ignora o que viesse marcado aqui. */
  if (e.cobranca) return `<div id="bloco-escolha">
    <div class="secao-t" style="font-size:15px;margin:20px 0 0">Atividades com vaga limitada</div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:4px">Este evento tem ${proprias.length} atividade(s) com inscrição própria
      (minicursos, oficinas). A escolha é feita na <b>área do inscrito</b>, depois da confirmação do pagamento — as
      vagas se esgotam entre quem já confirmou. As atividades gerais não precisam de marcação.</p></div>`;
  const dias = [...new Set(proprias.map((p) => p.dia || ""))];
  return `<div id="bloco-escolha">
    <div class="secao-t" style="font-size:15px;margin:20px 0 0">Escolha suas atividades</div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:4px">Minicursos, oficinas e demais atividades
      com vaga própria. As atividades gerais (abertura, palestras magnas) não precisam de marcação —
      quem está inscrito no evento já participa.</p>
    ${dias.map((d) => `
      <div class="esc-dia">${d ? esc(diaAba(d)) : "Data a definir"}</div>
      ${proprias.filter((p) => (p.dia || "") === d).map((p) => {
        const lotada = p.vagasRestantes !== null && p.vagasRestantes <= 0 && !ESCOLHIDAS.has(p.id);
        return `<label class="esc-atv ${lotada ? "lotada" : ""}">
          <input type="checkbox" data-atv="${esc(p.id)}" ${ESCOLHIDAS.has(p.id) ? "checked" : ""}
            ${lotada ? "disabled" : ""} onchange="marcarAtividade(this)">
          <span class="d">${esc(p.titulo)}
            <div class="m">${esc(faixaHora(p))}${p.local ? " · " + esc(p.local) : ""}${p.ch ? " · " + esc(p.ch) : ""}
              ${p.vagasRestantes === null ? "" : lotada ? " · <b>vagas esgotadas</b>" : ` · ${p.vagasRestantes} vaga(s)`}</div>
          </span>
        </label>`;
      }).join("")}`).join("")}
    <div id="aviso-conflito"></div>
  </div>`;
}
function marcarAtividade(chk) {
  const id = chk.dataset.atv;
  if (chk.checked) ESCOLHIDAS.add(id); else ESCOLHIDAS.delete(id);
  avisoConflito();
}
function avisoConflito() {
  const el = $("aviso-conflito");
  if (!el) return;
  const marcadas = [...ESCOLHIDAS].map(atvPorId).filter(Boolean);
  const pares = [];
  for (let i = 0; i < marcadas.length; i++)
    for (let j = i + 1; j < marcadas.length; j++)
      if (conflita(marcadas[i], marcadas[j])) pares.push([marcadas[i], marcadas[j]]);
  el.innerHTML = pares.length ? `<div class="msg-aviso">⚠ <b>Atenção aos horários:</b> ${pares.map(([a, b]) =>
    `“${esc(a.titulo)}” e “${esc(b.titulo)}” acontecem no mesmo horário (${esc(fmt(a.dia))}, ${esc(faixaHora(a))} / ${esc(faixaHora(b))})`).join("; ")}.
    Você pode manter as duas marcadas — a escolha é sua.</div>` : "";
}

/* O rótulo do preço nos cabeçalhos: o evento gratuito continua dizendo
   "inscrição gratuita"; o pago diz a faixa de valores das categorias (a de
   hoje, com o lote aplicado) — "inscrição gratuita" num evento pago era o
   que o dono viu no primeiro teste (set/2026). */
/* OS LOTES E AS DATAS (set/2026, pedido do dono: "na página inicial, acho
   importante alguma informação sobre os lotes e datas"). A página dizia só o
   lote de HOJE e a data do seguinte — e quem pensa em se inscrever quer
   justamente as duas coisas que faltavam: **até quando** vale este preço e
   **quanto** ele passa a ser. A tabela vem pronta do servidor
   (`tabelaDeLotes`): um período fechado por lote e o valor de cada categoria
   nele, com o vigente marcado. Aqui só se desenha.

   É UMA função para os DOIS lugares — a chamada do hotsite e o formulário da
   ficha —, que até agora repetiam o mesmo parágrafo em duas cópias. */
/* Na TABELA a data sai em dia/mês: com o ano por extenso em três colunas de
   período, o quadro rola de lado até no computador. O ano só aparece quando é
   OUTRO que o do evento — aí ele deixa de ser óbvio e passa a fazer falta. */
const fmtLote = (iso) => {
  const ano = String(EV?.periodoInicio || "").slice(0, 4);
  return String(iso || "").slice(0, 4) === ano ? fmt(iso).slice(0, 5) : fmt(iso);
};
const periodoLote = (l) => (l.desde && l.ate ? `${fmtLote(l.desde)} a ${fmtLote(l.ate)}`
  : l.ate ? `até ${fmtLote(l.ate)}` : l.desde ? `a partir de ${fmtLote(l.desde)}` : "");
/* O selo do hero: "1º lote até 30/09". Sem data de fim (o último lote, que não
   expira) ele sai discreto — não há prazo a anunciar; com data, em destaque. */
function seloDoLote(e) {
  const vig = (e.cobranca?.lotes || []).find((l) => l.vigente);
  if (!vig) return "";
  return vig.ate
    ? `<span class="selo on">${esc(vig.nome)} até ${esc(fmt(vig.ate))}</span>`
    : `<span class="selo">${esc(vig.nome)}</span>`;
}
function avisoLote(c) {
  const vig = (c?.lotes || []).find((l) => l.vigente);
  const prox = c?.proximoLote;
  if (!vig && !prox) return "";
  const agora = vig
    ? `Os valores são os do <b>${esc(vig.nome)}</b>${vig.ate ? `, em vigor até <b>${esc(fmt(vig.ate))}</b>` : ""}.`
    : "Os valores são os do primeiro lote.";
  const sobe = prox ? ` A partir de <b>${esc(fmt(prox.desde))}</b> vale o <b>${esc(prox.nome)}</b>, mais caro.` : "";
  return `<p style="font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.55">${agora}${sobe}</p>`;
}
function tabelaLotes(c) {
  const linhas = c?.lotes || [];
  const cats = c?.categorias || [];
  // um período só não é tabela de lotes: seria uma linha repetindo os valores
  if (linhas.length < 2 || !cats.length) return "";
  let passou = true;                       // as linhas ANTES da vigente já se foram
  return `<div class="rolo-lotes"><table class="tab-lotes">
    <thead><tr><th>Lote</th><th>Período</th>${cats.map((k) => `<th>${esc(k.nome)}</th>`).join("")}</tr></thead>
    <tbody>${linhas.map((l) => {
      const classe = l.vigente ? "agora" : passou ? "passou" : "";
      if (l.vigente) passou = false;
      return `<tr${classe ? ` class="${classe}"` : ""}>
        <td>${esc(l.nome)}${l.vigente ? '<span class="agora-selo">agora</span>' : ""}</td>
        <td>${esc(periodoLote(l))}</td>
        ${cats.map((k) => {
          const v = (l.valores || []).find((x) => x.codigo === k.codigo);
          return `<td>${!v ? "—" : v.valor > 0 ? reais(v.valor) : "gratuita"}</td>`;
        }).join("")}
      </tr>`;
    }).join("")}</tbody></table></div>`;
}
function rotuloPreco(e) {
  const cats = e.cobranca?.categorias || [];
  if (!cats.length) return "inscrição gratuita";
  const vals = cats.map((k) => k.valor);
  const min = Math.min(...vals), max = Math.max(...vals);
  if (max === 0) return "inscrição gratuita";
  if (min === max) return `inscrição: ${reais(min)}`;
  return min === 0 ? `inscrição: até ${reais(max)} (gratuita para algumas categorias)` : `inscrição: ${reais(min)} a ${reais(max)}`;
}

/* EVENTO PAGO (set/2026): a categoria da inscrição, com o preço de HOJE (o
   lote vigente já aplicado pelo servidor). O que vai ao servidor é só o
   código — o valor ele calcula de novo, do que está gravado. */
const reais = (c) => "R$ " + (Math.round(Number(c) || 0) / 100).toFixed(2).replace(".", ",");
function blocoCategoria(e) {
  const c = e.cobranca;
  if (!c || !(c.categorias || []).length) return "";
  const uma = c.categorias.length === 1;
  return `<div class="secao-t" style="font-size:15px;margin:20px 0 0">Categoria da inscrição</div>
    ${!c.online ? `<div class="msg-erro">O pagamento online está indisponível neste momento — fale com a coordenação do evento.</div>` : ""}
    ${avisoLote(c)}
    ${c.categorias.map((k, i) => `<label class="esc-atv" style="align-items:center">
      <input type="radio" name="i-categoria" value="${esc(k.codigo)}" ${uma || i === 0 ? "checked" : ""} required>
      <span style="flex:1"><b>${esc(k.nome)}</b>${k.descricao ? `<div class="m">${esc(k.descricao)}</div>` : ""}</span>
      <b style="white-space:nowrap">${k.valor > 0 ? reais(k.valor) : "gratuita"}${k.valor > 0 && k.valorCartao > k.valor ? `<span class="m" style="display:block;font-weight:500;text-align:right">no Pix · ${reais(k.valorCartao)} no cartão</span>` : ""}</b>
      ${k.valorCheio > k.valor ? `<span class="m" style="text-decoration:line-through;white-space:nowrap">${reais(k.valorCheio)}</span>` : ""}
    </label>`).join("")}
    ${tabelaLotes(c)}
    ${c.acrescimoCartao ? `<p style="font-size:12px;color:var(--muted);margin-top:6px">No cartão há acréscimo de <b>${esc(c.acrescimoCartao)}</b>, que é a tarifa do cartão repassada; no Pix vale o valor da categoria.</p>` : ""}
    ${c.aceitaVoucher ? `<label for="i-voucher" style="margin-top:12px">Código de desconto (voucher)</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="i-voucher" placeholder="ex.: MONITOR2026" style="flex:1;min-width:160px;text-transform:uppercase" autocomplete="off">
      <button class="bt bt-sec" type="button" onclick="aplicarVoucher()">Aplicar</button>
    </div>
    <div id="i-voucher-msg" style="font-size:12.5px;margin-top:6px"></div>` : ""}
    <p style="font-size:12px;color:var(--muted);margin-top:8px">Pagamento por ${[c.meios?.pix && "Pix", c.meios?.cartao && (c.parcelas > 1 ? `cartão (até ${c.parcelas}x)` : "cartão"), c.meios?.boleto && "boleto"].filter(Boolean).join(", ") || "meio a definir"}${c.provedor === "picpay"
        ? ` — o QR Code Pix aparece logo depois da inscrição, emitido pelo ${esc(c.provedorRotulo || "PicPay")}${c.recebedor ? ` em nome de ${esc(c.recebedor)}` : ""}, e vale em qualquer banco`
        : `, na página segura do ${esc(c.provedorRotulo || "provedor de pagamento")}${c.recebedor ? `, em nome de ${esc(c.recebedor)}` : ""}`}. A vaga fica reservada por ${Math.round((c.reservaMinutos || 1440) / 60)} h para o pagamento;
      a credencial sai depois da confirmação.</p>`;
}

/* Campos extras — o catálogo vem do evento; a resposta vai em `respostas`. */
function campoExtra(c) {
  const ob = c.obrigatorio ? " *" : "";
  const cid = "cx-" + c.id;   // id do input, para o rótulo apontar (leitor de tela)
  const instr = c.instrucoes ? `<p style="font-size:12px;color:var(--muted);margin-top:3px">${esc(c.instrucoes)}</p>` : "";
  if (c.tipo === "paragrafo")
    return `<label for="${cid}">${esc(c.rotulo)}${ob}</label>${instr}<textarea id="${cid}" data-campo="${esc(c.id)}" ${c.obrigatorio ? "required" : ""}></textarea>`;
  if (c.tipo === "selecao")
    return `<label for="${cid}">${esc(c.rotulo)}${ob}</label>${instr}<select id="${cid}" data-campo="${esc(c.id)}" ${c.obrigatorio ? "required" : ""}>
      <option value="">Selecione…</option>${(c.opcoes || []).map((o) => `<option>${esc(o)}</option>`).join("")}</select>`;
  if (c.tipo === "multipla")
    return `<label>${esc(c.rotulo)}${ob}</label>${instr}${(c.opcoes || []).map((o) =>
      `<label class="chk" style="margin-top:6px"><input type="checkbox" data-campo-multi="${esc(c.id)}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}`;
  if (c.tipo === "caixa")
    return `<label class="chk" style="margin-top:14px"><input type="checkbox" data-campo-caixa="${esc(c.id)}">
      <span>${esc(c.rotulo)}${ob}${c.instrucoes ? `<div style="font-size:12px;color:var(--muted)">${esc(c.instrucoes)}</div>` : ""}</span></label>`;
  return `<label for="${cid}">${esc(c.rotulo)}${ob}</label>${instr}<input id="${cid}" data-campo="${esc(c.id)}" ${c.obrigatorio ? "required" : ""}>`;
}
function lerRespostas() {
  const r = {};
  document.querySelectorAll("[data-campo]").forEach((el) => { r[el.dataset.campo] = el.value; });
  document.querySelectorAll("[data-campo-caixa]").forEach((el) => { r[el.dataset.campoCaixa] = el.checked; });
  const multi = {};
  document.querySelectorAll("[data-campo-multi]").forEach((el) => {
    (multi[el.dataset.campoMulti] = multi[el.dataset.campoMulti] || []);
    if (el.checked) multi[el.dataset.campoMulti].push(el.value);
  });
  for (const k of Object.keys(multi)) r[k] = multi[k];
  return r;
}

/* ------ 5. pós-inscrição ------ */
function pos(token, pagamento) {
  const url = `/eventos/${encodeURIComponent(SLUG)}/inscricao/${encodeURIComponent(token)}`;
  const marcadas = [...ESCOLHIDAS].map(atvPorId).filter(Boolean);
  /* EVENTO PAGO: a inscrição está RESERVADA, não confirmada — sem QR de
     credencial aqui. O botão leva à página de pagamento do ARCHÉ, que mostra
     o QR Pix (PicPay) ou encaminha ao provedor (Mercado Pago), confere a
     confirmação e dali se abre a credencial. */
  if (pagamento && !pagamento.valida) {
    const urlPag = `/eventos/${encodeURIComponent(SLUG)}/pagamento/${encodeURIComponent(token)}`;
    const hora = (iso) => { try { return new Date(iso).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch { return ""; } };
    $("card-inscricao").innerHTML = `
      <div id="pos-inscricao">
      <div class="card-t" style="font-size:17px">Inscrição recebida — falta o pagamento</div>
      <p style="font-size:13.5px;margin-top:8px">Reservamos a sua vaga <b>até ${esc(hora(pagamento.expiraEm))}</b>.
        Categoria <b>${esc(pagamento.categoriaNome)}</b>${pagamento.lote ? ` (${esc(pagamento.lote)})` : ""}: <b>${reais(pagamento.valor)}</b>.</p>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:6px">Enviamos ao seu e-mail o link para pagar. Assim que o pagamento
        for confirmado, você recebe a credencial com o QR de acesso — e a <a href="/eventos/${encodeURIComponent(SLUG)}/participante" style="color:var(--brand-2);font-weight:600">área do inscrito</a>
        abre para escolher a programação e submeter trabalhos.</p>
      ${pagamento.link
        ? `<a class="bt bt-pri" style="width:100%;margin-top:14px" href="${esc(pagamento.link)}">Pagar agora</a>`
        : `<a class="bt bt-pri" style="width:100%;margin-top:14px" href="${urlPag}">Ir para o pagamento</a>`}
      <a class="bt bt-sec" style="width:100%;margin-top:10px" href="${urlPag}">Já paguei / ver a situação</a>
      </div>`;
    $("cta-flutua").style.display = "none";
    $("card-inscricao").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  $("card-inscricao").innerHTML = `
    <div id="pos-inscricao">
    <div class="card-t" style="font-size:17px">Inscrição confirmada ✓</div>
    <p style="font-size:13.5px;margin-top:8px"><b>Guarde este endereço</b> — o link abaixo é a sua credencial,
      e enviamos uma cópia para o seu e-mail. No dia, apresente este QR na entrada:</p>
    <div style="text-align:center;margin:16px 0">
      <div class="qr-box"><img alt="QR da inscrição" src="/api/publico/eventos/${encodeURIComponent(SLUG)}/inscricao/${encodeURIComponent(token)}/qr.svg"></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin-top:8px">
        código manual: <b>${esc(token.slice(0, 6).toUpperCase())}</b></div>
    </div>
    ${marcadas.length ? `<div class="card-t" style="font-size:14px">Suas atividades</div>
      ${marcadas.map((p) => `<p style="font-size:13px;color:var(--ink-soft);margin-top:5px">•
        <b>${esc(p.titulo)}</b> — ${esc(fmt(p.dia))}, ${esc(faixaHora(p))}${p.local ? " · " + esc(p.local) : ""}</p>`).join("")}
      <p style="font-size:12px;color:var(--muted);margin-top:8px">Dá para trocar as atividades depois,
        pela página da sua inscrição.</p>` : ""}
    ${WALLET ? `<div style="margin-top:14px;text-align:center">
      ${botaoGoogleWallet(SLUG, token, "width:100%;max-width:280px")}</div>` : ""}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      <a class="bt bt-sec" style="flex:1 1 170px" download
        href="/api/publico/eventos/${encodeURIComponent(SLUG)}/inscricao/${encodeURIComponent(token)}/qr.png">⬇ Baixar o QR</a>
      <a class="bt bt-sec" style="flex:1 1 170px"
        href="/api/publico/eventos/${encodeURIComponent(SLUG)}/inscricao/${encodeURIComponent(token)}/evento.ics">📅 Adicionar ao calendário</a>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:6px">O QR baixado vale offline — guarde na
      galeria do celular. O calendário entra com lembrete na véspera.</p>
    <a class="bt bt-pri" style="width:100%;margin-top:14px" href="${url}">Abrir minha inscrição</a>
    ${ME && EV?.hotsite !== false ? `<a class="bt bt-sec" style="width:100%;margin-top:10px" href="/eventos/${encodeURIComponent(SLUG)}/participante">Área do inscrito — programação e trabalhos</a>` : ""}
    ${EV?.transmissaoPublicada ? `<a class="bt bt-sec" style="width:100%;margin-top:10px"
      href="/eventos/${encodeURIComponent(SLUG)}/assistir/${encodeURIComponent(token)}">🖥 Assistir online</a>` : ""}
    </div>`;
  $("cta-flutua").style.display = "none";
  $("card-inscricao").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function inscrever(ev) {
  ev.preventDefault();
  $("f-msg").innerHTML = "";
  // a caixa da LGPD não é campo de formulário comum: sem a ciência expressa
  // não há inscrição — o servidor recusa igual, mas a página explica antes
  if (!$("i-lgpd").checked) {
    $("f-msg").innerHTML = '<div class="msg-erro">Para se inscrever, marque a caixa de ciência e concordância com o tratamento dos dados pessoais.</div>';
    $("i-lgpd").focus();
    return;
  }
  // o nome sai no crachá e no certificado: nada de e-mail, e nome e sobrenome
  // (o servidor recusa igual; a página explica antes)
  const nomeDigitado = $("i-nome").value.trim();
  if (nomeDigitado.includes("@") || nomeDigitado.split(/\s+/).filter((p) => p.length >= 2).length < 2) {
    $("f-msg").innerHTML = `<div class="msg-erro">${nomeDigitado.includes("@") ? "O campo Nome está com um e-mail. " : ""}Escreva o seu nome completo — nome e sobrenome, como deve sair no certificado.</div>`;
    $("i-nome").focus();
    return;
  }
  const bt = $("f-bt"); bt.disabled = true;
  try {
    const r = await fetch(`/api/publico/eventos/${encodeURIComponent(SLUG)}/inscrever`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nome: $("i-nome").value, cpf: $("i-cpf").value, email: $("i-email").value,
        telefone: $("i-tel").value, curso: $("i-curso").value,
        atividades: [...ESCOLHIDAS],
        respostas: lerRespostas(),
        categoria: document.querySelector('input[name="i-categoria"]:checked')?.value || "",
        voucher: ($("i-voucher")?.value || "").trim().toUpperCase(),
        consentimento: $("i-lgpd").checked === true,
        comunicacoes: $("i-comunic").checked === true,
      }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const err = new Error(j.error || "Não foi possível concluir a inscrição."); err.ja = j.jaInscrito; throw err; }
    localStorage.setItem("arche-ev-" + SLUG, j.token);
    pos(j.token, j.pagamento);
  } catch (e2) {
    // JÁ INSCRITO não é uma parede: quem não recebeu o e-mail volta aqui e
    // precisa de um caminho, não de um erro (pergunta do dono, ago/2026). A
    // recuperação abre já preenchida com o que a pessoa acabou de digitar.
    $("f-msg").innerHTML = `<div class="msg-erro">${esc(e2.message)}${e2.ja ? `
      <div style="margin-top:8px;font-weight:400">${e2.ja.mesmoEmail
        ? "Não recebeu o e-mail? Ele pode ter caído no spam. Reaver a credencial abaixo — e dá para reenviá-lo."
        : "Se foi você que se inscreveu antes, use abaixo o CPF e o e-mail daquela inscrição para reaver a credencial. Se não lembra qual e-mail usou, fale com a coordenação do evento — ela vê a lista."}</div>
      <button class="bt bt-sec" style="margin-top:10px" type="button" onclick="abrirRecuperacao()">Reaver a minha credencial</button>
      </div>` : "</div>"}`;
    if (e2.ja) preencherRecuperacao();
    bt.disabled = false;
    // vaga que acabou no meio do caminho: recarrega as vagas para a lista
    // de atividades refletir a lotação de agora
    if (/vagas/i.test(e2.message)) recarregarVagas();
  }
}

/* Recarrega as vagas sem perder o que a pessoa já digitou: só o bloco da
   escolha de atividades se refaz (as marcações vivem em ESCOLHIDAS). */
async function recarregarVagas() {
  try {
    const r = await fetch(`/api/publico/eventos/${encodeURIComponent(SLUG)}`);
    if (!r.ok) return;
    const j = await r.json();
    EV.programacao = j.evento.programacao;
    EV.vagasRestantes = j.evento.vagasRestantes;
    const bloco = $("bloco-escolha");
    if (bloco) { bloco.outerHTML = blocoEscolhaAtividades(EV); avisoConflito(); }
  } catch { /* sem rede agora — a próxima tentativa recarrega */ }
}

/* Copia para a recuperação o que a pessoa acabou de digitar na inscrição e
   abre o bloco: com o erro de "já inscrito" na tela, pedir que ela digite
   CPF e e-mail outra vez, num <details> fechado, é o passo em que se
   desiste. */
function preencherRecuperacao() {
  if ($("r-cpf") && !$("r-cpf").value) $("r-cpf").value = $("i-cpf")?.value || "";
  if ($("r-email") && !$("r-email").value) $("r-email").value = $("i-email")?.value || "";
}
function abrirRecuperacao() {
  const d = $("r-cpf")?.closest("details");
  if (d) { d.open = true; d.scrollIntoView({ behavior: "smooth", block: "center" }); }
  preencherRecuperacao();
  $("r-cpf")?.focus();
}

async function recuperar(reenviar) {
  $("r-msg").innerHTML = "";
  try {
    const r = await fetch(`/api/publico/eventos/${encodeURIComponent(SLUG)}/recuperar`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cpf: $("r-cpf").value, email: $("r-email").value,
        ...(reenviar ? { reenviar: true } : {}) }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Não foi possível localizar.");
    localStorage.setItem("arche-ev-" + SLUG, j.token);
    // com reenvio, a pessoa precisa LER que o e-mail saiu antes de a página trocar
    if (reenviar) {
      $("r-msg").innerHTML = `<div class="msg-ok">${j.reenviado
        ? "E-mail reenviado — confira a caixa de entrada e o spam. Abrindo a sua credencial…"
        : "Encontramos a sua inscrição. O e-mail não pôde ser reenviado agora, mas a credencial abre a seguir."}</div>`;
      setTimeout(() => { location.href = `/eventos/${encodeURIComponent(SLUG)}/inscricao/${encodeURIComponent(j.token)}`; }, 2200);
      return;
    }
    location.href = `/eventos/${encodeURIComponent(SLUG)}/inscricao/${encodeURIComponent(j.token)}`;
  } catch (e) {
    $("r-msg").innerHTML = `<div class="msg-erro">${esc(e.message)}</div>`;
  }
}

fetch(`/api/publico/eventos/${encodeURIComponent(SLUG)}`).then(async (r) => {
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    $("main").innerHTML = `<div class="card" style="margin-top:20px"><div class="card-t">Evento não encontrado</div>
      <p style="font-size:13.5px;color:var(--muted);margin-top:8px">${esc(j.error || "A página deste evento não existe ou foi encerrada.")}</p>
      <a class="bt bt-sec" style="margin-top:14px" href="/eventos/">Ver os eventos abertos</a></div>`;
    return;
  }
  EV = j.evento; WALLET = j.walletGoogle === true;
  // a conta logada decide se o formulário aparece (evento que exige conta)
  try { const rm = await fetch("/api/me"); ME = rm.ok ? await rm.json() : null; } catch { ME = null; }
  // e, havendo conta, se ela já está inscrita NESTE evento — é o que troca o
  // botão da seção Inscrição. Falha na consulta cai no caminho de sempre
  // ("Inscreva-se"): quem barra a inscrição repetida é o servidor.
  if (ME) {
    try {
      const rs = await fetch(`/api/publico/eventos/${encodeURIComponent(SLUG)}/minha-inscricao`);
      if (rs.ok) MINHA = { ...MINHA, ...(await rs.json()) };
    } catch { /* sem rede: segue como não inscrito */ }
  }
  // a ÁREA DO INSCRITO (set/2026): quem está logado tem o atalho no topo —
  // pagamento, programação e trabalhos moram lá
  if (ME && EV.hotsite !== false) { const lk = $("lk-participante"); lk.href = `/eventos/${encodeURIComponent(SLUG)}/participante`; lk.hidden = false; }
  document.title = `${FICHA ? "Inscrição · " : ""}${EV.nome} — Eventos UNIEGO`; render();
}).catch(() => {
  $("main").innerHTML = '<div class="card" style="margin-top:20px"><p style="color:var(--muted)">Não foi possível carregar agora. Tente novamente em instantes.</p></div>';
});
</script>
