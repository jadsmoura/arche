<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Submissão de trabalhos — Eventos UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<link rel="stylesheet" href="/assets/arche-ui.css">
<style>
  /* ARCHÉ TR — a página do AUTOR (set/2026). Servida em
     /eventos/<slug>/trabalhos (o formulário) e /eventos/<slug>/trabalhos/<token>
     (o acompanhamento: situação, pareceres anônimos, versão corrigida). Sem
     conta: o token do e-mail é a chave, como na credencial da inscrição. */
  main{max-width:820px;margin:26px auto 40px;padding:0 16px}
  .cab h1{font-family:Sora,sans-serif;font-size:22px;color:var(--brand);margin:0 0 4px;letter-spacing:-.01em}
  .cab .s{color:var(--muted);font-size:13.5px}
  .selo{font-size:12px;font-weight:600;border-radius:20px;padding:5px 12px;display:inline-block}
  .selo.ok{background:var(--ok-soft);color:var(--ok)} .selo.warn{background:var(--warn-soft);color:var(--warn)}
  .selo.err{background:var(--err-soft);color:var(--err)} .selo.info{background:var(--accent-wash);color:var(--brand)}
  .selo.muted{background:var(--wash);color:var(--muted)}
  .msg{border-radius:10px;padding:10px 13px;font-size:13px;font-weight:600;margin-top:12px;line-height:1.5}
  .msg.err{background:var(--err-soft);color:var(--err)} .msg.ok{background:var(--ok-soft);color:var(--ok)}
  .msg.warn{background:var(--warn-soft);color:var(--warn);font-weight:500}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px} @media(max-width:640px){.g2{grid-template-columns:1fr}}
  .autor{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fafbfc}
  .autor .g3{display:grid;grid-template-columns:1.4fr 1.4fr 1fr 40px;gap:8px;align-items:end}
  @media(max-width:640px){.autor .g3{grid-template-columns:1fr 1fr}}
  .autor label{margin-top:4px}
  .contador{font-size:11.5px;color:var(--muted);text-align:right;margin-top:4px}
  .parecer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
  .parecer .t{font-weight:700;font-size:13.5px;color:var(--ink)}
  .notas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .notas span{font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--ink-soft)}
  .notas span b{color:var(--brand)}
  .versao{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
  .versao:first-child{border-top:0}
  .decisao{border-left:4px solid var(--accent);background:var(--wash);border-radius:10px;padding:12px 14px;margin-top:12px;white-space:pre-line;font-size:14px;line-height:1.6}
  .linha-ok{display:flex;align-items:flex-start;gap:8px;font-size:13px;margin-top:12px;line-height:1.5}
  .linha-ok input{width:auto;margin-top:3px}
  .hist{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.7}
  pre.resumo{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.65;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 0}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-rule"></div>
  <div class="topo-inner">
    <img class="u" src="/assets/logo-uniego.png" alt="UNIEGO" onerror="this.style.display='none'">
    <div class="vr"></div>
    <div class="topo-txt">
      <div class="topo-t"><span class="arche-wm"><span class="arche-tx">Submissão de trabalhos</span></span></div>
      <div class="topo-s">Eventos · Extensão · PROPPEX / UNIEGO</div>
    </div>
    <nav class="topo-nav"><a id="lk-evento" href="/eventos/">Página do evento</a></nav>
  </div>
</header>
<main id="tela"><div class="card"><p style="color:var(--muted)">Carregando…</p></div></main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => (/^\d{4}-\d{2}-\d{2}/.test(String(iso || "")) ? String(iso).slice(0, 10).split("-").reverse().join("/") : "—");
const fmtHora = (iso) => (iso ? new Date(iso).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—");
const partes = location.pathname.replace(/\/+$/, "").split("/");   // ["", "eventos", slug, "trabalhos", token?]
const SLUG = partes[2] || "", TOKEN = partes[4] || "";
const API = `/api/publico/eventos/${encodeURIComponent(SLUG)}/trabalhos`;
let DADOS = null, AUTORES = [{ nome: "", email: "", instituicao: "", vinculo: "" }];
$("lk-evento").href = `/eventos/${encodeURIComponent(SLUG)}`;

const cabecalho = (ev, sub) => `<div class="cab" style="margin-bottom:14px">
  <h1>${esc(ev.nome || "Evento")}</h1>
  <div class="s">${esc([ev.curso, ev.periodoInicio ? `${fmt(ev.periodoInicio)}${ev.periodoFim && ev.periodoFim !== ev.periodoInicio ? " a " + fmt(ev.periodoFim) : ""}` : ""].filter(Boolean).join(" · "))}${sub ? ` · ${sub}` : ""}</div>
</div>`;

async function carregar() {
  try {
    const r = await fetch(TOKEN ? `${API}/${encodeURIComponent(TOKEN)}` : API);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Falha ${r.status}`);
    DADOS = j;
    if (TOKEN) renderAcompanhamento(j); else renderFormulario(j);
  } catch (e) {
    $("tela").innerHTML = `<div class="card"><div class="msg err">${esc(e.message)}</div>
      <p style="margin-top:12px"><a class="bt bt-sec" href="/eventos/${encodeURIComponent(SLUG)}">Voltar à página do evento</a></p></div>`;
  }
}

/* ------------------------------ o formulário ------------------------------ */
function renderFormulario(j) {
  const c = j.config;
  if (!c) {
    $("tela").innerHTML = `<div class="card">${cabecalho(j.evento)}<div class="msg warn">A submissão de trabalhos não está aberta neste evento.</div></div>`;
    return;
  }
  const modalidades = c.modalidades.filter(Boolean);
  $("tela").innerHTML = `
    <div class="card">
      ${cabecalho(j.evento, "submissão de trabalhos")}
      ${!c.aberta ? `<div class="msg warn">${esc(c.motivo)}</div>` : `<div class="selo ok">Submissões abertas${c.prazoSubmissao ? ` até ${fmt(c.prazoSubmissao)}` : ""}</div>`}
      ${c.orientacoes ? `<div style="font-size:14px;line-height:1.65;white-space:pre-line;margin-top:14px">${esc(c.orientacoes)}</div>` : ""}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
        ${c.normasUrl ? `<a class="bt bt-sec" href="${esc(c.normasUrl)}" target="_blank" rel="noopener">Normas ↗</a>` : ""}
        ${c.modeloUrl ? `<a class="bt bt-sec" href="${esc(c.modeloUrl)}" target="_blank" rel="noopener">Modelo do trabalho ↗</a>` : ""}
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin-top:14px">Já submeteu? O acompanhamento é pelo link que chegou ao seu e-mail.</p>
    </div>
    ${c.aberta ? `<div class="card" style="margin-top:14px">
      <div class="g2">
        <div><label>Modalidade *</label>
          <select id="f-modalidade" onchange="mudouModalidade()">${modalidades.map((m) => `<option value="${esc(m.codigo)}">${esc(m.nome)}</option>`).join("")}</select>
          <div id="f-mod-ajuda" style="font-size:12px;color:var(--muted);margin-top:4px"></div></div>
        ${c.areas.length ? `<div><label>Área temática *</label>
          <select id="f-area"><option value="">— escolha —</option>${c.areas.map((a) => `<option>${esc(a)}</option>`).join("")}</select></div>` : "<div></div>"}
      </div>
      <label>Título do trabalho *</label>
      <input id="f-titulo" maxlength="300" placeholder="Título completo, como sairá nos anais">
      <label>Resumo *</label>
      <textarea id="f-resumo" rows="10" oninput="contar()" placeholder="Cole aqui o resumo (introdução, objetivo, método, resultados e conclusão)."></textarea>
      <div class="contador" id="f-contador">0 / ${c.limiteResumo} caracteres (mínimo 200)</div>
      <label>Palavras-chave * (três a seis, separadas por vírgula)</label>
      <input id="f-palavras" placeholder="ex.: anemia, gestação, atenção básica">
      <div id="f-arquivo-bloco">
        <label>Arquivo do trabalho (PDF ou Word, até 15 MB)</label>
        <input id="f-arquivo" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        <div style="font-size:12px;color:var(--muted);margin-top:4px">A avaliação é <b>cega</b>: envie o arquivo <b>sem os nomes dos autores</b> — eles ficam só no formulário.</div>
      </div>
      <label style="margin-top:16px">Autores * (o primeiro é o autor correspondente — é no e-mail dele que chegam as decisões)</label>
      <div id="f-autores"></div>
      <button class="bt bt-ghost" style="margin-top:8px;padding:7px 12px;font-size:12.5px" onclick="if(AUTORES.length<${c.maxAutores}){AUTORES.push({});renderAutores()}">＋ Adicionar autor</button>
      <div class="linha-ok"><input type="checkbox" id="f-ok"><label for="f-ok" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--ink)">
        Declaro que o trabalho é de autoria dos nomeados, que não fere direitos de terceiros, e concordo com o tratamento
        dos dados dos autores pela UNIEGO/PROPPEX para a avaliação, a comunicação e a publicação dos trabalhos deste
        evento (Lei nº 13.709/2018).</label></div>
      <div id="f-msg"></div>
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="bt bt-pri" id="f-enviar" onclick="enviar()">Submeter o trabalho</button>
        <span style="font-size:12px;color:var(--muted)">Você recebe o número do trabalho e o link de acompanhamento por e-mail.</span>
      </div>
    </div>` : ""}`;
  if (c.aberta) { renderAutores(); mudouModalidade(); }
}
function mudouModalidade() {
  const m = (DADOS.config.modalidades || []).find((x) => x && x.codigo === $("f-modalidade").value) || {};
  $("f-mod-ajuda").textContent = m.ajuda || "";
  const bloco = $("f-arquivo-bloco");
  bloco.querySelector("label").textContent = m.codigo === "resumo" ? "Arquivo (opcional — PDF ou Word, até 15 MB)" : "Arquivo do trabalho * (PDF ou Word, até 15 MB)";
}
function contar() {
  const n = $("f-resumo").value.length, lim = DADOS.config.limiteResumo;
  const el = $("f-contador");
  el.textContent = `${n} / ${lim} caracteres (mínimo 200)`;
  el.style.color = n > lim || (n && n < 200) ? "var(--err)" : "var(--muted)";
}
function renderAutores() {
  $("f-autores").innerHTML = AUTORES.map((a, i) => `<div class="autor">
    <div class="g3">
      <div><label>${i === 0 ? "Autor correspondente" : `Autor ${i + 1}`} — nome completo *</label><input value="${esc(a.nome || "")}" oninput="AUTORES[${i}].nome=this.value"></div>
      <div><label>E-mail${i === 0 ? " *" : ""}</label><input type="email" value="${esc(a.email || "")}" oninput="AUTORES[${i}].email=this.value"></div>
      <div><label>Instituição</label><input value="${esc(a.instituicao || "")}" oninput="AUTORES[${i}].instituicao=this.value" placeholder="UNIEGO"></div>
      <div>${i > 0 ? `<button class="bt bt-ghost" style="padding:8px 10px;color:var(--err)" onclick="AUTORES.splice(${i},1);renderAutores()" title="remover">✕</button>` : ""}</div>
    </div>
    <div style="margin-top:4px"><label>Vínculo (aluno, docente, egresso, externo…)</label><input value="${esc(a.vinculo || "")}" oninput="AUTORES[${i}].vinculo=this.value" style="max-width:320px"></div>
  </div>`).join("");
}
async function enviar() {
  const msg = $("f-msg"); msg.innerHTML = "";
  const dados = {
    titulo: $("f-titulo").value, modalidade: $("f-modalidade").value, area: $("f-area") ? $("f-area").value : "",
    resumo: $("f-resumo").value, palavrasChave: $("f-palavras").value, autores: AUTORES, consentimento: $("f-ok").checked,
  };
  const fd = new FormData();
  fd.append("dados", JSON.stringify(dados));
  const arq = $("f-arquivo").files[0];
  if (arq) {
    if (arq.size > 15 * 1024 * 1024) { msg.innerHTML = `<div class="msg err">O arquivo passa de 15 MB.</div>`; return; }
    fd.append("arquivo", arq);
  }
  const bt = $("f-enviar"); bt.disabled = true; bt.textContent = "Enviando…";
  try {
    const r = await fetch(API, { method: "POST", body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Falha ${r.status}`);
    $("tela").innerHTML = `<div class="card">${cabecalho(DADOS.evento)}
      <div class="selo ok">Trabalho recebido</div>
      <h2 style="font-family:Sora,sans-serif;font-size:20px;color:var(--brand);margin:12px 0 6px">${esc(j.numero)}</h2>
      <p style="font-size:14px;line-height:1.6">O trabalho <b>${esc(dados.titulo)}</b> foi registrado. O número e o link de
        acompanhamento foram enviados para <b>${esc((AUTORES[0] || {}).email || "")}</b>.</p>
      <p style="font-size:13px;color:var(--muted);line-height:1.6">Guarde o link abaixo — é por ele que se acompanha a avaliação e
        se envia a versão corrigida, quando pedida. Se o e-mail não chegar, confira a caixa de spam.</p>
      <p><a class="bt bt-pri" href="${esc(j.link)}">Acompanhar o trabalho</a> <a class="bt bt-sec" href="/eventos/${encodeURIComponent(SLUG)}">Página do evento</a></p>
      <p style="font-size:11.5px;color:var(--muted);word-break:break-all">${esc(j.link)}</p>
    </div>`;
    window.scrollTo(0, 0);
  } catch (e) {
    msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
    bt.disabled = false; bt.textContent = "Submeter o trabalho";
  }
}

/* ---------------------------- o acompanhamento ---------------------------- */
const COR = { submetido: "info", "em-avaliacao": "warn", avaliado: "warn", correcao: "err", reenviado: "info", aceito: "ok", rejeitado: "err", retirado: "muted" };
const REC = { aceitar: "Aceitar", "aceitar-com-correcoes": "Aceitar com correções", rejeitar: "Rejeitar" };
function renderAcompanhamento(j) {
  const t = j.trabalho, crit = j.catalogos.criterios;
  const modal = (j.catalogos.modalidades.find((m) => m.codigo === t.modalidade) || {}).nome || t.modalidade;
  const atual = t.versoes[t.versoes.length - 1] || {};
  const explica = {
    submetido: "Recebido. A comissão científica vai designar os revisores.",
    "em-avaliacao": "Em avaliação pelos revisores. Você será avisado(a) por e-mail quando houver decisão.",
    avaliado: "Pareceres entregues; aguardando a decisão da comissão.",
    correcao: "A comissão pediu correções. Leia os pareceres abaixo e envie a versão corrigida.",
    reenviado: "Versão corrigida recebida; aguardando a decisão da comissão.",
    aceito: "Trabalho aceito. A coordenação do evento informará os próximos passos.",
    rejeitado: "O trabalho não foi aceito nesta edição.",
    retirado: "Trabalho retirado a pedido dos autores.",
  }[t.estado] || "";
  $("tela").innerHTML = `
    <div class="card">
      ${cabecalho(j.evento, "acompanhamento do trabalho")}
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="selo ${COR[t.estado] || "muted"}">${esc(t.rotulo)}</span>
        <b style="font-family:Sora,sans-serif;color:var(--brand)">${esc(t.numero)}</b>
        <span style="font-size:12.5px;color:var(--muted)">${esc(modal)}${t.area ? ` · ${esc(t.area)}` : ""}</span>
      </div>
      <h2 style="font-size:18px;margin:12px 0 6px;line-height:1.35">${esc(t.titulo)}</h2>
      <div style="font-size:13px;color:var(--ink-soft)">${t.autores.map((a) => esc(a.nome) + (a.instituicao ? ` (${esc(a.instituicao)})` : "")).join("; ")}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px">Palavras-chave: ${esc(t.palavrasChave.join(", "))}</div>
      <p style="font-size:14px;line-height:1.6;margin-top:12px">${esc(explica)}</p>
      ${t.decisao ? `<div class="decisao"><b>Decisão da comissão (${fmtHora(t.decisao.em)}):</b>\n${esc(t.decisao.mensagem || "—")}</div>` : ""}
    </div>

    ${t.pareceres.length ? `<div class="card" style="margin-top:14px">
      <div style="font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink)">Pareceres</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px">A avaliação é cega: os revisores não são identificados.</div>
      ${t.pareceres.map((p) => `<div class="parecer">
        <div class="t">${esc(p.revisor)} · <span class="selo ${p.recomendacao === "rejeitar" ? "err" : p.recomendacao === "aceitar" ? "ok" : "warn"}">${esc(REC[p.recomendacao] || p.recomendacao)}</span></div>
        <div class="notas">${crit.map((c) => `<span>${esc(c.nome)}: <b>${esc(p.notas[c.codigo] ?? "—")}</b>/5</span>`).join("")}</div>
        <div style="font-size:14px;line-height:1.6;white-space:pre-line">${esc(p.comentarios)}</div>
      </div>`).join("")}
    </div>` : ""}

    ${t.podeReenviar ? `<div class="card" style="margin-top:14px">
      <div style="font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink)">Enviar a versão corrigida</div>
      <label>Resumo corrigido *</label>
      <textarea id="c-resumo" rows="10">${esc(atual.resumo || "")}</textarea>
      <label>${t.modalidade === "resumo" ? "Arquivo (opcional)" : "Arquivo corrigido (PDF ou Word) — sem os nomes dos autores"}</label>
      <input id="c-arquivo" type="file" accept=".pdf,.doc,.docx">
      ${atual.arquivo && t.modalidade !== "resumo" ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">Sem arquivo novo, vale o anterior (${esc(atual.arquivo.name)}).</div>` : ""}
      <label>O que foi alterado (opcional, para a comissão)</label>
      <textarea id="c-nota" rows="3" placeholder="ex.: reescrevi a metodologia e incluí o n da amostra, conforme o Revisor A."></textarea>
      <div id="c-msg"></div>
      <p style="margin-top:14px"><button class="bt bt-pri" id="c-enviar" onclick="reenviar()">Enviar a versão corrigida</button></p>
    </div>` : ""}

    <div class="card" style="margin-top:14px">
      <div style="font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink)">Versões enviadas</div>
      <div style="margin-top:8px">${t.versoes.map((v) => `<div class="versao">
        <b>Versão ${v.n}</b><span style="color:var(--muted)">${fmtHora(v.em)}</span>
        ${v.arquivo ? `<a href="${esc(v.arquivo.link)}">${esc(v.arquivo.name)}</a>` : `<span style="color:var(--muted)">só o resumo</span>`}
        ${v.nota ? `<span style="color:var(--ink-soft)">— ${esc(v.nota)}</span>` : ""}
      </div>`).join("")}</div>
      <details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:var(--brand)">Ver o resumo da versão atual</summary>
        <pre class="resumo">${esc(atual.resumo || "")}</pre></details>
      ${t.podeRetirar ? `<p style="margin-top:14px"><button class="bt bt-ghost" style="color:var(--err)" onclick="retirar()">Retirar o trabalho</button></p>` : ""}
    </div>`;
}
async function reenviar() {
  const msg = $("c-msg"); msg.innerHTML = "";
  const fd = new FormData();
  fd.append("dados", JSON.stringify({ resumo: $("c-resumo").value, nota: $("c-nota").value }));
  const arq = $("c-arquivo").files[0];
  if (arq) { if (arq.size > 15 * 1024 * 1024) { msg.innerHTML = `<div class="msg err">O arquivo passa de 15 MB.</div>`; return; } fd.append("arquivo", arq); }
  const bt = $("c-enviar"); bt.disabled = true; bt.textContent = "Enviando…";
  try {
    const r = await fetch(`${API}/${encodeURIComponent(TOKEN)}/versao`, { method: "POST", body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Falha ${r.status}`);
    await carregar(); window.scrollTo(0, 0);
  } catch (e) { msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; bt.disabled = false; bt.textContent = "Enviar a versão corrigida"; }
}
async function retirar() {
  if (!confirm("Retirar o trabalho da avaliação? Isto não se desfaz.")) return;
  const r = await fetch(`${API}/${encodeURIComponent(TOKEN)}/retirar`, { method: "POST" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return alert(j.error || "Falha ao retirar.");
  carregar();
}
carregar();
</script>
</body>
</html>
