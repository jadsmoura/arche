<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Parecer — Eventos UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<link rel="stylesheet" href="/assets/arche-ui.css">
<script src="/assets/arche-editor.js" defer></script>
<style>
  /* ARCHÉ TR — a página do REVISOR (set/2026), em /eventos/revisao/<token>.
     O token é por trabalho + revisor e chega só no e-mail do convite; a página
     recebe o trabalho SEM os autores (quem os tira é o servidor). */
  main{max-width:820px;margin:26px auto 40px;padding:0 16px}
  .cab h1{font-family:Sora,sans-serif;font-size:22px;color:var(--brand);margin:0 0 4px}
  .cab .s{color:var(--muted);font-size:13.5px}
  .selo{font-size:12px;font-weight:600;border-radius:20px;padding:5px 12px;display:inline-block}
  .selo.ok{background:var(--ok-soft);color:var(--ok)} .selo.warn{background:var(--warn-soft);color:var(--warn)}
  .selo.info{background:var(--accent-wash);color:var(--brand)} .selo.muted{background:var(--wash);color:var(--muted)}
  .msg{border-radius:10px;padding:10px 13px;font-size:13px;font-weight:600;margin-top:12px;line-height:1.5}
  .msg.err{background:var(--err-soft);color:var(--err)} .msg.ok{background:var(--ok-soft);color:var(--ok)}
  .resumo{font-size:14.5px;line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0 0}
  .resumo h4{font-family:Sora,sans-serif;font-size:14px;color:var(--brand);margin:16px 0 5px}
  .resumo h4:first-child{margin-top:0}
  .resumo p{margin:0 0 9px}.resumo ul,.resumo ol{margin:0 0 9px;padding-left:22px}
  .resumo img{max-width:100%;height:auto;border-radius:8px;display:block;margin:10px auto}
  .crit{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .crit:first-child{border-top:0}
  .crit .n{font-size:14px}
  .escala{display:flex;gap:4px}
  .escala label{margin:0;text-transform:none;letter-spacing:0}
  .escala input{display:none}
  .escala span{display:inline-block;width:36px;height:34px;line-height:34px;text-align:center;border:1.5px solid var(--line);border-radius:8px;font-weight:700;cursor:pointer;color:var(--muted);background:#fff}
  .escala input:checked+span{background:var(--brand);color:#fff;border-color:var(--brand)}
  @media(max-width:560px){.crit{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-rule"></div>
  <div class="topo-inner">
    <img class="u" src="/assets/logo-uniego.png" alt="UNIEGO" onerror="this.style.display='none'">
    <div class="vr"></div>
    <div class="topo-txt">
      <div class="topo-t"><span class="arche-wm"><span class="arche-tx">Parecer do revisor</span></span></div>
      <div class="topo-s">Eventos · Extensão · PROPPEX / UNIEGO</div>
    </div>
    <nav class="topo-nav"><a href="/eventos/">Eventos</a></nav>
  </div>
</header>
<main id="tela"><div class="card"><p style="color:var(--muted)">Carregando…</p></div></main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* O texto do trabalho é HTML saneado (negrito, listas, imagens): mostrá-lo
   escapado imprimiria as tags. A limpeza roda de novo no navegador. */
const rico = (html) => (window.ArcheEditor ? ArcheEditor.limpar(ArcheEditor.paraHtml(html)) : esc(String(html || "")));
const blocoTexto = (titulo, html) => (html ? `<h4>${esc(titulo)}</h4><div>${rico(html)}</div>` : "");
const fmt = (iso) => (/^\d{4}-\d{2}-\d{2}/.test(String(iso || "")) ? String(iso).slice(0, 10).split("-").reverse().join("/") : "—");
const fmtHora = (iso) => (iso ? new Date(iso).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—");
const TOKEN = location.pathname.replace(/\/+$/, "").split("/").pop();
const API = `/api/publico/revisao/${encodeURIComponent(TOKEN)}`;
let D = null;

async function carregar() {
  try {
    const r = await fetch(API);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Falha ${r.status}`);
    D = j; render();
  } catch (e) {
    $("tela").innerHTML = `<div class="card"><div class="msg err">${esc(e.message)}</div></div>`;
  }
}
function render() {
  const { evento: ev, trabalho: t, catalogos: cat, config: c, revisor } = D;
  const modal = (cat.modalidades.find((m) => m.codigo === t.modalidade) || {}).nome || t.modalidade;
  const p = t.parecer;
  $("tela").innerHTML = `
    <div class="card">
      <div class="cab" style="margin-bottom:12px">
        <h1>${esc(ev.nome || "Evento")}</h1>
        <div class="s">${esc([ev.curso, ev.periodoInicio ? `${fmt(ev.periodoInicio)}${ev.periodoFim && ev.periodoFim !== ev.periodoInicio ? " a " + fmt(ev.periodoFim) : ""}` : ""].filter(Boolean).join(" · "))} · parecer ${revisor.nome ? `de ${esc(revisor.nome)}` : ""}</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b style="font-family:Sora,sans-serif;color:var(--brand)">${esc(t.numero)}</b>
        <span style="font-size:12.5px;color:var(--muted)">${esc(modal)}${t.area ? ` · ${esc(t.area)}` : ""} · versão ${t.versao ? t.versao.n : 1}</span>
        ${p ? `<span class="selo ok">parecer entregue em ${fmtHora(p.em)}</span>` : t.encerrado ? `<span class="selo muted">trabalho já decidido</span>` : `<span class="selo warn">aguardando o seu parecer</span>`}
      </div>
      <h2 style="font-size:18px;margin:12px 0 4px;line-height:1.35">${esc(t.titulo)}</h2>
      ${t.tituloEn ? `<div style="font-size:14px;color:var(--ink-soft);font-style:italic">${esc(t.tituloEn)}</div>` : ""}
      <div style="font-size:12.5px;color:var(--muted);margin-top:6px">${t.curso ? `Curso: ${esc(t.curso)} · ` : ""}Avaliação cega: os autores não são mostrados, e o seu nome não vai ao autor.</div>
      <p style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
        <a class="bt bt-sec" href="${API}/pdf" target="_blank" rel="noopener">📄 PDF (cópia cega)</a>
        ${t.versao && t.versao.arquivo ? `<a class="bt bt-ghost" href="${esc(t.versao.arquivo.link)}">⬇ Arquivo anexado (${esc(t.versao.arquivo.name)})</a>` : ""}</p>
      ${(() => { const v = t.versao || {}; const sec = cat.secoes || [];
        return `<div class="resumo">${blocoTexto("Resumo", v.resumo)}<p><b>Palavras-chave:</b> ${esc((v.palavrasChave || []).join("; "))}</p>${v.abstract ? `${blocoTexto("Abstract", v.abstract)}<p><b>Keywords:</b> ${esc((v.keywords || []).join("; "))}</p>` : ""}${v.secoes ? sec.map((s) => blocoTexto(v.idioma === "en" ? s.en : s.nome, v.secoes[s.codigo])).join("") : ""}</div>`; })()}
      ${c.orientacoes || c.normasUrl ? `<details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:var(--brand)">Orientações e normas do evento</summary>
        <div style="font-size:13.5px;line-height:1.6;white-space:pre-line;margin-top:8px">${esc(c.orientacoes || "")}</div>
        ${c.normasUrl ? `<p><a href="${esc(c.normasUrl)}" target="_blank" rel="noopener">Normas ↗</a></p>` : ""}</details>` : ""}
    </div>

    <div class="card" style="margin-top:14px">
      <div style="font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink)">${p ? "O seu parecer" : "Parecer"}</div>
      ${p && !t.encerrado ? `<div style="font-size:12.5px;color:var(--muted);margin-top:4px">Já entregue. Você pode alterá-lo enquanto a comissão não decidir.</div>` : ""}
      ${t.encerrado && !p ? `<div class="msg err">A comissão já decidiu sobre este trabalho — o parecer não é mais aceito.</div>` : `
      <div style="margin-top:10px">${cat.criterios.map((cr) => `<div class="crit">
        <div class="n">${esc(cr.nome)}</div>
        <div class="escala">${[1, 2, 3, 4, 5].map((n) => `<label><input type="radio" name="n-${esc(cr.codigo)}" value="${n}" ${p && p.notas[cr.codigo] === n ? "checked" : ""}><span>${n}</span></label>`).join("")}</div>
      </div>`).join("")}</div>
      <div style="font-size:11.5px;color:var(--muted)">1 = insuficiente · 3 = adequado · 5 = excelente</div>
      <label>Recomendação *</label>
      <select id="p-rec">${cat.recomendacoes.map((r) => `<option value="${esc(r.codigo)}" ${p && p.recomendacao === r.codigo ? "selected" : ""}>${esc(r.nome)}</option>`).join("")}</select>
      <label>Comentários ao autor * (o autor lê; sem a sua identificação)</label>
      <textarea id="p-autor" rows="8" placeholder="Pontos fortes, o que precisa ser corrigido ou esclarecido, sugestões.">${esc(p ? p.comentariosAutor : "")}</textarea>
      <label>Comentários à comissão (o autor NÃO lê)</label>
      <textarea id="p-comissao" rows="3" placeholder="Conflito de interesse, suspeita de plágio, observação reservada.">${esc(p ? p.comentariosComissao : "")}</textarea>
      <div id="p-msg"></div>
      <p style="margin-top:14px"><button class="bt bt-pri" id="p-enviar" onclick="enviar()">${p ? "Atualizar o parecer" : "Entregar o parecer"}</button></p>`}
    </div>`;
}
async function enviar() {
  const msg = $("p-msg"); msg.innerHTML = "";
  const notas = {};
  for (const cr of D.catalogos.criterios) {
    const m = document.querySelector(`input[name="n-${cr.codigo}"]:checked`);
    if (m) notas[cr.codigo] = Number(m.value);
  }
  const corpo = { notas, recomendacao: $("p-rec").value, comentariosAutor: $("p-autor").value, comentariosComissao: $("p-comissao").value };
  const bt = $("p-enviar"); bt.disabled = true;
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Falha ${r.status}`);
    D.trabalho = j.trabalho; render();
    window.scrollTo(0, 0);
    document.querySelector("main .card").insertAdjacentHTML("beforeend", `<div class="msg ok">Parecer registrado. Obrigado!</div>`);
  } catch (e) { msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; bt.disabled = false; }
}
carregar();
</script>
</body>
</html>
