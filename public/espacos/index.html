<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHÉ ES · Reserva de Espaços · PROPPEX / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
  :root{
    --brand:#1c3742; --brand-2:#2d535c; --brand-3:#40717e; --accent:#71c8e2;
    --bg:#ebeef3; --card:#fff; --line:#e3e7ee; --line-2:#f0f2f6; --trilho:#eef1f5;
    --ink:#1c3742; --ink-soft:#3a4650; --muted:#7c8794; --muted-2:#a9b4c0;
    --ok:#3f8a5d; --ok-soft:#e5f3ea; --warn:#c98a2b; --warn-soft:#fbf3e4;
    --err:#a1524c; --err-soft:#f6e9e7; --info:#40717e; --info-soft:#e8f4fa;
    --roxo:#5e5091; --roxo-soft:#ecebf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-3);text-decoration:none}
  a:hover{color:var(--brand-2)}
  ::selection{background:var(--accent);color:var(--brand)}
  button{font-family:Figtree,system-ui,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
  .f-disp{font-family:Sora,sans-serif}

  /* ------------------------------- casca -------------------------------- */
  .app{display:flex;min-height:100vh}
  .side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side-marca{padding:20px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
  .side-marca b{color:var(--accent);font-weight:800}
  .side-nav{padding:14px 12px;flex:1;overflow-y:auto}
  .side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:8px 12px 6px}
  .side-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
    margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
    border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
    transition:background .15s,color .15s}
  .side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
  .side-item svg{flex:none}
  .side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
  .side-pe .av{width:34px;height:34px;border-radius:50%;background:var(--brand-3);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
  .side-pe .av img{width:100%;height:100%;object-fit:cover}
  .side-pe .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
  .side-pe .pp{font-size:11px;color:rgba(255,255,255,.5)}
  .side-pe .sair{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-weight:600}
  .side-pe .sair:hover{color:#fff}

  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .topbar .dir{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .area{padding:28px 32px;flex:1}
  .limite{max-width:1180px}
  h1{font-family:Sora,sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}

  /* ------------------------------- cartões ------------------------------ */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}
  .card-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;margin-bottom:2px}
  .card-s{font-size:12px;color:var(--muted);margin-bottom:20px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .kpi .v{font-family:Sora,sans-serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:7px;color:var(--muted)}
  .duplo{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.duplo{grid-template-columns:1fr}}
  .barra{margin-bottom:15px}
  .barra .cab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
  .barra .cab span:first-child{color:var(--ink-soft);font-weight:500}
  .barra .cab span:last-child{color:var(--muted);font-weight:600}
  .barra .tr{height:9px;background:var(--trilho);border-radius:5px;overflow:hidden}
  .barra .tr i{display:block;height:100%;border-radius:5px}
  .linha{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .linha:last-child{border-bottom:0}
  .linha .txt{flex:1;min-width:0}
  .linha .p1{font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .linha .p2{font-size:11.5px;color:var(--muted)}
  .ponto{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
  .vazio{font-size:13px;color:var(--muted);padding:10px 0}
  .verTodas{font-size:12px;font-weight:600;color:var(--brand-3);background:none;border:0;cursor:pointer}

  /* ------------------------------ formulários --------------------------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;border:1px solid #cfd6de;border-radius:8px;padding:10px 12px;
    font-family:Figtree,system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{min-height:84px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(64,113,126,.12)}
  .sec-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:22px 0 6px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .muted{color:var(--muted);font-size:12.5px;font-weight:400}
  .kv{margin:4px 0;font-size:13.5px;color:var(--ink-soft)}
  .kv b{color:var(--ink);font-weight:600}

  /* -------------------------------- botões ------------------------------ */
  .bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bt-pri{background:var(--brand);color:#fff}
  .bt-pri:hover{background:var(--brand-2)}
  .bt-sec{background:var(--info-soft);color:var(--brand);border-color:#cfe6f2}
  .bt-sec:hover{background:#dbeef8}
  .bt-ghost{background:#fff;color:var(--muted);border-color:#cfd6de}
  .bt-ghost:hover{color:var(--ink);border-color:var(--brand-3)}
  .bt-ok{background:var(--ok-soft);color:var(--ok);border-color:#cfeeda}
  .bt-warn{background:var(--warn-soft);color:var(--warn);border-color:#f0e0bd}
  .bt-err{background:var(--err-soft);color:var(--err);border-color:#eed6d3}
  .bt:disabled{opacity:.5;cursor:not-allowed}
  .exp{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

  /* ------------------------------- estados ------------------------------ */
  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .b-submetida{background:var(--info-soft);color:var(--info)}
  .b-devolvida{background:var(--err-soft);color:var(--err)}
  .b-aprovada{background:var(--ok-soft);color:var(--ok)}
  .b-pendente{background:var(--warn-soft);color:var(--warn)}
  .b-relatorio-entregue{background:var(--roxo-soft);color:var(--roxo)}
  .b-registrada{background:#eceff3;color:var(--muted)}
  .banner{border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500}
  .ba-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0e0bd}
  .ba-err{background:var(--err-soft);color:var(--err);border:1px solid #eed6d3}
  .ba-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #cfeeda}

  /* -------------------------------- listas ------------------------------ */
  .item{display:flex;align-items:center;gap:14px;padding:15px 18px;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .item:hover{border-color:var(--brand-3);box-shadow:0 2px 10px -4px rgba(28,55,66,.18)}
  .item .nm{font-weight:600;flex:1;min-width:0;font-size:14px;color:var(--ink)}
  .item .cs{color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  /* PDF direto da lista: quem só quer o documento não precisa abrir a ata */
  .item .pdf{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    color:var(--brand-3);background:var(--wash);border:1px solid var(--line);border-radius:8px;
    padding:6px 11px;transition:.15s;white-space:nowrap}
  .item .pdf:hover{background:var(--accent-wash);border-color:var(--brand-3);color:var(--brand)}
  /* arquivo agrupado por categoria — cursos e órgãos institucionais — para
     as atas de origens diferentes não se misturarem numa lista só */
  details.grupo{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  details.grupo>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:14px 18px;font-weight:600;font-size:14px;color:var(--ink);user-select:none;transition:background .15s}
  details.grupo>summary::-webkit-details-marker{display:none}
  details.grupo>summary:hover{background:var(--wash)}
  details.grupo>summary .qt{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--brand-3);
    background:var(--wash);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap}
  details.grupo>summary .seta{font-size:10px;color:var(--muted);transition:transform .2s}
  details.grupo[open]>summary .seta{transform:rotate(180deg)}
  details.grupo .corpo{padding:4px 14px 12px;border-top:1px solid var(--line)}
  details.grupo .corpo .item{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;background:none;padding:13px 6px}
  details.grupo .corpo .item:last-child{border-bottom:0}
  details.grupo .corpo .item:hover{box-shadow:none;background:var(--wash)}
  /* subgrupo por ÓRGÃO dentro do curso (recolhível), e as atas por ANO */
  details.sub{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
  details.sub>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
    padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--brand-3);font-weight:700;background:var(--wash);user-select:none;transition:background .15s}
  details.sub>summary::-webkit-details-marker{display:none}
  details.sub>summary:hover{background:var(--accent-wash)}
  details.sub>summary .qt2{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0}
  details.sub>summary .seta{font-size:9px;color:var(--muted);transition:transform .2s}
  details.sub[open]>summary .seta{transform:rotate(180deg)}
  details.sub .corpo2{padding:0 10px 6px;border-top:1px solid var(--line)}
  .subano{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:12px 6px 2px;
    display:flex;align-items:center;gap:10px}
  .subano::after{content:"";flex:1;height:1px;background:var(--line)}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px}
  .stat .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .s b{font-family:Sora,sans-serif;font-size:22px;display:block;color:var(--ink);line-height:1.1}
  .stat .s span{font-size:11.5px;color:var(--muted)}
  table.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.pt th{background:#f7f9fb;color:var(--muted);padding:9px 10px;text-align:left;font-size:11.5px;
    font-weight:600;border-bottom:1px solid var(--line)}
  table.pt td{border-bottom:1px solid var(--line-2);padding:8px 10px;color:var(--ink-soft)}
  table.pt td.bad{color:var(--err);font-weight:600}
  table.pt .rm{color:var(--err);cursor:pointer;font-weight:700}
  table.pt a{color:var(--brand-3);font-weight:600}
  .cnt{font-size:12.5px;color:var(--muted);margin:8px 0}
  .colmap{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .colmap select{width:auto;font-size:12.5px;padding:6px 8px}
  .tut{background:var(--info-soft);border:1px solid #cfe6f2;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px}
  .tut summary{font-family:Sora,sans-serif;font-weight:700;color:var(--brand);cursor:pointer;font-size:13.5px}
  .tut ol{margin:10px 0 4px 20px}
  .tut li{margin-bottom:5px}
  .tut .dica{background:#fff;border-radius:8px;padding:9px 12px;margin-top:8px;border:1px dashed #a9cfe0}
  .hide{display:none!important}

  /* ------------- janela de escolha (retomar encaminhamentos) ------------- */
  .ov{position:fixed;inset:0;background:rgba(28,55,66,.42);z-index:40;display:flex;
    align-items:flex-start;justify-content:center;padding:56px 18px 24px;overflow-y:auto}
  .ov-cx{background:#fff;border-radius:14px;width:100%;max-width:560px;padding:22px 22px 18px;
    box-shadow:0 24px 60px rgba(18,38,50,.28)}
  .ov-cab{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
  .ov-cab .t{font-family:Sora,sans-serif;font-weight:700;font-size:16px}
  .ov-x{background:none;border:0;font-size:20px;line-height:1;color:var(--muted-2);cursor:pointer;padding:0 2px}
  .ov-x:hover{color:var(--ink)}
  .enc-lista{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
  .enc-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;cursor:pointer;
    border-bottom:1px solid var(--line-2)}
  .enc-item:last-child{border-bottom:0}
  .enc-item:hover{background:var(--info-soft)}
  .enc-item.atrasado{border-left:3px solid var(--err)}
  .enc-item input{width:17px;height:17px;margin:2px 0 0;flex:none;accent-color:var(--brand)}
  .enc-item .ac{display:block;font-size:13px;font-weight:600;line-height:1.35}
  .enc-item .md{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

  @media(max-width:760px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .side-nav{padding:8px 10px;flex:1 1 100%;order:3;overflow-x:auto}
    .side-nav #menu{display:flex;gap:6px}
    .side-lab{display:none}
    .side-item{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px}
    .side-item.on{border-left:0;border-bottom-color:var(--accent)}
    .side-pe{border-top:0;margin-left:auto}
    .area{padding:20px 16px}
    .kpis{grid-template-columns:repeat(2,1fr)}
  }
</style>
<style>
  /* ------------------------ específico do ARCHÉ ES ---------------------- */
  :root{ --wash:#f4f7fa; --accent-wash:#e6f5fa; --linha:var(--line); }
  .b-solicitada{background:var(--info-soft);color:var(--info)}
  .b-encaminhada{background:var(--roxo-soft);color:var(--roxo)}
  .b-confirmada{background:var(--ok-soft);color:var(--ok)}
  .b-recusada{background:var(--err-soft);color:var(--err)}
  .b-cancelada{background:#eceff3;color:var(--muted)}
  .b-bloqueio{background:#fbf3e4;color:var(--warn)}

  /* calendário: uma coluna por dia, as reservas empilhadas dentro */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  @media(max-width:900px){.cal{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.cal{grid-template-columns:1fr}}
  .cal .dia{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:96px}
  .cal .dia.hoje{border-color:var(--brand-3);box-shadow:0 0 0 2px rgba(64,113,126,.12)}
  .cal .dia .cab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;margin-bottom:6px;display:flex;justify-content:space-between}
  .cal .dia .cab b{color:var(--ink);font-family:Sora,sans-serif;font-size:14px}
  .cal .ev{font-size:11.5px;line-height:1.3;border-left:3px solid var(--brand-3);background:var(--wash);
    border-radius:6px;padding:5px 7px;margin-bottom:5px;cursor:pointer}
  .cal .ev:hover{background:var(--accent-wash)}
  .cal .ev.pendente{opacity:.7;border-left-style:dashed}
  /* grade MENSAL: cabeçalho dos dias da semana e as casas anteriores ao dia 1 */
  .cal-mes .cab-sem{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em;text-align:center;padding:2px 0 4px}
  .cal-mes .dia.fora{background:transparent;border:0;min-height:0}
  .cal-mes .dia.passado{opacity:.55}
  @media(max-width:900px){.cal-mes .cab-sem{display:none}}
  /* legenda: também é filtro — clicar na cor mostra só aquele espaço */
  .legenda{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .legenda .lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);
    background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;cursor:pointer}
  .legenda .lg:hover{border-color:var(--brand-3)}
  .legenda .lg.on{border-color:var(--brand);background:var(--accent-wash);font-weight:600}
  .legenda .lg i{width:10px;height:10px;border-radius:3px;flex:none}
  .legenda .limpar{color:var(--muted)}
  .cal .ev.bloqueio{border-left-color:var(--warn);background:#fbf3e4}
  .cal .ev .h{font-weight:700;color:var(--ink)}
  .cal .ev .l{color:var(--muted);display:block}

  /* escolha dos espaços: caixa de marcação por espaço, com o complemento
     aparecendo só quando aquele espaço o exige */
  .esp-lista{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:860px){.esp-lista{grid-template-columns:1fr}}
  .esp{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;transition:.15s}
  .esp.on{border-color:var(--brand-3);background:var(--accent-wash)}
  .esp label.top{display:flex;gap:9px;align-items:flex-start;margin:0;cursor:pointer;
    font-size:13.5px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0}
  .esp label.top input{width:17px;height:17px;margin:1px 0 0;flex:none;accent-color:var(--brand)}
  .esp .cap{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
  .esp .compl{margin-top:8px;display:none;gap:8px}
  .esp.on .compl{display:flex}
  .esp .compl select,.esp .compl input{font-size:13px;padding:7px 9px}
  .esp.ocupado{border-color:#eed6d3;background:var(--err-soft)}

  .aviso-conflito{background:var(--err-soft);border:1px solid #eed6d3;color:var(--err);
    border-radius:10px;padding:12px 14px;font-size:13px;margin:12px 0}
  .aviso-livre{background:var(--ok-soft);border:1px solid #cfeeda;color:var(--ok);
    border-radius:10px;padding:12px 14px;font-size:13px;margin:12px 0}
  .res{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin-bottom:10px}
  .res .tt{font-weight:600;font-size:14px;color:var(--ink)}
  .res .mt{font-size:12.5px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <a class="side-marca" href="/" title="Voltar ao portal">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 37 L8 20 A12 12 0 0 1 32 20 L32 37" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4" fill="#71c8e2"/></svg>
      <span>ARCHÉ <b>ES</b></span>
    </a>
    <div class="side-nav">
      <div class="side-lab">ESPAÇOS</div>
      <div id="menu"></div>
    </div>
    <div class="side-pe" id="rodape-usuario"></div>
  </nav>

  <div class="conteudo">
    <div class="topbar">
      <div class="crumb">ARCHÉ ES <span style="color:var(--muted-2)">/</span> <b id="crumb">Agenda</b></div>
      <div class="dir"><span id="dir-info"></span></div>
    </div>

    <div class="area">
      <div class="limite">
        <h1 id="titulo">Agenda dos espaços</h1>
        <div class="sub" id="subtitulo">O que já está reservado, para ninguém pedir em cima.</div>
        <div id="aviso"></div>

        <section id="v-agenda" class="hide"></section>
        <section id="v-nova" class="hide"></section>
        <section id="v-minhas" class="hide"></section>
        <section id="v-pedidos" class="hide"></section>
        <section id="v-catalogo" class="hide"></section>
      </div>
    </div>
  </div>
</div>

<script src="/assets/arche-nav.js" defer></script>
<script>
/* =======================================================================
   ARCHÉ ES — Reserva de Espaços Acadêmicos.
   A tela é uma casca fina: todas as regras (conflito, bloqueio, situação)
   moram no servidor (lib/espacos.js). Aqui só se pergunta e se mostra —
   inclusive a conferência de disponibilidade, que é uma SIMULAÇÃO da mesma
   rota que grava, para a resposta ser exatamente a que vai valer.
   ======================================================================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => (/^\d{4}-\d{2}-\d{2}$/.test(String(iso || "")) ? iso.split("-").reverse().join("/") : "—");
const hojeISO = () => new Date().toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" });
const somaDias = (iso, n) => {
  const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const DIAS_SEMANA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const diaDaSemana = (iso) => DIAS_SEMANA[new Date(iso + "T12:00:00Z").getUTCDay()];

let DADOS = null, SECAO = "agenda", AGENDA = null, AG_MES = hojeISO().slice(0, 7), AG_ESPACO = "";
let SEL = {};              // espaços marcados no formulário: id → {detalhe, quantidade}
let OFICIO = null;         // documento anexado ao pedido em preparo
const ROT_STATUS = { solicitada: "Aguardando a reserva", encaminhada: "Na PROPPEX",
  confirmada: "Confirmada", recusada: "Recusada", cancelada: "Cancelada" };

const IC = {
  agenda: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  nova: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>',
  minhas: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  pedidos: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3 7-7"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>',
  catalogo: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg>',
};
const SECOES = [
  { k: "agenda", rot: "Agenda", ic: IC.agenda, tit: "Agenda dos espaços",
    sub: "O que já está reservado, para ninguém pedir em cima." },
  { k: "nova", rot: "Solicitar espaço", ic: IC.nova, tit: "Solicitar um espaço",
    sub: "Escolha os espaços, o período e diga para que serão usados." },
  { k: "minhas", rot: "Minhas solicitações", ic: IC.minhas, tit: "Minhas solicitações",
    sub: "O andamento dos seus pedidos, do envio à confirmação." },
  { k: "pedidos", rot: "Pedidos", ic: IC.pedidos, tit: "Pedidos de reserva", gestao: true,
    sub: "Confirme, encaminhe à PROPPEX ou recuse — com o motivo registrado." },
  { k: "catalogo", rot: "Espaços e bloqueios", ic: IC.catalogo, tit: "Espaços e bloqueios", gestao: true,
    sub: "O catálogo dos espaços e os períodos em que eles não podem ser usados." },
];

function menu() {
  $("menu").innerHTML = SECOES.filter((s) => !s.gestao || DADOS?.gestao)
    .map((s) => `<button class="side-item${s.k === SECAO ? " on" : ""}" data-k="${s.k}"
      onclick="nav('${s.k}')">${s.ic}<span>${s.rot}</span></button>`).join("");
}

function nav(secao) {
  SECAO = secao;
  document.querySelectorAll("main section, .limite > section").forEach((s) => s.classList.add("hide"));
  const meta = SECOES.find((s) => s.k === SECAO) || SECOES[0];
  $("titulo").textContent = meta.tit;
  $("subtitulo").textContent = meta.sub;
  $("crumb").textContent = meta.rot;
  $("v-" + SECAO).classList.remove("hide");
  menu();
  if (SECAO === "agenda") renderAgenda();
  if (SECAO === "nova") renderNova();
  if (SECAO === "minhas") renderMinhas();
  if (SECAO === "pedidos") renderPedidos();
  if (SECAO === "catalogo") renderCatalogo();
  window.scrollTo(0, 0);
}

async function carregar() {
  const r = await fetch("/api/espacos");
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Falha ao carregar");
  DADOS = await r.json();
}

/* A agenda é MENSAL (pedido do dono, ago/2026): o registro do auditório tem
   reserva em todos os meses do semestre, e uma janela corrida de quatro
   semanas escondia o resto. O mês é a unidade em que se pensa a agenda de um
   campus — e é o que o seletor filtra. */
const primeiroDia = (mes) => `${mes}-01`;
const ultimoDia = (mes) => {
  const [a, m] = mes.split("-").map(Number);
  return `${mes}-${String(new Date(Date.UTC(a, m, 0)).getUTCDate()).padStart(2, "0")}`;
};
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho",
  "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const rotuloMes = (mes) => `${MESES[Number(mes.slice(5, 7)) - 1]} de ${mes.slice(0, 4)}`;
// "Maio de 2026", não "Maio De 2026": o CSS capitalize maiusculiza toda
// palavra, inclusive a preposição
const rotuloMesTitulo = (mes) => rotuloMes(mes).charAt(0).toUpperCase() + rotuloMes(mes).slice(1);
const mesVizinho = (mes, n) => {
  const [a, m] = mes.split("-").map(Number);
  const d = new Date(Date.UTC(a, m - 1 + n, 1));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
};

async function carregarAgenda() {
  const de = primeiroDia(AG_MES), ate = ultimoDia(AG_MES);
  const url = `/api/espacos/agenda?de=${de}&ate=${ate}` + (AG_ESPACO ? `&espaco=${encodeURIComponent(AG_ESPACO)}` : "");
  const r = await fetch(url);
  AGENDA = r.ok ? await r.json() : { reservas: [], bloqueios: [], de, ate };
}

/* ------------------------------- agenda -------------------------------- */
async function renderAgenda() {
  if (!AGENDA) { $("v-agenda").innerHTML = '<div class="card"><div class="muted">Carregando a agenda…</div></div>'; await carregarAgenda(); }
  const de = AGENDA.de, ate = AGENDA.ate;
  const hoje = hojeISO();

  // o mês desenhado inteiro, começando no domingo — assim as semanas ficam
  // alinhadas e o dia 1 não aparece solto numa coluna qualquer
  const primeiro = new Date(de + "T12:00:00Z");
  const vazias = primeiro.getUTCDay();
  const dias = [];
  for (let d = de; d <= ate; d = somaDias(d, 1)) dias.push(d);

  // cada reserva ocupa todos os dias do seu período: é assim que o
  // calendário mostra a semana inteira tomada por um evento grande
  const porDia = {};
  const põe = (dia, html) => { (porDia[dia] = porDia[dia] || []).push(html); };
  for (const r of AGENDA.reservas || []) {
    const rot = (r.itens || []).map((i) => i.rotulo).join(" · ");
    const pend = r.status !== "confirmada";
    for (let d = r.dataInicio; d <= (r.dataFim || r.dataInicio); d = somaDias(d, 1)) {
      if (d < de || d > ate) continue;
      const cor = (r.itens || [])[0]?.cor || corEspaco((r.itens || [])[0]?.espaco);
      põe(d, `<div class="ev${pend ? " pendente" : ""}" style="border-left-color:${cor};background:${cor}12"
        title="${esc(rot)} — ${esc(ROT_STATUS[r.status] || "")}"
        onclick="detalhe('${r.id}')"><span class="h">${esc(diaTodo(r) ? "dia todo" : r.horaInicio)}</span> ${esc(r.atividade || "Reserva")}
        <span class="l">${esc(rot)}${pend ? " · pedido" : ""}</span></div>`);
    }
  }
  for (const b of AGENDA.bloqueios || []) {
    const nomes = (b.espacos || []).map((id) => nomeEspaco(id)).join(" · ");
    for (let d = b.dataInicio; d <= (b.dataFim || b.dataInicio); d = somaDias(d, 1)) {
      if (d < de || d > ate) continue;
      põe(d, `<div class="ev bloqueio" title="${esc(b.motivo || "")}">⛔ ${esc(b.motivo || "Bloqueado")}
        <span class="l">${esc(nomes)}</span></div>`);
    }
  }
  const ocupados = Object.keys(porDia).length;
  const marcas = Object.values(porDia).reduce((n, x) => n + x.length, 0);

  // o seletor cobre os meses em que HÁ reserva, mais os doze meses à frente:
  // pular para dezembro não deve exigir doze cliques
  const meses = [...new Set([
    ...(DADOS.mesesComReserva || []),
    ...Array.from({ length: 13 }, (_, i) => mesVizinho(hoje.slice(0, 7), i - 1)),
    AG_MES,
  ])].sort();
  const selMes = `<select onchange="AG_MES=this.value;AGENDA=null;renderAgenda()"
      style="width:auto;padding:7px 10px;font-size:13px">
      ${meses.map((m) => `<option value="${m}"${m === AG_MES ? " selected" : ""}>${rotuloMes(m)}</option>`).join("")}
    </select>`;
  const selEspaco = `<select onchange="AG_ESPACO=this.value;AGENDA=null;renderAgenda()" style="width:auto;padding:7px 10px;font-size:13px">
      <option value="">todos os espaços</option>
      ${(DADOS.espacos || []).map((e) => `<option value="${esc(e.id)}"${AG_ESPACO === e.id ? " selected" : ""}>${esc(e.nome)}${e.local ? ` — ${esc(e.local)}` : ""}</option>`).join("")}
    </select>`;

  $("v-agenda").innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <div><div class="card-t" style="margin:0">${rotuloMesTitulo(AG_MES)}</div>
          <div class="card-s" style="margin:2px 0 0">${marcas ? `${marcas} ocupação(ões) em ${ocupados} dia(s)` : "mês livre"}
            — confirmadas em cinza-azulado; pedidos aguardando decisão, mais claros; bloqueios em âmbar.</div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${selMes}${selEspaco}
          <button class="bt bt-ghost" onclick="AG_MES=mesVizinho(AG_MES,-1);AGENDA=null;renderAgenda()">←</button>
          <button class="bt bt-ghost" onclick="AG_MES=hojeISO().slice(0,7);AGENDA=null;renderAgenda()">mês atual</button>
          <button class="bt bt-ghost" onclick="AG_MES=mesVizinho(AG_MES,1);AGENDA=null;renderAgenda()">→</button>
        </div>
      </div>
      ${legendaEspacos()}
      <div class="cal cal-mes">
        ${["dom", "seg", "ter", "qua", "qui", "sex", "sáb"].map((d) => `<div class="cab-sem">${d}</div>`).join("")}
        ${Array.from({ length: vazias }, () => '<div class="dia fora"></div>').join("")}
        ${dias.map((d) => `<div class="dia${d === hoje ? " hoje" : ""}${d < hoje ? " passado" : ""}">
          <div class="cab"><span>${diaDaSemana(d)}</span><b>${d.slice(8)}</b></div>
          ${(porDia[d] || []).join("") || '<div class="muted" style="font-size:11px">livre</div>'}
        </div>`).join("")}
      </div>
    </div>
    <div class="card">
      <div class="card-t">Solicitar um espaço</div>
      <div class="card-s">Achou um horário livre? O pedido cai na mesa da responsável pela reserva.</div>
      <button class="bt bt-pri" onclick="nav('nova')">+ Solicitar espaço</button>
    </div>`;
}

const diaTodo = (r) => r?.horaInicio === "00:00" && r?.horaFim === "23:59";
const faixaHora = (r) => (diaTodo(r) ? "dia todo" : `${r.horaInicio}–${r.horaFim}`);

/* A etiqueta de cor por espaço (pedido do dono, ago/2026): num calendário
   cheio, a cor é o que transforma "o auditório está livre nesse dia?" numa
   olhada em vez de uma leitura. Vem do catálogo — a gestão a troca lá. */
const corEspaco = (id) => (DADOS?.espacos || []).find((e) => e.id === id)?.cor || "#40717e";

function legendaEspacos() {
  const usados = (DADOS?.espacos || []).filter((e) => e.ativo !== false);
  return `<div class="legenda">${usados.map((e) => `<span class="lg${AG_ESPACO === e.id ? " on" : ""}"
    onclick="AG_ESPACO='${esc(e.id)}';AGENDA=null;renderAgenda()" title="Ver só ${esc(e.nome)}">
    <i style="background:${esc(e.cor || "#40717e")}"></i>${esc(e.nome)}</span>`).join("")}
    ${AG_ESPACO ? `<span class="lg limpar" onclick="AG_ESPACO='';AGENDA=null;renderAgenda()">× ver todos</span>` : ""}
  </div>`;
}

const nomeEspaco = (id) => (DADOS?.espacos || []).find((e) => e.id === id)?.nome || id;

function detalhe(id) {
  const r = (DADOS.reservas || []).find((x) => x.id === id);
  if (!r) { alert("Reserva de outro solicitante — a agenda mostra o horário ocupado, não os dados de quem pediu."); return; }
  nav("minhas");
}

/* --------------------------- nova solicitação --------------------------- */
function renderNova() {
  const espacos = (DADOS.espacos || []).filter((e) => e.ativo !== false);
  $("v-nova").innerHTML = `
    <div class="card">
      <div class="card-t">1. Quais espaços?</div>
      <div class="card-s">Marque quantos precisar — um evento grande pode tomar vários de uma vez.</div>
      <div class="esp-lista">
        ${espacos.map((e) => cartaoEspaco(e)).join("")}
      </div>
    </div>

    <div class="card">
      <div class="card-t">2. Quando?</div>
      <div class="card-s">Para um dia só, deixe o último dia igual ao primeiro.</div>
      <div class="grid2">
        <div><label>Primeiro dia *</label><input type="date" id="f-ini" min="${hojeISO()}" onchange="sincronizarFim()"></div>
        <div><label>Último dia *</label><input type="date" id="f-fim" min="${hojeISO()}"></div>
        <div><label>Início *</label><input type="time" id="f-hi" value="19:00"></div>
        <div><label>Término *</label><input type="time" id="f-hf" value="22:00"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-t">3. Para quê?</div>
      <div class="card-s">É o que a agenda mostra a todos — e o que a responsável usa para decidir.</div>
      <div class="grid2">
        <div><label>Atividade *</label><input id="f-atividade" placeholder="Ex.: Aula inaugural do curso de Enfermagem"></div>
        <div><label>Órgão *</label>
          <select id="f-orgao" onchange="mudouOrgao()">
            <option value="">Selecione…</option>
            ${(DADOS.orgaos || []).map((g) => `<optgroup label="${esc(g.grupo)}">
              ${g.opcoes.map((o) => `<option value="${esc(o.codigo)}">${esc(o.rotulo)}</option>`).join("")}
            </optgroup>`).join("")}
          </select>
          <input id="f-orgao-outro" class="hide" style="margin-top:8px" placeholder="Qual órgão, empresa ou entidade">
        </div>
        <div><label>Quem solicita *</label><select id="f-interessado" onchange="mudouOrgao()">
          ${(DADOS.interessados || []).map((i) => `<option value="${esc(i.codigo)}">${esc(i.rotulo)}</option>`).join("")}
        </select></div>
        <div><label>Público previsto</label><input type="number" id="f-publico" min="0" placeholder="Nº de pessoas"></div>
        <div><label>Telefone para contato</label><input id="f-tel" value="${esc(DADOS.telefone || "")}"></div>
      </div>
      <label>Justificativa *</label>
      <textarea id="f-justificativa" placeholder="Para qual finalidade o espaço será utilizado"></textarea>
      <label>Recursos necessários</label>
      <input id="f-recursos" placeholder="Ex.: som, projeção, 200 cadeiras, água">
      <label>Observações</label>
      <textarea id="f-obs" style="min-height:60px"></textarea>

      <div class="sec-t">Ofício</div>
      <p class="muted" id="f-oficio-nota">Se o pedido é de um órgão, de uma empresa ou de uma
        entidade da comunidade, anexe o ofício que o formaliza. PDF, Word ou imagem, até 10 MB.</p>
      <input type="file" id="f-oficio-arq" accept=".pdf,.doc,.docx,image/*" onchange="subirOficio()"
        style="border:1px dashed #cfd6de;background:#fff;padding:9px 12px">
      <div id="f-oficio-estado" class="muted" style="margin-top:6px"></div>
    </div>

    <div id="f-resultado"></div>
    <div class="exp">
      <button class="bt bt-sec" onclick="conferir()">Conferir disponibilidade</button>
      <button class="bt bt-pri" onclick="enviar()">Enviar solicitação</button>
    </div>
    <div class="muted" style="margin-top:8px">O pedido vai para a responsável pela reserva, com cópia ao
      setor de eventos. Você recebe um e-mail a cada passo.</div>`;
  $("f-ini").value = hojeISO();
  $("f-fim").value = hojeISO();
  $("f-oficio-estado").innerHTML = OFICIO
    ? `✓ <a href="${esc(OFICIO.link)}" target="_blank" rel="noopener">${esc(OFICIO.nome)}</a> anexado.`
    : "";
  mudouOrgao();
  aplicarSelecao();
}

function cartaoEspaco(e) {
  const s = SEL[e.id];
  const compl = e.detalhe ? (
    e.detalhe.tipo === "bloco"
      ? `<select onchange="SEL['${e.id}'].detalhe=this.value">
          <option value="">${esc(e.detalhe.rotulo)}…</option>
          ${(DADOS.blocos || []).map((b) => `<option${s?.detalhe === b ? " selected" : ""}>${esc(b)}</option>`).join("")}</select>`
      : e.detalhe.tipo === "curso"
        ? `<select onchange="SEL['${e.id}'].detalhe=this.value">
            <option value="">${esc(e.detalhe.rotulo)}…</option>
            ${(DADOS.cursos || []).map((c) => `<option${s?.detalhe === c ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>`
        : `<input placeholder="${esc(e.detalhe.rotulo)}" value="${esc(s?.detalhe || "")}"
            oninput="SEL['${e.id}'].detalhe=this.value">`) : "";
  const qtd = e.quantidade
    ? `<input type="number" min="1" max="40" style="max-width:110px" placeholder="Quantas"
        value="${s?.quantidade || 1}" oninput="SEL['${e.id}'].quantidade=Number(this.value)||1">` : "";
  return `<div class="esp${s ? " on" : ""}" id="esp-${esc(e.id)}">
    <label class="top"><input type="checkbox" ${s ? "checked" : ""} onchange="marcar('${e.id}',this.checked)">
      <span>${esc(e.nome)}
        <span class="cap">${[e.local, e.capacidade ? `até ${e.capacidade} pessoas` : "", e.recursos]
          .filter(Boolean).map(esc).join(" · ")}</span></span></label>
    ${compl || qtd ? `<div class="compl">${compl}${qtd}</div>` : ""}
  </div>`;
}

function marcar(id, on) {
  if (on) SEL[id] = SEL[id] || { detalhe: "", quantidade: 1 };
  else delete SEL[id];
  aplicarSelecao();
}
function aplicarSelecao() {
  for (const e of DADOS.espacos || []) {
    const el = $("esp-" + e.id);
    if (el) el.classList.toggle("on", !!SEL[e.id]);
  }
}
function sincronizarFim() {
  // o caso comum é um dia só: o último dia acompanha o primeiro enquanto
  // ninguém o move para a frente
  const ini = $("f-ini").value, fim = $("f-fim").value;
  if (!fim || fim < ini) $("f-fim").value = ini;
}

/* O ofício é OBRIGATÓRIO quando o pedido vem de fora (decisão do dono,
   ago/2026): reserva para quem não é da instituição é ato que a gestão
   precisa poder justificar depois. A régua está no servidor; aqui a tela
   apenas diz, antes, o que ele vai cobrar. */
const pedidoExterno = () =>
  $("f-interessado").value === "comunidade" || ["externo", "comunidade"].includes($("f-orgao").value);

function mudouOrgao() {
  $("f-orgao-outro").classList.toggle("hide", $("f-orgao").value !== "outro");
  const nota = $("f-oficio-nota");
  if (pedidoExterno()) {
    nota.innerHTML = "<b>Obrigatório neste caso:</b> o pedido é de fora da instituição, e a reserva "
      + "só se registra com o ofício que a formaliza. PDF, Word ou imagem, até 10 MB.";
    nota.style.color = "var(--warn)";
  } else {
    nota.textContent = "Se o pedido é de um órgão, de uma empresa ou de uma entidade da comunidade, "
      + "anexe o ofício que o formaliza. PDF, Word ou imagem, até 10 MB.";
    nota.style.color = "";
  }
}

async function subirOficio() {
  const arq = $("f-oficio-arq").files?.[0];
  if (!arq) return;
  $("f-oficio-estado").innerHTML = "Enviando o ofício…";
  const fd = new FormData();
  fd.append("file", arq);
  try {
    const r = await fetch("/api/espacos/oficio", { method: "POST", body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "falha no envio");
    OFICIO = j.oficio;
    $("f-oficio-estado").innerHTML = `✓ <a href="${esc(OFICIO.link)}" target="_blank" rel="noopener">${esc(OFICIO.nome)}</a>
      anexado. <a href="#" onclick="tirarOficio();return false">remover</a>`;
  } catch (e) {
    OFICIO = null;
    $("f-oficio-estado").innerHTML = `<span style="color:var(--err)">Não foi possível anexar: ${esc(e.message)}</span>`;
  }
}
function tirarOficio() {
  OFICIO = null;
  $("f-oficio-arq").value = "";
  $("f-oficio-estado").textContent = "";
}

function lerFormulario() {
  return {
    itens: Object.entries(SEL).map(([espaco, v]) => ({ espaco, detalhe: v.detalhe || "", quantidade: v.quantidade || 1 })),
    dataInicio: $("f-ini").value, dataFim: $("f-fim").value,
    horaInicio: $("f-hi").value, horaFim: $("f-hf").value,
    atividade: $("f-atividade").value.trim(),
    orgao: $("f-orgao").value, orgaoOutro: $("f-orgao-outro").value.trim(),
    interessado: $("f-interessado").value,
    oficio: OFICIO,
    participantes: Number($("f-publico").value) || 0,
    justificativa: $("f-justificativa").value.trim(),
    recursos: $("f-recursos").value.trim(), observacoes: $("f-obs").value.trim(),
    solicitante: { telefone: $("f-tel").value.trim() },
  };
}

async function conferir() {
  const r = await fetch("/api/espacos/reservas", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...lerFormulario(), simular: true }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $("f-resultado").innerHTML = `<div class="aviso-conflito">${esc(j.error || "Confira os campos.")}</div>`; return; }
  const concorrentes = (j.concorrentes || []).length
    ? `<div class="muted" style="margin-top:6px">Há ${j.concorrentes.length} pedido(s) ainda sem decisão para
        o mesmo horário — eles não impedem o seu, mas a responsável decidirá qual fica.</div>` : "";
  $("f-resultado").innerHTML = j.livre
    ? `<div class="aviso-livre">✓ Os espaços estão livres nesse período.${concorrentes}</div>`
    : `<div class="aviso-conflito"><b>Ocupado:</b><br>${j.motivos.map(esc).join("<br>")}</div>`;
}

async function enviar() {
  const r = await fetch("/api/espacos/reservas", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(lerFormulario()) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $("f-resultado").innerHTML = `<div class="aviso-conflito">${esc(j.error || "Não foi possível enviar.")}</div>`; return; }
  SEL = {}; OFICIO = null;
  await carregar(); AGENDA = null;
  alert(`Solicitação registrada — protocolo ${j.reserva.protocolo}.\nVocê receberá um e-mail quando houver decisão.`);
  nav("minhas");
}

/* --------------------------- minhas / pedidos --------------------------- */
function cartaoReserva(r, { comAcoes = false } = {}) {
  const locais = (r.itens || []).map((i) => {
    const e = (DADOS.espacos || []).find((x) => x.id === i.espaco);
    return [e ? e.nome : i.espaco, i.detalhe, i.quantidade > 1 ? `${i.quantidade} salas` : ""].filter(Boolean).join(" — ");
  }).join(" · ");
  const hora = diaTodo(r) ? "o dia todo" : `das ${esc(r.horaInicio)} às ${esc(r.horaFim)}`;
  const quando = r.dataInicio === r.dataFim
    ? `${fmt(r.dataInicio)}, ${hora}`
    : `${fmt(r.dataInicio)} a ${fmt(r.dataFim)}, ${hora}`;
  const meu = r.solicitante?.email === DADOS.eu;
  const podeCancelar = (meu || DADOS.gestao) && ["solicitada", "encaminhada", "confirmada"].includes(r.status);
  const acoes = comAcoes && DADOS.gestao && ["solicitada", "encaminhada"].includes(r.status)
    ? `<div class="exp">
        <button class="bt bt-ok" onclick="decidir('${r.id}','confirmar')">✓ Confirmar</button>
        ${r.status === "solicitada" ? `<button class="bt bt-sec" onclick="decidir('${r.id}','encaminhar')">↗ Encaminhar à PROPPEX</button>` : ""}
        <button class="bt bt-err" onclick="decidir('${r.id}','recusar')">✕ Recusar</button>
      </div>` : "";
  return `<div class="res">
    <div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between">
      <div><div class="tt">${esc(r.atividade || "(sem atividade)")}</div>
        <div class="mt">${esc(locais)}</div>
        <div class="mt">${quando}</div>
        <div class="mt">${esc(nomeOrgao(r.orgao, r.orgaoOutro))}${r.solicitante?.nome ? ` · ${esc(r.solicitante.nome)}` : ""}${r.protocolo ? ` · ${esc(r.protocolo)}` : ""}</div>
      </div>
      <span class="badge b-${esc(r.status)}">${esc(ROT_STATUS[r.status] || r.status)}</span>
    </div>
    ${r.justificativa ? `<details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Justificativa e detalhes</summary>
      <div class="kv" style="margin-top:6px">${esc(r.justificativa)}</div>
      ${r.recursos ? `<div class="kv"><b>Recursos:</b> ${esc(r.recursos)}</div>` : ""}
      ${r.observacoes ? `<div class="kv"><b>Observações:</b> ${esc(r.observacoes)}</div>` : ""}
      ${r.solicitante?.telefone ? `<div class="kv"><b>Contato:</b> ${esc(r.solicitante.telefone)}</div>` : ""}
      ${r.participantes ? `<div class="kv"><b>Público previsto:</b> ${esc(r.participantes)}</div>` : ""}
      ${r.oficio?.link ? `<div class="kv"><b>Ofício:</b>
        <a href="${esc(r.oficio.link)}" target="_blank" rel="noopener">${esc(r.oficio.nome || "documento")}</a></div>` : ""}
    </details>` : ""}
    ${r.decisao?.motivo ? `<div class="banner ba-warn" style="margin:10px 0 0">${esc(r.decisao.motivo)}</div>` : ""}
    ${acoes}
    ${podeCancelar ? `<button class="bt bt-ghost" style="margin-top:10px" onclick="cancelar('${r.id}')">Cancelar reserva</button>` : ""}
  </div>`;
}

function renderMinhas() {
  const minhas = (DADOS.reservas || []).filter((r) => r.solicitante?.email === DADOS.eu)
    .sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));
  $("v-minhas").innerHTML = minhas.length
    ? minhas.map((r) => cartaoReserva(r)).join("")
    : `<div class="card"><div class="vazio">Você ainda não solicitou nenhum espaço.</div>
       <button class="bt bt-pri" onclick="nav('nova')">+ Solicitar espaço</button></div>`;
}

function renderPedidos() {
  const fila = (DADOS.reservas || []).filter((r) => ["solicitada", "encaminhada"].includes(r.status))
    .sort((a, b) => String(a.dataInicio).localeCompare(String(b.dataInicio)));
  const decididas = (DADOS.reservas || []).filter((r) => !["solicitada", "encaminhada"].includes(r.status))
    .sort((a, b) => String(b.atualizadoEm).localeCompare(String(a.atualizadoEm))).slice(0, 30);
  $("v-pedidos").innerHTML = `
    <div class="card">
      <div class="card-t">Aguardando decisão — ${fila.length}</div>
      <div class="card-s">Confirmar bloqueia o espaço na agenda de todos. Encaminhar leva o caso à PROPPEX.</div>
      ${fila.length ? fila.map((r) => cartaoReserva(r, { comAcoes: true })).join("")
        : '<div class="vazio">Nenhum pedido na fila. 🎉</div>'}
    </div>
    <div class="card">
      <div class="card-t">Já decididas</div>
      <div class="card-s">As 30 mais recentes.</div>
      ${decididas.length ? decididas.map((r) => cartaoReserva(r)).join("") : '<div class="vazio">Nada ainda.</div>'}
    </div>`;
}

async function decidir(id, acao) {
  let motivo = "";
  if (acao === "recusar") {
    motivo = prompt("Motivo da recusa (o solicitante recebe este texto):") || "";
    if (!motivo.trim()) return;
  } else if (acao === "encaminhar") {
    motivo = prompt("O que a PROPPEX precisa saber? (opcional)") || "";
  }
  const r = await fetch(`/api/espacos/reservas/${encodeURIComponent(id)}/decidir`, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ acao, motivo }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || "Não foi possível registrar a decisão."); return; }
  await carregar(); AGENDA = null; renderPedidos();
}

async function cancelar(id) {
  const motivo = prompt("Cancelar esta reserva? Diga o motivo (opcional):");
  if (motivo === null) return;
  const r = await fetch(`/api/espacos/reservas/${encodeURIComponent(id)}/cancelar`, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ motivo }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || "Não foi possível cancelar."); return; }
  await carregar(); AGENDA = null; nav(SECAO);
}

/* --------------------------- catálogo e bloqueios ----------------------- */
function renderCatalogo() {
  const esp = DADOS.espacos || [];
  $("v-catalogo").innerHTML = `
    <div class="card">
      <div class="card-t">Espaços</div>
      <div class="card-s">Espaço desativado sai da escolha sem sumir da agenda — o histórico dele continua de pé.
        Não renomeie o identificador de um espaço já usado: ele é a chave do que está reservado.</div>
      <table class="pt">
        <tr><th>Nome</th><th>Local</th><th>Capacidade</th><th>Disponível</th></tr>
        ${esp.map((e, i) => `<tr>
          <td><input value="${esc(e.nome)}" oninput="DADOS.espacos[${i}].nome=this.value"></td>
          <td><input value="${esc(e.local || "")}" oninput="DADOS.espacos[${i}].local=this.value"></td>
          <td><input type="number" min="0" value="${e.capacidade || 0}" oninput="DADOS.espacos[${i}].capacidade=Number(this.value)||0"></td>
          <td><input type="checkbox" style="width:auto" ${e.ativo !== false ? "checked" : ""}
            onchange="DADOS.espacos[${i}].ativo=this.checked"></td></tr>`).join("")}
      </table>
      <div class="exp">
        <button class="bt bt-sec" onclick="novoEspaco()">+ Novo espaço</button>
        <button class="bt bt-pri" onclick="salvarCatalogo()">Salvar catálogo</button>
      </div>
    </div>

    <div class="card">
      <div class="card-t">Bloqueios</div>
      <div class="card-s">Reforma, recesso, manutenção: o espaço existe e não pode ser usado.
        Bloqueio é do dia inteiro e trava o pedido como uma reserva confirmada.</div>
      ${(DADOS.bloqueios || []).length ? `<table class="pt">
        <tr><th>Espaços</th><th>Período</th><th>Motivo</th><th></th></tr>
        ${DADOS.bloqueios.map((b) => `<tr>
          <td>${esc((b.espacos || []).map(nomeEspaco).join(", "))}</td>
          <td>${fmt(b.dataInicio)} a ${fmt(b.dataFim)}</td>
          <td>${esc(b.motivo || "")}</td>
          <td class="rm" onclick="removerBloqueio('${b.id}')">remover</td></tr>`).join("")}
      </table>` : '<div class="vazio">Nenhum bloqueio ativo.</div>'}
      <div class="sec-t">Novo bloqueio</div>
      <label>Espaços</label>
      <div class="esp-lista">
        ${esp.map((e) => `<label class="esp" style="font-weight:500;font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer">
          <input type="checkbox" class="blq-esp" value="${esc(e.id)}" style="width:17px;height:17px">
          ${esc(e.nome)}</label>`).join("")}
      </div>
      <div class="grid3">
        <div><label>De</label><input type="date" id="b-ini"></div>
        <div><label>Até</label><input type="date" id="b-fim"></div>
        <div><label>Motivo</label><input id="b-motivo" placeholder="Ex.: reforma do palco"></div>
      </div>
      <button class="bt bt-pri" style="margin-top:12px" onclick="salvarBloqueio()">Gravar bloqueio</button>
    </div>`;
}

function novoEspaco() {
  DADOS.espacos.push({ id: "", nome: "Novo espaço", local: "", capacidade: 0, conflito: "unico", ativo: true });
  renderCatalogo();
}
async function salvarCatalogo() {
  const r = await fetch("/api/espacos/catalogo", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ espacos: DADOS.espacos }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || "Não foi possível gravar."); return; }
  DADOS.espacos = j.espacos; AGENDA = null; renderCatalogo();
  alert("Catálogo gravado.");
}
async function salvarBloqueio() {
  const espacos = [...document.querySelectorAll(".blq-esp:checked")].map((c) => c.value);
  const r = await fetch("/api/espacos/bloqueios", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ bloqueio: { espacos, dataInicio: $("b-ini").value, dataFim: $("b-fim").value, motivo: $("b-motivo").value.trim() } }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || "Não foi possível gravar o bloqueio."); return; }
  DADOS.bloqueios = j.bloqueios; AGENDA = null; renderCatalogo();
}
async function removerBloqueio(id) {
  if (!confirm("Remover este bloqueio? O espaço volta a aceitar reservas no período.")) return;
  const r = await fetch("/api/espacos/bloqueios", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ remover: id }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || "Não foi possível remover."); return; }
  DADOS.bloqueios = j.bloqueios; AGENDA = null; renderCatalogo();
}

/* --------------------------------- boot --------------------------------- */
carregar().then(async () => {
  const iniciais = (DADOS.nome || DADOS.eu || "?").trim().slice(0, 1).toUpperCase();
  $("rodape-usuario").innerHTML = `<div class="av">${esc(iniciais)}</div>
    <div><div class="nm">${esc(DADOS.nome || DADOS.eu)}</div>
      <div class="pp">${DADOS.gestao ? "Reserva de espaços" : "Solicitante"}</div></div>
    <a class="sair" href="/auth/sair">sair</a>`;
  $("dir-info").textContent = DADOS.gestao
    ? `${(DADOS.reservas || []).filter((r) => ["solicitada", "encaminhada"].includes(r.status)).length} pedido(s) aguardando`
    : "";
  await carregarAgenda();
  nav("agenda");
}).catch((e) => {
  $("aviso").innerHTML = `<div class="banner ba-err">${esc(e.message)}</div>`;
});
</script>
</body>
</html>
