<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu perfil · ARCHÉ</title>
<link rel="icon" href="/arche/favicon.svg">
<link rel="stylesheet" href="/assets/arche-ui.css">
<style>
  :root{--teal:var(--brand);--teal2:var(--brand-3);--cyan:var(--brand-2);--cyan-soft:var(--accent-wash)}
  body{align-items:center;justify-content:center;padding:20px}
  .box{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 32px 30px;max-width:490px;width:100%;
    box-shadow:var(--shadow-lg)}
  .box::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand-2) 55%,var(--accent) 100%)}
  h1{font-family:'Archivo',sans-serif;font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:8px 0 4px}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  .bt{width:100%;color:#fff;background:linear-gradient(160deg,var(--brand-2),var(--brand));box-shadow:0 6px 16px -8px var(--brand);margin-top:20px}
  .bt:hover{filter:brightness(1.08)}
  .bt:disabled{opacity:.6}
  .email{background:var(--accent-wash);border:1px solid var(--accent);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--brand)}
  .msg{margin-top:10px;font-size:13px;color:var(--ok);font-weight:700}
  .volta a{color:var(--brand-2);font-size:13px;font-weight:600;transition:.15s}
  .volta a:hover{color:var(--brand)}
</style>
</head>
<body>
<div class="box">
  <div class="volta" style="margin-bottom:12px"><a href="/">← Voltar ao portal</a></div>
  <span class="eyebrow">MEU PERFIL · ARCHÉ / PROPPEX</span>
  <h1>Complete seu perfil</h1>
  <div class="sub">Esses dados identificam suas submissões e serão pré-preenchidos nos formulários. Você pode ajustá-los depois.</div>
  <div class="email" id="email">…</div>
  <label>Nome completo *</label><input id="nome" placeholder="Ex.: Maria Silva Santos">
  <label>Titulação</label>
  <select id="titulacao"><option value="">—</option><option>Esp.</option><option>Me.</option><option>Ma.</option><option>Dr.</option><option>Dra.</option></select>
  <label>Função / cargo *</label><input id="funcao" placeholder="Ex.: Docente do Curso, Coordenador(a)…">
  <label>Curso / departamento *</label><select id="curso"></select>
  <label>Telefone</label><input id="telefone" placeholder="(62) 9…">
  <button class="bt" id="bt" onclick="salvar()">Salvar e continuar</button>
  <div class="msg" id="msg"></div>

  <div style="margin-top:26px;padding-top:20px;border-top:1px solid var(--line)">
    <label style="margin-top:0">Senha de acesso</label>
    <p class="dica" id="senha-estado" style="color:var(--muted);font-size:13px;margin-bottom:10px">…</p>
    <div id="senha-form" style="display:none">
      <input type="password" id="senha-atual" autocomplete="current-password" placeholder="Senha atual" style="display:none">
      <input type="password" id="senha-nova" autocomplete="new-password" placeholder="Nova senha (mínimo 8 caracteres)">
      <input type="password" id="senha-nova2" autocomplete="new-password" placeholder="Repita a nova senha" style="margin-top:8px">
      <button class="bt bt-sec" style="width:100%;margin-top:10px" onclick="salvarSenha()">Salvar senha</button>
      <div id="senha-msg" style="font-size:13px;font-weight:600;margin-top:8px"></div>
    </div>
    <button class="bt bt-sec" id="bt-senha" style="width:100%" onclick="abrirSenha()">Criar senha</button>
  </div>
</div>
<script>
const CURSOS=["Administração","Agronomia","Ciências Contábeis","Direito","Educação Física","Enfermagem",
"Engenharia Civil","Engenharia de Software","Engenharia Mecânica","Medicina Veterinária","Odontologia",
"Psicologia","Institucional / PROPPEX"];
const NEXT=new URLSearchParams(location.search).get("next")||"/extensao/";
const $=(id)=>document.getElementById(id);
$("curso").innerHTML='<option value="">Selecione…</option>'+CURSOS.map(c=>`<option>${c}</option>`).join("");
let TEM_SENHA=false;
fetch("/api/me").then(async r=>{
  if(r.status===401){location.href="/entrar?next="+encodeURIComponent(location.pathname+location.search);return;}
  const me=await r.json();
  $("email").textContent="Conta: "+me.email;
  if(me.perfil){$("nome").value=me.perfil.nome||"";$("funcao").value=me.perfil.funcao||"";
    $("curso").value=me.perfil.curso||"";$("telefone").value=me.perfil.telefone||"";$("titulacao").value=me.perfil.titulacao||"";}
  TEM_SENHA=!!me.temSenha;
  $("senha-estado").textContent=TEM_SENHA
    ? "Você já tem senha cadastrada. Pode trocá-la quando quiser."
    : "Hoje você entra pelo código enviado por e-mail. Crie uma senha para entrar direto, sem esperar o e-mail.";
  $("bt-senha").textContent=TEM_SENHA?"Trocar senha":"Criar senha";
});
function abrirSenha(){
  $("senha-form").style.display="block";
  $("bt-senha").style.display="none";
  if(TEM_SENHA) $("senha-atual").style.display="block";
  ($("senha-atual").style.display==="block"?$("senha-atual"):$("senha-nova")).focus();
}
async function salvarSenha(){
  const nova=$("senha-nova").value, nova2=$("senha-nova2").value, atual=$("senha-atual").value;
  const m=$("senha-msg");
  m.style.color="var(--err)";
  if(nova.length<8){m.textContent="Use pelo menos 8 caracteres.";return;}
  if(nova!==nova2){m.textContent="As duas senhas não são iguais.";return;}
  m.style.color="var(--muted)"; m.textContent="Salvando…";
  const r=await fetch("/auth/senha/definir",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({senha:nova,senhaAtual:atual})});
  const j=await r.json().catch(()=>({}));
  if(j.ok){
    m.style.color="var(--ok)"; m.textContent="✓ Senha salva. Use-a no próximo acesso.";
    $("senha-nova").value=""; $("senha-nova2").value=""; $("senha-atual").value="";
    TEM_SENHA=true; $("senha-estado").textContent="Você já tem senha cadastrada. Pode trocá-la quando quiser.";
  } else { m.style.color="var(--err)"; m.textContent=j.error||"Não foi possível salvar a senha."; }
}
async function salvar(){
  const dados={nome:$("nome").value.trim(),funcao:$("funcao").value.trim(),curso:$("curso").value,
    telefone:$("telefone").value.trim(),titulacao:$("titulacao").value};
  if(!dados.nome||!dados.funcao||!dados.curso){alert("Preencha nome, função e curso.");return;}
  $("bt").disabled=true;
  const r=await fetch("/api/perfil",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(dados)});
  if(r.ok){$("msg").textContent="✓ Salvo! Redirecionando…";setTimeout(()=>location.href=NEXT,600);}
  else{$("bt").disabled=false;alert("Falha ao salvar: "+((await r.json()).error||r.status));}
}
</script>
</body>
</html>
