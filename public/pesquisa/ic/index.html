<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHÉ IC · Iniciação Científica · PROPPEX / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
  :root{
    --brand:#1c3742; --brand-2:#2d535c; --brand-3:#40717e; --accent:#71c8e2;
    --bg:#eef1f4; --card:#fff; --line:#dde4e8; --line-2:#f0f2f6; --trilho:#eef1f5;
    --ink:#182632; --ink-soft:#3a4650; --muted:#657179; --muted-2:#a9b4c0;
    --ok:#3f8a5d; --ok-soft:#e5f3ea; --warn:#c98a2b; --warn-soft:#fbf3e4;
    --err:#a1524c; --err-soft:#f6e9e7; --info:#40717e; --info-soft:#e8f4fa;
    --roxo:#5e5091; --roxo-soft:#ecebf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-3);text-decoration:none}
  a:hover{color:var(--brand-2)}
  ::selection{background:var(--accent);color:var(--brand)}
  button{font-family:Figtree,system-ui,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
  .f-disp{font-family:Sora,sans-serif}

  /* ------------------------------- casca -------------------------------- */
  .app{display:flex;min-height:100vh}
  .side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side-marca{padding:20px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
  .side-marca b{color:var(--accent);font-weight:800}
  .side-nav{padding:14px 12px;flex:1;overflow-y:auto}
  .side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:10px 12px 6px}
  .side-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
    margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
    border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
    transition:background .15s,color .15s}
  .side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
  .side-item svg{flex:none}
  .side-item .tag{margin-left:auto;background:var(--accent);color:var(--brand);font-size:10.5px;
    font-weight:700;border-radius:20px;padding:1px 7px}
  .side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
  .side-pe .av{width:34px;height:34px;border-radius:50%;background:var(--brand-3);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
  .side-pe .av img{width:100%;height:100%;object-fit:cover}
  .side-pe .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
  .side-pe .pp{font-size:11px;color:rgba(255,255,255,.5)}
  .side-pe .sair{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-weight:600}
  .side-pe .sair:hover{color:#fff}

  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .topbar .dir{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .area{padding:28px 32px;flex:1}
  .limite{max-width:1180px}
  h1{font-family:Sora,sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}

  /* ------------------------------- cartões ------------------------------ */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}
  .card-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;margin-bottom:2px}
  .card-s{font-size:12px;color:var(--muted);margin-bottom:20px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpis>*{min-width:0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .kpi .v{font-family:Sora,sans-serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:7px;color:var(--muted)}
  /* Barras do panorama: uma cor só, porque o que se compara é TAMANHO —
     quem diz "quem é" é o rótulo da linha, não a cor. Marca fina, ponta
     arredondada e o número direto ao lado, para não precisar de eixo. */
  .barras{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .barra{display:grid;grid-template-columns:minmax(110px,36%) 1fr auto;align-items:center;gap:10px}
  .barra .rot{font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barra .trilho{height:10px;border-radius:5px;background:var(--trilho);overflow:hidden}
  .barra .fill{height:100%;border-radius:5px;background:var(--brand-3);min-width:2px}
  .barra .val{font-family:Sora,sans-serif;font-weight:700;font-size:13px;color:var(--ink);min-width:34px;text-align:right}
  .barra .val span{font-weight:500;font-size:11px;color:var(--muted);margin-left:3px}
  .barra:hover .fill{background:var(--brand-2)}
  .quad{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px}
  .quad .qt{font-family:Sora,sans-serif;font-weight:600;font-size:14px;color:var(--ink);margin-bottom:2px}
  .quad .qs{font-size:12px;color:var(--muted);margin-bottom:12px}
  .grade2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  @media(max-width:900px){.grade2{grid-template-columns:1fr}}
  .duplo{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px}
  .duplo>*{min-width:0}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.duplo{grid-template-columns:1fr}}
  .linha{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .linha:last-child{border-bottom:0}
  .linha .txt{flex:1;min-width:0}
  .linha .p1{font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .linha .p2{font-size:11.5px;color:var(--muted)}
  .vazio{font-size:13px;color:var(--muted);padding:10px 0}

  /* ------------------------------ formulários --------------------------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .grid2>*,.grid3>*{min-width:0}
  @media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;border:1px solid #cfd6de;border-radius:8px;padding:10px 12px;
    font-family:Figtree,system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{min-height:84px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(64,113,126,.12)}
  input[disabled],select[disabled],textarea[disabled]{background:#f7f9fb;color:var(--ink-soft)}
  .sec-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:22px 0 6px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  /* ações e filtros da lista de projetos: os botões numa linha própria e os
     recortes num painel em grade — a busca na primeira linha, os demais em
     colunas uniformes, para nada ficar embaralhado */
  .acoes-lista{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .painel-filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
  .painel-filtros select,.painel-filtros input{width:100%;min-width:0;font-size:13px;padding:8px 10px;margin:0}
  .painel-filtros .busca{grid-column:1/-1}
  .painel-filtros .bt{padding:8px 10px;font-size:12.5px}
  /* quadros de classificação recolhíveis: o panorama primeiro, a tabela num clique */
  details.quadro{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
  details.quadro>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:11px 14px;font-family:Sora,sans-serif;font-weight:700;font-size:13.5px;color:var(--ink);
    background:var(--wash);user-select:none;transition:background .15s}
  details.quadro>summary::-webkit-details-marker{display:none}
  details.quadro>summary:hover{background:var(--accent-wash)}
  details.quadro>summary .qt{margin-left:auto;font-size:11px;font-weight:600;color:var(--brand-2);
    background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap}
  details.quadro>summary .seta{font-size:10px;color:var(--muted);transition:transform .2s}
  details.quadro[open]>summary .seta{transform:rotate(180deg)}
  details.quadro>.rolo,details.quadro>.muted{padding:6px 12px 10px}
  .muted{color:var(--muted);font-size:12.5px;font-weight:400}
  /* selo de "há coisa por gravar" — fica ao lado do botão que grava, não no
     alto da página: é onde a pessoa está olhando quando digita */
  .selo-sujo{align-self:center;font-size:12px;color:var(--muted)}
  .selo-sujo.on{color:#a8730f;font-weight:700}
  .selo-sujo.on::before{content:"● "}
  .kv{margin:4px 0;font-size:13.5px;color:var(--ink-soft)}
  .kv b{color:var(--ink);font-weight:600}

  /* -------------------------------- botões ------------------------------ */
  .bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bt-pri{background:var(--brand);color:#fff}
  .bt-pri:hover{background:var(--brand-2)}
  .bt-sec{background:var(--info-soft);color:var(--brand);border-color:#cfe6f2}
  .bt-sec:hover{background:#dbeef8}
  .bt-ghost{background:#fff;color:var(--muted);border-color:#cfd6de}
  .bt-ghost:hover{color:var(--ink);border-color:var(--brand-3)}
  .bt-ok{background:var(--ok-soft);color:var(--ok);border-color:#cfeeda}
  .bt-err{background:var(--err-soft);color:var(--err);border-color:#eed6d3}
  .bt:disabled{opacity:.5;cursor:not-allowed}
  .exp{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

  /* ------------------------------- estados ------------------------------ */
  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .b-rascunho{background:#eceff3;color:var(--muted)}
  .b-submetido{background:var(--info-soft);color:var(--info)}
  .b-devolvido{background:var(--warn-soft);color:var(--warn)}
  .b-aprovado{background:var(--ok-soft);color:var(--ok)}
  .b-concluido{background:var(--roxo-soft);color:var(--roxo)}
  .b-reprovado{background:var(--err-soft);color:var(--err)}
  /* interrompido no meio da vigência — nem concluído, nem reprovado */
  .b-encerrado{background:var(--warn-soft);color:var(--warn)}
  .b-prevista{background:#eceff3;color:var(--muted)}
  .b-andamento{background:var(--info-soft);color:var(--info)}
  .b-concluida{background:var(--ok-soft);color:var(--ok)}
  .b-atrasada{background:var(--err-soft);color:var(--err)}
  .b-enviado{background:var(--info-soft);color:var(--info)}
  .b-validado{background:var(--ok-soft);color:var(--ok)}
  .banner{border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500}
  .ba-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0e0bd}
  .ba-err{background:var(--err-soft);color:var(--err);border:1px solid #eed6d3}
  .ba-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #cfeeda}
  .ba-info{background:var(--info-soft);color:var(--info);border:1px solid #cfe6f2}

  /* -------------------------------- listas ------------------------------ */
  .item{display:flex;align-items:center;gap:14px;padding:15px 18px;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .item:hover{border-color:var(--brand-3);box-shadow:0 2px 10px -4px rgba(28,55,66,.18)}
  .item .nm{font-weight:600;flex:1;min-width:0;font-size:14px;color:var(--ink)}
  .item .cs{color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  .num{font-family:Sora,sans-serif;font-size:12px;font-weight:700;color:var(--brand-3);white-space:nowrap}
  table.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.pt th{background:#f7f9fb;color:var(--muted);padding:9px 10px;text-align:left;font-size:11.5px;
    font-weight:600;border-bottom:1px solid var(--line)}
  table.pt td{border-bottom:1px solid var(--line-2);padding:8px 10px;color:var(--ink-soft);vertical-align:middle}
  table.pt td input,table.pt td select{font-size:12.5px;padding:7px 8px}
  table.pt .rm{color:var(--err);cursor:pointer;font-weight:700;background:none;border:0;font-size:15px}
  .rolo{overflow-x:auto}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat>*{min-width:0}
  .stat .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .s b{font-family:Sora,sans-serif;font-size:22px;display:block;color:var(--ink);line-height:1.1}
  .stat .s span{font-size:11.5px;color:var(--muted)}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .filtros select,.filtros input{width:auto;min-width:150px;font-size:13px;padding:8px 10px}
  .bloco{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;background:#fcfdfe}
  .bloco.meu{border-color:#cfe6f2;background:#f7fbfd}
  .bloco-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .bloco-cab .t{font-weight:600;font-size:14px;color:var(--ink);flex:1;min-width:0}
  .prazo{font-size:12px;color:var(--muted);white-space:nowrap}
  .tut{background:var(--info-soft);border:1px solid #cfe6f2;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px}
  .tut summary{font-family:Sora,sans-serif;font-weight:700;color:var(--brand);cursor:pointer;font-size:13.5px}
  .tut ol{margin:10px 0 4px 20px}
  .tut li{margin-bottom:5px}
  .hide{display:none!important}

  /* ---------------- devolutiva da seleção, colada ao projeto -------------- */
  .proj-linha{margin-bottom:2px}
  .proj-linha .item{margin-bottom:0}
  .aval-rec{background:var(--info-soft);border:1px solid #cfe6f2;border-top:0;
    border-radius:0 0 10px 10px;margin:-2px 0 12px;padding:0 14px}
  .aval-rec summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--info);padding:9px 0}
  .aval-rec summary:hover{color:var(--brand-2)}
  .aval-rec[open] summary{border-bottom:1px solid #cfe6f2;margin-bottom:10px}
  .aval-rec .aval-item{padding-bottom:10px;font-size:13px;color:var(--ink-soft)}
  .aval-rec .aval-item + .aval-item{border-top:1px dashed #cfe6f2;padding-top:12px}
  .aval-rec .aval-t{font-family:Sora,sans-serif;font-weight:700;font-size:12.5px;color:var(--brand)}
  .aval-rec table{font-size:12.5px}
  .cont-box{margin:12px 0 12px;padding:12px 14px;background:#fff;border:1px solid #cfe6f2;border-radius:10px}
  .cont-t{font-family:Sora,sans-serif;font-weight:700;font-size:13px;color:var(--brand)}
  .cont-resp{margin-top:10px;padding-top:9px;border-top:1px dashed #cfe6f2;font-size:12.5px;color:var(--ink-soft)}

  /* --------------------------- ver como (picker) ------------------------- */
  /* A lista de pessoas do setor cresce a cada edital: numa caixa de seleção
     única viravam dezenas de linhas para rolar. Vira um botão que abre uma
     janela com busca — quem procura alguém digita três letras. */
  .vc-bt{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #cfd6de;
    border-radius:8px;padding:6px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .vc-bt:hover{border-color:var(--brand-3);color:var(--ink)}
  .vc-bt b{color:var(--ink);font-weight:600}
  .vc-bt.on{background:var(--warn-soft);border-color:#e8d3a8;color:#8a6420}
  .vc-bt.on b{color:#6d4e19}
  .ov{position:fixed;inset:0;background:rgba(28,55,66,.42);z-index:10050;display:flex;
    align-items:flex-start;justify-content:center;padding:60px 18px 24px;overflow-y:auto}
  .ov-cx{background:#fff;border-radius:14px;width:100%;max-width:520px;padding:22px 22px 18px;
    box-shadow:0 24px 60px rgba(18,38,50,.28)}
  .ov-cab{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
  .ov-cab .t{font-family:Sora,sans-serif;font-weight:700;font-size:16px;flex:1}
  .ov-x{background:none;border:0;font-size:20px;line-height:1;color:var(--muted-2);cursor:pointer;padding:0 2px}
  .ov-x:hover{color:var(--ink)}
  .vc-lab{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--muted-2);margin:18px 0 8px}
  .vc-gen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vc-op{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);
    border-radius:9px;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
  .vc-op small{font-weight:400;font-size:11.5px;color:var(--muted)}
  .vc-op:hover{border-color:var(--brand-3)}
  .vc-op.on{background:var(--info-soft);border-color:#a8d5e8;color:var(--brand)}
  .vc-abas{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
  .vc-aba{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;
    color:var(--muted);cursor:pointer}
  .vc-aba:hover{border-color:var(--brand-3);color:var(--ink)}
  .vc-aba.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .vc-lista{max-height:290px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
  .vc-p{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;
    border-bottom:1px solid var(--line-2);padding:9px 12px;cursor:pointer}
  .vc-p:last-child{border-bottom:0}
  .vc-p:hover,.vc-p.foco{background:var(--info-soft)}
  .vc-p.on{background:var(--info-soft);box-shadow:inset 3px 0 0 var(--brand-3)}
  .vc-ini{width:30px;height:30px;border-radius:50%;background:var(--trilho);color:var(--brand-3);flex:none;
    display:grid;place-items:center;font-size:11.5px;font-weight:700}
  .vc-p .nm{display:block;font-size:13px;font-weight:600;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vc-p .dt{display:block;font-size:11px;color:var(--muted);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vc-p .tags{margin-left:auto;display:flex;gap:4px;flex:none}
  .vc-tag{font-size:10px;font-weight:700;border-radius:20px;padding:2px 7px;background:var(--trilho);color:var(--muted)}
  .vc-tag.o{background:var(--info-soft);color:var(--info)}
  .vc-tag.a{background:var(--ok-soft);color:var(--ok)}
  .vc-tag.v{background:var(--roxo-soft);color:var(--roxo)}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  linhas: [], certificados: [], informados: [], fomentos: [], titulacoes: [], blocosProducao: [],

let PROJETOS = [], ETAPAS = [], RELS = { relatorios: [], pendentes: [] };

/* ------------------------------- infra --------------------------------- */
/* Enquanto se olha pelos olhos de outra pessoa, o recorte é feito no
   servidor — não basta esconder menu, senão a tela mentiria sobre o que a
   pessoa vê (o sigilo do parecer ad hoc é o caso mais claro). */
function comQuem(url) {
  if (!COMO) return url;
  return url + (url.includes("?") ? "&" : "?") + "como=" + encodeURIComponent(COMO);
}

async function api(url, opcoes) {
  // "Ver como" é somente leitura de ponta a ponta: escrever aqui gravaria em
  // nome da COORDENAÇÃO (a sessão real) enquanto a tela finge ser outra
  // pessoa — o servidor já recusa escrita com ?como=, e o cliente não deve
  // contornar isso tirando o parâmetro.
  if (COMO && opcoes && (opcoes.method || "GET") !== "GET")
    throw new Error("Você está vendo o setor como outra pessoa — saia do modo \"ver como\" para editar.");
  const r = await fetch(!opcoes || (opcoes.method || "GET") === "GET" ? comQuem(url) : url, opcoes);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Falha (${r.status})`);
  return j;
}
function aviso(msg, tipo = "ok") {
  $("aviso").innerHTML = faixaVerComo() + `<div class="banner ba-${tipo}">${esc(msg)}</div>`;
  if (tipo === "ok") setTimeout(() => { if ($("aviso").textContent.includes(msg)) $("aviso").innerHTML = faixaVerComo(); }, 6000);
  window.scrollTo(0, 0);
}
const cursoNome = (slug) => (META.cursos.find((c) => c.slug === slug) || {}).nome || slug || "—";
const modNome = (c) => (META.modalidades.find((m) => m.codigo === c) || {}).nome || c || "—";
const linhaNome = (c) => (META.linhas.find((l) => l.codigo === c) || {}).nome || c || "—";
const fomentoNome = (c) => (META.fomentos.find((f) => f.codigo === c) || {}).nome || c || "—";
// a modalidade que vale: a definida pelo fomento; senão, a pretendida
const modVigente = (p) => (p.fomento?.modalidade ? modNome(p.fomento.modalidade)
  : p.modalidade ? modNome(p.modalidade) + " (pretendida)" : linhaNome(p.linha));
function pontuarProducao(q) {
  let total = 0;
  for (const b of META.blocosProducao) {
    // a planilha não tem teto: cada bloco soma o que somar
    total += b.itens.reduce((s, i) => s + (Math.max(0, Math.trunc(Number(q?.[i.codigo]) || 0))) * i.peso, 0);
  }
  return Math.round(total * 100) / 100;
}
const chip = (s) => `<span class="badge b-${esc(s)}">${esc(META.rotulos[s] || s)}</span>`;
const ehAluno = () => META.perfil === "aluno";
// "Edital 01/2025" é o CICLO 2025/2026 (setembro → agosto): o rótulo leva
// os dois, senão o leitor procura os projetos de "2025-2026" no 01/2026
const rotuloCiclo = (numero) => {
  const ano = Number(String(numero || "").split("/").pop());
  return ano ? `Edital ${numero} · ciclo ${ano}/${ano + 1}` : `Edital ${numero}`;
};
const ehAvaliador = () => META.perfil === "avaliador";
const recNome = (c) => (META.recomendacoes.find((r) => r.codigo === c) || {}).nome || c || "—";

async function sair() {
  // o "ver como" mora no sessionStorage, que sobrevive à troca de usuário na
  // mesma aba: sem limpar aqui, quem entrasse depois abriria o setor com a

}

/* ------------------------------ navegação ------------------------------ */

/* ---------------------------- ver como ----------------------------------
   A coordenação olha o setor pelos olhos de quem precisar conferir. São duas
   coisas diferentes: as VISÕES GENÉRICAS — a cara de cada um dos três
   acessos, sem os dados de ninguém — e as PESSOAS do setor, que crescem a
   cada edital. Por isso a escolha saiu de uma caixa de seleção única (que já
   passava de cem linhas para rolar) e virou uma janela com busca: quem
   procura alguém digita três letras.
   ---------------------------------------------------------------------- */
const GENERICAS = [
  { id: "", rot: "A sua visão", det: "coordenação de pesquisa", curto: "gestor" },
  { id: "perfil:orientador", rot: "Professor", det: "genérica, ainda sem projeto",
    curto: "professor genérico", faixa: "um professor recém-chegado, ainda sem projeto" },
  { id: "perfil:aluno", rot: "Aluno", det: "genérica, ainda sem projeto",
    curto: "aluno genérico", faixa: "um aluno recém-chegado, ainda sem projeto" },
  { id: "perfil:avaliador", rot: "Avaliador ad hoc", det: "genérica, sem designação",
    curto: "avaliador genérico", faixa: "um avaliador ad hoc, ainda sem projeto designado" },
];
const PAPEL_VC = {
  orientador: { rot: "Professor", cls: "o" },
  aluno: { rot: "Aluno", cls: "a" },
  avaliador: { rot: "Avaliador", cls: "v" },
  // as contas do PORTAL: quem ainda não tem projeto na IC, mas usa o sistema
  docente: { rot: "Docente", cls: "o" },
  estudante: { rot: "Estudante", cls: "a" },
  conta: { rot: "Conta", cls: "v" },
};
let VC = { busca: "", aba: "todos" };

/* As três listas do servidor viram uma só: quem acumula papéis (o professor
   que também avalia) aparecia repetido, uma vez em cada grupo. */
function vcPessoas() {
  const m = new Map();
  const juntar = (lista, papel) => (lista || []).forEach((p) => {
    const a = m.get(p.id) || { ...p, papeis: [], contagem: {} };
    a.nome = a.nome || p.nome; a.semConta = a.semConta || p.semConta;
    if (!a.papeis.includes(papel)) a.papeis.push(papel);
    a.contagem[papel] = p.projetos || 0;
    m.set(p.id, a);
  });
  juntar(META.pessoas?.orientadores, "orientador");
  juntar(META.pessoas?.alunos, "aluno");
  juntar(META.pessoas?.avaliadores, "avaliador");
  // e as contas do portal, para alcançar quem ainda não tem projeto: quem já
  // aparece acima é reconhecido pelo id e ganha só mais uma etiqueta
  juntar(META.pessoas?.docentes, "docente");
  juntar(META.pessoas?.estudantes, "estudante");
  juntar(META.pessoas?.outros, "conta");
  return [...m.values()].sort((a, b) => (a.nome || a.email).localeCompare(b.nome || b.email, "pt-BR"));
}

const semAcento = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const vcRotulo = (id) => {
  const g = GENERICAS.find((x) => x.id === id);
  if (g) return g.curto;
  const p = vcPessoas().find((x) => x.id === id);
  return (p?.nome || p?.email || id).split(" ").slice(0, 2).join(" ");
};

function montarVerComo() {

    Ver como <b>${esc(vcRotulo(COMO))}</b></button>`;
}

      </div>
