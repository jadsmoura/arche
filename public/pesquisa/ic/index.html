<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHÉ IC · Iniciação Científica · PROPPEX / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
  :root{
    --brand:#1c3742; --brand-2:#2d535c; --brand-3:#40717e; --accent:#71c8e2;
    --bg:#ebeef3; --card:#fff; --line:#e3e7ee; --line-2:#f0f2f6; --trilho:#eef1f5;
    --ink:#1c3742; --ink-soft:#3a4650; --muted:#7c8794; --muted-2:#a9b4c0;
    --ok:#3f8a5d; --ok-soft:#e5f3ea; --warn:#c98a2b; --warn-soft:#fbf3e4;
    --err:#a1524c; --err-soft:#f6e9e7; --info:#40717e; --info-soft:#e8f4fa;
    --roxo:#5e5091; --roxo-soft:#ecebf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-3);text-decoration:none}
  a:hover{color:var(--brand-2)}
  ::selection{background:var(--accent);color:var(--brand)}
  button{font-family:Figtree,system-ui,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
  .f-disp{font-family:Sora,sans-serif}

  /* ------------------------------- casca -------------------------------- */
  .app{display:flex;min-height:100vh}
  .side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side-marca{padding:20px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
  .side-marca b{color:var(--accent);font-weight:800}
  .side-nav{padding:14px 12px;flex:1;overflow-y:auto}
  .side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:10px 12px 6px}
  .side-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
    margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
    border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
    transition:background .15s,color .15s}
  .side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
  .side-item svg{flex:none}
  .side-item .tag{margin-left:auto;background:var(--accent);color:var(--brand);font-size:10.5px;
    font-weight:700;border-radius:20px;padding:1px 7px}
  .side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
  .side-pe .av{width:34px;height:34px;border-radius:50%;background:var(--brand-3);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
  .side-pe .av img{width:100%;height:100%;object-fit:cover}
  .side-pe .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
  .side-pe .pp{font-size:11px;color:rgba(255,255,255,.5)}
  .side-pe .sair{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-weight:600}
  .side-pe .sair:hover{color:#fff}

  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .topbar .dir{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .area{padding:28px 32px;flex:1}
  .limite{max-width:1180px}
  h1{font-family:Sora,sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}

  /* ------------------------------- cartões ------------------------------ */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}
  .card-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;margin-bottom:2px}
  .card-s{font-size:12px;color:var(--muted);margin-bottom:20px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpis>*{min-width:0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .kpi .v{font-family:Sora,sans-serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:7px;color:var(--muted)}
  .duplo{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px}
  .duplo>*{min-width:0}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.duplo{grid-template-columns:1fr}}
  .linha{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .linha:last-child{border-bottom:0}
  .linha .txt{flex:1;min-width:0}
  .linha .p1{font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .linha .p2{font-size:11.5px;color:var(--muted)}
  .vazio{font-size:13px;color:var(--muted);padding:10px 0}

  /* ------------------------------ formulários --------------------------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .grid2>*,.grid3>*{min-width:0}
  @media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;border:1px solid #cfd6de;border-radius:8px;padding:10px 12px;
    font-family:Figtree,system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{min-height:84px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(64,113,126,.12)}
  input[disabled],select[disabled],textarea[disabled]{background:#f7f9fb;color:var(--ink-soft)}
  .sec-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:22px 0 6px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .muted{color:var(--muted);font-size:12.5px;font-weight:400}
  .kv{margin:4px 0;font-size:13.5px;color:var(--ink-soft)}
  .kv b{color:var(--ink);font-weight:600}

  /* -------------------------------- botões ------------------------------ */
  .bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bt-pri{background:var(--brand);color:#fff}
  .bt-pri:hover{background:var(--brand-2)}
  .bt-sec{background:var(--info-soft);color:var(--brand);border-color:#cfe6f2}
  .bt-sec:hover{background:#dbeef8}
  .bt-ghost{background:#fff;color:var(--muted);border-color:#cfd6de}
  .bt-ghost:hover{color:var(--ink);border-color:var(--brand-3)}
  .bt-ok{background:var(--ok-soft);color:var(--ok);border-color:#cfeeda}
  .bt-err{background:var(--err-soft);color:var(--err);border-color:#eed6d3}
  .bt:disabled{opacity:.5;cursor:not-allowed}
  .exp{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

  /* ------------------------------- estados ------------------------------ */
  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .b-rascunho{background:#eceff3;color:var(--muted)}
  .b-submetido{background:var(--info-soft);color:var(--info)}
  .b-devolvido{background:var(--warn-soft);color:var(--warn)}
  .b-aprovado{background:var(--ok-soft);color:var(--ok)}
  .b-concluido{background:var(--roxo-soft);color:var(--roxo)}
  .b-reprovado{background:var(--err-soft);color:var(--err)}
  .b-prevista{background:#eceff3;color:var(--muted)}
  .b-andamento{background:var(--info-soft);color:var(--info)}
  .b-concluida{background:var(--ok-soft);color:var(--ok)}
  .b-atrasada{background:var(--err-soft);color:var(--err)}
  .b-enviado{background:var(--info-soft);color:var(--info)}
  .b-validado{background:var(--ok-soft);color:var(--ok)}
  .banner{border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500}
  .ba-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0e0bd}
  .ba-err{background:var(--err-soft);color:var(--err);border:1px solid #eed6d3}
  .ba-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #cfeeda}
  .ba-info{background:var(--info-soft);color:var(--info);border:1px solid #cfe6f2}

  /* -------------------------------- listas ------------------------------ */
  .item{display:flex;align-items:center;gap:14px;padding:15px 18px;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .item:hover{border-color:var(--brand-3);box-shadow:0 2px 10px -4px rgba(28,55,66,.18)}
  .item .nm{font-weight:600;flex:1;min-width:0;font-size:14px;color:var(--ink)}
  .item .cs{color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  .num{font-family:Sora,sans-serif;font-size:12px;font-weight:700;color:var(--brand-3);white-space:nowrap}
  table.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.pt th{background:#f7f9fb;color:var(--muted);padding:9px 10px;text-align:left;font-size:11.5px;
    font-weight:600;border-bottom:1px solid var(--line)}
  table.pt td{border-bottom:1px solid var(--line-2);padding:8px 10px;color:var(--ink-soft);vertical-align:middle}
  table.pt td input,table.pt td select{font-size:12.5px;padding:7px 8px}
  table.pt .rm{color:var(--err);cursor:pointer;font-weight:700;background:none;border:0;font-size:15px}
  .rolo{overflow-x:auto}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat>*{min-width:0}
  .stat .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .s b{font-family:Sora,sans-serif;font-size:22px;display:block;color:var(--ink);line-height:1.1}
  .stat .s span{font-size:11.5px;color:var(--muted)}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .filtros select,.filtros input{width:auto;min-width:150px;font-size:13px;padding:8px 10px}
  .bloco{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;background:#fcfdfe}
  .bloco.meu{border-color:#cfe6f2;background:#f7fbfd}
  .bloco-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .bloco-cab .t{font-weight:600;font-size:14px;color:var(--ink);flex:1;min-width:0}
  .prazo{font-size:12px;color:var(--muted);white-space:nowrap}
  .tut{background:var(--info-soft);border:1px solid #cfe6f2;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px}
  .tut summary{font-family:Sora,sans-serif;font-weight:700;color:var(--brand);cursor:pointer;font-size:13.5px}
  .tut ol{margin:10px 0 4px 20px}
  .tut li{margin-bottom:5px}
  .hide{display:none!important}

  @media(max-width:760px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .side-nav{padding:8px 10px;flex:1 1 100%;order:3;overflow-x:auto}
    .side-nav #menu{display:flex;gap:6px}
    .side-lab{display:none}
    .side-item{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px}
    .side-item.on{border-left:0;border-bottom-color:var(--accent)}
    .side-pe{border-top:0;margin-left:auto}
    .area{padding:20px 16px}
    .kpis{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <a class="side-marca" href="/" title="Voltar ao portal">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 37 L8 20 A12 12 0 0 1 32 20 L32 37" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4" fill="#71c8e2"/></svg>
      <span>ARCHÉ <b>IC</b></span>
    </a>
    <div class="side-nav"><div id="menu"></div></div>
    <div class="side-pe" id="rodape-usuario"></div>
  </nav>

  <div class="conteudo">
    <div class="topbar">
      <div class="crumb">ARCHÉ IC <span style="color:var(--muted-2)">/</span> <b id="crumb">Painel</b></div>
      <div class="dir"><span id="dir-info"></span></div>
    </div>

    <div class="area">
      <div class="limite">
        <h1 id="titulo">Painel</h1>
        <div class="sub" id="subtitulo">Iniciação Científica — PIBIC, PIBITI e voluntária.</div>
        <div id="aviso"></div>

        <section id="v-painel" class="hide"></section>
        <section id="v-submissao" class="hide"></section>
        <section id="v-gestao" class="hide"></section>
        <section id="v-avaliacao" class="hide"></section>
        <section id="v-classificacao" class="hide"></section>
        <section id="v-editais" class="hide"></section>
        <section id="v-bolsistas" class="hide"></section>
        <section id="v-cronograma" class="hide"></section>
        <section id="v-relatorios" class="hide"></section>
        <section id="v-projeto" class="hide"></section>
      </div>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   ARCHÉ IC — Iniciação Científica.
   Projeto: rascunho → submetido → avaliado pela PROPPEX → em execução.
   Cronograma e relatórios ficam presos ao projeto; cada pessoa vê o que
   é dela (a regra vive no servidor, em lib/ic.js).
   ====================================================================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtD = (iso) => (iso ? String(iso).split("-").reverse().join("/") : "—");
const fmtDH = (iso) => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "—"; };
const hojeISO = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date());

let META = { cursos: [], modalidades: [], status: [], rotulos: {}, gestao: false, eu: "", perfil: "orientador",
  linhas: [], certificados: [], informados: [], fomentos: [], titulacoes: [], blocosProducao: [],
  edital: {}, producaoAnterior: null };
// todos os grupos que a tela oferece, na ordem em que aparecem
const gruposConhecidos = () => [...(META.certificados || []), ...(META.informados || [])];
let PROJETOS = [], ETAPAS = [], RELS = { relatorios: [], pendentes: [] };
let ATUAL = null, PODE = {}, ME = null, SECAO = "painel";
// "ver como": a coordenação abre o setor pelos olhos de outra pessoa. Guardado
// na aba (sessionStorage) para sobreviver ao F5 sem grudar entre sessões.
let COMO = sessionStorage.getItem("arche-ic-como") || "";
let FILTRO = { status: "", curso: "", linha: "", grupo: "", q: "", edital: "" };
// Inclusão manual: a coordenação abre a submissão em nome de outro professor
// (pedido fora do prazo deferido pela pró-reitoria). Vale só para o formulário
// aberto agora — some assim que o projeto é salvo ou a tela troca.
let MANUAL = false;
// o ciclo (edital) escolhido na guia Projetos — um por vez, começa no vigente
let CICLO_SEL = "";
// idem para a guia Bolsistas e Voluntários — começa no ciclo mais atual
let CICLO_BV = "";

// Quatro acessos, uma barra lateral só: cada perfil vê as guias que usa.
//   gestao     — tudo
//   orientador — submissão, gestão dos seus projetos, cronograma, relatórios
//   aluno      — cronograma e relatórios (só os dele)
//   avaliador  — avaliação dos projetos que recebeu, e nada mais
const SECOES = [
  { id: "painel", grupo: "INÍCIO", rot: "Painel", ic: '<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>' },
  { id: "submissao", grupo: "PROJETOS", rot: "Submissão", ic: '<path d="M12 5v14M5 12h14"/>', perfis: ["gestao", "orientador"] },
  { id: "gestao", grupo: "PROJETOS", rot: "Gestão", ic: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/>', perfis: ["gestao", "orientador"] },
  { id: "avaliacao", grupo: "SELEÇÃO", rot: "Avaliação", ic: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>', perfis: ["gestao", "avaliador"] },
  { id: "classificacao", grupo: "SELEÇÃO", rot: "Projetos", ic: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>', perfis: ["gestao"] },
  { id: "editais", grupo: "SELEÇÃO", rot: "Editais e Resultados", ic: '<path d="M4 4a2 2 0 0 1 2-2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 2v5h5M8 12h8M8 16h8"/>' },
  { id: "bolsistas", grupo: "ACOMPANHAMENTO", rot: "Bolsistas e Voluntários", ic: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>', perfis: ["gestao", "orientador"] },
  { id: "cronograma", grupo: "ACOMPANHAMENTO", rot: "Cronograma", ic: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>', perfis: ["orientador", "aluno"] },
  { id: "relatorios", grupo: "ACOMPANHAMENTO", rot: "Relatórios", ic: '<path d="M4 4a2 2 0 0 1 2-2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 2v5h5M8 13h8M8 17h5"/>', perfis: ["gestao", "orientador", "aluno"] },
];

const TITULOS = {
  painel: ["Painel", "Situação dos projetos de Iniciação Científica."],
  submissao: ["Submissão de projeto", "Preencha a proposta e submeta à avaliação da PROPPEX."],
  gestao: ["Gestão de projetos", "Projetos submetidos, em execução e concluídos."],
  avaliacao: ["Avaliação da seleção", "Parecer ad hoc dos projetos submetidos."],
  classificacao: ["Projetos do edital", "Todos os projetos de cada processo seletivo, em ordem de classificação."],
  bolsistas: ["Bolsistas e Voluntários", "Cada aluno em execução, com as metas do cronograma e as entregas — por ciclo."],
  editais: ["Editais e Resultados", "Os documentos de cada processo, ano a ano: o edital e o resultado."],
  cronograma: ["Cronograma", "Todas as atividades dos projetos num só lugar."],
  relatorios: ["Relatórios", "Parciais e finais: o aluno envia, a orientação valida."],
  projeto: ["Projeto", ""],
};

/* ------------------------------- infra --------------------------------- */
/* Enquanto se olha pelos olhos de outra pessoa, o recorte é feito no
   servidor — não basta esconder menu, senão a tela mentiria sobre o que a
   pessoa vê (o sigilo do parecer ad hoc é o caso mais claro). */
function comQuem(url) {
  if (!COMO) return url;
  return url + (url.includes("?") ? "&" : "?") + "como=" + encodeURIComponent(COMO);
}

async function api(url, opcoes) {
  // "Ver como" é somente leitura de ponta a ponta: escrever aqui gravaria em
  // nome da COORDENAÇÃO (a sessão real) enquanto a tela finge ser outra
  // pessoa — o servidor já recusa escrita com ?como=, e o cliente não deve
  // contornar isso tirando o parâmetro.
  if (COMO && opcoes && (opcoes.method || "GET") !== "GET")
    throw new Error("Você está vendo o setor como outra pessoa — saia do modo \"ver como\" para editar.");
  const r = await fetch(!opcoes || (opcoes.method || "GET") === "GET" ? comQuem(url) : url, opcoes);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Falha (${r.status})`);
  return j;
}
function aviso(msg, tipo = "ok") {
  $("aviso").innerHTML = faixaVerComo() + `<div class="banner ba-${tipo}">${esc(msg)}</div>`;
  if (tipo === "ok") setTimeout(() => { if ($("aviso").textContent.includes(msg)) $("aviso").innerHTML = faixaVerComo(); }, 6000);
  window.scrollTo(0, 0);
}
const cursoNome = (slug) => (META.cursos.find((c) => c.slug === slug) || {}).nome || slug || "—";
const modNome = (c) => (META.modalidades.find((m) => m.codigo === c) || {}).nome || c || "—";
const linhaNome = (c) => (META.linhas.find((l) => l.codigo === c) || {}).nome || c || "—";
const fomentoNome = (c) => (META.fomentos.find((f) => f.codigo === c) || {}).nome || c || "—";
// a modalidade que vale: a definida pelo fomento; senão, a pretendida
const modVigente = (p) => (p.fomento?.modalidade ? modNome(p.fomento.modalidade)
  : p.modalidade ? modNome(p.modalidade) + " (pretendida)" : linhaNome(p.linha));
function pontuarProducao(q) {
  let total = 0;
  for (const b of META.blocosProducao) {
    const bruto = b.itens.reduce((s, i) => s + (Math.max(0, Math.trunc(Number(q?.[i.codigo]) || 0))) * i.peso, 0);
    total += Math.min(bruto, b.teto);
  }
  return Math.round(total * 100) / 100;
}
const chip = (s) => `<span class="badge b-${esc(s)}">${esc(META.rotulos[s] || s)}</span>`;
const ehAluno = () => META.perfil === "aluno";
const ehAvaliador = () => META.perfil === "avaliador";
const recNome = (c) => (META.recomendacoes.find((r) => r.codigo === c) || {}).nome || c || "—";

async function sair() {

  location.href = "/";
}

/* ------------------------------ navegação ------------------------------ */

    <div style="min-width:0">
      <div class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((ME.nome || ME.email).split(" ").slice(0, 2).join(" "))}</div>
      <div class="pp">${papel}</div>

    <button class="sair" onclick="sair()">sair</button>` : "";
  for (const b of document.querySelectorAll(".side-item")) b.classList.toggle("on", b.dataset.s === SECAO);
}

/* ---------------------------- ver como -------------------------------- */
function montarVerComo() {
  const alvo = $("dir-info");
  if (!alvo) return;
  if (!META.pessoas) { alvo.textContent = rotuloPerfil(); return; }

  const grupo = (rot, gente) => gente.length
    ? `<optgroup label="${rot}">${gente.map((p) => `<option value="${esc(p.id)}" ${COMO === p.id ? "selected" : ""}>${
        esc(p.nome || p.email)}${p.projetos > 1 ? ` (${p.projetos})` : ""}${p.semConta ? " · sem conta" : ""}</option>`).join("")}</optgroup>`
    : "";
  alvo.innerHTML = `
    <label style="margin:0;display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:12.5px">

        <option value="">Como gestor — a sua visão</option>
        <optgroup label="Visões genéricas (avaliar cada acesso)">
          <option value="perfil:orientador" ${COMO === "perfil:orientador" ? "selected" : ""}>Como professor — visão genérica</option>
          <option value="perfil:aluno" ${COMO === "perfil:aluno" ? "selected" : ""}>Como aluno — visão genérica</option>
        </optgroup>
        ${grupo("Professor orientador", META.pessoas.orientadores)}
        ${grupo("Aluno indicado", META.pessoas.alunos)}
        ${grupo("Avaliador ad hoc", META.pessoas.avaliadores)}
      </select>
    </label>`;
}

const rotuloPerfil = () => META.gestao ? "coordenação de pesquisa"
  : ehAluno() ? "aluno de IC" : ehAvaliador() ? "avaliador ad hoc" : "orientação";

function faixaVerComo() {
  if (!COMO) return "";
  if (COMO.startsWith("perfil:")) {
    const rot = COMO === "perfil:aluno" ? "um aluno" : "um professor";
    return `<div class="banner ba-warn" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span>Você está vendo o setor como <b>${rot} genérico</b>, recém-chegado e ainda sem projeto —
        é a cara do acesso, não os dados de alguém. Somente leitura.</span>
      <button class="bt bt-ghost" style="margin-left:auto" onclick="verComo('')">Voltar a ver como gestor</button>
    </div>`;
  }
  const quem = [...(META.pessoas?.orientadores || []), ...(META.pessoas?.alunos || []), ...(META.pessoas?.avaliadores || [])]
    .find((p) => p.id === COMO);
  return `<div class="banner ba-warn" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span>Você está vendo o setor como <b>${esc(quem?.nome || COMO)}</b>
      (${esc(rotuloPerfil())})${quem?.semConta ? " — pessoa ainda sem conta: é o que ela encontrará ao se cadastrar com o CPF" : ""}
      — somente leitura, nada aqui grava em nome dela.</span>
    <button class="bt bt-ghost" style="margin-left:auto" onclick="verComo('')">Voltar a ver como coordenação</button>
  </div>`;
}

async function verComo(email) {
  COMO = email || "";
  if (COMO) sessionStorage.setItem("arche-ic-como", COMO); else sessionStorage.removeItem("arche-ic-como");
  try {
    META = await api("/api/ic/meta");
    await carregar();
  } catch (e) { aviso(e.message, "err"); }
  montarSidebar(); montarVerComo();
  // a seção em que se estava pode não existir para a outra pessoa
  const vale = SECOES.filter((x) => !x.perfis || x.perfis.includes(META.perfil)).map((x) => x.id);
  nav(vale.includes(SECAO) ? SECAO : "painel");
}

function nav(secao, modo) {
  SECAO = secao;
  // a inclusão manual vale só para o formulário aberto por ela
  MANUAL = secao === "submissao" && modo === "manual";
  for (const b of document.querySelectorAll(".side-item")) b.classList.toggle("on", b.dataset.s === secao);
  for (const v of ["painel", "submissao", "gestao", "avaliacao", "classificacao", "editais", "bolsistas", "cronograma", "relatorios", "projeto"]) $("v-" + v).classList.add("hide");
  // submissão e projeto compartilham o editor (mesmos ids): a seção que sai
  // do ar é esvaziada, senão getElementById acha os campos escondidos
  for (const v of ["submissao", "projeto"]) if (v !== secao) $("v-" + v).innerHTML = "";

  const [t, s] = TITULOS[secao] || ["", ""];
  $("titulo").textContent = t; $("subtitulo").textContent = s; $("crumb").textContent = t;
  $("aviso").innerHTML = faixaVerComo();

  if (secao === "painel") renderPainel();
  if (secao === "submissao") {
    ATUAL = novoProjeto();
    PODE = { podeEditar: true, podeGerir: true, papel: MANUAL ? "gestao" : "orientador" };
    if (MANUAL) {
      $("titulo").textContent = "Inclusão de projeto pela coordenação";
      $("crumb").textContent = "Inclusão pela coordenação";
      $("subtitulo").textContent = "Projeto de outro professor, com pedido fora do prazo deferido pela pró-reitoria.";
    }
    renderEditor("v-submissao");
  }
  if (secao === "gestao") renderGestao();
  if (secao === "avaliacao") renderAvaliacao();
  if (secao === "classificacao") renderClassificacao();
  if (secao === "bolsistas") renderBolsistas();
  if (secao === "editais") renderEditais();
  if (secao === "cronograma") renderCronograma();
  if (secao === "relatorios") renderRelatorios();
  $("v-" + secao).classList.remove("hide");
  window.scrollTo(0, 0);
}

/* -------------------------------- dados -------------------------------- */
async function carregar() {
  const [lista, crono, rel] = await Promise.all([
    api("/api/ic"), api("/api/ic/cronograma"), api("/api/ic/relatorios"),
  ]);
  PROJETOS = lista.projetos || [];
  ETAPAS = crono.etapas || [];
  RELS = { relatorios: rel.relatorios || [], pendentes: rel.pendentes || [] };
}

async function abrir(id) {
  try {
    const r = await api("/api/ic/" + id);
    ATUAL = r.projeto; PODE = r;
    // NP/CL/total vem ao lado do projeto (derivado, não gravado)
    if (r.classificacao !== undefined) ATUAL.classificacao = r.classificacao;
    nav("projeto");
    $("crumb").textContent = ATUAL.numero || "Projeto";
    $("titulo").textContent = ATUAL.numero || "Projeto";
    $("subtitulo").textContent = ATUAL.titulo || "";
    renderEditor("v-projeto");
  } catch (e) { aviso(e.message, "err"); }
}

function novoProjeto() {
  return {
    titulo: "", resumo: "", palavrasChave: "", curso: "", modalidade: "pibic", edital: "",
    linhaPesquisa: "", objetivos: "", metodologia: "", inicio: "", fim: "",
    // na inclusão manual quem orienta é outra pessoa: os campos nascem vazios
    orientador: MANUAL ? { nome: "", email: "", cpf: "", titulacao: "" }
      : { nome: ME?.perfil?.nome || ME?.nome || "", email: ME?.email || "", titulacao: "" },
    alunos: [], cronograma: [], relatorios: [], status: "rascunho",
    // a planilha de produção é da PESSOA: a nova submissão do professor já
    // abre com a da última vez (na inclusão manual, quem preenche é a busca
    // pelo CPF/e-mail de quem orienta — buscarProducaoDoProfessor)
    producao: MANUAL ? {} : { ...(META.producaoAnterior || {}) },
    ...(MANUAL ? { inclusaoManual: { motivo: "" } } : {}),
  };
}

/** A coordenação abre a submissão em nome de quem orienta. */
function incluirManualmente() {
  nav("submissao", "manual");
}

/* -------------------------------- painel ------------------------------- */
function renderPainel() {
  // o Painel é do CICLO VIGENTE: o arquivo dos editais anteriores não entra
  // aqui — ele vive nas guias Gestão, Projetos e Bolsistas, atrás do filtro
  // de ciclo
  const vigente = META.edital?.numero || "";
  const meus = PROJETOS.filter((p) => (p.edital || vigente) === vigente);
  const idsCiclo = new Set(meus.map((p) => p.id));
  const etapasCiclo = ETAPAS.filter((e) => idsCiclo.has(e.projetoId));
  const cont = (s) => meus.filter((p) => p.status === s).length;
  const atrasadas = etapasCiclo.filter((e) => e.situacao !== "concluida" && e.fim && e.fim < hojeISO());
  const aValidar = RELS.relatorios.filter((r) => r.podeValidar);
  const minhasPendencias = RELS.pendentes;

  const aDarParecer = meus.filter((p) => p.aDarParecer);
  const kpis = ehAluno()
    ? [["Projetos", meus.length, "em que você foi indicado"],
       ["Atividades", etapasCiclo.length, "no seu plano de trabalho"],
       ["Em atraso", atrasadas.length, "atividades vencidas"],
       ["Relatórios a enviar", minhasPendencias.length, "parciais e finais"]]
    : ehAvaliador()
      ? [["Designados a você", meus.length, "projetos da seleção"],
         ["Parecer pendente", aDarParecer.length, "aguardando você"],
         ["Pareceres entregues", meus.filter((p) => p.meuParecer?.situacao === "entregue").length, "já respondidos"],
         ["Recusados", meus.filter((p) => p.meuParecer?.situacao === "recusado").length, "por impedimento"]]
      : META.gestao
        ? [["Em avaliação", cont("submetido"), "aguardando a PROPPEX"],
           ["Em execução", cont("aprovado"), "projetos aprovados"],
           ["Relatórios em atraso", meus.filter((p) => p.prazoRelatorios?.atrasado).length, "projetos fora do prazo"],
           ["Relatórios a validar", aValidar.length, "enviados pelos alunos"]]
        : [["Em avaliação", cont("submetido"), "aguardando a PROPPEX"],
           ["Em execução", cont("aprovado"), "projetos aprovados"],
           ["Atividades em atraso", atrasadas.length, "no cronograma"],
           ["Relatórios a validar", aValidar.length, "enviados pelos alunos"]];

  const foraDoPrazo = META.gestao ? meus.filter((p) => p.prazoRelatorios?.atrasado) : [];

  // Avaliação do ciclo (só a gestão): quantos projetos do edital vigente já
  // têm decisão — e, com todos avaliados, os botões de publicação do
  // resultado, na ordem do processo: preliminar (só os aprovados, para
  // definir as bolsas com a presidência) e depois o final (com a bolsa).
  const cicloAval = META.gestao ? (() => {
    const doCiclo = meus.filter((p) => p.status !== "rascunho" && p.status !== "devolvido");
    const avaliados = doCiclo.filter((p) => ["aprovado", "reprovado", "concluido"].includes(p.status));
    const fase = ((META.editais || []).find((e) => e.numero === vigente) || {}).resultadoFase || null;
    const completo = doCiclo.length > 0 && avaliados.length === doCiclo.length;
    const semBolsa = doCiclo.filter((p) => ["aprovado", "concluido"].includes(p.status) && !p.fomento).length;
    const pct = doCiclo.length ? Math.round((avaliados.length / doCiclo.length) * 100) : 0;
    return `<div class="card">
      <div class="card-t">Avaliação do ciclo — Edital ${esc(vigente)}</div>
      <div class="card-s"><b>${avaliados.length}</b> de <b>${doCiclo.length}</b> projeto(s) avaliado(s) (${pct}%).</div>
      <div style="height:8px;border-radius:6px;background:var(--wash2);overflow:hidden;margin:8px 0 14px">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--brand-2),var(--accent))"></div></div>
      ${fase ? `<div class="banner ${fase === "final" ? "ba-ok" : "ba-warn"}" style="margin:0 0 12px">
        ${fase === "final"
          ? "<b>Resultado final publicado</b> — com a bolsa concedida a cada projeto."
          : `<b>Resultado preliminar publicado</b> — só os aprovados, ainda sem as bolsas. ${semBolsa
            ? `${semBolsa} aprovado(s) aguardando a decisão de fomento para o resultado final.`
            : "Todos os aprovados já têm decisão de fomento — o resultado final pode ser publicado."}`}</div>` : ""}
      ${completo || fase ? `<div style="display:flex;gap:10px;flex-wrap:wrap">
          ${!fase ? `<button class="bt bt-pri" onclick="publicarResultado('${esc(vigente)}','preliminar')">📢 Publicar resultado preliminar</button>` : ""}
          ${fase !== "final" ? `<button class="bt ${fase === "preliminar" ? "bt-pri" : "bt-sec"}" onclick="publicarResultado('${esc(vigente)}','final')">🏁 Publicar resultado final</button>` : ""}
          ${fase ? `<button class="bt bt-ghost" onclick="publicarResultado('${esc(vigente)}', null)">Recolher publicação</button>` : ""}
        </div>`
        : `<div style="font-size:13px;color:var(--muted)">Quando todos os projetos do ciclo estiverem avaliados, os botões de
          publicação aparecem aqui: primeiro o <b>resultado preliminar</b> (só os aprovados, para definir as bolsas com a
          presidência) e, distribuídas as bolsas, o <b>resultado final</b>.</div>`}
    </div>`;
  })() : "";

  $("v-painel").innerHTML = `
    <div class="kpis">${kpis.map(([l, v, d]) => `
      <div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("")}
    </div>

    ${cicloAval}

    ${META.gestao && foraDoPrazo.length ? `<div class="banner ba-warn"><b>Relatórios em atraso</b> —
      ${foraDoPrazo.length} projeto(s) fora do prazo do edital:
      ${foraDoPrazo.slice(0, 8).map((p) => `<a href="#" onclick="abrir('${esc(p.id)}');return false">${esc(p.numero || p.titulo)}</a>`).join(" · ")}${foraDoPrazo.length > 8 ? " · …" : ""}
      — a lista completa está na guia Relatórios.</div>` : ""}

    ${!meus.length ? `<div class="card"><div class="card-t">Comece por aqui</div>
      <div class="card-s">${ehAluno()
        ? "Você ainda não foi indicado em nenhum projeto. Quem orienta faz a indicação pelo seu e-mail."
        : ehAvaliador()
          ? "Nenhum projeto designado a você. A coordenação designa os avaliadores dentro de cada projeto."
          : "Nenhum projeto ainda. A submissão abre o rascunho, que você preenche no seu tempo."}</div>
      ${ehAluno() || ehAvaliador() ? "" : `<button class="bt bt-pri" onclick="nav('submissao')">＋ Submeter projeto</button>`}</div>` : ""}

    <div class="duplo">
      <div class="card">
        <div class="card-t">Projetos</div>
        <div class="card-s">${meus.length} projeto(s) do ciclo ${esc(vigente)} — o arquivo dos
          editais anteriores está na guia Gestão, no filtro de ciclo.</div>
        ${meus.slice(0, 6).map((p) => `
          <div class="linha" style="cursor:pointer" onclick="abrir('${esc(p.id)}')">
            <div class="txt">
              <div class="p1">${esc(p.titulo || "(sem título)")}</div>
              <div class="p2">${esc(p.numero || "sem número")} · ${esc(cursoNome(p.curso))} · ${esc(modNome(p.modalidade))}</div>
            </div>${chip(p.status)}
          </div>`).join("") || `<div class="vazio">Nada por aqui ainda.</div>`}
        ${meus.length > 6 ? `<div style="margin-top:10px"><button class="bt bt-ghost" onclick="nav('gestao')">Ver todos</button></div>` : ""}
      </div>

      <div class="card">
        <div class="card-t">Próximas atividades</div>
        <div class="card-s">Do cronograma, a partir de hoje.</div>
        ${etapasCiclo.filter((e) => e.situacao !== "concluida").slice(0, 7).map((e) => `
          <div class="linha">
            <div class="txt">
              <div class="p1">${esc(e.atividade)}</div>
              <div class="p2">${esc(e.numero || "—")} · ${esc(e.responsavelNome)} · até ${fmtD(e.fim)}</div>
            </div>
            ${e.fim && e.fim < hojeISO() ? `<span class="badge b-atrasada">atrasada</span>` : chip2(e.situacao)}
          </div>`).join("") || `<div class="vazio">Sem atividades pendentes.</div>`}
      </div>
    </div>

    ${aValidar.length ? `<div class="card">
      <div class="card-t">Relatórios aguardando sua validação</div>
      <div class="card-s">Enviados pelos alunos indicados.</div>
      ${aValidar.map((r) => `<div class="linha" style="cursor:pointer" onclick="abrir('${esc(r.projetoId)}')">
        <div class="txt"><div class="p1">${esc(r.alunoNome)} — relatório ${esc(r.tipo)}</div>
        <div class="p2">${esc(r.numero || "")} · enviado em ${fmtDH(r.enviadoEm)}</div></div>
        <span class="badge b-enviado">a validar</span></div>`).join("")}
    </div>` : ""}`;
}
const chip2 = (s) => `<span class="badge b-${esc(s)}">${esc({ prevista: "prevista", andamento: "em andamento", concluida: "concluída" }[s] || s)}</span>`;

/* ------------------------------- gestão -------------------------------- */
function renderGestao() {
  // o ciclo em evidência é o ATUAL; os passados só aparecem se escolhidos
  if (!FILTRO.edital) FILTRO.edital = META.edital?.numero || "__todos";
  const lista = PROJETOS.filter((p) =>
    (!FILTRO.status || p.status === FILTRO.status) &&
    (!FILTRO.curso || p.curso === FILTRO.curso) &&
    (!FILTRO.linha || p.linha === FILTRO.linha) &&
    (!FILTRO.grupo
      || (FILTRO.grupo === "__com" && !!p.grupoPesquisa)
      || (FILTRO.grupo === "__sem" && !p.grupoPesquisa)
      || p.grupoPesquisa === FILTRO.grupo) &&
    (FILTRO.edital === "__todos" || (p.edital || META.edital?.numero) === FILTRO.edital) &&
    (!FILTRO.q || `${p.numero || ""} ${p.titulo} ${p.orientador?.nome || ""} ${(p.alunos || []).map((a) => a.nome).join(" ")}`
      .toLowerCase().includes(FILTRO.q.toLowerCase())));

  $("v-gestao").innerHTML = `
    <div class="filtros">
      <select onchange="FILTRO.status=this.value;renderGestao()">
        <option value="">Todas as situações</option>
        ${META.status.map((s) => `<option value="${s}" ${FILTRO.status === s ? "selected" : ""}>${esc(META.rotulos[s] || s)}</option>`).join("")}
      </select>
      <select onchange="FILTRO.curso=this.value;renderGestao()">
        <option value="">Todos os cursos</option>
        ${META.cursos.map((c) => `<option value="${c.slug}" ${FILTRO.curso === c.slug ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}
      </select>
      <input placeholder="Buscar por número, título, orientação ou aluno" value="${esc(FILTRO.q)}"
        oninput="FILTRO.q=this.value;clearTimeout(window.__b);window.__b=setTimeout(renderGestao,250)">
      <select onchange="FILTRO.linha=this.value;renderGestao()">
        <option value="">Todas as linhas</option>
        ${META.linhas.map((l) => `<option value="${l.codigo}" ${FILTRO.linha === l.codigo ? "selected" : ""}>${esc(l.nome)}</option>`).join("")}
      </select>

        <option value="__sem" ${FILTRO.grupo === "__sem" ? "selected" : ""}>Sem grupo</option>

        <option value="__todos" ${FILTRO.edital === "__todos" ? "selected" : ""}>Todos os ciclos</option>

      ${META.gestao ? `<button class="bt bt-sec" onclick="incluirManualmente()"

      ${META.gestao ? `<button class="bt bt-ghost" onclick="baixarResultado()"

      ${META.gestao ? `<button class="bt bt-ghost" onclick="convidarProfessores()"

}

/* ------------------------- avaliação da seleção ------------------------ */
function renderAvaliacao() {
  const emSelecao = PROJETOS.filter((p) => p.status === "submetido");
  // o que passou pelas mãos do avaliador continua à vista depois da decisão:
  // o parecer é dele e ele precisa poder reler o que assinou
  const meus = PROJETOS.filter((p) => p.meuParecer);
  const aFazer = meus.filter((p) => p.aDarParecer);
  const feitos = meus.filter((p) => !p.aDarParecer);

  const cartao = (p, comPlacar) => `
    <div class="bloco ${p.aDarParecer ? "meu" : ""}">
      <div class="bloco-cab">
        <span class="num">${esc(p.numero || "—")}</span>
        <span class="t">${esc(p.titulo || "(sem título)")}</span>
        ${p.meuParecer ? `<span class="badge b-${p.meuParecer.situacao === "entregue" ? "validado" : p.meuParecer.situacao === "recusado" ? "reprovado" : "enviado"}">${esc({ designado: "parecer pendente", entregue: "parecer entregue", recusado: "avaliação recusada" }[p.meuParecer.situacao])}</span>` : ""}
      </div>
      <div class="muted">${esc(cursoNome(p.curso))} · ${esc(modNome(p.modalidade))}${p.edital ? ` · ${esc(p.edital)}` : ""}${
        p.orientador ? ` · orientação: ${esc(p.orientador.nome || p.orientador.email)}` : ""}</div>
      ${comPlacar && p.placar ? `<div class="muted" style="margin-top:6px">
        ${p.placar.entregues}/${p.placar.designados} parecer(es) entregue(s)${p.placar.recusados ? ` · ${p.placar.recusados} recusa(s)` : ""}
        ${p.placar.media !== null ? ` · nota média <b>${p.placar.media}</b>` : ""}
        ${p.placar.entregues ? ` · ${p.placar.recomendam} recomenda(m), ${p.placar.ressalvas} com ressalvas, ${p.placar.contra} contra` : ""}</div>` : ""}
      <div class="exp"><button class="bt ${p.aDarParecer ? "bt-pri" : "bt-ghost"}" onclick="abrir('${esc(p.id)}')">
        ${p.aDarParecer ? "Dar parecer" : "Abrir o projeto"}</button></div>
    </div>`;

  $("v-avaliacao").innerHTML = `
    <div class="tut"><details><summary>Como funciona a avaliação ad hoc</summary>
      <ol>
        <li>A coordenação designa os avaliadores <b>dentro de cada projeto</b>, pelo e-mail — é a designação que dá o acesso.</li>
        <li>O avaliador vê apenas os projetos que recebeu, e neles só a proposta: nada de relatórios, histórico ou parecer dos colegas.</li>
        <li>O projeto vale <b>de 0 a 100</b>: sete critérios, cada um com o seu teto de pontos, e a nota é a soma. Havendo mais de um parecer, vale a média das somas.</li>
        <li>Havendo impedimento, o avaliador <b>recusa</b> a avaliação dizendo o motivo — não fica travando a seleção.</li>
        <li>A orientação nunca sabe quem avaliou: recebe a decisão da coordenação, e é a ela que responde.</li>
      </ol></details></div>

    ${aFazer.length ? `<div class="card">
      <div class="card-t">Aguardando o seu parecer</div>
      <div class="card-s">${aFazer.length} projeto(s).</div>
      ${aFazer.map((p) => cartao(p, false)).join("")}
    </div>` : ""}

    ${feitos.length ? `<div class="card">
      <div class="card-t">Já passaram por você</div>
      <div class="card-s">Pareceres entregues, avaliações recusadas e projetos cuja seleção já foi decidida.</div>
      ${feitos.map((p) => cartao(p, false)).join("")}
    </div>` : ""}

    ${META.gestao ? `<div class="card">
      <div class="card-t">Projetos em seleção</div>
      <div class="card-s">${emSelecao.length} projeto(s) submetido(s) aguardando decisão.</div>
      ${emSelecao.map((p) => cartao(p, true)).join("") || `<div class="vazio">Nenhum projeto em avaliação no momento.</div>`}
    </div>` : ""}

    ${!meus.length && !META.gestao ? `<div class="card"><div class="vazio">
      Nenhum projeto designado a você no momento.</div></div>` : ""}`;
}

/* ------------------------ bolsistas e voluntários ----------------------- */
/* O acompanhamento por PESSOA: cada aluno em execução com as suas demandas —
   as metas do cronograma sob a responsabilidade dele e a entrega dos
   relatórios frente aos prazos do edital. Organizado por CICLO (edital),
   porque a cada ciclo os alunos e as metas mudam. O professor vê os seus;
   a gestão vê todos, agrupados por orientador. */
function renderBolsistas() {
  const fmtBr = (iso) => iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "—";
  const emExec = PROJETOS.filter((p) => ["aprovado", "concluido"].includes(p.status));

  const cartaoAluno = (p, a) => {
    const metas = ETAPAS.filter((e) => e.projetoId === p.id && e.responsavel === a.email);
    const feitas = metas.filter((e) => e.situacao === "concluida").length;
    const atrasadas = metas.filter((e) => e.situacao !== "concluida" && e.fim && e.fim < hojeISO()).length;
    const rel = (tipo) => {
      const r = RELS.relatorios.find((x) => x.projetoId === p.id && x.aluno === a.email && x.tipo === tipo);
      const prazo = (p.prazoRelatorios?.prazos || []).find((x) => x.tipo === tipo);
      if (r) return `<span class="badge b-${esc(r.situacao)}">${tipo}: ${esc({ enviado: "enviado", validado: "validado", devolvido: "devolvido" }[r.situacao] || r.situacao)}</span>`;
      if (prazo?.atrasado) return `<span class="badge b-atrasada">${tipo}: atrasado (venceu ${fmtBr(prazo.vence)})</span>`;
      return `<span class="badge b-rascunho">${tipo}: até ${fmtBr(prazo?.vence)}</span>`;
    };
    const contrato = a.bolsista
      ? ((a.dadosCompletos ?? !!(a.cpf && a.banco && a.conta && a.pix))
        ? '<span class="badge b-validado">contrato: dados completos</span>'
        : '<span class="badge b-enviado">contrato: aguardando o aluno</span>')
      : "";
    return `<div class="bloco">
      <div class="bloco-cab">
        <span class="t">${esc(a.nome || a.email || "Aluno")}</span>
        <span class="badge b-${a.bolsista ? "aprovado" : "prevista"}">${a.bolsista ? "bolsista" : "voluntário"}</span>
        ${a.email ? "" : '<span class="badge b-atrasada">sem e-mail — sem acesso</span>'}
      </div>
      <div class="muted" style="margin-bottom:6px">${esc(p.numero || "")} · ${esc(p.titulo || "")}${a.curso ? ` · ${esc(a.curso)}` : ""}${a.periodo ? ` · ${esc(a.periodo)}` : ""}</div>
      <div class="exp" style="gap:6px">
        ${p.status === "concluido"
          ? '<span class="badge b-validado">ciclo encerrado</span>'
          : `<span class="badge b-${atrasadas ? "atrasada" : "validado"}">metas: ${feitas}/${metas.length} concluída(s)${atrasadas ? ` · ${atrasadas} atrasada(s)` : ""}</span>
        ${rel("parcial")} ${rel("final")}`} ${contrato}
      </div>
      <div class="exp"><button class="bt bt-ghost" onclick="abrir('${esc(p.id)}')">Abrir o projeto</button></div>
    </div>`;
  };

  const porCiclo = new Map();
  for (const p of emExec) {
    const ciclo = p.edital || META.edital?.numero || "—";
    if (!porCiclo.has(ciclo)) porCiclo.set(ciclo, []);
    porCiclo.get(ciclo).push(p);
  }
  const ciclos = [...porCiclo.entries()].sort((a, b) => String(b[0]).split("/").pop() - String(a[0]).split("/").pop());

  // um ciclo por vez, na lista suspensa — o mais atual em evidência
  if (!CICLO_BV || !ciclos.some(([c]) => c === CICLO_BV)) CICLO_BV = ciclos[0]?.[0] || "";
  const seletor = ciclos.length ? `<div class="filtros" style="margin-bottom:14px">
    <label style="margin:0;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted)">
      Ciclo
      <select style="width:auto;min-width:220px" onchange="CICLO_BV=this.value;renderBolsistas()">
        ${ciclos.map(([c, ps]) => `<option value="${esc(c)}" ${CICLO_BV === c ? "selected" : ""}>Ciclo ${esc(c)}${c === META.edital?.numero ? " — atual" : ""} · ${ps.reduce((s, p) => s + (p.alunos || []).length, 0)} aluno(s)</option>`).join("")}
      </select>
    </label>
  </div>` : "";

  $("v-bolsistas").innerHTML = seletor + ciclos.filter(([c]) => c === CICLO_BV).map(([ciclo, projetos]) => {
    const comAlunos = projetos.filter((p) => (p.alunos || []).length);
    const totalAlunos = comAlunos.reduce((s, p) => s + p.alunos.length, 0);
    let corpo = "";
    if (META.gestao) {
      // gestão: agrupado por orientador
      const porOrientador = new Map();
      for (const p of comAlunos) {
        const k = p.orientador?.nome || p.orientador?.email || "—";
        if (!porOrientador.has(k)) porOrientador.set(k, []);
        porOrientador.get(k).push(p);
      }
      corpo = [...porOrientador.entries()].sort((a, b) => a[0].localeCompare(b[0], "pt-BR"))
        .map(([nome, ps]) => `<div class="sec-t">${esc(nome)}
          <span class="muted" style="font-weight:400">· ${ps.reduce((s, p) => s + p.alunos.length, 0)} aluno(s)</span></div>
          ${ps.flatMap((p) => (p.alunos || []).map((a) => cartaoAluno(p, a))).join("")}`).join("");
    } else {
      corpo = comAlunos.flatMap((p) => (p.alunos || []).map((a) => cartaoAluno(p, a))).join("");
    }
    return `<div class="card">
      <div class="card-t">Ciclo ${esc(ciclo)}</div>
      <div class="card-s">${totalAlunos} aluno(s) em ${comAlunos.length} projeto(s) em execução.</div>
      ${META.gestao ? `<div class="exp" style="margin-bottom:6px">
        <a class="bt bt-ghost" href="/api/ic/bolsistas.xlsx?edital=${encodeURIComponent(ciclo)}"
          title="Uma linha por bolsista, com CPF, contato e dados bancários — para montar os contratos">
          📇 Bolsistas para contrato (Excel)</a>
      </div>` : ""}
      ${corpo || `<div class="vazio">Nenhum aluno indicado neste ciclo ainda — a indicação abre com a aprovação do projeto.</div>`}
    </div>`;
  }).join("") || `<div class="card"><div class="vazio">Nenhum projeto em execução ainda. Os alunos aparecem aqui
    depois da aprovação e da indicação.</div></div>`;
}

/* ------------------------ bolsistas: fim -------------------------------- */

/* --------------------- projetos do edital (classificação) -------------- */
/* As listas de cada processo seletivo, com o que a coordenação precisa ver
   lado a lado: título do projeto, quem orienta, a categoria de submissão
   (modalidade do edital: PIBIC/CNPq, PBIC/UNIEGO, PBIE…) e as notas. Duas
   classificações por edital: primeiro os professores doutores (bolsa CNPq
   exige doutorado), depois a geral, com todos — doutores inclusive. */
const anoDoEdital = (n) => Number(String(n).split("/").pop()) || 0;
const editaisOrdenados = () => (META.editais || [])
  .slice()
  .sort((a, b) => anoDoEdital(b.numero) - anoDoEdital(a.numero) || String(b.numero).localeCompare(String(a.numero)));

// a mesma ordem do PDF: nota final desc; empate pela nota do projeto;
// sem nota final vai para o fim, na ordem do protocolo
function ordenarClassificacao(lista) {
  return lista.slice().sort((a, b) => {
    const na = a.classificacao?.total, nb = b.classificacao?.total;
    if (typeof na === "number" && typeof nb === "number") {
      if (na !== nb) return nb - na;
      const pa = a.classificacao?.np ?? -1, pb = b.classificacao?.np ?? -1;
      if (pa !== pb) return pb - pa;
    } else if (typeof na === "number" || typeof nb === "number") {
      return typeof na === "number" ? -1 : 1;
    }
    return String(a.numero || "").localeCompare(String(b.numero || ""));
  });
}
// o mesmo entendimento de normalizarTitulacao no servidor: projeto gravado
// antes da normalização pode trazer "Doutora"/"Dr." — o quadro não pode
// divergir do PDF por causa de grafia
const ehDoutor = (v) => /^(dr|dra|doutor|doutora|doutorado|pos-?doutor)/
  .test(String(v || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim());

function renderClassificacao() {
  const titNome = (c) => (META.titulacoes.find((t) => t.codigo === c) || {}).nome || c || "—";
  const editais = editaisOrdenados();
  // um ciclo por vez, escolhido na lista suspensa — começa no vigente
  if (!CICLO_SEL || !editais.some((e) => e.numero === CICLO_SEL)) {
    CICLO_SEL = (editais.find((e) => e.vigente) || editais[0] || {}).numero || "";
  }

  const quadro = (rotulo, lista) => {
    let pos = 0;
    return `<div class="sec-t">${rotulo}</div>
    ${lista.length ? `<div class="rolo"><table class="pt">
      <thead><tr><th style="width:4%"></th><th style="width:11%">Protocolo</th><th style="width:24%">Título</th>
        <th style="width:16%">Professor(a)</th><th style="width:9%">Titulação</th><th style="width:13%">Categoria</th>
        <th style="width:6%">NP</th><th style="width:6%">CL</th><th style="width:6%">Total</th><th style="width:11%">Resultado</th></tr></thead>
      <tbody>${lista.map((p) => {
        const comNota = p.classificacao?.total != null;
        if (comNota) pos += 1;
        const resultado = p.fomento ? fomentoNome(p.fomento.tipo)
          : { reprovado: "Não recomendado", devolvido: "Devolvido", submetido: "Em avaliação" }[p.status] || "—";
        return `<tr style="cursor:pointer" onclick="abrir('${esc(p.id)}')">
          <td>${comNota ? pos + "º" : "—"}</td>
          <td><b style="color:var(--brand-2)">${esc(p.numero || "—")}</b></td>
          <td>${esc(p.titulo || "(sem título)")}</td>
          <td>${esc(p.orientador?.nome || p.orientador?.email || "—")}</td>
          <td>${esc(titNome(p.orientador?.titulacao))}</td>
          <td>${esc(linhaNome(p.linha))}</td>
          <td>${p.classificacao?.np ?? "—"}${p.notaDireta ? ' <span class="muted" title="nota atribuída pela coordenação">✎</span>' : ""}</td>
          <td>${p.classificacao?.cl ?? "—"}</td>
          <td><b>${comNota ? p.classificacao.total : "—"}</b></td>
          <td>${esc(resultado)}</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>` : `<div class="muted" style="margin-bottom:10px">Nenhuma proposta neste quadro.</div>`}`;
  };

  const seletor = `<div class="filtros" style="margin-bottom:14px">
    <label style="margin:0;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted)">
      Ciclo
      <select style="width:auto;min-width:220px" onchange="CICLO_SEL=this.value;renderClassificacao()">
        ${editais.map((e) => `<option value="${esc(e.numero)}" ${CICLO_SEL === e.numero ? "selected" : ""}>Edital ${esc(e.numero)}${e.vigente ? " — vigente" : ""} · ${e.projetos} projeto(s)</option>`).join("")}
      </select>
    </label>
  </div>`;

  $("v-classificacao").innerHTML = seletor + editais.filter((e) => e.numero === CICLO_SEL).map((e) => {
    const doEdital = PROJETOS.filter((p) => (p.edital || META.edital?.numero) === e.numero && p.status !== "rascunho");
    const doutores = ordenarClassificacao(doEdital.filter((p) => ehDoutor(p.orientador?.titulacao)));
    const geral = ordenarClassificacao(doEdital);
    const comNota = doEdital.filter((p) => p.classificacao?.total != null).length;
    return `<div class="card">
      <div class="card-t">Edital ${esc(e.numero)}${e.vigente ? ' <span class="badge b-aprovado">vigente</span>' : ""}</div>
      <div class="card-s">${doEdital.length} proposta(s) · ${doutores.length} de professores doutores · ${comNota} com nota final.
        A nota final soma o projeto (0–100) com o currículo (0–100). Os documentos do processo estão em
        <a href="#" onclick="nav('editais');return false">Editais e Resultados</a>.</div>
      ${quadro("Classificação — professores doutores", doutores)}
      ${quadro("Classificação geral — todos os professores", geral)}

      ${META.linhas.map((l) => {
        // sub-ranking por categoria: só as propostas daquela linha, na mesma
        // ordem de nota — categoria sem proposta não ocupa a tela
        const daLinha = ordenarClassificacao(doEdital.filter((p) => (p.linha || "ic") === l.codigo));
        return daLinha.length ? quadro(`Classificação por categoria — ${l.nome}`, daLinha) : "";
      }).join("")}
    </div>`;
  }).join("") || `<div class="card"><div class="vazio">Nenhum edital com propostas ainda.</div></div>`;
}

/* --------------------------- editais e resultados ----------------------- */
/* O arquivo do processo, ano a ano: o EDITAL como foi publicado e o
   RESULTADO em PDF timbrado — os dois para download. As listas de projetos
   ficam na guia Projetos. */
function renderEditais() {
  $("v-editais").innerHTML = editaisOrdenados().map((e) => `<div class="card">
      <div class="card-t">Edital ${esc(e.numero)}${e.vigente ? ' <span class="badge b-aprovado">vigente</span>' : ""}</div>
      <div class="card-s">Ano ${anoDoEdital(e.numero) || "—"} · ${e.projetos} proposta(s) ·
        ${e.bolsas ?? 0} bolsa(s) concedida(s).</div>
      <div class="exp">
        ${e.documento ? `<a class="bt bt-pri" href="${esc(e.documento)}" target="_blank" rel="noopener">
          📜 Edital (PDF)</a>` : `<span class="muted">Documento do edital ainda não arquivado.</span>`}
        ${e.resultadoPublicado

          : `<button class="bt bt-sec" disabled style="opacity:.55;cursor:default"

          <a class="bt bt-ghost" href="/api/ic/resultado.pdf?edital=${encodeURIComponent(e.numero)}&fase=final" target="_blank" rel="noopener"
            title="Só a gestão baixa: prévia do resultado final (com as bolsas)">🔍 Prévia final</a>
          ${e.resultadoPublicado ? `<button class="bt bt-sec" onclick="publicarResultado('${esc(e.numero)}', null)">Recolher publicação</button>` : ""}` : ""}
      </div>
      <div class="muted" style="margin-top:10px">${e.resultadoFase === "preliminar"
        ? `Resultado preliminar publicado — só os projetos aprovados. O resultado final, com a bolsa concedida, sai depois da distribuição das bolsas.`
        : e.resultadoPublicado
          ? `O resultado sai sempre com os dados de agora — emitido na hora, com as duas classificações (doutores e geral).`
          : `O resultado será divulgado pela PROPPEX quando o ciclo de avaliações terminar.${META.gestao ? " A publicação (preliminar e final) se faz no Painel." : ""}`}${META.gestao ? ` A lista dos projetos está na guia
        <a href="#" onclick="nav('classificacao');return false">Projetos</a>.` : ""}</div>
    </div>`).join("") || `<div class="card"><div class="vazio">Nenhum edital registrado ainda.</div></div>`;

/* Publicar (ou recolher) o resultado do processo — só a gestão. Duas fases:
   "preliminar" (só os aprovados, antes das bolsas) e "final" (com a bolsa
   concedida). fase null recolhe. Abre o PDF para todo o setor e para a
   página pública; até lá, "em breve". */
async function publicarResultado(numero, fase) {
  const semBolsa = PROJETOS.filter((p) =>
    (p.edital || numero) === numero && ["aprovado", "concluido"].includes(p.status) && !p.fomento).length;
  const pergunta = fase === "preliminar"
    ? `Publicar o RESULTADO PRELIMINAR do Edital ${numero}?\n\nO PDF sai só com os projetos aprovados, ainda sem a distribuição das bolsas — é a lista para definir as cotas com a presidência. Ele abre para todos os professores e para a página pública.`
    : fase === "final"
      ? `Publicar o RESULTADO FINAL do Edital ${numero}?\n\nO PDF sai com a bolsa concedida a cada projeto, para todos os professores e para a página pública.${semBolsa
        ? `\n\nAtenção: ${semBolsa} projeto(s) aprovado(s) ainda sem decisão de fomento — no documento sairiam como "sem decisão".` : ""}`
      : `Recolher a publicação do resultado do Edital ${numero}?\n\nO documento volta a aparecer como "em breve" para quem não é da gestão.`;
  if (!confirm(pergunta)) return;
  try {
    await api("/api/ic/resultado/publicar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ edital: numero, fase }),
    });
    META = await api("/api/ic/meta");
    nav(SECAO);
    aviso(fase === "preliminar" ? `Resultado preliminar do Edital ${numero} publicado.`
      : fase === "final" ? `Resultado final do Edital ${numero} publicado.`
        : `Publicação do resultado do Edital ${numero} recolhida.`);
  } catch (e) { aviso(e.message, "err"); }
}

/* Convite de cadastro aos professores importados — só a gestão. Primeiro a
   simulação (a lista de quem receberia), depois a confirmação e o envio.
   Quem já criou usuário e informou o CPF não entra; quem já foi convidado
   só recebe de novo se a gestão mandar reenviar. */
async function convidarProfessores() {
  const post = (corpo) => api("/api/ic/convidar-professores", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  try {
    const s = await post({ simular: true });
    const li = (x) => `• ${x.nome || x.email}${x.email ? ` — ${x.email}` : ""} (${x.projetos} projeto${x.projetos > 1 ? "s" : ""})`;
    const rodape = (n) => `${n ? `\n\n${n} professor(es) sem e-mail no formulário — convite impossível por aqui.` : ""}`;
    if (!s.novos.length && !s.jaConvidados.length) {
      aviso(`Ninguém a convidar: os professores do ciclo já estão vinculados ou já entraram.${rodape(s.semEmail.length)}`);
      return;
    }
    let reenviar = false;
    if (!s.novos.length) {
      if (!confirm(`Todos os ${s.jaConvidados.length} professor(es) pendentes já receberam o convite:\n\n${s.jaConvidados.map(li).join("\n")}\n\nReenviar o e-mail a eles?`)) return;
      reenviar = true;
    } else if (!confirm(`Convidar ${s.novos.length} professor(es) por e-mail?\n\n${s.novos.map(li).join("\n")}${s.jaConvidados.length ? `\n\n(${s.jaConvidados.length} já convidado(s) antes não recebem de novo.)` : ""}${rodape(s.semEmail.length)}\n\nO e-mail explica o cadastro e lembra do CPF no perfil — é ele que vincula os projetos à conta.`)) return;
    const r = await post({ reenviar });
    if (!r.enviados.length && r.falhas?.length) {
      aviso(`Nenhum convite saiu — ${r.falhas.length} falha(s) de envio: ${r.falhas[0].erro}`, "err");
      return;
    }
    aviso(`Convite enviado a ${r.enviados.length} professor(es)${r.falhas?.length ? ` — ${r.falhas.length} falhou(aram), veja o log` : ""}.`);
  } catch (e) { aviso(e.message, "err"); }
}

/* ------------------------------ relatórios ----------------------------- */
/* Para a gestão, a guia Relatórios é um radar: cada projeto em execução com
   a sua situação frente aos prazos do edital — EM DIA ou ATRASADO — e nada
   mais. O relatório completo se lê dentro do projeto, num clique. */
function renderRelatoriosGestao() {
  const emExec = PROJETOS.filter((p) => ["aprovado", "concluido"].includes(p.status));
  const ordem = emExec.slice().sort((a, b) =>
    (b.prazoRelatorios?.atrasado === true) - (a.prazoRelatorios?.atrasado === true)
    || String(a.numero || "").localeCompare(String(b.numero || "")));
  const atrasados = ordem.filter((p) => p.prazoRelatorios?.atrasado).length;
  const fmtBr = (iso) => iso ? iso.split("-").reverse().join("/") : "—";

  const situacao = (p) => {
    if (p.status === "concluido") return `<span class="badge b-validado">concluído</span>`;
    if (p.prazoRelatorios?.atrasado) {
      const quais = p.prazoRelatorios.prazos.filter((x) => x.atrasado)
        .map((x) => `${x.tipo} (venceu ${fmtBr(x.vence)})`).join(" e ");
      return `<span class="badge b-atrasada" title="${esc(quais)}">atrasado</span>`;
    }
    return `<span class="badge b-aprovado">em dia</span>`;
  };

  $("v-relatorios").innerHTML = `
    <div class="tut"><details><summary>Como os prazos funcionam</summary>
      <ol>
        <li>São dois relatórios por aluno: o <b>parcial</b>, que vence aos 6 meses de execução, e o <b>final</b>, no fim da vigência.</li>
        <li>Cada um pode começar a ser entregue <b>2 meses antes</b> de vencer.</li>
        <li>O projeto fica <b>atrasado</b> quando um prazo vence e ainda falta relatório daquele tipo.</li>
        <li>Clique no projeto para ler os relatórios completos e o histórico.</li>
      </ol></details></div>

    <div class="card">
      <div class="card-t">Projetos em execução</div>
      <div class="card-s">${emExec.length} projeto(s)${atrasados ? ` · <b style="color:var(--warn)">${atrasados} atrasado(s)</b>` : " · todos em dia"}.</div>
      ${ordem.map((p) => `
        <div class="linha" style="cursor:pointer" onclick="abrir('${esc(p.id)}')">
          <div class="txt">
            <div class="p1">${esc(p.numero || "sem número")} · ${esc(p.titulo || "(sem título)")}</div>
            <div class="p2">${esc(cursoNome(p.curso))} · orientação: ${esc(p.orientador?.nome || p.orientador?.email || "—")}
              · ${p.relatorios} relatório(s) no sistema${p.aValidar ? ` · ${p.aValidar} a validar` : ""}</div>
          </div>
          ${situacao(p)}
        </div>`).join("") || `<div class="vazio">Nenhum projeto em execução ainda — a guia acompanha os aprovados.</div>`}
    </div>`;
}

async function validar(projetoId, relId, decisao) {
  let parecer = "";
  if (decisao === "devolvido") {
    parecer = prompt("O que o aluno precisa corrigir?") || "";
    if (parecer.trim().length < 10) return aviso("Escreva o parecer da devolução.", "warn");
  } else {
    parecer = prompt("Parecer da validação (opcional):") ?? "";
  }
  try {
    await api(`/api/ic/${projetoId}/relatorio/${relId}/validar`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decisao, parecer }),
    });
    await carregar(); montarSidebar();
    if (SECAO === "projeto") abrir(projetoId); else renderRelatorios();
    aviso(decisao === "validado" ? "Relatório validado." : "Relatório devolvido ao aluno.");
  } catch (e) { aviso(e.message, "err"); }
}

function desenharAlunos() {
  if (!$("tb-alunos")) return;   // antes da aprovação a indicação não existe
  const ger = PODE.podeGerir || PODE.podeEditar;
  $("tb-alunos").innerHTML = (ATUAL.alunos || []).map((a, i) => `
    <tr>
      <td><input ${ger ? "" : "disabled"} value="${esc(a.nome || "")}" oninput="ATUAL.alunos[${i}].nome=this.value"></td>
      <td><input type="email" ${ger ? "" : "disabled"} value="${esc(a.email || "")}" oninput="ATUAL.alunos[${i}].email=this.value;desenharEtapas()"></td>
      <td><input ${ger ? "" : "disabled"} value="${esc(a.telefone || "")}" oninput="ATUAL.alunos[${i}].telefone=this.value" placeholder="(62) 9…"></td>
      <td><input ${ger ? "" : "disabled"} value="${esc(a.curso || "")}" oninput="ATUAL.alunos[${i}].curso=this.value"></td>
      <td><input ${ger ? "" : "disabled"} value="${esc(a.periodo || "")}" oninput="ATUAL.alunos[${i}].periodo=this.value" placeholder="5º"></td>
      <td><input type="checkbox" style="width:auto" ${a.bolsista ? "checked" : ""} ${ger ? "" : "disabled"} onchange="ATUAL.alunos[${i}].bolsista=this.checked"></td>
      <td>${ger ? `<button class="rm" title="remover" onclick="ATUAL.alunos.splice(${i},1);desenharAlunos();desenharEtapas()">×</button>` : ""}</td>
    </tr>${!a.email ? `<tr><td colspan="7" class="muted" style="border-top:0;padding-top:0">
      ⚠ sem e-mail não há convite: ${esc(a.nome || "este aluno")} não entra no sistema</td></tr>` : ""}`).join("")
    || `<tr><td colspan="7" class="muted">Nenhum aluno indicado ainda.</td></tr>`;
}
function addAluno() { ATUAL.alunos = [...(ATUAL.alunos || []), { nome: "", email: "", telefone: "", curso: cursoNome(ATUAL.curso), periodo: "", bolsista: false }]; desenharAlunos(); }

function desenharEtapas() {
  const ger = PODE.podeGerir || PODE.podeEditar;
  const ro = ger ? "" : "disabled";
  const opcoes = (sel) => `<option value="" ${!sel ? "selected" : ""}>orientação</option>` +
    (ATUAL.alunos || []).filter((a) => a.email).map((a) =>
      `<option value="${esc(a.email)}" ${sel === a.email ? "selected" : ""}>${esc(a.nome || a.email)}</option>`).join("");

    <tr>
      <td><input ${ro} value="${esc(e.atividade || "")}" oninput="ATUAL.cronograma[${i}].atividade=this.value" placeholder="Revisão bibliográfica"></td>

/** Grupos que aparecem nos projetos a que a pessoa tem acesso. */
function gruposEmUso() {
  const vistos = new Set(PROJETOS.map((p) => p.grupoPesquisa).filter(Boolean));
  return [...vistos].sort((a, b) => a.localeCompare(b, "pt-BR"));
}

/* --------------------------- grupo de pesquisa ------------------------- */
/* O edital só quer saber a que grupo a proposta se liga. A lista traz os
   certificados no DGP/CNPq e os que já foram informados à mão por alguém; se
   o grupo não estiver em nenhuma das duas, a pessoa digita o nome e ele passa
   a aparecer para os próximos. */
function campoGrupo(p, ro) {
  const conhecidos = gruposConhecidos();
  const livre = !!p.grupoPesquisa && !conhecidos.includes(p.grupoPesquisa);
  const opcoes = (lista) => lista.map((g) =>
    `<option value="${esc(g)}" ${p.grupoPesquisa === g ? "selected" : ""}>${esc(g)}</option>`).join("");
  return `
    <select id="grupo-lista" ${ro} onchange="escolheuGrupo(this.value)">
      <option value="">— não vinculada a grupo —</option>
      ${(META.certificados || []).length ? `<optgroup label="Certificados no DGP/CNPq">${opcoes(META.certificados)}</optgroup>` : ""}
      ${(META.informados || []).length ? `<optgroup label="Informados em outras propostas">${opcoes(META.informados)}</optgroup>` : ""}
      <option value="__novo" ${livre ? "selected" : ""}>Outro grupo — informar o nome…</option>
    </select>
    <input id="grupo-livre" ${ro} style="margin-top:8px;${livre ? "" : "display:none"}"
      value="${esc(livre ? p.grupoPesquisa : "")}" maxlength="200"
      placeholder="Nome do grupo, como consta no Diretório do CNPq"
      oninput="campo('grupoPesquisa',this.value)">`;
}

function escolheuGrupo(valor) {
  const caixa = $("grupo-livre");
  if (valor === "__novo") {
    caixa.style.display = "";
    campo("grupoPesquisa", caixa.value.trim());
    caixa.focus();
  } else {
    caixa.style.display = "none";
    caixa.value = "";
    campo("grupoPesquisa", valor);
  }
}

/* Resultado do processo seletivo, em PDF timbrado: o documento que a PROPPEX
   publica e arquiva. Sai do edital escolhido no filtro; sem filtro, do
   vigente — para os antigos, escolha o edital antes. */
function baixarResultado() {
  const numero = FILTRO.edital || META.edital?.numero || "";
  window.open("/api/ic/resultado.pdf?edital=" + encodeURIComponent(numero), "_blank");
}

/* Importação do banco do edital que acompanha o sistema. Roda primeiro em
   simulação — ninguém deve gravar 33 projetos sem ver antes o que entra. */
async function importarEdital(simular) {
  try {
    const r = await api("/api/ic/importar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ arquivo: "edital-01-2026", simular }),
    });
    const resumo = `${r.criados} a criar, ${r.atualizados} a atualizar` +
      (r.semCpf ? `, ${r.semCpf} sem CPF válido` : "") +
      (r.invalidos?.length ? `, ${r.invalidos.length} com pendência` : "");
    if (simular) {
      const detalhe = (r.invalidos || []).slice(0, 5).map((x) => `linha ${x.linha}: ${x.erro}`).join("\n");
      if (!confirm(`Importação do edital 01/2026\n\n${resumo}\n\n${detalhe}\n\nConfirmar a gravação?`)) return;
      return importarEdital(false);
    }
    await carregar(); montarSidebar(); renderGestao();
    aviso(`Edital importado: ${resumo}.`);
  } catch (e) { aviso(e.message, "err"); }
}

/* --------------- pendências e resultado da seleção --------------------- */
function renderPendencias(p) {
  if (PODE.papel === "avaliador") return "";
  const f = [];
  for (const a of p.alunos || []) if (!a.email) f.push(`${a.nome || "Um aluno indicado"} está sem e-mail — sem ele o aluno não entra no sistema para enviar relatório.`);
  if (!Object.keys(p.producao || {}).length) f.push("A planilha de pontuação da produção acadêmica não foi preenchida — ela vale até 100 dos 200 pontos da classificação.");
  if (p.etica?.exige && !p.etica?.protocolo) f.push("Projeto com seres humanos ou animais sem o protocolo do CEP/CEUA.");
  if (!f.length) return "";
  return `<div class="banner ba-warn"><b>Pendências</b><ul style="margin:6px 0 0 18px">
    ${f.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
}

/* O resultado da seleção quanto à bolsa. As oito modalidades do edital são
   o cruzamento linha × fomento: marcada a bolsa, a modalidade sai sozinha. */
function renderSelecao(p) {
  const gestao = PODE.podeDesignar;
  if (!gestao && !p.fomento) return "";
  const cls = p.classificacao;

  if (!gestao) {
    return `<div class="card">
      <div class="card-t">Resultado da seleção</div>
      <div class="kv"><b>${esc(fomentoNome(p.fomento.tipo))}</b>${p.fomento.modalidade ? ` · ${esc(modNome(p.fomento.modalidade))}` : ""}</div>
      ${p.fomento.observacao ? `<div class="kv">${esc(p.fomento.observacao)}</div>` : ""}
    </div>`;
  }

  return `<div class="card">
    <div class="card-t">Seleção e concessão</div>
    <div class="card-s">A decisão da seleção numa escolha só: aprovado com bolsa (CNPq ou UNIEGO), aprovado
      sem bolsa (voluntário) ou reprovado. A modalidade do edital sai daí:
      ${esc(linhaNome(p.linha))} + bolsa CNPq = ${esc(modNome((META.modalidades.find((m) => m.linha === p.linha && m.fomento === "cnpq") || {}).codigo))}.
      Concedida a bolsa, a orientação indica o bolsista na ficha que abre no projeto.</div>

    ${p.fomento ? `<div class="banner ba-ok">Definido: <b>${esc(fomentoNome(p.fomento.tipo))}</b>${
      p.fomento.modalidade ? ` — ${esc(modNome(p.fomento.modalidade))}` : ""} · por ${esc(p.fomento.por)} em ${fmtDH(p.fomento.em)}</div>`
      : p.status === "reprovado" ? `<div class="banner ba-err">Projeto reprovado na seleção.</div>` : ""}

    <div class="exp">
      <button class="bt ${p.fomento?.tipo === "cnpq" ? "bt-pri" : "bt-sec"}" onclick="decidirSelecao('cnpq')">✓ Aprovado com bolsa CNPq</button>
      <button class="bt ${p.fomento?.tipo === "uniego" ? "bt-pri" : "bt-sec"}" onclick="decidirSelecao('uniego')">✓ Aprovado com bolsa UNIEGO</button>
      <button class="bt ${p.fomento?.tipo === "voluntario" ? "bt-pri" : "bt-sec"}" onclick="decidirSelecao('voluntario')">✓ Aprovado sem bolsa</button>
      <button class="bt bt-err" onclick="decidirSelecao('reprovado')">✕ Reprovado</button>
    </div>

    ${p.status === "rascunho" ? "" : `
    <div class="sec-t">Nota do projeto</div>
    <div class="muted" style="margin-bottom:8px">Na seleção conduzida fora do sistema, a coordenação
      atribui aqui a nota do projeto (0 a 100), sem formulário. Havendo pareceres no sistema, a nota
      atribuída tem precedência sobre a média deles.</div>
    ${p.notaDireta ? `<div class="banner ba-info">Nota atribuída: <b>${p.notaDireta.valor}</b> · por
      ${esc(p.notaDireta.por)} em ${fmtDH(p.notaDireta.em)}${p.notaDireta.observacao ? ` — ${esc(p.notaDireta.observacao)}` : ""}</div>` : ""}
    <div class="grid3">
      <div><label>Nota do projeto (0 a 100)</label>
        <input type="number" min="0" max="100" step="0.5" id="nota-direta" value="${p.notaDireta?.valor ?? ""}"></div>
      <div><label>Observação <span class="muted">(opcional; fica no histórico)</span></label>
        <input id="nota-direta-obs" value="${esc(p.notaDireta?.observacao || "")}" placeholder="Ex.: média dos pareceres do processo externo"></div>
      <div style="display:flex;align-items:flex-end;gap:8px">
        <button class="bt bt-sec" onclick="atribuirNota()">Atribuir nota</button>
        ${p.notaDireta ? `<button class="bt bt-ghost" onclick="atribuirNota(true)" title="Volta a valer a média dos pareceres">Desfazer</button>` : ""}
      </div>
    </div>`}

    ${cls ? `<div class="stat" style="margin-top:16px">
      <div class="s"><b>${cls.np ?? "—"}</b><span>Projeto (0–100)${p.notaDireta ? " · atribuída" : " · média dos pareceres"}</span></div>
      <div class="s"><b>${cls.cl ?? "—"}</b><span>Currículo (0–100) · planilha</span></div>
      <div class="s" style="border-color:var(--brand-3)"><b>${cls.total ?? "—"}</b><span>Nota final = projeto + currículo${cls.np == null ? " · aguarda nota do projeto" : ""}</span></div>

/* Nota atribuída direto pela coordenação — a seleção deste ano correu fora
   do sistema; nos próximos, o caminho é o parecer pelo formulário. */
async function atribuirNota(desfazer) {
  const valor = desfazer ? null : $("nota-direta").value.trim();
  if (!desfazer && valor === "") return aviso("Informe a nota do projeto, de 0 a 100.", "warn");
  if (desfazer && !confirm("Desfazer a nota atribuída? Volta a valer a média dos pareceres do sistema.")) return;
  try {
    await api(`/api/ic/${ATUAL.id}/nota`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nota: desfazer ? null : Number(valor), observacao: desfazer ? "" : $("nota-direta-obs").value.trim() }),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso(desfazer ? "Nota desfeita — vale a média dos pareceres." : `Nota do projeto registrada: ${valor}.`);
  } catch (e) { aviso(e.message, "err"); }
}

/* A decisão da seleção numa tacada: aprovar (se ainda estiver submetido) e
   marcar o fomento — ou reprovar, com o parecer que a orientação vai ler. */
async function decidirSelecao(tipo) {
  try {
    if (tipo === "reprovado") {
      if (ATUAL.status === "aprovado" && !confirm("Este projeto já está APROVADO. Reprovar agora desfaz a decisão e cancela a bolsa concedida. Continuar?")) return;
      const parecer = prompt("Parecer da reprovação (a orientação vai ler):");
      if (parecer === null) return;
      if (parecer.trim().length < 10) return aviso("Escreva o parecer da reprovação — quem recebe precisa saber o porquê.", "warn");
      await api(`/api/ic/${ATUAL.id}/avaliar`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decisao: "reprovado", parecer }),
      });
      await carregar(); montarSidebar(); await abrir(ATUAL.id);
      return aviso("Projeto reprovado na seleção.");
    }
    const obs = tipo === "voluntario" ? "" : (prompt("Observação sobre a concessão (opcional):") ?? "");
    if (ATUAL.status === "submetido") {
      await api(`/api/ic/${ATUAL.id}/avaliar`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decisao: "aprovado", parecer: "" }),
      });
    }
    await api(`/api/ic/${ATUAL.id}/fomento`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tipo, observacao: obs }),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso(`Decisão registrada: aprovado — ${fomentoNome(tipo)}.${tipo !== "voluntario" ? " A orientação já pode indicar o bolsista na ficha do projeto." : ""}`);
  } catch (e) { aviso(e.message, "err"); }
}

/* --------------------- indicação do bolsista --------------------------- */
/* Abre quando a bolsa é concedida (CNPq ou UNIEGO). Quem preenche é a
   orientação — são os dados que a PROPPEX exporta para montar o contrato:
   CPF, telefone e a conta que vai receber a bolsa. O avaliador e os colegas
   de projeto nunca veem esses campos (o recorte é do servidor). */
function renderIndicacaoBolsista(p, ger) {
  // só depois do resultado: projeto aprovado com bolsa marcada na seleção
  if (!p.id || !["aprovado", "concluido"].includes(p.status)) return "";
  if (!p.fomento || p.fomento.tipo === "voluntario") return "";
  if (PODE.papel === "avaliador") return "";

  // O PRÓPRIO aluno preenche os dados do contrato — a ficha dele
  if (PODE.papel === "aluno") {
    const eu = (p.alunos || []).find((a) => a.email === META.eu);
    if (!eu || !eu.bolsista) return "";
    return `<div class="card">
      <div class="card-t">Meus dados para o contrato da bolsa</div>
      <div class="card-s"><b>${esc(fomentoNome(p.fomento.tipo))}</b> concedida. Preencha os seus dados —
        são eles que geram o contrato. A conta e o Pix precisam estar no seu nome.</div>
      <div class="grid3">
        <div><label>CPF *</label><input id="md-cpf" value="${esc(eu.cpf || "")}" placeholder="000.000.000-00"></div>
        <div><label>Telefone *</label><input id="md-telefone" value="${esc(eu.telefone || "")}" placeholder="(62) 90000-0000"></div>
        <div><label>Banco *</label><input id="md-banco" value="${esc(eu.banco || "")}" placeholder="Ex.: Caixa, Nubank"></div>

        <div><label>Agência</label><input id="md-agencia" value="${esc(eu.agencia || "")}"></div>
