<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHÉ IC · Iniciação Científica · PROPPEX / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
  :root{
    --brand:#1c3742; --brand-2:#2d535c; --brand-3:#40717e; --accent:#71c8e2;
    --bg:#ebeef3; --card:#fff; --line:#e3e7ee; --line-2:#f0f2f6; --trilho:#eef1f5;
    --ink:#1c3742; --ink-soft:#3a4650; --muted:#7c8794; --muted-2:#a9b4c0;
    --ok:#3f8a5d; --ok-soft:#e5f3ea; --warn:#c98a2b; --warn-soft:#fbf3e4;
    --err:#a1524c; --err-soft:#f6e9e7; --info:#40717e; --info-soft:#e8f4fa;
    --roxo:#5e5091; --roxo-soft:#ecebf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-3);text-decoration:none}
  a:hover{color:var(--brand-2)}
  ::selection{background:var(--accent);color:var(--brand)}
  button{font-family:Figtree,system-ui,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
  .f-disp{font-family:Sora,sans-serif}

  /* ------------------------------- casca -------------------------------- */
  .app{display:flex;min-height:100vh}
  .side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side-marca{padding:20px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
  .side-marca b{color:var(--accent);font-weight:800}
  .side-nav{padding:14px 12px;flex:1;overflow-y:auto}
  .side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:10px 12px 6px}
  .side-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
    margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
    border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
    transition:background .15s,color .15s}
  .side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
  .side-item svg{flex:none}
  .side-item .tag{margin-left:auto;background:var(--accent);color:var(--brand);font-size:10.5px;
    font-weight:700;border-radius:20px;padding:1px 7px}
  .side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
  .side-pe .av{width:34px;height:34px;border-radius:50%;background:var(--brand-3);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
  .side-pe .av img{width:100%;height:100%;object-fit:cover}
  .side-pe .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
  .side-pe .pp{font-size:11px;color:rgba(255,255,255,.5)}
  .side-pe .sair{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-weight:600}
  .side-pe .sair:hover{color:#fff}

  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .topbar .dir{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .area{padding:28px 32px;flex:1}
  .limite{max-width:1180px}
  h1{font-family:Sora,sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}

  /* ------------------------------- cartões ------------------------------ */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}
  .card-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;margin-bottom:2px}
  .card-s{font-size:12px;color:var(--muted);margin-bottom:20px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpis>*{min-width:0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .kpi .v{font-family:Sora,sans-serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:7px;color:var(--muted)}
  /* Barras do panorama: uma cor só, porque o que se compara é TAMANHO —
     quem diz "quem é" é o rótulo da linha, não a cor. Marca fina, ponta
     arredondada e o número direto ao lado, para não precisar de eixo. */
  .barras{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .barra{display:grid;grid-template-columns:minmax(110px,36%) 1fr auto;align-items:center;gap:10px}
  .barra .rot{font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barra .trilho{height:10px;border-radius:5px;background:var(--trilho);overflow:hidden}
  .barra .fill{height:100%;border-radius:5px;background:var(--brand-3);min-width:2px}
  .barra .val{font-family:Sora,sans-serif;font-weight:700;font-size:13px;color:var(--ink);min-width:34px;text-align:right}
  .barra .val span{font-weight:500;font-size:11px;color:var(--muted);margin-left:3px}
  .barra:hover .fill{background:var(--brand-2)}
  .quad{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px}
  .quad .qt{font-family:Sora,sans-serif;font-weight:600;font-size:14px;color:var(--ink);margin-bottom:2px}
  .quad .qs{font-size:12px;color:var(--muted);margin-bottom:12px}
  .grade2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  @media(max-width:900px){.grade2{grid-template-columns:1fr}}
  .duplo{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px}
  .duplo>*{min-width:0}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.duplo{grid-template-columns:1fr}}
  .linha{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .linha:last-child{border-bottom:0}
  .linha .txt{flex:1;min-width:0}
  .linha .p1{font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .linha .p2{font-size:11.5px;color:var(--muted)}
  .vazio{font-size:13px;color:var(--muted);padding:10px 0}

  /* ------------------------------ formulários --------------------------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .grid2>*,.grid3>*{min-width:0}
  @media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;border:1px solid #cfd6de;border-radius:8px;padding:10px 12px;
    font-family:Figtree,system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{min-height:84px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(64,113,126,.12)}
  input[disabled],select[disabled],textarea[disabled]{background:#f7f9fb;color:var(--ink-soft)}
  .sec-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:22px 0 6px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  /* ações e filtros da lista de projetos: os botões numa linha própria e os
     recortes num painel em grade — a busca na primeira linha, os demais em
     colunas uniformes, para nada ficar embaralhado */
  .acoes-lista{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .painel-filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
  .painel-filtros select,.painel-filtros input{width:100%;min-width:0;font-size:13px;padding:8px 10px;margin:0}
  .painel-filtros .busca{grid-column:1/-1}
  .painel-filtros .bt{padding:8px 10px;font-size:12.5px}
  /* quadros de classificação recolhíveis: o panorama primeiro, a tabela num clique */
  details.quadro{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
  details.quadro>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:11px 14px;font-family:Sora,sans-serif;font-weight:700;font-size:13.5px;color:var(--ink);
    background:var(--wash);user-select:none;transition:background .15s}
  details.quadro>summary::-webkit-details-marker{display:none}
  details.quadro>summary:hover{background:var(--accent-wash)}
  details.quadro>summary .qt{margin-left:auto;font-size:11px;font-weight:600;color:var(--brand-2);
    background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap}
  details.quadro>summary .seta{font-size:10px;color:var(--muted);transition:transform .2s}
  details.quadro[open]>summary .seta{transform:rotate(180deg)}
  details.quadro>.rolo,details.quadro>.muted{padding:6px 12px 10px}
  .muted{color:var(--muted);font-size:12.5px;font-weight:400}
  .kv{margin:4px 0;font-size:13.5px;color:var(--ink-soft)}
  .kv b{color:var(--ink);font-weight:600}

  /* -------------------------------- botões ------------------------------ */
  .bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bt-pri{background:var(--brand);color:#fff}
  .bt-pri:hover{background:var(--brand-2)}
  .bt-sec{background:var(--info-soft);color:var(--brand);border-color:#cfe6f2}
  .bt-sec:hover{background:#dbeef8}
  .bt-ghost{background:#fff;color:var(--muted);border-color:#cfd6de}
  .bt-ghost:hover{color:var(--ink);border-color:var(--brand-3)}
  .bt-ok{background:var(--ok-soft);color:var(--ok);border-color:#cfeeda}
  .bt-err{background:var(--err-soft);color:var(--err);border-color:#eed6d3}
  .bt:disabled{opacity:.5;cursor:not-allowed}
  .exp{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

  /* ------------------------------- estados ------------------------------ */
  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .b-rascunho{background:#eceff3;color:var(--muted)}
  .b-submetido{background:var(--info-soft);color:var(--info)}
  .b-devolvido{background:var(--warn-soft);color:var(--warn)}
  .b-aprovado{background:var(--ok-soft);color:var(--ok)}
  .b-concluido{background:var(--roxo-soft);color:var(--roxo)}
  .b-reprovado{background:var(--err-soft);color:var(--err)}
  .b-prevista{background:#eceff3;color:var(--muted)}
  .b-andamento{background:var(--info-soft);color:var(--info)}
  .b-concluida{background:var(--ok-soft);color:var(--ok)}
  .b-atrasada{background:var(--err-soft);color:var(--err)}
  .b-enviado{background:var(--info-soft);color:var(--info)}
  .b-validado{background:var(--ok-soft);color:var(--ok)}
  .banner{border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500}
  .ba-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0e0bd}
  .ba-err{background:var(--err-soft);color:var(--err);border:1px solid #eed6d3}
  .ba-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #cfeeda}
  .ba-info{background:var(--info-soft);color:var(--info);border:1px solid #cfe6f2}

  /* -------------------------------- listas ------------------------------ */
  .item{display:flex;align-items:center;gap:14px;padding:15px 18px;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .item:hover{border-color:var(--brand-3);box-shadow:0 2px 10px -4px rgba(28,55,66,.18)}
  .item .nm{font-weight:600;flex:1;min-width:0;font-size:14px;color:var(--ink)}
  .item .cs{color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  .num{font-family:Sora,sans-serif;font-size:12px;font-weight:700;color:var(--brand-3);white-space:nowrap}
  table.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.pt th{background:#f7f9fb;color:var(--muted);padding:9px 10px;text-align:left;font-size:11.5px;
    font-weight:600;border-bottom:1px solid var(--line)}
  table.pt td{border-bottom:1px solid var(--line-2);padding:8px 10px;color:var(--ink-soft);vertical-align:middle}
  table.pt td input,table.pt td select{font-size:12.5px;padding:7px 8px}
  table.pt .rm{color:var(--err);cursor:pointer;font-weight:700;background:none;border:0;font-size:15px}
  .rolo{overflow-x:auto}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat>*{min-width:0}
  .stat .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .s b{font-family:Sora,sans-serif;font-size:22px;display:block;color:var(--ink);line-height:1.1}
  .stat .s span{font-size:11.5px;color:var(--muted)}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .filtros select,.filtros input{width:auto;min-width:150px;font-size:13px;padding:8px 10px}
  .bloco{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;background:#fcfdfe}
  .bloco.meu{border-color:#cfe6f2;background:#f7fbfd}
  .bloco-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .bloco-cab .t{font-weight:600;font-size:14px;color:var(--ink);flex:1;min-width:0}
  .prazo{font-size:12px;color:var(--muted);white-space:nowrap}
  .tut{background:var(--info-soft);border:1px solid #cfe6f2;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px}
  .tut summary{font-family:Sora,sans-serif;font-weight:700;color:var(--brand);cursor:pointer;font-size:13.5px}
  .tut ol{margin:10px 0 4px 20px}
  .tut li{margin-bottom:5px}
  .hide{display:none!important}

  /* ---------------- devolutiva da seleção, colada ao projeto -------------- */
  .proj-linha{margin-bottom:2px}
  .proj-linha .item{margin-bottom:0}
  .aval-rec{background:var(--info-soft);border:1px solid #cfe6f2;border-top:0;
    border-radius:0 0 10px 10px;margin:-2px 0 12px;padding:0 14px}
  .aval-rec summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--info);padding:9px 0}
  .aval-rec summary:hover{color:var(--brand-2)}
  .aval-rec[open] summary{border-bottom:1px solid #cfe6f2;margin-bottom:10px}
  .aval-rec .aval-item{padding-bottom:10px;font-size:13px;color:var(--ink-soft)}
  .aval-rec .aval-item + .aval-item{border-top:1px dashed #cfe6f2;padding-top:12px}
  .aval-rec .aval-t{font-family:Sora,sans-serif;font-weight:700;font-size:12.5px;color:var(--brand)}
  .aval-rec table{font-size:12.5px}
  .cont-box{margin:12px 0 12px;padding:12px 14px;background:#fff;border:1px solid #cfe6f2;border-radius:10px}
  .cont-t{font-family:Sora,sans-serif;font-weight:700;font-size:13px;color:var(--brand)}
  .cont-resp{margin-top:10px;padding-top:9px;border-top:1px dashed #cfe6f2;font-size:12.5px;color:var(--ink-soft)}

  /* --------------------------- ver como (picker) ------------------------- */
  /* A lista de pessoas do setor cresce a cada edital: numa caixa de seleção
     única viravam dezenas de linhas para rolar. Vira um botão que abre uma
     janela com busca — quem procura alguém digita três letras. */
  .vc-bt{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #cfd6de;
    border-radius:8px;padding:6px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .vc-bt:hover{border-color:var(--brand-3);color:var(--ink)}
  .vc-bt b{color:var(--ink);font-weight:600}
  .vc-bt.on{background:var(--warn-soft);border-color:#e8d3a8;color:#8a6420}
  .vc-bt.on b{color:#6d4e19}
  .ov{position:fixed;inset:0;background:rgba(28,55,66,.42);z-index:40;display:flex;
    align-items:flex-start;justify-content:center;padding:60px 18px 24px;overflow-y:auto}
  .ov-cx{background:#fff;border-radius:14px;width:100%;max-width:520px;padding:22px 22px 18px;
    box-shadow:0 24px 60px rgba(18,38,50,.28)}
  .ov-cab{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
  .ov-cab .t{font-family:Sora,sans-serif;font-weight:700;font-size:16px;flex:1}
  .ov-x{background:none;border:0;font-size:20px;line-height:1;color:var(--muted-2);cursor:pointer;padding:0 2px}
  .ov-x:hover{color:var(--ink)}
  .vc-lab{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--muted-2);margin:18px 0 8px}
  .vc-gen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vc-op{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);
    border-radius:9px;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
  .vc-op small{font-weight:400;font-size:11.5px;color:var(--muted)}
  .vc-op:hover{border-color:var(--brand-3)}
  .vc-op.on{background:var(--info-soft);border-color:#a8d5e8;color:var(--brand)}
  .vc-abas{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
  .vc-aba{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;
    color:var(--muted);cursor:pointer}
  .vc-aba:hover{border-color:var(--brand-3);color:var(--ink)}
  .vc-aba.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .vc-lista{max-height:290px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
  .vc-p{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;
    border-bottom:1px solid var(--line-2);padding:9px 12px;cursor:pointer}
  .vc-p:last-child{border-bottom:0}
  .vc-p:hover,.vc-p.foco{background:var(--info-soft)}
  .vc-p.on{background:var(--info-soft);box-shadow:inset 3px 0 0 var(--brand-3)}
  .vc-ini{width:30px;height:30px;border-radius:50%;background:var(--trilho);color:var(--brand-3);flex:none;
    display:grid;place-items:center;font-size:11.5px;font-weight:700}
  .vc-p .nm{display:block;font-size:13px;font-weight:600;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vc-p .dt{display:block;font-size:11px;color:var(--muted);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vc-p .tags{margin-left:auto;display:flex;gap:4px;flex:none}
  .vc-tag{font-size:10px;font-weight:700;border-radius:20px;padding:2px 7px;background:var(--trilho);color:var(--muted)}
  .vc-tag.o{background:var(--info-soft);color:var(--info)}
  .vc-tag.a{background:var(--ok-soft);color:var(--ok)}
  .vc-tag.v{background:var(--roxo-soft);color:var(--roxo)}
  .vc-vazio{padding:22px 14px;text-align:center;color:var(--muted);font-size:12.5px}

  @media(max-width:760px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .side-nav{padding:8px 10px;flex:1 1 100%;order:3;overflow-x:auto}
    .side-nav #menu{display:flex;gap:6px}
    .side-lab{display:none}
    .side-item{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px}

<!-- Escolha de por quais olhos olhar o setor (só a coordenação a enxerga). -->

<script>
/* ======================================================================
   ARCHÉ IC — Iniciação Científica.
   Projeto: rascunho → submetido → avaliado pela PROPPEX → em execução.
   Cronograma e relatórios ficam presos ao projeto; cada pessoa vê o que
   é dela (a regra vive no servidor, em lib/ic.js).
   ====================================================================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtD = (iso) => (iso ? String(iso).split("-").reverse().join("/") : "—");
const fmtDH = (iso) => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "—"; };
const hojeISO = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date());

let META = { cursos: [], modalidades: [], status: [], rotulos: {}, gestao: false, eu: "", perfil: "orientador",
  linhas: [], certificados: [], informados: [], fomentos: [], titulacoes: [], blocosProducao: [],
  edital: {}, producaoAnterior: null };
// todos os grupos que a tela oferece, na ordem em que aparecem
const gruposConhecidos = () => [...(META.certificados || []), ...(META.informados || [])];
let PROJETOS = [], ETAPAS = [], RELS = { relatorios: [], pendentes: [] };
let ATUAL = null, PODE = {}, ME = null, SECAO = "painel";
// contagens de usuários do portal (só gestor geral) — chegam depois do
// painel desenhado, porque vêm de outra rota; null = ainda não vieram
let USUARIOS = null;
// "ver como": a coordenação abre o setor pelos olhos de outra pessoa. Guardado
// na aba (sessionStorage) para sobreviver ao F5 sem grudar entre sessões.
let COMO = sessionStorage.getItem("arche-ic-como") || "";
let FILTRO = { status: "", curso: "", linha: "", grupo: "", q: "", edital: "", titulacao: "", bolsa: "" };
// Inclusão manual: a coordenação abre a submissão em nome de outro professor
// (pedido fora do prazo deferido pela pró-reitoria). Vale só para o formulário
// aberto agora — some assim que o projeto é salvo ou a tela troca.
let MANUAL = false;
// o ciclo (edital) escolhido na guia Projetos — um por vez, começa no vigente
let CICLO_SEL = "";
// quadros de classificação expandidos (chave: ciclo|rótulo) — começa tudo

const QUADROS_ABERTOS = new Set();
// a lista de onde o projeto foi aberto (avaliação, gestão, projetos…):
// é para onde o "Retornar" leva de volta
let ORIGEM_LISTA = "gestao";
// ciclo escolhido na guia Relatórios (gestão) — começa no vigente
let CICLO_REL = "";
// idem para a guia Bolsistas e Voluntários — começa no ciclo mais atual
let CICLO_BV = "";

// Quatro acessos, uma barra lateral só: cada perfil vê as guias que usa.
//   gestao     — tudo
//   orientador — submissão, gestão dos seus projetos, cronograma, relatórios
//   aluno      — cronograma e relatórios (só os dele)
//   avaliador  — avaliação dos projetos que recebeu, e nada mais
const SECOES = [
  { id: "painel", grupo: "INÍCIO", rot: "Painel", ic: '<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>', perfis: ["gestao", "orientador", "aluno", "avaliador"] },
  // o bolsista do ICEM (perfil "em") tem UMA guia sua: escolher o projeto

  { id: "meuem", grupo: "INÍCIO", rot: "Ensino Médio", ic: '<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>', perfis: ["em"] },
  { id: "submissao", grupo: "PROJETOS", rot: "Submissão", ic: '<path d="M12 5v14M5 12h14"/>', perfis: ["gestao", "orientador"] },
  // o aluno indicado tem as suas duas guias: onde ele está e o que precisa informar
  { id: "meusprojetos", grupo: "PROJETOS", rot: "Projetos", ic: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/>', perfis: ["aluno"] },
  { id: "bolsa", grupo: "PROJETOS", rot: "Bolsa", ic: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a2 2 0 0 1 0 4h-3a2 2 0 0 0 0 4h4"/>', perfis: ["aluno"] },
  { id: "gestao", grupo: "PROJETOS", rot: "Gestão", ic: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/>', perfis: ["gestao", "orientador"] },
  { id: "avaliacao", grupo: "SELEÇÃO", rot: "Avaliação", ic: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>', perfis: ["gestao", "avaliador"] },
  { id: "classificacao", grupo: "SELEÇÃO", rot: "Projetos", ic: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>', perfis: ["gestao"] },
  { id: "bolsas", grupo: "SELEÇÃO", rot: "Bolsas", ic: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a2 2 0 0 1 0 4h-3a2 2 0 0 0 0 4h4"/>', perfis: ["gestao"] },
  { id: "editais", grupo: "SELEÇÃO", rot: "Editais e Resultados", ic: '<path d="M4 4a2 2 0 0 1 2-2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 2v5h5M8 12h8M8 16h8"/>' },
  { id: "bolsistas", grupo: "ACOMPANHAMENTO", rot: "Bolsistas e Voluntários", ic: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>', perfis: ["gestao", "orientador"] },
  { id: "em", grupo: "ACOMPANHAMENTO", rot: "Ensino Médio", ic: '<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>', perfis: ["gestao"] },
  { id: "cronograma", grupo: "ACOMPANHAMENTO", rot: "Cronograma", ic: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>', perfis: ["orientador", "aluno"] },
  { id: "relatorios", grupo: "ACOMPANHAMENTO", rot: "Relatórios", ic: '<path d="M4 4a2 2 0 0 1 2-2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 2v5h5M8 13h8M8 17h5"/>', perfis: ["gestao", "orientador", "aluno"] },
  { id: "certificados", grupo: "ACOMPANHAMENTO", rot: "Certificados", ic: '<circle cx="12" cy="9" r="6"/><path d="M8.5 14.5L7 22l5-3 5 3-1.5-7.5"/>' },
];

const TITULOS = {
  painel: ["Painel", "Situação dos projetos de Iniciação Científica."],
  submissao: ["Submissão de projeto", "Preencha a proposta e submeta à avaliação da PROPPEX."],
  gestao: ["Gestão de projetos", "Projetos submetidos, em execução e concluídos."],
  meusprojetos: ["Meus projetos", "Os projetos em que você foi indicado — orientação, vigência e entregas."],
  bolsa: ["Bolsa", "Os seus dados para o contrato. Você preenche uma vez, e vale para todos os seus projetos."],
  avaliacao: ["Avaliação da seleção", "Parecer ad hoc dos projetos submetidos."],
  classificacao: ["Projetos do edital", "Todos os projetos de cada processo seletivo, em ordem de classificação."],
  bolsistas: ["Bolsistas e Voluntários", "Cada aluno em execução, com as metas do cronograma e as entregas — por ciclo."],
  em: ["Iniciação Científica — Ensino Médio", "O programa ICEM: bolsistas que acompanham projetos para conhecer os cursos, a ciência e o UNIEGO."],
  meuem: ["Meu ICEM", "Escolha o projeto de pesquisa que você quer acompanhar — e entregue o seu relatório final por aqui."],
  bolsas: ["Bolsas", "Atribuição das bolsas conforme a disponibilidade orçamentária, em ordem de pontuação."],
  editais: ["Editais e Resultados", "Os documentos de cada processo, ano a ano: o edital e o resultado."],
  cronograma: ["Cronograma", "Todas as atividades dos projetos num só lugar."],
  relatorios: ["Relatórios", "Parciais e finais: o aluno envia, a orientação valida."],
  certificados: ["Certificados", "Participação e orientação nos ciclos concluídos — reunidos pelo seu CPF."],
  projeto: ["Projeto", ""],
};

/* ------------------------------- infra --------------------------------- */
/* Enquanto se olha pelos olhos de outra pessoa, o recorte é feito no
   servidor — não basta esconder menu, senão a tela mentiria sobre o que a
   pessoa vê (o sigilo do parecer ad hoc é o caso mais claro). */
function comQuem(url) {
  if (!COMO) return url;
  return url + (url.includes("?") ? "&" : "?") + "como=" + encodeURIComponent(COMO);
}

async function api(url, opcoes) {
  // "Ver como" é somente leitura de ponta a ponta: escrever aqui gravaria em
  // nome da COORDENAÇÃO (a sessão real) enquanto a tela finge ser outra
  // pessoa — o servidor já recusa escrita com ?como=, e o cliente não deve
  // contornar isso tirando o parâmetro.
  if (COMO && opcoes && (opcoes.method || "GET") !== "GET")
    throw new Error("Você está vendo o setor como outra pessoa — saia do modo \"ver como\" para editar.");
  const r = await fetch(!opcoes || (opcoes.method || "GET") === "GET" ? comQuem(url) : url, opcoes);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Falha (${r.status})`);
  return j;
}
function aviso(msg, tipo = "ok") {
  $("aviso").innerHTML = faixaVerComo() + `<div class="banner ba-${tipo}">${esc(msg)}</div>`;
  if (tipo === "ok") setTimeout(() => { if ($("aviso").textContent.includes(msg)) $("aviso").innerHTML = faixaVerComo(); }, 6000);
  window.scrollTo(0, 0);
}
const cursoNome = (slug) => (META.cursos.find((c) => c.slug === slug) || {}).nome || slug || "—";
const modNome = (c) => (META.modalidades.find((m) => m.codigo === c) || {}).nome || c || "—";
const linhaNome = (c) => (META.linhas.find((l) => l.codigo === c) || {}).nome || c || "—";
const fomentoNome = (c) => (META.fomentos.find((f) => f.codigo === c) || {}).nome || c || "—";
// a modalidade que vale: a definida pelo fomento; senão, a pretendida
const modVigente = (p) => (p.fomento?.modalidade ? modNome(p.fomento.modalidade)
  : p.modalidade ? modNome(p.modalidade) + " (pretendida)" : linhaNome(p.linha));
function pontuarProducao(q) {
  let total = 0;
  for (const b of META.blocosProducao) {
    // a planilha não tem teto: cada bloco soma o que somar
    total += b.itens.reduce((s, i) => s + (Math.max(0, Math.trunc(Number(q?.[i.codigo]) || 0))) * i.peso, 0);
  }
  return Math.round(total * 100) / 100;
}
const chip = (s) => `<span class="badge b-${esc(s)}">${esc(META.rotulos[s] || s)}</span>`;
const ehAluno = () => META.perfil === "aluno";
const ehAvaliador = () => META.perfil === "avaliador";
const recNome = (c) => (META.recomendacoes.find((r) => r.codigo === c) || {}).nome || c || "—";

async function sair() {
  // o "ver como" mora no sessionStorage, que sobrevive à troca de usuário na
  // mesma aba: sem limpar aqui, quem entrasse depois abriria o setor com a
  // faixa de simulação de alguém que não é ele
  sessionStorage.removeItem("arche-ic-como");
  try { await fetch("/auth/sair", { method: "POST" }); } catch { /* ignora */ }
  location.href = "/";
}

/* ------------------------------ navegação ------------------------------ */
function montarSidebar() {
  let grupo = "";
  $("menu").innerHTML = SECOES
    .filter((s) => !s.perfis || s.perfis.includes(META.perfil))
    .map((s) => {
      const cab = s.grupo !== grupo ? `<div class="side-lab">${s.grupo}</div>` : "";
      grupo = s.grupo;
      const n = s.id === "relatorios" ? RELS.relatorios.filter((r) => r.podeValidar).length
        : s.id === "avaliacao" ? PROJETOS.filter((p) => p.aDarParecer).length : 0;
      return `${cab}<button class="side-item" data-s="${s.id}" onclick="nav('${s.id}')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${s.ic}</svg>
        ${s.rot}${n ? `<span class="tag">${n}</span>` : ""}</button>`;
    }).join("");

  const ini = (ME?.nome || ME?.email || "?").trim()[0]?.toUpperCase() || "?";
  const foto = ME?.perfil?.foto;
  const papel = META.gestao ? "coordenação"
    : ehAluno() ? "aluno de IC" : ehAvaliador() ? "avaliador ad hoc" : "orientação";
  $("rodape-usuario").innerHTML = ME ? `
    <a class="av" href="/perfil/" title="Meu perfil">${foto ? `<img src="${esc(foto)}" alt="">` : esc(ini)}</a>
    <div style="min-width:0">
      <div class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((ME.nome || ME.email).split(" ").slice(0, 2).join(" "))}</div>
      <div class="pp">${papel}</div>
    </div>
    <button class="sair" onclick="sair()">sair</button>` : "";
  for (const b of document.querySelectorAll(".side-item")) b.classList.toggle("on", b.dataset.s === SECAO);
}

/* ---------------------------- ver como ----------------------------------
   A coordenação olha o setor pelos olhos de quem precisar conferir. São duas
   coisas diferentes: as VISÕES GENÉRICAS — a cara de cada um dos três
   acessos, sem os dados de ninguém — e as PESSOAS do setor, que crescem a
   cada edital. Por isso a escolha saiu de uma caixa de seleção única (que já
   passava de cem linhas para rolar) e virou uma janela com busca: quem
   procura alguém digita três letras.
   ---------------------------------------------------------------------- */
const GENERICAS = [
  { id: "", rot: "A sua visão", det: "coordenação de pesquisa", curto: "gestor" },
  { id: "perfil:orientador", rot: "Professor", det: "genérica, ainda sem projeto",
    curto: "professor genérico", faixa: "um professor recém-chegado, ainda sem projeto" },
  { id: "perfil:aluno", rot: "Aluno", det: "genérica, ainda sem projeto",
    curto: "aluno genérico", faixa: "um aluno recém-chegado, ainda sem projeto" },
  { id: "perfil:avaliador", rot: "Avaliador ad hoc", det: "genérica, sem designação",
    curto: "avaliador genérico", faixa: "um avaliador ad hoc, ainda sem projeto designado" },
];
const PAPEL_VC = {
  orientador: { rot: "Professor", cls: "o" },
  aluno: { rot: "Aluno", cls: "a" },
  avaliador: { rot: "Avaliador", cls: "v" },
};
let VC = { busca: "", aba: "todos" };

/* As três listas do servidor viram uma só: quem acumula papéis (o professor
   que também avalia) aparecia repetido, uma vez em cada grupo. */
function vcPessoas() {
  const m = new Map();
  const juntar = (lista, papel) => (lista || []).forEach((p) => {
    const a = m.get(p.id) || { ...p, papeis: [], contagem: {} };
    a.nome = a.nome || p.nome; a.semConta = a.semConta || p.semConta;
    if (!a.papeis.includes(papel)) a.papeis.push(papel);
    a.contagem[papel] = p.projetos || 0;
    m.set(p.id, a);
  });
  juntar(META.pessoas?.orientadores, "orientador");
  juntar(META.pessoas?.alunos, "aluno");
  juntar(META.pessoas?.avaliadores, "avaliador");
  return [...m.values()].sort((a, b) => (a.nome || a.email).localeCompare(b.nome || b.email, "pt-BR"));
}

const semAcento = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const vcRotulo = (id) => {
  const g = GENERICAS.find((x) => x.id === id);
  if (g) return g.curto;
  const p = vcPessoas().find((x) => x.id === id);
  return (p?.nome || p?.email || id).split(" ").slice(0, 2).join(" ");
};

function montarVerComo() {
  const alvo = $("dir-info");
  if (!alvo) return;
  if (!META.pessoas) { alvo.textContent = rotuloPerfil(); return; }
  alvo.innerHTML = `<button class="vc-bt ${COMO ? "on" : ""}" onclick="abrirVerComo()"
      title="Ver o setor por outros olhos">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/></svg>
    Ver como <b>${esc(vcRotulo(COMO))}</b></button>`;
}

function abrirVerComo() {
  VC = { busca: "", aba: "todos" };
  const ov = $("ovComo");
  ov.innerHTML = `<div class="ov-cx">
    <div class="ov-cab">
      <div style="flex:1">
        <div class="t">Ver o setor por outros olhos</div>
        <div class="card-s" style="margin:3px 0 0">Somente leitura — nada aqui grava em nome de ninguém.</div>
      </div>
      <button class="ov-x" data-fechar="1" title="Fechar">×</button>
    </div>
    <div class="vc-lab">VISÕES GENÉRICAS — A CARA DE CADA ACESSO</div>
    <div class="vc-gen">${GENERICAS.map((g) => `<button class="vc-op ${COMO === g.id ? "on" : ""}"
      data-vc="${esc(g.id)}">${esc(g.rot)}<small>${esc(g.det)}</small></button>`).join("")}</div>
    <div class="vc-lab">PESSOA DO SETOR</div>
    <input id="vcBusca" placeholder="Procurar por nome ou e-mail…" autocomplete="off"
      oninput="VC.busca=this.value;renderVcLista()" onkeydown="vcTecla(event)">
    <div class="vc-abas" id="vcAbas"></div>
    <div class="vc-lista" id="vcLista"></div>
  </div>`;
  ov.classList.remove("hide");
  // um só ouvinte para a janela inteira: fundo fecha, opção escolhe, aba filtra
  ov.onclick = (ev) => {
    if (ev.target === ov || ev.target.closest("[data-fechar]")) return fecharVerComo();
    const op = ev.target.closest("[data-vc]");
    if (op) { fecharVerComo(); verComo(op.dataset.vc); return; }
    const aba = ev.target.closest("[data-aba]");
    if (aba) { VC.aba = aba.dataset.aba; renderVcAbas(); renderVcLista(); }
  };
  document.addEventListener("keydown", vcEscapa);
  renderVcAbas(); renderVcLista();
  $("vcBusca").focus();
}

function fecharVerComo() {
  $("ovComo").classList.add("hide");
  document.removeEventListener("keydown", vcEscapa);
}
const vcEscapa = (ev) => { if (ev.key === "Escape") fecharVerComo(); };
/* Enter na busca leva ao primeiro da lista: achou digitando, não precisa
   tirar a mão do teclado para clicar. */
function vcTecla(ev) {
  if (ev.key !== "Enter") return;
  ev.preventDefault();
  const p = $("vcLista").querySelector("[data-vc]");
  if (p) { fecharVerComo(); verComo(p.dataset.vc); }
}

function renderVcAbas() {
  const gente = vcPessoas();
  const conta = (k) => (k === "todos" ? gente.length : gente.filter((p) => p.papeis.includes(k)).length);
  $("vcAbas").innerHTML = [["todos", "Todos"], ["orientador", "Professores"],
    ["aluno", "Alunos"], ["avaliador", "Avaliadores"]]
    .map(([k, rot]) => `<button class="vc-aba ${VC.aba === k ? "on" : ""}" data-aba="${k}">${rot} ${conta(k)}</button>`)
    .join("");
}

function renderVcLista() {
  const busca = semAcento(VC.busca).trim();
  const gente = vcPessoas()
    .filter((p) => VC.aba === "todos" || p.papeis.includes(VC.aba))
    .filter((p) => !busca || semAcento(`${p.nome || ""} ${p.email || ""}`).includes(busca));
  $("vcLista").innerHTML = gente.length ? gente.map((p) => {
    const nome = p.nome || p.email || p.id;
    const ini = nome.trim().split(/\s+/).slice(0, 2).map((x) => x[0] || "").join("").toUpperCase() || "?";
    const det = p.semConta ? "ainda sem conta — o vínculo é pelo CPF" : (p.email || "—");
    const tags = p.papeis.map((k) => `<span class="vc-tag ${PAPEL_VC[k].cls}">${PAPEL_VC[k].rot}${
      p.contagem[k] > 1 ? ` ${p.contagem[k]}` : ""}</span>`).join("");
    return `<button class="vc-p ${COMO === p.id ? "on" : ""}" data-vc="${esc(p.id)}">
      <span class="vc-ini">${esc(ini)}</span>
      <span style="min-width:0;flex:1">
        <span class="nm">${esc(nome)}</span>
        <span class="dt">${esc(det)}</span></span>
      <span class="tags">${tags}</span></button>`;
  }).join("") : `<div class="vc-vazio">Ninguém encontrado${VC.busca ? ` com “${esc(VC.busca)}”` : " neste grupo"}.</div>`;
}

const rotuloPerfil = () => META.gestao ? "coordenação de pesquisa"
  : ehAluno() ? "aluno de IC" : ehAvaliador() ? "avaliador ad hoc"
  : META.perfil === "em" ? "bolsista do Ensino Médio" : "orientação";

function faixaVerComo() {
  if (!COMO) return "";
  if (COMO.startsWith("perfil:")) {
    const g = GENERICAS.find((x) => x.id === COMO);
    return `<div class="banner ba-warn" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span>Você está vendo o setor como <b>${esc(g?.faixa || "um perfil genérico")}</b> —
        é a cara do acesso, não os dados de alguém. Somente leitura.</span>
      <button class="bt bt-ghost" style="margin-left:auto" onclick="verComo('')">Voltar a ver como gestor</button>
    </div>`;
  }
  const quem = vcPessoas().find((p) => p.id === COMO);
  return `<div class="banner ba-warn" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span>Você está vendo o setor como <b>${esc(quem?.nome || COMO)}</b>
      (${esc(rotuloPerfil())})${quem?.semConta ? " — pessoa ainda sem conta: é o que ela encontrará ao se cadastrar com o CPF" : ""}
      — somente leitura, nada aqui grava em nome dela.</span>
    <button class="bt bt-ghost" style="margin-left:auto" onclick="verComo('')">Voltar a ver como coordenação</button>
  </div>`;
}

/* A troca é tudo ou nada: se a busca falhar no meio, a tela voltava a dizer
   "você está vendo como fulano" com os dados de outra pessoa na frente. COMO
   precisa valer DURANTE as buscas (é ele que vai no ?como=), mas só se
   consolida quando as duas voltam. */
async function verComo(email) {
  const anterior = COMO;
  COMO = email || "";
  let meta;
  try {
    meta = await api("/api/ic/meta");
    await carregar();
  } catch (e) {
    COMO = anterior;              // nada mudou: a tela segue coerente
    aviso(e.message, "err");
    return;                       // sem META nova não há tela a remontar
  }
  META = meta;
  if (COMO) sessionStorage.setItem("arche-ic-como", COMO); else sessionStorage.removeItem("arche-ic-como");
  montarSidebar(); montarVerComo();
  // a seção em que se estava pode não existir para a outra pessoa
  const vale = SECOES.filter((x) => !x.perfis || x.perfis.includes(META.perfil)).map((x) => x.id);
  nav(vale.includes(SECAO) ? SECAO : (vale[0] || "painel"));
}

function nav(secao, modo) {
  SECAO = secao;
  // a inclusão manual vale só para o formulário aberto por ela
  MANUAL = secao === "submissao" && modo === "manual";
  for (const b of document.querySelectorAll(".side-item")) b.classList.toggle("on", b.dataset.s === secao);
  for (const v of ["painel", "submissao", "gestao", "meusprojetos", "bolsa", "avaliacao", "classificacao", "bolsas", "editais", "bolsistas", "em", "meuem", "cronograma", "relatorios", "certificados", "projeto"]) $("v-" + v).classList.add("hide");
  // submissão e projeto compartilham o editor (mesmos ids): a seção que sai
  // do ar é esvaziada, senão getElementById acha os campos escondidos
  for (const v of ["submissao", "projeto"]) if (v !== secao) $("v-" + v).innerHTML = "";

  const [t, s] = TITULOS[secao] || ["", ""];
  $("titulo").textContent = t; $("subtitulo").textContent = s; $("crumb").textContent = t;
  $("aviso").innerHTML = faixaVerComo();

  if (secao === "painel") renderPainel();
  if (secao === "submissao") {
    ATUAL = novoProjeto();
    PODE = { podeEditar: true, podeGerir: true, papel: MANUAL ? "gestao" : "orientador" };
    if (MANUAL) {
      $("titulo").textContent = "Inclusão de projeto pela coordenação";
      $("crumb").textContent = "Inclusão pela coordenação";
      $("subtitulo").textContent = "Projeto de outro professor, com pedido fora do prazo deferido pela pró-reitoria.";
    }
    renderEditor("v-submissao");
  }
  if (secao === "gestao") renderGestao();
  if (secao === "meusprojetos") renderMeusProjetos();
  if (secao === "bolsa") renderMinhaBolsa();
  if (secao === "avaliacao") renderAvaliacao();
  if (secao === "classificacao") renderClassificacao();
  if (secao === "bolsistas") renderBolsistas();
  if (secao === "em") renderEM();
  if (secao === "meuem") renderMeuEM();
  if (secao === "editais") renderEditais();
  if (secao === "cronograma") renderCronograma();
  if (secao === "relatorios") renderRelatorios();
  if (secao === "bolsas") renderBolsas();
  if (secao === "certificados") renderCertificados();
  $("v-" + secao).classList.remove("hide");
  window.scrollTo(0, 0);
}

/* -------------------------------- dados -------------------------------- */
async function carregar() {
  const [lista, crono, rel] = await Promise.all([
    api("/api/ic"), api("/api/ic/cronograma"), api("/api/ic/relatorios"),
  ]);
  PROJETOS = lista.projetos || [];
  ETAPAS = crono.etapas || [];
  RELS = { relatorios: rel.relatorios || [], pendentes: rel.pendentes || [] };
}

async function abrir(id) {
  try {
    // guarda de onde se veio, para o "Retornar" voltar à lista certa —
    // salvar reabre o projeto (SECAO já é "projeto") e a origem não muda
    if (SECAO && SECAO !== "projeto" && SECAO !== "submissao") ORIGEM_LISTA = SECAO;
    const r = await api("/api/ic/" + id);
    ATUAL = r.projeto; PODE = r;
    // NP/CL/total vem ao lado do projeto (derivado, não gravado)
    if (r.classificacao !== undefined) ATUAL.classificacao = r.classificacao;
    nav("projeto");
    $("crumb").textContent = ATUAL.numero || "Projeto";
    $("titulo").textContent = ATUAL.numero || "Projeto";
    $("subtitulo").textContent = ATUAL.titulo || "";
    renderEditor("v-projeto");
  } catch (e) { aviso(e.message, "err"); }
}

function novoProjeto() {
  return {
    titulo: "", resumo: "", palavrasChave: "", curso: "", modalidade: "pibic", edital: "",
    linhaPesquisa: "", objetivos: "", metodologia: "", inicio: "", fim: "",
    // na inclusão manual quem orienta é outra pessoa: os campos nascem vazios
    orientador: MANUAL ? { nome: "", email: "", cpf: "", titulacao: "" }
      : { nome: ME?.perfil?.nome || ME?.nome || "", email: ME?.email || "", titulacao: "" },
    alunos: [], cronograma: [], relatorios: [], status: "rascunho",
    // a planilha de produção é da PESSOA: a nova submissão do professor já
    // abre com a da última vez (na inclusão manual, quem preenche é a busca
    // pelo CPF/e-mail de quem orienta — buscarProducaoDoProfessor)
    producao: MANUAL ? {} : { ...(META.producaoAnterior || {}) },
    ...(MANUAL ? { inclusaoManual: { motivo: "" } } : {}),
  };
}

/** A coordenação abre a submissão em nome de quem orienta. */
function incluirManualmente() {
  nav("submissao", "manual");
}

/* -------------------------------- painel ------------------------------- */
function renderPainel() {
  // o Painel é do CICLO VIGENTE: o arquivo dos editais anteriores não entra
  // aqui — ele vive nas guias Gestão, Projetos e Bolsistas, atrás do filtro
  // de ciclo
  const vigente = META.edital?.numero || "";
  const meus = PROJETOS.filter((p) => (p.edital || vigente) === vigente);
  const idsCiclo = new Set(meus.map((p) => p.id));
  const etapasCiclo = ETAPAS.filter((e) => idsCiclo.has(e.projetoId));
  const cont = (s) => meus.filter((p) => p.status === s).length;
  const atrasadas = etapasCiclo.filter((e) => e.situacao !== "concluida" && e.fim && e.fim < hojeISO());
  const aValidar = RELS.relatorios.filter((r) => r.podeValidar);
  const minhasPendencias = RELS.pendentes;

  const aDarParecer = meus.filter((p) => p.aDarParecer);
  const kpis = ehAluno()
    ? [["Projetos", meus.length, "em que você foi indicado"],
       ["Atividades", etapasCiclo.length, "no seu plano de trabalho"],
       ["Em atraso", atrasadas.length, "atividades vencidas"],
       ["Relatórios a enviar", minhasPendencias.length, "parciais e finais"]]
    : ehAvaliador()
      ? [["Designados a você", meus.length, "projetos da seleção"],
         ["Parecer pendente", aDarParecer.length, "aguardando você"],
         ["Pareceres entregues", meus.filter((p) => p.meuParecer?.situacao === "entregue").length, "já respondidos"],
         ["Recusados", meus.filter((p) => p.meuParecer?.situacao === "recusado").length, "por impedimento"]]
      : META.gestao
        ? [["Em avaliação", cont("submetido"), "aguardando a PROPPEX"],
           ["Em execução", cont("aprovado"), "projetos aprovados"],
           ["Relatórios em atraso", meus.filter((p) => p.prazoRelatorios?.atrasado).length, "projetos fora do prazo"],
           ["Relatórios a validar", aValidar.length, "enviados pelos alunos"]]
        : [["Em avaliação", cont("submetido"), "aguardando a PROPPEX"],
           ["Em execução", cont("aprovado"), "projetos aprovados"],
           ["Atividades em atraso", atrasadas.length, "no cronograma"],
           ["Relatórios a validar", aValidar.length, "enviados pelos alunos"]];

  const foraDoPrazo = META.gestao ? meus.filter((p) => p.prazoRelatorios?.atrasado) : [];

  // Avaliação do ciclo (só a gestão): quantos projetos do edital vigente já
  // têm decisão — e, com todos avaliados, os botões de publicação do
  // resultado, na ordem do processo: preliminar (só os aprovados, para
  // definir as bolsas com a presidência) e depois o final (com a bolsa).
  const cicloAval = META.gestao ? (() => {
    const doCiclo = meus.filter((p) => p.status !== "rascunho" && p.status !== "devolvido");
    const avaliados = doCiclo.filter((p) => ["aprovado", "reprovado", "concluido"].includes(p.status));
    const fase = ((META.editais || []).find((e) => e.numero === vigente) || {}).resultadoFase || null;
    const completo = doCiclo.length > 0 && avaliados.length === doCiclo.length;
    const semBolsa = doCiclo.filter((p) => ["aprovado", "concluido"].includes(p.status) && !p.fomento).length;
    const pct = doCiclo.length ? Math.round((avaliados.length / doCiclo.length) * 100) : 0;
    return `<div class="card">
      <div class="card-t">Avaliação do ciclo — Edital ${esc(vigente)}</div>
      <div class="card-s"><b>${avaliados.length}</b> de <b>${doCiclo.length}</b> projeto(s) avaliado(s) (${pct}%).</div>
      <div style="height:8px;border-radius:6px;background:var(--wash2);overflow:hidden;margin:8px 0 14px">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--brand-2),var(--accent))"></div></div>
      ${fase ? `<div class="banner ${fase === "final" ? "ba-ok" : "ba-warn"}" style="margin:0 0 12px">
        ${fase === "final"
          ? "<b>Resultado final publicado</b> — com a bolsa concedida a cada projeto."
          : `<b>Resultado preliminar publicado</b> — só os aprovados, ainda sem as bolsas. ${semBolsa
            ? `${semBolsa} aprovado(s) aguardando a decisão de fomento para o resultado final.`
            : "Todos os aprovados já têm decisão de fomento — o resultado final pode ser publicado."}`}</div>` : ""}
      ${completo || fase ? `<div style="display:flex;gap:10px;flex-wrap:wrap">
          ${!fase ? `<button class="bt bt-pri" onclick="publicarResultado('${esc(vigente)}','preliminar')">📢 Publicar resultado preliminar</button>` : ""}
          ${fase !== "final" ? `<button class="bt ${fase === "preliminar" ? "bt-pri" : "bt-sec"}" onclick="publicarResultado('${esc(vigente)}','final')">🏁 Publicar resultado final</button>` : ""}
          ${fase ? `<button class="bt bt-ghost" onclick="publicarResultado('${esc(vigente)}', null)">Recolher publicação</button>` : ""}
        </div>`
        : `<div style="font-size:13px;color:var(--muted)">Quando todos os projetos do ciclo estiverem avaliados, os botões de
          publicação aparecem aqui: primeiro o <b>resultado preliminar</b> (só os aprovados, para definir as bolsas com a
          presidência) e, distribuídas as bolsas, o <b>resultado final</b>.</div>`}
    </div>`;
  })() : "";

  $("v-painel").innerHTML = `
    <div class="kpis">${kpis.map(([l, v, d]) => `
      <div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("")}
    </div>

    ${cicloAval}
    ${quadroUsuarios()}
    ${panoramaDoCiclo(meus)}

    ${(() => {
      // o aluno recém-convidado não sabe o que o sistema espera dele: o
      // cadastro do contrato é a primeira coisa que aparece
      if (!ehAluno()) return "";
      const pendentes = meusProjetos().filter((p) => {
        const eu = meuRegistro(p);
        return eu?.bolsista && p.fomento && p.fomento.tipo !== "voluntario" && !cadastroCompletoLocal(eu);
      });
      if (!pendentes.length) return "";
      return `<div class="banner ba-warn"><b>Falta o seu cadastro para o contrato da bolsa.</b>
        A PROPPEX precisa dos seus documentos, endereço e dados bancários para efetivar o pagamento.
        <button class="bt bt-pri" style="margin-left:8px" onclick="nav('bolsa')">Preencher agora</button></div>`;
    })()}

    ${META.gestao && foraDoPrazo.length ? `<div class="banner ba-warn"><b>Relatórios em atraso</b> —
      ${foraDoPrazo.length} projeto(s) fora do prazo do edital:
      ${foraDoPrazo.slice(0, 8).map((p) => `<a href="#" onclick="abrir('${esc(p.id)}');return false">${esc(p.numero || p.titulo)}</a>`).join(" · ")}${foraDoPrazo.length > 8 ? " · …" : ""}
      — a lista completa está na guia Relatórios.</div>` : ""}

    ${!meus.length ? `<div class="card"><div class="card-t">Comece por aqui</div>
      <div class="card-s">${ehAluno()
        ? "Você ainda não foi indicado em nenhum projeto. Quem orienta faz a indicação pelo seu e-mail."
        : ehAvaliador()
          ? "Nenhum projeto designado a você. A coordenação designa os avaliadores dentro de cada projeto."
          : "Nenhum projeto ainda. A submissão abre o rascunho, que você preenche no seu tempo."}</div>
      ${ehAluno() || ehAvaliador() ? "" : `<button class="bt bt-pri" onclick="nav('submissao')">＋ Submeter projeto</button>`}</div>` : ""}

    <div class="duplo">
      <div class="card">
        <div class="card-t">Projetos</div>
        <div class="card-s">${meus.length} projeto(s) do ciclo ${esc(vigente)} — o arquivo dos
          editais anteriores está na guia Gestão, no filtro de ciclo.</div>
        ${meus.slice(0, 6).map((p) => `
          <div class="linha" style="cursor:pointer" onclick="abrir('${esc(p.id)}')">
            <div class="txt">
              <div class="p1">${esc(p.titulo || "(sem título)")}</div>
              <div class="p2">${esc(p.numero || "sem número")} · ${esc(cursoNome(p.curso))} · ${esc(modNome(p.modalidade))}</div>
            </div>${chip(p.status)}
          </div>`).join("") || `<div class="vazio">Nada por aqui ainda.</div>`}
        ${meus.length > 6 ? `<div style="margin-top:10px"><button class="bt bt-ghost" onclick="nav('gestao')">Ver todos</button></div>` : ""}
      </div>

      <div class="card">
        <div class="card-t">Próximas atividades</div>
        <div class="card-s">Do cronograma, a partir de hoje.</div>
        ${etapasCiclo.filter((e) => e.situacao !== "concluida").slice(0, 7).map((e) => `
          <div class="linha">
            <div class="txt">
              <div class="p1">${esc(e.atividade)}</div>
              <div class="p2">${esc(e.numero || "—")} · ${esc(e.responsavelNome)} · até ${fmtD(e.fim)}</div>
            </div>
            ${e.fim && e.fim < hojeISO() ? `<span class="badge b-atrasada">atrasada</span>` : chip2(e.situacao)}
          </div>`).join("") || `<div class="vazio">Sem atividades pendentes.</div>`}
      </div>
    </div>

    ${aValidar.length ? `<div class="card">
      <div class="card-t">Relatórios aguardando sua validação</div>
      <div class="card-s">Enviados pelos alunos indicados.</div>
      ${aValidar.map((r) => `<div class="linha" style="cursor:pointer" onclick="abrir('${esc(r.projetoId)}')">
        <div class="txt"><div class="p1">${esc(r.alunoNome)} — relatório ${esc(r.tipo)}</div>
        <div class="p2">${esc(r.numero || "")} · enviado em ${fmtDH(r.enviadoEm)}</div></div>
        <span class="badge b-enviado">a validar</span></div>`).join("")}
    </div>` : ""}`;
}
const chip2 = (s) => `<span class="badge b-${esc(s)}">${esc({ prevista: "prevista", andamento: "em andamento", concluida: "concluída" }[s] || s)}</span>`;

/* ------------------------- usuários do portal --------------------------- */
/* Quantas contas o ARCHÉ conhece, quantas já podem entrar e quantas
   completaram o próprio cadastro. É número do PORTAL inteiro, não da IC —
   por isso vem de rota própria e só para o gestor geral, que é quem
   responde pela gestão de acessos. Contagens apenas: nenhum nome, nenhum
   e-mail sai por aqui. */
function quadroUsuarios() {
  if (ME?.papel !== "gestor") return "";
  const u = USUARIOS;
  const pct = (n) => (u && u.total ? Math.round((n / u.total) * 100) : 0);
  return `<div class="card">
    <div class="card-t">Usuários do portal</div>
    <div class="card-s">Todas as contas que o ARCHÉ conhece — dos quatro setores, não só da IC.
      ${u ? `<a href="/usuarios/">Abrir a gestão de acessos</a>` : ""}</div>
    ${!u ? `<div class="vazio">Contando…</div>` : `
    <div class="kpis" style="margin-bottom:0">
      <div class="kpi"><div class="l">Usuários cadastrados</div>
        <div class="v">${u.total}</div>
        <div class="d">perfis, papéis e quem aparece nos registros</div></div>
      <div class="kpi"><div class="l">Com acesso ao sistema</div>
        <div class="v" style="color:var(--ok)">${u.comAcesso}</div>
        <div class="d" style="color:${u.pendentes ? "var(--warn)" : "var(--muted)"}">${pct(u.comAcesso)}% do total${
          u.pendentes ? ` · ${u.pendentes} aguardando aprovação` : ""}</div></div>
      <div class="kpi"><div class="l">Com perfil completo</div>
        <div class="v">${u.perfilCompleto}</div>
        <div class="d" style="color:${u.perfilCompleto === u.total ? "var(--ok)" : "var(--warn)"}">${pct(u.perfilCompleto)}% do total${
          u.perfilIniciado > u.perfilCompleto ? ` · ${u.perfilIniciado - u.perfilCompleto} preencheram só em parte` : ""}</div></div>
      <div class="kpi"><div class="l">Prontos para usar</div>
        <div class="v">${u.prontos}</div>
        <div class="d">com acesso <b>e</b> cadastro completo</div></div>
    </div>`}
  </div>`;
}

async function carregarUsuariosDoPortal() {
  if (ME?.papel !== "gestor" || USUARIOS) return;
  try {
    USUARIOS = await api("/api/usuarios/resumo");
    if (SECAO === "painel") renderPainel();
  } catch { /* sem o resumo o painel segue igual — é um quadro a mais */ }
}


/* --------------------- ICEM — Iniciação Científica EM ------------------- */
/* OUTRO programa: o bolsista do Ensino Médio ACOMPANHA projetos (e troca ao
   longo do ano) para conhecer os cursos, a ciência e o UNIEGO. Quem conduz
   é a coordenação — o aluno é menor e não tem conta no portal. A guia é o
   posto de trabalho disso: bolsas 12+12, projeto acompanhado com a
   trajetória, relatório simplificado e CONINT. */
let EM = null, TURMA_EM = "";

async function renderEM() {
  const el = $("v-em");
  if (!EM) {
    el.innerHTML = '<div class="card"><div class="vazio">Carregando o programa…</div></div>';
    try { EM = await api("/api/ic/em"); }
    catch (e) { el.innerHTML = `<div class="banner ba-err">${esc(e.message)}</div>`; return; }
  }
  const turmas = (EM.turmas || []).slice().reverse();
  if (!TURMA_EM || !turmas.some((t) => t.ciclo === TURMA_EM)) {
    TURMA_EM = (turmas.find((t) => !t.encerrada) || turmas[0] || {}).ciclo || "";
  }
  const turma = turmas.find((t) => t.ciclo === TURMA_EM) || {};

        ${passados.map((e) => `<div class="kv muted">• ${esc(e.numero || "")} ${esc(e.titulo.slice(0, 70))} · ${fmtD(e.de)} → ${fmtD(e.ate)}</div>`).join("")}

          ${b.relatorio?.situacao === "entregue" ? "✓ Relatório entregue — reabrir" : "Registrar relatório simplificado"}</button>
        <button class="bt bt-ghost" onclick="emConint('${esc(b.id)}',${b.conint?.participou ? "false" : "true"})">

  el.innerHTML = `

async function emAcao(caminho, corpo, msg) {
  try {
    await api(caminho, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    EM = null; await renderEM();
    if (msg) aviso(msg);
  } catch (e) { aviso(e.message, "err"); EM = null; renderEM(); }
}
const emBolsa = (id, bolsa) => emAcao(`/api/ic/em/${id}/bolsa`, { bolsa },
  bolsa ? "Bolsa atribuída." : "Bolsa desfeita.");
const emProjeto = (id, projetoId) => emAcao(`/api/ic/em/${id}/projeto`, { projetoId },
  projetoId ? "Acompanhamento registrado — a trajetória guarda o anterior." : "Acompanhamento encerrado.");
const emRelatorio = (id, situacao) => emAcao(`/api/ic/em/${id}/relatorio`, { situacao },
  situacao === "entregue" ? "Relatório simplificado registrado." : "Relatório reaberto.");
const emConint = (id, participou) => emAcao(`/api/ic/em/${id}/conint`, { participou, ano: String(new Date().getFullYear()) },
  participou ? "Participação no CONINT registrada." : "Registro desfeito.");

/* O convite por e-mail da turma: simula primeiro (quem recebe, quem já foi
   convidado, quem está sem e-mail) e só envia com a confirmação. */
async function emConvidar() {
  try {
    const s = await api("/api/ic/em/convidar", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ turma: TURMA_EM, simular: true }) });
    if (!s.convidar.length && !s.jaConvidados) return aviso("Nenhum bolsista com e-mail nesta turma.", "err");
    const reenviar = !s.convidar.length && s.jaConvidados
      ? confirm(`Todos os ${s.jaConvidados} bolsista(s) com e-mail da turma ${TURMA_EM} já foram convidados.\n\nReenviar o convite a todos?`)
      : false;
    if (!reenviar) {
      if (!s.convidar.length) return;
      const ok = confirm(`Convidar ${s.convidar.length} bolsista(s) da turma ${TURMA_EM} por e-mail?\n\n`
        + s.convidar.map((x) => `• ${x.nome} — ${x.email}`).join("\n")
        + (s.jaConvidados ? `\n\n(${s.jaConvidados} já convidado(s) não recebem de novo)` : "")
        + (s.semEmail.length ? `\n\nSem e-mail (não recebem): ${s.semEmail.join(", ")}` : ""));
      if (!ok) return;
    }
    const r = await api("/api/ic/em/convidar", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ turma: TURMA_EM, reenviar }) });
    aviso(`Convite enviado a ${r.enviados} bolsista(s).${r.falhas.length ? " Falhas: " + r.falhas.join("; ") : ""}`,
      r.falhas.length ? "err" : undefined);
  } catch (e) { aviso(e.message, "err"); }
}

let FILTRO_CURSO_EM = "";
async function meuEmEscolher(id) {

async function meuEmRelatorio(id) {

/* ------------------------- panorama do ciclo ---------------------------- */
/* O que a coordenação precisa acompanhar sem abrir projeto por projeto:
   quem já indicou aluno, quantos alunos já completaram o cadastro do
   contrato, e como o edital se distribui por curso, titulação e linha.

   Os gráficos são barras de UMA COR só: o que se compara aqui é tamanho, e
   quem diz "quem é" é o rótulo da linha. Cor por categoria obrigaria a
   consultar uma legenda para ler o próprio gráfico, sem dizer nada a mais. */
const barras = (itens, { unidade = "" } = {}) => {
  if (!itens.length) return `<div class="vazio">Sem dados neste ciclo.</div>`;
  const max = Math.max(1, ...itens.map((i) => i.valor));
  const total = itens.reduce((s, i) => s + i.valor, 0);
  return `<div class="barras">${itens.map((i) => {
    const pct = total ? Math.round((i.valor / total) * 100) : 0;
    return `<div class="barra" title="${esc(i.rot)}: ${i.valor}${unidade ? " " + unidade : ""}${total ? ` — ${pct}% do total` : ""}">
      <div class="rot">${esc(i.rot)}</div>
      <div class="trilho"><div class="fill" style="width:${Math.round((i.valor / max) * 100)}%"></div></div>
      <div class="val">${i.valor}${total ? `<span>${pct}%</span>` : ""}</div>
    </div>`;
  }).join("")}</div>`;
};

// a pessoa que orienta, como chave: e-mail quando há, nome quando não
const chaveProf = (p) => String(p.orientador?.email || p.orientador?.nome || "").toLowerCase();

function panoramaDoCiclo(meus) {
  if (!META.gestao) return "";
  const doCiclo = meus.filter((p) => p.status !== "rascunho");
  if (!doCiclo.length) return "";
  const emExecucao = doCiclo.filter((p) => ["aprovado", "concluido"].includes(p.status));

  /* --- indicação e cadastro: o acompanhamento pedido pela pró-reitoria --- */
  const profsAprovados = new Set(emExecucao.map(chaveProf).filter(Boolean));
  const profsQueIndicaram = new Set(emExecucao.filter((p) => (p.alunos || []).length).map(chaveProf).filter(Boolean));
  const alunos = emExecucao.flatMap((p) => p.alunos || []);
  const completos = alunos.filter((a) => a.dadosCompletos ?? cadastroCompletoLocal(a));
  const semEmail = alunos.filter((a) => !a.email);
  const bolsistas = alunos.filter((a) => a.bolsista);
  const pctInd = profsAprovados.size ? Math.round((profsQueIndicaram.size / profsAprovados.size) * 100) : 0;
  const pctCad = alunos.length ? Math.round((completos.length / alunos.length) * 100) : 0;

  /* ------------------------ distribuições do edital ---------------------- */
  const contar = (lista, chave) => {
    const m = new Map();
    for (const x of lista) { const k = chave(x); if (!k) continue; m.set(k, (m.get(k) || 0) + 1); }
    return [...m.entries()].map(([rot, valor]) => ({ rot, valor })).sort((a, b) => b.valor - a.valor);
  };
  const porCurso = contar(doCiclo, (p) => cursoNome(p.curso));
  const porLinha = contar(doCiclo, (p) => linhaNome(p.linha));
  const porStatus = contar(doCiclo, (p) => META.rotulos[p.status] || p.status);
  // titulação conta PESSOAS, não projetos: quem submete dois planos é um
  // professor só, e o quadro é sobre o corpo docente do edital
  const profs = new Map();
  for (const p of doCiclo) {
    const k = chaveProf(p); if (!k || profs.has(k)) continue;
    profs.set(k, titulacaoCodigo(p.orientador?.titulacao));
  }
  const rotTit = { doutor: "Doutores", mestre: "Mestres", especialista: "Especialistas", "": "Não informada" };
  const porTitulacao = ["doutor", "mestre", "especialista", ""]

          <div class="d" style="color:${alunos.length && pctCad === 100 ? "var(--ok)" : "var(--warn)"}">${pctCad}% completaram os próprios dados</div></div>

/* ----------------------------- certificados ---------------------------- */
/* Participação (aluno) e orientação (um por aluno orientado), dos ciclos
   CONCLUÍDOS. A lista vem do servidor casada pelo CPF — é o que reúne, numa
   conta só, quem participou de mais de uma edição — com o e-mail como
   segunda chave. */
let CERTS = null;
async function renderCertificados() {
  $("v-certificados").innerHTML = `<div class="card"><div class="vazio">Carregando…</div></div>`;
  try { CERTS = await api("/api/ic/certificados"); }
  catch (e) { $("v-certificados").innerHTML = `<div class="banner ba-err">${esc(e.message)}</div>`; return; }

  const meus = CERTS.certificados || [];
  const porEdital = new Map();
  for (const c of meus) {
    if (!porEdital.has(c.edital)) porEdital.set(c.edital, []);
    porEdital.get(c.edital).push(c);
  }
  const cartao = (c) => `
    <div class="linha">
      <div class="txt">
        <div class="p1">${c.tipo === "orientacao" ? `Orientação — ${esc(c.aluno || "")}` : "Participação em Iniciação Científica"}</div>
        <div class="p2">${esc(c.numero || "—")} · ${esc(c.titulo || "")}${c.tipo === "orientacao" ? "" : ` · orientação: ${esc(c.orientador || "—")}`}
          ${c.modalidade ? ` · ${esc(c.modalidade)}` : c.bolsista ? " · bolsista" : ""}</div>
      </div>
      <a class="bt bt-pri" href="${comQuem(`/api/ic/certificado.pdf?codigo=${encodeURIComponent(c.codigo)}`)}"
        target="_blank" rel="noopener">📜 Baixar</a>
    </div>`;

  $("v-certificados").innerHTML = `
    ${!CERTS.temCpf ? `<div class="banner ba-warn"><b>Informe o seu CPF no
      <a href="/perfil/" target="_blank" rel="noopener">perfil</a></b> — é ele que reúne aqui os
      certificados de todas as edições em que você participou. Sem o CPF, só aparecem os ciclos
      ligados a este e-mail.</div>` : ""}

    ${META.gestao && !CERTS.simulando ? renderAssinaturas() : ""}
    ${META.gestao && !CERTS.simulando ? renderAvisoCertificados() : ""}

    ${meus.length ? [...porEdital].map(([edital, lista]) => `<div class="card">
        <div class="card-t">Edital ${esc(edital)}</div>
        <div class="card-s">${lista.length} certificado(s) — o documento sai com o timbre da época.</div>
        ${lista.map(cartao).join("")}
      </div>`).join("")
    : `<div class="card"><div class="card-t">Nenhum certificado ainda</div>
        <div class="card-s">Os certificados saem quando o ciclo é concluído. Se você participou de
        edições anteriores e nada aparece aqui, confira o CPF no seu perfil — é por ele que o
        sistema encontra a sua participação.</div></div>`}`;
}

/* Só o gestor geral: a assinatura digitalizada que sai NO CERTIFICADO. Fica
   guardada no sistema (não no repositório) — em produção o disco é efêmero,
   e trocar de reitor não pode depender de um deploy. */
function renderAssinaturas() {
  const a = CERTS?.assinaturas || {};
  const cartao = (quem, rotulo, nome) => {
    const tem = a[quem];
    return `<div class="linha">
      <div class="txt">
        <div class="p1">${rotulo} — ${esc(nome)}</div>
        <div class="p2">${tem
          ? `enviada em ${fmtDH(tem.em)}${tem.arquivo ? ` · ${esc(tem.arquivo)}` : ""}`
          : "nenhuma imagem enviada — o certificado sai com a linha em branco"}</div>
      </div>
      ${tem ? `<img src="/api/ic/assinatura/${quem}?t=${Date.now()}" alt="assinatura"
        style="height:38px;max-width:150px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px">` : ""}
      <label class="bt bt-sec" style="cursor:pointer;margin:0">
        ${tem ? "Trocar" : "Enviar"} imagem
        <input type="file" accept="image/png,image/jpeg" style="display:none"
          onchange="enviarAssinatura('${quem}', this)">
      </label>
      ${tem ? `<button class="bt bt-err" onclick="removerAssinatura('${quem}')">✕</button>` : ""}
    </div>`;
  };
  return `<div class="card">
    <div class="card-t">Assinaturas do certificado</div>
    <div class="card-s">A imagem entra sobre a linha, no certificado — e só nele: proposta,
      relatório e resultado continuam saindo para assinatura à mão. Use <b>PNG com fundo
      transparente</b> e traço escuro (JPG funciona, mas o retângulo branco aparece). Até 2 MB.</div>
    ${cartao("proreitor", "Pró-Reitor", "Dr. Jadson Belem de Moura")}
    ${cartao("reitor", "Reitor", "Dr. José Mateus dos Santos")}
  </div>`;
}

async function enviarAssinatura(quem, input) {
  const file = input.files?.[0];
  if (!file) return;
  const fd = new FormData();
  fd.append("file", file); fd.append("quem", quem);
  try {
    const r = await fetch("/api/ic/assinatura", { method: "POST", body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Falha (${r.status})`);
    await renderCertificados();
    aviso("Assinatura enviada. Baixe um certificado para conferir como ficou.");
  } catch (e) { aviso(e.message, "err"); }
  input.value = "";
}

async function removerAssinatura(quem) {
  if (!confirm("Remover esta assinatura? O certificado volta a sair com a linha em branco.")) return;
  try {
    await api(`/api/ic/assinatura/${quem}`, { method: "DELETE" });
    await renderCertificados();
    aviso("Assinatura removida.");
  } catch (e) { aviso(e.message, "err"); }
}

/* Só a gestão: avisar por e-mail, ciclo a ciclo, que os certificados saíram. */
function renderAvisoCertificados() {
  const ciclos = CERTS?.ciclos || [];
  if (!ciclos.length) return "";
  return `<div class="card">
    <div class="card-t">Avisar que os certificados estão disponíveis</div>
    <div class="card-s">Um e-mail por pessoa, com o link para baixar. Quem não tem e-mail no
      sistema não recebe — e o número aparece aqui, para você saber o tamanho da lacuna.</div>
    ${ciclos.map((c) => `<div class="linha">
      <div class="txt">
        <div class="p1">Edital ${esc(c.edital)}</div>
        <div class="p2">${c.total} certificado(s) · ${c.avisaveis} pessoa(s) com e-mail${
          c.semEmail ? ` · <b style="color:var(--warn)">${c.semEmail} sem e-mail</b>` : ""}</div>
      </div>
      <button class="bt bt-sec" ${c.avisaveis ? "" : "disabled"}
        onclick="avisarCertificados('${esc(c.edital)}')">📧 Avisar</button>
    </div>`).join("")}
  </div>`;
}

async function avisarCertificados(edital) {
  const post = (corpo) => api("/api/ic/certificados/avisar", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  try {
    const s = await post({ edital, simular: true });
    if (!s.destinatarios.length) return aviso("Ninguém com e-mail cadastrado neste ciclo.", "warn");
    const li = s.destinatarios.slice(0, 8).map((d) => `• ${d.nome || d.email} — ${d.certificados} certificado(s)`).join("\n");
    if (!confirm(`Avisar ${s.destinatarios.length} pessoa(s) do Edital ${edital}?\n\n${li}`
      + `${s.destinatarios.length > 8 ? `\n… e mais ${s.destinatarios.length - 8}` : ""}`
      + `${s.semEmail ? `\n\n${s.semEmail} certificado(s) sem e-mail — essas pessoas não recebem.` : ""}`)) return;
    const r = await post({ edital });
    aviso(`Aviso enviado a ${r.enviados.length} pessoa(s)${r.falhas.length ? ` — ${r.falhas.length} falhou(aram)` : ""}.`);
  } catch (e) { aviso(e.message, "err"); }
}

/* Exporta o que está na tela: a planilha (uma linha por projeto) e as
   fichas em PDF (uma por página). Os filtros vão junto — exportar a base
   inteira quando se está olhando um recorte seria surpresa ruim. */
function exportarProjetos(formato) {
  const q = new URLSearchParams();
  for (const [k, v] of Object.entries(FILTRO)) if (v) q.set(k, v);
  window.open(`/api/ic/projetos.${formato}?${q}`, "_blank", "noopener");
}

function limparFiltros() {
  FILTRO = { status: "", curso: "", linha: "", grupo: "", q: "", titulacao: "", bolsa: "",
    edital: META.edital?.numero || "__todos" };
  renderGestao();
}

function renderGestao() {
  // o ciclo em evidência é o ATUAL; os passados só aparecem se escolhidos
  if (!FILTRO.edital) FILTRO.edital = META.edital?.numero || "__todos";
  const lista = PROJETOS.filter((p) =>
    (!FILTRO.status || p.status === FILTRO.status) &&
    (!FILTRO.curso || p.curso === FILTRO.curso) &&
    (!FILTRO.linha || p.linha === FILTRO.linha) &&
    (!FILTRO.grupo
      || (FILTRO.grupo === "__com" && !!p.grupoPesquisa)
      || (FILTRO.grupo === "__sem" && !p.grupoPesquisa)
      || p.grupoPesquisa === FILTRO.grupo) &&
    (FILTRO.edital === "__todos" || (p.edital || META.edital?.numero) === FILTRO.edital) &&
    (!FILTRO.titulacao || titulacaoCodigo(p.orientador?.titulacao) === FILTRO.titulacao) &&
    // o recorte da bolsa lê a DECISÃO da seleção: "sem bolsa" são os
    // aprovados voluntários ou sem fomento — quem ainda espera decisão
    // (em avaliação) não entra em nenhum dos três

      .toLowerCase().includes(FILTRO.q.toLowerCase())));

  const filtroAtivo = FILTRO.status || FILTRO.curso || FILTRO.linha || FILTRO.grupo

      ${META.gestao ? `<button class="bt bt-ghost" onclick="baixarResultado()"
        title="Documento timbrado com o resultado do processo seletivo">📄 Resultado do processo (PDF)</button>` : ""}
      ${META.gestao ? `<button class="bt bt-ghost" onclick="convidarProfessores()"
        title="E-mail aos professores dos projetos importados que ainda não criaram o usuário — o CPF no perfil é o que vincula os projetos">📧 Convidar professores</button>` : ""}
      ${META.gestao ? `<button class="bt bt-ghost" onclick="exportarProjetos('xlsx')"
        title="Planilha com os projetos que estão na tela, com os filtros aplicados">📊 Exportar em Excel</button>` : ""}
      ${META.gestao ? `<button class="bt bt-ghost" onclick="exportarProjetos('pdf')"
        title="Ficha completa de cada projeto, uma por página — com os filtros aplicados">📄 Exportar em PDF</button>` : ""}
      ${ME?.papel === "gestor" ? `<button class="bt bt-ghost" onclick="importarEdital(true)" title="Confere o arquivo sem gravar">Importar edital 01/2026</button>` : ""}
    </div>

    <div class="painel-filtros">
      <input class="busca" placeholder="🔎 Buscar por número, título, orientação ou aluno" value="${esc(FILTRO.q)}"
        oninput="FILTRO.q=this.value;clearTimeout(window.__b);window.__b=setTimeout(renderGestao,250)">
      ${(META.editais || []).length > 1 ? `
      <select onchange="FILTRO.edital=this.value;renderGestao()" title="Ciclo (edital) a mostrar">
        ${(META.editais || []).map((e) => `<option value="${esc(e.numero)}" ${FILTRO.edital === e.numero ? "selected" : ""}>Ciclo ${esc(e.numero)}${e.vigente ? " — atual" : ""} · ${e.projetos} projeto(s)</option>`).join("")}
        <option value="__todos" ${FILTRO.edital === "__todos" ? "selected" : ""}>Todos os ciclos</option>
      </select>` : ""}
      <select onchange="FILTRO.status=this.value;renderGestao()">
        <option value="">Situação: todas</option>
        ${META.status.map((s) => `<option value="${s}" ${FILTRO.status === s ? "selected" : ""}>${esc(META.rotulos[s] || s)}</option>`).join("")}

      </select>
      <select onchange="FILTRO.bolsa=this.value;renderGestao()" title="Fomento decidido na seleção">

        <option value="uniego" ${FILTRO.bolsa === "uniego" ? "selected" : ""}>Com bolsa UNIEGO</option>

      ${filtroAtivo ? `<button class="bt bt-ghost" onclick="limparFiltros()" title="Volta ao ciclo vigente, sem recortes">✕ Limpar filtros</button>` : ""}

    <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">${lista.length} projeto(s)${

    ${lista.map((p) => `<div class="proj-linha">
      <div class="item" onclick="abrir('${esc(p.id)}')">
        <div style="flex:1;min-width:0">
          <div class="nm">${esc(p.titulo || "(sem título)")}</div>

        ${p.atrasadas ? `<span class="badge b-atrasada">${p.atrasadas} atrasada(s)</span>` : ""}
