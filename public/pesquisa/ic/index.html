let FILTRO_CURSO_EM = "";
/* SOLICITAR ALTERAÇÃO DE PROJETO (pedido do dono, ago/2026). Só aparece
   para quem JÁ acompanha um projeto: sem projeto, o que vale é a escolha
   direta ali em cima. A lista traz as TRÊS linhas do edital em execução
   (IC, IT e Iniciação à Extensão) — o servidor a monta em `paraTrocar`.
   Havendo pedido PENDENTE, o formulário dá lugar ao estado dele: dois
   pedidos ao mesmo tempo fariam a coordenação decidir duas vezes. */
const LINHA_ROT_EM = { ic: "Iniciação Científica", it: "Inovação Tecnológica", ie: "Iniciação à Extensão" };
function blocoPedidoProjetoEM(r) {
  // a mesma régua do bloco da escolha, logo acima: turma em curso e registro ativo
  const vigente = !r.turma?.encerrada && r.situacao === "ativo";
  if (!vigente || !r.projetoAtual) return "";
  const pedidos = r.pedidosProjeto || [];
  const pendente = pedidos.find((x) => x.situacao === "pendente");
  const decididos = pedidos.filter((x) => x.situacao !== "pendente").slice(-3).reverse();
  const lista = (MEU_EM.escolha?.paraTrocar || []).filter((p) => p.id !== r.projetoAtual.projetoId);

  const historico = decididos.length ? `<details style="margin-top:8px">
    <summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">Pedidos anteriores</summary>
    ${decididos.map((x) => `<div class="kv muted">• ${esc(x.numero || "")} ${esc(x.titulo.slice(0, 60))} —
      <b>${x.situacao === "aprovado" ? "aprovado" : "recusado"}</b>${x.decisao?.parecer
        ? `: ${esc(x.decisao.parecer)}` : ""}</div>`).join("")}
  </details>` : "";

  if (pendente) {
    return `<div class="card" style="margin-top:10px">
      <div class="card-t">Solicitar alteração de projeto</div>
      <div class="banner ba-warn" style="margin-top:6px">
        <b>Seu pedido está com a coordenação de pesquisa.</b>
        Você pediu para passar a acompanhar <b>${esc(pendente.numero || "")} ${esc(pendente.titulo.slice(0, 90))}</b>${pendente.orientador ? ` · orientação de ${esc(pendente.orientador)}` : ""}.
        Enquanto ela não decide, você segue no projeto atual.
      </div>${historico}</div>`;
  }
  return `<div class="card" style="margin-top:10px">
    <div class="card-t">Solicitar alteração de projeto</div>
    <div class="card-s">Quer conhecer outra pesquisa? Escolha o projeto e conte o porquê — quem
      decide é a coordenação de pesquisa, que apresenta você à nova orientação.</div>
    ${lista.length ? `
      <div><label>Projeto que você quer passar a acompanhar</label>
        <select id="emped-projeto-${esc(r.id)}">
          <option value="">— escolha o projeto —</option>
          ${lista.map((p) => `<option value="${esc(p.id)}">${esc(p.curso)} · ${esc(p.titulo.slice(0, 70))}${p.titulo.length > 70 ? "…" : ""} — ${esc(p.orientador)} · ${esc(LINHA_ROT_EM[p.linha] || p.linha || "")}</option>`).join("")}
        </select></div>
      <div style="margin-top:8px"><label>Por que você quer trocar?</label>
        <textarea id="emped-motivo-${esc(r.id)}" rows="3"
          placeholder="Conte o que te levou a querer acompanhar outro projeto — é o que a coordenação lê para decidir."></textarea></div>
      <div class="exp" style="margin-top:8px">
        <button class="bt bt-pri" onclick="meuEmPedirTroca('${esc(r.id)}')">Enviar o pedido à coordenação</button>
      </div>`
      : `<div class="banner ba-info" style="margin-top:6px">Não há outros projetos em execução
         para escolher no momento.</div>`}
    ${historico}</div>`;
}

async function meuEmPedirTroca(id) {
  const sel = $("emped-projeto-" + id);
  const mot = $("emped-motivo-" + id);
  if (!sel || !sel.value) return aviso("Escolha o projeto na lista.", "err");
  if (!mot || mot.value.trim().length < 15)
    return aviso("Escreva o motivo do pedido — é o que a coordenação lê para decidir.", "err");
  try {
    await api("/api/ic/em/meu/pedido-projeto", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, projetoId: sel.value, motivo: mot.value.trim() }) });
    MEU_EM = null; await renderMeuEM();
    aviso("Pedido enviado — a coordenação de pesquisa vai analisar.");
  } catch (e) { aviso(e.message, "err"); }
}

async function meuEmEscolher(id) {
  const sel = $("meuem-projeto-" + id);
  if (!sel || !sel.value) return aviso("Escolha o projeto na lista.", "err");
  try {
    await api("/api/ic/em/meu/projeto", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, projetoId: sel.value }) });
    MEU_EM = null; await renderMeuEM();
    aviso("Pronto! A coordenação de pesquisa vai apresentar você ao orientador.");
  } catch (e) { aviso(e.message, "err"); }
}
async function meuEmRelatorio(id, tipo) {
  const atividades = ($(`em-${tipo}-atividades-${id}`)?.value || "").trim();
  const motivacao = ($(`em-${tipo}-motivacao-${id}`)?.value || "").trim();
  const sel = $(`em-${tipo}-curso-${id}`)?.value || "";
  const cursoOutro = sel === "__outro__" ? ($(`em-${tipo}-outro-${id}`)?.value || "").trim() : "";
  const cursoPretendido = sel === "__outro__" ? "" : sel;
  if (atividades.length < 50) return aviso("Descreva as atividades realizadas na vigência da sua bolsa (pelo menos 50 caracteres).", "err");
  if (motivacao.length < 20) return aviso("Conte se a participação te motivou a seguir carreira acadêmica, cursar uma faculdade, ser um cientista.", "err");
  if (!cursoPretendido && !cursoOutro) return aviso("Escolha o curso do UNIEGO — ou escreva o curso que você gostaria que o UNIEGO tivesse.", "err");
  // o questionário de avaliação do programa: as 7 perguntas + a recomendação
  const pref = `em-${tipo}-${id}`;
  const modelo = MEU_EM?.avaliacaoModelo || { criterios: [] };
  const criterios = {};
  for (const c of modelo.criterios) {
    const marcado = document.querySelector(`input[name="${pref}-crit-${c.codigo}"]:checked`);
    if (marcado) criterios[c.codigo] = Number(marcado.value);
  }
  if (Object.keys(criterios).length < modelo.criterios.length)
    return aviso("Responda as 7 perguntas da avaliação do programa — marque 0 quando não se aplicar.", "err");
  const recomendaria = document.querySelector(`input[name="${pref}-recomendaria"]:checked`)?.value || "";
  if (!recomendaria) return aviso("Diga se você recomendaria a Iniciação Científica Júnior para outros colegas de escola.", "err");
  const avaliacao = { criterios, recomendaria,
    aprendizado: ($(`${pref}-aprendizado`)?.value || "").trim(),
    sugestoes: ($(`${pref}-sugestoes`)?.value || "").trim() };
  try {
    await api("/api/ic/em/meu/relatorio", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, tipo, atividades, motivacao, cursoPretendido, cursoOutro, avaliacao }) });
    MEU_EM = null; await renderMeuEM();
    aviso(`Relatório ${tipo} entregue — obrigado! A PROPPEX valida e você acompanha por aqui.`);
  } catch (e) { aviso(e.message, "err"); }
}
/* --------------------- fim: ICEM ---------------------------------------- */

/* ------------------------- panorama do ciclo ---------------------------- */
/* O que a coordenação precisa acompanhar sem abrir projeto por projeto:
   quem já indicou aluno, quantos alunos já completaram o cadastro do
   contrato, e como o edital se distribui por curso, titulação e linha.

   Os gráficos são barras de UMA COR só: o que se compara aqui é tamanho, e
   quem diz "quem é" é o rótulo da linha. Cor por categoria obrigaria a
   consultar uma legenda para ler o próprio gráfico, sem dizer nada a mais. */
const barras = (itens, { unidade = "" } = {}) => {
  if (!itens.length) return `<div class="vazio">Sem dados neste ciclo.</div>`;
  const max = Math.max(1, ...itens.map((i) => i.valor));
  const total = itens.reduce((s, i) => s + i.valor, 0);
  return `<div class="barras">${itens.map((i) => {
    const pct = total ? Math.round((i.valor / total) * 100) : 0;
    return `<div class="barra" title="${esc(i.rot)}: ${i.valor}${unidade ? " " + unidade : ""}${total ? ` — ${pct}% do total` : ""}">
      <div class="rot">${esc(i.rot)}</div>
      <div class="trilho"><div class="fill" style="width:${Math.round((i.valor / max) * 100)}%"></div></div>
      <div class="val">${i.valor}${total ? `<span>${pct}%</span>` : ""}</div>
    </div>`;
  }).join("")}</div>`;
};

// a pessoa que orienta, como chave: e-mail quando há, nome quando não
const chaveProf = (p) => String(p.orientador?.email || p.orientador?.nome || "").toLowerCase();

function panoramaDoCiclo(meus) {
  if (!META.gestao) return "";
  const doCiclo = meus.filter((p) => p.status !== "rascunho");
  if (!doCiclo.length) return "";
  const emExecucao = doCiclo.filter((p) => ["aprovado", "concluido"].includes(p.status));

  /* --- indicação e cadastro: o acompanhamento pedido pela pró-reitoria --- */
  const profsAprovados = new Set(emExecucao.map(chaveProf).filter(Boolean));
  const profsQueIndicaram = new Set(emExecucao.filter((p) => (p.alunos || []).length).map(chaveProf).filter(Boolean));
  const alunos = emExecucao.flatMap((p) => p.alunos || []);
  const completos = alunos.filter((a) => a.dadosCompletos ?? cadastroCompletoLocal(a));
  const semEmail = alunos.filter((a) => !a.email);
  const bolsistas = alunos.filter((a) => a.bolsista);
  const pctInd = profsAprovados.size ? Math.round((profsQueIndicaram.size / profsAprovados.size) * 100) : 0;
  const pctCad = alunos.length ? Math.round((completos.length / alunos.length) * 100) : 0;

  /* ------------------------ distribuições do edital ---------------------- */
  const contar = (lista, chave) => {
    const m = new Map();
    for (const x of lista) { const k = chave(x); if (!k) continue; m.set(k, (m.get(k) || 0) + 1); }
    return [...m.entries()].map(([rot, valor]) => ({ rot, valor })).sort((a, b) => b.valor - a.valor);
  };
  const porCurso = contar(doCiclo, (p) => cursoNome(p.curso));
  const porLinha = contar(doCiclo, (p) => linhaNome(p.linha));
  const porStatus = contar(doCiclo, (p) => META.rotulos[p.status] || p.status);
  // titulação conta PESSOAS, não projetos: quem submete dois planos é um
  // professor só, e o quadro é sobre o corpo docente do edital
  const profs = new Map();
  for (const p of doCiclo) {
    const k = chaveProf(p); if (!k || profs.has(k)) continue;
    profs.set(k, titulacaoCodigo(p.orientador?.titulacao));
  }
  const rotTit = { doutor: "Doutores", mestre: "Mestres", especialista: "Especialistas", "": "Não informada" };
  const porTitulacao = ["doutor", "mestre", "especialista", ""]
    .map((c) => ({ rot: rotTit[c], valor: [...profs.values()].filter((x) => x === c).length }))
    .filter((x) => x.valor);
  const porBolsa = contar(emExecucao.filter((p) => p.fomento),
    (p) => (p.fomento.modalidade ? modNome(p.fomento.modalidade) : fomentoNome(p.fomento.tipo)));

  return `
    <div class="card">
      <div class="card-t">Indicação e cadastro dos alunos</div>
      <div class="card-s">Onde cada projeto aprovado está: quem já indicou aluno e quem já completou o
        cadastro que a PROPPEX usa para efetivar a bolsa.</div>
      <div class="kpis" style="margin-bottom:0">
        <div class="kpi"><div class="l">Professores que já indicaram</div>
          <div class="v">${profsQueIndicaram.size}<span style="font-size:16px;color:var(--muted)"> / ${profsAprovados.size}</span></div>
          <div class="d" style="color:${pctInd === 100 ? "var(--ok)" : "var(--warn)"}">${pctInd}% dos aprovados${
            profsAprovados.size - profsQueIndicaram.size ? ` · faltam ${profsAprovados.size - profsQueIndicaram.size}` : ""}</div></div>
        <div class="kpi"><div class="l">Alunos indicados</div>
          <div class="v">${alunos.length}</div>
          <div class="d">${bolsistas.length} bolsista(s) · ${alunos.length - bolsistas.length} voluntário(s)</div></div>
        <div class="kpi"><div class="l">Cadastros enviados</div>
          <div class="v" style="color:${alunos.length && pctCad === 100 ? "var(--ok)" : "var(--ink)"}">${completos.length}<span style="font-size:16px;color:var(--muted)"> / ${alunos.length}</span></div>
          <div class="d" style="color:${alunos.length && pctCad === 100 ? "var(--ok)" : "var(--warn)"}">${pctCad}% completaram os próprios dados</div></div>
        <div class="kpi"><div class="l">Sem e-mail na indicação</div>
          <div class="v" style="color:${semEmail.length ? "var(--err)" : "var(--ok)"}">${semEmail.length}</div>
          <div class="d">${semEmail.length ? "não recebem convite nem enviam relatório" : "todos os indicados têm acesso"}</div></div>
      </div>
    </div>

    <div class="grade2">
      <div class="quad">
        <div class="qt">Projetos por curso</div>
        <div class="qs">${doCiclo.length} proposta(s) no ciclo, fora os rascunhos.</div>
        ${barras(porCurso)}
      </div>
      <div class="quad">
        <div class="qt">Titulação de quem orienta</div>
        <div class="qs">${profs.size} professor(es) no edital — cada um contado uma vez.</div>
        ${barras(porTitulacao)}
      </div>
      <div class="quad">
        <div class="qt">Categoria de submissão</div>
        <div class="qs">Iniciação Científica, Inovação Tecnológica e Iniciação à Extensão.</div>
        ${barras(porLinha)}
      </div>
      <div class="quad">
        <div class="qt">Situação das propostas</div>
        <div class="qs">Onde está cada uma neste momento do processo.</div>
        ${barras(porStatus)}
      </div>
      ${porBolsa.length ? `<div class="quad" style="grid-column:1/-1">
        <div class="qt">Bolsas concedidas por modalidade</div>
        <div class="qs">Entre os projetos aprovados, o que a coordenação já distribuiu.</div>
        ${barras(porBolsa)}
      </div>` : ""}
    </div>`;
}


/* ----------------------------- certificados ---------------------------- */
/* Participação (aluno) e orientação (um por aluno orientado), dos ciclos
   CONCLUÍDOS. A lista vem do servidor casada pelo CPF — é o que reúne, numa
   conta só, quem participou de mais de uma edição — com o e-mail como
   segunda chave. */
let CERTS = null;
async function renderCertificados() {
  $("v-certificados").innerHTML = `<div class="card"><div class="vazio">Carregando…</div></div>`;
  try { CERTS = await api("/api/ic/certificados"); }
  catch (e) { $("v-certificados").innerHTML = `<div class="banner ba-err">${esc(e.message)}</div>`; return; }

  const meus = CERTS.certificados || [];
  const porEdital = new Map();
  for (const c of meus) {
    if (!porEdital.has(c.edital)) porEdital.set(c.edital, []);
    porEdital.get(c.edital).push(c);
  }
  const cartao = (c) => `
    <div class="linha">
      <div class="txt">
        <div class="p1">${c.tipo === "orientacao" ? `Orientação — ${esc(c.aluno || "")}` : "Participação em Iniciação Científica"}</div>
        <div class="p2">${esc(c.numero || "—")} · ${esc(c.titulo || "")}${c.tipo === "orientacao" ? "" : ` · orientação: ${esc(c.orientador || "—")}`}
          ${c.modalidade ? ` · ${esc(c.modalidade)}` : c.bolsista ? " · bolsista" : ""}</div>
      </div>
      <a class="bt bt-pri" href="${comQuem(`/api/ic/certificado.pdf?codigo=${encodeURIComponent(c.codigo)}`)}"
        target="_blank" rel="noopener">📜 Baixar</a>
    </div>`;

  $("v-certificados").innerHTML = `
    ${!CERTS.temCpf ? `<div class="banner ba-warn"><b>Informe o seu CPF no
      <a href="/perfil/" target="_blank" rel="noopener">perfil</a></b> — é ele que reúne aqui os
      certificados de todas as edições em que você participou. Sem o CPF, só aparecem os ciclos
      ligados a este e-mail.</div>` : ""}

    ${META.gestao && !CERTS.simulando ? renderAssinaturas() : ""}
    ${META.gestao && !CERTS.simulando ? renderAvisoCertificados() : ""}

    ${meus.length ? [...porEdital].map(([edital, lista]) => `<div class="card">
        <div class="card-t">Edital ${esc(edital)}</div>
        <div class="card-s">${lista.length} certificado(s) — o documento sai com o timbre da época.</div>
        ${lista.map(cartao).join("")}
      </div>`).join("")
    : `<div class="card"><div class="card-t">Nenhum certificado ainda</div>
        <div class="card-s">Os certificados saem quando o ciclo é concluído. Se você participou de
        edições anteriores e nada aparece aqui, confira o CPF no seu perfil — é por ele que o
        sistema encontra a sua participação.</div></div>`}`;
}

/* Só o gestor geral: a assinatura digitalizada que sai NO CERTIFICADO. Fica
   guardada no sistema (não no repositório) — em produção o disco é efêmero,
   e trocar de reitor não pode depender de um deploy. */
function renderAssinaturas() {
  const a = CERTS?.assinaturas || {};
  const cartao = (quem, rotulo, nome, onde) => {
    const tem = a[quem];
    return `<div class="linha">
      <div class="txt">
        <div class="p1">${rotulo} — ${esc(nome)} <span class="p2">· ${esc(onde)}</span></div>
        <div class="p2">${tem
          ? `enviada em ${fmtDH(tem.em)}${tem.arquivo ? ` · ${esc(tem.arquivo)}` : ""}`
          : "nenhuma imagem enviada — o certificado sai com a linha em branco"}</div>
      </div>
      ${tem ? `<img src="/api/ic/assinatura/${quem}?t=${Date.now()}" alt="assinatura"
        style="height:38px;max-width:150px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px">` : ""}
      <label class="bt bt-sec" style="cursor:pointer;margin:0">
        ${tem ? "Trocar" : "Enviar"} imagem
        <input type="file" accept="image/png,image/jpeg" style="display:none"
          onchange="enviarAssinatura('${quem}', this)">
      </label>
      ${tem ? `<button class="bt bt-err" onclick="removerAssinatura('${quem}')">✕</button>` : ""}
    </div>`;
  };
  return `<div class="card">
    <div class="card-t">Assinaturas do certificado</div>
    <div class="card-s">A imagem entra sobre a linha nos certificados e, desde ago/2026, na
      <b>proposta APROVADA da Extensão</b> (pedido do dono: ao aprovar, as assinaturas do banco
      são inseridas no PDF); relatório e resultado continuam saindo para assinatura à mão. Use
      <b>PNG com fundo transparente</b> e traço escuro (JPG funciona, mas o retângulo branco
      aparece). Até 2 MB.
      <br>Este card é o <b>banco de assinaturas institucional</b> do portal: quem assina
      acompanha o órgão que concebe o programa — a <b>IC</b> é da PROPPEX; a <b>monitoria</b> é
      ação de ensino, sai no timbre da <b>PROAC</b> e é a Pró-Reitora Acadêmica quem assina, ao
      lado do reitor. Sem imagem, sai a linha em branco e nada quebra.</div>
    ${cartao("proreitor", "Pró-Reitor", "Dr. Jadson Belem de Moura",
      "certificados da IC e proposta aprovada da Extensão")}
    ${cartao("proacademica", "Pró-Reitora Acadêmica", "Dra. Matildes José de Oliveira",
      "certificados de monitoria")}
    ${cartao("reitor", "Reitor", "Dr. José Mateus dos Santos", "todos os certificados")}
    ${cartao("coordextensao", "Coordenador de Extensão", "Thiago Brito Steckelberg",
      "proposta aprovada de curso livre (Extensão)")}
    ${cartao("coordacao", "Coordenação de Ação Comunitária", "Dra. Camila Cardoso",
      "proposta aprovada das demais ações de extensão")}
  </div>`;
}

async function enviarAssinatura(quem, input) {
  const file = input.files?.[0];
  if (!file) return;
  const fd = new FormData();
  fd.append("file", file); fd.append("quem", quem);
  try {
    const r = await fetch("/api/ic/assinatura", { method: "POST", body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Falha (${r.status})`);
    await renderCertificados();
    aviso("Assinatura enviada. Baixe um certificado para conferir como ficou.");
  } catch (e) { aviso(e.message, "err"); }
  input.value = "";
}

async function removerAssinatura(quem) {
  if (!confirm("Remover esta assinatura? O certificado volta a sair com a linha em branco.")) return;
  try {
    await api(`/api/ic/assinatura/${quem}`, { method: "DELETE" });
    await renderCertificados();
    aviso("Assinatura removida.");
  } catch (e) { aviso(e.message, "err"); }
}

/* Só a gestão: avisar por e-mail, ciclo a ciclo, que os certificados saíram. */
function renderAvisoCertificados() {
  const ciclos = CERTS?.ciclos || [];
  if (!ciclos.length) return "";
  return `<div class="card">
    <div class="card-t">Avisar que os certificados estão disponíveis</div>
    <div class="card-s">Um e-mail por pessoa, com o link para baixar. Quem não tem e-mail no
      sistema não recebe — e o número aparece aqui, para você saber o tamanho da lacuna.</div>
    ${ciclos.map((c) => `<div class="linha">
      <div class="txt">
        <div class="p1">Edital ${esc(c.edital)}</div>
        <div class="p2">${c.total} certificado(s) · ${c.avisaveis} pessoa(s) com e-mail${
          c.semEmail ? ` · <b style="color:var(--warn)">${c.semEmail} sem e-mail</b>` : ""}</div>
      </div>
      <button class="bt bt-sec" ${c.avisaveis ? "" : "disabled"}
        onclick="avisarCertificados('${esc(c.edital)}')">📧 Avisar</button>
    </div>`).join("")}
  </div>`;
}

async function avisarCertificados(edital) {
  const post = (corpo) => api("/api/ic/certificados/avisar", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  try {
    const s = await post({ edital, simular: true });
    if (!s.destinatarios.length) return aviso("Ninguém com e-mail cadastrado neste ciclo.", "warn");
    janelaEnvio({
      titulo: `Avisar sobre os certificados — Edital ${edital}`,
      itens: s.destinatarios.map((d) => `${d.nome || d.email} — ${d.certificados} certificado(s)`),
      observacao: s.semEmail ? `${s.semEmail} certificado(s) sem e-mail — essas pessoas não recebem.` : "",
      previewHtml: s.previewHtml,
      rotuloEnviar: "Enviar aviso",
      aoAtualizar: async (m) => (await post({ edital, simular: true, mensagem: m })).previewHtml,
      aoEnviar: async (mensagem) => {
        try {
          const r = await post({ edital, mensagem });
          aviso(`Aviso enviado a ${r.enviados.length} pessoa(s)${r.falhas.length ? ` — ${r.falhas.length} falhou(aram)` : ""}.`);
        } catch (e) { aviso(e.message, "err"); }
      },
    });
  } catch (e) { aviso(e.message, "err"); }
}

/* ------------------------------- gestão -------------------------------- */
/* Exporta o que está na tela: a planilha (uma linha por projeto) e as
   fichas em PDF (uma por página). Os filtros vão junto — exportar a base
   inteira quando se está olhando um recorte seria surpresa ruim. */
function exportarProjetos(formato) {
  const q = new URLSearchParams();
  for (const [k, v] of Object.entries(FILTRO)) if (v) q.set(k, v);
  window.open(`/api/ic/projetos.${formato}?${q}`, "_blank", "noopener");
}

function limparFiltros() {
  FILTRO = { status: "", curso: "", linha: "", grupo: "", q: "", titulacao: "", bolsa: "",
    alunos: "", edital: META.edital?.numero || "__todos" };
  ArchePag.zerar("ic-projetos");
  renderGestao();
}

let PAG_IC = { itens: [], barra: "" };
function renderGestao() {
  // o ciclo em evidência é o ATUAL; os passados só aparecem se escolhidos
  if (!FILTRO.edital) FILTRO.edital = META.edital?.numero || "__todos";
  const lista = PROJETOS.filter((p) =>
    (!FILTRO.status || p.status === FILTRO.status) &&
    (!FILTRO.curso || p.curso === FILTRO.curso) &&
    (!FILTRO.linha || p.linha === FILTRO.linha) &&
    (!FILTRO.grupo
      || (FILTRO.grupo === "__com" && !!p.grupoPesquisa)
      || (FILTRO.grupo === "__sem" && !p.grupoPesquisa)
      || p.grupoPesquisa === FILTRO.grupo) &&
    (FILTRO.edital === "__todos" || (p.edital || META.edital?.numero) === FILTRO.edital) &&
    (!FILTRO.titulacao || titulacaoCodigo(p.orientador?.titulacao) === FILTRO.titulacao) &&
    // o recorte da bolsa lê a DECISÃO da seleção: "sem bolsa" são os
    // aprovados voluntários ou sem fomento — quem ainda espera decisão
    // (em avaliação) não entra em nenhum dos três
    (!FILTRO.bolsa
      || (FILTRO.bolsa === "sem"
        ? ["aprovado", "concluido"].includes(p.status) && (!p.fomento || p.fomento.tipo === "voluntario")
        : p.fomento?.tipo === FILTRO.bolsa)) &&
    /* QUEM AINDA NÃO INDICOU ALUNO (pedido do dono, ago/2026: "estou tentando
       passar os projetos para ver quais ainda não têm alunos indicados").
       Era procurar linha a linha em quarenta projetos — a informação já estava
       em cada uma ("sem aluno indicado"), faltava poder recortar por ela. */
    (!FILTRO.alunos
      || (FILTRO.alunos === "sem" ? !(p.alunos || []).length : !!(p.alunos || []).length)) &&
    (!FILTRO.q || `${p.numero || ""} ${p.titulo} ${p.orientador?.nome || ""} ${(p.alunos || []).map((a) => a.nome).join(" ")}`
      .toLowerCase().includes(FILTRO.q.toLowerCase())));

  // filtro ativo = qualquer recorte além do padrão (o ciclo vigente é o padrão)
  const filtroAtivo = FILTRO.status || FILTRO.curso || FILTRO.linha || FILTRO.grupo
    || FILTRO.titulacao || FILTRO.bolsa || FILTRO.alunos || FILTRO.q
    || FILTRO.edital !== (META.edital?.numero || "__todos");

  $("v-gestao").innerHTML = `
    <div class="acoes-lista">
      ${ehAluno() ? "" : `<button class="bt bt-pri" onclick="nav('submissao')">＋ Novo projeto</button>`}
      ${META.gestao ? `<button class="bt bt-sec" onclick="incluirManualmente()"
        title="Pedido de inclusão fora do prazo deferido pela pró-reitoria">＋ Incluir por outro professor</button>` : ""}
      ${META.gestao ? `<button class="bt bt-ghost" onclick="baixarResultado()"
        title="Documento timbrado com o resultado do processo seletivo">📄 Resultado do processo (PDF)</button>` : ""}
      ${META.gestao ? `<button class="bt bt-ghost" onclick="convidarProfessores()"
        title="E-mail aos professores dos projetos importados que ainda não criaram o usuário — o CPF no perfil é o que vincula os projetos">📧 Convidar professores</button>` : ""}
      ${META.gestao ? `<button class="bt bt-ghost" onclick="exportarProjetos('xlsx')"
        title="Planilha com os projetos que estão na tela, com os filtros aplicados">📊 Exportar em Excel</button>` : ""}
      ${META.gestao ? `<button class="bt bt-ghost" onclick="exportarProjetos('pdf')"
        title="Ficha completa de cada projeto, uma por página — com os filtros aplicados">📄 Exportar em PDF</button>` : ""}
      ${ME?.papel === "gestor" ? `<button class="bt bt-ghost" onclick="importarEdital(true)" title="Confere o arquivo sem gravar">Importar edital 01/2026</button>` : ""}
    </div>

    <div class="painel-filtros">
      <input class="busca" placeholder="🔎 Buscar por número, título, orientação ou aluno" value="${esc(FILTRO.q)}"
        oninput="FILTRO.q=this.value;ArchePag.zerar('ic-projetos');clearTimeout(window.__b);window.__b=setTimeout(renderGestao,250)">
      ${(META.editais || []).length > 1 ? `
      <select onchange="FILTRO.edital=this.value;ArchePag.zerar('ic-projetos');renderGestao()" title="Ciclo (edital) a mostrar">
        ${(META.editais || []).map((e) => `<option value="${esc(e.numero)}" ${FILTRO.edital === e.numero ? "selected" : ""}>${esc(rotuloCiclo(e.numero))}${e.vigente ? " — atual" : ""} · ${e.projetos} projeto(s)</option>`).join("")}
        <option value="__todos" ${FILTRO.edital === "__todos" ? "selected" : ""}>Todos os ciclos</option>
      </select>` : ""}
      <select onchange="FILTRO.status=this.value;ArchePag.zerar('ic-projetos');renderGestao()">
        <option value="">Situação: todas</option>
        ${META.status.map((s) => `<option value="${s}" ${FILTRO.status === s ? "selected" : ""}>${esc(META.rotulos[s] || s)}</option>`).join("")}
      </select>
      <select onchange="FILTRO.curso=this.value;ArchePag.zerar('ic-projetos');renderGestao()">
        <option value="">Curso: todos</option>
        ${META.cursos.map((c) => `<option value="${c.slug}" ${FILTRO.curso === c.slug ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}
      </select>
      <select onchange="FILTRO.linha=this.value;ArchePag.zerar('ic-projetos');renderGestao()">
        <option value="">Linha: todas</option>
        ${META.linhas.map((l) => `<option value="${l.codigo}" ${FILTRO.linha === l.codigo ? "selected" : ""}>${esc(l.nome)}</option>`).join("")}
      </select>
      <select onchange="FILTRO.grupo=this.value;ArchePag.zerar('ic-projetos');renderGestao()" title="Vínculo com grupo de pesquisa">
        <option value="">Grupo de pesquisa: todos</option>
        <option value="__com" ${FILTRO.grupo === "__com" ? "selected" : ""}>Vinculados a algum grupo</option>
        <option value="__sem" ${FILTRO.grupo === "__sem" ? "selected" : ""}>Sem grupo</option>
        ${gruposEmUso().map((g) => `<option value="${esc(g)}" ${FILTRO.grupo === g ? "selected" : ""}>${esc(g)}</option>`).join("")}
      </select>
      <select onchange="FILTRO.titulacao=this.value;ArchePag.zerar('ic-projetos');renderGestao()" title="Titulação de quem orienta">
        <option value="">Titulação: todas</option>
        <option value="doutor" ${FILTRO.titulacao === "doutor" ? "selected" : ""}>Professores doutores</option>
        <option value="mestre" ${FILTRO.titulacao === "mestre" ? "selected" : ""}>Professores mestres</option>
        <option value="especialista" ${FILTRO.titulacao === "especialista" ? "selected" : ""}>Professores especialistas</option>
      </select>
      <select onchange="FILTRO.bolsa=this.value;ArchePag.zerar('ic-projetos');renderGestao()" title="Fomento decidido na seleção">
        <option value="">Bolsa: todas</option>
        <option value="cnpq" ${FILTRO.bolsa === "cnpq" ? "selected" : ""}>Com bolsa CNPq</option>
        <option value="uniego" ${FILTRO.bolsa === "uniego" ? "selected" : ""}>Com bolsa UNIEGO</option>
        <option value="sem" ${FILTRO.bolsa === "sem" ? "selected" : ""}>Sem bolsa (voluntários e submissão livre)</option>
      </select>
      <select onchange="FILTRO.alunos=this.value;ArchePag.zerar('ic-projetos');renderGestao()" title="Se o projeto já tem bolsista ou voluntário indicado">
        <option value="">Alunos: todos</option>
        <option value="sem" ${FILTRO.alunos === "sem" ? "selected" : ""}>Sem aluno indicado</option>
        <option value="com" ${FILTRO.alunos === "com" ? "selected" : ""}>Com aluno indicado</option>
      </select>
      ${filtroAtivo ? `<button class="bt bt-ghost" onclick="limparFiltros()" title="Volta ao ciclo vigente, sem recortes">✕ Limpar filtros</button>` : ""}
    </div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">${lista.length} projeto(s)${
      (() => { const n = lista.filter((p) => p.grupoPesquisa).length;
        return n ? ` · ${n} vinculado(s) a grupo de pesquisa` : ""; })()}</div>
    ${(() => {
      // o edital 01/2026 sozinho tem 33 projetos, e a guia mostra também os
      // ciclos passados: paginada como as demais listas do portal
      PAG_IC = ArchePag.recorte("ic-projetos", lista, renderGestao);
      return PAG_IC.barra;
    })()}
    ${PAG_IC.itens.map((p) => `<div class="proj-linha">
      <div class="item" onclick="abrir('${esc(p.id)}')">
        <div style="flex:1;min-width:0">
          <div class="nm">${esc(p.titulo || "(sem título)")}</div>
          <div class="cs">${esc(p.numero || "sem número")} · ${esc(cursoNome(p.curso))} · ${esc(modVigente(p))}
            · orientação: ${esc(p.orientador?.nome || p.orientador?.email || "—")}
            ${p.alunos?.length ? ` · ${p.alunos.length} aluno(s)` : " · sem aluno indicado"}
            ${p.grupoPesquisa ? ` · grupo: ${esc(p.grupoPesquisa)}` : ""}
            ${p.inclusaoManual ? ` · <b>inclusão deferida fora do prazo</b>` : ""}</div>
          ${(p.pendencias || []).length ? `<div class="cs" style="color:var(--warn)">⚠ ${esc(p.pendencias[0].texto)}${
            p.pendencias.length > 1 ? ` (+${p.pendencias.length - 1})` : ""}</div>` : ""}
        </div>
        ${p.classificacao?.np != null ? `<span class="prazo" title="Projeto ${p.classificacao.np} + currículo ${p.classificacao.cl}">Nota ${p.classificacao.total}</span>` : ""}
        ${p.fomento ? `<span class="badge b-${p.fomento.tipo === "voluntario" ? "prevista" : "validado"}">${esc(fomentoNome(p.fomento.tipo))}</span>` : ""}
        ${p.aValidar ? `<span class="badge b-enviado">${p.aValidar} a validar</span>` : ""}
        ${p.atrasadas ? `<span class="badge b-atrasada">${p.atrasadas} atrasada(s)</span>` : ""}
        ${chip(p.status)}
      </div>
      ${blocoTermoDaOrientacao(p)}
      ${blocoAvaliacaoRecebida(p)}
    </div>`).join("") || `<div class="card"><div class="vazio">Nenhum projeto com esses filtros.</div></div>`}`;
}

/* A via do termo de compromisso de quem orienta, ao lado do projeto — só
   depois da publicação, e só para o próprio professor (a gestão emite o lote
   pela guia Bolsistas e Voluntários). */
function blocoTermoDaOrientacao(p) {
  if (META.gestao || p.papel !== "orientador") return "";
  if (!["aprovado", "concluido"].includes(p.status)) return "";
  if (!termosLiberados(p.edital || META.edital?.numero)) return "";
  return `<div class="exp" style="padding:0 14px 12px">
    <a class="bt bt-sec" target="_blank" rel="noopener" href="/api/ic/termo.pdf?projeto=${encodeURIComponent(p.id)}"
      title="Termo de compromisso da orientação, com as assinaturas da reitoria">📄 Meu termo de orientação</a>
  </div>`;
}

/* A devolutiva da seleção, para quem submeteu (decisão do dono, ago/2026).
   Fica colada ao projeto, recolhida: o professor abre quando quiser. Traz o
   QUE o parecer disse — critérios, recomendação e texto —, nunca QUEM o
   escreveu: a avaliação é cega, e o anonimato protege o parecerista. */
function blocoAvaliacaoRecebida(p) {
  const av = p.avaliacaoRecebida;
  if (!av || !av.pareceres?.length) return "";
  const varios = av.pareceres.length > 1;
  return `<details class="aval-rec">
    <summary>Avaliação recebida${av.nota != null ? ` — nota do projeto <b>${av.nota}</b>` : ""}${
      varios ? ` · ${av.pareceres.length} pareceres` : ""}</summary>
    ${av.pareceres.map((x, i) => `<div class="aval-item">
      ${varios ? `<div class="aval-t">Parecer ${i + 1}</div>` : ""}
      <table class="pt" style="margin:6px 0 8px">
        <tbody>
          ${(META.criterios || []).map((c) => `<tr><td>${esc(c.nome)}</td>
            <td style="width:110px;text-align:right"><b>${x.notas?.[c.codigo] ?? "—"}</b>
              <span class="muted">de ${c.peso}</span></td></tr>`).join("")}
          <tr><td><b>Nota do projeto</b></td>
            <td style="text-align:right"><b>${x.nota ?? "—"}</b> <span class="muted">de 100</span></td></tr>
        </tbody>
      </table>
      ${x.recomendacao ? `<div style="margin-bottom:6px"><b>Recomendação:</b> ${esc(recNome(x.recomendacao))}</div>` : ""}
      ${x.parecer ? `<div style="white-space:pre-wrap;line-height:1.6">${esc(x.parecer)}</div>` : ""}
    </div>`).join("")}
    <div class="muted" style="margin-top:10px">Quem avaliou não é identificado: a avaliação é cega.
      A nota final do processo soma esta nota do projeto à pontuação do seu currículo.</div>
    ${blocoContestacao(p)}
  </details>`;
}

/* Contestação da nota: existe entre o resultado preliminar e o final, com
   três dias contados da publicação do preliminar. Passado o prazo, o quadro
   continua ali dizendo que encerrou — sumir daria a impressão de que nunca
   houve a chance. */
function blocoContestacao(p) {
  const c = p.contestacao;
  if (!c) return "";
  if (c.minha) {
    return `<div class="cont-box">
      <div class="cont-t">Contestação enviada em ${fmtDH(c.minha.em)}</div>
      <div style="white-space:pre-wrap;line-height:1.55;margin-top:4px">${esc(c.minha.texto)}</div>
      ${c.minha.resposta
        ? `<div class="cont-resp"><b>Resposta da coordenação</b> · ${fmtDH(c.minha.respondidoEm)}
            <div style="white-space:pre-wrap;line-height:1.55;margin-top:3px">${esc(c.minha.resposta)}</div></div>`
        : `<div class="muted" style="margin-top:8px">Aguardando a análise da coordenação.</div>`}
    </div>`;
  }
  if (!c.aberta) {
    return `<div class="cont-box">
      <div class="muted">${c.motivo === "resultado-final"
        ? "O resultado final já foi publicado — o prazo de contestação era entre o preliminar e o final."
        : c.motivo === "sem-preliminar" ? "A contestação abre com a publicação do resultado preliminar."
        : `Prazo de contestação encerrado em ${fmtDH(c.ate)}.`}</div>
    </div>`;
  }
  return `<div class="cont-box">
    <div class="cont-t">Não concorda com a nota?</div>
    <div class="muted" style="margin:2px 0 8px">Você pode enviar uma <b>contestação formal</b> até
      ${fmtDH(c.ate)}${c.horasRestantes ? ` — faltam ${c.horasRestantes} hora(s)` : ""}. A coordenação
      analisa e responde aqui mesmo, antes do resultado final. É uma por projeto.</div>
    <button class="bt bt-sec" onclick="contestar('${esc(p.id)}')">Contestar a nota</button>
  </div>`;
}

async function contestar(id) {
  const texto = (prompt("Contestação da nota — descreva a razão do seu pedido de revisão.\n\n"
    + "Ela vai para a coordenação de pesquisa e fica registrada no projeto.") || "").trim();
  if (!texto) return;
  if (texto.length < 30) return aviso("Descreva a razão da contestação (mínimo de 30 caracteres).", "err");
  try {
    await api(`/api/ic/${encodeURIComponent(id)}/contestacao`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto }),
    });
    await carregar();
    renderGestao();
    aviso("Contestação enviada. A coordenação responde aqui mesmo, antes do resultado final.");
  } catch (e) { aviso(e.message, "err"); }
}

/* ------------------------- avaliação da seleção ------------------------ */
function renderAvaliacao() {
  const emSelecao = PROJETOS.filter((p) => p.status === "submetido");
  // o que passou pelas mãos do avaliador continua à vista depois da decisão:
  // o parecer é dele e ele precisa poder reler o que assinou
  const meus = PROJETOS.filter((p) => p.meuParecer);
  const aFazer = meus.filter((p) => p.aDarParecer);
  const feitos = meus.filter((p) => !p.aDarParecer);

  const cartao = (p, comPlacar) => `
    <div class="bloco ${p.aDarParecer ? "meu" : ""}">
      <div class="bloco-cab">
        <span class="num">${esc(p.numero || "—")}</span>
        <span class="t">${esc(p.titulo || "(sem título)")}</span>
        ${p.meuParecer ? `<span class="badge b-${p.meuParecer.situacao === "entregue" ? "validado" : p.meuParecer.situacao === "recusado" ? "reprovado" : "enviado"}">${esc({ designado: "parecer pendente", entregue: "parecer entregue", recusado: "avaliação recusada" }[p.meuParecer.situacao])}</span>` : ""}
      </div>
      <div class="muted">${esc(cursoNome(p.curso))} · ${esc(modNome(p.modalidade))}${p.edital ? ` · ${esc(p.edital)}` : ""}${
        p.orientador ? ` · orientação: ${esc(p.orientador.nome || p.orientador.email)}` : ""}</div>
      ${comPlacar && p.placar ? `<div class="muted" style="margin-top:6px">
        ${p.placar.entregues}/${p.placar.designados} parecer(es) entregue(s)${p.placar.recusados ? ` · ${p.placar.recusados} recusa(s)` : ""}
        ${p.placar.media !== null ? ` · nota média <b>${p.placar.media}</b>` : ""}
        ${p.placar.entregues ? ` · ${p.placar.recomendam} recomenda(m), ${p.placar.ressalvas} com ressalvas, ${p.placar.contra} contra` : ""}</div>` : ""}
      <div class="exp"><button class="bt ${p.aDarParecer ? "bt-pri" : "bt-ghost"}" onclick="abrir('${esc(p.id)}')">
        ${p.aDarParecer ? "Dar parecer" : "Abrir o projeto"}</button></div>
    </div>`;

  $("v-avaliacao").innerHTML = `
    <div class="tut"><details><summary>Como funciona a avaliação ad hoc</summary>
      <ol>
        <li>A coordenação designa os avaliadores <b>dentro de cada projeto</b>, pelo e-mail — é a designação que dá o acesso.</li>
        <li>O avaliador vê apenas os projetos que recebeu, e neles só a proposta: nada de relatórios, histórico ou parecer dos colegas.</li>
        <li>O projeto vale <b>de 0 a 100</b>: sete critérios, cada um com o seu teto de pontos, e a nota é a soma. Havendo mais de um parecer, vale a média das somas.</li>
        <li>Havendo impedimento, o avaliador <b>recusa</b> a avaliação dizendo o motivo — não fica travando a seleção.</li>
        <li>A orientação nunca sabe quem avaliou: recebe a decisão da coordenação, e é a ela que responde.</li>
      </ol></details></div>

    ${aFazer.length ? `<div class="card">
      <div class="card-t">Aguardando o seu parecer</div>
      <div class="card-s">${aFazer.length} projeto(s).</div>
      ${aFazer.map((p) => cartao(p, false)).join("")}
    </div>` : ""}

    ${feitos.length ? `<div class="card">
      <div class="card-t">Já passaram por você</div>
      <div class="card-s">Pareceres entregues, avaliações recusadas e projetos cuja seleção já foi decidida.</div>
      ${feitos.map((p) => cartao(p, false)).join("")}
    </div>` : ""}

    ${META.gestao ? `<div class="card">
      <div class="card-t">Projetos em seleção</div>
      <div class="card-s">${emSelecao.length} projeto(s) submetido(s) aguardando decisão.</div>
      ${emSelecao.map((p) => cartao(p, true)).join("") || `<div class="vazio">Nenhum projeto em avaliação no momento.</div>`}
    </div>` : ""}

    ${!meus.length && !META.gestao ? `<div class="card"><div class="vazio">
      Nenhum projeto designado a você no momento.</div></div>` : ""}`;
}

/* ------------------------ bolsistas e voluntários ----------------------- */
/* O acompanhamento por PESSOA: cada aluno em execução com as suas demandas —
   as metas do cronograma sob a responsabilidade dele e a entrega dos
   relatórios frente aos prazos do edital. Organizado por CICLO (edital),
   porque a cada ciclo os alunos e as metas mudam. O professor vê os seus;
   a gestão vê todos, agrupados por orientador. */
function renderBolsistas() {
  const fmtBr = (iso) => iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "—";
  const emExec = PROJETOS.filter((p) => ["aprovado", "concluido"].includes(p.status));

  const cartaoAluno = (p, a) => {
    const metas = ETAPAS.filter((e) => e.projetoId === p.id && e.responsavel === a.email);
    const feitas = metas.filter((e) => e.situacao === "concluida").length;
    const atrasadas = metas.filter((e) => e.situacao !== "concluida" && e.fim && e.fim < hojeISO()).length;
    const souEuMesmo = ehAluno() && a.email === META.eu;
    const relDe = (tipo) => RELS.relatorios.find((x) => x.projetoId === p.id && x.aluno === a.email && x.tipo === tipo);
    const rel = (tipo) => {
      const r = relDe(tipo);
      const prazo = (p.prazoRelatorios?.prazos || []).find((x) => x.tipo === tipo);
      const aberto = prazo?.abre && hojeISO() >= prazo.abre;
      /* O ARCHÉ IC dizia "enviado" na graduação e "entregue" no ICEM para o
         MESMO ato — o aluno entregou o relatório —, e quem lê as duas guias
         no mesmo dia não sabia se eram estados diferentes. O código gravado
         não muda (`enviado` é a chave); o que a tela ESCREVE passa a ser um
         só, e diz o que falta fazer. */
      const chip = r ? `<span class="badge b-${esc(r.situacao)}">${tipo}: ${esc({ enviado: "entregue — a validar", validado: "validado", devolvido: "devolvido ao aluno" }[r.situacao] || r.situacao)}</span>`
        : prazo?.atrasado ? `<span class="badge b-atrasada">${tipo}: atrasado (venceu ${fmtBr(prazo.vence)})</span>`
          : `<span class="badge b-rascunho">${tipo}: até ${fmtBr(prazo?.vence)}</span>`;
      /* O ALUNO preenche (janela aberta, sem relatório validado/enviado); o
         PROFESSOR valida quando há relatório enviado esperando por ele.
         A janela vale TAMBÉM no ciclo em REGULARIZAÇÃO (achado do dono,
         ago/2026): esses projetos estão `concluido` e mesmo assim têm o
         parcial e o final reabertos até 31/10 — exigir "aprovado" aqui
         trancava justamente quem precisa regularizar. Quem diz se a janela
         está aberta é o SERVIDOR, em `prazoRelatorios`. */
      const emJanela = p.status === "aprovado" || p.prazoRelatorios?.regularizacao;
      const acao = souEuMesmo && emJanela && aberto && (!r || r.situacao === "devolvido")
        ? `<button class="bt bt-sec" onclick="abrirRelatorio('${esc(p.id)}','${tipo}')">${r ? "corrigir" : "preencher"} relatório</button>`

          ? `<button class="bt bt-ok" onclick="lerEValidarIC('${esc(p.id)}','${tipo}','${esc(r.id || "")}')">Relatório ${tipo} — ler e validar</button>`
          : "";
      return chip + (acao ? " " + acao : "");
    };
    const contrato = a.bolsista
      ? ((a.dadosCompletos ?? !!(a.cpf && a.banco && a.conta && a.pix))
        ? '<span class="badge b-validado">contrato: dados completos</span>'

      : "";
    const linhaDado = (rot, v) => v ? `<div class="kv muted">• ${rot}: <b>${esc(v)}</b></div>` : "";
    return `<div class="bloco">
      <div class="bloco-cab">
        <span class="t">${esc(a.nome || a.email || "Aluno")}</span>
        <span class="badge b-${a.bolsista ? "aprovado" : "prevista"}">${a.bolsista ? "bolsista" : "voluntário"}</span>

      <div class="exp" style="gap:6px">
        ${p.status === "concluido" && !p.prazoRelatorios?.regularizacao
          ? '<span class="badge b-validado">ciclo encerrado</span>'

             sumia da tela — o aluno não tinha como enviar e a orientação não
             tinha como validar, num prazo que está correndo. */
          : `${p.status === "concluido"
              ? '<span class="badge b-validado">ciclo encerrado · regularização aberta</span>'
              : `<span class="badge b-${atrasadas ? "atrasada" : "validado"}">metas: ${feitas}/${metas.length} concluída(s)${atrasadas ? ` · ${atrasadas} atrasada(s)` : ""}</span>`}
        ${rel("parcial")} ${rel("final")}`} ${contrato}
      </div>
      ${META.gestao ? `<details style="margin-top:6px">
        <summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">👤 Ver dados do aluno (cadastro do contrato, com os dados bancários)</summary>
        <div style="margin-top:6px">
          ${linhaDado("CPF", a.cpf ? a.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : "")}
          ${linhaDado("RG", a.rg)}
          ${linhaDado("Nascimento", a.nascimento ? String(a.nascimento).split("-").reverse().join("/") : "")}
          ${linhaDado("Endereço", a.endereco)}
          ${linhaDado("Telefone (WhatsApp)", a.telefone)}
          ${linhaDado("E-mail", a.email)}
          ${linhaDado("Vínculo empregatício", a.vinculo === "sim" ? `sim${a.vinculoOnde ? " — " + a.vinculoOnde : ""}` : a.vinculo === "nao" ? "não" : "")}
          ${linhaDado("Banco", a.banco)} ${linhaDado("Agência", a.agencia)}
          ${linhaDado("Conta", a.conta)} ${linhaDado("Pix", a.pix)}
          ${!a.cpf && !a.banco ? '<div class="kv muted">O aluno ainda não enviou o cadastro (guia Bolsa).</div>' : ""}
        </div>
      </details>` : ""}
      <div class="exp"><button class="bt bt-ghost" onclick="abrir('${esc(p.id)}')">Abrir o projeto</button>
        ${META.gestao && a.bolsista ? `<a class="bt bt-ghost" target="_blank" rel="noopener"
          href="/api/ic/termos.pdf?edital=${encodeURIComponent(p.edital || META.edital?.numero || "")}&projeto=${encodeURIComponent(p.id)}"
          title="Termo de compromisso deste projeto, para assinatura">📝 Termo</a>` : ""}
      </div>
    </div>`;
  };

  const porCiclo = new Map();
  for (const p of emExec) {
    const ciclo = p.edital || META.edital?.numero || "—";
    if (!porCiclo.has(ciclo)) porCiclo.set(ciclo, []);
    porCiclo.get(ciclo).push(p);
  }
  const ciclos = [...porCiclo.entries()].sort((a, b) => String(b[0]).split("/").pop() - String(a[0]).split("/").pop());

  // um ciclo por vez, na lista suspensa — o mais atual em evidência
  if (!CICLO_BV || !ciclos.some(([c]) => c === CICLO_BV)) CICLO_BV = ciclos[0]?.[0] || "";
  const seletor = ciclos.length ? `<div class="filtros" style="margin-bottom:14px">
    <label style="margin:0;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted)">
      Ciclo
      <select style="width:auto;min-width:220px" onchange="CICLO_BV=this.value;renderBolsistas()">
        ${ciclos.map(([c, ps]) => `<option value="${esc(c)}" ${CICLO_BV === c ? "selected" : ""}>${esc(rotuloCiclo(c))}${c === META.edital?.numero ? " — atual" : ""} · ${ps.reduce((s, p) => s + (p.alunos || []).length, 0)} aluno(s)</option>`).join("")}
      </select>
    </label>
  </div>` : "";

  $("v-bolsistas").innerHTML = seletor + ciclos.filter(([c]) => c === CICLO_BV).map(([ciclo, projetos]) => {
    const comAlunos = projetos.filter((p) => (p.alunos || []).length);
    const totalAlunos = comAlunos.reduce((s, p) => s + p.alunos.length, 0);
    let corpo = "";
    if (META.gestao) {

      const porOrientador = new Map();
      for (const p of comAlunos) {
        const k = p.orientador?.nome || p.orientador?.email || "—";
        if (!porOrientador.has(k)) porOrientador.set(k, []);

      }
      corpo = [...porOrientador.entries()].sort((a, b) => a[0].localeCompare(b[0], "pt-BR"))

        <a class="bt bt-ghost" href="/api/ic/bolsistas.xlsx?edital=${encodeURIComponent(ciclo)}"
          title="Uma linha por bolsista, com CPF, contato e dados bancários — para montar os contratos">
          📇 Bolsistas para contrato (Excel)</a>
        <!-- A FOLHA DO MÊS (pedido do dono, ago/2026): graduação e ICEM juntos,
             só as bolsas do UNIEGO, com os dados que o financeiro precisa. É
             um pagamento por mês, então é uma planilha só. -->
        <a class="bt bt-pri" href="/api/ic/pagamento.xlsx?edital=${encodeURIComponent(ciclo)}"
          title="Bolsas do UNIEGO em execução — graduação e Ensino Médio juntos, com banco, agência, conta e Pix. Duas abas: para pagamento e pendentes.">
          💰 Folha de pagamento do mês (Excel)</a>
        <a class="bt bt-ghost" href="/api/ic/termos.pdf?tipo=bolsista&edital=${encodeURIComponent(ciclo)}" target="_blank" rel="noopener"
          title="Modelo institucional, uma folha por aluno — para imprimir e assinar na cerimônia">
          📝 Termos dos bolsistas (PDF)</a>
        <a class="bt bt-ghost" href="/api/ic/termos.pdf?tipo=orientador&edital=${encodeURIComponent(ciclo)}" target="_blank" rel="noopener"
          title="Um termo por professor, com os projetos que ele orienta">
          📝 Termos dos orientadores (PDF)</a>
      </div>
      ${blocoPublicarTermos(ciclo)}` : ""}
      ${corpo || `<div class="vazio">Nenhum aluno indicado neste ciclo ainda — a indicação abre com a aprovação do projeto.</div>`}
    </div>`;
  }).join("") || `<div class="card"><div class="vazio">Nenhum projeto em execução ainda. Os alunos aparecem aqui
    depois da aprovação e da indicação.</div></div>`;
}

/* ---------------------- publicação dos termos --------------------------- */
/* O termo de compromisso existe desde que o aluno preenche o cadastro — a
   gestão imprime quando quiser. Mas a CÓPIA de cada um só aparece depois da
   cerimônia de assinaturas, que ainda vai ser marcada: um termo circulando
   antes do ato viraria documento assinado fora dele. Publicar é um clique,
   e recolher também. */
const termosLiberados = (ciclo) =>
  !!(META.editais || []).find((e) => e.numero === ciclo)?.termosPublicados;

function blocoPublicarTermos(ciclo) {
  const pub = termosLiberados(ciclo);
  return `<div class="banner ${pub ? "ba-ok" : "ba-info"}" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span>${pub
      ? "<b>Termos publicados</b> — cada aluno e cada orientador já baixa a própria via assinada pela reitoria."
      : "<b>Termos não publicados.</b> Só a coordenação os vê. Publique depois da cerimônia de assinaturas."}</span>
    <button class="bt ${pub ? "bt-ghost" : "bt-pri"}" onclick="publicarTermos('${esc(ciclo)}', ${pub ? "false" : "true"})">
      ${pub ? "Recolher os termos" : "📢 Publicar os termos"}</button>
  </div>`;
}

async function publicarTermos(ciclo, publicar) {
  if (publicar && !confirm(`Publicar os termos do ciclo ${ciclo}? Alunos e orientadores passam a baixar a própria via.`)) return;
  if (!publicar && !confirm("Recolher os termos? Eles somem da tela dos alunos e dos professores.")) return;
  try {
    await api("/api/ic/termos/publicar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ edital: ciclo, publicar }),
    });
    await carregar(); montarSidebar(); renderBolsistas();
    aviso(publicar ? "Termos publicados — já aparecem para alunos e orientadores." : "Termos recolhidos.");
  } catch (e) { aviso(e.message, "err"); }
}

/* A mesma conta de lib/ic.js (faltaNoCadastroDoBolsista) — a tela precisa
   dizer o que falta antes de mandar ao servidor. Se mudar lá, mude aqui. */
const CAMPOS_CADASTRO = [
  ["nome", "nome completo"], ["cpf", "CPF"], ["rg", "RG"],
  ["nascimento", "data de nascimento"], ["telefone", "telefone (WhatsApp)"],
  ["endereco", "endereço"], ["vinculo", "vínculo empregatício"],
  ["banco", "banco"], ["agencia", "agência"], ["conta", "conta corrente"], ["pix", "Pix"],
];
const faltaNoCadastroLocal = (a) => CAMPOS_CADASTRO.filter(([c]) => !String(a?.[c] || "").trim()).map(([, r]) => r);
const cadastroCompletoLocal = (a) => faltaNoCadastroLocal(a).length === 0;
const idadeLocal = (n) => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(n || ""))) return null;
  const [an, mn, dn] = n.split("-").map(Number), h = new Date();
  let i = h.getFullYear() - an;
  if (h.getMonth() + 1 < mn || (h.getMonth() + 1 === mn && h.getDate() < dn)) i -= 1;
  return i >= 0 && i < 130 ? i : null;
};

function renderMinhaBolsa() {

    $("v-bolsa").innerHTML = `<div class="card"><div class="vazio">Você ainda não foi indicado(a) em

  // projetos, e o que ainda estiver em branco abre com o que o perfil já sabe

        placeholder="calculada pela data"></div>

      <div style="grid-column:span 2"><label>Endereço completo *</label>

    <div class="card-s">${esc(p.numero || "")} · ${esc(p.titulo || "")}. A via digital sai com as assinaturas
      da pró-reitoria e da reitoria; a sua é colhida na cerimônia.</div>
    <div class="exp"><a class="bt bt-pri" target="_blank" rel="noopener"
      href="/api/ic/termo.pdf?projeto=${encodeURIComponent(p.id)}">📄 Baixar o termo (PDF)</a></div>
  </div>`).join("")}`;
}
