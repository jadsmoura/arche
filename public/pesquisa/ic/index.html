<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHÉ IC · Iniciação Científica · PROPPEX / UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
  :root{
    --brand:#1c3742; --brand-2:#2d535c; --brand-3:#40717e; --accent:#71c8e2;
    --bg:#ebeef3; --card:#fff; --line:#e3e7ee; --line-2:#f0f2f6; --trilho:#eef1f5;
    --ink:#1c3742; --ink-soft:#3a4650; --muted:#7c8794; --muted-2:#a9b4c0;
    --ok:#3f8a5d; --ok-soft:#e5f3ea; --warn:#c98a2b; --warn-soft:#fbf3e4;
    --err:#a1524c; --err-soft:#f6e9e7; --info:#40717e; --info-soft:#e8f4fa;
    --roxo:#5e5091; --roxo-soft:#ecebf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brand-3);text-decoration:none}
  a:hover{color:var(--brand-2)}
  ::selection{background:var(--accent);color:var(--brand)}
  button{font-family:Figtree,system-ui,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
  .f-disp{font-family:Sora,sans-serif}

  /* ------------------------------- casca -------------------------------- */
  .app{display:flex;min-height:100vh}
  .side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side-marca{padding:20px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
  .side-marca b{color:var(--accent);font-weight:800}
  .side-nav{padding:14px 12px;flex:1;overflow-y:auto}
  .side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:10px 12px 6px}
  .side-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
    margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
    border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
    transition:background .15s,color .15s}
  .side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
  .side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
  .side-item svg{flex:none}
  .side-item .tag{margin-left:auto;background:var(--accent);color:var(--brand);font-size:10.5px;
    font-weight:700;border-radius:20px;padding:1px 7px}
  .side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px}
  .side-pe .av{width:34px;height:34px;border-radius:50%;background:var(--brand-3);display:grid;place-items:center;
    font-weight:700;font-size:13px;color:#fff;flex:none;overflow:hidden}
  .side-pe .av img{width:100%;height:100%;object-fit:cover}
  .side-pe .nm{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
  .side-pe .pp{font-size:11px;color:rgba(255,255,255,.5)}
  .side-pe .sair{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-weight:600}
  .side-pe .sair:hover{color:#fff}

  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .topbar .dir{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted)}
  .area{padding:28px 32px;flex:1}
  .limite{max-width:1180px}
  h1{font-family:Sora,sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}

  /* ------------------------------- cartões ------------------------------ */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}
  .card-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;margin-bottom:2px}
  .card-s{font-size:12px;color:var(--muted);margin-bottom:20px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpis>*{min-width:0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .kpi .v{font-family:Sora,sans-serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1}
  .kpi .d{font-size:11.5px;font-weight:600;margin-top:7px;color:var(--muted)}
  .duplo{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px}
  .duplo>*{min-width:0}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.duplo{grid-template-columns:1fr}}
  .linha{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
  .linha:last-child{border-bottom:0}
  .linha .txt{flex:1;min-width:0}
  .linha .p1{font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .linha .p2{font-size:11.5px;color:var(--muted)}
  .vazio{font-size:13px;color:var(--muted);padding:10px 0}

  /* ------------------------------ formulários --------------------------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .grid2>*,.grid3>*{min-width:0}
  @media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;border:1px solid #cfd6de;border-radius:8px;padding:10px 12px;
    font-family:Figtree,system-ui,sans-serif;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{min-height:84px;resize:vertical;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(64,113,126,.12)}
  input[disabled],select[disabled],textarea[disabled]{background:#f7f9fb;color:var(--ink-soft)}
  .sec-t{font-family:Sora,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin:22px 0 6px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .muted{color:var(--muted);font-size:12.5px;font-weight:400}
  .kv{margin:4px 0;font-size:13.5px;color:var(--ink-soft)}
  .kv b{color:var(--ink);font-weight:600}

  /* -------------------------------- botões ------------------------------ */
  .bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bt-pri{background:var(--brand);color:#fff}
  .bt-pri:hover{background:var(--brand-2)}
  .bt-sec{background:var(--info-soft);color:var(--brand);border-color:#cfe6f2}
  .bt-sec:hover{background:#dbeef8}
  .bt-ghost{background:#fff;color:var(--muted);border-color:#cfd6de}
  .bt-ghost:hover{color:var(--ink);border-color:var(--brand-3)}
  .bt-ok{background:var(--ok-soft);color:var(--ok);border-color:#cfeeda}
  .bt-err{background:var(--err-soft);color:var(--err);border-color:#eed6d3}
  .bt:disabled{opacity:.5;cursor:not-allowed}
  .exp{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

  /* ------------------------------- estados ------------------------------ */
  .badge{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .b-rascunho{background:#eceff3;color:var(--muted)}
  .b-submetido{background:var(--info-soft);color:var(--info)}
  .b-devolvido{background:var(--warn-soft);color:var(--warn)}
  .b-aprovado{background:var(--ok-soft);color:var(--ok)}
  .b-concluido{background:var(--roxo-soft);color:var(--roxo)}
  .b-reprovado{background:var(--err-soft);color:var(--err)}
  .b-prevista{background:#eceff3;color:var(--muted)}
  .b-andamento{background:var(--info-soft);color:var(--info)}
  .b-concluida{background:var(--ok-soft);color:var(--ok)}
  .b-atrasada{background:var(--err-soft);color:var(--err)}
  .b-enviado{background:var(--info-soft);color:var(--info)}
  .b-validado{background:var(--ok-soft);color:var(--ok)}
  .banner{border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;font-weight:500}
  .ba-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0e0bd}
  .ba-err{background:var(--err-soft);color:var(--err);border:1px solid #eed6d3}
  .ba-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #cfeeda}
  .ba-info{background:var(--info-soft);color:var(--info);border:1px solid #cfe6f2}

  /* -------------------------------- listas ------------------------------ */
  .item{display:flex;align-items:center;gap:14px;padding:15px 18px;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .item:hover{border-color:var(--brand-3);box-shadow:0 2px 10px -4px rgba(28,55,66,.18)}
  .item .nm{font-weight:600;flex:1;min-width:0;font-size:14px;color:var(--ink)}
  .item .cs{color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  .num{font-family:Sora,sans-serif;font-size:12px;font-weight:700;color:var(--brand-3);white-space:nowrap}
  table.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.pt th{background:#f7f9fb;color:var(--muted);padding:9px 10px;text-align:left;font-size:11.5px;
    font-weight:600;border-bottom:1px solid var(--line)}
  table.pt td{border-bottom:1px solid var(--line-2);padding:8px 10px;color:var(--ink-soft);vertical-align:middle}
  table.pt td input,table.pt td select{font-size:12.5px;padding:7px 8px}
  table.pt .rm{color:var(--err);cursor:pointer;font-weight:700;background:none;border:0;font-size:15px}
  .rolo{overflow-x:auto}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .filtros select,.filtros input{width:auto;min-width:150px;font-size:13px;padding:8px 10px}
  .bloco{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;background:#fcfdfe}
  .bloco.meu{border-color:#cfe6f2;background:#f7fbfd}
  .bloco-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .bloco-cab .t{font-weight:600;font-size:14px;color:var(--ink);flex:1;min-width:0}
  .prazo{font-size:12px;color:var(--muted);white-space:nowrap}
  .tut{background:var(--info-soft);border:1px solid #cfe6f2;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:13px}
  .tut summary{font-family:Sora,sans-serif;font-weight:700;color:var(--brand);cursor:pointer;font-size:13.5px}
  .tut ol{margin:10px 0 4px 20px}
  .tut li{margin-bottom:5px}
  .hide{display:none!important}

  @media(max-width:760px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .side-nav{padding:8px 10px;flex:1 1 100%;order:3;overflow-x:auto}
    .side-nav #menu{display:flex;gap:6px}
    .side-lab{display:none}
    .side-item{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px}
    .side-item.on{border-left:0;border-bottom-color:var(--accent)}
    .side-pe{border-top:0;margin-left:auto}
    .area{padding:20px 16px}
    .kpis{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <a class="side-marca" href="/" title="Voltar ao portal">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 37 L8 20 A12 12 0 0 1 32 20 L32 37" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4" fill="#71c8e2"/></svg>
      <span>ARCHÉ <b>IC</b></span>
    </a>
    <div class="side-nav"><div id="menu"></div></div>
    <div class="side-pe" id="rodape-usuario"></div>
  </nav>

  <div class="conteudo">
    <div class="topbar">
      <div class="crumb">ARCHÉ IC <span style="color:var(--muted-2)">/</span> <b id="crumb">Painel</b></div>
      <div class="dir"><span id="dir-info"></span></div>
    </div>

    <div class="area">
      <div class="limite">
        <h1 id="titulo">Painel</h1>
        <div class="sub" id="subtitulo">Iniciação Científica — PIBIC, PIBITI e voluntária.</div>
        <div id="aviso"></div>

        <section id="v-painel" class="hide"></section>
        <section id="v-submissao" class="hide"></section>
        <section id="v-gestao" class="hide"></section>
        <section id="v-cronograma" class="hide"></section>
        <section id="v-relatorios" class="hide"></section>
        <section id="v-projeto" class="hide"></section>
      </div>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   ARCHÉ IC — Iniciação Científica.
   Projeto: rascunho → submetido → avaliado pela PROPPEX → em execução.
   Cronograma e relatórios ficam presos ao projeto; cada pessoa vê o que
   é dela (a regra vive no servidor, em lib/ic.js).
   ====================================================================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtD = (iso) => (iso ? String(iso).split("-").reverse().join("/") : "—");
const fmtDH = (iso) => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "—"; };
const hojeISO = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date());

let META = { cursos: [], modalidades: [], status: [], rotulos: {}, gestao: false, eu: "", perfil: "orientador" };
let PROJETOS = [], ETAPAS = [], RELS = { relatorios: [], pendentes: [] };
let ATUAL = null, PODE = {}, ME = null, SECAO = "painel";
let FILTRO = { status: "", curso: "", q: "" };

const SECOES = [
  { id: "painel", grupo: "INÍCIO", rot: "Painel", ic: '<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>' },
  { id: "submissao", grupo: "PROJETOS", rot: "Submissão", ic: '<path d="M12 5v14M5 12h14"/>', semAluno: true },
  { id: "gestao", grupo: "PROJETOS", rot: "Gestão", ic: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/>', semAluno: true },
  { id: "cronograma", grupo: "ACOMPANHAMENTO", rot: "Cronograma", ic: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>' },
  { id: "relatorios", grupo: "ACOMPANHAMENTO", rot: "Relatórios", ic: '<path d="M4 4a2 2 0 0 1 2-2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 2v5h5M8 13h8M8 17h5"/>' },
];

const TITULOS = {
  painel: ["Painel", "Situação dos projetos de Iniciação Científica."],
  submissao: ["Submissão de projeto", "Preencha a proposta e submeta à avaliação da PROPPEX."],
  gestao: ["Gestão de projetos", "Projetos submetidos, em execução e concluídos."],
  cronograma: ["Cronograma", "Todas as atividades dos projetos num só lugar."],
  relatorios: ["Relatórios", "Parciais e finais: o aluno envia, a orientação valida."],
  projeto: ["Projeto", ""],
};

/* ------------------------------- infra --------------------------------- */
async function api(url, opcoes) {
  const r = await fetch(url, opcoes);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Falha (${r.status})`);
  return j;
}
function aviso(msg, tipo = "ok") {
  $("aviso").innerHTML = `<div class="banner ba-${tipo}">${esc(msg)}</div>`;
  if (tipo === "ok") setTimeout(() => { if ($("aviso").textContent === msg) $("aviso").innerHTML = ""; }, 6000);
  window.scrollTo(0, 0);
}
const cursoNome = (slug) => (META.cursos.find((c) => c.slug === slug) || {}).nome || slug || "—";
const modNome = (c) => (META.modalidades.find((m) => m.codigo === c) || {}).nome || c || "—";
const chip = (s) => `<span class="badge b-${esc(s)}">${esc(META.rotulos[s] || s)}</span>`;
const ehAluno = () => META.perfil === "aluno";

async function sair() {
  try { await fetch("/auth/sair", { method: "POST" }); } catch { /* ignora */ }
  location.href = "/";
}

/* ------------------------------ navegação ------------------------------ */
function montarSidebar() {
  let grupo = "";
  $("menu").innerHTML = SECOES
    .filter((s) => !(ehAluno() && s.semAluno))
    .map((s) => {
      const cab = s.grupo !== grupo ? `<div class="side-lab">${s.grupo}</div>` : "";
      grupo = s.grupo;
      const n = s.id === "relatorios" ? RELS.relatorios.filter((r) => r.podeValidar).length : 0;
      return `${cab}<button class="side-item" data-s="${s.id}" onclick="nav('${s.id}')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${s.ic}</svg>
        ${s.rot}${n ? `<span class="tag">${n}</span>` : ""}</button>`;
    }).join("");

  const ini = (ME?.nome || ME?.email || "?").trim()[0]?.toUpperCase() || "?";
  const foto = ME?.perfil?.foto;
  const papel = META.gestao ? "coordenação" : ehAluno() ? "aluno de IC" : "orientação";
  $("rodape-usuario").innerHTML = ME ? `
    <a class="av" href="/perfil/" title="Meu perfil">${foto ? `<img src="${esc(foto)}" alt="">` : esc(ini)}</a>
    <div style="min-width:0">
      <div class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((ME.nome || ME.email).split(" ").slice(0, 2).join(" "))}</div>
      <div class="pp">${papel}</div>
    </div>
    <button class="sair" onclick="sair()">sair</button>` : "";
  for (const b of document.querySelectorAll(".side-item")) b.classList.toggle("on", b.dataset.s === SECAO);
}

function nav(secao, id) {
  SECAO = secao;
  for (const b of document.querySelectorAll(".side-item")) b.classList.toggle("on", b.dataset.s === secao);
  for (const v of ["painel", "submissao", "gestao", "cronograma", "relatorios", "projeto"]) $("v-" + v).classList.add("hide");
  // submissão e projeto compartilham o editor (mesmos ids): a seção que sai
  // do ar é esvaziada, senão getElementById acha os campos escondidos
  for (const v of ["submissao", "projeto"]) if (v !== secao) $("v-" + v).innerHTML = "";

  const [t, s] = TITULOS[secao] || ["", ""];
  $("titulo").textContent = t; $("subtitulo").textContent = s; $("crumb").textContent = t;
  $("aviso").innerHTML = "";

  if (secao === "painel") renderPainel();
  if (secao === "submissao") { ATUAL = novoProjeto(); PODE = { podeEditar: true, papel: "orientador" }; renderEditor("v-submissao"); }
  if (secao === "gestao") renderGestao();
  if (secao === "cronograma") renderCronograma();
  if (secao === "relatorios") renderRelatorios();
  $("v-" + secao).classList.remove("hide");
  window.scrollTo(0, 0);
}

/* -------------------------------- dados -------------------------------- */
async function carregar() {
  const [lista, crono, rel] = await Promise.all([
    api("/api/ic"), api("/api/ic/cronograma"), api("/api/ic/relatorios"),
  ]);
  PROJETOS = lista.projetos || [];
  ETAPAS = crono.etapas || [];
  RELS = { relatorios: rel.relatorios || [], pendentes: rel.pendentes || [] };
}

async function abrir(id) {
  try {
    const r = await api("/api/ic/" + id);
    ATUAL = r.projeto; PODE = r;
    nav("projeto");
    $("crumb").textContent = ATUAL.numero || "Projeto";
    $("titulo").textContent = ATUAL.numero || "Projeto";
    $("subtitulo").textContent = ATUAL.titulo || "";
    renderEditor("v-projeto");
  } catch (e) { aviso(e.message, "err"); }
}

function novoProjeto() {
  return {
    titulo: "", resumo: "", palavrasChave: "", curso: "", modalidade: "pibic", edital: "",
    linhaPesquisa: "", objetivos: "", metodologia: "", inicio: "", fim: "",

/* ------------------------------ cronograma ----------------------------- */
function renderCronograma() {
  const porProjeto = new Map();
  for (const e of ETAPAS) {
    if (!porProjeto.has(e.projetoId)) porProjeto.set(e.projetoId, []);
    porProjeto.get(e.projetoId).push(e);
  }
  const hoje = hojeISO();

  $("v-cronograma").innerHTML = `
    <div class="tut"><details><summary>Como o cronograma funciona</summary>
      <ol>
        <li>Cada atividade pertence a um projeto e pode ter um <b>responsável</b> — um aluno indicado, ou a própria orientação.</li>
        <li>${ehAluno()
          ? "Você vê aqui somente as atividades sob a sua responsabilidade, de todos os projetos em que foi indicado."
          : "Você vê aqui as atividades de todos os seus projetos, reunidas num só lugar."}</li>
        <li>A atividade fica <b>atrasada</b> sozinha, quando passa da data de fim sem ser concluída.</li>
      </ol></details></div>

    ${!ETAPAS.length ? `<div class="card"><div class="vazio">Nenhuma atividade ainda.
      ${ehAluno() ? "Quem orienta monta o cronograma do projeto." : "O cronograma é montado dentro de cada projeto."}</div></div>` : ""}

    ${[...porProjeto.entries()].map(([pid, etapas]) => {
      const p = etapas[0];
      const feitas = etapas.filter((e) => e.situacao === "concluida").length;
      return `<div class="card">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">
          <div style="flex:1;min-width:0">
            <div class="card-t" style="cursor:pointer" onclick="abrir('${esc(pid)}')">${esc(p.titulo || "(sem título)")}</div>
            <div class="card-s" style="margin-bottom:0">${esc(p.numero || "sem número")} · ${esc(cursoNome(p.curso))}
              · orientação: ${esc(p.orientador)}</div>
          </div>
          <span class="badge b-${esc(p.status)}">${esc(META.rotulos[p.status] || p.status)}</span>
          <span class="prazo">${feitas}/${etapas.length} concluída(s)</span>
        </div>
        <div class="rolo"><table class="pt">
          <thead><tr><th style="width:40%">Atividade</th><th>Responsável</th><th>Início</th><th>Fim</th><th>Situação</th></tr></thead>
          <tbody>${etapas.map((e) => `<tr>
            <td>${esc(e.atividade)}${e.observacao ? `<div class="muted">${esc(e.observacao)}</div>` : ""}</td>
            <td>${esc(e.responsavelNome)}${e.meu ? ' <span class="badge b-andamento">você</span>' : ""}</td>
            <td>${fmtD(e.inicio)}</td><td>${fmtD(e.fim)}</td>
            <td>${e.situacao !== "concluida" && e.fim && e.fim < hoje
              ? `<span class="badge b-atrasada">atrasada</span>` : chip2(e.situacao)}</td>
          </tr>`).join("")}</tbody>
        </table></div>
      </div>`;
    }).join("")}`;
}

async function validar(projetoId, relId, decisao) {
  let parecer = "";
  if (decisao === "devolvido") {
    parecer = prompt("O que o aluno precisa corrigir?") || "";
    if (parecer.trim().length < 10) return aviso("Escreva o parecer da devolução.", "warn");
  } else {
    parecer = prompt("Parecer da validação (opcional):") ?? "";
  }
  try {
    await api(`/api/ic/${projetoId}/relatorio/${relId}/validar`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decisao, parecer }),
    });
    await carregar(); montarSidebar();
    if (SECAO === "projeto") abrir(projetoId); else renderRelatorios();
    aviso(decisao === "validado" ? "Relatório validado." : "Relatório devolvido ao aluno.");
  } catch (e) { aviso(e.message, "err"); }
}

  const ger = PODE.podeGerir || PODE.podeEditar;

    <tr>

      <td><input type="email" ${ger ? "" : "disabled"} value="${esc(a.email || "")}" oninput="ATUAL.alunos[${i}].email=this.value;desenharEtapas()"></td>
      <td><input ${ger ? "" : "disabled"} value="${esc(a.matricula || "")}" oninput="ATUAL.alunos[${i}].matricula=this.value"></td>
      <td><input type="checkbox" style="width:auto" ${a.bolsista ? "checked" : ""} ${ger ? "" : "disabled"} onchange="ATUAL.alunos[${i}].bolsista=this.checked"></td>
      <td>${ger ? `<button class="rm" title="remover" onclick="ATUAL.alunos.splice(${i},1);desenharAlunos();desenharEtapas()">×</button>` : ""}</td>
    </tr>`).join("") || `<tr><td colspan="5" class="muted">Nenhum aluno indicado. Sem aluno, o projeto anda, mas não há relatórios a entregar.</td></tr>`;
}

      <td><input type="date" ${ro} value="${esc(e.fim || "")}" onchange="ATUAL.cronograma[${i}].fim=this.value"></td>
      <td><select ${ro} onchange="ATUAL.cronograma[${i}].situacao=this.value">
        ${["prevista", "andamento", "concluida"].map((s) => `<option value="${s}" ${e.situacao === s ? "selected" : ""}>${{ prevista: "prevista", andamento: "em andamento", concluida: "concluída" }[s]}</option>`).join("")}
      </select></td>
      <td>${ger ? `<button class="rm" title="remover" onclick="ATUAL.cronograma.splice(${i},1);desenharEtapas()">×</button>` : ""}</td>
    </tr>`).join("") || `<tr><td colspan="6" class="muted">Nenhuma atividade. O cronograma é obrigatório para submeter.</td></tr>`;
}
function addEtapa() { ATUAL.cronograma = [...(ATUAL.cronograma || []), { atividade: "", responsavel: "", inicio: "", fim: "", situacao: "prevista" }]; desenharEtapas(); }

/* ------------------- relatórios dentro do projeto ---------------------- */
function renderRelatoriosDoProjeto(p) {
  const meus = p.relatorios || [];
  const souAluno = PODE.papel === "aluno";
  const emExecucao = ["aprovado", "concluido"].includes(p.status);

  const bloco = (r) => `
    <div class="bloco ${r.aluno === META.eu ? "meu" : ""}">
      <div class="bloco-cab">
        <span class="t">Relatório ${esc(r.tipo)} — ${esc((p.alunos || []).find((a) => a.email === r.aluno)?.nome || r.aluno)}</span>
        <span class="badge b-${esc(r.situacao)}">${esc({ enviado: "aguardando validação", validado: "validado", devolvido: "devolvido" }[r.situacao] || r.situacao)}</span>
      </div>
      <div class="muted">Enviado em ${fmtDH(r.enviadoEm)}${r.periodo ? ` · período: ${esc(r.periodo)}` : ""}</div>
      <div class="kv" style="white-space:pre-wrap;margin-top:8px">${esc(r.resumo || "")}</div>
      ${(r.anexos || []).length ? `<div class="kv" style="margin-top:6px"><b>Anexos:</b> ${r.anexos.map((a) => `<a href="${esc(a.link || "#")}" target="_blank" rel="noopener">${esc(a.name)}</a>`).join(" · ")}</div>` : ""}
      ${r.parecer ? `<div class="kv" style="margin-top:6px"><b>Parecer:</b> ${esc(r.parecer)}</div>` : ""}
      ${PODE.podeValidar && r.situacao === "enviado" ? `<div class="exp">
        <button class="bt bt-ok" onclick="validar('${esc(p.id)}','${esc(r.id)}','validado')">✓ Validar</button>
        <button class="bt bt-err" onclick="validar('${esc(p.id)}','${esc(r.id)}','devolvido')">Devolver</button></div>` : ""}
    </div>`;

  const meuRel = (tipo) => meus.find((r) => r.tipo === tipo && r.aluno === META.eu);
  const formulario = (tipo) => {
    const r = meuRel(tipo);
    if (r && r.situacao !== "devolvido") return "";
    return `<div class="bloco">
      <div class="bloco-cab"><span class="t">Enviar relatório ${tipo}</span>
        ${r ? `<span class="badge b-devolvido">devolvido — reenvie corrigido</span>` : ""}</div>
      <label>Período coberto</label>
      <input id="per-${tipo}" placeholder="${tipo === "parcial" ? "agosto a dezembro de 2026" : "todo o período do projeto"}" value="${esc(r?.periodo || "")}">
      <label>Relatório * <span class="muted">(mínimo de 200 caracteres)</span></label>
      <textarea id="txt-${tipo}" style="min-height:160px">${esc(r?.resumo || "")}</textarea>
      <div class="exp"><button class="bt bt-pri" onclick="enviarRelatorio('${tipo}')">Enviar relatório ${tipo}</button></div>
    </div>`;
  };

  return `<div class="card">
    <div class="card-t">Relatórios</div>
    <div class="card-s">Parcial e final de cada aluno indicado. Quem envia é o aluno; quem valida é a orientação.</div>
    ${!emExecucao ? `<div class="banner ba-info">Os relatórios abrem quando o projeto é aprovado.</div>` : ""}
    ${meus.map(bloco).join("")}
    ${emExecucao && souAluno ? formulario("parcial") + formulario("final") : ""}
    ${!meus.length && !souAluno ? `<div class="vazio">Nenhum relatório enviado ainda.</div>` : ""}
  </div>`;
}

async function enviarRelatorio(tipo) {
  const resumo = $("txt-" + tipo).value.trim();
  const periodo = $("per-" + tipo).value.trim();
  if (resumo.length < 200) return aviso("O relatório precisa de ao menos 200 caracteres.", "warn");
  try {
    await api(`/api/ic/${ATUAL.id}/relatorio`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tipo, resumo, periodo }),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso("Relatório enviado. A orientação foi notificada dentro do sistema.");
  } catch (e) { aviso(e.message, "err"); }
}

/* ------------------------------- ações --------------------------------- */
async function salvar() {
  try {
    const r = await api("/api/ic", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ATUAL),
    });
    ATUAL = r.projeto;
    await carregar(); montarSidebar();
    if (SECAO === "submissao") { nav("projeto"); await abrir(ATUAL.id); }
    aviso("Projeto salvo.");
  } catch (e) { aviso(e.message, "err"); }
}

async function submeter() {
  try {
    if (!ATUAL.id) {
      const r = await api("/api/ic", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ATUAL) });
      ATUAL = r.projeto;
    } else {
      await api("/api/ic", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ATUAL) });
    }
    if (!confirm("Submeter o projeto à avaliação da PROPPEX? Depois disso a proposta fica fechada para edição.")) return;
    const r = await api(`/api/ic/${ATUAL.id}/submeter`, { method: "POST" });
    await carregar(); montarSidebar(); await abrir(r.projeto.id);
    aviso(`Projeto submetido — protocolo ${r.projeto.numero}.`);
  } catch (e) { aviso(e.message, "err"); }
}

async function avaliar(decisao) {
  const rotulo = { aprovado: "Aprovar", devolvido: "Devolver para ajustes", reprovado: "Reprovar" }[decisao];
  const parecer = prompt(`${rotulo} — parecer da coordenação${decisao === "aprovado" ? " (opcional)" : ""}:`) ?? "";
  if (decisao !== "aprovado" && parecer.trim().length < 10) return aviso("Escreva o parecer.", "warn");
  try {
    const r = await api(`/api/ic/${ATUAL.id}/avaliar`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ decisao, parecer }),
    });
    await carregar(); montarSidebar(); await abrir(r.projeto.id);
    aviso(`Projeto ${decisao}.`);
  } catch (e) { aviso(e.message, "err"); }
}

async function excluir() {
  if (!confirm("Excluir este rascunho? Não há como desfazer.")) return;
  try {
    await api("/api/ic/" + ATUAL.id, { method: "DELETE" });
    await carregar(); montarSidebar(); nav("gestao");
    aviso("Rascunho excluído.");
  } catch (e) { aviso(e.message, "err"); }
}

/* -------------------------------- início ------------------------------- */
(async function iniciar() {
  try {
    const r = await fetch("/api/me");
    if (r.status === 401) { location.href = "/entrar?next=" + encodeURIComponent(location.pathname); return; }
    ME = await r.json();
    if (ME.papel === "pendente") { location.href = "/entrar?pendente=1"; return; }
    META = await api("/api/ic/meta");
    await carregar();
  } catch (e) {
    $("aviso").innerHTML = `<div class="banner ba-err">${esc(e.message || "Falha ao carregar o setor")}</div>`;
  }
  montarSidebar();
  nav("painel");
  $("dir-info").textContent = META.gestao ? "coordenação de pesquisa" : ehAluno() ? "aluno de IC" : "orientação";
})();
</script>
<script src="/assets/arche-nav.js" defer></script>
</body>
