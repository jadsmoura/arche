}

/* A via do termo de compromisso de quem orienta, ao lado do projeto — só
   depois da publicação, e só para o próprio professor (a gestão emite o lote
   pela guia Bolsistas e Voluntários). */
function blocoTermoDaOrientacao(p) {
  if (META.gestao || p.papel !== "orientador") return "";
  if (!["aprovado", "concluido"].includes(p.status)) return "";
  if (!termosLiberados(p.edital || META.edital?.numero)) return "";
  return `<div class="exp" style="padding:0 14px 12px">
    <a class="bt bt-sec" target="_blank" rel="noopener" href="/api/ic/termo.pdf?projeto=${encodeURIComponent(p.id)}"
      title="Termo de compromisso da orientação, com as assinaturas da reitoria">📄 Meu termo de orientação</a>
  </div>`;
}

/* A devolutiva da seleção, para quem submeteu (decisão do dono, ago/2026).
   Fica colada ao projeto, recolhida: o professor abre quando quiser. Traz o
   QUE o parecer disse — critérios, recomendação e texto —, nunca QUEM o
   escreveu: a avaliação é cega, e o anonimato protege o parecerista. */
function blocoAvaliacaoRecebida(p) {
  const av = p.avaliacaoRecebida;
  if (!av || !av.pareceres?.length) return "";
  const varios = av.pareceres.length > 1;
  return `<details class="aval-rec">
    <summary>Avaliação recebida${av.nota != null ? ` — nota do projeto <b>${av.nota}</b>` : ""}${
      varios ? ` · ${av.pareceres.length} pareceres` : ""}</summary>
    ${av.pareceres.map((x, i) => `<div class="aval-item">
      ${varios ? `<div class="aval-t">Parecer ${i + 1}</div>` : ""}
      <table class="pt" style="margin:6px 0 8px">
        <tbody>
          ${(META.criterios || []).map((c) => `<tr><td>${esc(c.nome)}</td>
            <td style="width:110px;text-align:right"><b>${x.notas?.[c.codigo] ?? "—"}</b>
              <span class="muted">de ${c.peso}</span></td></tr>`).join("")}
          <tr><td><b>Nota do projeto</b></td>
            <td style="text-align:right"><b>${x.nota ?? "—"}</b> <span class="muted">de 100</span></td></tr>
        </tbody>
      </table>
      ${x.recomendacao ? `<div style="margin-bottom:6px"><b>Recomendação:</b> ${esc(recNome(x.recomendacao))}</div>` : ""}
      ${x.parecer ? `<div style="white-space:pre-wrap;line-height:1.6">${esc(x.parecer)}</div>` : ""}
    </div>`).join("")}
    <div class="muted" style="margin-top:10px">Quem avaliou não é identificado: a avaliação é cega.
      A nota final do processo soma esta nota do projeto à pontuação do seu currículo.</div>
    ${blocoContestacao(p)}
  </details>`;
}

/* Contestação da nota: existe entre o resultado preliminar e o final, com
   três dias contados da publicação do preliminar. Passado o prazo, o quadro
   continua ali dizendo que encerrou — sumir daria a impressão de que nunca
   houve a chance. */
function blocoContestacao(p) {
  const c = p.contestacao;
  if (!c) return "";
  if (c.minha) {
    return `<div class="cont-box">
      <div class="cont-t">Contestação enviada em ${fmtDH(c.minha.em)}</div>
      <div style="white-space:pre-wrap;line-height:1.55;margin-top:4px">${esc(c.minha.texto)}</div>
      ${c.minha.resposta
        ? `<div class="cont-resp"><b>Resposta da coordenação</b> · ${fmtDH(c.minha.respondidoEm)}
            <div style="white-space:pre-wrap;line-height:1.55;margin-top:3px">${esc(c.minha.resposta)}</div></div>`
        : `<div class="muted" style="margin-top:8px">Aguardando a análise da coordenação.</div>`}
    </div>`;
  }
  if (!c.aberta) {
    return `<div class="cont-box">
      <div class="muted">${c.motivo === "resultado-final"
        ? "O resultado final já foi publicado — o prazo de contestação era entre o preliminar e o final."
        : c.motivo === "sem-preliminar" ? "A contestação abre com a publicação do resultado preliminar."
        : `Prazo de contestação encerrado em ${fmtDH(c.ate)}.`}</div>
    </div>`;
  }
  return `<div class="cont-box">
    <div class="cont-t">Não concorda com a nota?</div>
    <div class="muted" style="margin:2px 0 8px">Você pode enviar uma <b>contestação formal</b> até
      ${fmtDH(c.ate)}${c.horasRestantes ? ` — faltam ${c.horasRestantes} hora(s)` : ""}. A coordenação
      analisa e responde aqui mesmo, antes do resultado final. É uma por projeto.</div>
    <button class="bt bt-sec" onclick="contestar('${esc(p.id)}')">Contestar a nota</button>
  </div>`;
}

async function contestar(id) {
  const texto = (prompt("Contestação da nota — descreva a razão do seu pedido de revisão.\n\n"
    + "Ela vai para a coordenação de pesquisa e fica registrada no projeto.") || "").trim();
  if (!texto) return;
  if (texto.length < 30) return aviso("Descreva a razão da contestação (mínimo de 30 caracteres).", "err");
  try {
    await api(`/api/ic/${encodeURIComponent(id)}/contestacao`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto }),
    });
    await carregar();
    renderGestao();
    aviso("Contestação enviada. A coordenação responde aqui mesmo, antes do resultado final.");
  } catch (e) { aviso(e.message, "err"); }
}

/* ------------------------- avaliação da seleção ------------------------ */
function renderAvaliacao() {
  const emSelecao = PROJETOS.filter((p) => p.status === "submetido");
  // o que passou pelas mãos do avaliador continua à vista depois da decisão:
  // o parecer é dele e ele precisa poder reler o que assinou
  const meus = PROJETOS.filter((p) => p.meuParecer);
  const aFazer = meus.filter((p) => p.aDarParecer);
  const feitos = meus.filter((p) => !p.aDarParecer);

  const cartao = (p, comPlacar) => `
    <div class="bloco ${p.aDarParecer ? "meu" : ""}">
      <div class="bloco-cab">
        <span class="num">${esc(p.numero || "—")}</span>
        <span class="t">${esc(p.titulo || "(sem título)")}</span>
        ${p.meuParecer ? `<span class="badge b-${p.meuParecer.situacao === "entregue" ? "validado" : p.meuParecer.situacao === "recusado" ? "reprovado" : "enviado"}">${esc({ designado: "parecer pendente", entregue: "parecer entregue", recusado: "avaliação recusada" }[p.meuParecer.situacao])}</span>` : ""}
      </div>
      <div class="muted">${esc(cursoNome(p.curso))} · ${esc(modNome(p.modalidade))}${p.edital ? ` · ${esc(p.edital)}` : ""}${
        p.orientador ? ` · orientação: ${esc(p.orientador.nome || p.orientador.email)}` : ""}</div>
      ${comPlacar && p.placar ? `<div class="muted" style="margin-top:6px">
        ${p.placar.entregues}/${p.placar.designados} parecer(es) entregue(s)${p.placar.recusados ? ` · ${p.placar.recusados} recusa(s)` : ""}
        ${p.placar.media !== null ? ` · nota média <b>${p.placar.media}</b>` : ""}
        ${p.placar.entregues ? ` · ${p.placar.recomendam} recomenda(m), ${p.placar.ressalvas} com ressalvas, ${p.placar.contra} contra` : ""}</div>` : ""}
      <div class="exp"><button class="bt ${p.aDarParecer ? "bt-pri" : "bt-ghost"}" onclick="abrir('${esc(p.id)}')">
        ${p.aDarParecer ? "Dar parecer" : "Abrir o projeto"}</button></div>
    </div>`;

  $("v-avaliacao").innerHTML = `
    <div class="tut"><details><summary>Como funciona a avaliação ad hoc</summary>
      <ol>
        <li>A coordenação designa os avaliadores <b>dentro de cada projeto</b>, pelo e-mail — é a designação que dá o acesso.</li>
        <li>O avaliador vê apenas os projetos que recebeu, e neles só a proposta: nada de relatórios, histórico ou parecer dos colegas.</li>
        <li>O projeto vale <b>de 0 a 100</b>: sete critérios, cada um com o seu teto de pontos, e a nota é a soma. Havendo mais de um parecer, vale a média das somas.</li>
        <li>Havendo impedimento, o avaliador <b>recusa</b> a avaliação dizendo o motivo — não fica travando a seleção.</li>
        <li>A orientação nunca sabe quem avaliou: recebe a decisão da coordenação, e é a ela que responde.</li>
      </ol></details></div>

    ${aFazer.length ? `<div class="card">
      <div class="card-t">Aguardando o seu parecer</div>
      <div class="card-s">${aFazer.length} projeto(s).</div>
      ${aFazer.map((p) => cartao(p, false)).join("")}
    </div>` : ""}

    ${feitos.length ? `<div class="card">
      <div class="card-t">Já passaram por você</div>
      <div class="card-s">Pareceres entregues, avaliações recusadas e projetos cuja seleção já foi decidida.</div>
      ${feitos.map((p) => cartao(p, false)).join("")}
    </div>` : ""}

    ${META.gestao ? `<div class="card">
      <div class="card-t">Projetos em seleção</div>
      <div class="card-s">${emSelecao.length} projeto(s) submetido(s) aguardando decisão.</div>
      ${emSelecao.map((p) => cartao(p, true)).join("") || `<div class="vazio">Nenhum projeto em avaliação no momento.</div>`}
    </div>` : ""}

    ${!meus.length && !META.gestao ? `<div class="card"><div class="vazio">
      Nenhum projeto designado a você no momento.</div></div>` : ""}`;
}

/* ------------------------ bolsistas e voluntários ----------------------- */
/* O acompanhamento por PESSOA: cada aluno em execução com as suas demandas —
   as metas do cronograma sob a responsabilidade dele e a entrega dos
   relatórios frente aos prazos do edital. Organizado por CICLO (edital),
   porque a cada ciclo os alunos e as metas mudam. O professor vê os seus;
   a gestão vê todos, agrupados por orientador. */
function renderBolsistas() {
  const fmtBr = (iso) => iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "—";
  const emExec = PROJETOS.filter((p) => ["aprovado", "concluido"].includes(p.status));

  const cartaoAluno = (p, a) => {
    const metas = ETAPAS.filter((e) => e.projetoId === p.id && e.responsavel === a.email);
    const feitas = metas.filter((e) => e.situacao === "concluida").length;
    const atrasadas = metas.filter((e) => e.situacao !== "concluida" && e.fim && e.fim < hojeISO()).length;
    const souEuMesmo = ehAluno() && a.email === META.eu;
    const relDe = (tipo) => RELS.relatorios.find((x) => x.projetoId === p.id && x.aluno === a.email && x.tipo === tipo);
    const rel = (tipo) => {
      const r = relDe(tipo);
      const prazo = (p.prazoRelatorios?.prazos || []).find((x) => x.tipo === tipo);
      const aberto = prazo?.abre && hojeISO() >= prazo.abre;
      const chip = r ? `<span class="badge b-${esc(r.situacao)}">${tipo}: ${esc({ enviado: "enviado", validado: "validado", devolvido: "devolvido" }[r.situacao] || r.situacao)}</span>`
        : prazo?.atrasado ? `<span class="badge b-atrasada">${tipo}: atrasado (venceu ${fmtBr(prazo.vence)})</span>`
          : `<span class="badge b-rascunho">${tipo}: até ${fmtBr(prazo?.vence)}</span>`;
      // o ALUNO preenche (janela aberta, sem relatório validado/enviado);
      // o PROFESSOR valida quando há relatório enviado esperando por ele
      const acao = souEuMesmo && p.status === "aprovado" && aberto && (!r || r.situacao === "devolvido")
        ? `<button class="bt bt-sec" onclick="abrirRelatorio('${esc(p.id)}','${tipo}')">${r ? "corrigir" : "preencher"} relatório</button>`
        : !META.gestao && !ehAluno() && r?.situacao === "enviado"
          ? `<button class="bt bt-ok" onclick="abrirRelatorio('${esc(p.id)}','${tipo}')">Relatório ${tipo} — validar</button>`
          : "";
      return chip + (acao ? " " + acao : "");
    };
    const contrato = a.bolsista
      ? ((a.dadosCompletos ?? !!(a.cpf && a.banco && a.conta && a.pix))
        ? '<span class="badge b-validado">contrato: dados completos</span>'
        : '<span class="badge b-enviado">contrato: aguardando o aluno</span>')
      : "";
    const linhaDado = (rot, v) => v ? `<div class="kv muted">• ${rot}: <b>${esc(v)}</b></div>` : "";
    return `<div class="bloco">
      <div class="bloco-cab">
        <span class="t">${esc(a.nome || a.email || "Aluno")}</span>
        <span class="badge b-${a.bolsista ? "aprovado" : "prevista"}">${a.bolsista ? "bolsista" : "voluntário"}</span>
        ${a.email ? "" : '<span class="badge b-atrasada">sem e-mail — sem acesso</span>'}
      </div>
      <div class="muted" style="margin-bottom:6px">${esc(p.numero || "")} · ${esc(p.titulo || "")}${a.curso ? ` · ${esc(a.curso)}` : ""}${a.periodo ? ` · ${esc(a.periodo)}` : ""}</div>
      <div class="exp" style="gap:6px">
        ${p.status === "concluido"
          ? '<span class="badge b-validado">ciclo encerrado</span>'
          : `<span class="badge b-${atrasadas ? "atrasada" : "validado"}">metas: ${feitas}/${metas.length} concluída(s)${atrasadas ? ` · ${atrasadas} atrasada(s)` : ""}</span>
        ${rel("parcial")} ${rel("final")}`} ${contrato}
      </div>
      ${META.gestao ? `<details style="margin-top:6px">
        <summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">👤 Dados do aluno (cadastro do contrato)</summary>
        <div style="margin-top:6px">
          ${linhaDado("CPF", a.cpf ? a.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : "")}
          ${linhaDado("RG", a.rg)}
          ${linhaDado("Nascimento", a.nascimento ? String(a.nascimento).split("-").reverse().join("/") : "")}
          ${linhaDado("Endereço", a.endereco)}
          ${linhaDado("Telefone (WhatsApp)", a.telefone)}
          ${linhaDado("E-mail", a.email)}
          ${linhaDado("Vínculo empregatício", a.vinculo === "sim" ? `sim${a.vinculoOnde ? " — " + a.vinculoOnde : ""}` : a.vinculo === "nao" ? "não" : "")}
          ${linhaDado("Banco", a.banco)} ${linhaDado("Agência", a.agencia)}
          ${linhaDado("Conta", a.conta)} ${linhaDado("Pix", a.pix)}
          ${!a.cpf && !a.banco ? '<div class="kv muted">O aluno ainda não enviou o cadastro (guia Bolsa).</div>' : ""}
        </div>
      </details>` : ""}
      <div class="exp"><button class="bt bt-ghost" onclick="abrir('${esc(p.id)}')">Abrir o projeto</button>
        ${META.gestao && a.bolsista ? `<a class="bt bt-ghost" target="_blank" rel="noopener"
          href="/api/ic/termos.pdf?edital=${encodeURIComponent(p.edital || META.edital?.numero || "")}&projeto=${encodeURIComponent(p.id)}"
          title="Termo de compromisso deste projeto, para assinatura">📝 Termo</a>
        <a class="bt bt-ghost" href="/api/ic/bolsistas.xlsx?edital=${encodeURIComponent(p.edital || META.edital?.numero || "")}&aluno=${encodeURIComponent(a.email || a.cpf || "")}"
          title="Planilha só deste bolsista — CPF, contato e dados bancários, para o pedido de pagamento">⬇ Exportar dados do aluno</a>` : ""}
      </div>
    </div>`;
  };

  const porCiclo = new Map();
  for (const p of emExec) {
    const ciclo = p.edital || META.edital?.numero || "—";
    if (!porCiclo.has(ciclo)) porCiclo.set(ciclo, []);
    porCiclo.get(ciclo).push(p);
  }
  const ciclos = [...porCiclo.entries()].sort((a, b) => String(b[0]).split("/").pop() - String(a[0]).split("/").pop());

  // um ciclo por vez, na lista suspensa — o mais atual em evidência
  if (!CICLO_BV || !ciclos.some(([c]) => c === CICLO_BV)) CICLO_BV = ciclos[0]?.[0] || "";
  const seletor = ciclos.length ? `<div class="filtros" style="margin-bottom:14px">
    <label style="margin:0;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted)">
      Ciclo
      <select style="width:auto;min-width:220px" onchange="CICLO_BV=this.value;renderBolsistas()">
        ${ciclos.map(([c, ps]) => `<option value="${esc(c)}" ${CICLO_BV === c ? "selected" : ""}>Ciclo ${esc(c)}${c === META.edital?.numero ? " — atual" : ""} · ${ps.reduce((s, p) => s + (p.alunos || []).length, 0)} aluno(s)</option>`).join("")}
      </select>
    </label>
  </div>` : "";

  $("v-bolsistas").innerHTML = seletor + ciclos.filter(([c]) => c === CICLO_BV).map(([ciclo, projetos]) => {
    const comAlunos = projetos.filter((p) => (p.alunos || []).length);
    const totalAlunos = comAlunos.reduce((s, p) => s + p.alunos.length, 0);
    let corpo = "";
    if (META.gestao) {
      // gestão: agrupado por orientador
      const porOrientador = new Map();
      for (const p of comAlunos) {
        const k = p.orientador?.nome || p.orientador?.email || "—";
        if (!porOrientador.has(k)) porOrientador.set(k, []);
        porOrientador.get(k).push(p);
      }
      corpo = [...porOrientador.entries()].sort((a, b) => a[0].localeCompare(b[0], "pt-BR"))
        .map(([nome, ps]) => `<div class="sec-t">${esc(nome)}
          <span class="muted" style="font-weight:400">· ${ps.reduce((s, p) => s + p.alunos.length, 0)} aluno(s)</span></div>
          ${ps.flatMap((p) => (p.alunos || []).map((a) => cartaoAluno(p, a))).join("")}`).join("");
    } else {
      corpo = comAlunos.flatMap((p) => (p.alunos || []).map((a) => cartaoAluno(p, a))).join("");
    }
    return `<div class="card">
      <div class="card-t">Ciclo ${esc(ciclo)}</div>
      <div class="card-s">${totalAlunos} aluno(s) em ${comAlunos.length} projeto(s) em execução.</div>
      ${META.gestao ? `<div class="exp" style="margin-bottom:6px">
        <a class="bt bt-ghost" href="/api/ic/bolsistas.xlsx?edital=${encodeURIComponent(ciclo)}"
          title="Uma linha por bolsista, com CPF, contato e dados bancários — para montar os contratos">
          📇 Bolsistas para contrato (Excel)</a>
        <a class="bt bt-ghost" href="/api/ic/termos.pdf?tipo=bolsista&edital=${encodeURIComponent(ciclo)}" target="_blank" rel="noopener"
          title="Modelo institucional, uma folha por aluno — para imprimir e assinar na cerimônia">
          📝 Termos dos bolsistas (PDF)</a>
        <a class="bt bt-ghost" href="/api/ic/termos.pdf?tipo=orientador&edital=${encodeURIComponent(ciclo)}" target="_blank" rel="noopener"
          title="Um termo por professor, com os projetos que ele orienta">
          📝 Termos dos orientadores (PDF)</a>
      </div>
      ${blocoPublicarTermos(ciclo)}` : ""}
      ${corpo || `<div class="vazio">Nenhum aluno indicado neste ciclo ainda — a indicação abre com a aprovação do projeto.</div>`}
    </div>`;
  }).join("") || `<div class="card"><div class="vazio">Nenhum projeto em execução ainda. Os alunos aparecem aqui
    depois da aprovação e da indicação.</div></div>`;
}

/* ---------------------- publicação dos termos --------------------------- */
/* O termo de compromisso existe desde que o aluno preenche o cadastro — a
   gestão imprime quando quiser. Mas a CÓPIA de cada um só aparece depois da
   cerimônia de assinaturas, que ainda vai ser marcada: um termo circulando
   antes do ato viraria documento assinado fora dele. Publicar é um clique,
   e recolher também. */
const termosLiberados = (ciclo) =>
  !!(META.editais || []).find((e) => e.numero === ciclo)?.termosPublicados;

function blocoPublicarTermos(ciclo) {
  const pub = termosLiberados(ciclo);
  return `<div class="banner ${pub ? "ba-ok" : "ba-info"}" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span>${pub
      ? "<b>Termos publicados</b> — cada aluno e cada orientador já baixa a própria via assinada pela reitoria."
      : "<b>Termos não publicados.</b> Só a coordenação os vê. Publique depois da cerimônia de assinaturas."}</span>
    <button class="bt ${pub ? "bt-ghost" : "bt-pri"}" onclick="publicarTermos('${esc(ciclo)}', ${pub ? "false" : "true"})">
      ${pub ? "Recolher os termos" : "📢 Publicar os termos"}</button>
  </div>`;
}

async function publicarTermos(ciclo, publicar) {
  if (publicar && !confirm(`Publicar os termos do ciclo ${ciclo}? Alunos e orientadores passam a baixar a própria via.`)) return;
  if (!publicar && !confirm("Recolher os termos? Eles somem da tela dos alunos e dos professores.")) return;
  try {
    await api("/api/ic/termos/publicar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ edital: ciclo, publicar }),
    });
    await carregar(); montarSidebar(); renderBolsistas();
    aviso(publicar ? "Termos publicados — já aparecem para alunos e orientadores." : "Termos recolhidos.");
  } catch (e) { aviso(e.message, "err"); }
}

/* ------------------------ bolsistas: fim -------------------------------- */

/* ---------------------- o setor pelos olhos do aluno -------------------- */
/* Duas guias, e só elas: ONDE ele está (os projetos em que foi indicado) e
   O QUE ele precisa informar (o cadastro do contrato da bolsa). O aluno
   chega pelo convite por e-mail sem saber o que o sistema espera dele —
   se não estiver escrito na primeira tela, não acontece. */

/** O registro do próprio aluno, dentro de um projeto. */
const meuRegistro = (p) => (p.alunos || []).find((a) => a.email && a.email === META.eu);
/** Os projetos em que ele consta como aluno indicado. */
const meusProjetos = () => PROJETOS.filter((p) => meuRegistro(p));

function renderMeusProjetos() {
  const fmtBr = (iso) => iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "—";
  const lista = meusProjetos();
  const semCadastro = lista.filter((p) => {
    const eu = meuRegistro(p);
    return eu?.bolsista && p.fomento && p.fomento.tipo !== "voluntario" && !cadastroCompletoLocal(eu);
  });

  $("v-meusprojetos").innerHTML = `
    ${semCadastro.length ? `<div class="banner ba-warn">
      <b>Falta o seu cadastro.</b> Você foi indicado(a) como bolsista e a PROPPEX precisa dos seus
      documentos e dados bancários para efetivar a bolsa.
      <button class="bt bt-pri" style="margin-left:8px" onclick="nav('bolsa')">Preencher agora</button>
    </div>` : ""}
    ${lista.map((p) => {
      const eu = meuRegistro(p);
      const prazos = p.prazoRelatorios?.prazos || [];
      return `<div class="card">
        <div class="card-t">${esc(p.titulo || "(sem título)")}</div>
        <div class="card-s">${esc(p.numero || "sem protocolo")} · ${esc(cursoNome(p.curso))} ·
          ${esc(linhaNome(p.linha))} · ciclo ${esc(p.edital || META.edital?.numero || "—")}</div>
        <div class="exp" style="gap:6px;margin-bottom:8px">
          ${chip(p.status)}
          <span class="badge b-${eu.bolsista ? "aprovado" : "prevista"}">${eu.bolsista ? "bolsista" : "voluntário"}</span>

/* A mesma conta de lib/ic.js (faltaNoCadastroDoBolsista) — a tela precisa
   dizer o que falta antes de mandar ao servidor. Se mudar lá, mude aqui. */
const CAMPOS_CADASTRO = [
  ["nome", "nome completo"], ["cpf", "CPF"], ["rg", "RG"],
  ["nascimento", "data de nascimento"], ["telefone", "telefone (WhatsApp)"],
  ["endereco", "endereço"], ["vinculo", "vínculo empregatício"],
  ["banco", "banco"], ["agencia", "agência"], ["conta", "conta corrente"], ["pix", "Pix"],
];
const faltaNoCadastroLocal = (a) => CAMPOS_CADASTRO.filter(([c]) => !String(a?.[c] || "").trim()).map(([, r]) => r);
const cadastroCompletoLocal = (a) => faltaNoCadastroLocal(a).length === 0;
const idadeLocal = (n) => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(n || ""))) return null;
  const [an, mn, dn] = n.split("-").map(Number), h = new Date();
  let i = h.getFullYear() - an;
  if (h.getMonth() + 1 < mn || (h.getMonth() + 1 === mn && h.getDate() < dn)) i -= 1;
  return i >= 0 && i < 130 ? i : null;
};

async function salvarMinhaBolsa() {

    nome: v("mb-nome"), cpf: v("mb-cpf"), rg: v("mb-rg"), nascimento: v("mb-nascimento"),

/* --------------------- projetos do edital (classificação) -------------- */
/* As listas de cada processo seletivo, com o que a coordenação precisa ver
   lado a lado: título do projeto, quem orienta, a categoria de submissão
   (modalidade do edital: PIBIC/CNPq, PBIC/UNIEGO, PBIE…) e as notas. Duas
   classificações por edital: primeiro os professores doutores (bolsa CNPq
   exige doutorado), depois a geral, com todos — doutores inclusive. */
const anoDoEdital = (n) => Number(String(n).split("/").pop()) || 0;
const editaisOrdenados = () => (META.editais || [])
  .slice()
  .sort((a, b) => anoDoEdital(b.numero) - anoDoEdital(a.numero) || String(b.numero).localeCompare(String(a.numero)));

// a mesma ordem do PDF: nota final desc; empate pela nota do projeto;
// sem nota final vai para o fim, na ordem do protocolo
function ordenarClassificacao(lista) {
  return lista.slice().sort((a, b) => {
    const na = a.classificacao?.total, nb = b.classificacao?.total;
    if (typeof na === "number" && typeof nb === "number") {
      if (na !== nb) return nb - na;
      const pa = a.classificacao?.np ?? -1, pb = b.classificacao?.np ?? -1;
      if (pa !== pb) return pb - pa;
    } else if (typeof na === "number" || typeof nb === "number") {
      return typeof na === "number" ? -1 : 1;
    }
    return String(a.numero || "").localeCompare(String(b.numero || ""));
  });
}
// o mesmo entendimento de normalizarTitulacao no servidor: projeto gravado
// antes da normalização pode trazer "Doutora"/"Dr." — o quadro não pode
// divergir do PDF por causa de grafia
const titulacaoCodigo = (v) => {
  const t = String(v || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  if (!t) return "";
  if (/^(dr|dra|doutor|doutora|doutorado|pos-?doutor)/.test(t)) return "doutor";
  if (/^(me|ms|mestr)/.test(t)) return "mestre";
  if (/^(esp|especialis|pos-?graduad)/.test(t)) return "especialista";
  return "";
};
const ehDoutor = (v) => titulacaoCodigo(v) === "doutor";

/* -------------------------------- bolsas -------------------------------- */
/* A distribuição das bolsas, feita à mão pela coordenação conforme a cota
   que a presidência liberar. Os aprovados aparecem em ORDEM DE PONTUAÇÃO,
   em três blocos: só doutores, todos, e só especialistas. O MESMO projeto
   aparece em mais de um bloco de propósito — é assim que se compara dentro
   e fora do recorte —, e por isso a concessão é do PROJETO: marcar a bolsa
   num bloco marca em todos, que é o que evita dar duas bolsas ao mesmo. */
let CICLO_BOLSAS = "";
function renderBolsas() {
  const editais = editaisOrdenados();
  if (!CICLO_BOLSAS || !editais.some((e) => e.numero === CICLO_BOLSAS)) {
    CICLO_BOLSAS = (editais.find((e) => e.vigente) || editais[0] || {}).numero || "";
  }
  const aprovados = PROJETOS.filter((p) => (p.edital || META.edital?.numero) === CICLO_BOLSAS
    && ["aprovado", "concluido"].includes(p.status));
  const cnpq = aprovados.filter((p) => p.fomento?.tipo === "cnpq").length;
  const uniego = aprovados.filter((p) => p.fomento?.tipo === "uniego").length;
  const semDecisao = aprovados.filter((p) => !p.fomento).length;

  const bloco = (rotulo, lista, dica) => {
    let pos = 0;
    return `<details class="quadro" open>
      <summary>${rotulo}<span class="qt">${lista.length} projeto(s)</span><span class="seta">▼</span></summary>
      ${dica ? `<div class="muted" style="padding:8px 14px 0">${dica}</div>` : ""}
      ${lista.length ? `<div class="rolo" style="padding:6px 12px 10px"><table class="pt">
        <thead><tr><th style="width:4%"></th><th style="width:11%">Protocolo</th><th style="width:25%">Título</th>
          <th style="width:15%">Professor(a)</th><th style="width:8%">Titulação</th><th style="width:7%">Linha</th>
          <th style="width:6%">NP</th><th style="width:6%">CL</th><th style="width:6%">Total</th>
          <th style="width:12%">Bolsa</th></tr></thead>
        <tbody>${lista.map((p) => {
          const comNota = p.classificacao?.total != null;
          if (comNota) pos += 1;
          const t = p.fomento?.tipo || "";
          const cor = t === "cnpq" ? "b-aprovado" : t === "uniego" ? "b-validado" : t ? "b-rascunho" : "";
          return `<tr${t && t !== "voluntario" ? ' style="background:var(--ok-soft)"' : ""}>
            <td>${comNota ? pos + "º" : "—"}</td>
            <td><b style="color:var(--brand-2)">${esc(p.numero || "—")}</b></td>
            <td>${esc(p.titulo || "(sem título)")}</td>
            <td>${esc(p.orientador?.nome || p.orientador?.email || "—")}</td>
            <td>${esc(titNomeBolsa(p.orientador?.titulacao))}</td>
            <td>${esc((META.linhas.find((l) => l.codigo === p.linha) || {}).sigla || "—")}</td>
            <td>${p.classificacao?.np ?? "—"}</td>
            <td>${p.classificacao?.cl ?? "—"}</td>
            <td><b>${comNota ? p.classificacao.total : "—"}</b></td>
            <td><select onchange="atribuirBolsa('${esc(p.id)}',this.value,this)"
              title="${t ? esc(fomentoNome(t)) : "sem decisão"}">
              <option value="" ${!t ? "selected" : ""}>— sem decisão —</option>
              ${META.fomentos.map((f) => `<option value="${f.codigo}" ${t === f.codigo ? "selected" : ""}>${esc(f.nome)}</option>`).join("")}
            </select></td>
          </tr>`;
        }).join("")}</tbody></table></div>`
      : `<div class="vazio" style="padding:10px 14px">Nenhum projeto neste bloco.</div>`}
    </details>`;
  };

  const doutores = ordenarClassificacao(aprovados.filter((p) => ehDoutor(p.orientador?.titulacao)));
  const especialistas = ordenarClassificacao(aprovados.filter((p) =>
    titulacaoCodigo(p.orientador?.titulacao) === "especialista"));
  const todos = ordenarClassificacao(aprovados);
  /* A titulação diz QUEM pode receber; a linha diz O QUE cada bolsa atende —
     PIBITI só existe para Inovação Tecnológica, PROBEX só para Iniciação à
     Extensão. Distribuir olhando só a titulação daria bolsa de linha errada,
     por isso os mesmos projetos aparecem também recortados por linha. */
  const bolsasDaLinha = (cod) => (META.modalidades || [])
    .filter((m) => m.linha === cod && m.fomento).map((m) => m.nome).join(", ");

  $("v-bolsas").innerHTML = `
    <div class="tut"><details><summary>Como a atribuição funciona</summary>
      <ol>
        <li>A lista traz os projetos <b>aprovados</b> do ciclo, em ordem de pontuação (NP + CL).</li>
        <li>São recortes do <b>mesmo conjunto</b>, por dois critérios que decidem coisas diferentes:
          a <b>titulação</b> (doutores, todos, especialistas) diz <b>quem</b> pode receber cada bolsa;
          a <b>linha</b> (IC, IT, IE) diz <b>o que</b> cada bolsa atende — PIBITI só existe para Inovação
          Tecnológica, PROBEX só para Iniciação à Extensão. Um projeto aparece em vários blocos, de propósito.</li>
        <li>A bolsa é do <b>projeto</b>: marcar num bloco marca em todos, e é isso que impede
          conceder duas bolsas ao mesmo projeto.</li>
        <li><b>Bolsa CNPq exige doutorado</b> (item 4.4 do edital) — o sistema avisa se a titulação não atender.</li>
      </ol></details></div>

    <div class="filtros" style="margin-bottom:14px">
      <label style="margin:0;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted)">
        Ciclo
        <select style="width:auto;min-width:220px" onchange="CICLO_BOLSAS=this.value;renderBolsas()">
          ${editais.map((e) => `<option value="${esc(e.numero)}" ${CICLO_BOLSAS === e.numero ? "selected" : ""}>Edital ${esc(e.numero)}${e.vigente ? " — vigente" : ""}</option>`).join("")}
        </select>
      </label>
    </div>

    <div class="kpis" style="margin-bottom:16px">
      <div class="kpi"><div class="l">Aprovados</div><div class="v">${aprovados.length}</div><div class="d">no ciclo ${esc(CICLO_BOLSAS)}</div></div>
      <div class="kpi"><div class="l">Bolsa CNPq</div><div class="v">${cnpq}</div><div class="d">concedidas</div></div>
      <div class="kpi"><div class="l">Bolsa UNIEGO</div><div class="v">${uniego}</div><div class="d">concedidas</div></div>
      <div class="kpi"><div class="l">Sem decisão</div><div class="v">${semDecisao}</div><div class="d">aguardando atribuição</div></div>
    </div>

    ${!aprovados.length ? `<div class="card"><div class="vazio">Nenhum projeto aprovado neste ciclo ainda —
      a atribuição das bolsas acontece depois da decisão de mérito.</div></div>` : `
      ${bloco("Professores doutores", doutores, "As bolsas do CNPq exigem doutorado (item 4.4).")}
      ${bloco("Todos os professores", todos, "O mesmo projeto marcado acima aparece marcado aqui.")}
      ${bloco("Professores especialistas", especialistas, "")}
      ${(META.linhas || []).map((l) => bloco(
        l.nome,
        ordenarClassificacao(aprovados.filter((p) => (p.linha || "") === l.codigo)),
        bolsasDaLinha(l.codigo)
          ? `Bolsas próprias desta linha: <b>${esc(bolsasDaLinha(l.codigo))}</b>. O voluntário vale para as três.`
          : "",
      )).join("")}`}`;
}
const titNomeBolsa = (v) => ({ doutor: "Doutor", mestre: "Mestre", especialista: "Especialista" })[titulacaoCodigo(v)] || "—";

/* A concessão é do projeto: gravada uma vez, a tela inteira é redesenhada e
   os três blocos passam a mostrar o mesmo estado. */
async function atribuirBolsa(id, tipo, sel) {
  const p = PROJETOS.find((x) => x.id === id);
  if (tipo === "cnpq" && !ehDoutor(p?.orientador?.titulacao)) {
    if (!confirm(`O edital reserva a bolsa CNPq a professores doutores (item 4.4), e a titulação`
      + ` informada é ${titNomeBolsa(p?.orientador?.titulacao).toLowerCase()}.\n\nConceder mesmo assim?`)) {
      sel.value = p?.fomento?.tipo || ""; return;
    }
  }
  try {
    await api(`/api/ic/${id}/fomento`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tipo }),
    });
    await carregar();
    renderBolsas();
    aviso(tipo ? `${p?.numero || "Projeto"}: ${fomentoNome(tipo)}.` : `${p?.numero || "Projeto"}: concessão desfeita.`);
  } catch (e) { aviso(e.message, "err"); renderBolsas(); }
}

/* Ordenação por coluna das classificações. O estado é um só para os três
   quadros: eles mostram recortes do MESMO conjunto, e vê-los com critérios
   diferentes ao mesmo tempo confunde mais do que ajuda. */
/* ------------------------- decisão em lote ------------------------------ */
/* As propostas marcadas na fila de decisão. Vive fora do render porque a
   tela se remonta a cada clique; é limpa ao trocar de ciclo, senão uma marca
   de outro edital viajaria escondida até o botão de decidir. */
const SEL_LOTE = new Set();
function marcarUm(id, marcado) {
  if (marcado) SEL_LOTE.add(id); else SEL_LOTE.delete(id);
  renderClassificacao();
}
function marcarLote(marcar) {
  const doEdital = PROJETOS.filter((p) => (p.edital || META.edital?.numero) === CICLO_SEL
    && p.status === "submetido" && p.podeDecidir !== false);
  for (const p of doEdital) { if (marcar) SEL_LOTE.add(p.id); else SEL_LOTE.delete(p.id); }
  renderClassificacao();
}

/* Decidir várias de uma vez. Aprovar não concede bolsa nenhuma — é o passo
   que o edital chama de resultado do mérito; a cota vem depois. */
async function decidirLote(decisao) {
  const ids = [...SEL_LOTE];
  if (!ids.length) return;
  let parecer = "";
  if (decisao === "reprovado") {
    parecer = (prompt(`Motivo da reprovação de ${ids.length} proposta(s).\n\nEle vai para quem submeteu, e é o mesmo texto para todas — se os motivos forem diferentes, decida uma a uma.`) || "").trim();
    if (parecer.length < 10) return aviso("Escreva o motivo: quem recebe precisa saber por quê.", "err");
  } else if (!confirm(`Aprovar ${ids.length} proposta(s)?\n\nA bolsa NÃO é concedida aqui: depois de aprovar, use a guia Bolsas para distribuir conforme a cota liberada pela presidência.`)) {
    return;
  }
  try {
    const r = await api("/api/ic/decidir-lote", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids, decisao, parecer }),
    });
    SEL_LOTE.clear();
    await carregar();
    renderClassificacao();
    aviso(`${r.aplicados} proposta(s) ${decisao === "aprovado" ? "aprovada(s)" : "reprovada(s)"}.`
      + (r.ignorados?.length ? ` ${r.ignorados.length} sem alteração: ${r.ignorados.map((x) => `${x.numero} (${x.motivo})`).join("; ")}.` : ""),
      r.ignorados?.length ? "warn" : "ok");
  } catch (e) { aviso(e.message, "err"); }
}

let ORD_CLASS = { col: null, dir: 1 };
function ordenarPor(col) {
  if (ORD_CLASS.col !== col) ORD_CLASS = { col, dir: 1 };
  else if (ORD_CLASS.dir > 0) ORD_CLASS.dir = -1;
  else ORD_CLASS = { col: null, dir: 1 };      // volta à ordem de classificação
  renderClassificacao();
}
const NIVEL_TIT = { especialista: 1, mestre: 2, doutor: 3 };
function valorDaColuna(p, col) {
  switch (col) {
    case "numero": return p.numero || "";
    case "titulo": return p.titulo || "";
    case "professor": return p.orientador?.nome || p.orientador?.email || "";
    case "titulacao": return NIVEL_TIT[titulacaoCodigo(p.orientador?.titulacao)] || 0;
    case "linha": return linhaNome(p.linha);
    case "np": return p.classificacao?.np;
    case "cl": return p.classificacao?.cl;
    case "total": case "posicao": return p.classificacao?.total;
    case "resultado": return p.fomento ? fomentoNome(p.fomento.tipo)
      : { reprovado: "Não recomendado", devolvido: "Devolvido", submetido: "Em avaliação" }[p.status] || "";
    default: return "";
  }
}
function aplicarOrdem(lista) {
  if (!ORD_CLASS.col) return ordenarClassificacao(lista);
  const d = ORD_CLASS.dir;
  return lista.slice().sort((a, b) => {
    const x = valorDaColuna(a, ORD_CLASS.col), y = valorDaColuna(b, ORD_CLASS.col);
    // sem valor vai sempre para o fim, ordene-se como ordenar: "não tem nota"
    // não é o mesmo que "tem a menor nota"
    const vx = x === null || x === undefined || x === "", vy = y === null || y === undefined || y === "";
    if (vx && vy) return String(a.numero || "").localeCompare(String(b.numero || ""));
    if (vx) return 1;
    if (vy) return -1;
    if (typeof x === "number" && typeof y === "number") return (x - y) * d;
    return String(x).localeCompare(String(y), "pt-BR", { numeric: true }) * d;
  });
}

function renderClassificacao() {
  const titNome = (c) => (META.titulacoes.find((t) => t.codigo === c) || {}).nome || c || "—";
  const editais = editaisOrdenados();
  // um ciclo por vez, escolhido na lista suspensa — começa no vigente
  if (!CICLO_SEL || !editais.some((e) => e.numero === CICLO_SEL)) {
    CICLO_SEL = (editais.find((e) => e.vigente) || editais[0] || {}).numero || "";
  }

  // cada quadro recolhe e expande; o que ficou aberto é lembrado por ciclo
  // (QUADROS_ABERTOS), para a troca de ciclo não desfazer a arrumação
  // Cabeçalho clicável: primeiro clique ordena crescente, o segundo inverte,
  // o terceiro devolve a ordem de CLASSIFICAÇÃO — que é a ordem natural
  // desta tela e não pode ficar inalcançável.
  const th = (rot, col, largura) => {
    const ativo = ORD_CLASS.col === col;
    return `<th style="width:${largura};cursor:pointer;user-select:none"
      title="Ordenar por ${rot || "posição"}" onclick="ordenarPor('${col}')">${rot}${
      ativo ? ` <span style="color:var(--brand-2)">${ORD_CLASS.dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`;
  };
  const quadro = (rotulo, listaBruta) => {
    const chave = `${CICLO_SEL}|${rotulo}`;
    const lista = aplicarOrdem(listaBruta);
    let pos = 0;
    return `<details class="quadro"${QUADROS_ABERTOS.has(chave) ? " open" : ""}
      ontoggle="this.open ? QUADROS_ABERTOS.add('${esc(chave)}') : QUADROS_ABERTOS.delete('${esc(chave)}')">
    <summary>${rotulo}<span class="qt">${lista.length} proposta(s)</span><span class="seta">▼</span></summary>
    ${lista.length ? `<div class="rolo"><table class="pt">
      <thead><tr>${th("", "posicao", "4%")}${th("Protocolo", "numero", "11%")}${th("Título", "titulo", "24%")}
        ${th("Professor(a)", "professor", "16%")}${th("Titulação", "titulacao", "9%")}${th("Categoria", "linha", "13%")}
        ${th("NP", "np", "6%")}${th("CL", "cl", "6%")}${th("Total", "total", "6%")}${th("Resultado", "resultado", "11%")}</tr></thead>
      <tbody>${lista.map((p) => {
        const comNota = p.classificacao?.total != null;
        if (comNota) pos += 1;
        const resultado = p.fomento ? fomentoNome(p.fomento.tipo)
          : { reprovado: "Não recomendado", devolvido: "Devolvido", submetido: "Em avaliação" }[p.status] || "—";
        return `<tr style="cursor:pointer" onclick="abrir('${esc(p.id)}')">
          <td>${comNota ? pos + "º" : "—"}</td>
          <td><b style="color:var(--brand-2)">${esc(p.numero || "—")}</b></td>
          <td>${esc(p.titulo || "(sem título)")}</td>
          <td>${esc(p.orientador?.nome || p.orientador?.email || "—")}</td>
          <td>${esc(titNome(p.orientador?.titulacao))}</td>
          <td>${esc(linhaNome(p.linha))}</td>
          <td>${p.classificacao?.np ?? "—"}${p.notaDireta ? ' <span class="muted" title="nota atribuída pela coordenação">✎</span>' : ""}</td>
          <td>${p.classificacao?.cl ?? "—"}</td>
          <td><b>${comNota ? p.classificacao.total : "—"}</b></td>
          <td>${esc(resultado)}</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>` : `<div class="muted" style="margin-bottom:10px">Nenhuma proposta neste quadro.</div>`}
    </details>`;
  };

  /* A fila de decisão do ciclo. Os quadros abaixo são o documento; isto aqui
     é o trabalho: com quarenta propostas com parecer, decidir uma a uma é
     abrir quarenta telas para repetir o mesmo clique. A bolsa não entra —
     ela é distribuída depois, na guia Bolsas, conforme a cota. */
  const filaDecisao = (doEdital) => {
    if (!META.gestao) return "";
    const aguardando = ordenarClassificacao(doEdital.filter((p) => p.status === "submetido"));
    if (!aguardando.length) return "";
    // O gestor geral decide também as propostas em que ele é parte — o mérito
    // veio de parecer ad hoc, e o que ele pratica é o ato administrativo (fica
    // marcado como tal no histórico). Para o COORDENADOR de módulo a regra
    // continua: acima dele há quem decida, e essas ficam à parte.
    const pendentes = aguardando.filter((p) => p.podeDecidir !== false);
    const meus = aguardando.filter((p) => p.podeDecidir === false);
    const blocoMeus = meus.length ? `<div class="banner ba-warn" style="margin-top:14px">
      <b>${meus.length} proposta(s) que você não decide</b> — você consta como
      ${esc({ orientador: "orientação", aluno: "aluno", avaliador: "avaliador" }[meus[0].souParte] || "parte")}
      nelas. Quem decide é o <b>gestor geral</b> do portal (a pró-reitoria).
      <div style="margin-top:8px;font-size:12.5px">${meus.map((p) =>
        `${esc(p.numero || "—")} · ${esc(p.titulo || "")}`).join("<br>")}</div></div>` : "";
    if (!pendentes.length) return `<div class="card" style="border-color:#cfe6f2;background:#f7fbfd">
      <div class="card-t">Decisão do ciclo</div>
      <div class="card-s">Nada aguardando a sua decisão neste ciclo.</div>${blocoMeus}</div>`;
    const marcadas = pendentes.filter((p) => SEL_LOTE.has(p.id)).length;
    return `<div class="card" style="border-color:#cfe6f2;background:#f7fbfd">
      <div class="card-t">Decisão do ciclo — ${pendentes.length} proposta(s) aguardando</div>
      <div class="card-s">Marque as propostas e decida de uma vez, na ordem da classificação.
        A <b>bolsa não é decidida aqui</b>: depois de aprovar, a distribuição é feita na guia
        Bolsas, conforme a cota. Reprovar exige o motivo, que vai para quem submeteu.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <button class="bt bt-ghost" onclick="marcarLote(${marcadas < pendentes.length})">${
          marcadas < pendentes.length ? `Marcar todas (${pendentes.length})` : "Desmarcar todas"}</button>
        <span class="muted" style="margin-left:2px">${marcadas} marcada(s)</span>
        <span style="flex:1"></span>
        <button class="bt bt-pri" onclick="decidirLote('aprovado')" ${marcadas ? "" : "disabled"}>✓ Aprovar marcadas</button>
        <button class="bt bt-err" onclick="decidirLote('reprovado')" ${marcadas ? "" : "disabled"}>✕ Reprovar marcadas</button>
      </div>
      <div class="rolo" style="max-height:340px;overflow:auto"><table class="pt">
        <thead><tr><th style="width:4%"></th><th style="width:12%">Protocolo</th><th style="width:44%">Título</th>
          <th style="width:24%">Professor(a)</th><th style="width:8%">NP</th><th style="width:8%">Total</th></tr></thead>
        <tbody>${pendentes.map((p) => `<tr>
          <td><input type="checkbox" style="width:auto;margin:0" ${SEL_LOTE.has(p.id) ? "checked" : ""}
            onchange="marcarUm('${esc(p.id)}',this.checked)"></td>
          <td><b style="color:var(--brand-2)">${esc(p.numero || "—")}</b></td>
          <td>${esc(p.titulo || "(sem título)")}${p.souParte
            ? ` <span class="badge" style="background:var(--warn-soft);color:var(--warn)"
                title="Você é parte nesta proposta — a decisão fica registrada como decisão sobre proposta própria">sua proposta</span>` : ""}</td>
          <td>${esc(p.orientador?.nome || p.orientador?.email || "—")}</td>
          <td>${p.classificacao?.np ?? "—"}</td>
          <td><b>${p.classificacao?.total ?? "—"}</b></td>
        </tr>`).join("")}</tbody>
      </table></div>
      ${blocoMeus}
    </div>`;
  };

  const seletor = `<div class="filtros" style="margin-bottom:14px">
    <label style="margin:0;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted)">
      Ciclo
      <select style="width:auto;min-width:220px" onchange="CICLO_SEL=this.value;SEL_LOTE.clear();renderClassificacao()">
        ${editais.map((e) => `<option value="${esc(e.numero)}" ${CICLO_SEL === e.numero ? "selected" : ""}>Edital ${esc(e.numero)}${e.vigente ? " — vigente" : ""} · ${e.projetos} projeto(s)</option>`).join("")}
      </select>
    </label>
  </div>`;

  $("v-classificacao").innerHTML = seletor + editais.filter((e) => e.numero === CICLO_SEL).map((e) => {
    const doEdital = PROJETOS.filter((p) => (p.edital || META.edital?.numero) === e.numero && p.status !== "rascunho");
    const doutores = ordenarClassificacao(doEdital.filter((p) => ehDoutor(p.orientador?.titulacao)));
    const geral = ordenarClassificacao(doEdital);
    const comNota = doEdital.filter((p) => p.classificacao?.total != null).length;
    return filaDecisao(doEdital) + `<div class="card">
      <div class="card-t">Edital ${esc(e.numero)}${e.vigente ? ' <span class="badge b-aprovado">vigente</span>' : ""}</div>
      <div class="card-s">${doEdital.length} proposta(s) · ${doutores.length} de professores doutores · ${comNota} com nota final.
        A nota final soma o projeto (0–100) com o currículo (0–100). Os documentos do processo estão em
        <a href="#" onclick="nav('editais');return false">Editais e Resultados</a>.</div>
      ${quadro("Classificação — professores doutores", doutores)}
      ${quadro("Classificação geral — todos os professores", geral)}

      ${META.linhas.map((l) => {
        // sub-ranking por categoria: só as propostas daquela linha, na mesma
        // ordem de nota — categoria sem proposta não ocupa a tela
        const daLinha = ordenarClassificacao(doEdital.filter((p) => (p.linha || "ic") === l.codigo));
        return daLinha.length ? quadro(`Classificação por categoria — ${l.nome}`, daLinha) : "";
      }).join("")}
    </div>`;
  }).join("") || `<div class="card"><div class="vazio">Nenhum edital com propostas ainda.</div></div>`;
}

/* --------------------------- editais e resultados ----------------------- */
/* O arquivo do processo, ano a ano: o EDITAL como foi publicado e o
   RESULTADO em PDF timbrado — os dois para download. As listas de projetos
   ficam na guia Projetos. */
function renderEditais() {
  $("v-editais").innerHTML = editaisOrdenados().map((e) => `<div class="card">
      <div class="card-t">Edital ${esc(e.numero)}${e.vigente ? ' <span class="badge b-aprovado">vigente</span>' : ""}</div>
      <div class="card-s">Ano ${anoDoEdital(e.numero) || "—"} · ${e.projetos} proposta(s) ·

      <div class="exp">

        ${e.resultadoPublicado
          ? `<a class="bt bt-sec" href="${e.resultadoDocumento ? esc(e.resultadoDocumento) : `/api/ic/resultado.pdf?edital=${encodeURIComponent(e.numero)}`}" target="_blank" rel="noopener">
              📄 ${e.resultadoFase === "preliminar" ? "Resultado preliminar (PDF)" : "Resultado do processo (PDF)"}${e.resultadoDocumento ? " — publicado" : ""}</a>`

        ${META.gestao && !e.resultadoDocumento ? `
          <a class="bt bt-ghost" href="/api/ic/resultado.pdf?edital=${encodeURIComponent(e.numero)}&fase=preliminar" target="_blank" rel="noopener"
            title="Só a gestão baixa: prévia do resultado preliminar (só os aprovados, sem bolsas)">🔍 Prévia preliminar</a>
          <a class="bt bt-ghost" href="/api/ic/resultado.pdf?edital=${encodeURIComponent(e.numero)}&fase=final" target="_blank" rel="noopener"
            title="Só a gestão baixa: prévia do resultado final (com as bolsas)">🔍 Prévia final</a>

      </div>

        <a href="#" onclick="nav('classificacao');return false">Projetos</a>.` : ""}</div>
    </div>`).join("") || `<div class="card"><div class="vazio">Nenhum edital registrado ainda.</div></div>`;

  // ICEM — outro programa, com série própria (02/AAAA): os documentos vêm do
  // arquivo publicado; o resultado do ciclo vigente aparece como "em breve"
  const em = META.editaisEM || [];
  if (em.length) $("v-editais").innerHTML += `
    <div class="card">

            ? `<a class="bt bt-sec" href="${esc(e.resultadoDocumento)}" target="_blank" rel="noopener">📄 Resultado do processo (PDF)</a>`

/* Publicar (ou recolher) o resultado do processo — só a gestão. Duas fases:
   "preliminar" (só os aprovados, antes das bolsas) e "final" (com a bolsa
   concedida). fase null recolhe. Abre o PDF para todo o setor e para a
   página pública; até lá, "em breve". */
async function publicarResultado(numero, fase) {
  const semBolsa = PROJETOS.filter((p) =>
    (p.edital || numero) === numero && ["aprovado", "concluido"].includes(p.status) && !p.fomento).length;
  const pergunta = fase === "preliminar"
    ? `Publicar o RESULTADO PRELIMINAR do Edital ${numero}?\n\nO PDF sai só com os projetos aprovados, ainda sem a distribuição das bolsas — é a lista para definir as cotas com a presidência. Ele abre para todos os professores e para a página pública.`
    : fase === "final"
      ? `Publicar o RESULTADO FINAL do Edital ${numero}?\n\nO PDF sai com a bolsa concedida a cada projeto, para todos os professores e para a página pública.${semBolsa
        ? `\n\nAtenção: ${semBolsa} projeto(s) aprovado(s) ainda sem decisão de fomento — no documento sairiam como "sem decisão".` : ""}`
      : `Recolher a publicação do resultado do Edital ${numero}?\n\nO documento volta a aparecer como "em breve" para quem não é da gestão.`;
  if (!confirm(pergunta)) return;
  try {
    await api("/api/ic/resultado/publicar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ edital: numero, fase }),
    });
    META = await api("/api/ic/meta");
    nav(SECAO);
    aviso(fase === "preliminar" ? `Resultado preliminar do Edital ${numero} publicado.`
      : fase === "final" ? `Resultado final do Edital ${numero} publicado.`
        : `Publicação do resultado do Edital ${numero} recolhida.`);
  } catch (e) { aviso(e.message, "err"); }
}

/* Convite de cadastro aos professores importados — só a gestão. Primeiro a
   simulação (a lista de quem receberia), depois a confirmação e o envio.
   Quem já criou usuário e informou o CPF não entra; quem já foi convidado
   só recebe de novo se a gestão mandar reenviar. */
async function convidarProfessores() {
  const post = (corpo) => api("/api/ic/convidar-professores", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
  });
  try {
    const s = await post({ simular: true });
    const li = (x) => `• ${x.nome || x.email}${x.email ? ` — ${x.email}` : ""} (${x.projetos} projeto${x.projetos > 1 ? "s" : ""})`;
    const rodape = (n) => `${n ? `\n\n${n} professor(es) sem e-mail no formulário — convite impossível por aqui.` : ""}`;
    if (!s.novos.length && !s.jaConvidados.length) {
      aviso(`Ninguém a convidar: os professores do ciclo já estão vinculados ou já entraram.${rodape(s.semEmail.length)}`);
      return;
    }
    let reenviar = false;
    if (!s.novos.length) {
      if (!confirm(`Todos os ${s.jaConvidados.length} professor(es) pendentes já receberam o convite:\n\n${s.jaConvidados.map(li).join("\n")}\n\nReenviar o e-mail a eles?`)) return;
      reenviar = true;
    } else if (!confirm(`Convidar ${s.novos.length} professor(es) por e-mail?\n\n${s.novos.map(li).join("\n")}${s.jaConvidados.length ? `\n\n(${s.jaConvidados.length} já convidado(s) antes não recebem de novo.)` : ""}${rodape(s.semEmail.length)}\n\nO e-mail explica o cadastro e lembra do CPF no perfil — é ele que vincula os projetos à conta.`)) return;
    const r = await post({ reenviar });
    if (!r.enviados.length && r.falhas?.length) {
      aviso(`Nenhum convite saiu — ${r.falhas.length} falha(s) de envio: ${r.falhas[0].erro}`, "err");
      return;
    }
    aviso(`Convite enviado a ${r.enviados.length} professor(es)${r.falhas?.length ? ` — ${r.falhas.length} falhou(aram), veja o log` : ""}.`);
  } catch (e) { aviso(e.message, "err"); }
}

/* ------------------------------ relatórios ----------------------------- */
/* Para a gestão, a guia Relatórios é um radar: cada projeto em execução com
   a sua situação frente aos prazos do edital — EM DIA ou ATRASADO — e nada
   mais. O relatório completo se lê dentro do projeto, num clique. */
function renderRelatoriosGestao() {
  // um ciclo por vez, como nas demais guias — o vigente em evidência;
  // os passados são arquivo: os relatórios aparecem como encerrados
  const editais = editaisOrdenados();
  if (!CICLO_REL || !editais.some((e) => e.numero === CICLO_REL)) {
    CICLO_REL = (editais.find((e) => e.vigente) || editais[0] || {}).numero || "";
  }
  const cicloVigente = editais.find((e) => e.numero === CICLO_REL)?.vigente === true;
  const emExec = PROJETOS.filter((p) => ["aprovado", "concluido"].includes(p.status)
    && (p.edital || META.edital?.numero) === CICLO_REL);
  const fmtBr = (iso) => iso ? iso.split("-").reverse().join("/") : "—";
  const hoje = hojeISO();

  // a situação de UM relatório (parcial ou final) num projeto
  const prazoDe = (p, tipo) => (p.prazoRelatorios?.prazos || []).find((x) => x.tipo === tipo);
  const sitTipo = (p, tipo) => {
    if (p.status === "concluido") return `<span class="badge b-validado">encerrado</span>`;
    const x = prazoDe(p, tipo);
    if (!x) return `<span class="badge b-rascunho">—</span>`;
    if (!x.falta) return `<span class="badge b-validado">entregue</span>`;
    if (x.atrasado) return `<span class="badge b-atrasada">atrasado · venceu ${fmtBr(x.vence)}</span>`;
    return hoje < x.abre
      ? `<span class="badge b-rascunho">abre em ${fmtBr(x.abre)}</span>`
      : `<span class="badge b-aprovado">em dia · vence ${fmtBr(x.vence)}</span>`;
  };

  const listaTipo = (tipo, rotulo) => {
    const ordem = emExec.slice().sort((a, b) =>
      (prazoDe(b, tipo)?.atrasado === true) - (prazoDe(a, tipo)?.atrasado === true)
      || String(a.numero || "").localeCompare(String(b.numero || "")));
    const atras = cicloVigente ? ordem.filter((p) => prazoDe(p, tipo)?.atrasado).length : 0;
    return `<details class="quadro" open>
      <summary>${rotulo}<span class="qt">${emExec.length} projeto(s)${atras
        ? ` · ${atras} atrasado(s)` : (cicloVigente ? "" : " · ciclo encerrado")}</span><span class="seta">▼</span></summary>
      <div style="padding:2px 12px 10px">
      ${ordem.map((p) => `
        <div class="linha" style="cursor:pointer" onclick="abrir('${esc(p.id)}')">
          <div class="txt">
            <div class="p1">${esc(p.numero || "sem número")} · ${esc(p.titulo || "(sem título)")}</div>
            <div class="p2">${esc(cursoNome(p.curso))} · orientação: ${esc(p.orientador?.nome || p.orientador?.email || "—")}
              · ${p.relatorios} relatório(s) no sistema${p.aValidar ? ` · ${p.aValidar} a validar` : ""}</div>
          </div>
          ${sitTipo(p, tipo)}
        </div>`).join("") || `<div class="vazio">Nenhum projeto em execução neste ciclo.</div>`}
      </div>
    </details>`;
  };

  const atrasados = cicloVigente ? emExec.filter((p) => p.prazoRelatorios?.atrasado).length : 0;

  $("v-relatorios").innerHTML = `
    <div class="tut"><details><summary>Como os prazos funcionam</summary>
      <ol>
        <li>São dois relatórios por aluno: o <b>parcial</b>, que vence aos 6 meses de execução, e o <b>final</b>, no fim da vigência.</li>
        <li>Cada um pode começar a ser entregue <b>2 meses antes</b> de vencer.</li>
        <li>O projeto fica <b>atrasado</b> quando um prazo vence e ainda falta relatório daquele tipo.</li>
        <li>Clique no projeto para ler os relatórios completos e o histórico.</li>
      </ol></details></div>

    <div class="filtros" style="margin-bottom:14px">
      <label style="margin:0;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted)">
        Ciclo
        <select style="width:auto;min-width:220px" onchange="CICLO_REL=this.value;renderRelatorios()">
          ${editais.map((e) => `<option value="${esc(e.numero)}" ${CICLO_REL === e.numero ? "selected" : ""}>Edital ${esc(e.numero)}${e.vigente ? " — vigente" : " — encerrado"} · ${e.projetos} projeto(s)</option>`).join("")}
        </select>
      </label>
    </div>

    <div class="card">
      <div class="card-t">Relatórios do ciclo ${esc(CICLO_REL)}</div>
      <div class="card-s">${emExec.length} projeto(s)${cicloVigente
        ? (atrasados ? ` · <b style="color:var(--warn)">${atrasados} atrasado(s)</b>` : " · todos em dia")
        : " · ciclo encerrado — relatórios do arquivo"}.</div>
      ${listaTipo("parcial", "Relatório parcial")}
      ${listaTipo("final", "Relatório final")}
    </div>`;
}

async function validar(projetoId, relId, decisao, tipo) {
  // o painel de validação vive dentro do projeto; fora dele (lista da guia
  // Relatórios), o caminho é abrir o projeto e validar lá
  const com = $("val-com-" + relId);
  if (!com) return abrirRelatorio(projetoId, tipo || "parcial");
  const parecer = com.value.trim();
  if (decisao === "devolvido" && parecer.length < 10)
    return aviso("Escreva no comentário o que o aluno precisa corrigir.", "warn");
  const corpo = { decisao, parecer };
  if (tipo === "final" && decisao === "validado") {
    const M = REL_MODELO();
    corpo.avaliacaoAluno = {};
    for (const c of M.criteriosAluno || []) {
      const v = $(`val-${relId}-${c.codigo}`)?.value;
      if (v === "" || v == null) return aviso("Para validar o final, preencha a avaliação do desempenho do aluno — os 7 critérios.", "warn");
      corpo.avaliacaoAluno[c.codigo] = Number(v);
    }
    corpo.parecerConclusivo = document.querySelector(`input[name="val-parecer-${relId}"]:checked`)?.value || "";
    if (!corpo.parecerConclusivo) return aviso("Marque o parecer conclusivo do orientador.", "warn");
  }
  if (decisao === "validado" && !confirm(tipo === "final"
    ? "Validar o relatório final e encaminhar à PROPPEX? Com todos os finais validados, o projeto passa a concluído."
    : "Validar o relatório e encaminhar à PROPPEX?")) return;
  try {
    await api(`/api/ic/${projetoId}/relatorio/${relId}/validar`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo),
    });
    await carregar(); montarSidebar();
    if (SECAO === "projeto") abrir(projetoId); else renderRelatorios();
    aviso(decisao === "validado" ? "Relatório validado e encaminhado à PROPPEX." : "Relatório devolvido ao aluno para correção.");
  } catch (e) { aviso(e.message, "err"); }
}

/* ------------------------- meses da vigência ---------------------------
   O cronograma se preenche por MÊS (1 a 12), não por data: a vigência é a
   mesma para todos os projetos do ciclo (setembro → agosto), então o mês é
   o que o professor realmente decide. O que se GRAVA continua sendo data —
   primeiro dia do mês inicial, último dia do mês final —, para o resto do
   sistema (atraso, tela de Cronograma, PDF) seguir funcionando igual. */
function vigenciaDoProjeto() {
  const v = META.edital?.vigencia || {};
  return { inicio: ATUAL?.inicio || v.inicio || "2026-09-01", fim: ATUAL?.fim || v.fim || "2027-08-31" };
}
function mesDaVigencia(n) {
  const base = new Date(vigenciaDoProjeto().inicio + "T12:00:00Z");
  const d = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth() + (Number(n) - 1), 1, 12));
  const ano = d.getUTCFullYear(), mes = d.getUTCMonth();
  const ult = new Date(Date.UTC(ano, mes + 1, 0, 12));           // dia 0 do mês seguinte = último deste
  const p2 = (x) => String(x).padStart(2, "0");
  return {
    inicio: `${ano}-${p2(mes + 1)}-01`,
    fim: `${ano}-${p2(mes + 1)}-${p2(ult.getUTCDate())}`,
    rotulo: `${["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"][mes]}/${ano}`,
  };
}
const mesRotulo = (n) => mesDaVigencia(n).rotulo;
// de uma data gravada de volta para o número do mês (vazio se cair fora)
function mesDaData(iso) {
  if (!iso) return "";
  const base = new Date(vigenciaDoProjeto().inicio + "T12:00:00Z");
  const d = new Date(String(iso).slice(0, 10) + "T12:00:00Z");
  if (Number.isNaN(+d)) return "";
  const n = (d.getUTCFullYear() - base.getUTCFullYear()) * 12 + (d.getUTCMonth() - base.getUTCMonth()) + 1;
  return n >= 1 && n <= 12 ? n : "";
}
function opcoesMes(sel) {
  let out = `<option value="" ${!sel ? "selected" : ""}>— mês —</option>`;
  for (let n = 1; n <= 12; n++) {
    out += `<option value="${n}" ${String(sel) === String(n) ? "selected" : ""}>${n} · ${mesRotulo(n)}</option>`;
  }
  return out;
}
// mês escolhido → data gravada: início no primeiro dia, fim no último
function mudouMes(i, qual, valor) {
  const e = ATUAL.cronograma[i];
  if (!valor) { e[qual] = ""; return; }
  const m = mesDaVigencia(valor);
  e[qual] = qual === "inicio" ? m.inicio : m.fim;
}

function desenharEtapas() {
  const ger = PODE.podeGerir || PODE.podeEditar;
  const ro = ger ? "" : "disabled";
  // Na submissão o aluno ainda não existe (a indicação vem depois da
  // aprovação): por isso "Aluno" é uma opção genérica. Indicados os alunos,
  // cada nome entra na lista e a atividade pode ser atribuída a um deles.
  const opcoes = (sel) => `<option value="" ${!sel ? "selected" : ""}>Professor Orientador</option>`
    + `<option value="aluno" ${sel === "aluno" ? "selected" : ""}>Aluno</option>`
    + (ATUAL.alunos || []).filter((a) => a.email).map((a) =>
      `<option value="${esc(a.email)}" ${sel === a.email ? "selected" : ""}>${esc(a.nome || a.email)}</option>`).join("");
  $("tb-etapas").innerHTML = (ATUAL.cronograma || []).map((e, i) => `
    <tr>
      <td><input ${ro} value="${esc(e.atividade || "")}" oninput="ATUAL.cronograma[${i}].atividade=this.value" placeholder="Revisão bibliográfica"></td>
      <td><select ${ro} onchange="ATUAL.cronograma[${i}].responsavel=this.value">${opcoes(e.responsavel)}</select></td>
      <td><select ${ro} onchange="mudouMes(${i},'inicio',this.value)">${opcoesMes(mesDaData(e.inicio))}</select></td>
      <td><select ${ro} onchange="mudouMes(${i},'fim',this.value)">${opcoesMes(mesDaData(e.fim))}</select></td>
      <td><select ${ro} onchange="ATUAL.cronograma[${i}].situacao=this.value">
        ${["prevista", "andamento", "concluida"].map((s) => `<option value="${s}" ${e.situacao === s ? "selected" : ""}>${{ prevista: "prevista", andamento: "em andamento", concluida: "concluída" }[s]}</option>`).join("")}
      </select></td>
      <td>${ger ? `<button class="rm" title="remover" onclick="ATUAL.cronograma.splice(${i},1);desenharEtapas()">×</button>` : ""}</td>
    </tr>`).join("") || `<tr><td colspan="6" class="muted">Nenhuma atividade. O cronograma é obrigatório para submeter.</td></tr>`;
}
function addEtapa() { ATUAL.cronograma = [...(ATUAL.cronograma || []), { atividade: "", responsavel: "", inicio: "", fim: "", situacao: "prevista" }]; desenharEtapas(); }

/** Grupos para o filtro: o catálogo completo (certificados no DGP e
    informados à mão), mais qualquer um que apareça nos projetos à vista. */
function gruposEmUso() {
  const vistos = new Set([
    ...gruposConhecidos(),
    ...PROJETOS.map((p) => p.grupoPesquisa).filter(Boolean),
  ]);
  return [...vistos].sort((a, b) => a.localeCompare(b, "pt-BR"));
}

/* --------------------------- grupo de pesquisa ------------------------- */
/* O edital só quer saber a que grupo a proposta se liga. A lista traz os
   certificados no DGP/CNPq e os que já foram informados à mão por alguém; se
   o grupo não estiver em nenhuma das duas, a pessoa digita o nome e ele passa
   a aparecer para os próximos. */
function campoGrupo(p, ro) {
  const conhecidos = gruposConhecidos();
  const livre = !!p.grupoPesquisa && !conhecidos.includes(p.grupoPesquisa);
  const opcoes = (lista) => lista.map((g) =>
    `<option value="${esc(g)}" ${p.grupoPesquisa === g ? "selected" : ""}>${esc(g)}</option>`).join("");
  return `
    <select id="grupo-lista" ${ro} onchange="escolheuGrupo(this.value)">
      <option value="">— não vinculada a grupo —</option>
      ${(META.certificados || []).length ? `<optgroup label="Certificados no DGP/CNPq">${opcoes(META.certificados)}</optgroup>` : ""}
      ${(META.informados || []).length ? `<optgroup label="Informados em outras propostas">${opcoes(META.informados)}</optgroup>` : ""}
      <option value="__novo" ${livre ? "selected" : ""}>Outro grupo — informar o nome…</option>
    </select>
    <input id="grupo-livre" ${ro} style="margin-top:8px;${livre ? "" : "display:none"}"
      value="${esc(livre ? p.grupoPesquisa : "")}" maxlength="200"
      placeholder="Nome do grupo, como consta no Diretório do CNPq"
      oninput="campo('grupoPesquisa',this.value)">`;
}

function escolheuGrupo(valor) {
  const caixa = $("grupo-livre");
  if (valor === "__novo") {
    caixa.style.display = "";
    campo("grupoPesquisa", caixa.value.trim());
    caixa.focus();
  } else {
    caixa.style.display = "none";
    caixa.value = "";
    campo("grupoPesquisa", valor);
  }
}

function baixarResultado() {

}

/* Importação do banco do edital que acompanha o sistema. Roda primeiro em
   simulação — ninguém deve gravar 33 projetos sem ver antes o que entra. */
async function importarEdital(simular) {
  try {
    const r = await api("/api/ic/importar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ arquivo: "edital-01-2026", simular }),
    });
    const resumo = `${r.criados} a criar, ${r.atualizados} a atualizar` +
      (r.semCpf ? `, ${r.semCpf} sem CPF válido` : "") +
      (r.invalidos?.length ? `, ${r.invalidos.length} com pendência` : "");
    if (simular) {
      const detalhe = (r.invalidos || []).slice(0, 5).map((x) => `linha ${x.linha}: ${x.erro}`).join("\n");
      if (!confirm(`Importação do edital 01/2026\n\n${resumo}\n\n${detalhe}\n\nConfirmar a gravação?`)) return;
      return importarEdital(false);
    }
    await carregar(); montarSidebar(); renderGestao();
    aviso(`Edital importado: ${resumo}.`);
  } catch (e) { aviso(e.message, "err"); }
}

  if (!Object.keys(p.producao || {}).length) f.push("A planilha de pontuação da produção acadêmica não foi preenchida — ela vale até 100 dos 200 pontos da classificação.");
  if (p.etica?.exige && !p.etica?.protocolo) f.push("Projeto com seres humanos ou animais sem o protocolo do CEP/CEUA.");
  if (!f.length) return "";
  return `<div class="banner ba-warn"><b>Pendências</b><ul style="margin:6px 0 0 18px">

            <td style="text-align:right"><b>${p.notaDireta.valor}</b> <span class="muted">de 100</span></td></tr>
        </tbody>
      </table>

        ${esc(recNome(p.notaDireta.recomendacao))}</div>` : ""}
      ${p.notaDireta.parecer ? `<div style="white-space:pre-wrap;line-height:1.6">${esc(p.notaDireta.parecer)}</div>` : ""}
      <div class="muted" style="margin-top:10px">O parecer fica com a coordenação: a orientação vê a
        decisão, não o texto nem a nota de cada critério.</div>
    </details>` : ""}` : ""}
    <div class="grid3">
      <div><label>Nota do projeto (0 a 100)</label>
        <input type="number" min="0" max="100" step="0.5" id="nota-direta" value="${p.notaDireta?.valor ?? ""}"></div>
      <div><label>Observação <span class="muted">(opcional; fica no histórico)</span></label>
        <input id="nota-direta-obs" value="${esc(p.notaDireta?.observacao || "")}" placeholder="Ex.: média dos pareceres do processo externo"></div>
      <div style="display:flex;align-items:flex-end;gap:8px">
        <button class="bt bt-sec" onclick="atribuirNota()">Atribuir nota</button>
        ${p.notaDireta ? `<button class="bt bt-ghost" onclick="atribuirNota(true)" title="Volta a valer a média dos pareceres">Desfazer</button>` : ""}
      </div>
    </div>`}

    ${cls ? `<div class="stat" style="margin-top:16px">
      <div class="s"><b>${cls.np ?? "—"}</b><span>Projeto (0–100)${p.notaDireta ? " · atribuída" : " · média dos pareceres"}</span></div>
      <div class="s"><b>${cls.cl ?? "—"}</b><span>Currículo (0–100) · planilha</span></div>
      <div class="s" style="border-color:var(--brand-3)"><b>${cls.total ?? "—"}</b><span>Nota final = projeto + currículo${cls.np == null ? " · aguarda nota do projeto" : ""}</span></div>
    </div>` : ""}
  </div>`;
}

/* Nota atribuída direto pela coordenação — a seleção deste ano correu fora
   do sistema; nos próximos, o caminho é o parecer pelo formulário. */
async function atribuirNota(desfazer) {
  const valor = desfazer ? null : $("nota-direta").value.trim();
  if (!desfazer && valor === "") return aviso("Informe a nota do projeto, de 0 a 100.", "warn");
  if (desfazer && !confirm("Desfazer a nota atribuída? Volta a valer a média dos pareceres do sistema.")) return;
  try {
    await api(`/api/ic/${ATUAL.id}/nota`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nota: desfazer ? null : Number(valor), observacao: desfazer ? "" : $("nota-direta-obs").value.trim() }),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso(desfazer ? "Nota desfeita — vale a média dos pareceres." : `Nota do projeto registrada: ${valor}.`);
  } catch (e) { aviso(e.message, "err"); }
}

/* A resposta da coordenação à contestação. Fecha o pedido no registro; se a
   revisão proceder, mudar a nota continua sendo ato à parte — e fica no
   histórico como qualquer outra mudança de nota. */
async function responderContestacao(id) {
  const resposta = (prompt("Resposta à contestação — o professor vai ler este texto.") || "").trim();
  if (!resposta) return;
  if (resposta.length < 10) return aviso("Escreva a resposta à contestação.", "err");
  try {
    await api(`/api/ic/${ATUAL.id}/contestacao/responder`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, resposta }),
    });
    await carregar(); await abrir(ATUAL.id);
    aviso("Contestação respondida.");
  } catch (e) { aviso(e.message, "err"); }
}

/* A decisão da seleção numa tacada: aprovar (se ainda estiver submetido) e
   marcar o fomento — ou reprovar, com o parecer que a orientação vai ler. */
async function decidirSelecao(tipo) {
  try {
    if (tipo === "reprovado") {
      if (ATUAL.status === "aprovado" && !confirm("Este projeto já está APROVADO. Reprovar agora desfaz a decisão e cancela a bolsa concedida. Continuar?")) return;
      const parecer = prompt("Parecer da reprovação (a orientação vai ler):");
      if (parecer === null) return;
      if (parecer.trim().length < 10) return aviso("Escreva o parecer da reprovação — quem recebe precisa saber o porquê.", "warn");
      await api(`/api/ic/${ATUAL.id}/avaliar`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decisao: "reprovado", parecer }),
      });
      await carregar(); montarSidebar(); await abrir(ATUAL.id);
      return aviso("Projeto reprovado na seleção.");
    }
    const obs = tipo === "voluntario" ? "" : (prompt("Observação sobre a concessão (opcional):") ?? "");
    if (ATUAL.status === "submetido") {
      await api(`/api/ic/${ATUAL.id}/avaliar`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decisao: "aprovado", parecer: "" }),
      });
    }
    await api(`/api/ic/${ATUAL.id}/fomento`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tipo, observacao: obs }),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso(`Decisão registrada: aprovado — ${fomentoNome(tipo)}.${tipo !== "voluntario" ? " A orientação já pode indicar o bolsista na ficha do projeto." : ""}`);
  } catch (e) { aviso(e.message, "err"); }
}

/* --------------------- indicação do bolsista --------------------------- */
/* Abre quando a bolsa é concedida (CNPq ou UNIEGO). Quem preenche é a
   orientação — são os dados que a PROPPEX exporta para montar o contrato:
   CPF, telefone e a conta que vai receber a bolsa. O avaliador e os colegas
   de projeto nunca veem esses campos (o recorte é do servidor). */
function renderIndicacaoBolsista(p, ger) {
  // só depois do resultado: projeto aprovado com bolsa marcada na seleção
  if (!p.id || !["aprovado", "concluido"].includes(p.status)) return "";
  if (!p.fomento || p.fomento.tipo === "voluntario") return "";
  if (PODE.papel === "avaliador") return "";

  // O PRÓPRIO aluno preenche o cadastro do contrato — mas o formulário mora
  // na guia Bolsa, e não aqui: o cadastro é DA PESSOA, e repeti-lo em cada
  // projeto faria a mesma pessoa ter duas versões do próprio RG.
  if (PODE.papel === "aluno") {
    const eu = (p.alunos || []).find((a) => a.email === META.eu);
    if (!eu || !eu.bolsista) return "";
    const falta = faltaNoCadastroLocal(eu);
    return `<div class="card">
      <div class="card-t">Meu cadastro para o contrato da bolsa</div>
      <div class="card-s"><b>${esc(fomentoNome(p.fomento.tipo))}</b> concedida. O contrato sai do que
        você informar no seu cadastro — a conta e o Pix precisam estar no seu nome.</div>
      ${falta.length
        ? `<div class="banner ba-warn">Falta informar: <b>${esc(falta.join(", "))}</b>.</div>`
        : `<div class="banner ba-ok">Cadastro completo — nada pendente da sua parte.</div>`}
      <div class="exp"><button class="bt bt-pri" onclick="nav('bolsa')">
        ${falta.length ? "Completar o meu cadastro" : "Rever o meu cadastro"}</button></div>
    </div>`;
  }

  // orientação e gestão acompanham: quem já completou, quem ainda falta
  const bolsistas = (p.alunos || []).filter((a) => a.bolsista);
  const completo = (a) => a.dadosCompletos ?? cadastroCompletoLocal(a);
  return `<div class="card">
    <div class="card-t">Contrato da bolsa</div>
    <div class="card-s"><b>${esc(fomentoNome(p.fomento.tipo))}</b> concedida${p.fomento.modalidade ? ` (${esc(modNome(p.fomento.modalidade))})` : ""}.
      Os documentos e os dados bancários quem informa é <b>o próprio aluno</b>, depois do convite por e-mail —
      aqui fica só o andamento.</div>
    ${bolsistas.map((a) => `<div class="linha">
      <div class="txt"><div class="p1">${esc(a.nome || a.email || "Bolsista")}</div>
        <div class="p2">${esc(a.email || "sem e-mail — sem convite")}</div></div>
      ${completo(a) ? '<span class="badge b-validado">dados completos</span>'
        : '<span class="badge b-enviado">aguardando o aluno</span>'}
    </div>`).join("") || `<div class="banner ba-warn">Nenhum aluno marcado como <b>bolsista</b> na
      indicação acima — marque a caixa e salve o projeto.</div>`}

    ${renderSubstituicoes(p, bolsistas)}
  </div>`;
}

/* ------------------- substituição de bolsista --------------------------- */
/* A orientação SOLICITA a troca — quem sai, quem entra (nome, curso,
   período, e-mail, telefone) e o motivo — e a decisão é da coordenação.
   Aprovada, o sistema troca os vínculos e convida o novo aluno por e-mail. */
function renderSubstituicoes(p, bolsistas) {
  const pedidos = p.substituicoes || [];
