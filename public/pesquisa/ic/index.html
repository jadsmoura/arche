    </div>
    <div class="vc-lab">VISÕES GENÉRICAS — A CARA DE CADA ACESSO</div>
    <div class="vc-gen">${GENERICAS.map((g) => `<button class="vc-op ${COMO === g.id ? "on" : ""}"
      data-vc="${esc(g.id)}">${esc(g.rot)}<small>${esc(g.det)}</small></button>`).join("")}</div>
    <div class="vc-lab">PESSOA DO SETOR</div>
    <input id="vcBusca" placeholder="Procurar por nome ou e-mail…" autocomplete="off"
      oninput="VC.busca=this.value;renderVcLista()" onkeydown="vcTecla(event)">
    <div class="vc-abas" id="vcAbas"></div>
    <div class="vc-lista" id="vcLista"></div>
  </div>`;
  ov.classList.remove("hide");
  // um só ouvinte para a janela inteira: fundo fecha, opção escolhe, aba filtra
  ov.onclick = (ev) => {
    if (ev.target === ov || ev.target.closest("[data-fechar]")) return fecharVerComo();
    const op = ev.target.closest("[data-vc]");
    if (op) { fecharVerComo(); verComo(op.dataset.vc); return; }
    const aba = ev.target.closest("[data-aba]");
    if (aba) { VC.aba = aba.dataset.aba; renderVcAbas(); renderVcLista(); }
  };
  document.addEventListener("keydown", vcEscapa);
  renderVcAbas(); renderVcLista();
  $("vcBusca").focus();
}

function fecharVerComo() {
  $("ovComo").classList.add("hide");
  document.removeEventListener("keydown", vcEscapa);
}
const vcEscapa = (ev) => { if (ev.key === "Escape") fecharVerComo(); };
/* Enter na busca leva ao primeiro da lista: achou digitando, não precisa
   tirar a mão do teclado para clicar. */
function vcTecla(ev) {
  if (ev.key !== "Enter") return;
  ev.preventDefault();
  const p = $("vcLista").querySelector("[data-vc]");
  if (p) { fecharVerComo(); verComo(p.dataset.vc); }
}

function renderVcAbas() {
  const gente = vcPessoas();
  const conta = (k) => (k === "todos" ? gente.length : gente.filter((p) => p.papeis.includes(k)).length);
  $("vcAbas").innerHTML = [["todos", "Todos"], ["orientador", "Professores"],
    ["aluno", "Alunos"], ["avaliador", "Avaliadores"],
    ["docente", "Docentes do portal"], ["estudante", "Estudantes do portal"]]
    .filter(([k]) => k === "todos" || conta(k))
    .map(([k, rot]) => `<button class="vc-aba ${VC.aba === k ? "on" : ""}" data-aba="${k}">${rot} ${conta(k)}</button>`)
    .join("");
}

function renderVcLista() {
  const busca = semAcento(VC.busca).trim();
  const gente = vcPessoas()
    .filter((p) => VC.aba === "todos" || p.papeis.includes(VC.aba))
    .filter((p) => !busca || semAcento(`${p.nome || ""} ${p.email || ""}`).includes(busca));
  $("vcLista").innerHTML = gente.length ? gente.map((p) => {
    const nome = p.nome || p.email || p.id;
    const ini = nome.trim().split(/\s+/).slice(0, 2).map((x) => x[0] || "").join("").toUpperCase() || "?";
    const det = p.semConta ? "ainda sem conta — o vínculo é pelo CPF" : (p.email || "—");
    const tags = p.papeis.map((k) => `<span class="vc-tag ${PAPEL_VC[k].cls}">${PAPEL_VC[k].rot}${
      p.contagem[k] > 1 ? ` ${p.contagem[k]}` : ""}</span>`).join("");
    return `<button class="vc-p ${COMO === p.id ? "on" : ""}" data-vc="${esc(p.id)}">
      <span class="vc-ini">${esc(ini)}</span>
      <span style="min-width:0;flex:1">
        <span class="nm">${esc(nome)}</span>
        <span class="dt">${esc(det)}</span></span>
      <span class="tags">${tags}</span></button>`;
  }).join("") : `<div class="vc-vazio">Ninguém encontrado${VC.busca ? ` com “${esc(VC.busca)}”` : " neste grupo"}.</div>`;
}

const rotuloPerfil = () => META.gestao ? "coordenação de pesquisa"
  : ehAluno() ? "aluno de IC" : ehAvaliador() ? "avaliador ad hoc"
  : META.perfil === "em" ? "bolsista do Ensino Médio" : "orientação";

function faixaVerComo() {
  if (!COMO) return "";
  if (COMO.startsWith("perfil:")) {
    const g = GENERICAS.find((x) => x.id === COMO);
    return `<div class="banner ba-warn" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span>Você está vendo o setor como <b>${esc(g?.faixa || "um perfil genérico")}</b> —
        é a cara do acesso, não os dados de alguém. Somente leitura.</span>
      <button class="bt bt-ghost" style="margin-left:auto" onclick="verComo('')">Voltar a ver como gestor</button>
    </div>`;
  }
  const quem = vcPessoas().find((p) => p.id === COMO);
  return `<div class="banner ba-warn" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span>Você está vendo o setor como <b>${esc(quem?.nome || COMO)}</b>
      (${esc(rotuloPerfil())})${quem?.semConta ? " — pessoa ainda sem conta: é o que ela encontrará ao se cadastrar com o CPF" : ""}
      — somente leitura, nada aqui grava em nome dela.</span>
    <button class="bt bt-ghost" style="margin-left:auto" onclick="verComo('')">Voltar a ver como coordenação</button>
  </div>`;
}

/* A troca é tudo ou nada: se a busca falhar no meio, a tela voltava a dizer
   "você está vendo como fulano" com os dados de outra pessoa na frente. COMO
   precisa valer DURANTE as buscas (é ele que vai no ?como=), mas só se
   consolida quando as duas voltam. */
async function verComo(email) {
  const anterior = COMO;
  COMO = email || "";
  let meta;
  try {
    meta = await api("/api/ic/meta");
    await carregar();
  } catch (e) {
    COMO = anterior;              // nada mudou: a tela segue coerente
    aviso(e.message, "err");
    return;                       // sem META nova não há tela a remontar
  }
  META = meta;
  if (COMO) sessionStorage.setItem("arche-ic-como", COMO); else sessionStorage.removeItem("arche-ic-como");
  montarSidebar(); montarVerComo();
  // a seção em que se estava pode não existir para a outra pessoa
  const vale = SECOES.filter((x) => !x.perfis || x.perfis.includes(META.perfil)).map((x) => x.id);
  nav(vale.includes(SECAO) ? SECAO : (vale[0] || "painel"));
}

/* ---------------------- O QUE FOI DIGITADO NÃO SE PERDE -----------------
   Relato de um professor (ago/2026): "os alunos que preenchi para o projeto
   de IC não estão ficando salvos". Estavam sendo perdidos ANTES de sair da
   tela: a ficha do projeto tem quase quatro mil pixels de altura, o quadro
   de alunos fica no meio dela e o único "Salvar" ficava no ÚLTIMO card, duas
   telas de rolagem abaixo — passando por pendências, seleção, avaliação e
   relatórios. Quem indicava os alunos e mudava de guia (ou fechava a aba)
   levava o trabalho embora, e nada avisava.

   Não se resolve com gravação automática, como nas atas: aqui salvar DISPARA
   O CONVITE POR E-MAIL ao aluno indicado, e um e-mail a cada poucos segundos
   sairia para endereços digitados pela metade. A saída é a outra: o ato de
   salvar passa a existir JUNTO do quadro em que se trabalha, o selo diz que
   há coisa por gravar, e sair com alterações pendentes avisa — no fechar da
   aba e na navegação entre guias, que é por onde a perda realmente acontecia. */
let SUJO = false;
function marcarSujo() {
  if (SUJO) return;
  SUJO = true;
  document.querySelectorAll(".selo-sujo").forEach((s) => { s.textContent = "alterações não salvas"; s.classList.add("on"); });
}
function limparSujo() {
  SUJO = false;
  document.querySelectorAll(".selo-sujo").forEach((s) => { s.textContent = "tudo salvo"; s.classList.remove("on"); });
}
/* Qualquer digitação dentro do editor suja o projeto. É um ouvinte só, na
   captura: os campos são redesenhados o tempo todo (addAluno, addEtapa), e
   um ouvinte por campo escaparia justamente nas linhas novas. */
for (const ev of ["input", "change"]) {
  document.addEventListener(ev, (e) => {
    if (!ATUAL) return;
    const v = e.target?.closest?.("#v-projeto, #v-submissao");
    if (v) marcarSujo();
  }, true);
}
window.addEventListener("beforeunload", (e) => {
  if (!SUJO) return;
  e.preventDefault(); e.returnValue = "";
});
/** Deixar o que está aberto: pergunta antes, quando há coisa por gravar. */
function podeSair() {
  if (!SUJO) return true;
  if (!confirm("Há alterações que ainda não foram salvas neste projeto — inclusive os alunos indicados.\n\n"
    + "Sair sem salvar? O que foi digitado será perdido.")) return false;
  limparSujo();
  return true;
}

function nav(secao, modo) {
  if (secao !== SECAO && !podeSair()) return;
  SECAO = secao;
  // a inclusão manual vale só para o formulário aberto por ela
  MANUAL = secao === "submissao" && modo === "manual";
  for (const b of document.querySelectorAll(".side-item")) b.classList.toggle("on", b.dataset.s === secao);
  for (const v of ["painel", "submissao", "gestao", "meusprojetos", "bolsa", "avaliacao", "classificacao", "bolsas", "editais", "bolsistas", "em", "meuem", "cronograma", "relatorios", "certificados", "projeto"]) $("v-" + v).classList.add("hide");
  // submissão e projeto compartilham o editor (mesmos ids): a seção que sai
  // do ar é esvaziada, senão getElementById acha os campos escondidos
  for (const v of ["submissao", "projeto"]) if (v !== secao) $("v-" + v).innerHTML = "";

  const [t, s] = TITULOS[secao] || ["", ""];
  $("titulo").textContent = t; $("subtitulo").textContent = s; $("crumb").textContent = t;
  $("aviso").innerHTML = faixaVerComo();

  if (secao === "painel") { renderPainel(); if (META.gestao) quadroICEM(); }
  if (secao === "submissao") {
    ATUAL = novoProjeto();
    PODE = { podeEditar: true, podeGerir: true, papel: MANUAL ? "gestao" : "orientador" };
    if (MANUAL) {
      $("titulo").textContent = "Inclusão de projeto pela coordenação";
      $("crumb").textContent = "Inclusão pela coordenação";
      $("subtitulo").textContent = "Projeto de outro professor, com pedido fora do prazo deferido pela pró-reitoria.";
    }
    renderEditor("v-submissao");
  }
  if (secao === "gestao") renderGestao();
  if (secao === "meusprojetos") renderMeusProjetos();
  if (secao === "bolsa") renderMinhaBolsa();
  if (secao === "avaliacao") renderAvaliacao();
  if (secao === "classificacao") renderClassificacao();
  if (secao === "bolsistas") renderBolsistas();
  if (secao === "em") renderEM();
  if (secao === "meuem") renderMeuEM();
  if (secao === "editais") renderEditais();
  if (secao === "cronograma") renderCronograma();
  if (secao === "relatorios") renderRelatorios();
  if (secao === "bolsas") renderBolsas();
  if (secao === "certificados") renderCertificados();
  $("v-" + secao).classList.remove("hide");
  window.scrollTo(0, 0);
}

/* -------------------------------- dados -------------------------------- */
async function carregar() {
  const [lista, crono, rel] = await Promise.all([
    api("/api/ic"), api("/api/ic/cronograma"), api("/api/ic/relatorios"),
  ]);
  PROJETOS = lista.projetos || [];
  ETAPAS = crono.etapas || [];
  RELS = { relatorios: rel.relatorios || [], pendentes: rel.pendentes || [] };
}

async function abrir(id) {
  // abrir outro projeto abandona o que está na tela: pergunta antes
  if (!podeSair()) return;
  try {
    // guarda de onde se veio, para o "Retornar" voltar à lista certa —
    // salvar reabre o projeto (SECAO já é "projeto") e a origem não muda
    if (SECAO && SECAO !== "projeto" && SECAO !== "submissao") ORIGEM_LISTA = SECAO;
    const r = await api("/api/ic/" + id);
    ATUAL = r.projeto; PODE = r;
    limparSujo();                  // o que está na tela é o que veio do servidor
    // NP/CL/total vem ao lado do projeto (derivado, não gravado)
    if (r.classificacao !== undefined) ATUAL.classificacao = r.classificacao;
    nav("projeto");
    $("crumb").textContent = ATUAL.numero || "Projeto";
    $("titulo").textContent = ATUAL.numero || "Projeto";
    $("subtitulo").textContent = ATUAL.titulo || "";
    renderEditor("v-projeto");
  } catch (e) { aviso(e.message, "err"); }
}

function novoProjeto() {
  return {
    titulo: "", resumo: "", palavrasChave: "", curso: "", modalidade: "pibic", edital: "",
    linhaPesquisa: "", objetivos: "", metodologia: "", inicio: "", fim: "",
    // na inclusão manual quem orienta é outra pessoa: os campos nascem vazios
    orientador: MANUAL ? { nome: "", email: "", cpf: "", titulacao: "" }
      : { nome: ME?.perfil?.nome || ME?.nome || "", email: ME?.email || "", titulacao: "" },
    alunos: [], cronograma: [], relatorios: [], status: "rascunho",
    // a planilha de produção é da PESSOA: a nova submissão do professor já
    // abre com a da última vez (na inclusão manual, quem preenche é a busca
    // pelo CPF/e-mail de quem orienta — buscarProducaoDoProfessor)
    producao: MANUAL ? {} : { ...(META.producaoAnterior || {}) },
    ...(MANUAL ? { inclusaoManual: { motivo: "" } } : {}),
  };
}

/** A coordenação abre a submissão em nome de quem orienta. */
function incluirManualmente() {
  nav("submissao", "manual");
}

/* -------------------------------- painel ------------------------------- */
function renderPainel() {
  // o Painel é do CICLO VIGENTE: o arquivo dos editais anteriores não entra
  // aqui — ele vive nas guias Gestão, Projetos e Bolsistas, atrás do filtro
  // de ciclo
  const vigente = META.edital?.numero || "";
  const meus = PROJETOS.filter((p) => (p.edital || vigente) === vigente);
  const idsCiclo = new Set(meus.map((p) => p.id));
  const etapasCiclo = ETAPAS.filter((e) => idsCiclo.has(e.projetoId));
  const cont = (s) => meus.filter((p) => p.status === s).length;
  const atrasadas = etapasCiclo.filter((e) => e.situacao !== "concluida" && e.fim && e.fim < hojeISO());
  const aValidar = RELS.relatorios.filter((r) => r.podeValidar);
  const minhasPendencias = RELS.pendentes;

  const aDarParecer = meus.filter((p) => p.aDarParecer);
  // o ALUNO não é do ciclo: ele é dos projetos em que foi indicado — inclusive
  // os do ciclo em regularização (01/2025), que são concluídos de outro edital.
  // Contar só o vigente dizia "nenhum projeto" a quem tem relatório a entregar.
  const meusDeAluno = ehAluno() ? meusProjetos() : [];
  const kpis = ehAluno()
    ? [["Projetos", meusDeAluno.length, "em que você foi indicado"],
       ["Atividades", etapasCiclo.length, "no seu plano de trabalho"],
       ["Em atraso", atrasadas.length, "atividades vencidas"],
       ["Relatórios a enviar", minhasPendencias.length, "parciais e finais"]]
    : ehAvaliador()
      ? [["Designados a você", meus.length, "projetos da seleção"],
         ["Parecer pendente", aDarParecer.length, "aguardando você"],
         ["Pareceres entregues", meus.filter((p) => p.meuParecer?.situacao === "entregue").length, "já respondidos"],
         ["Recusados", meus.filter((p) => p.meuParecer?.situacao === "recusado").length, "por impedimento"]]
      : META.gestao
        ? [["Em avaliação", cont("submetido"), "aguardando a PROPPEX"],
           ["Em execução", cont("aprovado"), "projetos aprovados"],
           ["Relatórios em atraso", meus.filter((p) => p.prazoRelatorios?.atrasado).length, "projetos fora do prazo"],
           ["Relatórios a validar", aValidar.length, "enviados pelos alunos"]]
        : [["Em avaliação", cont("submetido"), "aguardando a PROPPEX"],
           ["Em execução", cont("aprovado"), "projetos aprovados"],
           ["Atividades em atraso", atrasadas.length, "no cronograma"],
           ["Relatórios a validar", aValidar.length, "enviados pelos alunos"]];

  const foraDoPrazo = META.gestao ? meus.filter((p) => p.prazoRelatorios?.atrasado) : [];

  // Avaliação do ciclo (só a gestão): quantos projetos do edital vigente já
  // têm decisão — e, com todos avaliados, os botões de publicação do
  // resultado, na ordem do processo: preliminar (só os aprovados, para
  // definir as bolsas com a presidência) e depois o final (com a bolsa).
  const cicloAval = META.gestao ? (() => {
    const doCiclo = meus.filter((p) => p.status !== "rascunho" && p.status !== "devolvido");
    const avaliados = doCiclo.filter((p) => ["aprovado", "reprovado", "concluido"].includes(p.status));
    const fase = ((META.editais || []).find((e) => e.numero === vigente) || {}).resultadoFase || null;
    const completo = doCiclo.length > 0 && avaliados.length === doCiclo.length;
    const semBolsa = doCiclo.filter((p) => ["aprovado", "concluido"].includes(p.status) && !p.fomento).length;
    const pct = doCiclo.length ? Math.round((avaliados.length / doCiclo.length) * 100) : 0;
    return `<div class="card">
      <div class="card-t">Avaliação do ciclo — Edital ${esc(vigente)}</div>
      <div class="card-s"><b>${avaliados.length}</b> de <b>${doCiclo.length}</b> projeto(s) avaliado(s) (${pct}%).</div>
      <div style="height:8px;border-radius:6px;background:var(--wash2);overflow:hidden;margin:8px 0 14px">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--brand-2),var(--accent))"></div></div>
      ${fase ? `<div class="banner ${fase === "final" ? "ba-ok" : "ba-warn"}" style="margin:0 0 12px">
        ${fase === "final"
          ? "<b>Resultado final publicado</b> — com a bolsa concedida a cada projeto."
          : `<b>Resultado preliminar publicado</b> — só os aprovados, ainda sem as bolsas. ${semBolsa
            ? `${semBolsa} aprovado(s) aguardando a decisão de fomento para o resultado final.`
            : "Todos os aprovados já têm decisão de fomento — o resultado final pode ser publicado."}`}</div>` : ""}
      ${completo || fase ? `<div style="display:flex;gap:10px;flex-wrap:wrap">
          ${!fase ? `<button class="bt bt-pri" onclick="publicarResultado('${esc(vigente)}','preliminar')">📢 Publicar resultado preliminar</button>` : ""}
          ${fase !== "final" ? `<button class="bt ${fase === "preliminar" ? "bt-pri" : "bt-sec"}" onclick="publicarResultado('${esc(vigente)}','final')">🏁 Publicar resultado final</button>` : ""}
          ${fase ? `<button class="bt bt-ghost" onclick="publicarResultado('${esc(vigente)}', null)">Recolher publicação</button>` : ""}
        </div>`
        : `<div style="font-size:13px;color:var(--muted)">Quando todos os projetos do ciclo estiverem avaliados, os botões de
          publicação aparecem aqui: primeiro o <b>resultado preliminar</b> (só os aprovados, para definir as bolsas com a
          presidência) e, distribuídas as bolsas, o <b>resultado final</b>.</div>`}
    </div>`;
  })() : "";

  $("v-painel").innerHTML = `
    <div class="kpis">${kpis.map(([l, v, d]) => `
      <div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("")}
    </div>

    ${cicloAval}
    ${quadroUsuarios()}
    ${META.gestao ? '<div id="quadro-icem"></div>' : ""}
    ${panoramaDoCiclo(meus)}

    ${(() => {
      // o aluno recém-convidado não sabe o que o sistema espera dele: o
      // cadastro do contrato é a primeira coisa que aparece
      if (!ehAluno()) return "";
      const pendentes = meusProjetos().filter((p) => {
        const eu = meuRegistro(p);
        return eu?.bolsista && p.fomento && p.fomento.tipo !== "voluntario" && !cadastroCompletoLocal(eu);
      });
      if (!pendentes.length) return "";
      return `<div class="banner ba-warn"><b>Falta o seu cadastro para o contrato da bolsa.</b>
        A PROPPEX precisa dos seus documentos, endereço e dados bancários para efetivar o pagamento.
        <button class="bt bt-pri" style="margin-left:8px" onclick="nav('bolsa')">Preencher agora</button></div>`;
    })()}

    ${META.gestao && foraDoPrazo.length ? `<div class="banner ba-warn"><b>Relatórios em atraso</b> —
      ${foraDoPrazo.length} projeto(s) fora do prazo do edital:
      ${foraDoPrazo.slice(0, 8).map((p) => `<a href="#" onclick="abrir('${esc(p.id)}');return false">${esc(p.numero || p.titulo)}</a>`).join(" · ")}${foraDoPrazo.length > 8 ? " · …" : ""}
      — a lista completa está na guia Relatórios.</div>` : ""}

    ${ehAluno() && meusDeAluno.length && minhasPendencias.length ? `<div class="banner ba-warn">
      <b>Você tem ${minhasPendencias.length} relatório(s) a enviar.</b> Abra o seu projeto na guia
      <a href="#" onclick="nav('meusprojetos');return false">Meus projetos</a> e use o botão
      "preencher relatório" ao lado de cada prazo.</div>` : ""}

    ${!(ehAluno() ? meusDeAluno.length : meus.length) ? `<div class="card"><div class="card-t">Comece por aqui</div>
      <div class="card-s">${ehAluno()
        ? "Você ainda não foi indicado em nenhum projeto. Quem orienta faz a indicação pelo seu e-mail."
        : ehAvaliador()
          ? "Nenhum projeto designado a você. A coordenação designa os avaliadores dentro de cada projeto."
          : "Nenhum projeto ainda. A submissão abre o rascunho, que você preenche no seu tempo."}</div>
      ${ehAluno() || ehAvaliador() ? "" : `<button class="bt bt-pri" onclick="nav('submissao')">＋ Submeter projeto</button>`}</div>` : ""}

    <div class="duplo">
      <div class="card">
        <div class="card-t">Projetos</div>
        <div class="card-s">${meus.length} projeto(s) do ciclo ${esc(vigente)} — o arquivo dos
          editais anteriores está na guia Gestão, no filtro de ciclo.</div>
        ${meus.slice(0, 6).map((p) => `
          <div class="linha" style="cursor:pointer" onclick="abrir('${esc(p.id)}')">
            <div class="txt">
              <div class="p1">${esc(p.titulo || "(sem título)")}</div>
              <div class="p2">${esc(p.numero || "sem número")} · ${esc(cursoNome(p.curso))} · ${esc(modNome(p.modalidade))}</div>
            </div>${chip(p.status)}
          </div>`).join("") || `<div class="vazio">Nada por aqui ainda.</div>`}
        ${meus.length > 6 ? `<div style="margin-top:10px"><button class="bt bt-ghost" onclick="nav('gestao')">Ver todos</button></div>` : ""}
      </div>

      <div class="card">
        <div class="card-t">Próximas atividades</div>
        <div class="card-s">Do cronograma, a partir de hoje.</div>
        ${etapasCiclo.filter((e) => e.situacao !== "concluida").slice(0, 7).map((e) => `
          <div class="linha">
            <div class="txt">
              <div class="p1">${esc(e.atividade)}</div>
              <div class="p2">${esc(e.numero || "—")} · ${esc(e.responsavelNome)} · até ${fmtD(e.fim)}</div>
            </div>
            ${e.fim && e.fim < hojeISO() ? `<span class="badge b-atrasada">atrasada</span>` : chip2(e.situacao)}
          </div>`).join("") || `<div class="vazio">Sem atividades pendentes.</div>`}
      </div>
    </div>

    ${aValidar.length ? `<div class="card">
      <div class="card-t">Relatórios aguardando sua validação</div>
      <div class="card-s">Enviados pelos alunos indicados — leia e decida sem sair do painel.</div>
      ${aValidar.map((r) => `<div class="linha" style="flex-wrap:wrap">
        <div class="txt" style="cursor:pointer" onclick="abrir('${esc(r.projetoId)}')"><div class="p1">${esc(r.alunoNome)} — relatório ${esc(r.tipo)}</div>
        <div class="p2">${esc(r.numero || "")} · enviado em ${fmtDH(r.enviadoEm)}</div></div>
        <button class="bt bt-ok" style="padding:4px 10px" onclick="lerEValidarIC('${esc(r.projetoId)}','${esc(r.tipo)}','${esc(r.id)}')">📖 Ler e validar</button></div>`).join("")}
    </div>` : ""}`;
}
const chip2 = (s) => `<span class="badge b-${esc(s)}">${esc({ prevista: "prevista", andamento: "em andamento", concluida: "concluída" }[s] || s)}</span>`;

/* ------------------------- usuários do portal --------------------------- */
/* Quantas contas o ARCHÉ conhece, quantas já podem entrar e quantas
   completaram o próprio cadastro. É número do PORTAL inteiro, não da IC —
   por isso vem de rota própria e só para o gestor geral, que é quem
   responde pela gestão de acessos. Contagens apenas: nenhum nome, nenhum
   e-mail sai por aqui. */
/* O quadro do ICEM no Painel (só gestão): a evolução dos relatórios da
   turma escolhida — entregues, validados e pendentes — sem sair do Painel.
   Os dados vêm da mesma rota da guia Ensino Médio, carregados uma vez. */
let TURMA_PAINEL_EM = "";
async function quadroICEM() {
  const alvo = $("quadro-icem");
  if (!alvo || !META.gestao) return;
  if (!EM) {
    try { EM = await api("/api/ic/em"); } catch { alvo.innerHTML = ""; return; }
  }
  const turmas = (EM.turmas || []).slice().reverse();
  if (!TURMA_PAINEL_EM || !turmas.some((t) => t.ciclo === TURMA_PAINEL_EM)) {
    TURMA_PAINEL_EM = (turmas.find((t) => !t.encerrada) || turmas[0] || {}).ciclo || "";
  }
  const turma = turmas.find((t) => t.ciclo === TURMA_PAINEL_EM) || {};
  const da = (EM.bolsistas || []).filter((b) => b.turma === TURMA_PAINEL_EM && b.situacao !== "desligado");
  const tipos = turma.relatoriosFinalizados ? [] : turma.encerrada ? ["final"] : ["parcial", "final"];
  const conta = (tipo, s) => da.filter((b) => (b.relatorios?.[tipo]?.situacao || "pendente") === s).length;
  const barra = (tipo) => {
    const validados = conta(tipo, "validado"), entregues = conta(tipo, "entregue"),
      devolvidos = conta(tipo, "devolvido"), pendentes = da.length - validados - entregues - devolvidos;
    const pct = da.length ? Math.round(((validados + entregues) / da.length) * 100) : 0;
    return `<div style="margin-top:8px">
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <b>Relatório ${tipo}</b>
        <span class="muted">${validados} validado(s) · ${entregues} a validar · ${devolvidos} devolvido(s) · ${pendentes} pendente(s)</span>
      </div>
      <div class="trilho" style="height:10px;border-radius:6px;background:var(--linha);overflow:hidden;margin-top:4px">
        <div style="height:100%;width:${pct}%;background:var(--acento,#40717e)"></div>
      </div>
    </div>`;
  };
  alvo.innerHTML = `<div class="card">
    <div class="card-t" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">ICEM — evolução dos relatórios
      <select style="width:auto;min-width:220px;font-size:13px" onchange="TURMA_PAINEL_EM=this.value;quadroICEM()">
        ${turmas.map((t) => `<option value="${esc(t.ciclo)}" ${TURMA_PAINEL_EM === t.ciclo ? "selected" : ""}>Turma ${esc(t.ciclo)}${t.encerrada ? " · encerrada" : " · atual"}</option>`).join("")}
      </select></div>
    <div class="card-s">${da.length} bolsista(s)${turma.prazoRelatorioFinal
      ? ` · prazo do final: <b>${turma.prazoRelatorioFinal.split("-").reverse().join("/")}</b>` : ""} ·
      a validação é da PROPPEX, na guia <a href="#" onclick="nav('em');return false">Ensino Médio</a>.</div>
    ${tipos.map(barra).join("") || '<div class="muted" style="margin-top:6px">Os relatórios desta turma foram entregues e encerrados fora do sistema — nada pendente.</div>'}
  </div>`;
}

function quadroUsuarios() {
  if (ME?.papel !== "gestor") return "";
  const u = USUARIOS;
  const pct = (n) => (u && u.total ? Math.round((n / u.total) * 100) : 0);
  return `<div class="card">
    <div class="card-t">Usuários do portal</div>
    <div class="card-s">Todas as contas que o ARCHÉ conhece — dos quatro setores, não só da IC.
      ${u ? `<a href="/usuarios/">Abrir a gestão de acessos</a>` : ""}</div>
    ${!u ? `<div class="vazio">Contando…</div>` : `
    <div class="kpis" style="margin-bottom:0">
      <div class="kpi"><div class="l">Usuários cadastrados</div>
        <div class="v">${u.total}</div>
        <div class="d">perfis, papéis e quem aparece nos registros</div></div>
      <div class="kpi"><div class="l">Com acesso ao sistema</div>
        <div class="v" style="color:var(--ok)">${u.comAcesso}</div>
        <div class="d" style="color:${u.pendentes ? "var(--warn)" : "var(--muted)"}">${pct(u.comAcesso)}% do total${
          u.pendentes ? ` · ${u.pendentes} aguardando aprovação` : ""}</div></div>
      <div class="kpi"><div class="l">Com perfil completo</div>
        <div class="v">${u.perfilCompleto}</div>
        <div class="d" style="color:${u.perfilCompleto === u.total ? "var(--ok)" : "var(--warn)"}">${pct(u.perfilCompleto)}% do total${
          u.perfilIniciado > u.perfilCompleto ? ` · ${u.perfilIniciado - u.perfilCompleto} preencheram só em parte` : ""}</div></div>
      <div class="kpi"><div class="l">Prontos para usar</div>
        <div class="v">${u.prontos}</div>
        <div class="d">com acesso <b>e</b> cadastro completo</div></div>
    </div>`}
  </div>`;
}

async function carregarUsuariosDoPortal() {
  if (ME?.papel !== "gestor" || USUARIOS) return;
  try {
    USUARIOS = await api("/api/usuarios/resumo");
    if (SECAO === "painel") renderPainel();
  } catch { /* sem o resumo o painel segue igual — é um quadro a mais */ }
}


/* --------------------- ICEM — Iniciação Científica EM ------------------- */
/* OUTRO programa: o bolsista do Ensino Médio ACOMPANHA projetos (e troca ao
   longo do ano) para conhecer os cursos, a ciência e o UNIEGO. Quem conduz
   é a coordenação — o aluno é menor e não tem conta no portal. A guia é o
   posto de trabalho disso: bolsas 12+12, projeto acompanhado com a
   trajetória, relatório simplificado e CONINT. */
let EM = null, TURMA_EM = "";

async function renderEM() {
  const el = $("v-em");
  if (!EM) {
    el.innerHTML = '<div class="card"><div class="vazio">Carregando o programa…</div></div>';
    try { EM = await api("/api/ic/em"); }
    catch (e) { el.innerHTML = `<div class="banner ba-err">${esc(e.message)}</div>`; return; }
  }
  const turmas = (EM.turmas || []).slice().reverse();
  if (!TURMA_EM || !turmas.some((t) => t.ciclo === TURMA_EM)) {
    TURMA_EM = (turmas.find((t) => !t.encerrada) || turmas[0] || {}).ciclo || "";
  }
  const turma = turmas.find((t) => t.ciclo === TURMA_EM) || {};
  const da = (EM.bolsistas || []).filter((b) => b.turma === TURMA_EM)
    .sort((a, b) => (a.colocacao ?? 999) - (b.colocacao ?? 999) || a.nome.localeCompare(b.nome, "pt-BR"));
  const cotas = (EM.cotas || {})[TURMA_EM] || [];
  const atual = (b) => (b.trajetoria || []).find((e) => !e.ate) || null;
  const ativos = da.filter((b) => b.situacao !== "desligado");
  const comProjeto = ativos.filter((b) => atual(b));
  const entregues = da.filter((b) => ["entregue", "validado"].includes(b.relatorios?.final?.situacao));

  // projetos que podem ser acompanhados: os do ciclo da graduação em execução
  const acompanhaveis = PROJETOS.filter((p) => ["aprovado", "concluido"].includes(p.status))
    .sort((a, b) => cursoNome(a.curso).localeCompare(cursoNome(b.curso), "pt-BR")
      || String(a.titulo).localeCompare(String(b.titulo), "pt-BR"));
  const opcoesProjeto = (b) => {
    const pa = atual(b);
    return '<option value="">— sem projeto no momento —</option>' + acompanhaveis.map((p) =>
      `<option value="${esc(p.id)}" ${pa?.projetoId === p.id ? "selected" : ""}>${esc(cursoNome(p.curso))} · ${esc(p.titulo.slice(0, 70))}${p.titulo.length > 70 ? "…" : ""}</option>`).join("");
  };

  /* O PEDIDO DE ALTERAÇÃO DE PROJETO, na ficha do bolsista (pedido do dono,
     ago/2026): a decisão é da coordenação de pesquisa, e ela decide onde já
     está olhando o estudante — sem outra tela para procurar. Recusar exige o
     motivo: é o que ele lê. */
  const pedidoTrocaGestao = (b) => {
    const p = (b.pedidosProjeto || []).find((x) => x.situacao === "pendente");
    if (!p) return "";
    return `<div class="banner ba-warn" style="margin-top:8px">
      <b>Pedido de alteração de projeto.</b> Quer passar a acompanhar
      <b>${esc(p.numero || "")} ${esc(p.titulo.slice(0, 80))}</b>${p.orientador ? ` · orientação de ${esc(p.orientador)}` : ""}${p.curso ? ` · ${esc(cursoNome(p.curso))}` : ""}.
      <div class="kv" style="margin-top:6px">Motivo: ${esc(p.motivo)}</div>
      <div class="exp" style="margin-top:8px;gap:6px">
        <button class="bt bt-ok" onclick="emDecidirPedido('${esc(b.id)}','${esc(p.id)}','aprovado')">✓ Aprovar a troca</button>
        <button class="bt bt-err" onclick="emDecidirPedido('${esc(b.id)}','${esc(p.id)}','recusado')">Recusar</button>
      </div></div>`;
  };

  const cartao = (b) => {
    const pa = atual(b);
    const passados = (b.trajetoria || []).filter((e) => e.ate);
    return `<div class="bloco">
      <div class="bloco-cab">
        <span class="t">${b.colocacao ? b.colocacao + "º · " : ""}${esc(b.nome)}</span>
        ${b.bolsa ? `<span class="badge b-${b.bolsa === "cnpq" ? "aprovado" : "validado"}">${esc((EM.bolsas.find((x) => x.codigo === b.bolsa) || {}).nome || b.bolsa)}</span>` : '<span class="badge b-rascunho">sem bolsa</span>'}
        ${b.situacao === "desligado" ? '<span class="badge b-atrasada">desligado</span>' : ""}
        ${b.compareceu === false ? '<span class="badge b-atrasada" title="Não compareceu à entrevista da seleção">NC na seleção</span>' : ""}
      </div>
      <div class="muted" style="margin-bottom:6px">
        ${esc(b.escola || "escola não informada")}${b.serie ? ` · ${esc(b.serie)}` : ""}
        ${b.cursoInteresse ? ` · interesse: ${esc(b.cursoInteresse)}` : ""}
        ${b.notaSelecao != null ? ` · nota ${b.notaSelecao}` : ""}<br>
        ${esc(b.telefone || "")}${b.email ? ` · ${esc(b.email)}` : ""}
        ${b.responsavel?.nome ? `<br>Responsável: ${esc(b.responsavel.nome)}` : ""}
      </div>

      <div class="grid2" style="align-items:end">
        <div><label>Bolsa</label>
          <select onchange="emBolsa('${esc(b.id)}',this.value)">
            <option value="">— sem bolsa —</option>
            ${EM.bolsas.map((x) => `<option value="${x.codigo}" ${b.bolsa === x.codigo ? "selected" : ""}>${esc(x.nome)} — R$ ${x.valor}</option>`).join("")}
          </select></div>
        ${turma.encerrada
          ? `<div><label>Projeto acompanhado</label>
            <div class="kv" style="padding:9px 0">${(() => {
              const ult = (b.trajetoria || []).slice(-1)[0];
              return ult ? `<b>${esc(ult.numero || "")}</b> ${esc((ult.titulo || "").slice(0, 70))} · orientação de ${esc(ult.orientador || "—")}`
                : '<span class="muted">sem acompanhamento registrado</span>';
            })()}</div></div>`
          : `<div><label>Projeto que acompanha <span class="muted">(trocar aqui fecha o anterior e guarda a trajetória)</span></label>
          <select onchange="emProjeto('${esc(b.id)}',this.value)">${opcoesProjeto(b)}</select></div>`}
      </div>
      ${pa && !turma.encerrada ? `<div class="kv" style="margin-top:6px">Acompanha <b>${esc(pa.numero || "")}</b> ${esc(pa.titulo.slice(0, 80))} ·
        orientação de ${esc(pa.orientador || "—")} · desde ${fmtD(pa.de)}</div>` : ""}
      ${passados.length ? `<details style="margin-top:6px"><summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">
          Trajetória (${passados.length} anterior${passados.length > 1 ? "es" : ""})</summary>
        ${passados.map((e) => `<div class="kv muted">• ${esc(e.numero || "")} ${esc(e.titulo.slice(0, 70))} · ${fmtD(e.de)} → ${fmtD(e.ate)}</div>`).join("")}
      </details>` : ""}

      ${emBlocoRelatoriosGestao(b, turma)}
      <details style="margin-top:6px"><summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">👤 Dados do aluno (cadastro do contrato)</summary>
        <div style="margin-top:6px">
          ${[["CPF", b.cpf ? b.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : ""],
            ["RG", b.rg], ["Escola", b.escola], ["Série", b.serie],
            ["Telefone", b.telefone], ["E-mail", b.email],
            ["Responsável", b.responsavel?.nome], ["CPF do responsável", b.responsavel?.cpf ? String(b.responsavel.cpf).replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : ""],
            ["Banco", b.banco], ["Agência", b.agencia], ["Conta", b.conta], ["Pix", b.pix]]
            .filter(([, v]) => v).map(([k, v]) => `<div class="kv muted">• ${k}: <b>${esc(v)}</b></div>`).join("")
            || '<div class="kv muted">Cadastro ainda vazio.</div>'}
        </div>
      </details>
      ${pedidoTrocaGestao(b)}
      <div class="exp" style="margin-top:8px;gap:6px">
        <button class="bt bt-ghost" onclick="emConint('${esc(b.id)}',${b.conint?.participou ? "false" : "true"})">
          ${b.conint?.participou ? "✓ CONINT — desfazer" : "Participou do CONINT"}</button>
        <a class="bt bt-ghost" href="/api/ic/em/bolsistas.xlsx?turma=${encodeURIComponent(TURMA_EM)}&bolsista=${encodeURIComponent(b.email || b.id)}"
          title="Planilha só deste bolsista — CPF, contato, responsável e dados bancários, para o pedido de pagamento">⬇ Exportar dados do aluno</a>
      </div>
    </div>`;
  };

  el.innerHTML = `
    <div class="filtros" style="margin-bottom:14px">
      <label style="margin:0;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted)">
        Turma
        <select style="width:auto;min-width:240px" onchange="TURMA_EM=this.value;renderEM()">
          ${turmas.map((t) => `<option value="${esc(t.ciclo)}" ${TURMA_EM === t.ciclo ? "selected" : ""}>Turma ${esc(t.ciclo)}${t.edital && t.edital !== "—" ? ` — Edital ${esc(t.edital)}` : ""}${t.encerrada ? " · encerrada" : " · atual"}</option>`).join("")}
        </select>
      </label>
      ${turma.documento ? `<a class="bt bt-ghost" target="_blank" rel="noopener" href="${esc(turma.documento)}">📄 Edital</a>` : ""}
      ${turma.resultado ? `<a class="bt bt-ghost" target="_blank" rel="noopener" href="${esc(turma.resultado)}">📄 Resultado</a>` : ""}
      ${da.length ? `<a class="bt bt-ghost" target="_blank" rel="noopener" href="/api/ic/em/termos.pdf?turma=${encodeURIComponent(TURMA_EM)}"
        title="Termo de cada bolsista com o Anexo 01 (autorização do responsável) — para a cerimônia de assinaturas">📝 Termos + autorização (PDF)</a>` : ""}
      ${da.length ? `<a class="bt bt-ghost" href="/api/ic/em/bolsistas.xlsx?turma=${encodeURIComponent(TURMA_EM)}"
        title="Uma linha por bolsista, com CPF, contato, responsável e dados bancários — para os pagamentos">📇 Bolsistas (Excel)</a>` : ""}
      ${da.length ? `<button class="bt bt-sec" onclick="emConvidar()"
        title="Convite por e-mail: o bolsista cria o usuário e — turma atual — escolhe o projeto; turma encerrada — entrega o relatório final">✉️ Convidar por e-mail</button>` : ""}
      ${da.length ? `<button class="bt bt-sec" onclick="emChamada()"
        title="Vai a TODO bolsista da turma com relatório ainda não validado — mesmo quem já foi convidado">📣 Chamar para os relatórios</button>` : ""}
      <button class="bt bt-ghost" onclick="verModeloRelatorio('em')"
        title="O formulário do relatório, como o estudante o vê">👁 Visualizar relatório (estudante)</button>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="l">Bolsistas da turma</div><div class="v">${ativos.length}</div>
        <div class="d">${da.length - ativos.length ? `${da.length - ativos.length} desligado(s)` : "todos ativos"}</div></div>
      ${cotas.map((c) => `<div class="kpi"><div class="l">${esc(c.nome)}</div>
        <div class="v" style="color:${c.usadas > c.cota ? "var(--err)" : c.usadas === c.cota ? "var(--ok)" : "var(--ink)"}">${c.usadas}<span style="font-size:16px;color:var(--muted)"> / ${c.cota}</span></div>
        <div class="d">R$ ${c.valor} mensais</div></div>`).join("")}
      <div class="kpi"><div class="l">${turma.encerrada ? "Relatórios entregues" : "Com projeto definido"}</div>
        <div class="v">${turma.encerrada ? entregues.length : comProjeto.length}<span style="font-size:16px;color:var(--muted)"> / ${ativos.length}</span></div>
        <div class="d">${turma.encerrada ? "relatório simplificado da turma" : "o aluno escolhe, a coordenação apresenta"}</div></div>
    </div>

    ${da.length && !turma.encerrada && comProjeto.length < ativos.length ? `<div class="banner ba-warn">
      <b>${ativos.length - comProjeto.length} bolsista(s) ainda sem projeto.</b> O aluno escolhe o projeto e o curso;
      a coordenação o apresenta ao orientador — e troca quando ele desejar.</div>` : ""}

    <div class="card">
      <div class="card-t">Turma ${esc(TURMA_EM)}</div>
      <div class="card-s">${turma.encerrada
        ? "Turma encerrada: o que resta é a entrega do relatório simplificado e o registro do CONINT."
        : "Em curso: bolsa, projeto acompanhado e trajetória de cada bolsista."}</div>
      ${da.map(cartao).join("") || '<div class="vazio">Nenhum bolsista nesta turma.</div>'}
    </div>`;
}

async function emAcao(caminho, corpo, msg) {
  try {
    await api(caminho, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    EM = null; await renderEM();
    if (msg) aviso(msg);
  } catch (e) { aviso(e.message, "err"); EM = null; renderEM(); }
}
/* A decisão da coordenação sobre o pedido de troca. Recusar pede o motivo —
   é o que o estudante lê na guia dele; aprovar move a trajetória no servidor. */
async function emDecidirPedido(id, pid, decisao) {
  let parecer = "";
  if (decisao === "recusado") {
    parecer = (prompt("Recusar a alteração de projeto — escreva o motivo (o estudante lê):") || "").trim();
    if (!parecer) return;
  } else if (!confirm("Aprovar a troca de projeto? O acompanhamento anterior é encerrado hoje e a trajetória guarda os dois.")) return;
  return emAcao(`/api/ic/em/${id}/pedido-projeto/${pid}`, { decisao, parecer },
    decisao === "aprovado" ? "Troca aprovada — a trajetória foi atualizada." : "Pedido recusado.");
}

const emBolsa = (id, bolsa) => emAcao(`/api/ic/em/${id}/bolsa`, { bolsa },
  bolsa ? "Bolsa atribuída." : "Bolsa desfeita.");
const emProjeto = (id, projetoId) => emAcao(`/api/ic/em/${id}/projeto`, { projetoId },
  projetoId ? "Acompanhamento registrado — a trajetória guarda o anterior." : "Acompanhamento encerrado.");
const emRelatorio = (id, tipo, situacao) => emAcao(`/api/ic/em/${id}/relatorio`, { tipo, situacao },
  situacao === "entregue" ? `Entrega do ${tipo} registrada.` : `Relatório ${tipo} reaberto.`);

/* O quadro dos relatórios do bolsista no cartão da gestão: parcial e final
   (turma vigente) ou só o final (antigas), com a leitura dos 3 campos e a
   validação — que é da PROPPEX, não da orientação. */
function emBlocoRelatoriosGestao(b, turma) {
  if (turma?.relatoriosFinalizados) return "";   // turma de arquivo: nada pendente
  const tipos = turma?.encerrada ? ["final"] : ["parcial", "final"];
  const linha = (tipo) => {
    const r = b.relatorios?.[tipo] || {};
    const rot = tipo === "parcial" ? "Relatório parcial" : "Relatório final";
    const selo = seloRelEM(r);
    const corpo = (r.atividades || r.motivacao || r.cursoPretendido || r.cursoOutro) ? `
      <details style="margin:4px 0 0 12px"><summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">ler as respostas${r.em ? ` (${fmtD(r.em.slice(0, 10))})` : ""}</summary>
        <div class="kv" style="margin-left:12px"><b>Atividades:</b> <span style="white-space:pre-wrap">${esc(r.atividades || "—")}</span></div>
        <div class="kv" style="margin-left:12px"><b>Motivação (carreira acadêmica):</b> <span style="white-space:pre-wrap">${esc(r.motivacao || "—")}</span></div>
        <div class="kv" style="margin-left:12px"><b>Curso pretendido:</b> ${esc(r.cursoOutro ? `${r.cursoOutro} (o UNIEGO ainda não tem)` : r.cursoPretendido || "—")}</div>
        ${quadroAvaliacaoEMLeitura(r.avaliacao, EM?.modeloRelatorio?.avaliacao)}
        ${r.comentario ? `<div class="kv" style="margin-left:12px"><b>Comentário da PROPPEX:</b> ${esc(r.comentario)}</div>` : ""}
      </details>` : "";
    const acoes = r.situacao === "entregue" ? `
      <button class="bt bt-ok" style="padding:4px 10px" onclick="emValidar('${esc(b.id)}','${tipo}','validado')">✓ Validar</button>
      <button class="bt bt-err" style="padding:4px 10px" onclick="emValidar('${esc(b.id)}','${tipo}','devolvido')">↩ Devolver</button>`
      : r.situacao === "pendente" ? `<button class="bt bt-ghost" style="padding:4px 10px" title="Entrega que chegou em papel"
          onclick="emRelatorio('${esc(b.id)}','${tipo}','entregue')">registrar entrega em papel</button>` : "";
    return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px">
      <span style="font-size:13px;font-weight:600">${rot}</span> ${selo} ${acoes}</div>${corpo}`;
  };
  return `<div style="border-top:1px solid var(--linha);margin-top:8px;padding-top:6px">${tipos.map(linha).join("")}</div>`;
}
async function emValidar(id, tipo, decisao) {
  let comentario = "";
  if (decisao === "devolvido") {
    comentario = prompt("O que o bolsista precisa corrigir? (vai por escrito para ele)") || "";
    if (comentario.trim().length < 10) return aviso("Escreva o que precisa ser corrigido.", "warn");
  } else if (!confirm(`Validar o relatório ${tipo} deste bolsista?`)) return;
  await emAcao(`/api/ic/em/${id}/relatorio/validar`, { tipo, decisao, comentario },
    decisao === "validado" ? `Relatório ${tipo} validado.` : `Relatório ${tipo} devolvido ao bolsista.`);
}

/* ---- "Ler e validar" do ICEM (pedido do dono, ago/2026) -----------------
   Na guia Relatórios (aba EM) o botão "abrir" levava a PROPPEX para OUTRA
   guia. Agora o relatório se lê e se decide numa janela suspensa na própria
   página: os 3 campos do estudante + o questionário de avaliação do
   programa, quem enviou e quando, e os botões da PROPPEX — devolver exige
   comentário. Relatório ainda não enviado vira aviso claro, sem botões. */
function seloRelEM(r) {
  return r?.situacao === "validado" ? '<span class="badge b-validado">validado</span>'
    : r?.situacao === "entregue" ? '<span class="badge b-enviado">entregue — validar</span>'
      : r?.situacao === "devolvido" ? '<span class="badge b-devolvido">devolvido ao bolsista</span>'
        : '<span class="badge b-rascunho">pendente</span>';
}

function emLerValidar(id) {
  const b = (EM?.bolsistas || []).find((x) => x.id === id);
  if (!b) return aviso("Bolsista não encontrado — recarregue a página.", "err");
  const turma = (EM.turmas || []).find((t) => t.ciclo === b.turma) || {};
  const tipos = turma.relatoriosFinalizados ? [] : turma.encerrada ? ["final"] : ["parcial", "final"];
  const bolsa = (EM.bolsas || []).find((x) => x.codigo === b.bolsa)?.nome || "sem bolsa";

  const blocoTipo = (tipo) => {
    const r = b.relatorios?.[tipo] || {};
    const rot = tipo === "parcial" ? "Relatório parcial" : "Relatório final";
    if (!r.situacao || r.situacao === "pendente") return `<div class="bloco">
      <div class="bloco-cab"><span class="t">${rot}</span> ${seloRelEM(r)}</div>
      <div class="banner ba-info" style="margin:6px 0 0">O estudante <b>ainda não enviou</b> este relatório —
        não há o que validar por enquanto.</div>
    </div>`;
    const decisao = r.situacao === "entregue" ? `
      <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px">
        <div style="font-weight:700">Validação — da PROPPEX</div>
        <label style="margin-top:6px">Comentário ao estudante <span class="muted">(obrigatório na devolução)</span></label>
        <textarea id="emval-com-${tipo}" rows="3" placeholder="O que está bom, o que precisa ajustar…"></textarea>
        <div class="exp" style="margin-top:8px">
          <button class="bt bt-ok" onclick="emValidarModal('${esc(b.id)}','${tipo}','validado')">✓ Validar</button>
          <button class="bt bt-err" onclick="emValidarModal('${esc(b.id)}','${tipo}','devolvido')">↩ Devolver com comentário</button>
        </div>
      </div>` : "";
    return `<div class="bloco">
      <div class="bloco-cab"><span class="t">${rot}</span> ${seloRelEM(r)}</div>
      <div class="muted">${r.em ? `Enviado em <b>${fmtDH(r.em)}</b>` : "Sem data de envio registrada"}${
        r.porAluno ? " · pelo próprio estudante, no portal" : " · entrega registrada pela gestão (papel)"}</div>
      <div class="kv" style="margin-top:8px"><b>Atividades realizadas na vigência da bolsa:</b><br>
        <span style="white-space:pre-wrap">${esc(r.atividades || "—")}</span></div>
      <div class="kv" style="margin-top:6px"><b>Motivação para a carreira acadêmica:</b><br>
        <span style="white-space:pre-wrap">${esc(r.motivacao || "—")}</span></div>
      <div class="kv" style="margin-top:6px"><b>Curso pretendido no UNIEGO:</b>
        ${esc(r.cursoOutro ? `${r.cursoOutro} (o UNIEGO ainda não tem)` : r.cursoPretendido || "—")}</div>
      ${quadroAvaliacaoEMLeitura(r.avaliacao, EM?.modeloRelatorio?.avaliacao, { recuo: 0 })}
      ${r.comentario ? `<div class="kv" style="margin-top:6px"><b>Comentário da PROPPEX:</b> ${esc(r.comentario)}</div>` : ""}
      ${r.validadoPor ? `<div class="muted" style="margin-top:4px">${r.situacao === "validado" ? "Validado" : "Devolvido"}
        por ${esc(r.validadoPor)}${r.validadoEm ? ` em ${fmtDH(r.validadoEm)}` : ""}</div>` : ""}
      ${decisao}
    </div>`;
  };

  abrirJanelaModal("ov-rel-em", `
    <div class="ov-cab"><div class="t">${esc(b.nome)} — turma ${esc(b.turma)}</div>
      <button class="ov-x" onclick="document.getElementById('ov-rel-em').remove()">×</button></div>
    <div class="muted" style="font-size:12.5px;margin-bottom:8px">${esc(bolsa)}${b.escola ? ` · ${esc(b.escola)}` : ""}${b.email ? ` · ${esc(b.email)}` : " · <b>sem e-mail</b>"}</div>
    ${tipos.map(blocoTipo).join("")
      || '<div class="banner ba-info">Turma de arquivo — os relatórios foram entregues e encerrados fora do sistema.</div>'}
    <div style="margin-top:10px;font-size:12.5px"><a href="#" class="muted"
      onclick="document.getElementById('ov-rel-em').remove();TURMA_EM='${esc(b.turma)}';nav('em');return false">ver o cartão completo na guia Ensino Médio →</a></div>
  `);
}

/* A decisão tomada DENTRO da janela: mesma rota da guia EM; fechada a
   janela, a lista de onde se veio atualiza o selo sem navegar. */
async function emValidarModal(id, tipo, decisao) {
  const comentario = ($(`emval-com-${tipo}`)?.value || "").trim();
  if (decisao === "devolvido" && comentario.length < 10)
    return aviso("Escreva no comentário o que o bolsista precisa corrigir.", "warn");
  if (decisao === "validado" && !confirm(`Validar o relatório ${tipo} deste bolsista? Relatório validado não se reenvia.`)) return;
  try {
    await api(`/api/ic/em/${id}/relatorio/validar`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tipo, decisao, comentario }),
    });
    document.getElementById("ov-rel-em")?.remove();
    EM = null;                                  // recarrega com o selo novo
    if (SECAO === "em") await renderEM(); else renderRelatorios();
    aviso(decisao === "validado" ? `Relatório ${tipo} validado.` : `Relatório ${tipo} devolvido ao bolsista.`);
  } catch (e) { aviso(e.message, "err"); }
}
const emConint = (id, participou) => emAcao(`/api/ic/em/${id}/conint`, { participou, ano: String(new Date().getFullYear()) },
  participou ? "Participação no CONINT registrada." : "Registro desfeito.");

/* O convite por e-mail da turma: simula primeiro (quem recebe, quem já foi
   convidado, quem está sem e-mail) e só envia com a confirmação. */
async function emConvidar() {
  const simular = (mensagem, reenviar) => api("/api/ic/em/convidar", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ turma: TURMA_EM, simular: true, mensagem, reenviar: reenviar === true }) });
  try {
    let s = await simular("");
    if (!s.convidar.length && !s.jaConvidados) return aviso("Nenhum bolsista com e-mail nesta turma.", "err");
    // sem ninguém novo, o envio só faz sentido como REENVIO a todos
    const reenviar = !s.convidar.length && s.jaConvidados
      ? confirm(`Todos os ${s.jaConvidados} bolsista(s) com e-mail da turma ${TURMA_EM} já foram convidados.\n\nReenviar o convite a todos?`)
      : false;
    if (!s.convidar.length && !reenviar) return;
    // no reenvio, a janela mostra a lista REAL do reenvio (achado de
    // ago/2026: abria com 0 destinatários enquanto o envio ia a todos)
    if (reenviar) s = await simular("", true);
    janelaEnvio({
      titulo: `Convite por e-mail — turma ${TURMA_EM}`,
      itens: s.convidar.map((x) => `${x.nome} — ${x.email}`),
      semEmail: s.semEmail,
      observacao: reenviar ? `REENVIO: o convite vai de novo a quem já o recebeu.`
        : (s.jaConvidados ? `${s.jaConvidados} já convidado(s) não recebem de novo.` : ""),
      previewHtml: s.previewHtml,
      rotuloEnviar: reenviar ? "Reenviar convite" : "Enviar convite",
      aoAtualizar: async (m) => (await simular(m, reenviar)).previewHtml,
      aoEnviar: async (mensagem) => {
        try {
          const r = await api("/api/ic/em/convidar", { method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ turma: TURMA_EM, reenviar, mensagem }) });
          aviso(`Convite enviado a ${r.enviados} bolsista(s).${r.falhas.length ? " Falhas: " + r.falhas.join("; ") : ""}`,
            r.falhas.length ? "err" : undefined);
        } catch (e) { aviso(e.message, "err"); }
      },
    });
  } catch (e) { aviso(e.message, "err"); }
}

/* A chamada de preenchimento dos relatórios: vai a TODO bolsista da turma
   com relatório exigido ainda não validado — sem o filtro do convite. */
/* -------------------- janela de revisão dos envios ----------------------
   Pedido do dono (ago/2026): NENHUM chamamento por e-mail sai num clique
   só. Antes do envio, a janela mostra quem recebe e a PRÉVIA do e-mail
   como ele sai (a do primeiro destinatário, com os dados dele), e a
   coordenação pode escrever uma mensagem — que entra destacada no topo de
   todos. "Atualizar prévia" re-simula com a mensagem digitada. */
function janelaEnvio({ titulo, itens = [], semEmail = [], observacao = "",
  previewHtml = "", rotuloEnviar = "Enviar", aoEnviar, aoAtualizar }) {
  document.getElementById("ov-envio")?.remove();
  const div = document.createElement("div");
  div.className = "ov"; div.id = "ov-envio";
  div.onclick = (e) => { if (e.target === div) div.remove(); };
  div.innerHTML = `<div class="ov-cx" style="max-width:840px">
    <div class="ov-cab"><div class="t">${esc(titulo)}</div>
      <button class="ov-x" onclick="document.getElementById('ov-envio').remove()">×</button></div>
    <div style="font-size:13.5px"><b>${itens.length}</b> destinatário(s)${semEmail.length
      ? ` · <span style="color:var(--warn)">${semEmail.length} sem e-mail (não recebem)</span>` : ""}</div>
    <details style="margin-top:4px"${itens.length <= 8 ? " open" : ""}>
      <summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">ver a lista</summary>
      <ul style="margin:6px 0 0 18px;font-size:12.5px;max-height:150px;overflow:auto">
        ${itens.map((x) => `<li>${esc(x)}</li>`).join("")}
        ${semEmail.length ? `<li style="color:var(--warn)">Sem e-mail: ${esc(semEmail.join(", "))}</li>` : ""}
      </ul></details>
    ${observacao ? `<div class="muted" style="font-size:12.5px;margin-top:6px">${observacao}</div>` : ""}
    <label style="margin-top:12px">Mensagem da coordenação <span class="muted">(opcional — entra destacada no topo do e-mail de todos)</span></label>
    <textarea id="envio-msg" rows="3" placeholder="Escreva aqui se quiser acrescentar um recado ao texto padrão…"></textarea>
    <div style="display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap">
      <div style="font-weight:700;font-size:13px">Prévia do e-mail${itens.length > 1 ? " — a do primeiro destinatário" : ""}</div>
      ${aoAtualizar ? `<button class="bt bt-ghost" style="padding:4px 10px" id="envio-atualizar">🔄 Atualizar prévia com a mensagem</button>` : ""}
    </div>
    <iframe id="envio-previa" sandbox="" style="width:100%;height:300px;border:1px solid var(--linha);border-radius:10px;background:#fff;margin-top:6px"></iframe>
    <div class="exp" style="margin-top:12px">
      <button class="bt bt-pri" id="envio-ok">📨 ${esc(rotuloEnviar)}</button>
      <button class="bt bt-ghost" onclick="document.getElementById('ov-envio').remove()">Cancelar</button>
    </div>
  </div>`;
  document.body.appendChild(div);
  const previa = div.querySelector("#envio-previa");
  const mostrar = (html) => { previa.srcdoc = `<body style="margin:14px;background:#fff">${html || "<p style='font-family:sans-serif;color:#888'>Sem prévia disponível.</p>"}</body>`; };
  mostrar(previewHtml);
  const msgDe = () => div.querySelector("#envio-msg").value.trim();
  if (aoAtualizar) div.querySelector("#envio-atualizar").onclick = async () => {
    try { mostrar(await aoAtualizar(msgDe())); } catch (e) { aviso(e.message, "err"); }
  };
  div.querySelector("#envio-ok").onclick = () => { const m = msgDe(); div.remove(); aoEnviar(m); };
}

   AGORA o mesmo e-mail da cobrança semanal, para o ciclo selecionado —

      titulo: `Chamar para os relatórios — ${rotuloCiclo(CICLO_REL)}`,

      observacao: "Cada pessoa recebe a própria lista de pendências; o aluno, a de enviar, e a orientação, a de validar.",
      previewHtml: s.previewHtml,
      aoAtualizar: async (m) => (await simular(m)).previewHtml,

          const r = await api("/api/ic/chamada-relatorio", { method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ edital: CICLO_REL, mensagem }) });

            r.falhas.length ? "err" : undefined);

}

/* ------------------ a guia do BOLSISTA do Ensino Médio ------------------- */
/* O setor pelos olhos do bolsista EM (decisão do dono, ago/2026): ele
   escolhe o curso e o projeto que quer acompanhar — e troca quando quiser —
   e entrega por aqui o relatório final; nas turmas encerradas, a entrega é
   o que formaliza a conclusão. */
/* O questionário de avaliação do programa (IC Júnior), transcrito do
   formulário da PROPPEX: 7 perguntas 0–5 (o 0 é "não se aplica") + as
   abertas. O mesmo desenho serve ao formulário do aluno e à
   pré-visualização da gestão. */
function quadroAvaliacaoEMForm(prefixo, aval, modelo) {
  const a = aval || {};
  const m = modelo || MEU_EM?.avaliacaoModelo || {};
  const radio = (nome, valor, marcado, rot) => `<label style="margin:0;display:flex;align-items:center;gap:4px;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;cursor:pointer">
    <input type="radio" name="${nome}" value="${valor}" ${marcado ? "checked" : ""}> ${rot}</label>`;
  return `
    <div style="border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin-top:10px">
      <div style="font-weight:700">Avaliação do Programa de Iniciação Científica Júnior *</div>
      <div class="muted" style="font-size:12.5px;margin:4px 0 2px">Marque como foi a sua experiência em cada item:</div>
      <div class="muted" style="font-size:12px;margin-bottom:6px">${(m.escala || []).map((e) => `<b>${e.valor}</b> — ${esc(e.rot)}`).join(" · ")}</div>
      ${(m.criterios || []).map((c, i) => `
        <div style="margin-top:8px">
          <div style="font-size:13px"><b>${i + 1}. ${esc(c.rot)}:</b> ${esc(c.pergunta)}</div>
          <div style="display:flex;gap:14px;margin-top:4px;flex-wrap:wrap">
            ${[0, 1, 2, 3, 4, 5].map((v) => radio(`${prefixo}-crit-${c.codigo}`, v, a.criterios?.[c.codigo] === v, String(v))).join("")}
          </div>
        </div>`).join("")}
      <label style="margin-top:10px">Qual foi o principal aprendizado ou a atividade mais interessante durante o período da bolsa?</label>
      <textarea id="${prefixo}-aprendizado" rows="3">${esc(a.aprendizado || "")}</textarea>
      <div style="margin-top:8px;font-size:13px"><b>Você recomendaria a Iniciação Científica Júnior para outros colegas de escola? *</b></div>
      <div style="display:flex;gap:14px;margin-top:4px;flex-wrap:wrap">
        ${(m.recomendacoes || []).map((x) => radio(`${prefixo}-recomendaria`, x.codigo, a.recomendaria === x.codigo, esc(x.rot))).join("")}
      </div>
      <label style="margin-top:10px">Sugestões para melhorar as próximas edições do programa:</label>
      <textarea id="${prefixo}-sugestoes" rows="3">${esc(a.sugestoes || "")}</textarea>
    </div>`;
}
/* A leitura das respostas dadas — para a gestão e para o aluno rever. */
function quadroAvaliacaoEMLeitura(aval, modelo, { recuo = 12 } = {}) {
  const m = modelo || MEU_EM?.avaliacaoModelo || {};
  if (!aval || !Object.keys(aval.criterios || {}).length) return "";
  const rotEscala = (v) => ((m.escala || []).find((e) => e.valor === v) || {}).rot || "";
  const recom = { sim: "Sim", nao: "Não", "em-partes": "Em partes" };
  return `<div class="kv" style="margin-left:${recuo}px"><b>Avaliação do programa (pelo estudante):</b></div>
    ${(m.criterios || []).map((c) => aval.criterios?.[c.codigo] != null
      ? `<div class="kv" style="margin-left:${recuo + 12}px">• ${esc(c.rot)}: <b>${aval.criterios[c.codigo]}</b>${rotEscala(aval.criterios[c.codigo]) ? ` — ${esc(rotEscala(aval.criterios[c.codigo]))}` : ""}</div>` : "").join("")}

/* "Visualizar relatório" (gestão): o modelo de cada formulário exatamente
   como aparece a quem preenche — aluno e professor —, montado dos MESMOS
   catálogos que alimentam os formulários de verdade (META.relatorioModelo
   e o modelo do EM). É pré-visualização: os campos ficam travados e nada
   se grava. */
/* Janela suspensa das validações (pedido do dono, ago/2026): ler e decidir
   SEM sair da lista. Esc fecha, clique no fundo fecha e o foco vai à
   janela — o dono usa o celular, e o overlay (.ov) já rola por dentro. */
function abrirJanelaModal(id, html, { maxWidth = 780 } = {}) {
  document.getElementById(id)?.remove();
  const div = document.createElement("div");
  div.className = "ov"; div.id = id; div.tabIndex = -1;
  div.onclick = (e) => { if (e.target === div) div.remove(); };
  div.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.stopPropagation(); div.remove(); }
  });
  div.innerHTML = `<div class="ov-cx" style="max-width:${maxWidth}px">${html}</div>`;
  document.body.appendChild(div);
  div.focus();
  return div;
}

function abrirModelo(titulo, corpoHtml) {
  fecharModelo();
  const div = document.createElement("div");
  div.className = "ov"; div.id = "ov-modelo";
  div.onclick = (e) => { if (e.target === div) fecharModelo(); };
  div.innerHTML = `<div class="ov-cx" style="max-width:780px">
    <div class="ov-cab"><div class="t">${titulo}</div>
      <button class="ov-x" onclick="fecharModelo()">×</button></div>
    <div class="muted" style="font-size:12.5px;margin-bottom:8px">Pré-visualização do formulário — os campos estão travados e nada é gravado.</div>
    <fieldset disabled style="border:0;padding:0;margin:0;min-width:0">${corpoHtml}</fieldset>
  </div>`;
  document.body.appendChild(div);
}
function fecharModelo() { document.getElementById("ov-modelo")?.remove(); }

let MEU_EM = null;
async function renderMeuEM() {

  if (!MEU_EM) {
    el.innerHTML = '<div class="card"><div class="vazio">Carregando o seu registro…</div></div>';

  }
  const cursosDe = (lista) => [...new Set(lista.map((p) => p.curso).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "pt-BR"));

  const cartao = (r) => {
    const vigente = !r.turma?.encerrada && r.situacao === "ativo";
    const escolha = MEU_EM.escolha && vigente ? MEU_EM.escolha.projetos : [];

      ${r.projetoAtual ? `<div class="kv" style="margin-top:4px">Você acompanha
        <b>${esc(r.projetoAtual.numero || "")} ${esc(r.projetoAtual.titulo.slice(0, 90))}</b> ·

      ${/* A escolha DIRETA é só a PRIMEIRA: quem já acompanha um projeto troca

      /* Lista vazia não é um seletor sem opções: é uma informação. O ICEM

    const cursos = MEU_EM.cursosUniego || [];
    const outroMarcado = !!rel.cursoOutro;
    if (r.situacao === "desligado") return "";
    return `<div style="border-top:1px solid var(--linha);margin-top:12px;padding-top:10px">
      <div style="font-weight:700">${rot} ${situ}

          ? `<span class="badge b-prevista">prazo: ${esc(r.turma.prazoRelatorioFinal.split("-").reverse().join("/"))}</span>` : ""}</div>
      ${tipo === "final" && r.turma?.encerrada ? `<div class="muted" style="margin:4px 0 6px">É o relatório final que formaliza a conclusão da sua participação na turma.</div>` : ""}
      ${rel.comentario && rel.situacao === "devolvido" ? `<div class="banner ba-warn" style="margin-top:6px"><b>A PROPPEX pediu ajustes:</b> ${esc(rel.comentario)}</div>` : ""}
      ${rel.situacao === "validado" ? `
        <div class="kv" style="margin-top:6px"><b>Atividades:</b> ${esc(rel.atividades)}</div>
        ${rel.motivacao ? `<div class="kv"><b>Motivação:</b> ${esc(rel.motivacao)}</div>` : ""}
        <div class="kv"><b>Curso pretendido:</b> ${esc(rel.cursoOutro ? rel.cursoOutro + " (o UNIEGO ainda não tem)" : rel.cursoPretendido || "—")}</div>
        ${quadroAvaliacaoEMLeitura(rel.avaliacao, MEU_EM.avaliacaoModelo, { recuo: 0 })}` : `
        <label style="margin-top:8px">Descreva as atividades realizadas na vigência da sua bolsa *</label>

        <textarea id="em-${tipo}-motivacao-${esc(r.id)}" rows="4">${esc(rel.motivacao || "")}</textarea>

        <select id="em-${tipo}-curso-${esc(r.id)}" onchange="$('em-${tipo}-outro-${esc(r.id)}').style.display = this.value === '__outro__' ? '' : 'none'">
          <option value="">— escolha o curso —</option>

        <input id="em-${tipo}-outro-${esc(r.id)}" style="display:${outroMarcado ? "" : "none"};margin-top:6px"
          placeholder="Qual curso você gostaria que o UNIEGO tivesse?" value="${esc(rel.cursoOutro || "")}">
        ${quadroAvaliacaoEMForm(`em-${tipo}-${r.id}`, rel.porAluno ? rel.avaliacao : null, MEU_EM.avaliacaoModelo)}
        <div class="exp" style="margin-top:8px">

    </div>`;
  };

  el.innerHTML = (MEU_EM.registros || []).map(cartao).join("")
    || '<div class="card"><div class="vazio">Nenhum registro do ICEM ligado à sua conta.</div></div>';
