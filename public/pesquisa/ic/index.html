/* Nota atribuída direto pela coordenação — a seleção deste ano correu fora
   do sistema; nos próximos, o caminho é o parecer pelo formulário. */
async function atribuirNota(desfazer) {
  const valor = desfazer ? null : $("nota-direta").value.trim();
  if (!desfazer && valor === "") return aviso("Informe a nota do projeto, de 0 a 100.", "warn");
  if (desfazer && !confirm("Desfazer a nota atribuída? Volta a valer a média dos pareceres do sistema.")) return;
  try {
    await api(`/api/ic/${ATUAL.id}/nota`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nota: desfazer ? null : Number(valor), observacao: desfazer ? "" : $("nota-direta-obs").value.trim() }),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso(desfazer ? "Nota desfeita — vale a média dos pareceres." : `Nota do projeto registrada: ${valor}.`);
  } catch (e) { aviso(e.message, "err"); }
}

/* A resposta da coordenação à contestação. Fecha o pedido no registro; se a
   revisão proceder, mudar a nota continua sendo ato à parte — e fica no
   histórico como qualquer outra mudança de nota. */
async function responderContestacao(id) {
  const resposta = (prompt("Resposta à contestação — o professor vai ler este texto.") || "").trim();
  if (!resposta) return;
  if (resposta.length < 10) return aviso("Escreva a resposta à contestação.", "err");
  try {
    await api(`/api/ic/${ATUAL.id}/contestacao/responder`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, resposta }),
    });
    await carregar(); await abrir(ATUAL.id);
    aviso("Contestação respondida.");
  } catch (e) { aviso(e.message, "err"); }
}

/* A decisão da seleção numa tacada: aprovar (se ainda estiver submetido) e
   marcar o fomento — ou reprovar, com o parecer que a orientação vai ler. */
async function decidirSelecao(tipo) {
  try {
    if (tipo === "reprovado") {
      if (ATUAL.status === "aprovado" && !confirm("Este projeto já está APROVADO. Reprovar agora desfaz a decisão e cancela a bolsa concedida. Continuar?")) return;
      const parecer = prompt("Parecer da reprovação (a orientação vai ler):");
      if (parecer === null) return;
      if (parecer.trim().length < 10) return aviso("Escreva o parecer da reprovação — quem recebe precisa saber o porquê.", "warn");
      await api(`/api/ic/${ATUAL.id}/avaliar`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decisao: "reprovado", parecer }),
      });
      await carregar(); montarSidebar(); await abrir(ATUAL.id);
      return aviso("Projeto reprovado na seleção.");
    }
    const obs = tipo === "voluntario" ? "" : (prompt("Observação sobre a concessão (opcional):") ?? "");
    if (ATUAL.status === "submetido") {
      await api(`/api/ic/${ATUAL.id}/avaliar`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decisao: "aprovado", parecer: "" }),
      });
    }
    await api(`/api/ic/${ATUAL.id}/fomento`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tipo, observacao: obs }),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso(`Decisão registrada: aprovado — ${fomentoNome(tipo)}.${tipo !== "voluntario" ? " A orientação já pode indicar o bolsista na ficha do projeto." : ""}`);
  } catch (e) { aviso(e.message, "err"); }
}

/* --------------------- indicação do bolsista --------------------------- */
/* Abre quando a bolsa é concedida (CNPq ou UNIEGO). Quem preenche é a
   orientação — são os dados que a PROPPEX exporta para montar o contrato:
   CPF, telefone e a conta que vai receber a bolsa. O avaliador e os colegas
   de projeto nunca veem esses campos (o recorte é do servidor). */
function renderIndicacaoBolsista(p, ger) {
  // só depois do resultado: projeto aprovado com bolsa marcada na seleção
  if (!p.id || !["aprovado", "concluido"].includes(p.status)) return "";
  if (!p.fomento || p.fomento.tipo === "voluntario") return "";
  if (PODE.papel === "avaliador") return "";

  // O PRÓPRIO aluno preenche o cadastro do contrato — mas o formulário mora
  // na guia Bolsa, e não aqui: o cadastro é DA PESSOA, e repeti-lo em cada
  // projeto faria a mesma pessoa ter duas versões do próprio RG.
  if (PODE.papel === "aluno") {
    const eu = (p.alunos || []).find((a) => a.email === META.eu);
    if (!eu || !eu.bolsista) return "";
    const falta = faltaNoCadastroLocal(eu);
    return `<div class="card">
      <div class="card-t">Meu cadastro para o contrato da bolsa</div>
      <div class="card-s"><b>${esc(fomentoNome(p.fomento.tipo))}</b> concedida. O contrato sai do que
        você informar no seu cadastro — a conta e o Pix precisam estar no seu nome.</div>
      ${falta.length
        ? `<div class="banner ba-warn">Falta informar: <b>${esc(falta.join(", "))}</b>.</div>`
        : `<div class="banner ba-ok">Cadastro completo — nada pendente da sua parte.</div>`}
      <div class="exp"><button class="bt bt-pri" onclick="nav('bolsa')">
        ${falta.length ? "Completar o meu cadastro" : "Rever o meu cadastro"}</button></div>
    </div>`;
  }

  // orientação e gestão acompanham: quem já completou, quem ainda falta
  const bolsistas = (p.alunos || []).filter((a) => a.bolsista);
  const completo = (a) => a.dadosCompletos ?? cadastroCompletoLocal(a);
  return `<div class="card">
    <div class="card-t">Contrato da bolsa</div>
    <div class="card-s"><b>${esc(fomentoNome(p.fomento.tipo))}</b> concedida${p.fomento.modalidade ? ` (${esc(modNome(p.fomento.modalidade))})` : ""}.
      Os documentos e os dados bancários quem informa é <b>o próprio aluno</b>, depois do convite por e-mail —
      aqui fica só o andamento.</div>
    ${bolsistas.map((a) => `<div class="linha">
      <div class="txt"><div class="p1">${esc(a.nome || a.email || "Bolsista")}</div>
        <div class="p2">${esc(a.email || "sem e-mail — sem convite")}</div></div>
      ${completo(a) ? '<span class="badge b-validado">dados completos</span>'
        : '<span class="badge b-enviado">aguardando o aluno</span>'}
    </div>`).join("") || `<div class="banner ba-warn">Nenhum aluno marcado como <b>bolsista</b> na
      indicação acima — marque a caixa e salve o projeto.</div>`}

    ${renderSubstituicoes(p, bolsistas)}
  </div>`;
}

/* ------------------- substituição de bolsista --------------------------- */
/* A orientação SOLICITA a troca — quem sai, quem entra (nome, curso,
   período, e-mail, telefone) e o motivo — e a decisão é da coordenação.
   Aprovada, o sistema troca os vínculos e convida o novo aluno por e-mail. */
function renderSubstituicoes(p, bolsistas) {
  const pedidos = p.substituicoes || [];
  const pendentes = pedidos.filter((x) => x.situacao === "solicitada");
  const decididos = pedidos.filter((x) => x.situacao !== "solicitada");
  const rotulo = { solicitada: "aguardando a coordenação", aprovada: "aprovada", recusada: "recusada" };

  return `<div class="sec-t">Alteração de bolsista</div>
    ${pendentes.map((x) => `<div class="bloco meu">
      <div class="bloco-cab"><span class="t">Sai ${esc(x.sai.nome || x.sai.email)} · entra ${esc(x.novo.nome)}</span>
        <span class="badge b-enviado">${rotulo[x.situacao]}</span></div>
      <div class="kv">${esc(x.motivo)}</div>
      <div class="muted" style="margin-top:4px">Pedido de ${esc(x.por)} em ${fmtDH(x.em)}</div>
      ${PODE.podeDesignar ? `<div class="exp">
        <button class="bt bt-ok" onclick="decidirSubstituicao('${esc(x.id)}','aprovada')">✓ Aprovar a troca</button>
        <button class="bt bt-err" onclick="decidirSubstituicao('${esc(x.id)}','recusada')">Recusar</button>
      </div>` : ""}
    </div>`).join("")}
    ${decididos.map((x) => `<div class="kv muted" style="margin-bottom:4px">
      ${x.situacao === "aprovada" ? "✓" : "✕"} ${esc(x.sai.nome || x.sai.email)} → ${esc(x.novo.nome)} ·
      ${rotulo[x.situacao]} por ${esc(x.decididoPor || "")} em ${fmtDH(x.decididoEm)}</div>`).join("")}

    ${bolsistas.length && !pendentes.length ? `
    <details style="margin-top:8px"><summary style="cursor:pointer;font-size:13.5px;color:var(--brand-2);font-weight:600">
      Solicitar alteração de bolsista</summary>
      <div class="grid3" style="margin-top:10px">
        <div><label>Quem sai *</label><select id="sub-sai">
          ${bolsistas.map((a) => `<option value="${esc(a.email || a.nome)}">${esc(a.nome || a.email)}</option>`).join("")}
        </select></div>
        <div><label>Nome do novo bolsista *</label><input id="sub-nome"></div>
        <div><label>E-mail do novo bolsista *</label><input id="sub-email" type="email"></div>
      </div>
      <div class="grid3">
        <div><label>Telefone</label><input id="sub-telefone" placeholder="(62) 9…"></div>
        <div><label>Curso</label><input id="sub-curso" value="${esc(cursoNome(p.curso))}"></div>
        <div><label>Período</label><input id="sub-periodo" placeholder="5º"></div>
      </div>
      <label>Motivo da substituição * <span class="muted">(fica registrado no projeto)</span></label>
      <textarea id="sub-motivo" style="min-height:70px" placeholder="Ex.: desistência do aluno por transferência de instituição."></textarea>
      <div class="exp"><button class="bt bt-sec" onclick="solicitarSubstituicao()">Enviar a solicitação</button></div>
    </details>` : ""}`;
}

async function solicitarSubstituicao() {
  const corpo = {
    saiEmail: $("sub-sai").value, saiNome: $("sub-sai").value,
    novo: { nome: $("sub-nome").value.trim(), email: $("sub-email").value.trim(),
      telefone: $("sub-telefone").value.trim(), curso: $("sub-curso").value.trim(), periodo: $("sub-periodo").value.trim() },
    motivo: $("sub-motivo").value.trim(),
  };
  if (!corpo.novo.nome || !corpo.novo.email) return aviso("Informe o nome e o e-mail do novo bolsista.", "warn");
  if (corpo.motivo.length < 10) return aviso("Escreva o motivo da substituição.", "warn");
  try {
    await api(`/api/ic/${ATUAL.id}/substituicao`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso("Solicitação registrada — a coordenação decide, e a troca acontece na aprovação.");
  } catch (e) { aviso(e.message, "err"); }
}

async function decidirSubstituicao(sid, decisao) {
  if (decisao === "aprovada" && !confirm("Aprovar a troca? O aluno que sai perde o vínculo e o novo recebe o convite por e-mail.")) return;
  try {
    await api(`/api/ic/${ATUAL.id}/substituicao/${sid}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ decisao }),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso(decisao === "aprovada" ? "Troca aprovada — o novo bolsista foi convidado por e-mail." : "Solicitação recusada.");
  } catch (e) { aviso(e.message, "err"); }
}

/* ---------------- planilha de pontuação da produção -------------------- */
/* Réplica da planilha oficial do edital (item 6.2). A pessoa informa as
   quantidades do período; o peso, os tetos por bloco e o total saem de
   lib/edital.js — a conta na tela é só para ela ver o resultado na hora. */
function renderProducao(p, editavel) {
  if (PODE.papel === "avaliador") return "";
  const q = p.producao || {};
  const preenchida = Object.keys(q).length > 0;
  const ro = editavel ? "" : "disabled";
  const ed = META.edital || {};

  return `<div class="card">
    <div class="card-t">Produção acadêmica do coordenador</div>
    <div class="card-s">Planilha de pontuação do edital, conferida contra o currículo Lattes.
      A pontuação entra <b>em valor absoluto</b> na classificação:
      nota final = nota do projeto (0–100) + a pontuação do currículo, que <b>não tem teto</b>.</div>

    <div class="banner ba-warn" style="margin:10px 0">
      <b>Informe apenas a produção dos últimos ${(Number(ed.producaoAte) - Number(ed.producaoDe) + 1) || 5} anos
      — de ${esc(ed.producaoDe || "2022")} a ${esc(ed.producaoAte || "2026")}.</b>
      O edital (item 7.3) computa só esse período, e conta o que estiver publicado no Lattes até o
      último dia das inscrições — mantenha o currículo atualizado.</div>

    ${!preenchida && META.producaoAnterior && editavel ? `<div class="banner ba-info">
      Você já preencheu esta planilha em outro projeto.
      <button class="bt bt-sec" style="margin-left:8px" onclick="copiarProducaoAnterior()">Trazer os números de lá</button>
    </div>` : ""}
    ${(() => {
      // a planilha veio herdada e ainda não foi mexida: dizer de onde veio,
      // para a pessoa conferir e ajustar o que publicou nesse meio tempo
      if (!preenchida || !editavel || p.id) return "";
      if (JSON.stringify(q) === JSON.stringify(META.producaoAnterior || null)) return `<div class="banner ba-info">
        Planilha carregada da sua última submissão — confira e atualize se você publicou algo novo desde então.</div>`;
      if (PROD_BUSCADA && JSON.stringify(q) === JSON.stringify(PROD_BUSCADA)) return `<div class="banner ba-info">
        Planilha carregada da última submissão de quem orienta — confira com o professor e ajuste se algo mudou.</div>`;
      return "";
    })()}

    <details ${preenchida || !editavel ? "" : "open"}>
      <summary style="cursor:pointer;font-weight:600;font-size:13.5px;color:var(--brand);margin-bottom:10px">
        ${preenchida ? "Ver e editar os itens" : "Preencher a planilha"}
      </summary>
      ${META.blocosProducao.map((b) => `
        <div class="sec-t">${esc(b.nome)}</div>
        <div class="rolo"><table class="pt">
          <thead><tr><th style="width:56%">Item</th><th style="width:14%">Peso</th><th style="width:15%">Quantidade</th><th style="width:15%">Pontos</th></tr></thead>
          <tbody>${b.itens.map((i) => `<tr>
            <td>${i.grupo ? `<span class="muted">${esc(i.grupo)} · </span>` : ""}${esc(i.nome)}</td>
            <td class="muted">${i.peso}</td>
            <td><input type="number" min="0" step="1" ${ro} id="prod-${i.codigo}" value="${q[i.codigo] || ""}"
              oninput="mudouProducao('${i.codigo}',this.value)" style="max-width:90px"></td>
            <td id="pts-${i.codigo}" class="muted">${((q[i.codigo] || 0) * i.peso).toFixed(1)}</td>
          </tr>`).join("")}</tbody>
        </table></div>`).join("")}
    </details>

    <div class="stat" style="margin-top:16px">
      ${META.blocosProducao.map((b) => `<div class="s"><b id="bl-${b.codigo}">—</b><span>${esc(b.nome)}</span></div>`).join("")}
      <div class="s" style="border-color:var(--brand-3)"><b id="prod-total">—</b><span>Pontuação do currículo</span></div>
    </div>
  </div>`;
}

function mudouProducao(codigo, valor) {
  const n = Math.max(0, Math.trunc(Number(valor) || 0));
  ATUAL.producao = { ...(ATUAL.producao || {}) };
  if (n) ATUAL.producao[codigo] = n; else delete ATUAL.producao[codigo];
  pintarProducao();
}

function pintarProducao() {
  if (!$("prod-total")) return;
  const q = ATUAL.producao || {};
  let total = 0;
  for (const b of META.blocosProducao) {
    let bruto = 0;
    for (const i of b.itens) {
      const pts = (q[i.codigo] || 0) * i.peso;
      bruto += pts;
      const cel = $("pts-" + i.codigo);
      if (cel) cel.textContent = pts.toFixed(1);
    }
    total += bruto;
    const alvo = $("bl-" + b.codigo);
    if (alvo) alvo.textContent = bruto.toFixed(1);
  }
  $("prod-total").textContent = (Math.round(total * 100) / 100).toFixed(1);
}

function copiarProducaoAnterior() {
  ATUAL.producao = { ...(META.producaoAnterior || {}) };
  renderEditor(SECAO === "submissao" ? "v-submissao" : "v-projeto");
  aviso("Números trazidos do seu projeto anterior. Confira antes de salvar.");
}

/* Na inclusão manual, a planilha é a do PROFESSOR em nome de quem se inclui:
   informado o e-mail ou o CPF dele, o sistema busca a produção da última
   submissão e preenche sozinho — sem sobrescrever o que a gestão já tiver
   digitado. A busca é conveniência: falhar em silêncio não trava nada. */
let PROD_BUSCADA = null;
async function buscarProducaoDoProfessor() {
  if (!MANUAL) return;
  const email = (ATUAL.orientador?.email || "").trim();
  const cpf = (ATUAL.orientador?.cpf || "").replace(/\D/g, "");
  if (!email && cpf.length !== 11) return;
  try {
    const r = await api(`/api/ic/producao-anterior?email=${encodeURIComponent(email)}&cpf=${encodeURIComponent(cpf)}`);
    if (!r.producao) return;
    const atual = ATUAL.producao || {};
    const intocada = !Object.keys(atual).length
      || JSON.stringify(atual) === JSON.stringify(PROD_BUSCADA);
    if (!intocada) return;
    PROD_BUSCADA = r.producao;
    ATUAL.producao = { ...r.producao };
    renderEditor("v-submissao");
    aviso(`Planilha de produção carregada da última submissão de ${r.de?.nome || "quem orienta"} — confira e ajuste se algo mudou.`);
  } catch { /* busca silenciosa */ }
}

        ${META.criterios.map((c) => `<div>

    ${gestao ? `

        <thead><tr><th style="width:34%">Avaliador</th><th>Situação</th><th>Nota</th><th>Recomendação</th><th></th></tr></thead>

/* Soma ao vivo do formulário do parecer: cada critério limitado ao teto. */
function somarParecer() {
  let s = 0;
  for (const c of META.criterios) {
    const v = Number($("nota-" + c.codigo)?.value);
    if (Number.isFinite(v)) s += Math.min(Math.max(v, 0), c.peso);
  }
  const el = $("soma-parecer");
  if (el) el.textContent = Math.round(s * 10) / 10;
}

async function designarAvaliador() {
  const email = $("av-email").value.trim(), nome = $("av-nome").value.trim();
  if (!email) return aviso("Informe o e-mail do avaliador.", "warn");
  try {
    await api(`/api/ic/${ATUAL.id}/avaliadores`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, nome }),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso(`${nome || email} designado(a) para avaliar este projeto.`);
  } catch (e) { aviso(e.message, "err"); }
}

async function dispensarAvaliador(email) {
  if (!confirm(`Dispensar ${email} da avaliação deste projeto?`)) return;
  try {
    await api(`/api/ic/${ATUAL.id}/avaliadores/${encodeURIComponent(email)}`, { method: "DELETE" });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso("Avaliador dispensado.");
  } catch (e) { aviso(e.message, "err"); }
}

async function enviarParecer(recusar) {
  const parecer = $("txt-parecer").value.trim();
  const corpo = { recusar, parecer };
  if (recusar) {
    if (parecer.length < 10) return aviso("Escreva no campo do parecer o motivo da recusa.", "warn");
    if (!confirm("Recusar esta avaliação? A coordenação será informada do motivo.")) return;
  } else {
    corpo.recomendacao = $("rec-parecer").value;
    corpo.notas = {};
    for (const c of META.criterios) {
      const v = $("nota-" + c.codigo).value.trim();
      // branco não é zero: quem quer dar zero digita 0
      if (v === "") return aviso(`Falta a nota de "${c.nome}" — todo critério precisa ser pontuado (zero incluído).`, "warn");
      corpo.notas[c.codigo] = v;
    }
    if (!corpo.recomendacao) return aviso("Escolha a recomendação.", "warn");
    if (parecer.length < 200) return aviso("O parecer precisa de ao menos 200 caracteres.", "warn");
  }
  try {
    const r = await api(`/api/ic/${ATUAL.id}/parecer`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
    });
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso(recusar ? "Avaliação recusada." : `Parecer entregue — nota do projeto ${r.nota} de 100.`);
  } catch (e) { aviso(e.message, "err"); }
}

/* ------------------- relatórios dentro do projeto ----------------------
   O modelo institucional virou formulário (decisão do dono, ago/2026): o
   PARCIAL segue o roteiro de 7 seções e abre no 4º mês da vigência; o FINAL
   é o ARTIGO CIENTÍFICO na revista escolhida pelo aluno e pela orientação
   (anexado, com os dados da revista) mais a apresentação no CONINT, e abre
   no 10º. As avaliações acompanham: o aluno avalia o projeto e a atuação da
   orientação; a orientação, ao validar o final, avalia o aluno e dá o
   parecer conclusivo — cada um não vê a avaliação sobre si. */
const REL_MODELO = () => META.relatorioModelo || {};

const quadroAvaliacaoProjeto = (pref, valores = {}, ro = false) => `
  <div style="font-weight:700;margin-top:12px">Avaliação do projeto</div>

    <div class="grid2" style="align-items:center;gap:6px;margin-top:6px">
      <div style="font-size:13px">${esc(q.texto)}</div>
      <select id="${pref}-ap-${q.codigo}" ${ro ? "disabled" : ""}>
        <option value="">— responda —</option>
        ${(REL_MODELO().respostasProjeto || []).map((x) => `<option value="${x.codigo}" ${valores[q.codigo] === x.codigo ? "selected" : ""}>${esc(x.rot)}</option>`).join("")}
      </select>
    </div>`).join("")}`;

const quadroEscala = (pref, criterios, valores = {}, titulo, ro = false) => `
  <div style="font-weight:700;margin-top:12px">${esc(titulo)}</div>
  <div class="muted" style="margin:2px 0 4px">Escala: 0 — não se aplica · 1 — insuficiente · 2 — regular · 3 — bom · 4 — muito bom · 5 — excelente</div>
  ${(criterios || []).map((c) => `
    <div class="grid2" style="align-items:center;gap:6px;margin-top:6px">
      <div style="font-size:13px"><b>${esc(c.rot)}.</b> ${esc(c.texto)}</div>
      <select id="${pref}-${c.codigo}" ${ro ? "disabled" : ""}>
        <option value="">— avalie —</option>
        ${(REL_MODELO().escala || []).map((x) => `<option value="${x.valor}" ${valores[c.codigo] === x.valor ? "selected" : ""}>${esc(x.rot)}</option>`).join("")}
      </select>
    </div>`).join("")}`;

const respostaProjetoRot = (v) => (REL_MODELO().respostasProjeto || []).find((x) => x.codigo === v)?.rot || v || "—";

/* O corpo de UM relatório da IC e o painel de validação da orientação,
   COMPARTILHADOS entre a visão do projeto e a janela "ler e validar"
   (pedido do dono, ago/2026): as exigências — avaliação do desempenho e
   parecer conclusivo no final quando quem valida é o orientador, opcionais
   quando é a PROPPEX em nome dele — valem iguais nos dois lugares porque o
   código é um só. O sigilo cruzado é o do servidor: aqui só se mostra o
   que a visão do projeto já entregou. */
function corpoRelatorioIC(p, r) {
  const M = REL_MODELO();
  // o que cada relatório mostra: as seções do parcial, o artigo do final,
  // e as avaliações que a visão do servidor entregou (sigilo lá, não aqui)
  {
    const secoes = (M.camposParcial || []).filter((s) => (r.campos?.[s.campo] || "").trim());
    return `
      ${secoes.length ? secoes.map((s) => `<div class="kv" style="margin-top:8px"><b>${esc(s.rot)}</b><br>
        <span style="white-space:pre-wrap">${esc(r.campos[s.campo])}</span></div>`).join("")
        : (r.resumo ? `<div class="kv" style="white-space:pre-wrap;margin-top:8px">${esc(r.resumo)}</div>` : "")}
      ${r.tipo === "final" && r.artigo?.revista ? `<div class="kv" style="margin-top:8px"><b>Artigo científico</b><br>
        Revista: ${esc(r.artigo.revista)} · ISSN ${esc(r.artigo.issn || "—")}${r.artigo.qualis ? ` · Qualis ${esc(r.artigo.qualis)}` : ""}${r.artigo.fatorImpacto ? ` · fator de impacto ${esc(r.artigo.fatorImpacto)}` : ""}<br>
        ${/^https?:\/\//i.test(r.artigo.link || "") ? `<a href="${esc(r.artigo.link)}" target="_blank" rel="noopener">${esc(r.artigo.link)}</a>` : esc(r.artigo.link || "")}</div>` : ""}
      ${(r.anexos || []).length ? `<div class="kv" style="margin-top:6px"><b>Anexos:</b> ${r.anexos.map((a) => `<a href="${esc(a.link || "#")}" target="_blank" rel="noopener">${esc(a.name)}</a>`).join(" · ")}</div>` : ""}
      ${r.avaliacaoProjeto && Object.values(r.avaliacaoProjeto || {}).some(Boolean) && PODE.papel !== "aluno" ? `
        <details style="margin-top:8px"><summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">Avaliação do projeto pelo aluno</summary>
        ${(M.perguntasProjeto || []).map((q) => `<div class="kv muted">• ${esc(q.texto)} — <b>${esc(respostaProjetoRot(r.avaliacaoProjeto[q.codigo]))}</b></div>`).join("")}</details>` : ""}
      ${META.gestao && r.avaliacaoOrientador && Object.values(r.avaliacaoOrientador || {}).some((v) => v != null && v !== "") ? `
        <details style="margin-top:6px"><summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">Avaliação da atuação da orientação (pelo aluno — sigilosa)</summary>
        ${(M.criteriosOrientador || []).map((c) => `<div class="kv muted">• ${esc(c.rot)}: <b>${r.avaliacaoOrientador[c.codigo] ?? "—"}</b></div>`).join("")}</details>` : ""}
      ${PODE.papel !== "aluno" && r.avaliacaoAluno && Object.values(r.avaliacaoAluno || {}).some((v) => v != null && v !== "") ? `
        <details style="margin-top:6px"><summary style="cursor:pointer;font-size:12.5px;color:var(--muted)">Avaliação do desempenho do aluno (pela orientação)</summary>
        ${(M.criteriosAluno || []).map((c) => `<div class="kv muted">• ${esc(c.rot)}: <b>${r.avaliacaoAluno[c.codigo] ?? "—"}</b></div>`).join("")}
        ${r.parecerConclusivo ? `<div class="kv"><b>Parecer conclusivo:</b> ${esc((M.pareceresConclusivos || []).find((x) => x.codigo === r.parecerConclusivo)?.rot || r.parecerConclusivo)}</div>` : ""}</details>` : ""}
      ${r.parecer ? `<div class="kv" style="margin-top:6px"><b>Comentário da orientação:</b> ${esc(r.parecer)}</div>` : ""}`;
  }
}

function blocoRelatorioIC(p, r) {
  const M = REL_MODELO();
  return `
    <div class="bloco ${r.aluno === META.eu ? "meu" : ""}" id="rel-${esc(r.tipo)}-${esc(r.id)}">
      <div class="bloco-cab">
        <span class="t">Relatório ${esc(r.tipo)} — ${esc((p.alunos || []).find((a) => a.email === r.aluno)?.nome || r.aluno)}</span>
        <span class="badge b-${esc(r.situacao)}">${esc({ enviado: "aguardando validação", validado: "validado", devolvido: "devolvido" }[r.situacao] || r.situacao)}</span>
      </div>
      <div class="muted">Enviado em ${fmtDH(r.enviadoEm)}${r.periodo ? ` · período: ${esc(r.periodo)}` : ""}</div>
      ${corpoRelatorioIC(p, r)}
      ${blocoEncerramentoIC(p, r)}
      ${r.situacao === "validado" && r.validadoPelaGestao ? `<div class="muted" style="margin-top:6px">
        Validado <b>pela PROPPEX, em nome da orientação</b> — registrado no histórico do projeto.</div>` : ""}
      ${PODE.podeValidar && r.situacao === "enviado" && !(r.encerramento?.pedido && !r.encerramento?.decisao) ? `
        <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px">
          <div style="font-weight:700">${PODE.papel === "gestao" ? "Validação — pela PROPPEX, em nome da orientação" : "Validação da orientação"}</div>
          ${PODE.papel === "gestao" ? `<div class="muted" style="font-size:12.5px;margin-top:2px">Para orientadores desligados
            da instituição: a PROPPEX valida (ou devolve) no lugar da orientação, e o ato fica registrado assim no histórico.
            A avaliação do desempenho e o parecer conclusivo são <b>opcionais</b> neste caso — preencha só se acompanhou o aluno.</div>` : ""}
          <label style="margin-top:6px">Comentário ao aluno <span class="muted">(obrigatório na devolução)</span></label>
          <textarea id="val-com-${esc(r.id)}" rows="3" placeholder="O que está bom, o que precisa ajustar…"></textarea>
          ${r.tipo === "final" ? `
            ${quadroEscala(`val-${esc(r.id)}`, M.criteriosAluno, r.avaliacaoAluno || {}, "Avaliação do desempenho do discente/bolsista")}
            <div style="font-weight:700;margin-top:12px">Parecer conclusivo</div>
            ${(M.pareceresConclusivos || []).map((x) => `<label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-weight:500;margin-top:4px">
              <input type="radio" name="val-parecer-${esc(r.id)}" value="${x.codigo}" style="width:auto"> ${esc(x.rot)}</label>`).join("")}` : ""}
          <div class="exp" style="margin-top:10px">
            <button class="bt bt-ok" onclick="validar('${esc(p.id)}','${esc(r.id)}','validado','${esc(r.tipo)}')">✓ Validar e encaminhar à PROPPEX</button>
            <button class="bt bt-err" onclick="validar('${esc(p.id)}','${esc(r.id)}','devolvido','${esc(r.tipo)}')">↩ Retornar para correção</button>
          </div>
        </div>` : ""}
    </div>`;
}

/* PEDIDO DE ENCERRAMENTO do projeto (decisão do dono, ago/2026). O aluno
   relata a interrupção no relatório que estiver entregando; quem decide é a
   PROPPEX — no caso típico (professor desligado no meio da vigência) a
   orientação é justamente a parte que não está mais lá. Enquanto o pedido
   espera decisão, a validação comum do relatório não aparece: o que está em
   jogo é o encerramento, não o mérito do que foi entregue. */
function blocoEncerramentoIC(p, r) {
  const e = r.encerramento || {};
  if (!e.pedido) return "";
  const cab = `<div style="font-weight:700">⛔ Pedido de encerramento do projeto</div>
    <div class="muted" style="font-size:12.5px">Relatado pelo aluno no relatório ${esc(r.tipo)}${e.em ? ` · ${fmtDH(e.em)}` : ""}</div>
    <div style="margin-top:6px;white-space:pre-line">${esc(e.motivo || "")}</div>`;
  if (e.decisao) {
    return `<div class="banner ${e.decisao === "aceito" ? "ba-warn" : "ba-info"}" style="margin-top:10px">
      ${cab}
      <div style="margin-top:8px;border-top:1px solid rgba(0,0,0,.08);padding-top:6px">
        <b>${e.decisao === "aceito" ? "Encerramento validado pela PROPPEX" : "Encerramento recusado pela PROPPEX"}</b>
        ${e.decididoEm ? ` · ${fmtDH(e.decididoEm)}` : ""}
        <div style="white-space:pre-line;margin-top:4px">${esc(e.parecer || "")}</div>
      </div></div>`;
  }
  const souGestao = PODE.papel === "gestao";
  return `<div class="banner ba-warn" style="margin-top:10px">
    ${cab}
    ${souGestao ? `
      <div style="margin-top:10px;border-top:1px solid rgba(0,0,0,.08);padding-top:8px">
        <div style="font-weight:700">Decisão da PROPPEX</div>
        <div class="muted" style="font-size:12.5px">Aceitar encerra o projeto (situação <b>Encerrado</b>) e valida este
          relatório como o registro da interrupção. Recusar devolve o relatório ao caminho normal, com o seu parecer.</div>
        <label style="margin-top:6px">Parecer da coordenação *</label>
        <textarea id="enc-par-${esc(r.id)}" rows="3" placeholder="O que a PROPPEX apurou e decide…"></textarea>
        <div class="exp" style="margin-top:8px">
          <button class="bt bt-err" onclick="decidirEncerramento('${esc(p.id)}','${esc(r.id)}','aceito')">⛔ Encerrar o projeto</button>
          <button class="bt bt-sec" onclick="decidirEncerramento('${esc(p.id)}','${esc(r.id)}','recusado')">↩ Recusar o pedido</button>
        </div>
      </div>`
      : `<div class="muted" style="margin-top:8px">Aguardando a validação da PROPPEX — é ela que encerra o projeto
        nestes casos. A orientação não decide.</div>`}
  </div>`;
}

async function decidirEncerramento(projetoId, relId, decisao) {
  const parecer = ($("enc-par-" + relId)?.value || "").trim();
  if (parecer.length < 10) return aviso("Escreva o parecer da coordenação — ele fica no histórico do projeto.", "warn");
  if (decisao === "aceito" && !confirm("Encerrar este projeto?\n\nA situação passa a ENCERRADO e o relatório fica validado como registro da interrupção.")) return;
  try {
    await api(`/api/ic/${projetoId}/relatorio/${relId}/encerramento`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decisao, parecer }),
    });
    document.getElementById("ov-rel-ic")?.remove();
    await carregar(); montarSidebar(); await abrir(projetoId);
    aviso(decisao === "aceito" ? "Projeto encerrado — a decisão está no histórico." : "Pedido recusado — o relatório volta ao caminho normal.");
  } catch (e) { aviso(e.message, "err"); }
}

/* A janela "ler e validar" da IC (pedido do dono, ago/2026): o orientador —
   ou a PROPPEX em nome dele — lê o relatório completo do aluno e decide na
   PRÓPRIA página da lista, sem navegar ao projeto. Busca a mesma visão que
   o projeto usa (GET /api/ic/:id) — recorte, sigilo e permissões idênticos —
   e reaproveita blocoRelatorioIC, que é o painel do projeto. */
async function lerEValidarIC(projetoId, tipo, relId = "") {
  try {
    const r = await api("/api/ic/" + projetoId);
    const p = r.projeto;
    // o mesmo contexto de permissões da visão do projeto: validar() lê
    // PODE.papel (a PROPPEX em nome da orientação) e PODE.podeValidar.
    // Fora das seções "projeto"/"submissao" ninguém mais lê PODE, e é só
    // delas que a janela NÃO se abre — o painel de lá já é inline.
    PODE = r;
    const rels = (p.relatorios || []).filter((x) => x.tipo === tipo && (!relId || x.id === relId));
    const rot = tipo === "parcial" ? "Relatório parcial" : "Relatório final";
    abrirJanelaModal("ov-rel-ic", `
      <div class="ov-cab"><div class="t">${esc(rot)} — ${esc(p.numero || "projeto")}</div>
        <button class="ov-x" onclick="document.getElementById('ov-rel-ic').remove()">×</button></div>
      <div class="muted" style="font-size:12.5px;margin-bottom:8px">${esc(p.titulo || "")}
        · orientação: ${esc(p.orientador?.nome || p.orientador?.email || "—")}</div>
      ${rels.map((x) => blocoRelatorioIC(p, x)).join("")
        || `<div class="banner ba-info">O aluno <b>ainda não enviou</b> o ${esc(rot.toLowerCase())} —
          não há o que validar por enquanto.</div>`}
      <div style="margin-top:10px;font-size:12.5px"><a href="#" class="muted"
        onclick="document.getElementById('ov-rel-ic').remove();abrir('${esc(projetoId)}');return false">ver no projeto →</a></div>
    `);
  } catch (e) { aviso(e.message, "err"); }
}

function renderRelatoriosDoProjeto(p) {
  const meus = p.relatorios || [];
  const souAluno = PODE.papel === "aluno";
  const emExecucao = ["aprovado", "concluido"].includes(p.status);
  const M = REL_MODELO();
  const prazoDe = (tipo) => (p.prazoRelatorios?.prazos || []).find((x) => x.tipo === tipo);
  const fmtBr = (iso) => iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "—";

  const meuRel = (tipo) => meus.find((r) => r.tipo === tipo && r.aluno === META.eu);
  const formulario = (tipo) => {
    const r = meuRel(tipo);
    if (r && r.situacao !== "devolvido") return "";
    const prazo = prazoDe(tipo);
    // projeto concluído: só a janela em REGULARIZAÇÃO reabre formulário
    // (o final de 01/2025, até out/2026) — sem prazo reaberto, nada de form
    if (!prazo && p.status === "concluido") return "";
    const aberto = !prazo || !prazo.abre || hojeISO() >= prazo.abre;
    if (!aberto) return `<div class="bloco" id="form-rel-${tipo}">
      <div class="bloco-cab"><span class="t">Relatório ${tipo}</span><span class="badge b-rascunho">ainda não abriu</span></div>
      <div class="muted">A janela de envio abre em <b>${fmtBr(prazo.abre)}</b> — ${tipo === "parcial" ? "no 4º mês" : "no 10º mês"} da vigência — com prazo até ${fmtBr(prazo.vence)}.</div>
    </div>`;
    if (tipo === "parcial") {
      return `<div class="bloco" id="form-rel-parcial">
        <div class="bloco-cab"><span class="t">Enviar relatório parcial</span>
          ${r ? `<span class="badge b-devolvido">devolvido — reenvie corrigido</span>` : ""}
          ${prazo ? `<span class="badge b-${prazo.atrasado ? "atrasada" : "prevista"}">prazo: ${fmtBr(prazo.vence)}</span>` : ""}</div>
        <div class="muted" style="margin-bottom:6px">${esc(M.formatacao || "")}</div>
        <label>Período coberto</label>
        <input id="per-parcial" placeholder="ex.: setembro de 2026 a fevereiro de 2027" value="${esc(r?.periodo || "")}">
        ${(M.camposParcial || []).map((s) => `
          <label style="margin-top:10px">${esc(s.rot)}${(M.obrigatorios || []).includes(s.campo) ? " *" : ""}</label>
          <div class="muted" style="margin:-2px 0 4px">${esc(s.ajuda)}</div>
          <textarea id="rp-${s.campo}" style="min-height:90px">${esc(r?.campos?.[s.campo] || "")}</textarea>`).join("")}
        <label style="margin-top:10px">Comprovantes de eventos/publicações <span class="muted">(anexe os arquivos, se houver)</span></label>
        <input type="file" id="anexos-parcial" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
        ${quadroAvaliacaoProjeto("rp", r?.avaliacaoProjeto || {})}
        ${quadroEscala("rp-ao", M.criteriosOrientador, r?.avaliacaoOrientador || {}, "Avaliação da atuação do orientador (pelo discente)")}
        ${blocoInterrompido("rp", r)}
        <div class="exp" style="margin-top:12px"><button class="bt bt-pri" onclick="enviarRelatorio('parcial')">Enviar relatório parcial</button></div>
      </div>`;
    }
    return `<div class="bloco" id="form-rel-final">
      <div class="bloco-cab"><span class="t">Enviar relatório final — artigo científico</span>
        ${r ? `<span class="badge b-devolvido">devolvido — reenvie corrigido</span>` : ""}
        ${prazo ? `<span class="badge b-${prazo.atrasado ? "atrasada" : "prevista"}">prazo: ${fmtBr(prazo.vence)}</span>` : ""}</div>
      <div class="banner ba-info">O relatório final é um <b>artigo científico</b>, em formato livre — à escolha
        do aluno e da orientação —, redigido <b>nas normas de submissão da revista escolhida</b> e anexado abaixo.
        Além da submissão do artigo, o trabalho <b>também deverá ser apresentado no CONINT</b>, na forma de
        pôster ou apresentação oral.</div>
      <div class="grid2">
        <div><label>Revista escolhida *</label><input id="rf-revista" value="${esc(r?.artigo?.revista || "")}"></div>
        <div><label>ISSN *</label><input id="rf-issn" value="${esc(r?.artigo?.issn || "")}" placeholder="0000-0000"></div>
      </div>
      <div class="grid3">
        <div><label>Qualis</label><input id="rf-qualis" value="${esc(r?.artigo?.qualis || "")}" placeholder="ex.: B1"></div>
        <div><label>Fator de impacto <span class="muted">(se houver)</span></label><input id="rf-fator" value="${esc(r?.artigo?.fatorImpacto || "")}"></div>
        <div><label>Período coberto</label><input id="per-final" value="${esc(r?.periodo || "")}" placeholder="todo o período do projeto"></div>
      </div>
      <label>Link da revista *</label>
      <input id="rf-link" value="${esc(r?.artigo?.link || "")}" placeholder="https://…">
      <label style="margin-top:10px">Arquivo do artigo * <span class="muted">(nas normas da revista)</span></label>
      <input type="file" id="anexos-final" accept=".pdf,.doc,.docx">
      ${(() => { // a pergunta de eventos/publicações do parcial vale também no final (pedido do dono, ago/2026)
        const ev = (M.camposParcial || []).find((x) => x.campo === "eventos") || {};
        return `<label style="margin-top:10px">${esc(ev.rot || "Participação em eventos / cursos / congressos e publicações")}</label>
        <div class="muted" style="margin:-2px 0 4px">${esc(ev.ajuda || "")}</div>
        <textarea id="rf-eventos" style="min-height:90px">${esc(r?.campos?.eventos || "")}</textarea>`; })()}
      <label style="margin-top:10px">Observações <span class="muted">(opcional)</span></label>
      <textarea id="rf-obs" rows="3">${esc(r?.resumo || "")}</textarea>
      ${quadroAvaliacaoProjeto("rf", r?.avaliacaoProjeto || {})}
      ${quadroEscala("rf-ao", M.criteriosOrientador, r?.avaliacaoOrientador || {}, "Avaliação da atuação do orientador (pelo discente)")}
      ${blocoInterrompido("rf", r)}
      <div class="exp" style="margin-top:12px"><button class="bt bt-pri" onclick="enviarRelatorio('final')">Enviar relatório final</button></div>
    </div>`;
  };

  return `<div class="card" id="card-relatorios">
    <div class="card-t">Relatórios</div>
    <div class="card-s">O parcial abre no 4º mês da vigência (prazo no 6º); o final, no 10º (prazo no fim).
      Quem envia é o aluno; a orientação valida — ou retorna para correção — e o validado segue à PROPPEX.</div>
    ${!emExecucao ? `<div class="banner ba-info">Os relatórios abrem quando o projeto é aprovado.</div>` : ""}
    ${meus.map((r) => blocoRelatorioIC(p, r)).join("")}
    ${emExecucao && souAluno ? formulario("parcial") + formulario("final") : ""}
    ${!meus.length && !souAluno ? `<div class="vazio">Nenhum relatório enviado ainda.</div>` : ""}
  </div>`;
}

/* "O projeto foi interrompido" — no PARCIAL e no FINAL, porque a interrupção
   pode acontecer entre um e outro (decisão do dono, ago/2026). Marcada a
   caixa, o relatório muda de natureza: o que se pede é a JUSTIFICATIVA, e as
   seções do roteiro, o artigo e as avaliações deixam de ser cobrados — não há
   como exigir artigo de um projeto que não correu. Quem decide é a PROPPEX. */
function blocoInterrompido(pref, r) {
  const e = r?.encerramento || {};
  return `
    <div class="bloco" style="border-color:var(--warn);background:#fffaf2;margin-top:14px">
      <label style="display:flex;gap:9px;align-items:flex-start;text-transform:none;letter-spacing:0;font-weight:600">
        <input type="checkbox" id="${pref}-enc" style="width:auto;margin-top:3px" ${e.pedido ? "checked" : ""}
          onchange="document.getElementById('${pref}-enc-cx').style.display=this.checked?'block':'none'">
        <span>O projeto foi <b>interrompido ou cancelado</b> — quero registrar isso e pedir o encerramento
          <div class="muted" style="font-weight:400;margin-top:2px">Ex.: desligamento do orientador, mudança de
            instituição, desistência, inviabilidade do campo. Marcando aqui, o relatório vale como o registro da
            interrupção — as demais exigências deixam de ser cobradas — e o pedido vai à PROPPEX, que decide o
            encerramento. Enquanto isso, o projeto continua como está.</div></span>
      </label>
      <div id="${pref}-enc-cx" style="display:${e.pedido ? "block" : "none"};margin-top:8px">
        <label>Justificativa *</label>
        <textarea id="${pref}-enc-motivo" rows="4"
          placeholder="Conte o que aconteceu, desde quando, e o que chegou a ser feito até aqui.">${esc(e.motivo || "")}</textarea>
      </div>
    </div>`;
}

async function enviarRelatorio(tipo) {
  const M = REL_MODELO();
  const corpo = { tipo, periodo: ($("per-" + tipo)?.value || "").trim() };
  const leAvaliacoes = (pref) => {
    corpo.avaliacaoProjeto = {};
    for (const q of M.perguntasProjeto || []) corpo.avaliacaoProjeto[q.codigo] = $(`${pref}-ap-${q.codigo}`)?.value || "";
    corpo.avaliacaoOrientador = {};
    for (const c of M.criteriosOrientador || []) {
      const v = $(`${pref}-ao-${c.codigo}`)?.value;
      corpo.avaliacaoOrientador[c.codigo] = v === "" || v == null ? "" : Number(v);
    }
  };
  // pedido de encerramento: quando marcado, as demais exigências caem
  const pref = tipo === "parcial" ? "rp" : "rf";
  const pediuEnc = $(pref + "-enc")?.checked === true;
  if (pediuEnc) {
    const motivo = ($(pref + "-enc-motivo")?.value || "").trim();
    if (motivo.length < 30)
      return aviso("Explique por que o projeto foi interrompido — a justificativa vai à PROPPEX (mínimo de 30 caracteres).", "warn");
    corpo.encerramento = { pedido: true, motivo };
  }
  let arquivos = [];
  if (pediuEnc) {
    // o relatório da interrupção leva o que houver: as seções preenchidas, os
    // dados do artigo se existirem, os anexos — nada é obrigatório
    corpo.campos = {};
    for (const s of M.camposParcial || []) corpo.campos[s.campo] = ($(`${pref}-${s.campo}`)?.value || "").trim();
    if (tipo === "final") {
      corpo.artigo = {
        revista: ($("rf-revista")?.value || "").trim(), issn: ($("rf-issn")?.value || "").trim(),
        qualis: ($("rf-qualis")?.value || "").trim(), link: ($("rf-link")?.value || "").trim(),
        fatorImpacto: ($("rf-fator")?.value || "").trim(),
      };
      corpo.resumo = ($("rf-obs")?.value || "").trim();
      corpo.campos = { eventos: ($("rf-eventos")?.value || "").trim() };
    }
    leAvaliacoes(pref);
    arquivos = [...($(`anexos-${tipo}`)?.files || [])];
  } else if (tipo === "parcial") {
    corpo.campos = {};
    for (const s of M.camposParcial || []) corpo.campos[s.campo] = ($("rp-" + s.campo)?.value || "").trim();
    const faltam = (M.obrigatorios || []).filter((c) => (corpo.campos[c] || "").length < 30)
      .map((c) => (M.camposParcial || []).find((x) => x.campo === c)?.rot || c);
    if (faltam.length) return aviso("Preencha as seções obrigatórias (mínimo de 30 caracteres): " + faltam.join("; "), "warn");
    leAvaliacoes("rp");
    if ((M.perguntasProjeto || []).some((q) => !corpo.avaliacaoProjeto[q.codigo])
      || (M.criteriosOrientador || []).some((c) => corpo.avaliacaoOrientador[c.codigo] === ""))
      return aviso("Responda a avaliação do projeto e a da atuação da orientação — todos os itens.", "warn");
    arquivos = [...($("anexos-parcial")?.files || [])];
  } else {
    corpo.artigo = {
      revista: ($("rf-revista")?.value || "").trim(), issn: ($("rf-issn")?.value || "").trim(),
      qualis: ($("rf-qualis")?.value || "").trim(), link: ($("rf-link")?.value || "").trim(),
      fatorImpacto: ($("rf-fator")?.value || "").trim(),
    };
    corpo.resumo = ($("rf-obs")?.value || "").trim();
    // eventos/publicações: a mesma pergunta do parcial, também no final
    corpo.campos = { eventos: ($("rf-eventos")?.value || "").trim() };
    if (!corpo.artigo.revista || !corpo.artigo.issn || !corpo.artigo.link)
      return aviso("Informe a revista escolhida, o ISSN e o link da revista.", "warn");
    leAvaliacoes("rf");
    if ((M.perguntasProjeto || []).some((q) => !corpo.avaliacaoProjeto[q.codigo])
      || (M.criteriosOrientador || []).some((c) => corpo.avaliacaoOrientador[c.codigo] === ""))
      return aviso("No relatório final, responda a avaliação do projeto e a da atuação da orientação — todos os itens.", "warn");
    arquivos = [...($("anexos-final")?.files || [])];
    const jaAnexado = (ATUAL.relatorios || []).some((x) => x.tipo === "final" && x.aluno === META.eu && (x.anexos || []).length);
    if (!arquivos.length && !jaAnexado) return aviso("Anexe o arquivo do artigo científico, nas normas da revista.", "warn");
  }
  try {
    const r = await api(`/api/ic/${ATUAL.id}/relatorio`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo),
    });
    for (const f of arquivos) {
      const fd = new FormData(); fd.append("file", f);
      await api(`/api/ic/${ATUAL.id}/relatorio/${r.relatorio.id}/anexo`, { method: "POST", body: fd });
    }
    await carregar(); montarSidebar(); await abrir(ATUAL.id);
    aviso(pediuEnc
      ? "Registro enviado. A PROPPEX foi avisada e decide o encerramento do projeto."
      : "Relatório enviado. A orientação e a PROPPEX foram avisadas.");
  } catch (e) { aviso(e.message, "err"); }
}

/* Abre o projeto direto no relatório — é o caminho dos botões da guia
   Bolsistas e Voluntários ("preencher relatório" / "validar"). */
async function abrirRelatorio(projetoId, tipo) {
  await abrir(projetoId);
  setTimeout(() => {
    const alvo = document.getElementById("form-rel-" + tipo)
      || document.querySelector(`[id^="rel-${tipo}-"]`)
      || document.getElementById("card-relatorios");
    if (alvo) alvo.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 150);
}

/* ------------------------------- ações --------------------------------- */
async function salvar() {
  try {
    const r = await api("/api/ic", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ATUAL),
    });
    ATUAL = r.projeto;
    limparSujo();                  // gravado: o selo volta a dizer a verdade
    await carregar(); montarSidebar();
    if (SECAO === "submissao") { nav("projeto"); await abrir(ATUAL.id); }
    // dizer QUANTOS alunos ficaram gravados é o que fecha o relato de
    // ago/2026: "salvo" sozinho não distingue o que entrou do que se perdeu
    const n = (ATUAL.alunos || []).length;
    aviso(n ? `Projeto salvo — ${n} aluno(s) indicado(s).` : "Projeto salvo.");
  } catch (e) { aviso(e.message, "err"); }
}

async function submeter() {
  try {
    if (!ATUAL.id) {
      const r = await api("/api/ic", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ATUAL) });
      ATUAL = r.projeto;
    } else {
      await api("/api/ic", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ATUAL) });
    }
    limparSujo();                  // o que estava na tela já foi gravado acima
    if (!confirm("Submeter o projeto à avaliação da PROPPEX? Depois disso a proposta fica fechada para edição.")) return;
    const r = await api(`/api/ic/${ATUAL.id}/submeter`, { method: "POST" });
    await carregar(); montarSidebar(); await abrir(r.projeto.id);
    aviso(`Projeto submetido — protocolo ${r.projeto.numero}.`);
  } catch (e) { aviso(e.message, "err"); }
}

async function avaliar(decisao) {
  const rotulo = { aprovado: "Aprovar", devolvido: "Devolver para ajustes", reprovado: "Reprovar" }[decisao];
  const parecer = prompt(`${rotulo} — parecer da coordenação${decisao === "aprovado" ? " (opcional)" : ""}:`) ?? "";
  if (decisao !== "aprovado" && parecer.trim().length < 10) return aviso("Escreva o parecer.", "warn");
  try {
    const r = await api(`/api/ic/${ATUAL.id}/avaliar`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ decisao, parecer }),
    });
    await carregar(); montarSidebar(); await abrir(r.projeto.id);
    aviso(`Projeto ${decisao}.`);
  } catch (e) { aviso(e.message, "err"); }
}

async function excluir() {
  if (!confirm("Excluir este rascunho? Não há como desfazer.")) return;
  try {
    await api("/api/ic/" + ATUAL.id, { method: "DELETE" });
    await carregar(); montarSidebar(); nav("gestao");
    aviso("Rascunho excluído.");
  } catch (e) { aviso(e.message, "err"); }
}

/* -------------------------------- início ------------------------------- */
(async function iniciar() {
  try {
    const r = await fetch("/api/me");
    if (r.status === 401) { location.href = "/entrar?next=" + encodeURIComponent(location.pathname); return; }
    ME = await r.json();
    // conta pendente NÃO é barrada aqui: o aluno indicado e o avaliador ad hoc
    // entram pelo convite. Quem decide é o servidor, em /api/ic/meta — se a
    // pessoa não estiver em projeto nenhum, ele responde 403 e a mensagem
    // aparece na tela.
    META = await api("/api/ic/meta");
    // "ver como" guardado na aba não atravessa a troca de usuário: só a gestão
    // recebe META.pessoas, então quem não a recebeu não está simulando ninguém
    // (o servidor já ignorou o ?como= — este META é o da pessoa de verdade)
    if (COMO && !META.pessoas) { COMO = ""; sessionStorage.removeItem("arche-ic-como"); }
    await carregar();
  } catch (e) {
    $("aviso").innerHTML = `<div class="banner ba-err">${esc(e.message || "Falha ao carregar o setor")}</div>`;
    $("subtitulo").textContent = "";
    return;                                  // sem META não há tela a montar
  }
  montarSidebar();
  montarVerComo();
  // a primeira guia é a primeira que o perfil enxerga (o bolsista do EM não
  // tem Painel: a casa dele é a guia Ensino Médio)
  nav(SECOES.filter((x) => !x.perfis || x.perfis.includes(META.perfil)).map((x) => x.id)[0] || "painel");
  // as contagens do portal vêm depois: são de outra rota e não podem
  // atrasar a abertura do setor
  carregarUsuariosDoPortal();
})();
</script>
