<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHÉ SC · Seu Curso · UNIEGO</title>
<link rel="icon" href="/arche/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--brand:#1c3742;--hover:#2d535c;--accent:#71c8e2;--acento:#40717e;
--wash:#e6f5fa;--ink:#182632;--muted:#657179;--line:#dde4e8;--ok:#1f6b45;--warn:#7a5714;--err:#8c2f22}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:14.5px;line-height:1.5}
.app{display:flex;min-height:100vh}
/* ------------------------- barra lateral (molde do EX) ------------------ */
.side{width:250px;flex:none;background:var(--brand);color:#fff;display:flex;flex-direction:column;
position:sticky;top:0;height:100vh}
.side-marca{padding:20px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);text-decoration:none}
.side-marca span{font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}
.side-marca b{color:var(--accent);font-weight:800}
.side-nav{padding:14px 12px;flex:1;overflow-y:auto}
.side-lab{font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.35);font-weight:600;padding:8px 12px 6px}
.side-sel{width:calc(100% - 8px);margin:0 4px 10px;font:inherit;font-size:13px;padding:8px 10px;
border-radius:8px;border:1px solid rgba(255,255,255,.22);background:#24444f;color:#fff}
.side-sel:focus{outline:none;border-color:var(--accent)}
.side-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
margin-bottom:2px;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.62);
border-left:3px solid transparent;border-right:0;border-top:0;border-bottom:0;width:100%;text-align:left;
font-family:inherit;transition:background .15s,color .15s}
.side-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.side-item.on{background:rgba(113,200,226,.14);color:#fff;border-left-color:var(--accent)}
.side-pe{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.55)}
/* ------------------------------- conteúdo ------------------------------- */
.conteudo{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:12px}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--brand)}
.area{padding:22px 26px 60px}
.limite{max-width:880px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card-t{font-family:Sora,sans-serif;font-size:15px;color:var(--brand);margin-bottom:4px}
.card-s{color:var(--muted);font-size:12.8px;margin-bottom:12px}
label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--acento)}
input[disabled]{background:#f2f5f7;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio{display:grid;grid-template-columns:1.1fr 1fr 1fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.bt{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--acento);
padding:7px 12px;cursor:pointer;font-size:12.8px}
.bt:hover{border-color:var(--acento);background:var(--wash)}
.bt-pri{background:var(--brand);border-color:var(--brand);color:#fff}
.bt-pri:hover{background:var(--hover)}
.bt-err{background:#fdeeec;border-color:#eed6d3;color:var(--err)}
.bt-xs{padding:4px 9px;font-size:12px}
.linha{display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.banner{border-radius:10px;padding:11px 14px;font-size:13.3px;margin:10px 0}
.ba-ok{background:#eaf7ef;border:1px solid #cfeeda;color:var(--ok)}
.ba-err{background:#fdeeec;border:1px solid #eed6d3;color:var(--err)}
.ba-info{background:var(--wash);border:1px solid #bfe3ef;color:var(--brand)}
.muted{color:var(--muted)}
.tabela{width:100%;border-collapse:collapse}
.tabela td,.tabela th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;font-size:13.3px}
.tabela th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
.selo{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.s-on{background:#eaf7ef;color:var(--ok);border:1px solid #cfeeda}
.s-off{background:#f2f5f7;color:var(--muted);border:1px solid var(--line)}
.s-gestor{background:var(--wash);color:var(--brand);border:1px solid #bfe3ef}
.atalhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.atalho{display:block;border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink);background:#fff}
.atalho:hover{border-color:var(--acento);background:var(--wash)}
.atalho b{color:var(--brand)}
.rel-linha{display:grid;grid-template-columns:minmax(220px,1.2fr) 2fr auto;gap:12px;align-items:center;width:100%;
text-align:left;background:#fff;border:0;border-top:1px solid var(--line);padding:10px 8px;font:inherit;color:var(--ink);cursor:pointer}
.rel-linha:first-of-type{border-top:0}
.rel-linha:hover{background:var(--wash)}
.rel-linha .rl-quem{display:flex;flex-direction:column;min-width:0}
.rel-linha .rl-quem span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-linha .rl-res{font-size:12.5px;line-height:1.7}
.rel-linha .rl-n{font-size:12.5px;color:var(--acento);white-space:nowrap;font-weight:600}
.rel-caixas{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px}
.rel-caixa{display:inline-flex;gap:7px;align-items:center;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink);margin:0;cursor:pointer}
.rel-caixa input{width:17px;height:17px;margin:0}
@media (max-width:820px){.rel-linha{grid-template-columns:1fr auto}.rel-linha .rl-res{grid-column:1/-1}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink);
text-transform:none;letter-spacing:0;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
@media (max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static}
.duo{grid-template-columns:1fr}.trio{grid-template-columns:1fr 1fr 1fr 34px}}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <a class="side-marca" href="/" title="Voltar ao portal">
      <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 37 L8 20 A12 12 0 0 1 32 20 L32 37" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="20" cy="21" r="4" fill="#71c8e2"/></svg>
      <span>ARCHÉ <b>SC</b></span>
    </a>
    <div class="side-nav">
      <div class="side-lab">CURSO</div>
      <select class="side-sel" id="sel-curso" onchange="trocarSelecao(this.value)"></select>
      <div class="side-lab" id="menu-lab">PAINEL</div>
      <div id="menu"></div>
    </div>
    <div class="side-pe">Seu Curso · informações institucionais</div>
  </nav>

  <div class="conteudo">
    <div class="topbar">
      <div class="crumb">ARCHÉ SC <span>/</span> <b id="crumb">…</b></div>
    </div>
    <div class="area"><div class="limite" id="app">
      <div class="card muted">Carregando…</div>
    </div></div>
  </div>
</div>

<script>
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const INST="__institucional";
let D=null, SEL="", VIEW="", COMP=null;

async function carregar(){
  const r=await fetch("/api/curso");
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    $("app").innerHTML=`<div class="card"><div class="banner ba-err">${esc(j.error||"Sem acesso.")}</div>
      <div class="muted">O painel Seu Curso é da coordenação de curso e do gestor geral.</div></div>`;
    $("sel-curso").style.display="none"; $("menu-lab").style.display="none";
    $("crumb").textContent="Sem acesso";
    return;
  }
  D=j;
  // #relatorios, #cursos, #reitoria, #acessos: os atalhos dos outros módulos
  // caem direto na guia institucional que nomeiam
  const alvo=(location.hash||"").replace("#","");
  if(!SEL && D.gestorGeral && ["relatorios","cursos","reitoria","acessos"].includes(alvo)){ SEL=INST; VIEW=alvo; }
  if(!SEL) SEL = D.gestorGeral ? INST : (D.meus[0]||"");
  if(SEL!==INST && !D.meus.includes(SEL)) SEL = D.meus[0]||"";
  if(SEL!==INST) COMP=JSON.parse(JSON.stringify(D.cursos[SEL]||{}));
  montarSeletor(); render();
}

function nomeCurso(slug){ return (D.catalogo.find(c=>c.slug===slug)||{}).nome||slug; }

function montarSeletor(){
  const sel=$("sel-curso");
  const ops=[];
  if(D.gestorGeral) ops.push(`<option value="${INST}" ${SEL===INST?"selected":""}>🏛 Institucional</option>`);
  for(const s of D.meus){
    const c=D.catalogo.find(x=>x.slug===s)||{};
    ops.push(`<option value="${esc(s)}" ${SEL===s?"selected":""}>${esc(c.nome||s)}${c.ativo===false?" (desativado)":""}</option>`);
  }
  sel.innerHTML=ops.join("");
}

function trocarSelecao(v){
  SEL=v; VIEW="";
  if(SEL!==INST) COMP=JSON.parse(JSON.stringify(D.cursos[SEL]||{}));
  render();
}

/* o menu da lateral obedece à seleção: institucional tem as três entradas da
   gestão; um curso tem os dois painéis dele */
function itensDoMenu(){
  if(SEL===INST) return [["reitoria","🏛 Reitoria"],["cursos","📚 Cursos"],["acessos","👥 Usuários e acessos"],
    ["relatorios","📄 Acessos aos relatórios"]];
  return [["dados","📌 Dados do curso"],["membros","🧑‍🏫 NDE e Colegiado"]];
}

function render(){
  const itens=itensDoMenu();
  if(!VIEW || !itens.some(([k])=>k===VIEW)) VIEW=itens[0][0];
  $("menu-lab").textContent = SEL===INST ? "INSTITUCIONAL" : "PAINEL DO CURSO";
  $("menu").innerHTML=itens.map(([k,r])=>`<button class="side-item ${VIEW===k?"on":""}"
    onclick="VIEW='${k}';render()">${r}</button>`).join("");
  const rotulo=itens.find(([k])=>k===VIEW)[1].replace(/^\S+\s/,"");
  $("crumb").textContent=(SEL===INST?"Institucional":nomeCurso(SEL))+" · "+rotulo;
  $("app").innerHTML =
    VIEW==="reitoria"?vReitoria() :
    VIEW==="cursos"?vCursos() :
    VIEW==="acessos"?vAcessos() :
    VIEW==="relatorios"?vRelatorios() :
    VIEW==="membros"?vMembros() : vDados();
}

/* ========================= curso · dados ================================ */
function pessoaCampos(chave,rotulo,trava){
  const p=COMP[chave]||{};
  return `<div class="card">
    <div class="card-t">${esc(rotulo)}</div>
    ${trava?'<div class="card-s">Quem nomeia o coordenador do curso é o gestor geral (e a PROAC, pela coordenação do módulo Atividades Curriculares) — a coordenação edita o restante do painel.</div>':""}
    <div class="duo">
      <div><label>Nome completo</label>
        <input id="${chave}-nome" value="${esc(p.nome||"")}" ${trava?"disabled":""} placeholder="Nome como consta nos documentos"></div>
      <div><label>E-mail (o vínculo com a conta e os acessos)</label>
        <input id="${chave}-email" value="${esc(p.email||"")}" ${trava?"disabled":""} placeholder="nome@uniego.edu.br"></div>
    </div>
  </div>`;
}

function vDados(){
  if(!SEL) return '<div class="card muted">Nenhum curso sob a sua coordenação.</div>';
  const quando = COMP.atualizadoEm
    ? `<div class="muted" style="font-size:12.3px">Última gravação: ${new Date(COMP.atualizadoEm).toLocaleString("pt-BR")}${COMP.por?` por ${esc(COMP.por)}`:""}</div>` : "";
  return `<div class="banner ba-info"><b>${esc(nomeCurso(SEL))}</b> — o retrato institucional do curso.
      A dupla coordenador + pedagógico passa, no mesmo ato da gravação, a validar as aulas práticas e a
      extensão curricular do ARCHÉ AC, a alcançar a monitoria do curso e a Avaliação Institucional dele.
      É aqui que a coordenação se nomeia — a guia que existia no ARCHÉ AC aponta para cá.</div>
    ${pessoaCampos("coordenador","Coordenador(a) do curso",!D.editaTodos)}
    ${pessoaCampos("pedagogico","Coordenador(a) pedagógico(a)",false)}
    <div class="card">
      <div id="p-msg"></div>
      <button class="bt bt-pri" onclick="salvarCurso('dados')">💾 Salvar os dados do curso</button>
      ${quando}
    </div>`;
}

/* ====================== curso · NDE e Colegiado ========================= */
function listaCampos(chave,rotulo,sub){
  const lista=COMP[chave]||[];
  return `<div class="card">
    <div class="card-t">${esc(rotulo)} (${lista.length})</div>
    <div class="card-s">${esc(sub)}</div>
    <div id="${chave}-linhas">${lista.map((p)=>linhaMembro(chave,p)).join("")}</div>
    <button class="bt bt-xs" onclick="addMembro('${chave}')">＋ Incluir membro</button>
  </div>`;
}
function linhaMembro(chave,p={}){
  return `<div class="linha" data-l="${chave}">
    <input data-c="nome" value="${esc(p.nome||"")}" placeholder="Nome completo">
    <input data-c="email" value="${esc(p.email||"")}" placeholder="E-mail (opcional)">
    <button class="bt bt-err bt-xs" title="Remover" onclick="this.parentNode.remove()">✕</button>
  </div>`;
}
function addMembro(chave){ $(chave+"-linhas").insertAdjacentHTML("beforeend",linhaMembro(chave)); }

function vMembros(){
  return `<div class="banner ba-info"><b>${esc(nomeCurso(SEL))}</b> — a composição do NDE e do
      Colegiado é o retrato institucional; a presença nas atas continua digitada a cada sessão,
      como sempre.</div>
    ${listaCampos("nde","NDE — Núcleo Docente Estruturante","Os docentes que compõem o NDE do curso.")}
    ${listaCampos("colegiado","Colegiado do curso","Docentes e representantes que compõem o Colegiado.")}
    <div class="card">
      <div id="p-msg"></div>
      <button class="bt bt-pri" onclick="salvarCurso('membros')">💾 Salvar NDE e Colegiado</button>
    </div>`;
}

function lerLista(chave){
  return [...document.querySelectorAll(`.linha[data-l="${chave}"]`)].map(l=>({
    nome:l.querySelector('[data-c="nome"]').value.trim(),
    email:l.querySelector('[data-c="email"]').value.trim(),
  })).filter(p=>p.nome);
}

/* salvar manda SÓ a parte que a guia editou: o servidor mescla com o que está
   gravado (campo ausente = "não mexi"). Mandar a composição inteira, como
   antes, fazia uma aba aberta antes de o NDE ser incluído apagá-lo ao salvar
   os dados do curso — o retrato velho da aba vencia o registro. */
async function salvarCurso(deOnde){
  let parte;
  if(deOnde==="dados"){
    COMP.coordenador={nome:($("coordenador-nome")||{}).value||COMP.coordenador?.nome||"",
      email:($("coordenador-email")||{}).value||COMP.coordenador?.email||""};
    COMP.pedagogico={nome:$("pedagogico-nome").value,email:$("pedagogico-email").value};
    parte={coordenador:COMP.coordenador,pedagogico:COMP.pedagogico};
  }else{
    COMP.nde=lerLista("nde"); COMP.colegiado=lerLista("colegiado");
    parte={nde:COMP.nde,colegiado:COMP.colegiado};
  }
  const r=await fetch("/api/curso/"+encodeURIComponent(SEL),{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(parte)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ $("p-msg").innerHTML=`<div class="banner ba-err">${esc(j.error||"Não foi possível gravar.")}</div>`; return; }
  D.cursos[SEL]=j.composicao; COMP=JSON.parse(JSON.stringify(j.composicao));
  render();
  $("p-msg").innerHTML='<div class="banner ba-ok">Gravado — e os acessos da coordenação já acompanham.</div>';
}

/* ==================== institucional · Reitoria ========================== */
function vReitoria(){
  const re=D.reitoria||{fixos:{},outros:[]};
  return `<div class="banner ba-info">O registro de quem ocupa os cargos da reitoria e das
      pró-reitorias, mais os coordenadores institucionais. O <b>acesso</b> (gestor geral,
      coordenações de módulo) se concede logo abaixo, na mesma tela — e as assinaturas dos
      documentos continuam no <a href="/assinaturas/">banco de assinaturas</a>.</div>
  <div class="card">
    <div class="card-t">Cargos da reitoria</div>
    <div class="card-s">Nome e e-mail de quem ocupa cada cargo hoje.</div>
    ${(D.cargosReitoria||[]).map(c=>{
      const p=re.fixos?.[c.chave]||{};
      return `<div class="duo" style="margin-bottom:10px">
        <div><label>${esc(c.cargo)}</label>
          <input data-rf="${c.chave}" data-c="nome" value="${esc(p.nome||"")}" placeholder="Nome completo"></div>
        <div><label>E-mail</label>
          <input data-rf="${c.chave}" data-c="email" value="${esc(p.email||"")}" placeholder="nome@uniego.edu.br"></div>
      </div>`;}).join("")}
    <div class="card-t" style="margin-top:14px">Coordenadores institucionais e outros cargos</div>
    <div class="card-s">Coordenações da PROPPEX e da PROAC, secretarias e o que mais a gestão registrar.</div>
    <div id="re-outros">${(re.outros||[]).map(linhaCargo).join("")}</div>
    <button class="bt bt-xs" onclick="addCargo()">＋ Incluir cargo</button>
    <div id="re-msg"></div>
    <div style="margin-top:12px"><button class="bt bt-pri" onclick="salvarReitoria()">💾 Salvar a Reitoria</button>
    ${re.atualizadoEm?`<div class="muted" style="font-size:12.3px">Última gravação: ${new Date(re.atualizadoEm).toLocaleString("pt-BR")}</div>`:""}</div>
  </div>
  ${cardAcessosGestao()}`;
}
function linhaCargo(p={}){
  return `<div class="trio" data-l="cargo">
    <input data-c="cargo" value="${esc(p.cargo||"")}" placeholder="Cargo (ex.: Coordenação de Extensão)">
    <input data-c="nome" value="${esc(p.nome||"")}" placeholder="Nome completo">
    <input data-c="email" value="${esc(p.email||"")}" placeholder="E-mail">
    <button class="bt bt-err bt-xs" title="Remover" onclick="this.parentNode.remove()">✕</button>
  </div>`;
}
function addCargo(){ $("re-outros").insertAdjacentHTML("beforeend",linhaCargo()); }

async function salvarReitoria(){
  const fixos={};
  document.querySelectorAll("[data-rf]").forEach(el=>{
    const k=el.getAttribute("data-rf"); fixos[k]=fixos[k]||{};
    fixos[k][el.getAttribute("data-c")]=el.value.trim();
  });
  const outros=[...document.querySelectorAll('.trio[data-l="cargo"]')].map(l=>({
    cargo:l.querySelector('[data-c="cargo"]').value.trim(),
    nome:l.querySelector('[data-c="nome"]').value.trim(),
    email:l.querySelector('[data-c="email"]').value.trim(),
  })).filter(x=>x.cargo&&x.nome);
  const r=await fetch("/api/instituicao/reitoria",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({fixos,outros})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ $("re-msg").innerHTML=`<div class="banner ba-err">${esc(j.error||"Não foi possível gravar.")}</div>`; return; }
  D.reitoria=j.reitoria; render();
  $("re-msg").innerHTML='<div class="banner ba-ok">Reitoria gravada.</div>';
}

/* ------ os ACESSOS da gestão, na mesma tela (rotas do /api/usuarios) ----- */
let ACESSOS=null;
function cardAcessosGestao(){
  if(!ACESSOS){
    fetch("/api/usuarios").then(r=>r.ok?r.json():null).then(j=>{ if(j){ ACESSOS=j; if(VIEW==="reitoria")render(); } }).catch(()=>{});
    return '<div class="card muted">Carregando os acessos…</div>';
  }
  const coordenacoes=Object.entries(ACESSOS.coordenadores||{});
  return `<div class="card">
    <div class="card-t">Gestores gerais</div>
    <div class="card-s">Veem e decidem tudo, em todos os módulos. As duas contas da pró-reitoria são
      fixas; promover é ato que não expira — para reverter, use "voltar a submissor".</div>
    ${(ACESSOS.gestores||[]).map(e=>`<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
      <span style="flex:1">${esc(e)}</span><span class="selo s-gestor">gestor geral</span>
      <button class="bt bt-xs" onclick="acaoAcesso('aprovar','${esc(e)}','Voltar ${esc(e)} a submissor comum?')">↓ voltar a submissor</button>
    </div>`).join("")||'<div class="muted">Só as contas fixas.</div>'}
    <div class="duo" style="margin-top:10px">
      <div><label>Promover a gestor geral</label><input id="ac-gestor" placeholder="e-mail da conta"></div>
      <div style="align-self:end"><button class="bt" onclick="acaoAcesso('promover',$('ac-gestor').value,'Promover a GESTOR GERAL? A conta passa a ver e decidir tudo.')">★ Promover</button></div>
    </div>
  </div>
  <div class="card">
    <div class="card-t">Coordenações de módulo (${coordenacoes.length})</div>
    <div class="card-s">Dentro do módulo marcado, o alcance é o da PROPPEX; fora dele, a pessoa é
      submissora comum.</div>
    ${coordenacoes.map(([e,mods])=>`<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
      <span style="flex:1;min-width:200px">${esc(e)}</span>
      <span class="muted" style="font-size:12px">${(mods||[]).map(esc).join(" · ")}</span>
      <button class="bt bt-xs" onclick="acaoAcesso('aprovar','${esc(e)}','Tirar a coordenação de ${esc(e)}? A conta volta a submissora.')">✕ tirar coordenação</button>
    </div>`).join("")||'<div class="muted">Nenhuma designada.</div>'}
    <div style="margin-top:10px">
      <label>Designar coordenação</label>
      <div class="duo"><input id="ac-coord" placeholder="e-mail da conta">
        <button class="bt" onclick="designarCoordenacao()">✓ Designar nos módulos marcados</button></div>
      <div class="chips" style="margin-top:8px">${(D.modulos||[]).map(m=>`<label>
        <input type="checkbox" value="${esc(m)}" name="ac-mods">${esc(m)}</label>`).join("")}</div>
    </div>
    <div id="ac-msg"></div>
  </div>`;
}
async function acaoAcesso(acao,email,confirmacao){
  email=String(email||"").trim().toLowerCase();
  if(!email){ alert("Informe o e-mail."); return; }
  if(confirmacao && !confirm(confirmacao)) return;
  const r=await fetch("/api/usuarios",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({acao,email})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Falhou."); return; }
  ACESSOS=j; render();
}
async function designarCoordenacao(){
  const email=$("ac-coord").value.trim().toLowerCase();
  const mods=[...document.querySelectorAll('input[name="ac-mods"]:checked')].map(i=>i.value);
  if(!email||!mods.length){ alert("Informe o e-mail e marque ao menos um módulo."); return; }
  const r=await fetch("/api/usuarios",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({acao:"coordenar",email,modulos:mods})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||"Falhou."); return; }
  ACESSOS=j; render();
}

    <div class="card-t">Cursos da instituição</div>
    <div class="card-s">O catálogo que alimenta TODOS os módulos. Curso não se apaga — há atas, ações
      e projetos gravados com ele: <b>desativar</b> o tira dos formulários novos e o histórico
      continua legível.</div>
    <div id="c-msg"></div>
    <table class="tabela"><tr><th>Curso</th><th>Sigla</th><th>Coordenação</th><th>Pedagógico(a)</th><th>Situação</th><th></th></tr>
      ${D.catalogo.map(c=>{
        const comp=D.cursos[c.slug]||{};
        return `<tr>
        <td>${esc(c.nome)}${c.extra?' <span class="muted" style="font-size:11.5px">(incluído pela gestão)</span>':""}</td>
        <td>${esc(c.sigla||"")}</td>
        <td class="muted" style="font-size:12.3px">${esc(comp.coordenador?.nome||"—")}</td>
        <td class="muted" style="font-size:12.3px">${comp.pedagogico?.nome?esc(comp.pedagogico.nome):'<span style="color:var(--warn)">sem pedagógico</span>'}</td>
        <td><span class="selo ${c.ativo?"s-on":"s-off"}">${c.ativo?"ativo":"desativado"}</span></td>
        <td style="white-space:nowrap">
          <button class="bt bt-xs" onclick="trocarSelecao('${esc(c.slug)}')">abrir painel</button>
          <button class="bt bt-xs ${c.ativo?"bt-err":""}" onclick="mudarAtivo('${esc(c.slug)}',${c.ativo?"false":"true"})">
          ${c.ativo?"desativar":"reativar"}</button></td>
      </tr>`;}).join("")}
    </table>
  </div>
  <div class="card">
    <div class="card-t">Incluir curso</div>
    <div class="card-s">Ele entra no catálogo de todos os módulos no mesmo instante — e, nomeando a
      dupla aqui, o coordenador e o pedagógico já ganham o painel do curso e a validação das aulas
      práticas.</div>
    <div class="duo">
      <div><label>Nome do curso</label><input id="novo-nome" placeholder="Ex.: Ciências Biológicas"></div>
      <div><label>Sigla (até 4 letras — opcional)</label><input id="novo-sigla" maxlength="4" placeholder="CBI"></div>
    </div>
    <div class="duo" style="margin-top:10px">
      <div><label>Coordenador(a) do curso — nome</label><input id="novo-co-nome" placeholder="Nome completo"></div>
      <div><label>Coordenador(a) — e-mail</label><input id="novo-co-email" placeholder="nome@uniego.edu.br"></div>
    </div>
    <div class="duo" style="margin-top:10px">
      <div><label>Coordenador(a) pedagógico(a) — nome</label><input id="novo-pe-nome" placeholder="Nome completo"></div>
      <div><label>Pedagógico(a) — e-mail</label><input id="novo-pe-email" placeholder="nome@uniego.edu.br"></div>
    </div>
    <div style="margin-top:10px"><button class="bt bt-pri" onclick="incluirCurso()">＋ Incluir no catálogo</button></div>
  </div>`;
}
async function incluirCurso(){
  const r=await fetch("/api/cursos",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nome:$("novo-nome").value,sigla:$("novo-sigla").value,
      coordenador:{nome:$("novo-co-nome").value,email:$("novo-co-email").value},
      pedagogico:{nome:$("novo-pe-nome").value,email:$("novo-pe-email").value}})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ $("c-msg").innerHTML=`<div class="banner ba-err">${esc(j.error||"Falhou.")}</div>`; return; }
  await carregar(); SEL=INST; VIEW="cursos"; render();
  $("c-msg").innerHTML=`<div class="banner ba-ok">Curso incluído: ${esc(j.nome)} (${esc(j.sigla)}).</div>`;
}
async function mudarAtivo(slug,ativo){
  const c=D.catalogo.find(x=>x.slug===slug);
  if(ativo==="false"||ativo===false){
    if(!confirm(`Desativar ${c.nome}?\n\nEle sai dos formulários novos de todos os módulos; tudo o que já foi gravado continua legível. Dá para reativar quando quiser.`))return;
  }
  const r=await fetch("/api/cursos/"+encodeURIComponent(slug)+"/ativo",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({ativo:ativo===true||ativo==="true"})});
  if(!r.ok){ const j=await r.json().catch(()=>({})); alert(j.error||"Falhou."); return; }
  await carregar(); SEL=INST; VIEW="cursos"; render();
}

/* ================ institucional · Acessos aos relatórios ================
   Veio da guia "Acessos às guias" do ARCHÉ RE (pedido do dono, set/2026:
   concentrar aqui o que é administrativo). Duas dimensões — QUAIS guias e DE
   QUE CURSOS —, e o painel mostra ao lado o que a pessoa JÁ alcança pelas
   regras automáticas (coordenação de módulo e de curso), senão o gestor
   concederia de novo o que ela tem, ou tiraria daqui um acesso que não vem
   daqui e continuaria valendo. As rotas continuam as do módulo de Relatórios. */
let REL=null, REL_BUSCA="", REL_FILTRO="acesso", REL_EDIT=null, REL_MSG="";
const REL_PAG="sc-rel-acessos";
function carregarRel(){
  REL=null;
  return fetch("/api/relatorios/acessos").then(r=>r.json().then(j=>({ok:r.ok,j})))
    .then(({ok,j})=>{ REL = ok ? j : {erro:j.error||"Falha"}; })
    .catch(e=>{ REL={erro:e.message}; })
    .then(()=>{ if(VIEW==="relatorios") render(); });
}
/* LISTA → FICHA (revisão do dono, set/2026: "uma lista com os usuários, e ao
   clicar no usuário abrir uma página com edição dos setores" — os cartões
   abertos, um por pessoa com todas as etiquetas, não estavam legais). A lista
   é uma linha por pessoa, paginada como toda lista do portal, com busca e um
   filtro de quem mostrar; a ficha é onde se marca. */
function vRelatorios(){
  if(!REL){ carregarRel(); return '<div class="card muted">Carregando os acessos…</div>'; }
  if(REL.erro) return `<div class="banner ba-err">${esc(REL.erro)}</div>`;
  if(REL_EDIT){
    const p=REL.pessoas.find(x=>x.email===REL_EDIT);
    if(p) return fichaRel(p);
    REL_EDIT=null;
  }
  queueMicrotask(desenharListaRel);
  return `<div class="card">
      <div class="card-t">Quem abre qual guia do Relatório Semestral</div>
      <div class="card-s">O alcance se soma de três lugares: o <b>gestor geral</b> abre tudo; quem
        <b>coordena um módulo</b> abre a guia do setor dele, sem recorte; quem <b>coordena um curso</b>
        abre todas as guias, só do curso dele. O que faltar se concede na ficha da pessoa — clique
        na linha. Conceder aqui não dá acesso ao SETOR, só ao relatório dele.</div>
      ${REL_MSG?`<div class="banner ba-ok">${esc(REL_MSG)}</div>`:""}
      <div class="duo" style="margin-top:8px">
        <div><label>Procurar pessoa</label>
          <input id="rel-busca" value="${esc(REL_BUSCA)}" placeholder="nome ou e-mail"
            oninput="REL_BUSCA=this.value;ArchePag.zerar(REL_PAG);desenharListaRel()"></div>
        <div><label>Mostrar</label>
          <select onchange="REL_FILTRO=this.value;ArchePag.zerar(REL_PAG);desenharListaRel()">
            <option value="acesso" ${REL_FILTRO==="acesso"?"selected":""}>quem abre alguma guia</option>
            <option value="manual" ${REL_FILTRO==="manual"?"selected":""}>só quem tem concessão manual</option>
            <option value="todos" ${REL_FILTRO==="todos"?"selected":""}>todas as contas do portal</option>
          </select></div>
      </div>
    </div>
    <div id="rel-lista"></div>`;
}
function resumoRel(p){
  const partes=[];
  if(p.papel==="gestor") partes.push('<span class="selo s-gestor">gestor geral</span>');
  if(p.modulos?.length) partes.push(`<span class="muted">módulo${p.modulos.length>1?"s":""}: ${esc(p.modulos.join(", "))}</span>`);
  if(p.cursosCoordenados?.length) partes.push(`<span class="muted">coordena ${esc(p.cursosCoordenados.map(c=>c.nome).join(", "))}</span>`);
  if(p.concedido) partes.push('<span class="selo s-on">concessão manual</span>');
  return partes.join(" · ");
}
function desenharListaRel(){
  const alvo=$("rel-lista"); if(!alvo||!REL||REL.erro) return;
  const b=REL_BUSCA.trim().toLowerCase();
  let lista=REL.pessoas.filter(p=>!b||`${p.nome} ${p.email}`.toLowerCase().includes(b));
  if(REL_FILTRO==="acesso") lista=lista.filter(p=>p.alcance.length>0);
  if(REL_FILTRO==="manual") lista=lista.filter(p=>p.concedido);
  const pg=ArchePag.recorte(REL_PAG,lista,desenharListaRel);
  alvo.innerHTML=`<div class="card" style="padding:8px 10px">
    ${pg.barra}
    ${pg.itens.length?pg.itens.map(p=>`<button class="rel-linha" onclick="REL_EDIT='${esc(p.email)}';render()">
      <div class="rl-quem"><b>${esc(p.nome||p.email)}</b><span class="muted">${esc(p.email)}</span></div>
      <div class="rl-res">${resumoRel(p)}</div>
      <div class="rl-n">${p.alcance.length?`${p.alcance.length} guia${p.alcance.length>1?"s":""}`:'<span class="muted">nenhuma</span>'} ›</div>
    </button>`).join("")
    :`<div class="muted" style="padding:10px 6px">${b?"Ninguém com esse nome.":"Ninguém neste recorte."}</div>`}
  </div>`;
}
function fichaRel(p){
  const marcado=new Set((p.concedido?.setores)||[]);
  const cursosM=new Set((p.concedido?.cursos)||[]);
  const rotCursos=(cs)=>(cs===null?"todos os cursos":cs.map(c=>(REL.cursos.find(x=>x.slug===c)?.nome||c)).join(", "));
  const caixa=(attr,v,on,txt)=>`<label class="rel-caixa"><input type="checkbox" ${attr}="${esc(v)}" ${on?"checked":""}> ${esc(txt)}</label>`;
  const semAuto=p.papel!=="gestor"&&!p.modulos?.length&&!p.cursosCoordenados?.length;
  return `<div style="margin-bottom:10px"><button class="bt bt-xs" onclick="REL_EDIT=null;render()">← Voltar à lista</button></div>
    <div class="card">
      <div class="card-t">${esc(p.nome||p.email)}</div>
      <div class="card-s">${esc(p.email)}</div>
      <div class="card-s" style="margin-top:6px">
        ${p.papel==="gestor"?"<b>Gestor geral</b> — abre todas as guias, sem recorte. ":""}
        ${p.modulos?.length?`Coordena o(s) módulo(s) <b>${esc(p.modulos.join(", "))}</b>. `:""}
        ${p.cursosCoordenados?.length?`Coordena o(s) curso(s) <b>${esc(p.cursosCoordenados.map(c=>c.nome).join(", "))}</b>. `:""}
        ${semAuto?"Sem alcance automático — o que tiver vem da concessão abaixo. ":""}
      </div>
      <label style="margin-top:8px">O que já alcança hoje</label>
      <div>${p.alcance.length?p.alcance.map(a=>`<span class="selo s-on" style="margin:0 6px 6px 0;display:inline-block">
        ${esc(a.nome)} <span style="opacity:.75">· ${esc(rotCursos(a.cursos))}</span></span>`).join("")
        :'<span class="muted">Nenhuma guia.</span>'}</div>
    </div>
    ${p.papel==="gestor"?'<div class="card muted">Gestor geral já abre tudo — não há o que conceder.</div>':`
    <div class="card">
      <div class="card-t">Concessão manual</div>
      <div class="card-s">Marque as guias e, se for o caso, os cursos a que ela fica restrita. O que vem da
        coordenação de módulo ou de curso não se tira daqui — continua valendo.</div>
      <label>Guias</label>
      <div class="rel-caixas">${REL.setores.map(s=>caixa("data-set",s.chave,marcado.has(s.chave),s.nome)).join("")}</div>
      <label style="margin-top:12px">Recorte por curso <span class="muted" style="text-transform:none;letter-spacing:0">— nenhum marcado = todos os cursos</span></label>
      <div class="rel-caixas">${REL.cursos.map(c=>caixa("data-curso",c.slug,cursosM.has(c.slug),c.nome)).join("")}</div>
      <div id="rel-msg"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <button class="bt bt-pri" onclick="salvarRel('${esc(p.email)}')">💾 Salvar a concessão</button>
        ${p.concedido?`<button class="bt bt-err" onclick="gravarRel('${esc(p.email)}',[],[])">Retirar a concessão</button>`:""}
        <button class="bt" onclick="REL_EDIT=null;render()">Cancelar</button>
      </div>
    </div>`}`;
}
function salvarRel(email){
  const setores=[...document.querySelectorAll("[data-set]")].filter(i=>i.checked).map(i=>i.dataset.set);
  const cursos=[...document.querySelectorAll("[data-curso]")].filter(i=>i.checked).map(i=>i.dataset.curso);
  if(!setores.length){ $("rel-msg").innerHTML='<div class="banner ba-err">Marque ao menos uma guia — ou use "Retirar a concessão".</div>'; return; }
  gravarRel(email,setores,cursos);
}
async function gravarRel(email,setores,cursos){
  if(!setores.length && !confirm("Retirar a concessão desta pessoa? Ela mantém o que vier da coordenação de módulo ou de curso.")) return;
  const r=await fetch("/api/relatorios/acessos",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email,setores,cursos})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const m=$("rel-msg"); if(m) m.innerHTML=`<div class="banner ba-err">${esc(j.error||"Não foi possível gravar.")}</div>`; else alert(j.error||"Não foi possível gravar."); return; }
  const p=REL.pessoas.find(x=>x.email===email);
  REL_MSG=setores.length?`Concessão gravada para ${p?.nome||email}.`:`Concessão de ${p?.nome||email} retirada.`;
  REL_EDIT=null;
  await carregarRel();
  setTimeout(()=>{ REL_MSG=""; },0);
}

carregar();
</script>
<script src="/assets/arche-paginacao.js"></script>
<script src="/assets/arche-nav.js"></script>
