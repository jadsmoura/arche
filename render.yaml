# Blueprint de deploy do ARCHÉ no Render (https://render.com)
# Um serviço web Node. Os segredos (Client Secret e Refresh Token do Google
# Drive) NÃO ficam aqui — são preenchidos no painel do Render (sync: false).
services:
  - type: web
    name: arche
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GDRIVE_FOLDER_NAME
        value: ARCHÉ
      - key: GDRIVE_FOLDER_ID
        value: 1h7wLsriozGDAz3pj3Rh8mu5iPl0MT4es
      - key: STATE_BACKEND
        value: drive
      - key: NOTIFY_EMAIL
        value: extensao@uniego.edu.br
      - key: TZ
        value: America/Sao_Paulo
      # Cobrança automática do relatório final (D+1 do fim do evento).
      # Já nasce ligada; para congelar sem novo deploy, troque para "false".
      - key: COBRANCA_ATIVA
        value: "true"
      - key: COBRANCA_JANELA_DIAS
        value: "30"
      - key: COBRANCA_MAX_EMAILS
        value: "10"
      # Token do gatilho externo opcional (cron). Gerado pelo Render.
      - key: COBRANCA_TOKEN
        generateValue: true
      # ARCHÉ AT — Atas e Colegiados.
      # ATA_IA: "modelo" (padrão, custo zero), "gemini" ou "anthropic".
      # Basta colar GEMINI_API_KEY no painel do Render e trocar para "gemini":
      # o adaptador percorre os modelos Flash da camada gratuita e usa o
      # primeiro que responder (GEMINI_MODELO força um específico).
      - key: ATA_IA
        value: modelo
      # Primeiro dia em que a instituição já era UNIEGO: publicação da
      # Portaria MEC nº 623, de 5 de setembro de 2025, que a credenciou por
      # transformação da FACEG. Atas com sessão anterior saem com o timbre da
      # FACEG.
      - key: MARCA_UNIEGO_DESDE
        value: "2025-09-05"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GDRIVE_OAUTH_CLIENT_ID
        sync: false
      - key: GDRIVE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GDRIVE_OAUTH_REFRESH_TOKEN
        sync: false
